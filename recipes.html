        function updatePhotoFitFromControls() {
            state.photoFit = {
                scale: safeNumber(els.photoScale.value, 100) / 100,
                x: safeNumber(state.photoFit.x, 0),
                y: safeNumber(state.photoFit.y, 0)
            };
            updatePhotoPreview();
        }

        function collectDraft() {
            return {
                title: els.recipeTitle.value.trim(),
                category: state.categoryValue || 'other',
                time: safeNumber(els.recipeTime.value),
                portions: safeNumber(els.recipePortions.value),
                difficulty: state.difficultyValue || 'Просто',
                description: els.recipeDescription.value.trim(),
                ingredients: getIngredientsFromForm(),
                steps: getStepsFromForm(),
                imageUrl: state.photoPreview,
                photoFit: { ...state.photoFit }
            };
        }

        function validateForm() {
            if (!els.recipeTitle.checkValidity()) {
                els.recipeTitle.reportValidity();
                return false;
            }
            if (!els.recipeTime.checkValidity()) {
                els.recipeTime.reportValidity();
                return false;
            }
            if (!els.recipePortions.checkValidity()) {
                els.recipePortions.reportValidity();
                return false;
            }
            if (!getIngredientsFromForm().length) {
                setFormStatus('Добавьте хотя бы один ингредиент.', 'error');
                return false;
            }
            if (!getStepsFromForm().some((step) => step.text)) {
                setFormStatus('Добавьте хотя бы один шаг с описанием.', 'error');
                return false;
            }
            setFormStatus('');
            return true;
        }

        function resetForm() {
            els.recipeForm.reset();
            state.editingRecipeId = '';
            state.categoryValue = state.activeCategory !== 'all' ? state.activeCategory : 'salads';
            state.difficultyValue = 'Просто';
            state.photoFile = null;
            state.photoPreview = '';
            state.photoFit = { ...defaultPhotoFit };
            els.ingredientsList.replaceChildren();
            els.stepsList.replaceChildren();
            addIngredientRow();
            addStepRow({ title: 'Подготовка' });
            renderSelects();
            updatePhotoPreview();
            bindAutoGrow(els.recipeDescription);
            autoGrowTextarea(els.recipeDescription);
            els.submitRecipeBtn.textContent = 'Опубликовать';
            setFormStatus('');
        }

        function openComposer({ focus = false, scroll = false } = {}) {
            state.composerOpen = true;
            els.composer.classList.add('open');
            els.composerToggleBtn.textContent = 'Свернуть форму';
            requestAnimationFrame(() => {
                if (scroll) {
                    const toolbarHeight = document.querySelector('.toolbar')?.getBoundingClientRect().height || 0;
                    const offset = window.matchMedia('(max-width: 720px)').matches ? toolbarHeight + 14 : 8;
                    const top = Math.max(0, els.composer.getBoundingClientRect().top + window.pageYOffset - offset);
                    window.scrollTo({ top, behavior: 'smooth' });
                    setTimeout(() => window.scrollTo({ top, behavior: 'auto' }), 260);
                }
                if (focus) {
                    const delay = scroll ? 300 : 0;
                    setTimeout(() => els.recipeTitle.focus({ preventScroll: true }), delay);
                }
            });
        }

        function closeComposer() {
            state.composerOpen = false;
            els.composer.classList.remove('open');
            els.composerToggleBtn.textContent = '＋ Добавить рецепт';
        }

        function loadRecipeIntoForm(recipe) {
            if (!recipe || !canManageRecipe(recipe)) return;
            state.editingRecipeId = recipe.id;
            els.recipeTitle.value = recipe.title || '';
            state.categoryValue = recipe.category || 'other';
            els.recipeTime.value = recipe.time || '';
            els.recipePortions.value = recipe.portions || '';
            state.difficultyValue = recipe.difficulty || 'Просто';
            els.recipeDescription.value = recipe.description || '';
            els.ingredientsList.replaceChildren();
            const ingredients = recipeIngredients(recipe);
            (ingredients.length ? ingredients : [{}]).forEach((item) => addIngredientRow(item));
            els.stepsList.replaceChildren();
            const steps = recipeSteps(recipe);
            (steps.length ? steps : [{ title: 'Подготовка' }]).forEach((item) => addStepRow(item));
            state.photoFile = null;
            state.photoPreview = String(recipe.imageUrl || '');
            state.photoFit = { ...(recipe.photoFit || defaultPhotoFit) };
            els.recipePhoto.value = '';
            renderSelects();
            updatePhotoPreview();
            bindAutoGrow(els.recipeDescription);
            autoGrowTextarea(els.recipeDescription);
            els.submitRecipeBtn.textContent = 'Сохранить';
            setFormStatus('');
            openComposer({ focus: true, scroll: true });
        }

        function getPostimagesProxyEndpoint() {
            if (typeof window.POSTIMAGES_PROXY_ENDPOINT === 'string' && window.POSTIMAGES_PROXY_ENDPOINT.trim()) {
                return window.POSTIMAGES_PROXY_ENDPOINT.trim();
            }
            return POSTIMAGES_PROXY_ENDPOINT;
        }

        function loadImageFromFile(file) {
            return new Promise((resolve, reject) => {
                const objectUrl = URL.createObjectURL(file);
                const image = new Image();
                image.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    resolve(image);
                };
                image.onerror = (error) => {
                    URL.revokeObjectURL(objectUrl);
                    reject(error);
                };
                image.src = objectUrl;
            });
        }

        async function preparePhotoBlob(file) {
            if (!(file instanceof Blob)) throw new Error('photo_invalid');
            if (!/^image\//i.test(file.type || '')) throw new Error('photo_type_invalid');
            const image = await loadImageFromFile(file);
            const width = image.naturalWidth || image.width || 0;
            const height = image.naturalHeight || image.height || 0;
            if (!width || !height) return file;
            const scale = Math.min(1, MAX_UPLOAD_DIMENSION / Math.max(width, height));
            const shouldResize = scale < 0.999;
            const shouldCompress = file.size > MAX_PHOTO_BYTES || file.type === 'image/png';
            if (!shouldResize && !shouldCompress) return file;
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(width * scale));
            canvas.height = Math.max(1, Math.round(height * scale));
            const ctx = canvas.getContext('2d');
            if (!ctx) return file;
            ctx.fillStyle = '#14100a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
            return new Promise((resolve, reject) => {
                canvas.toBlob((blob) => {
                    if (blob) {
                        resolve(blob);
                        return;
                    }
                    reject(new Error('photo_compress_failed'));
                }, 'image/jpeg', 0.88);
            });
        }

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result || ''));
                reader.onerror = () => reject(reader.error || new Error('photo_read_failed'));
                reader.readAsDataURL(blob);
            });
        }

        async function uploadToPostimages(file, fileName = 'recipe-photo.jpg') {
            if (!file) return '';
            const formData = new FormData();
            formData.append('key', POSTIMAGES_API_KEY);
            formData.append('image', file, fileName);
            const response = await fetch(getPostimagesProxyEndpoint(), { method: 'POST', body: formData });
            if (!response.ok) throw new Error('postimages_failed');
            const rawText = await response.text();
            let payload = null;
            try { payload = JSON.parse(rawText); } catch (_) {}
            const link =
                payload?.url ||
                payload?.data?.[0]?.link ||
                payload?.data?.[0]?.short_link ||
                payload?.data?.[0]?.url ||
                payload?.data?.[0]?.image_url ||
                payload?.data?.url ||
                payload?.data?.link ||
                payload?.data?.display_url ||
                payload?.data?.image?.url ||
                payload?.data?.image?.display_url ||
                payload?.result?.url ||
                payload?.result?.link ||
                payload?.image?.url ||
                payload?.direct_url ||
                payload?.image_url ||
                (typeof rawText === 'string' ? rawText.match(/https?:\/\/[^\s"']+/)?.[0] : '');
            if (!link) throw new Error('postimages_no_url');
            return link;
        }

        function loadLocalRecipes() {
            try {
                const parsed = JSON.parse(localStorage.getItem(LOCAL_RECIPES_KEY) || '[]');
                return Array.isArray(parsed) ? parsed : [];
            } catch (_) {
                return [];
            }
        }

        function mergeRecipes(primary, fallback) {
            const map = new Map();
            [...(fallback || []), ...(primary || [])].forEach((recipe) => {
                if (!recipe || !recipe.id) return;
                map.set(recipe.id, recipe);
            });
            return Array.from(map.values());
        }

        function saveLocalRecipe(recipe) {
            const existing = loadLocalRecipes().filter((item) => item.id !== recipe.id);
            const next = [recipe, ...existing].slice(0, 120);
            localStorage.setItem(LOCAL_RECIPES_KEY, JSON.stringify(next));
        }

        function removeLocalRecipe(recipeId) {
            localStorage.setItem(LOCAL_RECIPES_KEY, JSON.stringify(loadLocalRecipes().filter((item) => item.id !== recipeId)));
        }

        async function submitRecipe(event) {
            event.preventDefault();
            if (!validateForm()) return;
            const isEditing = Boolean(state.editingRecipeId);
            const existingRecipe = isEditing ? getRecipeById(state.editingRecipeId) : null;
            if (isEditing && !canManageRecipe(existingRecipe)) {
                setFormStatus('Редактировать может только автор рецепта.', 'error');
                return;
            }
            els.submitRecipeBtn.disabled = true;
            setFormStatus(isEditing ? 'Сохраняю рецепт...' : 'Публикую рецепт...');
            try {
                const draft = collectDraft();
                let imageUrl = draft.imageUrl || '';
                let imageUploadFailed = false;
                if (state.photoFile) {
                    let preparedPhoto = state.photoFile;
                    try {
                        preparedPhoto = await preparePhotoBlob(state.photoFile);
                        imageUrl = await uploadToPostimages(preparedPhoto, state.photoFile.name || 'recipe-photo.jpg');
                    } catch (uploadError) {
                        imageUploadFailed = true;
                        try {
                            imageUrl = await blobToDataUrl(preparedPhoto);
                        } catch (_) {
                            imageUrl = draft.imageUrl || '';
                        }
                        console.warn('[recipes] image upload failed, using local preview', uploadError);
                    }
                }
                const now = Date.now();
                const authorId = existingRecipe?.authorId || existingRecipe?.authorUsername || currentUserKey();
                const recipe = {
                    ...draft,
                    imageUrl,
                    authorId,
                    authorName: existingRecipe?.authorName || state.currentUser.name || state.currentUser.username || 'Участник',
                    authorUsername: existingRecipe?.authorUsername || state.currentUser.username || authorId || '',
                    authorAvatarUrl: existingRecipe?.authorAvatarUrl || state.currentUser.avatarUrl || '',
                    createdAt: isEditing ? (existingRecipe.createdAt || existingRecipe.createdAtClient || now) : (firebase.database?.ServerValue?.TIMESTAMP || now),
                    createdAtClient: isEditing ? (existingRecipe.createdAtClient || existingRecipe.createdAt || now) : now,
                    updatedAt: firebase.database?.ServerValue?.TIMESTAMP || now
                };
                let savedId = state.editingRecipeId;
                if (state.db) {
                    if (isEditing) {
                        await state.db.ref(`recipes/${state.editingRecipeId}`).update(recipe);
                    } else {
                        const recipeRef = state.db.ref('recipes').push();
                        savedId = recipeRef.key;
                        await recipeRef.set(recipe);
                    }
                } else {
                    savedId = savedId || `local-${now}`;
                    const localRecipe = {
                        ...recipe,
                        id: savedId,
                        createdAt: isEditing ? (recipe.createdAt || now) : now,
                        updatedAt: now
                    };
                    saveLocalRecipe(localRecipe);
                    state.recipes = [localRecipe, ...state.recipes.filter((item) => item.id !== savedId)];
                    renderAll();
                }
                state.activeCategory = recipe.category;
                state.selectedId = savedId || state.selectedId;
                state.detailOpen = true;
                closeComposer();
                resetForm();
                renderAll();
                showToast(imageUploadFailed ? 'Рецепт сохранен, фото показано из предпросмотра' : (isEditing ? 'Рецепт сохранен' : 'Рецепт опубликован'));
            } catch (err) {
                console.warn('[recipes] submit failed', err);
                setFormStatus('Не удалось сохранить рецепт. Проверьте соединение и попробуйте еще раз.', 'error');
            } finally {
                els.submitRecipeBtn.disabled = false;
            }
        }

        function getRecipeById(id) {
            return getDisplayRecipes().find((recipe) => recipe.id === id) || null;
        }

        function openMobileDetail() {
            document.body.classList.add('mobile-detail-open');
            if (els.detailPanel) els.detailPanel.scrollTop = 0;
        }

        function closeMobileDetail() {
            document.body.classList.remove('mobile-detail-open');
        }

        function isMobileDetailMode() {
            return window.matchMedia('(max-width: 720px)').matches;
        }

        function requestDeleteRecipe(recipeId) {
            const recipe = getRecipeById(recipeId);
            if (!recipe || !canManageRecipe(recipe)) return;
            state.pendingDeleteRecipeId = recipeId;
            els.confirmText.textContent = `Рецепт «${recipe.title || 'без названия'}» исчезнет из общего списка. Это действие нельзя отменить.`;
            els.confirmOverlay.classList.add('open');
            els.confirmOverlay.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modal-open');
            els.cancelDeleteBtn.focus();
        }

        function closeDeleteConfirm() {
            state.pendingDeleteRecipeId = '';
            els.confirmOverlay.classList.remove('open');
            els.confirmOverlay.setAttribute('aria-hidden', 'true');
            if (!els.fullscreenOverlay.classList.contains('open')) document.body.classList.remove('modal-open');
        }

        async function confirmDeleteRecipe() {
            const recipeId = state.pendingDeleteRecipeId;
            if (!recipeId) return;
            await deleteRecipe(recipeId);
        }

        async function deleteRecipe(recipeId) {
            const recipe = getRecipeById(recipeId);
            if (!recipe || !canManageRecipe(recipe)) return;
            try {
                if (state.db && !String(recipeId).startsWith('local-')) {
                    await state.db.ref(`recipes/${recipeId}`).remove();
                }
                removeLocalRecipe(recipeId);
                state.recipes = state.recipes.filter((item) => item.id !== recipeId);
                if (state.selectedId === recipeId) {
                    state.selectedId = '';
                    state.detailOpen = false;
                }
                closeDeleteConfirm();
                closeMobileDetail();
                closeFullscreen();
                renderAll();
                showToast('Рецепт удален');
            } catch (err) {
                console.warn('[recipes] delete failed', err);
                showToast('Не удалось удалить рецепт');
            }
        }

        function openFullscreen(recipeId) {
            const recipe = getRecipeById(recipeId);
            if (!recipe) return;
            state.fullscreenRecipeId = recipe.id;
            const cat = categoryMeta(recipe.category);
            const ingredients = recipeIngredients(recipe).map((item) => `<li>${escapeHtml(item.name)}${item.amount ? ` — ${escapeHtml(item.amount)}` : ''}</li>`).join('');
            const steps = recipeSteps(recipe).map((item) => `<li><span class="step-title">${escapeHtml(item.title)}</span>${escapeHtml(item.text)}</li>`).join('');
            const desc = String(recipe.description || '').trim() || 'Автор не добавил короткое описание.';
            els.fullscreenCard.innerHTML = `
                <div class="fullscreen-photo">${photoBlock(recipe)}</div>
                <div class="fullscreen-content">
                    <div class="fullscreen-head">
                        <div>
                            <div class="recipe-meta">
                                <span class="pill">${cat.icon} ${escapeHtml(cat.label)}</span>
                                <span class="pill">⏱ ${safeNumber(recipe.time)} мин</span>
                                <span class="pill">🍽 ${safeNumber(recipe.portions)} порц.</span>
                                <span class="pill">${escapeHtml(recipe.difficulty || 'Просто')}</span>
                            </div>
                            <h2 style="margin-top:14px;">${escapeHtml(recipe.title)}</h2>
                        </div>
                        <div class="fullscreen-actions">
                            ${ownerMenuBlock(recipe)}
                            <button type="button" class="btn icon fullscreen-close-btn" id="closeFullscreenBtn" aria-label="Закрыть">×</button>
                        </div>
                    </div>
                    <div class="fullscreen-fixed">
                        <p class="recipe-desc">${escapeHtml(desc)}</p>
                        <div class="author">
                            <span>Добавил: ${escapeHtml(recipe.authorName || 'Автор')}</span>
                            <span>${formatDate(recipe.createdAt)}</span>
                        </div>
                    </div>
                    <div class="fullscreen-scroll">
                        <div class="fullscreen-section">
                            <h3>Ингредиенты</h3>
                            <ul class="detail-list">${ingredients}</ul>
                        </div>
                        <div class="fullscreen-section">
                            <h3>Приготовление</h3>
                            <ol class="steps-list">${steps}</ol>
                        </div>
                    </div>
                </div>
            `;
            els.fullscreenOverlay.classList.remove('closing');
            els.fullscreenOverlay.classList.add('open');
            els.fullscreenOverlay.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modal-open');
            document.getElementById('closeFullscreenBtn')?.addEventListener('click', closeFullscreen);
        }

        function closeFullscreen() {
            if (!els.fullscreenOverlay.classList.contains('open')) return;
            els.fullscreenOverlay.classList.add('closing');
            setTimeout(() => {
                els.fullscreenOverlay.classList.remove('open', 'closing');
                els.fullscreenOverlay.setAttribute('aria-hidden', 'true');
                els.fullscreenCard.replaceChildren();
                document.body.classList.remove('modal-open');
            }, 190);
        }

        function initFirebase() {
            try {
                if (firebase.database && firebase.database.INTERNAL && typeof firebase.database.INTERNAL.forceLongPolling === 'function') {
                    firebase.database.INTERNAL.forceLongPolling();
                }
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                state.db = firebase.database();
                state.db.ref('recipes').orderByChild('createdAt').on('value', (snapshot) => {
                    const value = snapshot.val() || {};
                    const remoteRecipes = Object.entries(value).map(([id, recipe]) => ({
                        id,
                        ...recipe,
                        createdAt: recipe.createdAt || recipe.createdAtClient || 0
                    }));
                    state.recipes = mergeRecipes(remoteRecipes, loadLocalRecipes());
                    renderAll();
                }, (err) => {
                    console.warn('[recipes] firebase read failed', err);
                    state.db = null;
                    state.recipes = loadLocalRecipes();
                    renderAll();
                });
            } catch (err) {
                console.warn('[recipes] firebase init failed', err);
                state.db = null;
                state.recipes = loadLocalRecipes();
                renderAll();
            }
        }

        function bindPhotoEditor() {
            els.photoViewport.addEventListener('click', (event) => {
                if (state.photoPreview || event.target === els.photoRemoveBtn) return;
                els.recipePhoto.click();
            });
            els.recipePhoto.addEventListener('change', () => handlePhotoFile(els.recipePhoto.files?.[0]));
            els.photoRemoveBtn.addEventListener('click', (event) => {
                event.stopPropagation();
                state.photoFile = null;
                state.photoPreview = '';
                state.photoFit = { ...defaultPhotoFit };
                els.recipePhoto.value = '';
                updatePhotoPreview();
            });
            ['dragenter', 'dragover'].forEach((type) => {
                els.photoViewport.addEventListener(type, (event) => {
                    event.preventDefault();
                    els.photoViewport.classList.add('dragover');
                });
            });
            ['dragleave', 'drop'].forEach((type) => {
                els.photoViewport.addEventListener(type, (event) => {
                    event.preventDefault();
                    els.photoViewport.classList.remove('dragover');
                });
            });
            els.photoViewport.addEventListener('drop', (event) => handlePhotoFile(event.dataTransfer?.files?.[0]));
            els.photoScale.addEventListener('input', updatePhotoFitFromControls);
            els.photoCropImg.addEventListener('pointerdown', (event) => {
                if (!state.photoPreview) return;
                event.preventDefault();
                els.photoCropImg.setPointerCapture(event.pointerId);
                els.photoCropImg.classList.add('dragging');
                state.photoDrag = {
                    startX: event.clientX,
                    startY: event.clientY,
                    x: state.photoFit.x,
                    y: state.photoFit.y
                };
            });
            els.photoCropImg.addEventListener('pointermove', (event) => {
                if (!state.photoDrag) return;
                const rect = els.photoViewport.getBoundingClientRect();
                const dx = ((event.clientX - state.photoDrag.startX) / Math.max(1, rect.width)) * 100;
                const dy = ((event.clientY - state.photoDrag.startY) / Math.max(1, rect.height)) * 100;
                state.photoFit.x = Math.max(-45, Math.min(45, state.photoDrag.x + dx));
                state.photoFit.y = Math.max(-45, Math.min(45, state.photoDrag.y + dy));
                updatePhotoPreview();
            });
            els.photoCropImg.addEventListener('pointerup', () => {
                state.photoDrag = null;
                els.photoCropImg.classList.remove('dragging');
            });
            els.photoCropImg.addEventListener('pointercancel', () => {
                state.photoDrag = null;
                els.photoCropImg.classList.remove('dragging');
            });
        }

        function bindEvents() {
            els.categoryBar.addEventListener('click', (event) => {
                const btn = event.target.closest('[data-category]');
                if (btn) setCategory(btn.dataset.category);
            });
            els.cardsGrid.addEventListener('click', (event) => {
                const card = event.target.closest('[data-recipe-id]');
                if (!card) return;
                openDetailPanel(card.dataset.recipeId);
                if (isMobileDetailMode()) openMobileDetail();
            });
            els.detailPanel.addEventListener('click', (event) => {
                if (event.target.closest('[data-close-detail]')) {
                    closeDetailPanel();
                    return;
                }
                if (event.target.closest('[data-close-mobile-detail]')) {
                    closeDetailPanel();
                    closeMobileDetail();
                    return;
                }
                const ownerMenuTrigger = event.target.closest('[data-owner-menu-trigger]');
                if (ownerMenuTrigger) {
                    event.stopPropagation();
                    toggleOwnerMenu(ownerMenuTrigger);
                    return;
                }
                const editBtn = event.target.closest('[data-edit-recipe]');
                if (editBtn) {
                    closeOwnerMenus();
                    const recipe = getRecipeById(editBtn.dataset.editRecipe);
                    closeDetailPanel();
                    closeMobileDetail();
                    loadRecipeIntoForm(recipe);
                    return;
                }
                const deleteBtn = event.target.closest('[data-delete-recipe]');
                if (deleteBtn) {
                    closeOwnerMenus();
                    requestDeleteRecipe(deleteBtn.dataset.deleteRecipe);
                    return;
                }
                const btn = event.target.closest('[data-fullscreen-recipe]');
                if (btn) openFullscreen(btn.dataset.fullscreenRecipe);
            });
            els.searchInput.addEventListener('input', () => {
                state.search = els.searchInput.value;
                renderCards();
            });
            els.composerToggleBtn.addEventListener('click', () => {
                if (state.composerOpen) {
                    closeComposer();
                } else {
                    if (state.editingRecipeId) resetForm();
                    openComposer({ focus: true });
                }
            });
            els.addIngredientBtn.addEventListener('click', () => addIngredientRow());
            els.addStepBtn.addEventListener('click', () => addStepRow());
            els.resetFormBtn.addEventListener('click', resetForm);
            els.recipeForm.addEventListener('submit', submitRecipe);
            els.fullscreenCard.addEventListener('click', (event) => {
                const ownerMenuTrigger = event.target.closest('[data-owner-menu-trigger]');
                if (ownerMenuTrigger) {
                    event.stopPropagation();
                    toggleOwnerMenu(ownerMenuTrigger);
                    return;
                }
                const editBtn = event.target.closest('[data-edit-recipe]');
                if (editBtn) {
                    closeOwnerMenus();
                    const recipe = getRecipeById(editBtn.dataset.editRecipe);
                    closeFullscreen();
                    loadRecipeIntoForm(recipe);
                    return;
                }
                const deleteBtn = event.target.closest('[data-delete-recipe]');
                if (deleteBtn) {
                    closeOwnerMenus();
                    requestDeleteRecipe(deleteBtn.dataset.deleteRecipe);
                }
            });
            els.fullscreenOverlay.addEventListener('click', (event) => {
                if (event.target === els.fullscreenOverlay) closeFullscreen();
            });
            els.confirmDeleteBtn.addEventListener('click', confirmDeleteRecipe);
            els.cancelDeleteBtn.addEventListener('click', closeDeleteConfirm);
            els.confirmOverlay.addEventListener('click', (event) => {
                if (event.target === els.confirmOverlay) closeDeleteConfirm();
            });
            document.addEventListener('click', () => {
                closeCustomSelects();
                closeOwnerMenus();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeCustomSelects();
                    closeOwnerMenus();
                    if (els.confirmOverlay.classList.contains('open')) {
                        closeDeleteConfirm();
                        return;
                    }
                    closeFullscreen();
                    closeMobileDetail();
                }
            });
            window.addEventListener('resize', () => {
                if (!isMobileDetailMode()) closeMobileDetail();
                updateContentLayoutVars();
            });
            bindPhotoEditor();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initElements();
            state.currentUser = getCurrentUser();
            resetForm();
            bindEvents();
            initFirebase();
            renderAll();
        });
