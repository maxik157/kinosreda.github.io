    async function upload(blob){const form=new FormData;form.append('image',blob,'beer.png');const res=await fetch(`${base}/upload-image`,{method:'POST',body:form}),text=await res.text();let out={};try{out=JSON.parse(text)}catch(_){}const url=out?.url||out?.data?.[0]?.link||out?.data?.url||out?.image_url||text.match(/https?:\/\/[^\s"']+/)?.[0];if(!res.ok||!url)throw new Error('upload');return url;}
    async function process(data){status('Подготавливаем фото…');els.save.disabled=true;closePhotoChoices();try{const prepared=await prepareImageForRemove(data);status('Удаляем фон…');const removed=await removeBg(prepared);status('Подготавливаем…');preview(removed);imageUrl=await upload(await normalize(removed));preview(imageUrl);status('✓ Фото готово');}catch(_){status('Не удалось обработать фото. Попробуйте другое изображение.')}finally{els.save.disabled=false;}}
    async function search(){if(!field('name').trim()){status('Сначала укажите название');return}status('Ищем…');try{const res=await fetch(`${base}/beer-image-search`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:field('name').trim()})}),out=await res.json();if(!res.ok||!out.images?.length)throw 0;els.candidates.innerHTML='';out.images.forEach(item=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<img src="${item.thumbnailUrl||item.imageUrl}" alt="">`;b.onclick=async()=>{status('Загружаем…');try{const r=await fetch(`${base}/fetch-image`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:item.imageUrl})}),v=await r.json(),raw=v.result_base64||v.image_base64;if(!r.ok||!raw)throw 0;await process(`data:image/png;base64,${raw}`);els.candidates.classList.remove('is-open')}catch(_){status('Не удалось загрузить фото')}};els.candidates.append(b)});els.candidates.classList.add('is-open');status('Выберите изображение');}catch(_){status('Поиск не сработал')}}
    function userName(){try{const user=JSON.parse(localStorage.getItem('currentUser')||'{}');return user.name||user.username||''}catch(_){return ''}}
    function canDeleteBeer(){return mode==='edit'&&Boolean(record.author)&&String(record.author).trim()===String(userName()).trim();}
    async function deleteBeer(){if(!canDeleteBeer()||!window.confirm('Подтвердите удаление пива. Восстановить карточку будет нельзя.'))return;els.deleteBeer.disabled=true;els.save.disabled=true;try{await db.ref(`beerRating/${key}`).remove();close();}catch(_){status('Не удалось удалить пиво');els.deleteBeer.disabled=false;els.save.disabled=false;}}
    function decorateSelects(){els.form.querySelectorAll('select').forEach(select=>{if(select.parentElement?.classList.contains('select-wrap'))return;const wrap=document.createElement('span'),trigger=document.createElement('button'),menu=document.createElement('div');wrap.className='select-wrap';trigger.type='button';trigger.className='cs-trigger';trigger.setAttribute('aria-expanded','false');menu.className='cs-menu';select.parentNode.insertBefore(wrap,select);wrap.append(select,trigger,menu);const sync=()=>{trigger.textContent=select.options[select.selectedIndex]?.text||'';menu.querySelectorAll('.cs-option').forEach(option=>option.setAttribute('aria-selected',String(option.dataset.value===select.value)));};[...select.options].forEach(option=>{const item=document.createElement('button');item.type='button';item.className='cs-option';item.dataset.value=option.value;item.textContent=option.text;item.onclick=()=>{select.value=option.value;select.dispatchEvent(new Event('change',{bubbles:true}));menu.classList.remove('is-open');trigger.setAttribute('aria-expanded','false');};menu.append(item);});trigger.onclick=event=>{event.stopPropagation();document.querySelectorAll('.cs-menu.is-open').forEach(open=>{if(open!==menu)open.classList.remove('is-open');});const open=menu.classList.toggle('is-open');trigger.setAttribute('aria-expanded',String(open));};select.addEventListener('change',sync);sync();});document.addEventListener('click',()=>{document.querySelectorAll('.cs-menu.is-open').forEach(menu=>{menu.classList.remove('is-open');const trigger=menu.parentElement?.querySelector('.cs-trigger');if(trigger)trigger.setAttribute('aria-expanded','false');});});}
    async function init(){if(!firebase.apps.length)firebase.initializeApp(config);db=firebase.database();decorateSelects();renderStarPicker();els.title.textContent=mode==='edit'?'Редактировать пиво':'Добавить пиво';els.saveLabel.textContent=mode==='edit'?'Сохранить':'Добавить';notify('shelf-modal-open');if(mode==='edit'){status('Загрузка…');const snap=await db.ref(`beerRating/${key}`).once('value');record=snap.val()||{};els.deleteBeer.hidden=!canDeleteBeer();for(const id of ['name','type','style','filtered','country','volume','alcohol','calories'])set(id);preview(record.imageUrl||'');const savedRating=Number(record.ratings?.[userName()]);if(savedRating>0)setRating(savedRating);status('');}else{els.style.value='Lager';els.style.dispatchEvent(new Event('change'));els.volume.value='0.5';els.volume.dispatchEvent(new Event('change'));}}
    els.photoToggle.onclick=()=>{const opening=!els.photoChoices.classList.contains('is-open');els.photoChoices.classList.toggle('is-open',opening);els.photoActions.classList.toggle('is-choosing',opening);els.photoToggle.setAttribute('aria-expanded',String(opening));};els.choosePhoto.onclick=()=>els.file.click();els.cameraPhoto.onclick=()=>els.camera.click();els.searchPhoto.onclick=search;[els.file,els.camera].forEach(input=>input.onchange=async()=>{const f=input.files?.[0];input.value='';if(f)await process(await dataUrl(f));});els.starPicker.addEventListener('pointerdown',event=>{ratingPointerId=event.pointerId;els.starPicker.setPointerCapture?.(ratingPointerId);setRatingFromPointer(event);event.preventDefault();});els.starPicker.addEventListener('pointermove',event=>{if(event.pointerId===ratingPointerId)setRatingFromPointer(event);else if(event.pointerType==='mouse')previewRatingFromPointer(event);});els.starPicker.addEventListener('pointerleave',()=>{if(ratingPointerId===null&&ratingHoverValue!==null){ratingHoverValue=null;renderStarPicker();}});['pointerup','pointercancel'].forEach(type=>els.starPicker.addEventListener(type,event=>{if(event.pointerId===ratingPointerId)ratingPointerId=null;}));els.starPicker.addEventListener('keydown',event=>{const current=Number(field('rating'))||.5;if(event.key==='ArrowLeft'){setRating(current-.5);event.preventDefault();}if(event.key==='ArrowRight'){setRating(current+.5);event.preventDefault();}});document.addEventListener('pointerdown',event=>{if(!event.target.closest('.modal'))close();});els.close.onclick=close;els.cancel.onclick=close;els.deleteBeer.onclick=deleteBeer;els.form.onsubmit=async event=>{event.preventDefault();const name=field('name').trim(),alcohol=field('alcohol').trim();if(!name||!alcohol)return status('Укажите название и крепость');els.save.disabled=true;try{const next={...record,id:record.id||Date.now().toString(),name,type:field('type'),style:field('style'),filtered:field('filtered'),country:field('country'),volume:field('volume'),alcohol,calories:field('calories'),imageUrl:imageUrl||record.imageUrl||'',author:record.author||userName(),ratings:record.ratings||{},timestamp:record.timestamp||Date.now()};const rating=Number(field('rating'));if(Number.isFinite(rating)&&rating>0&&userName())next.ratings[userName()]=rating;let target=key;if(mode!=='edit'){const raw=(await db.ref('beerRating').once('value')).val();target=Array.isArray(raw)?String(raw.length):db.ref('beerRating').push().key;}await db.ref(`beerRating/${target}`).set(next);close();}catch(_){status('Не удалось сохранить')}finally{els.save.disabled=false;}};init().catch(()=>{status('Не удалось открыть форму');notify('shelf-modal-open')});
  </script>
