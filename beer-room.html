<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>3D-бар «Киносреда»</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='20' y='30' width='45' height='55' rx='5' fill='none' stroke='%23b45309' stroke-width='4'/%3E%3Crect x='22' y='45' width='41' height='38' rx='3' fill='%23f59e0b'/%3E%3Cellipse cx='42' cy='35' rx='24' ry='8' fill='%23fff'/%3E%3Ccircle cx='30' cy='33' r='5' fill='%23fff'/%3E%3Ccircle cx='45' cy='31' r='4' fill='%23fff'/%3E%3Ccircle cx='55' cy='34' r='4' fill='%23fff'/%3E%3Cpath d='M65 38 Q85 38 85 55 Q85 72 65 72' fill='none' stroke='%23b45309' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="kinosreda-shell.css?v=20261113barplanet" />
    <script src="kinosreda-shell.js?v=20261113barnav" defer></script>
    <style>
      @font-face {
        font-family: RoomComfortaa;
        src: url("./comfortaa-400.ttf");
      }
      @font-face {
        font-family: RoomComfortaa;
        src: url("./comfortaa-700.ttf");
        font-weight: 700;
      }
      :root {
        --gold: #f4b941;
        --cream: #fff2c8;
        --glass: rgba(8, 10, 14, 0.72);
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #07080b;
        color: #f8f1df;
        font-family: RoomComfortaa, system-ui, sans-serif;
      }
      body.ks-ui {
        background: #07080b;
      }
      .room-app {
        position: fixed;
        inset: 0;
        isolation: isolate;
        background: #07080b;
      }
      .room-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .room-vignette {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 46%,
          transparent 35%,
          rgba(0, 0, 0, 0.18) 68%,
          rgba(0, 0, 0, 0.72) 100%
        );
      }
      .room-hud {
        position: absolute;
        z-index: 5;
        inset: 0;
        pointer-events: none;
      }
      .room-brand {
        position: absolute;
        top: clamp(18px, 4vh, 38px);
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        font-family: var(--logo-font, var(--ks-font));
        letter-spacing: 0.16em;
        color: rgba(255, 240, 197, 0.9);
        text-shadow: 0 0 18px rgba(244, 185, 65, 0.45);
        font-size: clamp(18px, 2vw, 31px);
        font-weight: 700;
      }
      .room-brand small {
        display: block;
        margin-top: 6px;
        letter-spacing: 0.2em;
        color: rgba(239, 205, 130, 0.58);
        font-size: 9px;
        font-weight: 400;
      }
      .room-scene-sign {
        position: absolute;
        top: 22%;
        left: 50%;
        transform: translateX(-50%) perspective(500px) rotateX(1deg);
        padding: 9px 24px;
        color: #fff2bc;
        font-family: var(--logo-font, var(--ks-font));
        font-size: clamp(20px, 3vw, 38px);
        font-weight: 700;
        letter-spacing: 0.17em;
        white-space: nowrap;
        text-shadow:
          0 0 5px #fff1b0,
          0 0 18px #f4a33d,
          0 0 40px rgba(244, 151, 35, 0.72);
        opacity: 0.82;
        filter: drop-shadow(0 9px 10px rgba(0, 0, 0, 0.72));
        pointer-events: none;
      }
      .room-scene-sign:before {
        content: "";
        position: absolute;
        inset: 0 -16px;
        border: 1px solid rgba(244, 185, 65, 0.44);
        border-radius: 7px;
        box-shadow:
          inset 0 0 20px rgba(244, 145, 38, 0.12),
          0 0 28px rgba(244, 145, 38, 0.18);
        z-index: -1;
      }
      .room-help {
        position: absolute;
        left: clamp(18px, 4vw, 58px);
        bottom: clamp(20px, 4vh, 38px);
        max-width: 320px;
        padding: 12px 16px;
        border: 1px solid rgba(244, 185, 65, 0.22);
        border-radius: 14px;
        background: rgba(9, 11, 15, 0.52);
        backdrop-filter: blur(12px);
        color: rgba(255, 245, 220, 0.78);
        font-size: 11px;
        line-height: 1.55;
        opacity: 0;
        transform: translateY(12px);
        transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .room-app.is-active .room-help {
        opacity: 1;
        transform: none;
      }
      .room-help b {
        color: var(--gold);
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .room-help kbd {
        display: inline-grid;
        place-items: center;
        min-width: 20px;
        height: 19px;
        margin: 0 2px;
        border: 1px solid rgba(255, 239, 194, 0.25);
        border-radius: 5px;
        color: var(--cream);
        font-size: 9px;
      }
      .room-touch-controls {
        display: none;
        position: absolute;
        inset: auto 18px 22px;
        z-index: 7;
        align-items: end;
        justify-content: space-between;
        pointer-events: none;
      }
      .move-joystick {
        width: 116px;
        height: 116px;
        border: 1px solid rgba(244, 185, 65, 0.35);
        border-radius: 50%;
        background: rgba(13, 18, 19, 0.5);
        display: grid;
        place-items: center;
        touch-action: none;
        pointer-events: auto;
      }
      .move-joystick span {
        width: 48px;
        height: 48px;
        border: 1px solid #c3a56e;
        border-radius: 50%;
        background: rgba(230, 191, 115, 0.38);
        pointer-events: none;
      }
      .touch-actions {
        display: flex;
        gap: 8px;
        align-items: end;
        flex-direction: column;
        pointer-events: auto;
      }
      .touch-actions button {
        min-height: 42px;
        padding: 10px 15px;
        border: 1px solid #b38b50;
        border-radius: 15px;
        background: rgba(17, 26, 25, 0.85);
        color: #ffe8b9;
        font: 11px RoomComfortaa;
        touch-action: none;
      }
      .touch-actions .touch-interact {
        background: #ddbd7f;
        color: #24251f;
      }
      .touch-actions [aria-pressed="true"] {
        background: #856331;
      }
      .room-help button {
        display: block;
        margin-top: 9px;
        padding: 7px 10px;
        border: 1px solid #776343;
        border-radius: 8px;
        background: #202824;
        color: #e5cf9e;
        font: 10px RoomComfortaa;
        pointer-events: auto;
        cursor: pointer;
      }
      .room-interact-hint {
        display: none;
      }
      .room-panel {
        left: 24px;
        right: auto;
        width: 270px;
      }
      .room-panel.is-open {
        transform: translate(0, -50%);
      }
      @media (pointer: coarse) {
        .room-app.is-active .room-touch-controls {
          display: flex;
        }
        .room-help {
          display: none;
        }
        .room-status {
          bottom: 155px;
        }
        .room-panel {
          left: 14px;
          top: 110px;
          bottom: auto;
          width: 210px;
          transform: translateX(-20px);
        }
        .room-panel.is-open {
          transform: none;
        }
        .room-panel h2 {
          font-size: 17px;
        }
        .room-details {
          gap: 6px;
        }
        .room-description {
          display: none;
        }
        .room-interact-hint {
          top: 57%;
        }
      }
      .room-crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 16px;
        height: 16px;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.3s;
      }
      .room-app.is-active .room-crosshair {
        opacity: 0.72;
      }
      .room-crosshair:before,
      .room-crosshair:after {
        content: "";
        position: absolute;
        background: #ffeab1;
        box-shadow: 0 0 8px #f4b941;
      }
      .room-crosshair:before {
        left: 7px;
        top: 0;
        width: 1px;
        height: 16px;
      }
      .room-crosshair:after {
        top: 7px;
        left: 0;
        width: 16px;
        height: 1px;
      }
      .room-status {
        position: absolute;
        right: clamp(18px, 4vw, 58px);
        bottom: clamp(20px, 4vh, 38px);
        display: flex;
        align-items: center;
        gap: 9px;
        color: rgba(255, 242, 202, 0.64);
        font-size: 10px;
      }
      .room-status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f4b941;
        box-shadow: 0 0 12px #f4b941;
      }
      .room-status.is-ready i {
        background: #75d08a;
        box-shadow: 0 0 12px #75d08a;
      }
      .room-online-status {
        position: absolute;
        right: clamp(18px, 4vw, 58px);
        top: clamp(18px, 4vh, 38px);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 10px;
        border: 1px solid rgba(244, 185, 65, 0.2);
        border-radius: 999px;
        background: rgba(7, 8, 11, 0.45);
        color: rgba(255, 242, 202, 0.7);
        font-size: 9px;
        backdrop-filter: blur(8px);
      }
      .room-online-status i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #d69a3f;
        box-shadow: 0 0 9px #d69a3f;
      }
      .room-online-status.is-connected i {
        background: #75d08a;
        box-shadow: 0 0 9px #75d08a;
      }
      .room-menu {
        position: absolute;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(
          ellipse at 50% 42%,
          rgba(62, 32, 13, 0.22),
          rgba(2, 3, 5, 0.94) 72%
        );
        transition:
          opacity 0.75s,
          visibility 0.75s;
      }
      .room-menu.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .room-menu-card {
        width: min(570px, calc(100vw - 40px));
        padding: clamp(30px, 6vw, 64px) 30px 32px;
        text-align: center;
      }
      .room-menu-kicker {
        color: #f4b941;
        letter-spacing: 0.42em;
        font-size: 10px;
        text-transform: uppercase;
      }
      .room-menu h1 {
        margin: 18px 0 10px;
        color: #fff5d4;
        font-size: clamp(42px, 8vw, 84px);
        font-weight: 700;
        letter-spacing: 0.16em;
        line-height: 0.95;
        text-shadow:
          0 0 18px rgba(244, 185, 65, 0.7),
          0 5px 25px rgba(0, 0, 0, 0.9);
      }
      .room-menu p {
        margin: 0 auto 30px;
        max-width: 400px;
        color: rgba(255, 240, 209, 0.72);
        font-size: 13px;
        line-height: 1.7;
      }
      .room-enter {
        position: relative;
        min-width: 206px;
        padding: 14px 25px;
        border: 1px solid rgba(244, 185, 65, 0.7);
        border-radius: 999px;
        background: linear-gradient(135deg, #f7cd70, #bc741d);
        box-shadow:
          0 0 26px rgba(244, 185, 65, 0.25),
          inset 0 1px rgba(255, 255, 255, 0.55);
        color: #291707;
        font: 700 11px RoomComfortaa;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: 0.25s;
      }
      .room-enter:hover {
        transform: translateY(-2px);
        box-shadow:
          0 0 40px rgba(244, 185, 65, 0.44),
          inset 0 1px rgba(255, 255, 255, 0.55);
      }
      .room-menu-note {
        margin-top: 18px;
        color: rgba(255, 239, 200, 0.4);
        font-size: 10px;
      }
      .room-panel {
        position: absolute;
        z-index: 7;
        top: 50%;
        right: clamp(16px, 4vw, 62px);
        width: min(310px, calc(100vw - 32px));
        padding: 21px 20px 18px;
        border: 1px solid rgba(244, 185, 65, 0.38);
        border-radius: 18px;
        background: linear-gradient(
          145deg,
          rgba(24, 20, 16, 0.9),
          rgba(6, 9, 13, 0.84)
        );
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.5),
          0 0 25px rgba(244, 185, 65, 0.12);
        backdrop-filter: blur(18px);
        opacity: 0;
        pointer-events: none;
        transform: translate(22px, -50%) scale(0.96);
        transition: 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .room-panel.is-open {
        opacity: 1;
        pointer-events: auto;
        transform: translate(0, -50%) scale(1);
      }
      .room-panel .panel-label {
        margin-bottom: 8px;
        color: #d8ad54;
        font-size: 9px;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }
      .room-panel h2 {
        margin: 0 22px 16px 0;
        color: #fff4d2;
        font-size: 22px;
        line-height: 1.15;
      }
      .room-details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 14px;
        margin: 0 0 12px;
      }
      .room-details div {
        min-width: 0;
      }
      .room-details dt {
        color: rgba(255, 224, 159, 0.55);
        font-size: 8px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .room-details dd {
        margin: 3px 0 0;
        color: #fff0c2;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .room-description {
        margin: 0 0 15px;
        color: rgba(255, 239, 203, 0.68);
        font-size: 10px;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .room-panel-close {
        position: absolute;
        right: 13px;
        top: 11px;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        color: #ffe7a9;
        font-size: 19px;
        cursor: pointer;
      }
      .room-panel-actions {
        display: flex;
        gap: 8px;
      }
      .room-panel-actions button {
        flex: 1;
        padding: 10px 8px;
        border: 1px solid rgba(244, 185, 65, 0.35);
        border-radius: 10px;
        background: rgba(244, 185, 65, 0.12);
        color: #ffe9af;
        font: 700 9px RoomComfortaa;
        cursor: pointer;
      }
      .room-panel-actions button:hover {
        background: rgba(244, 185, 65, 0.25);
      }
      .room-toast {
        position: absolute;
        z-index: 8;
        left: 50%;
        top: 67%;
        padding: 10px 15px;
        border: 1px solid rgba(244, 185, 65, 0.25);
        border-radius: 999px;
        background: rgba(7, 8, 11, 0.72);
        color: #ffe8ae;
        font-size: 10px;
        opacity: 0;
        transform: translate(-50%, 10px);
        pointer-events: none;
        transition: 0.3s;
      }
      .room-toast.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .room-app:not(.is-ready) > :not(.room-loader) {
        visibility: hidden;
      }
      .room-loader {
        position: absolute;
        z-index: 100;
        pointer-events: auto;
        inset: 0;
        display: grid;
        place-items: center;
        background: #07080b;
      }
      .room-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .room-loader-inner {
        text-align: center;
      }
      .room-loader-mark {
        width: 38px;
        height: 38px;
        margin: 0 auto 15px;
        border: 2px solid rgba(244, 185, 65, 0.22);
        border-top-color: #f4b941;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .room-loader p {
        margin: 0;
        color: rgba(255, 239, 202, 0.65);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 700px) {
        .room-brand {
          top: 15px;
        }
        .room-help {
          font-size: 9px;
          max-width: 230px;
        }
        .room-panel {
          top: 85px;
          right: auto;
          left: 12px;
          bottom: auto;
          max-height: 40vh;
          overflow: auto;
          transform: translateX(-20px);
        }
        .room-panel.is-open {
          transform: none;
        }
        .room-status {
          right: 16px;
          bottom: 22px;
        }
        .room-menu h1 {
          letter-spacing: 0.1em;
        }
      }
      @media (pointer: coarse) {
        .room-app.is-active .room-touch-controls {
          display: flex;
        }
        .room-panel {
          left: 12px;
          right: auto;
          top: 85px;
          bottom: auto;
          width: 210px;
          max-height: 40vh;
          overflow: auto;
          transform: translateX(-20px);
        }
        .room-panel.is-open {
          transform: none;
        }
        .room-panel h2 {
          font-size: 17px;
        }
        .room-details {
          gap: 6px;
        }
        .room-description {
          display: none;
        }
        .room-status {
          bottom: 155px;
          font-size: 9px;
        }
        .room-status.is-ready {
          display: none;
        }
        .room-toast {
          top: auto;
          bottom: 180px;
          max-width: 230px;
          border-radius: 12px;
        }
        .room-interact-hint {
          max-width: 200px;
          top: 54%;
        }
      }
      .glass-actions {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 8;
        display: flex;
        gap: 10px;
      }
      .glass-actions[hidden] {
        display: none;
      }
      .glass-actions button {
        padding: 12px 22px;
        border: 1px solid #b38b50;
        border-radius: 22px;
        background: rgba(17, 26, 25, 0.9);
        color: #ffe8b9;
        font: 12px RoomComfortaa;
        cursor: pointer;
      }
      .glass-actions button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .avatar-button {
        position: absolute;
        right: clamp(18px, 4vw, 58px);
        top: 70px;
        pointer-events: auto;
        border: 1px solid #b5945a66;
        border-radius: 20px;
        padding: 8px 13px;
        background: #101917d9;
        color: #f5e1b6;
        font: 11px RoomComfortaa;
        cursor: pointer;
      }
      .avatar-dialog {
        width: min(680px, calc(100vw - 40px));
        max-height: 90vh;
        overflow: auto;
        box-sizing: border-box;
        border: 1px solid #b5945a80;
        border-radius: 22px;
        padding: 24px;
        background: #15201e;
        color: #f5e1b6;
        font-family: RoomComfortaa;
      }
      .avatar-dialog::backdrop {
        background: #030706c9;
        backdrop-filter: blur(7px);
      }
      .avatar-dialog h2 {
        margin: 0 0 18px;
        font-size: 20px;
      }
      .avatar-dialog-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .avatar-preview {
        height: 360px;
        min-width: 0;
        border-radius: 14px;
        overflow: hidden;
      }
      .avatar-preview canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .avatar-choices {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
      }
      .avatar-choices button,
      .avatar-save {
        border: 1px solid #b5945a66;
        border-radius: 12px;
        padding: 13px;
        text-align: left;
        background: #23332f;
        color: #f5e1b6;
        font: 12px RoomComfortaa;
        cursor: pointer;
      }
      .avatar-choices button[aria-checked="true"] {
        border-color: #e2bb70;
        background: #4a4934;
        box-shadow: inset 3px 0 #e2bb70;
      }
      .avatar-save {
        display: block;
        margin: 18px 0 0 auto;
        background: #dab677;
        color: #222a22;
        font-weight: 700;
        text-align: center;
      }
      .avatar-close {
        float: right;
        border: 0;
        background: transparent;
        color: #f5e1b6;
        font-size: 25px;
        cursor: pointer;
      }
      .avatar-choices button:focus-visible,
      .avatar-save:focus-visible {
        outline: 2px solid #ffe5ad;
        outline-offset: 3px;
      }
      @media (max-width: 560px) {
        .avatar-dialog {
          padding: 18px;
        }
        .avatar-dialog-layout {
          grid-template-columns: 1fr;
        }
        .avatar-preview {
          height: 270px;
        }
        .avatar-choices {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
        .avatar-choices button {
          font-size: 10px;
          padding: 10px;
        }
      }
    </style>
  </head>
  <body class="ks-ui ks-page-beer-room">
    <main class="room-app" id="roomApp">
      <canvas
        id="roomCanvas"
        class="room-canvas"
        tabindex="0"
        aria-label="Интерактивный 3D-бар Киносреда"
      ></canvas>
      <div class="room-vignette" aria-hidden="true"></div>
      <div class="room-hud">
        <div class="room-online-status" id="roomOnline">
          <i></i><span>Подключение…</span>
        </div>
        <button
          class="avatar-button"
          id="chooseAvatar"
          type="button"
          aria-haspopup="dialog"

        worldEditor.update(dt);
        updateLocalPaddler(dt);
        interior.update(dt);
        shelfDetail.update(dt);
        camera.updateMatrixWorld(true);
        hand.update(dt, player);
        pouring.update(dt, player);
        online.update(dt);
        avatarPicker.update(dt);
        onlineStatus.classList.toggle("is-connected", online.connected);
        const onlineText = online.connected
          ? `Онлайн · ${online.users.size + 1}`
          : "Подключение…";
        if (onlineStatus.querySelector("span").textContent !== onlineText)
          onlineStatus.querySelector("span").textContent = onlineText;
        if (entered && !worldEditor.active && (hoverTick += dt) > 0.1) {
          hoverTick = 0;
          const object = findHit(new THREE.Vector2(0, 0));
          setHovered(object);
          if (
            selected &&
            hand.canPour() &&
            object?.userData.action === "glass" &&
            pouring.available(object, camera)
          )
            hand.state = "POUR_READY";
          else if (hand.state === "POUR_READY") hand.state = "HOLDING";
        }
        infoBillboard.visible = false;
        const holdingGlass = hand.heldKind === "glass",
          holdingBeer = hand.heldKind === "beer";
        setHidden($("glassActions"), !(holdingGlass || holdingBeer));
        setHidden($("sipGlass"), !(holdingGlass || holdingBeer));
        $("sipGlass").disabled = !hand.canDrink();
        const placeText = holdingBeer ? "Поставить пиво" : "Поставить";
        if ($("placeGlass").textContent !== placeText)
          $("placeGlass").textContent = placeText;
        $("placeGlass").disabled = holdingGlass
          ? !hand.canPutGlass()
          : !hand.canPutBeer();
        const inView =
          !worldEditor.active &&
          !!hand.model &&
          !["POURING", "GLASS_PLACING"].includes(hand.state);
        hand.rig.traverse((o) => o.layers.set(inView ? 1 : 0));
        shadowTick += dt;
        if (
          renderer.shadowMap.enabled &&
          (scene.userData.shadowsDirty ||
            ((scene.userData.dynamicShadows ||
              player.sup ||
              player.swimming ||
              player.toilet) &&
              shadowTick >= 1 / 20))
        ) {
          renderer.shadowMap.needsUpdate = true;
          scene.userData.shadowsDirty = scene.userData.dynamicShadows = false;
          shadowTick = 0;
        }
        camera.layers.set(0);
        environment.update(dt);
        campSettings.update(dt);
        startup?.update();
        if (startup?.state.revealed) playerSave.update(dt);
        renderer.autoClear = true;
        renderer.render(scene, camera);
        if (inView) {
          const background = scene.background;
          scene.background = null;
          renderer.autoClear = false;
          renderer.clearDepth();
          camera.layers.set(1);
          renderer.render(scene, camera);
          camera.layers.set(0);
          scene.background = background;
          renderer.autoClear = true;
        }
      }
      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        environment.applyQuality(environment.quality);
      });
      canvas.addEventListener("webglcontextlost", (e) => {
        e.preventDefault();
        controls.pause();
        showToast("Восстанавливаем изображение…");
      });
      canvas.addEventListener("webglcontextrestored", () => {
        environment.outdoors?.lake.invalidateReflection();
        scene.userData.shadowsDirty = true;
        controls.enable();
      });
      controls.bindJoystick($("moveJoystick"), $("joystickKnob"));
      $("touchInteract").addEventListener("click", interactAtCenter);
      $("touchJump").addEventListener("click", () => controls.jump());
      $("touchCrouch").addEventListener("click", () => {
        const pressed = !controls.keys.has("KeyC");
        controls.keys[pressed ? "add" : "delete"]("KeyC");
        $("touchCrouch").setAttribute("aria-pressed", String(pressed));
      });
      $("sipGlass").addEventListener("click", () => hand.beginDrink());
      $("placeGlass").addEventListener("click", () => hand.putHeld());
      controls.pause();
      startup = createSceneStartup({
        app,
        loader,
        renderer,
        scene,
        camera,
        ready: () =>
          startupFlags.worldReady &&
          startupFlags.catalogueReady &&
          hand.loaded &&
          sceneLoads.pending === 0 &&
          pendingTextures === 0 &&
          activeTextureLoads === 0 &&
          textureQueue.length === 0 &&
          retryPending === 0 &&
          Math.abs(environment.progress - (environment.open ? 1 : 0)) <
            0.0001 &&
          (!environment.open || environment.outdoors.lake.stats.bakeCount > 0),
        onReveal: () => {
          controls.enable();
          playerSave.save();
          online.sendPresence(true);
        },
      });
      $("closeBeer").addEventListener("click", () => returnSelected());
      $("returnBeer").addEventListener("click", () => returnSelected());
      $("focusBeer").addEventListener("click", () => {
        if (selected && hand.canPour()) {
          hand.examine = !hand.examine;
          $("focusBeer").textContent = hand.examine
            ? "Зафиксировать"
            : "Повернуть напиток";
        }
      });
      window.__kinosredaRoom = {
        camera,
        scene,
        renderer,
        beerModels,
        beers,
        player,
        controls,
        hand,
        pouring,
        online,
        interior,
        environment,
        campSettings,
        toiletFlow,
        worldEditor,
        paddler,
        startup,
        sceneLoads,
        playerSave,
        findPlacement,
        signFace,
        selectBeer,
        returnSelected,
        interactAtCenter,
        interactAt,
        findHit,
        activate,
        audit: () =>
          [...beers.values()].map((beer) => ({
            key: beer.key,
            name: beer.name,
            profile: beer.profile,
            imageUrl: beer.imageUrl,
          })),
      };
      animate();
      let cachedCatalog = false;
      try {
        const saved = localStorage.getItem("kinosreda-room-catalog");
        if (saved) {
          syncSnapshot(JSON.parse(saved));
          cachedCatalog = true;
        }
      } catch {}
      function catalogFallback() {
        if (!cachedCatalog && !catalogSignature) syncSnapshot({});
        startupFlags.catalogueReady = true;
      }
      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        firebase
          .database()
          .ref("beerRating")
          .on(
            "value",
            (snap) => {
              syncSnapshot(snap.val());
              startupFlags.catalogueReady = true;
            },
            catalogFallback,
          );
      } catch {
        catalogFallback();
      }
      if (cachedCatalog)
        setTimeout(() => {
          if (!startupFlags.catalogueReady) catalogFallback();
        }, 4000);
    </script>
  </body>
</html>
