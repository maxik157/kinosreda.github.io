    <script>
        // Auth gate
        (function () {
            try {
                const cu = localStorage.getItem('currentUser');
                if (!cu) {
                    location.replace('login.html');
                    return;

                document.documentElement.classList.add('authed');

    <script>
        // Logo font loader (per-user)
        (function(){
            const html = document.documentElement;
            const KEY = 'logoFontFamily';
            const DEFAULT = 'Rubik Wet Paint';
            const LINK_ID = 'logoFontGF';

            function familyToHref(fam){
                const q = encodeURIComponent(fam).replace(/%20/g, '+');
                return `https://fonts.googleapis.com/css2?family=${q}&display=swap`;
            }

            function ensureStylesheet(fam){
                const family = (fam || DEFAULT).trim();
                if (!family) return;
                const href = familyToHref(family);
                let link = document.getElementById(LINK_ID);
                if (!link) {
                    link = document.createElement('link');
                    link.id = LINK_ID;
                    link.rel = 'stylesheet';
                    document.head.appendChild(link);
                }
                if (link.getAttribute('href') !== href) link.setAttribute('href', href);
            }

            function markReady(){
                html.classList.add('logo-font-ready');
                html.classList.remove('logo-font-loading');
            }

            function waitForFont(fam){
                const family = (fam || DEFAULT).trim();
                if (!family) return markReady();

                ensureStylesheet(family);

                html.classList.add('logo-font-loading');
                html.classList.remove('logo-font-ready');
                try {
                    if (document.fonts && document.fonts.load) {
                        document.fonts.load(`1em "${family}"`).then(markReady, markReady);
                    } else {
                        setTimeout(markReady, 1);
                    }
                } catch (_) {
                    markReady();
                }
            }

            try {
                const fam = localStorage.getItem(KEY) || DEFAULT;
                html.style.setProperty('--logo-font', `'${fam}'`);
                waitForFont(fam);
            } catch(_) {
                markReady();
            }
        })();
    </script>

    <main class="page-shell">
        <div class="chat-layout">
            <aside class="chat-sidebar">
                <h3>Чаты</h3>
                <div id="chatList" class="chat-list"></div>
            </aside>

            <section class="chat-shell">
                <div class="model-dock">
                    <div class="cs" id="modelSelectCs">
                        <select id="modelSelect" disabled>
                            <option>Загрузка моделей...</option>
                        </select>
                    </div>
                </div>

                <div class="quick-actions">
                    <button id="newChatBtn" class="pill-btn" type="button">Новый чат</button>
                    <button id="puterSignInBtn" class="tiny-btn" type="button">Войти</button>
                </div>

                <div id="chatMessages" class="chat-messages">
                    <div class="msg ai">
                        Привет! Я готов помочь. Выбери модель в левом верхнем углу и задай вопрос.
                        <div class="msg-meta">Система</div>
                    </div>
                </div>

                <div class="composer">
                    <textarea id="chatInput" placeholder="Напиши сообщение и нажми Enter… (Shift+Enter — новая строка)"></textarea>

    <div id="deleteChatModal" class="modal-backdrop" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-title">Удалить чат?</div>
            <div class="modal-text">Чат будет удалён для всех устройств этого пользователя.</div>
            <div class="modal-actions">
                <button id="deleteChatCancelBtn" class="modal-btn" type="button">Отмена</button>
                <button id="deleteChatConfirmBtn" class="modal-btn primary" type="button">Удалить</button>
            </div>
        </div>

    <script>
        const modelsById = new Map();
        const chatMessages = document.getElementById('chatMessages');
        const chatList = document.getElementById('chatList');
        const modelSelect = document.getElementById('modelSelect');
        const modelSelectCs = document.getElementById('modelSelectCs');
        const sendBtn = document.getElementById('sendBtn');
        const chatInput = document.getElementById('chatInput');
        const newChatBtn = document.getElementById('newChatBtn');
        const composerHint = document.getElementById('composerHint');
        const puterSignInBtn = document.getElementById('puterSignInBtn');
        const deleteChatModal = document.getElementById('deleteChatModal');
        const deleteChatCancelBtn = document.getElementById('deleteChatCancelBtn');
        const deleteChatConfirmBtn = document.getElementById('deleteChatConfirmBtn');

        const CHAT_TEST_MODE = false;
        const FALLBACK_MODELS = [
            { id: 'gpt-5-nano', provider: 'openai', name: 'GPT-5 nano', context: 0, max_tokens: 0 }
        ];

        const REALTIME_WS_URLS = ['wss://realtime.киносреда.рф/ws'];
        const REALTIME_HTTP_BASE = 'https://realtime.киносреда.рф';
        const LOCAL_CLIENT_ID_KEY = 'aiRealtimeId';
        let REALTIME_ROOM = 'ai-chat';
        let LOCAL_CHAT_KEY = 'aiChatsLocal';
        let LOCAL_CHAT_ID_KEY = 'aiCurrentChatId';

        let isSending = false;
        let isPuterSignedIn = false;
        let ws = null;
        let wsConnected = false;
        let wsReconnectTimer = null;
        let realtimeHttpEnabled = false;
        let realtimePollTimer = null;
        let realtimePollInFlight = false;
        let realtimePollInterval = 900;
        let realtimePollFastUntil = 0;
        let realtimeHttpBase = '';

        const chatSessions = new Map();
        const chatMessagesById = new Map();
        const chatMessageIds = new Map();
        let currentChatId = '';
        let pendingDeleteChatId = '';
        let modelSelectEnhanced = false;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getChevronSVG() {
            return `
                <svg class="cs-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M5 7l5 6 5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            `.trim();
        }

        function closeAllCustomSelects(exceptEl = null) {
            document.querySelectorAll('.cs.open').forEach(cs => {
                if (exceptEl && cs === exceptEl) return;
                cs.classList.remove('open');
            });
        }

        function syncCustomSelect(selectEl) {
            const cs = selectEl?.closest('.cs');
            if (!cs) return;
            const label = cs.querySelector('.cs-label');
            const menu = cs.querySelector('.cs-menu');
            const selected = selectEl.options[selectEl.selectedIndex];
            if (label) label.textContent = (selected ? selected.textContent : '').trim();
            if (menu) {
                const val = String(selectEl.value);
                menu.querySelectorAll('.cs-opt').forEach(btn => {
                    btn.setAttribute('aria-selected', String(btn.dataset.value) === val ? 'true' : 'false');
                });
            }
        }

        function rebuildCustomSelect(selectEl) {
            if (!selectEl) return;
            let cs = selectEl.closest('.cs');
            if (!cs) return;
            const menu = cs.querySelector('.cs-menu');
            if (!menu) return;
            menu.innerHTML = '';
            const search = document.createElement('input');
            search.type = 'text';
            search.className = 'cs-search';
            search.placeholder = 'Поиск модели...';
            menu.appendChild(search);

            const items = [];
            Array.from(selectEl.options).forEach(opt => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'cs-opt';
                item.dataset.value = opt.value;
                item.dataset.label = (opt.textContent || '').toLowerCase();
                item.setAttribute('role', 'option');
                item.textContent = opt.textContent;
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    selectEl.value = opt.value;
                    selectEl.dispatchEvent(new Event('change', { bubbles: true }));
                    syncCustomSelect(selectEl);
                    cs.classList.remove('open');
                });
                menu.appendChild(item);
                items.push(item);
            });
            search.addEventListener('input', () => {
                const q = search.value.trim().toLowerCase();
                items.forEach((item) => {
                    const label = item.dataset.label || '';
                    item.style.display = !q || label.includes(q) ? '' : 'none';
                });
            });
            syncCustomSelect(selectEl);
        }

        function makeCustomSelect(selectEl) {
            if (!selectEl) return;
            let cs = selectEl.closest('.cs');
            if (!cs) {
                cs = document.createElement('div');
                cs.className = 'cs';
                selectEl.parentNode.insertBefore(cs, selectEl);
                cs.appendChild(selectEl);
            }
            let btn = cs.querySelector('.cs-btn');
            if (!btn) {
                btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'cs-btn';
                btn.setAttribute('aria-haspopup', 'listbox');
                btn.innerHTML = `
                    <span class="cs-label"></span>
                    ${getChevronSVG()}
                `;
                cs.appendChild(btn);
            }
            let menu = cs.querySelector('.cs-menu');
            if (!menu) {
                menu = document.createElement('div');
                menu.className = 'cs-menu';
                menu.setAttribute('role', 'listbox');
                cs.appendChild(menu);
            }

            if (!btn.dataset.bound) {
                btn.dataset.bound = '1';
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const willOpen = !cs.classList.contains('open');
                    closeAllCustomSelects(cs);
                    cs.classList.toggle('open', willOpen);
                    syncCustomSelect(selectEl);
                    if (willOpen) {
                        const search = cs.querySelector('.cs-search');
                        if (search) {
                            search.focus();
                            search.select();
                        }
                    }
                });
            }

            if (!selectEl.dataset.bound) {
                selectEl.dataset.bound = '1';
                selectEl.addEventListener('change', () => syncCustomSelect(selectEl));
            }
            rebuildCustomSelect(selectEl);
        }

        function enhanceModelSelect() {
            if (!modelSelect) return;
            makeCustomSelect(modelSelect);
            if (!modelSelectEnhanced) {
                modelSelectEnhanced = true;
                document.addEventListener('click', (e) => {
                    const cs = e.target.closest('.cs');
                    if (!cs) closeAllCustomSelects();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeAllCustomSelects();
                });
            }
        }

        function getSelectedModelLabel() {
            const opt = modelSelect && modelSelect.options[modelSelect.selectedIndex];
            if (opt && opt.textContent) return opt.textContent.trim();
            return 'AI';
        }

        function openDeleteModal(chatId) {
            pendingDeleteChatId = chatId || '';
            if (deleteChatModal) {
                deleteChatModal.classList.add('is-open');
                deleteChatModal.setAttribute('aria-hidden', 'false');
            }
        }

        function closeDeleteModal() {
            pendingDeleteChatId = '';
            if (deleteChatModal) {
                deleteChatModal.classList.remove('is-open');
                deleteChatModal.setAttribute('aria-hidden', 'true');
            }
        }
        function formatMessage(text) {
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        function renderMarkdown(text) {
            const input = text || '';
            if (!window.marked) return formatMessage(input);
            const html = window.marked.parse(input, { breaks: true, gfm: true });
            if (window.DOMPurify) return window.DOMPurify.sanitize(html);
            return html;
        }

        function renderThinking() {
            return `
                <div class="thinking">
                    <span>Думаю</span>
                    <span class="thinking-dots"><span></span><span></span><span></span></span>
                </div>
            `.trim();
        }

        function setAssistantThinking(el, active) {
            if (!el) return;
            if (active) {
                el.innerHTML = renderThinking();
            }
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendMessage(role, text, meta) {
            const msg = document.createElement('div');
            msg.className = `msg ${role}`;
            msg.innerHTML = renderMarkdown(text || '');
            if (meta) {
                const metaEl = document.createElement('div');
                metaEl.className = 'msg-meta';
                metaEl.textContent = meta;
                msg.appendChild(metaEl);
            }
            chatMessages.appendChild(msg);
            scrollToBottom();
            return msg;
        }

        function updateComposerState() {
            const hasModel = Boolean(modelSelect.value);
            sendBtn.disabled = !hasModel || isSending;
            chatInput.disabled = !hasModel || isSending;
            composerHint.textContent = hasModel
                ? `Модель: ${modelSelect.value}`
                : 'Модель пока не выбрана';
        }

        function loadLocalChats() {
            try {
                const raw = localStorage.getItem(LOCAL_CHAT_KEY);
                if (!raw) return;
                const payload = JSON.parse(raw);
                const sessions = Array.isArray(payload.sessions) ? payload.sessions : [];
                const messages = payload.messages && typeof payload.messages === 'object' ? payload.messages : {};
                sessions.forEach((session) => {
                    if (!session || !session.id) return;
                    chatSessions.set(session.id, session);
                });
                Object.keys(messages).forEach((chatId) => {
                    const list = Array.isArray(messages[chatId]) ? messages[chatId] : [];
                    list.forEach((msg) => addMessageToStore(chatId, msg, false));
                });
                currentChatId = localStorage.getItem(LOCAL_CHAT_ID_KEY) || currentChatId;
            } catch (_) {}
        }

        function saveLocalChats() {
            try {
                const sessions = Array.from(chatSessions.values());
                const messages = {};
                chatMessagesById.forEach((list, chatId) => {
                    messages[chatId] = list;
                });
                localStorage.setItem(LOCAL_CHAT_KEY, JSON.stringify({ sessions, messages }));
                if (currentChatId) localStorage.setItem(LOCAL_CHAT_ID_KEY, currentChatId);
            } catch (_) {}
        }

        function getLocalClientId() {
            try {
                const existing = localStorage.getItem(LOCAL_CLIENT_ID_KEY);
                if (existing) return existing;
                const fresh = (crypto && crypto.randomUUID) ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
                localStorage.setItem(LOCAL_CLIENT_ID_KEY, fresh);
                return fresh;
            } catch (_) {
                return `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
            }
        }

        function getCurrentUserName() {
            try {
                const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
                if (currentUser && currentUser.name) return currentUser.name;
            } catch (_) {}
            return 'Guest';
        }

        function getCurrentUserKey() {
            try {
                const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
                if (currentUser && currentUser.username) return String(currentUser.username).trim();
                if (currentUser && currentUser.name) return String(currentUser.name).trim();
            } catch (_) {}
            return 'guest';
        }

        function initChatRoom() {
            const userKey = getCurrentUserKey().replace(/\\s+/g, '_').slice(0, 64) || 'guest';
            REALTIME_ROOM = `ai-chat:${userKey}`;
            LOCAL_CHAT_KEY = `aiChatsLocal:${userKey}`;
            LOCAL_CHAT_ID_KEY = `aiCurrentChatId:${userKey}`;
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            return `${hh}:${mm}`;
        }

        function ensureChatSession(session) {
            if (!session || !session.id) return;
            const existing = chatSessions.get(session.id);
            if (!existing) {
                chatSessions.set(session.id, session);
            } else {
                chatSessions.set(session.id, { ...existing, ...session });
            }
        }

        function removeChatSession(chatId) {
            if (!chatId) return;
            chatSessions.delete(chatId);
            chatMessagesById.delete(chatId);
            chatMessageIds.delete(chatId);
            if (currentChatId === chatId) {
                const first = Array.from(chatSessions.keys())[0] || '';
                currentChatId = first;
                if (!currentChatId) createNewChat();
            }
            saveLocalChats();
            renderChatList();
            renderCurrentChat();
        }

        function confirmDeleteChat() {
            if (!pendingDeleteChatId) return;
            removeChatSession(pendingDeleteChatId);
            sendRealtime({ type: 'chat:delete', chatId: pendingDeleteChatId });
            closeDeleteModal();
        }

        function addMessageToStore(chatId, message, touchUpdatedAt = true) {
            if (!chatId || !message || !message.id) return;
            const list = chatMessagesById.get(chatId) || [];
            const ids = chatMessageIds.get(chatId) || new Set();
            if (ids.has(message.id)) return;
            ids.add(message.id);
            chatMessageIds.set(chatId, ids);
            list.push(message);
            list.sort((a, b) => (a.ts || 0) - (b.ts || 0));
            chatMessagesById.set(chatId, list);
            if (touchUpdatedAt) {
                const session = chatSessions.get(chatId) || { id: chatId };
                session.updatedAt = Math.max(session.updatedAt || 0, message.ts || Date.now());
                if (!session.title || session.title === 'Новый чат') {
                    if (message.role === 'user' && message.content) {
                        session.title = message.content.slice(0, 42);
                    }
                }
                ensureChatSession(session);
            }
        }

        function getChatMessages(chatId) {
            return chatMessagesById.get(chatId) || [];
        }

        function renderChatList() {
            chatList.innerHTML = '';
            const sessions = Array.from(chatSessions.values()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            sessions.forEach((session) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `chat-item${session.id === currentChatId ? ' active' : ''}`;
                btn.innerHTML = `
                    <span class="chat-title">${escapeHtml(session.title || 'Новый чат')}</span>
                    <span class="chat-time">${formatTime(session.updatedAt)}</span>
                    <span class="chat-delete" data-delete="${session.id}">✕</span>
                `;
                btn.addEventListener('click', () => {
                    setCurrentChat(session.id);
                });
                btn.addEventListener('click', (e) => {
                    const del = e.target.closest('[data-delete]');
                    if (!del) return;
                    e.stopPropagation();
                    const id = del.getAttribute('data-delete');
                    if (!id) return;
                    openDeleteModal(id);
                });
                chatList.appendChild(btn);
            });
        }

        function renderCurrentChat() {
            const list = getChatMessages(currentChatId);
            chatMessages.innerHTML = '';
            if (!list.length) {
                appendMessage('ai', 'Чат пуст. Напиши первое сообщение.', 'Система');
                return;
            }
            list.forEach((msg) => {
                const meta = msg.role === 'assistant'
                    ? (msg.modelLabel || msg.modelId || 'AI')
                    : 'Вы';
                appendMessage(msg.role === 'assistant' ? 'ai' : 'user', msg.content, meta);
            });
        }

        function setCurrentChat(chatId) {
            currentChatId = chatId;
            saveLocalChats();
            renderChatList();
            renderCurrentChat();
        }

        function createNewChat() {
            const id = (crypto && crypto.randomUUID) ? crypto.randomUUID() : `chat-${Date.now()}-${Math.random().toString(16).slice(2)}`;
            const session = { id, title: 'Новый чат', updatedAt: Date.now() };
            ensureChatSession(session);
            chatMessagesById.set(id, []);
            chatMessageIds.set(id, new Set());
            currentChatId = id;
            saveLocalChats();
            renderChatList();
            renderCurrentChat();
            sendRealtime({ type: 'chat:session', session });
            return id;
        }

        function extractPartText(part) {
            if (!part) return '';
            if (typeof part === 'string') return part;
            if (part.text) return part.text;
            if (part.delta && part.delta.text) return part.delta.text;
            if (part.message && typeof part.message.content === 'string') return part.message.content;
            if (part.message && Array.isArray(part.message.content)) {
                return part.message.content.map(chunk => chunk.text || '').join('');
            }
            return '';
        }

        function extractResponseText(response) {
            if (!response) return '';
            if (typeof response === 'string') return response;
            if (response.message && typeof response.message.content === 'string') return response.message.content;
            if (response.message && Array.isArray(response.message.content)) {
                return response.message.content.map(chunk => chunk.text || '').join('');
            }
            if (response.text) return response.text;
            return '';
        }

        async function sendMessage() {
            const content = chatInput.value.trim();
            if (!content || isSending) return;
            const modelId = modelSelect.value;
            if (!modelId) return;

            if (!currentChatId) createNewChat();
            const userMessage = {
                id: `msg-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                role: 'user',
                content,
                ts: Date.now()
            };
            addMessageToStore(currentChatId, userMessage);
            saveLocalChats();
            renderChatList();
            appendMessage('user', content, 'Вы');
            sendRealtime({ type: 'chat:message', chatId: currentChatId, message: userMessage });
            chatInput.value = '';
            autoResize();

            const modelLabel = getSelectedModelLabel();
            const assistantEl = appendMessage('ai', '', modelLabel);
            setAssistantThinking(assistantEl, true);
            isSending = true;
            updateComposerState();

            try {
                const useTestMode = CHAT_TEST_MODE;
                const history = getChatMessages(currentChatId).map(msg => ({ role: msg.role, content: msg.content }));
                const response = await puter.ai.chat(history, useTestMode, { model: modelId, stream: true });
                let output = '';

                if (response && response[Symbol.asyncIterator]) {
                    assistantEl.innerHTML = '';
                    for await (const part of response) {
                        const chunk = extractPartText(part);
                        if (!chunk) continue;
                        output += chunk;
                        assistantEl.innerHTML = renderMarkdown(output);
                        scrollToBottom();
                    }
                } else {
                    output = extractResponseText(response);
                    assistantEl.innerHTML = renderMarkdown(output || '');
                }

                if (!output) {
                    assistantEl.innerHTML = renderMarkdown('Нет ответа. Попробуй другую модель или уточни вопрос.');
                }

                const assistantMessage = {
                    id: `msg-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                    role: 'assistant',
                    content: output || '',
                    ts: Date.now(),
                    modelLabel,
                    modelId: modelId || ''
                };
                addMessageToStore(currentChatId, assistantMessage);
                saveLocalChats();
                renderChatList();
                sendRealtime({ type: 'chat:message', chatId: currentChatId, message: assistantMessage });
            } catch (err) {
                const errText = err && err.message ? err.message : 'Не удалось получить ответ.';
                const isAuthErr = /401|unauthorized/i.test(errText);
                assistantEl.innerHTML = renderMarkdown(isAuthErr
                    ? 'Ошибка 401: требуется вход в Puter. Нажми «Войти в Puter» в левом верхнем углу.'
                    : `Ошибка: ${errText}`);
            } finally {
                isSending = false;
                updateComposerState();
            }
        }

        function autoResize() {
            chatInput.style.height = 'auto';
            chatInput.style.height = `${Math.min(chatInput.scrollHeight, 200)}px`;
        }

        async function updateAuthUI() {
            if (!puterSignInBtn) return;
            if (isPuterSignedIn) {
                puterSignInBtn.style.display = 'none';
            } else {
                puterSignInBtn.style.display = '';
            }
        }

        async function initModels() {
            try {
                if (!window.puter || !puter.ai || !puter.ai.listModels) {
                    throw new Error('Puter.js не готов');
                }

                const isSignedIn = puter.auth && typeof puter.auth.isSignedIn === 'function'
                    ? Boolean(await puter.auth.isSignedIn())
                    : false;
                isPuterSignedIn = isSignedIn;
                updateAuthUI();

                let models = [];
                if (isSignedIn) {
                    models = await puter.ai.listModels();
                    if (!Array.isArray(models) || models.length === 0) {
                        throw new Error('Список моделей пуст');
                    }
                } else {
                    models = FALLBACK_MODELS.slice();
                }

                const sorted = models.slice().sort((a, b) => {
                    const ap = (a.provider || '').localeCompare(b.provider || '');
                    if (ap !== 0) return ap;
                    const an = (a.name || a.id || '').toString();
                    const bn = (b.name || b.id || '').toString();
                    return an.localeCompare(bn);
                });

                modelSelect.innerHTML = '';
                sorted.forEach(model => {
                    if (!model || !model.id) return;
                    modelsById.set(model.id, model);
                    const option = document.createElement('option');
                    const label = model.name ? `${model.name}` : `${model.id}`;
                    option.value = model.id;
                    option.textContent = label;
                    modelSelect.appendChild(option);
                });

                const saved = localStorage.getItem('aiSelectedModel');
                if (saved && modelsById.has(saved)) modelSelect.value = saved;
                if (!modelSelect.value && modelSelect.options.length) {
                    modelSelect.value = modelSelect.options[0].value;
                }

                modelSelect.disabled = false;
                enhanceModelSelect();
                updateComposerState();
            } catch (err) {
                const errText = err && err.message ? err.message : 'Не удалось загрузить модели.';
                console.warn(errText);
                appendMessage('ai', 'Не удалось загрузить модели. Проверь соединение или войди в Puter.', 'Система');
                console.warn(err);
            }
        }

        function initProfileName() {
            try {
                const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
                const nameEl = document.getElementById('profileName');
                if (nameEl && currentUser && currentUser.name) nameEl.textContent = currentUser.name;
            } catch (_) {}
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }

        async function signInPuter() {
            if (!window.puter || !puter.auth || typeof puter.auth.signIn !== 'function') return;
            try {
                await puter.auth.signIn({ attempt_temp_user_creation: true });
                isPuterSignedIn = true;
                updateAuthUI();
                await initModels();
            } catch (err) {
                const errText = err && err.message ? err.message : 'Вход не выполнен.';
                appendMessage('ai', `Ошибка входа: ${errText}`, 'Система');
            }
        }

        function sendRealtime(data) {
            if (ws && wsConnected) {
                try { ws.send(JSON.stringify(data)); } catch (_) {}
                return;
            }
            sendRealtimeHttp(data);
        }

        function sendRealtimeHttp(data) {
            if (!realtimeHttpBase || !data) return;
            const localId = getLocalClientId();
            const name = getCurrentUserName() || 'Guest';
            fetch(`${realtimeHttpBase}/event?room=${encodeURIComponent(REALTIME_ROOM)}&id=${encodeURIComponent(localId)}&name=${encodeURIComponent(name)}`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(() => {});
        }

        function scheduleRealtimePoll(delay) {
            if (!realtimeHttpEnabled) return;
            if (realtimePollTimer) clearTimeout(realtimePollTimer);
            realtimePollTimer = window.setTimeout(pollRealtimeState, Math.max(50, delay || 0));
        }

        function pollRealtimeState() {
            if (!realtimeHttpEnabled || !realtimeHttpBase) return;
            if (realtimePollInFlight) return;
            const localId = getLocalClientId();
            const name = getCurrentUserName() || 'Guest';
            realtimePollInFlight = true;
            fetch(`${realtimeHttpBase}/state?room=${encodeURIComponent(REALTIME_ROOM)}&id=${encodeURIComponent(localId)}&name=${encodeURIComponent(name)}`)
                .then((res) => res.json())
                .then((data) => {
                    if (!data) return;
                    if (data.type === 'state') {
                        applyRealtimeState(data);
                    }
                })
                .catch(() => {})
                .finally(() => {
                    realtimePollInFlight = false;
                    const now = performance.now();
                    if (now > (realtimePollFastUntil || 0)) {
                        realtimePollInterval = 1100;
                    }
                    scheduleRealtimePoll(realtimePollInterval);
                });
        }

        function startRealtimeHttp() {
            if (realtimeHttpEnabled) return;
            realtimeHttpBase = REALTIME_HTTP_BASE;
            if (!realtimeHttpBase) return;
            realtimeHttpEnabled = true;
            if (realtimePollTimer) clearTimeout(realtimePollTimer);
            realtimePollInterval = 900;
            realtimePollFastUntil = 0;
            scheduleRealtimePoll(0);
        }

        function connectRealtime() {
            if (!REALTIME_WS_URLS.length) {
                startRealtimeHttp();
                return;
            }
            const localId = getLocalClientId();
            const name = getCurrentUserName() || 'Guest';
            const baseUrl = REALTIME_WS_URLS[0];
            const wsUrl = `${baseUrl}?room=${encodeURIComponent(REALTIME_ROOM)}&id=${encodeURIComponent(localId)}&name=${encodeURIComponent(name)}`;
            try {
                ws = new WebSocket(wsUrl);
            } catch (_) {
                ws = null;
                wsConnected = false;
                if (!wsReconnectTimer) {
                    wsReconnectTimer = setTimeout(() => {
                        wsReconnectTimer = null;
                        connectRealtime();
                    }, 2000);
                }
                startRealtimeHttp();
                return;
            }

            ws.addEventListener('open', () => {
                wsConnected = true;
                if (realtimePollTimer) clearTimeout(realtimePollTimer);
                realtimeHttpEnabled = false;
                syncLocalToServer();
            });

            ws.addEventListener('message', (event) => {
                let data;
                try { data = JSON.parse(event.data); } catch (_) { return; }
                handleRealtimeEvent(data);
            });

            const handleClose = () => {
                wsConnected = false;
                if (ws) ws.close();
                ws = null;
                if (!wsReconnectTimer) {
                    wsReconnectTimer = setTimeout(() => {
                        wsReconnectTimer = null;
                        connectRealtime();
                    }, 2000);
                }
                startRealtimeHttp();
            };
            ws.addEventListener('close', handleClose);
            ws.addEventListener('error', handleClose);
        }

        function handleRealtimeEvent(data) {
            if (!data || typeof data.type !== 'string') return;
            if (data.type === 'state') {
                applyRealtimeState(data);
                return;
            }
            if (data.type === 'chat:session' && data.session) {
                ensureChatSession(data.session);
                saveLocalChats();
                renderChatList();
                return;
            }
            if (data.type === 'chat:message' && data.chatId && data.message) {
                addMessageToStore(data.chatId, data.message);
                saveLocalChats();
                renderChatList();
                if (data.chatId === currentChatId && !isSending) {
                    renderCurrentChat();
                }
                return;
            }
            if (data.type === 'chat:delete' && data.chatId) {
                removeChatSession(data.chatId);
            }
        }

        function applyRealtimeState(data) {
            if (!data || !data.chat) return;
            const sessions = Array.isArray(data.chat.sessions) ? data.chat.sessions : [];
            const messages = data.chat.messages && typeof data.chat.messages === 'object' ? data.chat.messages : {};
            sessions.forEach((session) => ensureChatSession(session));
            Object.keys(messages).forEach((chatId) => {
                const list = Array.isArray(messages[chatId]) ? messages[chatId] : [];
                list.forEach((msg) => addMessageToStore(chatId, msg, false));
            });
            if (!currentChatId && sessions.length) {
                currentChatId = sessions[0].id;
            }
            saveLocalChats();
            renderChatList();
            if (!isSending) renderCurrentChat();
        }

        function syncLocalToServer() {
            chatSessions.forEach((session) => {
                sendRealtime({ type: 'chat:session', session });
            });
            chatMessagesById.forEach((list, chatId) => {
                list.forEach((message) => {
                    sendRealtime({ type: 'chat:message', chatId, message });
                });
            });
        }

        modelSelect.addEventListener('change', () => {
            localStorage.setItem('aiSelectedModel', modelSelect.value);
            syncCustomSelect(modelSelect);
            updateComposerState();
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        chatInput.addEventListener('input', autoResize);
        sendBtn.addEventListener('click', sendMessage);
        newChatBtn.addEventListener('click', () => {
            createNewChat();
        });
        puterSignInBtn.addEventListener('click', signInPuter);
        deleteChatCancelBtn.addEventListener('click', closeDeleteModal);
        deleteChatConfirmBtn.addEventListener('click', confirmDeleteChat);
        deleteChatModal.addEventListener('click', (e) => {
            if (e.target === deleteChatModal) closeDeleteModal();
        });

        initProfileName();
        initChatRoom();
        loadLocalChats();
        if (chatSessions.size) {
            if (!currentChatId) currentChatId = Array.from(chatSessions.keys())[0];
            renderChatList();
            renderCurrentChat();
        } else {
            createNewChat();
        }
        updateComposerState();
        autoResize();
        connectRealtime();
        enhanceModelSelect();

        window.addEventListener('load', () => {
            initModels();
        });
        updateAuthUI();
    </script>
</body>
</html>
