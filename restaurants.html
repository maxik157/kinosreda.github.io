            async function deleteOwnReview(entry) {
                if (!entry || !entry.myReview || state.isSaving) return;

                state.isSaving = true;
                state.reviewMotionLockUntil = Date.now() + 1400;
                updateSaveState();

                try {
                    if (state.db) {
                        await state.db.ref(`${DB_ROOT}/${entry.id}`).update({
                            updatedAt: new Date().toISOString()
                        });
                        await state.db.ref(`${DB_ROOT}/${entry.id}/ratings/${state.userId}`).remove();
                    }

                    removeReviewFromLocalSnapshot(entry.id, state.userId);
                    syncRatingEditorOpen(false);
                    resetDraftComposer({ forceDirty: false, rating: 8.0 });
                    showToast("Отзыв удалён");
                } catch (error) {
                    console.error(error);
                    showToast("Не удалось удалить");
                } finally {
                    state.isSaving = false;
                    updateSaveState();
                }
            }

            async function deleteOwnedRestaurant(entry) {
                if (!entry || !canManageEntry(entry) || state.isSaving) return;

                state.isSaving = true;
                state.reviewMotionLockUntil = Date.now() + 1400;
                updateSaveState();

                try {
                    const now = new Date().toISOString();
                    if (state.db) {
                        await state.db.ref(`${DB_ROOT}/${entry.id}`).update({
                            deletedAt: now,
                            deletedBy: state.userId,
                            deletedByName: state.userName,
                            updatedAt: now
                        });
                    }

                    if (state.selection && state.selection.key === entry.id) {
                        syncRatingEditorOpen(false);
                        syncCardOpen(false);
                    }

                    removeEntryFromLocalSnapshot(entry.id);
                    resetDraftComposer({ forceDirty: false, rating: 8.0 });
                    showToast("Ресторан удалён");
                } catch (error) {
                    console.error(error);
                    showToast("Не удалось удалить ресторан");
                } finally {
                    state.isSaving = false;
                    updateSaveState();
                }
            }

            function setPaintValue(layer, property, value) {
                layer.paint = layer.paint || {};

            function makeScoreBadgeImageId(label, selected) {
                return `${selected ? SCORE_BADGE_SELECTED_IMAGE_PREFIX : SCORE_BADGE_IMAGE_PREFIX}-${hashString(String(label || ""))}`;
            }

            function createScoreBadgeImage(label, selected) {
                const canvas = document.createElement("canvas");
                const size = 128;
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext("2d");
                if (!ctx) return null;

                const center = size / 2;
                const outerRadius = selected ? 51 : 48;
                const text = String(label || "").trim() || "—";
                const fontSize = text.length >= 4 ? 26 : text.length >= 3 ? 30 : 34;

                ctx.clearRect(0, 0, size, size);
                ctx.shadowColor = "rgba(0, 0, 0, 0.38)";
                ctx.shadowBlur = 18;
                ctx.shadowOffsetY = 9;
                ctx.beginPath();
                ctx.arc(center, center, outerRadius + 5, 0, Math.PI * 2);
                ctx.fillStyle = selected ? "rgba(9, 11, 15, 0.98)" : "rgba(8, 10, 13, 0.97)";
                ctx.fill();

                ctx.shadowColor = "transparent";
                ctx.beginPath();
                ctx.arc(center, center, outerRadius, 0, Math.PI * 2);
                ctx.lineWidth = selected ? 2.4 : 2;
                ctx.strokeStyle = selected ? "rgba(255, 224, 163, 1)" : "rgba(255, 245, 228, 0.98)";
                ctx.stroke();

                ctx.font = `700 ${fontSize}px Comfortaa, system-ui, sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#ffe1a6";
                ctx.strokeStyle = "rgba(7, 9, 12, 0.94)";
                ctx.lineWidth = 4;
                ctx.strokeText(text, center, center);
                ctx.fillText(text, center, center);

                return ctx.getImageData(0, 0, size, size);
            }

            function ensureScoreBadgeImages(entries = state.entries) {
                if (!state.map) return;
                const labels = Array.from(new Set((entries || []).map((entry) => getEntryScoreText(entry, "нов."))));

                    if (!state.map.hasImage(normalId)) {
                        const normal = createScoreBadgeImage(label, false);
                        if (normal) {

                        }
                    }

                    const activeId = makeScoreBadgeImageId(label, true);
                    if (!state.map.hasImage(activeId)) {
                        const active = createScoreBadgeImage(label, true);
                        if (active) {
                            state.map.addImage(activeId, active, { pixelRatio: 2 });
                        }
                    }
                });
            }

            function retintMapStyle(style) {
                if (!style || typeof style !== "object" || !Array.isArray(style.layers)) {
                    return style;
                }

                style.layers.forEach((layer) => {
                    const id = String(layer.id || "");

                    if (layer.type === "background") {
                        setPaintValue(layer, "background-color", "#060709");
                    }

                    if (id === "natural_earth") {
                        setPaintValue(layer, "raster-opacity", 0.03);
                    }

                    if (/^park$|^park_|^landuse_|^landcover_/.test(id)) {
                        if (layer.type === "fill") {
                            setPaintValue(layer, "fill-color", /^park$|wood/.test(id) ? "#121612" : "#0e130f");
                            setPaintValue(layer, "fill-opacity", /^park$|wood/.test(id) ? 0.34 : 0.2);
                        }
                        if (layer.type === "line") {
                            setPaintValue(layer, "line-color", "rgba(114, 146, 108, 0.2)");
                        }
                    }

                    if (/water/.test(id)) {
                        if (layer.type === "fill") {
                            setPaintValue(layer, "fill-color", "#12263d");
                        }
                        if (layer.type === "line") {
                            setPaintValue(layer, "line-color", "#27507d");
                            setPaintValue(layer, "line-opacity", 0.46);
                        }
                    }

                    if (/road_|bridge_|tunnel_/.test(id)) {
                        if (layer.type === "fill") {
                            setPaintValue(layer, "fill-color", "#14181d");
                            setPaintValue(layer, "fill-opacity", 0.14);
                        }
                        if (layer.type === "line") {
                            const isCasing = /casing/.test(id);
                            const isMajor = /(motorway|trunk|primary)/.test(id);
                            const isMinor = /(minor|street|service|track|path|pedestrian)/.test(id);
                            setPaintValue(layer, "line-color", isCasing
                                ? (isMajor ? "#2b2014" : "#101317")
                                : (isMajor ? "#7b674f" : isMinor ? "#454a50" : "#5a5f67"));
                            setPaintValue(layer, "line-opacity", isMajor ? 0.8 : (isCasing ? 0.42 : 0.62));
                        }
                    }

                    if (/rail/.test(id) && layer.type === "line") {
                        setPaintValue(layer, "line-color", "#39404a");
                        setPaintValue(layer, "line-opacity", 0.38);
                    }

                    if (/building/.test(id)) {
                        if (layer.type === "fill") {
                            setPaintValue(layer, "fill-color", "#16191d");
                            setPaintValue(layer, "fill-outline-color", "#20252b");
                        }
                        if (layer.type === "fill-extrusion") {
                            setPaintValue(layer, "fill-extrusion-color", "#15191d");
                            setPaintValue(layer, "fill-extrusion-opacity", 0.72);
                        }
                    }

                    if (/boundary/.test(id) && layer.type === "line") {
                        setPaintValue(layer, "line-color", "rgba(245, 158, 11, 0.18)");
                        setPaintValue(layer, "line-opacity", 0.32);
                    }

                    if (layer.type === "symbol") {
                        const textField = layer.layout && layer.layout["text-field"];
                        if (textField && JSON.stringify(textField).includes("name")) {
                            setLayoutValue(layer, "text-field", RUSSIAN_LABEL_EXPRESSION);
                        }
                        if (textField || (layer.paint && layer.paint["text-color"])) {
                            setPaintValue(layer, "text-color", /^label_/.test(id)
                                ? "#eee1cf"
                                : /^poi_|^airport/.test(id)
                                    ? "#d8ccb9"
                                    : /^highway-name/.test(id)
                                        ? "#d2c4b2"
                                        : /water/.test(id)
                                            ? "#9bb8df"
                                            : "#ddd0bf");
                            setPaintValue(layer, "text-halo-color", "rgba(6, 7, 9, 0.94)");
                            setPaintValue(layer, "text-halo-width", 1.3);
                        }
                        if (/^poi_/.test(id)) {
                            setPaintValue(layer, "text-opacity", ["interpolate", ["linear"], ["zoom"], 13, 0, 14.6, 0.58]);
                            setPaintValue(layer, "icon-opacity", ["interpolate", ["linear"], ["zoom"], 13, 0, 14.6, 0.48]);
                        }
                    }
                });

                return style;
            }

            async function waitForNominatimSlot() {
                const elapsed = Date.now() - state.lastNominatimAt;
                const wait = Math.max(0, 1100 - elapsed);
                if (wait) {
                    await new Promise((resolve) => setTimeout(resolve, wait));
                }

            function readGeocache() {
                try {
                    const raw = safeStorageGet(GEOCACHE_KEY);
                    if (!raw) return { reverse: {} };
                    const parsed = JSON.parse(raw);
                    return {
                        reverse: parsed && parsed.reverse && typeof parsed.reverse === "object"
                            ? parsed.reverse
                            : {}
                    };
                } catch (_) {
                    return { reverse: {} };
                }
            }

            function persistGeocache() {
                safeStorageSet(GEOCACHE_KEY, JSON.stringify(state.geocache));
            }

            async function fetchJsonWithNominatim(url) {
                await waitForNominatimSlot();
                const response = await fetch(url, {
                    headers: {
                        Accept: "application/json"
                    },
                    referrerPolicy: "origin"
                });
                if (!response.ok) {
                    throw new Error(`nominatim_${response.status}`);
                }
                return response.json();
            }

            async function reverseGeocode(coords) {
                const cacheKey = `${Number(coords[0]).toFixed(4)},${Number(coords[1]).toFixed(4)}`;
                if (state.geocache.reverse[cacheKey]) {
                    return state.geocache.reverse[cacheKey];
                }

                const url = new URL(`${NOMINATIM_BASE}/reverse`);
                url.searchParams.set("format", "jsonv2");
                url.searchParams.set("accept-language", "ru");
                url.searchParams.set("addressdetails", "1");
                url.searchParams.set("namedetails", "1");
                url.searchParams.set("extratags", "1");
                url.searchParams.set("zoom", "18");
                url.searchParams.set("lat", String(coords[0]));
                url.searchParams.set("lon", String(coords[1]));

                try {
                    const result = await fetchJsonWithNominatim(url.toString());
                    state.geocache.reverse[cacheKey] = result;
                    persistGeocache();
                    return result;
                } catch (error) {
                    console.error(error);
                    return null;
                }
            }

            async function select(selection, options = {}) {
                const previousKey = state.selection ? state.selection.key : "";
                const nextSelection = {
                    ...selection,
                    key: selection.key || selection.id || buildSelectionId(selection)
                };
                state.selection = nextSelection;
                syncRankingOpen(false);
                syncCardOpen(true);

                if (state.selection.key !== previousKey) {
                    hydrateDraftFromSelection();
                }

                renderAll();

                if (state.map && options.fly) {
                    state.map.easeTo({
                        center: [state.selection.coords[1], state.selection.coords[0]],
                        zoom: Math.max(state.map.getZoom(), 15),
                        duration: 520,
                        essential: true
                    });
                }

                const shouldResolveDraft = state.selection.source === "draft" && options.resolveAddress !== false;
                const shouldEnrichSaved = state.selection.source === "saved" && !hasHouseInAddress(state.selection.address || "");

                if (shouldResolveDraft || shouldEnrichSaved) {
                    const reverse = await reverseGeocode(state.selection.coords);
                    if (reverse && state.selection && state.selection.key === nextSelection.key) {
                        const fullAddress = formatAddressFromNominatim(reverse, state.selection.coords, true);
                        if (state.selection.source === "draft") {
                            const suggestedName = derivePlaceName(reverse);
                            state.selection = {
                                ...state.selection,
                                name: state.selection.name || suggestedName,
                                address: fullAddress,
                                fullAddress: fullAddress,
                                editableName: true
                            };
                            renderSelection();
                            refreshMapData();
                            return;
                        }

                        const currentEntry = getSelectionEntry();
                        if (currentEntry && fullAddress && fullAddress !== currentEntry.address && hasHouseInAddress(fullAddress)) {
                            patchEntryMetaInLocalSnapshot(currentEntry.id, { address: fullAddress });
                            if (state.db) {
                                state.db.ref(`${DB_ROOT}/${currentEntry.id}`).update({
                                    address: fullAddress,
                                    updatedAt: new Date().toISOString()
                                }).catch((error) => {
                                    console.error(error);
                                });
                            }
                        }
                    }
                }
            }

            function updateLocalSnapshot(entryId, entryPayload, reviewPayload) {
                const next = { ...state.entriesRaw };
                const existing = next[entryId] && typeof next[entryId] === "object" ? next[entryId] : {};
                const ratings = existing.ratings && typeof existing.ratings === "object" ? existing.ratings : {};
                next[entryId] = {
                    ...existing,
                    ...entryPayload,
                    ratings: {
                        ...ratings,
                        [state.userId]: {
                            ...(ratings[state.userId] && typeof ratings[state.userId] === "object" ? ratings[state.userId] : {}),
                            ...reviewPayload
                        }
                    }
                };
                applyEntries(next);
            }

            async function uploadToPostimages(imageBlob, fileName) {
                if (!imageBlob) throw new Error("postimages_invalid");
                const formData = new FormData();
                if (POSTIMAGES_API_KEY) {
                    formData.append("key", POSTIMAGES_API_KEY);
                }
                formData.append("image", imageBlob, fileName || "restaurant-photo.jpg");
                const response = await fetch(getPostimagesProxyEndpoint(), {
                    method: "POST",
                    body: formData
                });
                if (!response.ok) throw new Error("postimages_failed");
                const rawText = await response.text();
                let payload = null;
                try {
                    payload = JSON.parse(rawText);
                } catch (_) {
                    payload = null;
                }
                const link =
                    payload?.url ||
                    payload?.data?.[0]?.link ||
                    payload?.data?.[0]?.short_link ||
                    payload?.data?.[0]?.url ||
                    payload?.data?.[0]?.image_url ||
                    payload?.data?.url ||
                    payload?.data?.link ||
                    payload?.data?.display_url ||
                    payload?.data?.image?.url ||
                    payload?.data?.image?.display_url ||
                    payload?.result?.url ||
                    payload?.result?.link ||
                    payload?.image?.url ||
                    payload?.direct_url ||
                    payload?.image_url ||
                    (typeof rawText === "string" ? rawText.match(/https?:\/\/[^\s"']+/)?.[0] : "");
                if (!link) throw new Error("postimages_no_url");
                return link;
            }

            function loadImageFromFile(file) {
                return new Promise((resolve, reject) => {
                    const objectUrl = URL.createObjectURL(file);
                    const image = new Image();
                    image.onload = () => {
                        URL.revokeObjectURL(objectUrl);
                        resolve(image);
                    };
                    image.onerror = (error) => {
                        URL.revokeObjectURL(objectUrl);
                        reject(error);
                    };
                    image.src = objectUrl;
                });
            }

            async function preparePhotoBlob(file) {
                if (!(file instanceof Blob)) {
                    throw new Error("photo_invalid");
                }
                if (!/^image\//i.test(file.type || "")) {
                    throw new Error("photo_type_invalid");
                }

                const image = await loadImageFromFile(file);
                const width = image.naturalWidth || image.width || 0;
                const height = image.naturalHeight || image.height || 0;
                if (!width || !height) {
                    return file;
                }

                const scale = Math.min(1, MAX_UPLOAD_DIMENSION / Math.max(width, height));
                const shouldResize = scale < 0.999;
                const shouldCompress = file.size > MAX_PHOTO_BYTES || file.type === "image/png";
                if (!shouldResize && !shouldCompress) {
                    return file;
                }

                const canvas = document.createElement("canvas");
                canvas.width = Math.max(1, Math.round(width * scale));
                canvas.height = Math.max(1, Math.round(height * scale));
                const ctx = canvas.getContext("2d");
                if (!ctx) return file;
                ctx.fillStyle = "#0b0d10";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

                const blob = await new Promise((resolve, reject) => {
                    canvas.toBlob((nextBlob) => {
                        if (nextBlob) {
                            resolve(nextBlob);
                            return;
                        }
                        reject(new Error("photo_compress_failed"));
                    }, "image/jpeg", 0.88);
                });

                return blob;
            }

            async function uploadDraftPhoto(itemId, file) {
                try {
                    const prepared = await preparePhotoBlob(file);
                    const hostedUrl = await uploadToPostimages(prepared, file.name || "restaurant-photo.jpg");
                    const target = state.draftPhotos.find((item) => item.id === itemId);
                    if (!target) return;
                    if (target.previewUrl && target.previewUrl.startsWith("blob:")) {
                        URL.revokeObjectURL(target.previewUrl);
                    }
                    target.url = hostedUrl;
                    target.previewUrl = hostedUrl;
                    target.status = "done";
                    renderDraftPhotos();
                    updateSaveState();
                } catch (error) {
                    console.error(error);
                    const target = state.draftPhotos.find((item) => item.id === itemId);
                    if (!target) return;
                    target.status = "error";
                    renderDraftPhotos();
                    updateSaveState();
                    showToast("Не удалось загрузить фото");
                }
            }

            function handlePhotoInput(event) {
                const input = event.target;
                const files = Array.from(input.files || []);
                if (!files.length) return;

                const room = Math.max(0, MAX_PHOTO_COUNT - state.draftPhotos.length);
                if (!room) {
                    showToast("Лимит фото достигнут");
                    input.value = "";
                    return;
                }

                files.slice(0, room).forEach((file) => {
                    const previewUrl = URL.createObjectURL(file);
                    const id = `draft_photo_${Date.now()}_${hashString(`${file.name}_${file.size}_${Math.random()}`)}`;
                    state.draftPhotos.push({
                        id,
                        url: "",
                        previewUrl,
                        status: "uploading"
                    });
                    uploadDraftPhoto(id, file);
                });

                markFormDirty();
                renderDraftPhotos();
                input.value = "";
            }

            async function saveReview(event, options = {}) {
                event.preventDefault();
                if (!state.selection || state.isSaving || hasUploadingPhotos()) return;

                if (
                    state.selection.source === "draft"
                    && (
                        !hasHouseInAddress(state.selection.fullAddress || state.selection.address)
                        || !getPendingName()
                    )
                ) {
                    const reverse = await reverseGeocode(state.selection.coords);
                    if (reverse && state.selection && state.selection.source === "draft") {
                        const suggestedName = derivePlaceName(reverse);
                        const resolvedAddress = formatAddressFromNominatim(reverse, state.selection.coords, true);
                        state.selection = {
                            ...state.selection,
                            name: state.selection.name || suggestedName,
                            address: resolvedAddress,
                            fullAddress: resolvedAddress,
                            editableName: true
                        };
                        if (!String(els.nameInput.value || "").trim() && suggestedName) {
                            els.nameInput.value = suggestedName;
                        }
                        renderSelection();
                    }
                }

                const name = getPendingName();
                if (!name) {
                    showToast("Введите название");
                    return;
                }

                const rating = clampRating(state.draftRating);
                const entryId = buildSelectionId({
                    ...state.selection,
                    name
                });
                const existing = state.entryMap.get(entryId) || getSelectionEntry();
                const myReview = existing ? existing.myReview : null;
                const now = new Date().toISOString();
                const rawReviewText = String(els.reviewInput.value || "").trim().slice(0, 260);
                const uploadedPhotos = state.draftPhotos
                    .filter((item) => item.status === "done" && item.url)
                    .map((item) => item.url)
                    .slice(0, MAX_PHOTO_COUNT);

                const entryPayload = {
                    name,
                    address: String(state.selection.fullAddress || state.selection.address || "Смоленск").trim(),
                    coords: state.selection.coords.slice(),
                    source: state.selection.osmType && state.selection.osmId ? "osm" : "custom",
                    osmType: state.selection.osmType || "",
                    osmId: state.selection.osmId || "",
                    createdBy: existing ? (existing.createdBy || state.userId) : state.userId,
                    createdByName: existing ? (existing.createdByName || state.userName) : state.userName,
                    createdAt: existing ? existing.createdAt : now,
                    updatedAt: now
                };

                const renameOnly = Boolean(
                    existing
                    && state.selection.source === "saved"
                    && state.selection.editableName
                    && name !== existing.name
                    && !state.editingOwnReview
                    && !rawReviewText
                    && !uploadedPhotos.length
                    && (!myReview || Math.abs(rating - myReview.rating) < 0.001)
                );

                const reviewPayload = {
                    userId: state.userId,
                    user: state.userName,
                    avatarUrl: state.userAvatarUrl,
                    rating,
                    scale: 10,
                    version: 2,
                    text: (
                        state.editingOwnReview
                            ? rawReviewText
                            : (rawReviewText || (myReview ? myReview.text : ""))
                    ),
                    photos: (() => {
                        if (state.editingOwnReview) {
                            return uploadedPhotos;
                        }
                        return uploadedPhotos.length ? uploadedPhotos : (myReview ? myReview.photos : []);
                    })(),
                    createdAt: myReview ? myReview.createdAt : now,
                    updatedAt: now
                };

                state.isSaving = true;
                state.reviewMotionLockUntil = Date.now() + 1400;
                updateSaveState();

                try {
                    if (state.db) {
                        await state.db.ref(`${DB_ROOT}/${entryId}`).update(entryPayload);
                        if (!renameOnly) {
                            await state.db.ref(`${DB_ROOT}/${entryId}/ratings/${state.userId}`).update(reviewPayload);
                        }
                    }
                    state.selection = {
                        ...state.selection,
                        ...entryPayload,
                        id: entryId,
                        key: entryId,
                        name,
                        address: entryPayload.address,
                        fullAddress: entryPayload.address,
                        editableName: false,
                        source: "saved"
                    };
                    if (renameOnly) {
                        patchEntryMetaInLocalSnapshot(entryId, entryPayload);
                    } else {
                        updateLocalSnapshot(entryId, entryPayload, reviewPayload);
                    }
                    if (options.closeAfterSave === false) {
                        state.editingOwnReview = true;
                        state.composerMode = options.preserveComposerMode || state.composerMode || "rating";
                        state.formDirty = false;
                        renderDraftRating();
                        renderDraftPhotos();
                        updateComposerVisibility();
                    } else {
                        syncRatingEditorOpen(false);
                        resetDraftComposer({ forceDirty: false, rating });
                    }
                    if (!options.quiet) {
                        showToast(renameOnly ? "Название обновлено" : (existing ? "Отзыв обновлён" : "Место добавлено"));
                    }
                } catch (error) {
                    console.error(error);
                    if (!options.quiet) {
                        showToast("Не удалось сохранить");
                    }
                } finally {
                    state.isSaving = false;
                    updateSaveState();
                }
            }

            function getClickedEntry(point) {
                if (!state.map) return null;
                const features = state.map.queryRenderedFeatures(point, {
                    layers: RESTAURANT_INTERACTIVE_LAYERS.filter((layerId) => state.map.getLayer(layerId))
                });
                const feature = features.find((item) => item && item.properties && item.properties.id);
                if (!feature) return null;
                return state.entryMap.get(String(feature.properties.id)) || null;
            }

            async function initMap() {
                const style = await loadMapStyle();
                state.map = new maplibregl.Map({
                    container: "map",
                    style,
                    center: [SMOLENSK_CENTER[1], SMOLENSK_CENTER[0]],
                    zoom: 12.4,
                    attributionControl: false,
                    maxPitch: 0,
                    maxBounds: SMOLENSK_BOUNDS
                });

                state.map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

                state.map.on("load", () => {
                    state.map.dragRotate.disable();
                    if (state.map.touchZoomRotate) {
                        state.map.touchZoomRotate.disableRotation();
                    }
                    ensureMapLayers();
                    refreshMapData();
                });

                state.map.on("mousemove", (event) => {
                    const hoveredEntry = getClickedEntry(event.point);
                    state.map.getCanvas().style.cursor = hoveredEntry ? "pointer" : "";
                });

                state.map.on("click", (event) => {
                    syncRankingOpen(false);
                    const entry = getClickedEntry(event.point);
                    if (entry) {
                        select(entryToSelection(entry), { fly: false });
                        return;
                    }
                    const coords = [event.lngLat.lat, event.lngLat.lng];
                    select(createDraftSelection(coords), { fly: false, resolveAddress: true });
                });

                state.map.on("error", (event) => {
                    console.error(event && event.error ? event.error : event);
                });
            }

            function initFirebase() {
                try {
                    try {
                        if (firebase.database && firebase.database.INTERNAL && typeof firebase.database.INTERNAL.forceLongPolling === "function") {
                            firebase.database.INTERNAL.forceLongPolling();
                        }
                    } catch (_) {}

                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }

                    state.db = firebase.database();
                    state.db.ref(DB_ROOT).on("value", (snapshot) => {
                        applyEntries(snapshot.val() || {});
                    }, (error) => {
                        console.error(error);
                        showToast("Нет связи с базой");
                    });
                } catch (error) {
                    console.error(error);
                    showToast("Firebase недоступен");
                }
            }

            function bindEvents() {
                els.rankingToggle.addEventListener("click", () => {
                    closeAllReviewReactionMenus();
                    syncRankingOpen(!state.rankingOpen);
                });

                els.rankingScrim.addEventListener("click", () => {
                    closeAllReviewReactionMenus();
                    syncRankingOpen(false);
                });

                els.filterButtons.forEach((button) => {
                    button.addEventListener("click", () => {
                        state.filter = button.dataset.filter || "top";
                        safeStorageSet(FILTER_KEY, state.filter);
                        renderRanking();
                    });
                });

                ["pointerdown", "click"].forEach((eventName) => {
                    els.detailCard.addEventListener(eventName, (event) => {
                        event.stopPropagation();
                    });
                });

                els.detailCard.addEventListener("click", (event) => {
                    if (!event.target.closest("[data-review-reaction-box]")) {
                        closeAllReviewReactionMenus();
                    }
                });

                els.scorePanel.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    closeAllReviewReactionMenus();
                    const entry = getSelectionEntry();
                    if (entry && entry.myReview && !state.editingOwnReview) {
                        loadOwnReviewIntoComposer(entry.myReview, { mode: "rating", focusTarget: "rating" });
                        return;
                    }
                    if (entry && entry.myReview && state.editingOwnReview && state.composerMode === "rating" && state.ratingEditorOpen) {
                        syncRatingEditorOpen(false);
                        resetDraftComposer({ forceDirty: false, rating: entry.myReview.rating });
                        return;
                    }
                    syncRatingEditorOpen(!state.ratingEditorOpen);
                });

                els.placeTitle.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    closeAllReviewReactionMenus();
                    activateTitleRename();
                });

                els.restaurantDeleteButton.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    closeAllReviewReactionMenus();
                    const entry = getSelectionEntry();
                    if (entry) {
                        openDeleteModal("restaurant", entry.id);
                    }
                });

                els.cardCloseButton.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    closeAllReviewReactionMenus();
                    syncCardOpen(false);
                });

                els.ratingRange.addEventListener("input", (event) => {
                    state.draftRating = clampRating(Number(event.target.value) / 10);
                    renderDraftRating();
                    markFormDirty();
                    if (state.composerMode === "rating" && state.editingOwnReview) {
                        scheduleRatingAutosave(false);
                    }
                });

                els.ratingRange.addEventListener("change", () => {
                    if (state.composerMode === "rating" && state.editingOwnReview) {
                        scheduleRatingAutosave(true);
                    }
                });

                els.photoInput.addEventListener("change", handlePhotoInput);
                els.nameInput.addEventListener("input", handleNameInput);
                els.nameInput.addEventListener("blur", () => {
                    commitInlineNameEdit().catch((error) => {
                        console.error(error);
                    });
                });
                els.reviewInput.addEventListener("input", markFormDirty);
                els.reviewForm.addEventListener("submit", saveReview);
                els.reviewsList.addEventListener("scroll", closeAllReviewReactionMenus, { passive: true });

                els.photoLightboxPrev.addEventListener("click", () => {
                    stepPhotoLightbox(-1);
                });
                els.photoLightboxNext.addEventListener("click", () => {
                    stepPhotoLightbox(1);
                });
                els.photoLightboxClose.addEventListener("click", closePhotoLightbox);
                els.photoLightbox.addEventListener("click", (event) => {
                    if (event.target === els.photoLightbox) {
                        closePhotoLightbox();
                    }
                });

                els.confirmCancel.addEventListener("click", closeDeleteModal);
                els.confirmAccept.addEventListener("click", confirmDeleteAction);
                els.confirmModal.addEventListener("click", (event) => {
                    if (event.target === els.confirmModal) {
                        closeDeleteModal();
                    }
                });

                document.addEventListener("keydown", (event) => {
                    if (event.key === "Escape" && state.lightboxUrl) {
                        closePhotoLightbox();
                        return;
                    }
                    if (state.lightboxUrl && event.key === "ArrowLeft") {
                        stepPhotoLightbox(-1);
                        return;
                    }
                    if (state.lightboxUrl && event.key === "ArrowRight") {
                        stepPhotoLightbox(1);
                        return;
                    }
                    if (event.key === "Escape" && state.pendingDeleteEntryId) {
                        closeDeleteModal();
                        return;
                    }
                    if (event.key === "Escape" && els.reviewsList.querySelector(".review-reaction-menu.is-open")) {
                        closeAllReviewReactionMenus();
                        return;
                    }
                    if (event.key === "Escape" && state.rankingOpen) {
                        syncRankingOpen(false);
                        return;
                    }
                    if (event.key === "Escape" && state.ratingEditorOpen) {
                        syncRatingEditorOpen(false);
                    }
                });
            }

            function bootstrap() {
                const currentUser = readCurrentUser();
                state.userName = currentUser.name;
                state.userId = currentUser.userId;
                state.userAvatarUrl = currentUser.avatarUrl || "";
                if (state.userId && state.userAvatarUrl) {
                    state.avatarCache.set(state.userId, state.userAvatarUrl);
                }
                state.filter = safeStorageGet(FILTER_KEY) || "top";
                state.geocache = readGeocache();

                bindEvents();
                syncCardOpen(true);
                renderDraftRating();
                renderAll();
                initMap();
                initFirebase();
            }

            bootstrap();
        })();
    </script>
</body>
</html>
