<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="origin">
    <title>Рестораны Смоленска — Киносреда</title>
    <link rel="stylesheet" href="comfortaa.css">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23080a0d'/%3E%3Cpath d='M23 31h54a8 8 0 0 1 8 8v5c0 12.7-10.3 23-23 23H38c-12.7 0-23-10.3-23-23v-5a8 8 0 0 1 8-8Z' fill='%23f2c58c'/%3E%3Cpath d='M29 22a4 4 0 0 1 4 4v13a4 4 0 1 1-8 0V26a4 4 0 0 1 4-4Zm42 0a4 4 0 0 1 4 4v13a4 4 0 1 1-8 0V26a4 4 0 0 1 4-4Z' fill='%23fff3df'/%3E%3Ccircle cx='36' cy='47' r='3.6' fill='%23080a0d'/%3E%3Ccircle cx='50' cy='47' r='3.6' fill='%23080a0d'/%3E%3Ccircle cx='64' cy='47' r='3.6' fill='%23080a0d'/%3E%3C/svg%3E">
    <script>
        (function () {
            try {
                const currentUser = localStorage.getItem("currentUser");
                if (!currentUser) {
                    location.replace("login.html");
                    return;
                }
                document.documentElement.classList.add("authed");
            } catch (_) {
                location.replace("login.html");
            }
        })();
    </script>
    <style>
        :root {
            --bg: #050607;
            --surface: rgba(9, 11, 14, 0.8);
            --surface-strong: rgba(8, 10, 13, 0.94);
            --surface-soft: rgba(255, 255, 255, 0.04);
            --line: rgba(245, 158, 11, 0.14);
            --line-soft: rgba(255, 255, 255, 0.08);
            --line-strong: rgba(245, 158, 11, 0.28);
            --text: #fff5e6;
            --text-soft: rgba(255, 245, 230, 0.72);
            --text-faint: rgba(255, 245, 230, 0.42);
            --accent: #f59e0b;
            --accent-soft: rgba(245, 158, 11, 0.16);
            --accent-strong: #ffcf76;
            --cool: #9abfff;
            --shadow: 0 24px 72px rgba(0, 0, 0, 0.38);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 18px;
            --radius-sm: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Comfortaa", cursive;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        html:not(.authed) body {
            visibility: hidden;
        }

        body {
            overflow: hidden;
            position: relative;
        }

        #map,
        .map-chrome,
        .ranking-scrim {
            position: fixed;
            inset: 0;
        }

        #map {
            z-index: 0;
            background: #060709;
        }

        .map-chrome {
            display: none;
        }

        .glass {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015)),
                var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04), transparent 40%, transparent 65%, rgba(255, 255, 255, 0.03));
            pointer-events: none;
        }

        .topbar {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 8;
            pointer-events: none;
        }

        .ranking-toggle,
        .ranking-dock,
        .ranking-scrim,
        .detail-card,
        .photo-lightbox,
        .toast {
            pointer-events: auto;
        }

        .owner-action {
            width: 52px;
            height: 52px;
            border-radius: 999px;
            display: inline-grid;
            place-items: center;
            color: var(--accent-strong);
            background-color: transparent;
            transition:
                transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
                border-color 200ms ease,
                background-color 200ms ease;
            animation: surfaceIn 620ms cubic-bezier(0.2, 1, 0.3, 1) both;
        }

        .owner-action:hover {
            transform: translateY(-1px);
            border-color: var(--line-strong);
            background:
                linear-gradient(180deg, rgba(245, 158, 11, 0.14), rgba(245, 158, 11, 0.06)),
                var(--surface-strong);
        }

        .owner-action[hidden] {
            display: none;
        }

        .owner-action svg {
            width: 18px;
            height: 18px;
            display: block;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ranking-toggle {
            appearance: none;
            min-width: 164px;
            height: 64px;
            padding: 0 10px 0 20px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background-color: transparent;
            color: var(--text);
            font: inherit;
            cursor: pointer;
            transition:
                transform 200ms ease,
                border-color 200ms ease,
                background-color 200ms ease,
                box-shadow 200ms ease;
            animation: surfaceIn 620ms cubic-bezier(0.2, 1, 0.3, 1) both;
        }

        .ranking-toggle:hover {
            transform: translateY(-1px);
            border-color: var(--line-strong);
        }

        .ranking-toggle.is-active {
            border-color: var(--line-strong);
            background:
                linear-gradient(180deg, rgba(245, 158, 11, 0.14), rgba(245, 158, 11, 0.06)),
                var(--surface-strong);
        }

        .ranking-toggle span {
            font-size: 0.92rem;
            font-weight: 700;
        }

        .ranking-toggle b {
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            border-radius: 999px;
            display: inline-grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.06);
            color: var(--accent-strong);
            font-size: 0.86rem;
            font-weight: 700;
        }

        .ranking-scrim {
            z-index: 5;
            border: 0;
            background: rgba(4, 6, 8, 0.34);
            opacity: 0;
            pointer-events: none;
            transition: opacity 220ms ease;
        }

        .ranking-dock {
            position: fixed;
            top: 94px;
            left: 18px;
            bottom: 18px;
            width: 328px;
            z-index: 6;
            border-radius: var(--radius-xl);
            padding: 18px;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 14px;
            transform: translateX(-26px) scale(0.985);
            opacity: 0;
            pointer-events: none;
            transition: transform 220ms ease, opacity 220ms ease;
        }

        body.is-ranking-open .ranking-scrim {
            opacity: 1;
            pointer-events: auto;
        }

        body.is-ranking-open .ranking-dock {
            transform: translateX(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .dock-head {
            display: grid;
            gap: 12px;
        }

        .dock-title {
            font-size: 1.34rem;
            font-weight: 700;
        }

        .segmented {
            display: inline-flex;
            gap: 6px;
            width: fit-content;
            padding: 4px;
            border-radius: 999px;
            border: 1px solid var(--line-soft);
            background: rgba(255, 255, 255, 0.025);
        }

        .filter-btn,
        .rank-item,
        .save-btn,
        .photo-picker,
        .photo-remove,
        .review-photo,
        .photo-lightbox-close {
            appearance: none;
            border: 1px solid transparent;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
            transition:
                transform 180ms ease,
                border-color 180ms ease,
                background-color 180ms ease,
                color 180ms ease,
                opacity 180ms ease;
        }

        .filter-btn {
            min-height: 38px;
            padding: 0 14px;
            border-radius: 999px;
            color: var(--text-soft);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .filter-btn:hover,
        .rank-item:hover,
        .save-btn:hover,
        .photo-picker:hover,
        .photo-remove:hover,
        .review-photo:hover,
        .photo-lightbox-close:hover {
            transform: translateY(-1px);
        }

        .filter-btn.is-active {
            border-color: rgba(245, 158, 11, 0.18);
            background: rgba(245, 158, 11, 0.12);
            color: var(--text);
        }

        .ranking-list,
        .reviews-list {
            overflow: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(245, 158, 11, 0.32) transparent;
        }

        .ranking-list::-webkit-scrollbar,
        .reviews-list::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .ranking-list::-webkit-scrollbar-thumb,
        .reviews-list::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.22);
            border-radius: 999px;
        }

        .ranking-list {
            display: grid;
            gap: 10px;
            padding-right: 4px;
            align-content: start;
        }

        .rank-item {
            width: 100%;
            padding: 14px 14px 14px 16px;
            border-radius: 18px;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.025);
            text-align: left;
            animation: listIn 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
            animation-delay: calc(var(--stagger, 0) * 26ms);
        }

        .rank-item.is-selected {
            border-color: rgba(245, 158, 11, 0.24);
            background: rgba(245, 158, 11, 0.08);
        }

        .rank-index {
            color: var(--text-faint);
            min-width: 18px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: none;
            font-variant-numeric: tabular-nums;
        }

        .rank-copy {
            min-width: 0;
        }

        .rank-copy strong {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.88rem;
            font-weight: 700;
        }

        .rank-copy span {
            display: block;
            margin-top: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-soft);
            font-size: 0.72rem;
            line-height: 1.4;
        }

        .rank-address {
            position: relative;
            cursor: help;
        }

        .rank-address::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 0;
            top: calc(100% + 10px);
            max-width: min(280px, calc(100vw - 48px));
            padding: 10px 12px;
            border: 1px solid rgba(245, 158, 11, 0.16);
            border-radius: 14px;
            background: rgba(8, 10, 13, 0.96);
            color: var(--text);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
            white-space: normal;
            line-height: 1.45;
            opacity: 0;
            transform: translateY(-4px);
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
            z-index: 3;
        }

        .rank-address:hover::after,
        .rank-item:focus-visible .rank-address::after {
            opacity: 1;
            transform: translateY(0);
        }

        .rank-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            color: var(--text-faint);
            font-size: 0.64rem;
            line-height: 1.2;
        }

        .rank-meta i {
            width: 3px;
            height: 3px;
            flex: 0 0 auto;
            border-radius: 999px;
            background: rgba(255, 245, 230, 0.22);
        }

        .rank-score {
            color: var(--accent-strong);
            font-size: 0.9rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .detail-card {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: min(372px, calc(100vw - 36px));
            max-height: calc(100vh - 36px);
            z-index: 6;
            border-radius: var(--radius-xl);
            padding: 14px;
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            gap: 12px;
            overflow: visible;
            isolation: isolate;
            transform-origin: right bottom;
            transform: translate3d(0, 0, 0) scale(1) rotateX(0deg);
            filter: blur(0);
            will-change: transform, opacity, filter;
            transition:
                visibility 0s linear 0s;
        }

        .detail-card.is-opening {
            animation: cardIntro 820ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .detail-card.is-closing {
            pointer-events: none;
            animation: cardOutro 820ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .detail-card::before,
        .detail-card::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            border-radius: inherit;
            pointer-events: none;
        }

        .detail-card::before {
            inset: -18px;
            border-radius: calc(var(--radius-xl) + 18px);
            background:
                radial-gradient(circle at 82% 18%, rgba(245, 158, 11, 0.18), transparent 38%),
                radial-gradient(circle at 12% 100%, rgba(99, 169, 255, 0.12), transparent 46%);
            opacity: 0.9;
            filter: blur(18px);
            transform: translate3d(0, 0, 0) scale(1);
        }

        .detail-card::after {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 28%, transparent 72%, rgba(245, 158, 11, 0.08)),
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0));
            opacity: 0.72;
            transform: translate3d(0, 0, 0);
        }

        .detail-card > * {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
            filter: blur(0);
        }

        body.is-card-open .detail-card:not(.is-hidden) > * {
            animation: cardContentIn 560ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        body.is-card-open .detail-card:not(.is-hidden) > :nth-child(1) {
            animation-delay: 60ms;
        }

        body.is-card-open .detail-card:not(.is-hidden) > :nth-child(2) {
            animation-delay: 120ms;
        }

        body.is-card-open .detail-card:not(.is-hidden) > :nth-child(3) {
            animation-delay: 180ms;
        }

        body.is-card-open .detail-card:not(.is-hidden) > :nth-child(4) {
            animation-delay: 240ms;
        }

        .detail-floating-action {
            position: absolute;
            right: 0;
            bottom: calc(100% + 10px);
            z-index: 2;
        }

        .detail-head {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
        }

        .detail-copy {
            min-width: 0;
            display: grid;
            gap: 4px;
        }

        .detail-card.is-hidden,
        body.is-card-hidden .detail-card {
            opacity: 0;
            transform: translate3d(0, 34px, 0) scale(0.92) rotateX(12deg);
            filter: blur(14px);
            pointer-events: none;
            visibility: hidden;
        }

        .detail-card.is-hidden::before,
        body.is-card-hidden .detail-card::before {
            opacity: 0;
            transform: translate3d(18px, 22px, 0) scale(0.82);
            filter: blur(28px);
        }

        .detail-card.is-hidden::after,
        body.is-card-hidden .detail-card::after {
            opacity: 0;
            transform: translate3d(0, 12px, 0);
        }

        .detail-card.is-closing::before {
            animation: cardGlowOutro 820ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .detail-card.is-closing::after {
            animation: cardGlassOutro 820ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .detail-card.is-hidden > *,
        body.is-card-hidden .detail-card > * {
            animation: none !important;
        }

        .card-scrim {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            background:
                radial-gradient(circle at calc(100% - 160px) calc(100% - 150px), rgba(245, 158, 11, 0.12), transparent 24%),
                linear-gradient(180deg, rgba(6, 7, 9, 0.04), rgba(6, 7, 9, 0.16));
            transition: opacity 820ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.is-card-open .card-scrim {
            opacity: 1;
        }

        .detail-copy h1 {
            margin: 0;
            font-size: clamp(1.18rem, 2.6vw, 1.52rem);
            line-height: 1.02;
            font-weight: 700;
            word-break: break-word;
        }

        .detail-copy h1.is-editable {
            cursor: pointer;
            transition: color 180ms ease, text-shadow 180ms ease;
        }

        .detail-copy h1.is-editable:hover {
            color: var(--accent-strong);
            text-shadow: 0 0 18px rgba(245, 158, 11, 0.12);
        }

        .detail-address {
            margin: 6px 0 0;
            color: var(--text-soft);
            font-size: 0.7rem;
            line-height: 1.45;
        }

        .score-panel {
            appearance: none;
            min-width: 112px;
            padding: 9px 12px 8px;
            border-radius: 20px;
            border: 1px solid rgba(245, 158, 11, 0.18);
            background:
                radial-gradient(circle at top right, rgba(245, 158, 11, 0.16), transparent 48%),
                rgba(255, 255, 255, 0.03);
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 4px 10px;
            align-items: center;
            cursor: pointer;
            color: inherit;
            font: inherit;
            transition:
                transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
                border-color 220ms ease,
                background-color 220ms ease,
                box-shadow 220ms ease;
        }

        .score-panel:hover {
            transform: translateY(-1px);
            border-color: rgba(245, 158, 11, 0.28);
        }

        .score-panel[aria-expanded="true"] {
            border-color: rgba(245, 158, 11, 0.3);
            box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.08);
        }

        .score-panel:disabled {
            cursor: default;
            opacity: 0.8;
        }

        .score-panel strong {
            display: block;
            color: var(--accent-strong);
            font-size: 1.36rem;
            line-height: 1;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            justify-self: end;
        }

        .score-panel span {
            display: block;
            color: var(--text-faint);
            font-size: 0.58rem;
            line-height: 1.4;
        }

        .score-label {
            color: var(--text-faint);
            font-size: 0.56rem;
            line-height: 1.2;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin: 0;
            align-self: center;
        }

        .score-bar {
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            overflow: hidden;
            grid-column: 1 / -1;
        }

        .score-bar > i {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.92), rgba(255, 207, 118, 0.92));
            transform-origin: left center;
            transform: scaleX(0);
            transition: transform 220ms ease;
        }

        .score-panel #scoreMeta {
            grid-column: 1 / -1;
            text-align: left;
        }

        .detail-side {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-close {
            width: 36px;
            height: 36px;
            flex: 0 0 auto;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-size: 0.68rem;
            font-weight: 700;
            transition:
                transform 200ms cubic-bezier(0.22, 1, 0.36, 1),
                border-color 180ms ease,
                background-color 180ms ease;
        }

        .detail-close:hover {
            transform: translateY(-1px);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .editor {
            display: grid;
            gap: 12px;
        }

        .editor[hidden] {
            display: none;
        }

        .editor.is-rating-only #photoStrip,
        .editor.is-rating-only .review-input,
        .editor.is-rating-only .editor-actions,
        .editor.is-rating-only .upload-meta {
            display: none;
        }

        .name-field[hidden] {
            display: none;
        }

        .detail-copy .name-field {
            min-width: 0;
        }

        .name-input,
        .review-input {
            width: 100%;
            border: 1px solid var(--line-soft);
            outline: 0;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            font: inherit;
            transition:
                border-color 180ms ease,
                box-shadow 180ms ease,
                background-color 180ms ease;
        }

        .name-input {
            height: 48px;
            padding: 0 16px;
            border-radius: 16px;
            font-size: 0.84rem;
            font-weight: 700;
        }

        .detail-copy .name-input {
            height: auto;
            padding: 0 0 6px;
            border: 0;
            border-bottom: 1px solid rgba(245, 158, 11, 0.18);
            border-radius: 0;
            background: transparent;
            font-size: clamp(1.18rem, 2.6vw, 1.52rem);
            line-height: 1.02;
            font-weight: 700;
            box-shadow: none;
        }

        .review-input {
            min-height: 94px;
            padding: 14px 16px;
            border-radius: 18px;
            resize: vertical;
            line-height: 1.55;
            font-size: 0.78rem;
        }

        .name-input::placeholder,
        .review-input::placeholder {
            color: rgba(255, 245, 230, 0.38);
        }

        .name-input:focus,
        .review-input:focus {
            border-color: var(--line-strong);
            box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.1);
        }

        .detail-copy .name-input:focus {
            box-shadow: none;
            border-bottom-color: rgba(245, 158, 11, 0.42);
        }

        .rating-editor {
            max-height: 0;
            margin: -4px 0 0;
            padding: 0 14px;
            border-radius: 20px;
            border: 1px solid rgba(245, 158, 11, 0.14);
            background: rgba(255, 255, 255, 0.025);
            display: grid;
            gap: 12px;
            overflow: hidden;
            opacity: 0;

            function safeStorageGet(key) {
                try {
                    return localStorage.getItem(key);
                } catch (_) {
                    return null;
                }
            }

            function safeStorageSet(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (_) {}
            }

            function pickFirst(values) {
                for (const value of values) {
                    const clean = String(value || "").trim();
                    if (clean) return clean;
                }
                return "";
            }

            function clampRating(value) {
                const numeric = Number(value);
                if (!Number.isFinite(numeric)) return 0;
                return Math.max(0, Math.min(10, Math.round(numeric * 10) / 10));
            }

            function formatCount(value, forms) {
                const n = Math.abs(Number(value) || 0);
                const mod100 = n % 100;
                const mod10 = n % 10;
                if (mod100 >= 11 && mod100 <= 19) return `${n} ${forms[2]}`;
                if (mod10 === 1) return `${n} ${forms[0]}`;
                if (mod10 >= 2 && mod10 <= 4) return `${n} ${forms[1]}`;
                return `${n} ${forms[2]}`;
            }

            function formatDate(value) {
                if (!value) return "";
                try {
                    return DATE_FORMATTER.format(new Date(value));
                } catch (_) {
                    return "";
                }
            }

            function normalizeKey(value) {
                return String(value || "")
                    .trim()
                    .toLowerCase()
                    .replace(/[.#$\/\[\]]/g, "_")
                    .replace(/\s+/g, " ")
                    .slice(0, 240);
            }

            function hashString(value) {
                let hash = 2166136261;
                const input = String(value || "");
                for (let index = 0; index < input.length; index += 1) {
                    hash ^= input.charCodeAt(index);
                    hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
                }
                return (hash >>> 0).toString(36);
            }

            function readCurrentUser() {
                try {
                    const raw = localStorage.getItem("currentUser");
                    if (!raw) return { name: "Пользователь", userId: "guest", avatarUrl: "" };
                    const parsed = JSON.parse(raw);
                    return {
                        name: String(parsed.name || parsed.username || "Пользователь"),
                        userId: normalizeKey(parsed.username || parsed.uid || parsed.email || parsed.name || "guest") || "guest",
                        avatarUrl: String(parsed.avatarUrl || parsed.photoURL || parsed.photoUrl || parsed.avatar || "").trim()
                    };
                } catch (_) {
                    return { name: "Пользователь", userId: "guest", avatarUrl: "" };
                }
            }

            function parseCoords(raw) {
                if (Array.isArray(raw) && raw.length >= 2) {
                    const lat = Number(raw[0]);
                    const lng = Number(raw[1]);
                    if (Number.isFinite(lat) && Number.isFinite(lng)) return [lat, lng];
                }
                if (raw && typeof raw === "object") {
                    const lat = Number(raw.lat != null ? raw.lat : raw.latitude);
                    const lng = Number(raw.lng != null ? raw.lng : raw.longitude);
                    if (Number.isFinite(lat) && Number.isFinite(lng)) return [lat, lng];
                }
                return null;
            }

            function formatCoords(coords) {
                if (!Array.isArray(coords) || coords.length < 2) return "Смоленск";
                return `${Number(coords[0]).toFixed(5)}, ${Number(coords[1]).toFixed(5)}`;
            }

            function normalizeCityLabel(value) {
                const raw = String(value || "").trim();
                if (!raw) return "";
                const clean = raw
                    .replace(/^городской округ\s+/i, "")
                    .replace(/^муниципальное образование\s+/i, "")
                    .replace(/^город\s+/i, "")
                    .replace(/^г\.\s*/i, "")
                    .trim();
                if (/смоленск/i.test(clean)) {
                    return "Смоленск";
                }
                return clean;
            }

            function getEntryScoreText(entry, emptyLabel = "—") {
                if (!entry || !entry.ratingCount) return emptyLabel;
                return entry.average.toFixed(1);
            }

            function formatAddressObject(address, includeHouse = true) {
                if (!address || typeof address !== "object") return "";
                const city = normalizeCityLabel(pickFirst([
                    address.city,
                    address.town,
                    address.village,
                    address.municipality,
                    address.city_district,
                    address.county
                ]) || "Смоленск");
                const street = pickFirst([
                    address.road,
                    address.pedestrian,
                    address.footway,
                    address.path,
                    address.square,
                    address.residential,
                    address.suburb,
                    address.neighbourhood
                ]);
                const house = pickFirst([
                    address.house_number,
                    address.house_name,
                    address.block
                ]);
                const parts = [city, street];
                if (includeHouse) {
                    parts.push(house);
                }
                return parts.filter(Boolean).join(", ");
            }

            function compressAddressString(value) {
                const parts = String(value || "")
                    .split(",")
                    .map((part) => part.trim())
                    .filter(Boolean);
                const normalizedParts = parts.map((part) => (/смоленск/i.test(part) ? normalizeCityLabel(part) : part));
                if (!parts.length) return "";
                if (normalizedParts.length <= 3) return normalizedParts.join(", ");
                const city = normalizeCityLabel(pickFirst(normalizedParts.filter((part) => /смоленск/i.test(part))) || normalizedParts[0]);
                const street = pickFirst(normalizedParts.filter((part) => /(улица|ул\.|проспект|шоссе|переулок|площадь|проезд|набережная|бульвар|дорога|аллея|тупик|тракт|street|road|avenue|boulevard|lane|square)/i.test(part)));
                const house = pickFirst(normalizedParts.filter((part) => /^\d+[а-яa-z0-9\/-]*$/i.test(part)))
                    || pickFirst(normalizedParts.filter((part) => /\d/.test(part) && part !== city && part !== street));
                const compact = [city, street, house].filter(Boolean);
                return compact.length ? compact.join(", ") : normalizedParts.slice(0, 3).join(", ");
            }

            function trimHouseFromAddressString(value) {
                const compact = compressAddressString(value);
                const parts = compact.split(",").map((part) => part.trim()).filter(Boolean);

            }

            function normalizeStoredAddress(rawAddress) {
                if (rawAddress && typeof rawAddress === "object") {
                    return formatAddressObject(rawAddress);
                }
                return compressAddressString(rawAddress);
            }

            function normalizeReactionRecords(raw) {
                if (!raw || typeof raw !== "object") return {};
                const next = {};

                const pushReaction = (userIdValue, emojiValue, payload) => {
                    const userId = normalizeKey(userIdValue);
                    const emoji = String(emojiValue || "").trim();
                    if (!userId || !emoji) return;
                    next[userId] = next[userId] || {};
                    next[userId][emoji] = {
                        emoji,
                        name: String(payload?.name || payload?.user || "").trim(),
                        avatarUrl: String(payload?.avatarUrl || payload?.photoURL || payload?.photoUrl || payload?.avatar || "").trim(),
                        ts: Number(payload?.ts || 0) || Date.now()
                    };
                };

                Object.entries(raw).forEach(([key, value]) => {
                    if (!value || typeof value !== "object") return;

                    if (value.emoji) {
                        pushReaction(key || value.userId || value.user || "", value.emoji, value);
                        return;
                    }

                    const directUserId = normalizeKey(key);
                    const directKeys = Object.entries(value);
                    const looksLikeUserScoped = Boolean(directUserId)
                        && !REVIEW_REACTIONS.includes(String(key || "").trim())
                        && directKeys.some(([, nestedValue]) => nestedValue && typeof nestedValue === "object");

                    if (looksLikeUserScoped) {
                        directKeys.forEach(([nestedKey, nestedValue]) => {
                            if (!nestedValue || typeof nestedValue !== "object") return;
                            pushReaction(directUserId, nestedValue.emoji || nestedKey, nestedValue);
                        });
                        return;
                    }

                    if (REVIEW_REACTIONS.includes(String(key || "").trim())) {
                        Object.entries(value).forEach(([nestedUserId, nestedValue]) => {
                            if (!nestedValue || typeof nestedValue !== "object") return;
                            pushReaction(nestedUserId || nestedValue.userId || nestedValue.user || "", key, {
                                ...nestedValue,
                                emoji: key
                            });
                        });
                    }
                });

                return next;
            }

            function serializeReactionRecords(reactions) {
                const next = {};
                Object.entries(reactions || {}).forEach(([userId, value]) => {
                    if (!value || typeof value !== "object") return;
                    const key = normalizeKey(userId);
                    if (!key) return;
                    const reactionSet = {};
                    Object.entries(value).forEach(([emojiKey, payload]) => {
                        const emoji = String(payload?.emoji || emojiKey || "").trim();
                        if (!payload || typeof payload !== "object" || !emoji) return;
                        reactionSet[emoji] = {
                            emoji,
                            name: String(payload.name || "").trim(),
                            avatarUrl: String(payload.avatarUrl || "").trim(),
                            ts: Number(payload.ts || 0) || Date.now()
                        };
                    });
                    if (Object.keys(reactionSet).length) {
                        next[key] = reactionSet;
                    }
                });
                return next;
            }

            function getReactionTargetKey(entryId, reviewUserId) {
                return `${String(entryId || "")}::${normalizeKey(reviewUserId || "")}`;
            }

            function getReviewReactionSummary(review) {
                const summary = new Map();
                Object.values((review && review.reactions) || {}).forEach((reactionSet) => {
                    if (!reactionSet || typeof reactionSet !== "object") return;
                    Object.values(reactionSet).forEach((value) => {
                        if (!value || !value.emoji) return;
                        const emoji = String(value.emoji).trim();
                        if (!emoji) return;
                        const item = summary.get(emoji) || { emoji, count: 0, active: false };
                        item.count += 1;
                        if (review && Array.isArray(review.myReactions) && review.myReactions.includes(emoji)) {
                            item.active = true;
                        }
                        summary.set(emoji, item);
                    });
                });

                return Array.from(summary.values()).sort((a, b) => {
                    if (a.active !== b.active) return a.active ? -1 : 1;
                    if (b.count !== a.count) return b.count - a.count;
                    const orderA = REVIEW_REACTIONS.indexOf(a.emoji);
                    const orderB = REVIEW_REACTIONS.indexOf(b.emoji);
                    return (orderA === -1 ? 999 : orderA) - (orderB === -1 ? 999 : orderB);
                });
            }

            function formatAddressFromNominatim(item, coords, includeHouse = true) {
                const fromObject = formatAddressObject(item && item.address, includeHouse);
                if (fromObject) return fromObject;
                const fromDisplay = includeHouse
                    ? compressAddressString(item && item.display_name)
                    : trimHouseFromAddressString(item && item.display_name);
                if (fromDisplay) return fromDisplay;
                return Array.isArray(coords) ? formatCoords(coords) : "Смоленск";
            }

            function hasHouseInAddress(value) {
                return /(?:^|,\s*)(?:дом\s*)?\d+[а-яa-z0-9\/-]*/i.test(String(value || ""));
            }

            function isStreetLikeName(value) {
                return /^(улица|ул\.|проспект|шоссе|переулок|площадь|проезд|набережная|бульвар|дорога|аллея|тупик|тракт)\b/i.test(String(value || "").trim());
            }

            function isFoodPlaceType(item) {
                const type = String(item && item.type || "").trim().toLowerCase();
                return [
                    "restaurant",
                    "cafe",
                    "fast_food",
                    "bar",
                    "pub",
                    "food_court",
                    "bistro",
                    "ice_cream"
                ].includes(type);
            }

            function isGenericVenueName(value) {
                return [
                    "restaurant",
                    "cafe",
                    "fast_food",
                    "bar",
                    "pub",
                    "food_court",
                    "кафе",
                    "ресторан",
                    "бар",
                    "паб",
                    "фастфуд"
                ].includes(String(value || "").trim().toLowerCase());
            }

            function derivePlaceName(item) {
                const displayHead = item && item.display_name ? String(item.display_name).split(",")[0].trim() : "";
                const explicit = pickFirst([
                    item && item.namedetails && (
                        item.namedetails["name:ru"]
                        || item.namedetails.name
                        || item.namedetails["official_name:ru"]
                        || item.namedetails.official_name
                    ),
                    item && item.extratags && (
                        item.extratags["brand:ru"]
                        || item.extratags.brand
                        || item.extratags["official_name:ru"]
                        || item.extratags.official_name
                        || item.extratags["alt_name:ru"]
                        || item.extratags.alt_name
                    ),
                    item && item.name,
                    item && item.address && (
                        (!isGenericVenueName(item.address.amenity) ? item.address.amenity : "")
                        || (!isGenericVenueName(item.address.shop) ? item.address.shop : "")
                        || (!isGenericVenueName(item.address.tourism) ? item.address.tourism : "")
                    ),
                    (!isStreetLikeName(displayHead) && !isGenericVenueName(displayHead)) ? displayHead : ""
                ]);
                if (isFoodPlaceType(item)) {
                    return explicit || "";
                }
                return explicit || "";
            }

            function sanitizePhotos(raw) {
                if (!Array.isArray(raw)) return [];
                return raw
                    .map((item) => String(item || "").trim())
                    .filter((item) => /^https?:\/\//i.test(item))
                    .slice(0, MAX_PHOTO_COUNT);
            }

            function normalizeReview(userId, raw) {
                if (!raw || typeof raw !== "object") return null;
                const rawRating = Number(raw.rating);
                if (!Number.isFinite(rawRating)) return null;
                const rating = clampRating(
                    raw.scale === 10 || raw.version === 2 || rawRating > 5
                        ? rawRating
                        : rawRating * 2
                );
                const createdAt = String(raw.createdAt || raw.updatedAt || new Date().toISOString());
                const updatedAt = String(raw.updatedAt || raw.createdAt || createdAt);
                return {
                    userId: normalizeKey(userId || raw.userId || raw.user || "guest") || "guest",
                    user: String(raw.user || raw.name || "Пользователь"),
                    avatarUrl: String(raw.avatarUrl || raw.photoURL || raw.photoUrl || raw.avatar || "").trim(),
                    rating,
                    reactions: normalizeReactionRecords(raw.reactions),
                    myReactions: [],
                    text: String(raw.text || "").trim().slice(0, 260),
                    photos: sanitizePhotos(raw.photos),
                    createdAt,
                    updatedAt
                };
            }

            function normalizeEntry(id, raw) {
                if (!raw || typeof raw !== "object") return null;
                if (raw.deletedAt) return null;
                const coords = parseCoords(raw.coords || raw);
                if (!coords) return null;
                const ratingsObject = raw.ratings && typeof raw.ratings === "object" ? raw.ratings : {};
                const ratings = Object.entries(ratingsObject)
                    .map(([userId, review]) => normalizeReview(userId, review))
                    .filter(Boolean)
                    .map((review) => ({
                        ...review,
                        myReactions: Object.keys(review.reactions[state.userId] || {}).sort((a, b) => {
                            const orderA = REVIEW_REACTIONS.indexOf(a);
                            const orderB = REVIEW_REACTIONS.indexOf(b);
                            return (orderA === -1 ? 999 : orderA) - (orderB === -1 ? 999 : orderB);
                        })
                    }))
                    .sort((a, b) => new Date(b.updatedAt || b.createdAt).getTime() - new Date(a.updatedAt || a.createdAt).getTime());
                const ownerReview = ratings
                    .slice()
                    .sort((a, b) => new Date(a.createdAt || a.updatedAt).getTime() - new Date(b.createdAt || b.updatedAt).getTime())[0] || null;
                const average = ratings.length
                    ? ratings.reduce((sum, review) => sum + review.rating, 0) / ratings.length
                    : 0;
                return {
                    id,
                    name: String(raw.name || "Ресторан").trim() || "Ресторан",
                    address: normalizeStoredAddress(raw.address),
                    coords,
                    source: String(raw.source || "").trim(),
                    osmType: String(raw.osmType || "").trim(),
                    osmId: String(raw.osmId || "").trim(),
                    createdBy: normalizeKey(raw.createdBy || (ownerReview ? ownerReview.userId : "")),
                    createdByName: String(raw.createdByName || (ownerReview ? ownerReview.user : "")).trim(),
                    createdAt: String(raw.createdAt || "").trim(),
                    updatedAt: String(raw.updatedAt || raw.createdAt || "").trim(),
                    ratings,
                    ratingCount: ratings.length,
                    average,
                    myReview: ratings.find((review) => review.userId === state.userId) || null
                };
            }

            function buildSelectionId(selection) {
                if (selection.id) return String(selection.id);
                if (selection.osmType && selection.osmId) return `osm_${selection.osmType}_${selection.osmId}`;
                const signature = [
                    String(selection.name || "").trim().toLowerCase(),
                    String(selection.address || "").trim().toLowerCase(),
                    Array.isArray(selection.coords) ? Number(selection.coords[0]).toFixed(5) : "",
                    Array.isArray(selection.coords) ? Number(selection.coords[1]).toFixed(5) : ""
                ].join("|");
                return `custom_${hashString(signature)}`;
            }

            function entryToSelection(entry) {
                return {
                    id: entry.id,
                    key: entry.id,
                    name: entry.name,
                    address: entry.address,
                    fullAddress: entry.address,
                    coords: entry.coords.slice(),
                    source: "saved",
                    editableName: false,
                    createdBy: entry.createdBy || "",
                    osmType: entry.osmType || "",
                    osmId: entry.osmId || ""
                };
            }

            function createDraftSelection(coords) {
                return {
                    id: "",
                    key: `draft_${Number(coords[0]).toFixed(5)}_${Number(coords[1]).toFixed(5)}`,
                    name: "",
                    address: "Смоленск",
                    fullAddress: "Смоленск",
                    coords: coords.slice(),
                    source: "draft",
                    editableName: true,
                    createdBy: state.userId,
                    osmType: "",
                    osmId: ""
                };
            }

            function isPrivilegedUser() {
                return state.userId === "max" || normalizeKey(state.userName) === "max";
            }

            function canManageEntry(entry) {
                if (isPrivilegedUser()) {
                    return Boolean(entry);
                }
                return Boolean(entry && entry.createdBy && entry.createdBy === state.userId);
            }

            function compareTop(a, b) {
                if (b.average !== a.average) return b.average - a.average;
                if (b.ratingCount !== a.ratingCount) return b.ratingCount - a.ratingCount;
                return new Date(b.updatedAt || 0).getTime() - new Date(a.updatedAt || 0).getTime();
            }

            function compareNew(a, b) {
                return new Date(b.updatedAt || b.createdAt || 0).getTime() - new Date(a.updatedAt || a.createdAt || 0).getTime();
            }

            function getVisibleEntries() {
                const list = state.entries.slice();
                if (state.filter === "mine") {
                    return list
                        .filter((entry) => entry.myReview)
                        .sort((a, b) => new Date((b.myReview && (b.myReview.updatedAt || b.myReview.createdAt)) || 0).getTime() - new Date((a.myReview && (a.myReview.updatedAt || a.myReview.createdAt)) || 0).getTime());
                }
                if (state.filter === "new") {
                    return list.sort(compareNew);
                }
                return list.sort(compareTop);
            }

            function getSelectionEntry() {
                if (!state.selection) return null;
                return state.entryMap.get(state.selection.key) || state.entryMap.get(buildSelectionId(state.selection)) || null;
            }

            function destroyDraftPhotos() {
                state.draftPhotos.forEach((item) => {
                    if (item.previewUrl && item.previewUrl.startsWith("blob:")) {
                        URL.revokeObjectURL(item.previewUrl);
                    }
                });
            }

            function createDraftPhotoState(url) {
                return {
                    id: `saved_${hashString(url)}`,
                    url,
                    previewUrl: url,
                    status: "done"
                };
            }

            function hydrateComposerFromReview(review, options = {}) {
                const nextReview = review || null;
                destroyDraftPhotos();
                state.draftPhotos = nextReview ? nextReview.photos.map(createDraftPhotoState) : [];
                state.editingOwnReview = Boolean(nextReview);
                state.composerMode = nextReview ? (options.mode || "full") : "full";
                state.draftRating = clampRating(
                    options.rating != null
                        ? options.rating
                        : (nextReview ? nextReview.rating : 8.0)
                );
                state.formDirty = options.forceDirty != null
                    ? Boolean(options.forceDirty)
                    : !nextReview;
                els.reviewInput.value = nextReview ? (nextReview.text || "") : "";
                if (els.photoInput) {
                    els.photoInput.value = "";
                }
                renderDraftRating();
                renderDraftPhotos();
                updateComposerVisibility();
                updateSaveState();
            }

            function syncCardOpen(next) {
                const wasOpen = state.cardOpen;
                state.cardOpen = Boolean(next);
                clearTimeout(state.cardAnimationTimer);

                if (state.cardOpen) {
                    if (wasOpen && !els.detailCard.classList.contains("is-hidden") && !els.detailCard.classList.contains("is-closing")) {
                        document.body.classList.add("is-card-open");
                        document.body.classList.remove("is-card-hidden");
                        els.detailCard.classList.remove("is-opening");
                        els.detailCard.setAttribute("aria-hidden", "false");
                        updateOwnerActionVisibility();
                        return;
                    }
                    document.body.classList.add("is-card-open");
                    document.body.classList.remove("is-card-hidden");
                    els.detailCard.classList.remove("is-hidden", "is-closing");
                    void els.detailCard.offsetWidth;
                    els.detailCard.classList.add("is-opening");
                    els.detailCard.setAttribute("aria-hidden", "false");
                    state.cardAnimationTimer = setTimeout(() => {
                        els.detailCard.classList.remove("is-opening");
                        state.cardAnimationTimer = 0;
                    }, CARD_ANIMATION_MS);
                    updateOwnerActionVisibility();
                    return;
                }

                if (!wasOpen && (els.detailCard.classList.contains("is-hidden") || els.detailCard.classList.contains("is-closing"))) {
                    document.body.classList.remove("is-card-open");
                    document.body.classList.add("is-card-hidden");
                    els.detailCard.setAttribute("aria-hidden", "true");
                    updateOwnerActionVisibility();
                    return;
                }

                document.body.classList.remove("is-card-open");
                els.detailCard.classList.remove("is-opening");
                els.detailCard.classList.remove("is-hidden");
                void els.detailCard.offsetWidth;
                els.detailCard.classList.add("is-closing");
                els.detailCard.setAttribute("aria-hidden", "true");
                state.cardAnimationTimer = setTimeout(() => {
                    els.detailCard.classList.remove("is-closing");
                    els.detailCard.classList.add("is-hidden");
                    document.body.classList.add("is-card-hidden");
                    state.cardAnimationTimer = 0;
                }, CARD_ANIMATION_MS);
                updateOwnerActionVisibility();
            }

            function syncRatingEditorOpen(next) {
                state.ratingEditorOpen = Boolean(next && state.selection);
                els.detailCard.classList.toggle("is-rating-open", state.ratingEditorOpen);
                els.scorePanel.setAttribute("aria-expanded", state.ratingEditorOpen ? "true" : "false");
                els.scorePanel.setAttribute(
                    "aria-label",
                    state.ratingEditorOpen ? "Скрыть выставление оценки" : "Открыть выставление оценки"
                );
                if (state.ratingEditorOpen) {
                    requestAnimationFrame(() => {
                        try {
                            els.ratingRange.focus({ preventScroll: true });
                        } catch (_) {
                            els.ratingRange.focus();
                        }
                    });
                }
            }

            function resetDraftComposer(options = {}) {
                const entry = getSelectionEntry();
                const myReview = entry ? entry.myReview : null;
                destroyDraftPhotos();
                state.draftPhotos = [];
                state.editingOwnReview = false;
                state.composerMode = options.mode || ((state.selection && state.selection.source === "draft") || !myReview ? "full" : "hidden");
                state.draftRating = clampRating(
                    options.rating != null
                        ? options.rating
                        : (myReview ? myReview.rating : 8.0)
                );
                state.formDirty = options.forceDirty != null
                    ? Boolean(options.forceDirty)
                    : !myReview;
                els.reviewInput.value = "";
                if (els.photoInput) {
                    els.photoInput.value = "";
                }
                renderDraftRating();
                renderDraftPhotos();
                updateComposerVisibility();
                updateSaveState();
            }

            function loadOwnReviewIntoComposer(review, options = {}) {
                if (!review) return;
                hydrateComposerFromReview(review, {
                    forceDirty: false,
                    mode: options.mode || "full"
                });
                updateComposerVisibility();
                syncRatingEditorOpen(true);
                if (options.focusTarget === "rating") {
                    requestAnimationFrame(() => {
                        try {
                            els.ratingRange.focus({ preventScroll: true });
                        } catch (_) {
                            els.ratingRange.focus();
                        }
                    });
                    return;
                }
                try {
                    els.reviewInput.focus({ preventScroll: true });
                } catch (_) {
                    els.reviewInput.focus();
                }
            }

            function markFormDirty() {
                state.formDirty = true;
                updateSaveState();
            }

            function focusNameInput() {
                requestAnimationFrame(() => {
                    try {
                        els.nameInput.focus({ preventScroll: true });
                        els.nameInput.select();
                    } catch (_) {
                        els.nameInput.focus();
                        els.nameInput.select();
                    }
                });
            }

            function handleNameInput(event) {
                const value = String(event.target.value || "").trim();
                if (state.selection && state.selection.editableName) {
                    state.selection = {
                        ...state.selection,
                        name: value
                    };
                    els.placeTitle.textContent = value || "Новая точка";
                    if (state.selection.source === "draft") {
                        refreshMapData();
                    }
                }
                markFormDirty();
            }

            function shouldShowComposer() {
                if (!state.selection) return false;
                if (state.selection.source === "draft") return true;
                const entry = getSelectionEntry();
                if (!entry) return true;
                if (!entry.myReview) return true;
                return state.editingOwnReview && (state.composerMode === "full" || state.composerMode === "rating");
            }

            function updateComposerVisibility() {
                els.reviewForm.hidden = !shouldShowComposer();
                els.reviewForm.classList.toggle("is-rating-only", state.composerMode === "rating");
            }

            function scheduleRatingAutosave(immediate = false) {
                clearTimeout(state.ratingAutosaveTimer);
                const run = async () => {
                    const entry = getSelectionEntry();
                    if (!entry || !entry.myReview || state.composerMode !== "rating" || !state.editingOwnReview) {
                        return;
                    }
                    if (Math.abs(clampRating(state.draftRating) - clampRating(entry.myReview.rating)) < 0.001 && !state.formDirty) {
                        return;
                    }
                    if (state.isSaving) {
                        scheduleRatingAutosave(true);
                        return;
                    }
                    await saveReview({ preventDefault() {} }, {
                        quiet: true,
                        closeAfterSave: false,
                        preserveComposerMode: "rating"
                    });
                };

                state.ratingAutosaveTimer = setTimeout(() => {
                    run().catch((error) => {
                        console.error(error);
                    });
                }, immediate ? 0 : 220);
            }

            function activateTitleRename() {
                if (!state.selection) return;
                const entry = getSelectionEntry();

                if (state.selection.source === "draft") {
                    focusNameInput();
                    return;
                }

                if (!entry || !canManageEntry(entry)) return;

                state.selection = {
                    ...state.selection,
                    name: entry.name,
                    editableName: true
                };
                renderSelection();
                focusNameInput();
            }

            async function commitInlineNameEdit() {
                if (!state.selection || !state.selection.editableName || state.selection.source !== "saved" || state.isSaving) {
                    return;
                }

                const entry = getSelectionEntry();
                if (!entry || !canManageEntry(entry)) {
                    return;
                }

                const nextName = String(els.nameInput.value || "").trim();
                if (!nextName || nextName === entry.name) {
                    state.selection = {
                        ...state.selection,
                        name: entry.name,
                        editableName: false
                    };
                    renderSelection();
                    return;
                }

                await saveReview({
                    preventDefault() {}
                });
            }

            function hydrateDraftFromSelection() {
                resetDraftComposer();
                syncRatingEditorOpen(Boolean(state.selection && state.selection.source === "draft"));
            }

            function syncRankingOpen(next) {
                state.rankingOpen = Boolean(next);
                if (state.rankingOpen) {
                    syncRatingEditorOpen(false);
                    syncCardOpen(false);
                }
                document.body.classList.toggle("is-ranking-open", state.rankingOpen);
                els.rankingToggle.classList.toggle("is-active", state.rankingOpen);
                els.rankingToggle.setAttribute("aria-expanded", state.rankingOpen ? "true" : "false");
                els.rankingDock.setAttribute("aria-hidden", state.rankingOpen ? "false" : "true");
                updateOwnerActionVisibility();
            }

            function applyEntries(raw) {
                const nextRaw = raw && typeof raw === "object" ? raw : {};
                const nextSignature = JSON.stringify(nextRaw);
                if (nextSignature === state.entriesSignature) {
                    return;
                }

                const previousKey = state.selection ? state.selection.key : "";
                state.entriesRaw = nextRaw;
                state.entriesSignature = nextSignature;
                state.entries = Object.entries(state.entriesRaw)
                    .map(([id, entry]) => normalizeEntry(id, entry))
                    .filter(Boolean);
                state.entryMap = new Map(state.entries.map((entry) => [entry.id, entry]));

                if (state.selection) {
                    const matched = state.entryMap.get(state.selection.key) || state.entryMap.get(buildSelectionId(state.selection));
                    if (matched) {
                        state.selection = entryToSelection(matched);
                    }
                } else if (state.entries.length) {
                    const topEntry = state.entries.slice().sort(compareTop)[0];
                    if (topEntry) {
                        state.selection = entryToSelection(topEntry);
                    }
                }

                if ((state.selection ? state.selection.key : "") !== previousKey) {
                    hydrateDraftFromSelection();
                }

                renderAll();
            }

            function syncMetrics() {
                els.placesMetric.textContent = String(state.entries.length);
            }

            function renderDraftRating() {
                els.draftRatingValue.textContent = state.draftRating.toFixed(1);
                els.ratingRange.value = String(Math.round(state.draftRating * 10));
                els.ratingRange.style.setProperty("--value", `${(state.draftRating / 10) * 100}%`);
            }

            function hasUploadingPhotos() {
                return state.draftPhotos.some((item) => item.status === "uploading");
            }

            function getPendingName() {
                if (!state.selection) return "";
                return state.selection.editableName
                    ? String(els.nameInput.value || "").trim()
                    : String(state.selection.name || "").trim();
            }

            function updateUploadMeta() {
                const readyCount = state.draftPhotos.filter((item) => item.status === "done").length;
                const loadingCount = state.draftPhotos.filter((item) => item.status === "uploading").length;
                const failedCount = state.draftPhotos.filter((item) => item.status === "error").length;
                if (loadingCount) {
                    els.uploadMeta.textContent = `загрузка ${loadingCount}`;
                    return;
                }
                if (failedCount) {
                    els.uploadMeta.textContent = `ошибка ${failedCount}`;
                    return;
                }
                if (readyCount) {
                    els.uploadMeta.textContent = formatCount(readyCount, ["фото", "фото", "фото"]);
                    return;
                }
                els.uploadMeta.textContent = "";
            }

            function renderPhotoLightbox() {
                const items = Array.isArray(state.lightboxItems) ? state.lightboxItems : [];
                const index = Math.max(0, Math.min(items.length - 1, state.lightboxIndex || 0));
                const url = items[index] || "";
                state.lightboxIndex = index;
                state.lightboxUrl = url;
                if (!url) {
                    els.photoLightboxImage.removeAttribute("src");
                    els.photoLightboxStrip.innerHTML = "";
                    els.photoLightboxPrev.disabled = true;
                    els.photoLightboxNext.disabled = true;
                    els.photoLightboxPrev.hidden = true;
                    els.photoLightboxNext.hidden = true;
                    els.photoLightboxStrip.hidden = true;
                    return;
                }

                els.photoLightboxImage.src = url;
                els.photoLightboxPrev.disabled = index <= 0;
                els.photoLightboxNext.disabled = index >= items.length - 1;
                els.photoLightboxStrip.innerHTML = "";

                if (items.length <= 1) {
                    els.photoLightboxPrev.hidden = true;
                    els.photoLightboxNext.hidden = true;
                    els.photoLightboxStrip.hidden = true;
                    return;
                }

                els.photoLightboxPrev.hidden = false;
                els.photoLightboxNext.hidden = false;
                els.photoLightboxStrip.hidden = false;
                const fragment = document.createDocumentFragment();
                items.forEach((itemUrl, itemIndex) => {
                    const thumb = document.createElement("button");
                    thumb.type = "button";
                    thumb.className = `photo-lightbox-thumb${itemIndex === index ? " is-active" : ""}`;
                    thumb.setAttribute("aria-label", `Открыть фото ${itemIndex + 1}`);
                    thumb.addEventListener("click", () => {
                        state.lightboxIndex = itemIndex;
                        renderPhotoLightbox();
                    });

                    const image = document.createElement("img");
                    image.loading = "lazy";
                    image.alt = "Превью фото";
                    image.src = itemUrl;

                    thumb.appendChild(image);
                    fragment.appendChild(thumb);
                });
                els.photoLightboxStrip.appendChild(fragment);
                const activeThumb = els.photoLightboxStrip.querySelector(".photo-lightbox-thumb.is-active");
                if (activeThumb) {
                    activeThumb.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });

            function stepPhotoLightbox(direction) {

                const nextIndex = Math.max(0, Math.min(state.lightboxItems.length - 1, state.lightboxIndex + direction));
                if (nextIndex === state.lightboxIndex) return;
                state.lightboxIndex = nextIndex;
                renderPhotoLightbox();

            async function fetchAvatarByUserId(userId) {
                const normalized = normalizeKey(userId || "");
                if (!normalized || normalized === "guest" || !state.db) return "";
                if (state.avatarCache.has(normalized)) {
                    return state.avatarCache.get(normalized) || "";
                }
                if (state.avatarFetchInFlight.has(normalized)) {
                    return state.avatarFetchInFlight.get(normalized);
                }

                const request = state.db.ref(`users/${normalized}/avatarUrl`).once("value")
                    .then((snapshot) => {
                        const value = String(snapshot.val() || "").trim();
                        state.avatarCache.set(normalized, value);
                        state.avatarFetchInFlight.delete(normalized);
                        return value;
                    })
                    .catch((error) => {
                        console.error(error);
                        state.avatarCache.set(normalized, "");
                        state.avatarFetchInFlight.delete(normalized);
                        return "";
                    });

                state.avatarFetchInFlight.set(normalized, request);
                return request;
            }

            function hydrateReviewAvatar(node, review) {
                if (!node || !review) return;
                const immediateUrl = String(review.avatarUrl || "").trim();
                if (immediateUrl) {
                    setReviewAvatarContent(node, review, immediateUrl);
                    return;
                }

                const cached = state.avatarCache.get(review.userId);
                if (cached) {
                    setReviewAvatarContent(node, review, cached);
                    return;
                }

                setReviewAvatarContent(node, review, "");
                fetchAvatarByUserId(review.userId).then((avatarUrl) => {
                    if (!avatarUrl || !node.isConnected) return;
                    review.avatarUrl = avatarUrl;
                    setReviewAvatarContent(node, review, avatarUrl);
                });
            }

            function patchEntryMetaInLocalSnapshot(entryId, patch) {
                const next = { ...state.entriesRaw };
                const existing = next[entryId] && typeof next[entryId] === "object" ? next[entryId] : null;
                if (!existing) return;
                next[entryId] = {
                    ...existing,
                    ...patch,
                    updatedAt: patch.updatedAt || existing.updatedAt || new Date().toISOString()
                };
                applyEntries(next);
            }

            function removeEntryFromLocalSnapshot(entryId) {
                const next = { ...state.entriesRaw };
                if (!(entryId in next)) return;
                delete next[entryId];
                if (state.selection && state.selection.key === entryId) {
                    state.selection = null;
                }
                applyEntries(next);
            }

            function updateOwnerActionVisibility() {
                const entry = getSelectionEntry();
                els.restaurantDeleteButton.hidden = !(entry && canManageEntry(entry) && state.cardOpen && !state.rankingOpen);
            }

            function removeReviewFromLocalSnapshot(entryId, userId) {
                const next = { ...state.entriesRaw };
                const existing = next[entryId] && typeof next[entryId] === "object" ? next[entryId] : null;
                if (!existing) return;
                const ratings = existing.ratings && typeof existing.ratings === "object" ? { ...existing.ratings } : {};
                delete ratings[userId];
                next[entryId] = {
                    ...existing,
                    updatedAt: new Date().toISOString(),
                    ratings
                };
                applyEntries(next);
            }

            function getRawReviewNode(entryId, reviewUserId) {
                const entry = state.entriesRaw[entryId];
                if (!entry || typeof entry !== "object") return null;
                const ratings = entry.ratings && typeof entry.ratings === "object" ? entry.ratings : null;
                if (!ratings) return null;
                const review = ratings[reviewUserId];
                return review && typeof review === "object" ? review : null;
            }

            function patchReviewReactionsInLocalSnapshot(entryId, reviewUserId, reactorUserId, nextReactionSet) {
                const next = { ...state.entriesRaw };
                const existingEntry = next[entryId] && typeof next[entryId] === "object" ? next[entryId] : null;
                if (!existingEntry) return;
                const ratings = existingEntry.ratings && typeof existingEntry.ratings === "object" ? { ...existingEntry.ratings } : {};
                const review = ratings[reviewUserId] && typeof ratings[reviewUserId] === "object" ? { ...ratings[reviewUserId] } : null;
                if (!review) return;

                const reactions = normalizeReactionRecords(review.reactions);
                const normalizedReactorId = normalizeKey(reactorUserId);
                if (!normalizedReactorId) return;

                if (nextReactionSet && typeof nextReactionSet === "object" && Object.keys(nextReactionSet).length) {
                    reactions[normalizedReactorId] = nextReactionSet;
                } else {
                    delete reactions[normalizedReactorId];
                }

                const serialized = serializeReactionRecords(reactions);
                if (Object.keys(serialized).length) {
                    review.reactions = serialized;
                } else {
                    delete review.reactions;
                }

                ratings[reviewUserId] = review;
                next[entryId] = {
                    ...existingEntry,
                    ratings
                };
                applyEntries(next);
            }

            function closeAllReviewReactionMenus() {
                els.reviewsList.querySelectorAll(".review-reaction-menu.is-open").forEach((menu) => {

                els.reviewsList.querySelectorAll(".review-react-trigger.is-open").forEach((button) => {
                    button.classList.remove("is-open");
                    button.setAttribute("aria-expanded", "false");
                });
            }

            function positionReviewReactionMenu(menu, trigger) {
                if (!menu || !trigger) return;

                menu.classList.remove("is-below", "is-align-right");

                const listRect = els.reviewsList.getBoundingClientRect();
                const cardRect = els.detailCard.getBoundingClientRect();
                const triggerRect = trigger.getBoundingClientRect();
                const menuHeight = Math.max(menu.offsetHeight, menu.scrollHeight, 0);
                const menuWidth = Math.max(menu.offsetWidth, menu.scrollWidth, 0);
                const gutter = 10;

                const spaceAbove = triggerRect.top - listRect.top;
                const spaceBelow = listRect.bottom - triggerRect.bottom;

                if (spaceAbove < menuHeight + gutter && spaceBelow > spaceAbove) {
                    menu.classList.add("is-below");
                }

                if (triggerRect.left + menuWidth > cardRect.right - 12) {
                    menu.classList.add("is-align-right");
                }
            }

            async function toggleReviewReaction(entry, review, emoji) {
                if (!entry || !review || !emoji) return;
                if (!state.db) return;
                if (!state.userId || state.userId === "guest") {
                    showToast("Войдите, чтобы реагировать");
                    return;
                }

                const normalizedEmoji = String(emoji || "").trim();
                if (!normalizedEmoji) return;

                closeAllReviewReactionMenus();

                const key = getReactionTargetKey(entry.id, review.userId);
                const currentOp = (state.reviewReactionOps.get(key) || 0) + 1;
                state.reviewReactionOps.set(key, currentOp);

                const previousReactions = normalizeReactionRecords(getRawReviewNode(entry.id, review.userId)?.reactions);
                const currentSet = { ...(previousReactions[state.userId] || {}) };
                const hasReaction = Boolean(currentSet[normalizedEmoji]);
                if (!hasReaction && Object.keys(currentSet).length >= 3) {
                    showToast("Максимум 3 реакции");
                    return;
                }

                if (hasReaction) {
                    delete currentSet[normalizedEmoji];
                } else {
                    currentSet[normalizedEmoji] = {
                        emoji: normalizedEmoji,
                        name: state.userName,
                        avatarUrl: state.userAvatarUrl,
                        ts: Date.now()
                    };
                }

                state.reviewMotionLockUntil = Date.now() + 900;
                patchReviewReactionsInLocalSnapshot(entry.id, review.userId, state.userId, currentSet);

                const ref = state.db.ref(`${DB_ROOT}/${entry.id}/ratings/${review.userId}/reactions/${state.userId}`);

                try {
                    if (Object.keys(currentSet).length) {
                        await ref.set(currentSet);
                    } else {
                        await ref.remove();
                    }
                } catch (error) {
                    console.error(error);
                    if (state.reviewReactionOps.get(key) === currentOp) {
                        const rollback = previousReactions[state.userId] || null;
                        patchReviewReactionsInLocalSnapshot(entry.id, review.userId, state.userId, rollback);
                        showToast("Не удалось отправить реакцию");
                    }
                }
            }
