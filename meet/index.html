<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Встреча | Kinosreda</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #020204;
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #020204;
    }
  </style>
</head>
<body>
  <iframe id="meetFrame" title="Встреча" allow="microphone; camera; display-capture; autoplay; clipboard-write"></iframe>
  <script>
    (function () {
      const frame = document.getElementById('meetFrame');
      if (!frame) return;
      function normalizeRoomSlug(value) {
        return String(value || '')
          .trim()
          .toLowerCase()
          .replace(/[^a-z]+/g, '')
          .slice(0, 40);
      }
      function isDefaultRoomSlug(value) {
        const normalized = normalizeRoomSlug(value);
        return normalized === 'main' || normalized === 'common';
      }
      function buildMeetWrapperUrl(roomSlug = '') {
        const normalizedSlug = normalizeRoomSlug(roomSlug);
        const next = new URL(window.location.href);
        next.pathname = '/meet/';
        next.search = '';
        next.hash = '';
        if (normalizedSlug) {
          next.searchParams.set('room', isDefaultRoomSlug(normalizedSlug) ? 'main' : normalizedSlug);
        }
        return `${next.pathname}${next.search}${next.hash}`;
      }
      const target = new URL('../meet.html', window.location.href);
      target.search = window.location.search || '';
      target.hash = window.location.hash || '';
      frame.src = target.toString();
      try {
        window.history.replaceState({ room: normalizeRoomSlug(new URLSearchParams(window.location.search).get('room') || '') }, '', buildMeetWrapperUrl(new URLSearchParams(window.location.search).get('room') || ''));
      } catch (_) {}
      window.addEventListener('message', (event) => {
        const data = event && event.data ? event.data : null;
        if (!data || data.type !== 'meet:route') return;
        const nextUrl = buildMeetWrapperUrl(data.roomSlug || '');
        try {
          if (data.push) {
            window.history.pushState({ room: data.roomSlug || '' }, '', nextUrl);
          } else {
            window.history.replaceState({ room: data.roomSlug || '' }, '', nextUrl);
          }
        } catch (_) {}
      });
    })();
  </script>
</body>
</html>
