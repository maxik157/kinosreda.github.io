        function ensureWallImageLabel(mesh) {
            if (mesh.userData.labelMesh) return;
            const mat = new THREE.MeshBasicMaterial({
                transparent: true,
                color: 0xffffff,
                depthTest: true,
                depthWrite: false,
                polygonOffset: true,
                polygonOffsetFactor: -1,
                polygonOffsetUnits: -1
            });
            const labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
            labelMesh.position.z = 0.05;
            labelMesh.renderOrder = (mesh.renderOrder || 0) + 2;
            labelMesh.visible = false;
            labelMesh.raycast = () => {};
            mesh.add(labelMesh);
            mesh.userData.labelMesh = labelMesh;
            mesh.userData.labelCanvas = document.createElement('canvas');
        }

        function updateWallImageLabel(mesh) {
            const text = String(mesh.userData.labelText || '').trim();
            ensureWallImageLabel(mesh);
            const labelMesh = mesh.userData.labelMesh;
            if (!labelMesh) return;
            if (!text) {
                labelMesh.visible = false;
                return;
            }
            const canvas = mesh.userData.labelCanvas || document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const baseW = mesh.userData.baseW || 2;
            const baseH = mesh.userData.baseH || 2;
            const labelW = Math.max(0.6, baseW * 0.6);
            const labelH = Math.max(0.08, Math.min(baseH * 0.09, 0.18));
            const localW = labelW / baseW;
            const localH = labelH / baseH;
            labelMesh.scale.set(localW, localH, 1);
            const gap = 0.06 / baseH;
            labelMesh.position.y = -0.5 - gap - localH / 2;
            labelMesh.renderOrder = (mesh.renderOrder || 0) + 2;

            const pxPerUnit = 220;
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            const widthPx = Math.max(1, Math.round(labelW * pxPerUnit * pixelRatio));
            const heightPx = Math.max(1, Math.round(labelH * pxPerUnit * pixelRatio));
            canvas.width = widthPx;
            canvas.height = heightPx;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, widthPx, heightPx);
            ctx.scale(pixelRatio, pixelRatio);
            ctx.imageSmoothingEnabled = true;
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';

            const cssW = widthPx / pixelRatio;
            const cssH = heightPx / pixelRatio;
            ctx.fillStyle = '#f6f1e8';
            ctx.fillRect(0, 0, cssW, cssH);
            ctx.strokeStyle = '#d7c6a8';
            ctx.lineWidth = 2;
            ctx.strokeRect(1, 1, cssW - 2, cssH - 2);
            const paddingX = 10;
            const paddingY = 8;
            let fontSize = Math.floor(cssH * 0.3);
            const minFontSize = Math.max(9, Math.floor(cssH * 0.22));
            const maxLines = 2;
            const applyFont = () => {
                ctx.font = `600 ${fontSize}px Comfortaa, sans-serif`;
                if ('fontKerning' in ctx) ctx.fontKerning = 'normal';
            };
            const wrapText = () => {
                const words = text.split(/\s+/).filter(Boolean);
                const lines = [];
                let line = '';
                words.forEach((word) => {
                    const test = line ? `${line} ${word}` : word;
                    const width = ctx.measureText(test).width;
                    if (width <= cssW - paddingX * 2) {
                        line = test;
                    } else {
                        if (line) lines.push(line);
                        line = word;
                    }
                });
                if (line) lines.push(line);
                return lines;
            };
            applyFont();
            let lines = wrapText();
            while (lines.length > maxLines && fontSize > minFontSize) {
                fontSize -= 1;
                applyFont();
                lines = wrapText();
            }
            if (lines.length > maxLines) {
                lines = lines.slice(0, maxLines);
                let last = lines[lines.length - 1];
                while (ctx.measureText(`${last}…`).width > cssW - paddingX * 2 && last.length > 1) {
                    last = last.slice(0, -1);
                }
                lines[lines.length - 1] = `${last}…`;
            }
            ctx.fillStyle = '#1a1a1a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const lineHeight = fontSize * 1.2;
            const totalHeight = lines.length * lineHeight;
            let startY = (cssH - totalHeight) / 2 + lineHeight / 2;
            startY = Math.max(startY, paddingY + lineHeight / 2);
            lines.forEach((line, idx) => {
                ctx.fillText(line, cssW / 2, startY + idx * lineHeight);
            });

            let texture = labelMesh.material.map;
            if (!texture) {
                texture = new THREE.CanvasTexture(canvas);
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                if (renderer?.capabilities?.getMaxAnisotropy) {
                    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                }
                labelMesh.material.map = texture;
            } else {
                texture.image = canvas;
                texture.needsUpdate = true;
            }
            labelMesh.material.needsUpdate = true;
            labelMesh.visible = true;
        }

        function getSelectedWallImageMesh() {

        function setSelectedWallImage(mesh) {

            }
            selectedWallImageId = mesh.userData.id;
            if (mesh.userData?.outline) mesh.userData.outline.visible = true;
            if (!Number.isFinite(mesh.userData.layer)) {
                mesh.userData.layer = wallImageLayerCounter++;
            } else {
                mesh.userData.layer = wallImageLayerCounter++;
            }
            mesh.position.z = mesh.userData.layer * 0.002;
            mesh.renderOrder = 30 + mesh.userData.layer;

            queueWallImagesSave();
            const toolbar = document.getElementById('wallImageToolbar');
            if (toolbar) toolbar.style.display = 'flex';

        function handleWallImagePointerDown(event) {
            if (isLocked || !wallImageGroup) return false;
            const rect = renderer.domElement.getBoundingClientRect();
            wallImagePointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            wallImagePointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            wallImageRaycaster.setFromCamera(wallImagePointer, camera);
            const hits = wallImageRaycaster.intersectObjects(wallImageGroup.children, true);
            if (!hits.length) return false;
            const mesh = hits[0].object;
            const root = mesh.userData?.id ? mesh : mesh.parent;
            if (!root || !root.userData?.id) return false;
            const wall = wallSurfaces.find((s) => s.id === root.userData.wallId);
            if (!wall) return false;
            const wallHit = wallImageRaycaster.intersectObject(wall.mesh, false)[0];
            if (!wallHit) return false;
            const local = wall.anchor.worldToLocal(wallHit.point.clone());
            wallImageDrag.active = true;
            wallImageDrag.mesh = root;
            wallImageDrag.wall = wall;
            wallImageDrag.offset.set(local.x - root.position.x, local.y - root.position.y);
            wallImageDrag.moved = false;
            wallImageDrag.suppressClick = false;
            setSelectedWallImage(root);
            renderer.domElement.setPointerCapture(event.pointerId);
            return true;
        }

        function handleWallImagePointerMove(event) {
            if (!wallImageDrag.active || !wallImageDrag.mesh || !wallImageDrag.wall) return;
            const rect = renderer.domElement.getBoundingClientRect();
            wallImagePointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            wallImagePointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            wallImageRaycaster.setFromCamera(wallImagePointer, camera);
            const wallHit = wallImageRaycaster.intersectObject(wallImageDrag.wall.mesh, false)[0];
            if (!wallHit) return;
            const local = wallImageDrag.wall.anchor.worldToLocal(wallHit.point.clone());
            const nextX = local.x - wallImageDrag.offset.x;
            const nextY = local.y - wallImageDrag.offset.y;
            if (!wallImageDrag.moved) {
                const dx = nextX - wallImageDrag.mesh.position.x;
                const dy = nextY - wallImageDrag.mesh.position.y;
                if (Math.hypot(dx, dy) > 0.02) wallImageDrag.moved = true;
            }
            wallImageDrag.mesh.position.x = nextX;
            wallImageDrag.mesh.position.y = nextY;
            clampWallImagePosition(wallImageDrag.mesh, wallImageDrag.wall);
            syncWallImageData(wallImageDrag.mesh);
        }

        function handleWallImagePointerUp(event) {
            if (!wallImageDrag.active) return;
            wallImageDrag.active = false;
            if (event && renderer?.domElement && renderer.domElement.hasPointerCapture?.(event.pointerId)) {
                renderer.domElement.releasePointerCapture(event.pointerId);
            }
            if (wallImageDrag.moved) wallImageDrag.suppressClick = true;
            wallImageDrag.mesh = null;
            wallImageDrag.wall = null;
            wallImageDrag.offset.set(0, 0);
            if (wallImageDrag.moved) queueWallImagesSave();
        }

        function handleWallImageClick(event) {
            if (isLocked || !wallImageGroup) return false;
            if (wallImageDrag.suppressClick) {
                wallImageDrag.suppressClick = false;
                return true;
            }
            const rect = renderer.domElement.getBoundingClientRect();
            wallImagePointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            wallImagePointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            wallImageRaycaster.setFromCamera(wallImagePointer, camera);
            const hits = wallImageRaycaster.intersectObjects(wallImageGroup.children, true);
            if (!hits.length) {
                if (selectedWallImageId) {
                    setSelectedWallImage(null);
                    return true;
                }
                return false;
            }
            const mesh = hits[0].object.userData?.id ? hits[0].object : hits[0].object.parent;
            if (!mesh || !mesh.userData?.id) return false;
            setSelectedWallImage(mesh);
            return true;
        }

        function createBeerBoard() {
            boardGroup.clear();
            boardArrowMeshes = [];
            boardActionMeshes = [];
            boardContentGroup = new THREE.Group();

            const boardWidth = room.width * 0.7;
            const boardHeight = 7.4;
            const boardDepth = 0.3;
            const frameThickness = 0.35;
            const innerPadding = 0.8;
            const boardMat = new THREE.MeshStandardMaterial({ color: 0x0f141d, roughness: 0.9, metalness: 0.05 });
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x3c2a1d, roughness: 0.7, metalness: 0.1 });
            const boardMesh = new THREE.Mesh(new THREE.BoxGeometry(boardWidth, boardHeight, boardDepth), boardMat);
            boardMesh.position.set(0, 4.15, -room.depth / 2 + 0.2);
            boardMesh.rotation.y = 0;
            boardGroup.add(boardMesh);
            boardGroup.userData.boardPos = boardMesh.position.clone();

            const frameGeoH = new THREE.BoxGeometry(boardWidth + frameThickness * 2, frameThickness, boardDepth + 0.05);
            const frameGeoV = new THREE.BoxGeometry(frameThickness, boardHeight + frameThickness * 2, boardDepth + 0.05);
            const frameTop = new THREE.Mesh(frameGeoH, frameMat);
            frameTop.position.set(0, boardMesh.position.y + boardHeight / 2 + frameThickness / 2, boardMesh.position.z);
            const frameBottom = frameTop.clone();
            frameBottom.position.y = boardMesh.position.y - boardHeight / 2 - frameThickness / 2;
            const frameLeft = new THREE.Mesh(frameGeoV, frameMat);
            frameLeft.position.set(-boardWidth / 2 - frameThickness / 2, boardMesh.position.y, boardMesh.position.z);
            const frameRight = frameLeft.clone();
            frameRight.position.x = boardWidth / 2 + frameThickness / 2;
            boardGroup.add(frameTop, frameBottom, frameLeft, frameRight);

            boardContentGroup.position.set(0, boardMesh.position.y + boardHeight * 0.015, boardMesh.position.z + 0.18);
            boardGroup.add(boardContentGroup);

            const arrowMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.6, metalness: 0.2 });
            const arrowGeo = new THREE.ConeGeometry(0.5, 1.05, 3);
            const arrowLeft = new THREE.Mesh(arrowGeo, arrowMat);
            arrowLeft.rotation.z = Math.PI / 2;
            arrowLeft.position.set(-boardWidth / 2 - 0.9, boardMesh.position.y, boardMesh.position.z + 0.55);
            arrowLeft.userData.scrollDir = 1;
            const arrowRight = new THREE.Mesh(arrowGeo, arrowMat);
            arrowRight.rotation.z = -Math.PI / 2;
            arrowRight.position.set(boardWidth / 2 + 0.9, boardMesh.position.y, boardMesh.position.z + 0.55);
            arrowRight.userData.scrollDir = -1;
            boardGroup.add(arrowLeft, arrowRight);
            boardArrowMeshes.push(arrowLeft, arrowRight);

            boardGroup.userData.boardWidth = boardWidth;
            boardGroup.userData.boardHeight = boardHeight;

            const innerWidth = boardWidth - frameThickness * 2 - innerPadding;
            const innerHeight = boardHeight - frameThickness * 2 - innerPadding;
            boardGroup.userData.innerWidth = innerWidth;
            boardGroup.userData.innerHeight = innerHeight;
            const left = boardMesh.position.x - innerWidth / 2;
            const right = boardMesh.position.x + innerWidth / 2;
            const bottom = boardMesh.position.y - innerHeight / 2;
            const top = boardMesh.position.y + innerHeight / 2;
            boardClipPlanes = [
                new THREE.Plane(new THREE.Vector3(1, 0, 0), -left),
                new THREE.Plane(new THREE.Vector3(-1, 0, 0), right),
                new THREE.Plane(new THREE.Vector3(0, 1, 0), -bottom),
                new THREE.Plane(new THREE.Vector3(0, -1, 0), top)
            ];
            const clipGeo = new THREE.PlaneGeometry(innerWidth, innerHeight);
            const clipMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            clipMat.colorWrite = false;
            clipMat.depthTest = false;
            clipMat.depthWrite = false;
            clipMat.stencilWrite = true;
            clipMat.stencilRef = boardStencilRef;
            clipMat.stencilFunc = THREE.AlwaysStencilFunc;
            clipMat.stencilZPass = THREE.ReplaceStencilOp;
            clipMat.stencilZFail = THREE.ReplaceStencilOp;
            clipMat.stencilFail = THREE.ReplaceStencilOp;
            clipMat.side = THREE.DoubleSide;
            boardClipMesh = new THREE.Mesh(clipGeo, clipMat);
            boardClipMesh.position.set(boardMesh.position.x, boardMesh.position.y, boardMesh.position.z + 0.16);
            boardClipMesh.renderOrder = 1;
            boardGroup.add(boardClipMesh);

            const addButtonTex = createBoardButtonTexture('Добавить пиво');
            const addButtonMat = new THREE.MeshBasicMaterial({ map: addButtonTex, transparent: true });
            const addButtonMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.85, 0.55), addButtonMat);
            addButtonMesh.position.set(boardMesh.position.x + boardWidth / 2 - 1.28, boardMesh.position.y + boardHeight / 2 - 0.45, boardMesh.position.z + 0.26);
            addButtonMesh.userData.action = 'add-beer';
            boardGroup.add(addButtonMesh);
            boardActionMeshes.push(addButtonMesh);
        }

        function ensureCssRenderer() {
            if (cssRenderer && cssScene) return true;
            if (!window.THREE?.CSS3DRenderer || !window.THREE?.CSS3DObject) return false;
            cssScene = new THREE.Scene();
            cssRenderer = new THREE.CSS3DRenderer();
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.domElement.className = 'css3d-root';
            cssRenderer.domElement.style.position = 'absolute';
            cssRenderer.domElement.style.top = '0';
            cssRenderer.domElement.style.left = '0';
            cssRenderer.domElement.style.zIndex = '1';
            cssRenderer.domElement.style.pointerEvents = 'none';
            const exitHandler = (event) => {
                if (!isBeerAddOpen) return;
                if (event.target.closest && event.target.closest('.beer-add-3d')) return;
                exitBeerAddEditing(event);
            };
            cssRenderer.domElement.addEventListener('pointerdown', exitHandler);
            cssRenderer.domElement.addEventListener('click', exitHandler);
            document.getElementById('scene').appendChild(cssRenderer.domElement);
            return true;
        }

        function updateBeerAddPointerEvents() {
            if (!cssRenderer?.domElement) return;
            if (!isBeerAddOpen) {
                cssRenderer.domElement.style.pointerEvents = 'none';
                return;
            }
            cssRenderer.domElement.style.pointerEvents = isLocked ? 'none' : 'auto';
        }

        function exitBeerAddEditing(event) {
            if (!isBeerAddOpen) return;
            const active = document.activeElement;
            if (active && active.closest && active.closest('.beer-add-3d')) {
                active.blur();
            }
            document.querySelectorAll('.beer-add-3d .cs.open').forEach((node) => {
                node.classList.remove('open');
                const btn = node.querySelector('.cs-btn');
                if (btn) btn.setAttribute('aria-expanded', 'false');
            });
            if (cssRenderer?.domElement) cssRenderer.domElement.style.pointerEvents = 'none';
            const prefersCssLock = Boolean(
                cssRenderer?.domElement &&
                event?.target &&
                cssRenderer.domElement.contains(event.target)
            );
            const lockTarget = prefersCssLock ? cssRenderer?.domElement : renderer?.domElement;
            if (lockTarget?.requestPointerLock) {
                lockTarget.requestPointerLock();
            } else if (cssRenderer?.domElement?.requestPointerLock) {
                cssRenderer.domElement.requestPointerLock();
            }
            window.setTimeout(() => {
                if (!isBeerAddOpen) return;
                if (
                    document.pointerLockElement !== renderer?.domElement &&
                    document.pointerLockElement !== cssRenderer?.domElement
                ) {
                    updateBeerAddPointerEvents();
                }
            }, 250);
        }

        function setupCustomSelect(wrapper, options, defaultValue) {
            if (!wrapper || !options?.length) return;
            if (wrapper.dataset.ready === 'true') return;
            const btn = wrapper.querySelector('.cs-btn');
            const menu = wrapper.querySelector('.cs-menu');
            if (!btn || !menu) return;
            wrapper.dataset.ready = 'true';

            const setValue = (value) => {
                const option = options.find((opt) => opt.value === value) || options[0];
                wrapper.dataset.value = option.value;
                btn.textContent = option.label;
                menu.querySelectorAll('.cs-opt').forEach((opt) => {
                    opt.setAttribute('aria-selected', String(opt.dataset.value === option.value));
                });
            };

            menu.innerHTML = '';
            options.forEach((opt) => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'cs-opt';
                item.dataset.value = opt.value;
                item.textContent = opt.label;
                item.setAttribute('aria-selected', 'false');
                item.addEventListener('pointerdown', (event) => event.stopPropagation());
                item.addEventListener('click', (event) => {
                    event.stopPropagation();
                    setValue(opt.value);
                    wrapper.classList.remove('open');
                    btn.setAttribute('aria-expanded', 'false');
                });
                menu.appendChild(item);
            });

            btn.addEventListener('click', (event) => {
                event.stopPropagation();
                const root = wrapper.closest('.beer-add-3d');
                if (root) {
                    root.querySelectorAll('.cs.open').forEach((node) => {
                        if (node !== wrapper) {
                            node.classList.remove('open');
                            const nodeBtn = node.querySelector('.cs-btn');
                            if (nodeBtn) nodeBtn.setAttribute('aria-expanded', 'false');
                        }
                    });
                }
                const open = !wrapper.classList.contains('open');
                wrapper.classList.toggle('open', open);
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
            });

            setValue(defaultValue ?? options[0].value);
        }

        function updateBeerBoard() {
            if (!boardGroup) return;
            if (!beerData.length) {
                boardContentGroup.clear();
                return;
            }
            const prevTarget = boardScrollState.target;
            const prevOffset = boardScrollState.offset;
            boardContentGroup.clear();
            const boardWidth = boardGroup.userData.boardWidth || room.width * 0.7;
            const innerWidth = boardGroup.userData.innerWidth || (boardWidth - 4.4);
            const gap = 0.2;
            const itemWidth = Math.min(2.6, Math.max(1.9, innerWidth / Math.min(beerData.length, 22)));
            const titleAspect = BEER_TITLE_CANVAS.width / BEER_TITLE_CANVAS.height;
            const infoAspect = BEER_INFO_CANVAS.width / BEER_INFO_CANVAS.height;
            const titleWidth = itemWidth * 0.98;
            const titleHeight = titleWidth / titleAspect;
            const infoWidth = itemWidth * 1.02;
            const infoHeight = infoWidth / infoAspect;
            const totalWidth = itemWidth * beerData.length + gap * (beerData.length - 1);
            boardScrollState.maxOffset = Math.max(0, (totalWidth - innerWidth) / 2);
            boardScrollState.step = itemWidth + gap;
            const maxOffset = boardScrollState.maxOffset || 0;
            const clampOffset = (value) => Math.max(-maxOffset, Math.min(maxOffset, value));
            if (boardScrollState.initialized) {
                const nextTarget = Number.isFinite(prevTarget) ? prevTarget : prevOffset;
                const nextOffset = Number.isFinite(prevOffset) ? prevOffset : nextTarget;
                boardScrollState.target = clampOffset(Number.isFinite(nextTarget) ? nextTarget : 0);
                boardScrollState.offset = clampOffset(Number.isFinite(nextOffset) ? nextOffset : boardScrollState.target);
            } else {
                boardScrollState.target = maxOffset;
                boardScrollState.offset = boardScrollState.target;
                boardScrollState.initialized = true;
            }
            boardContentGroup.position.x = boardScrollState.offset;

            const startX = -totalWidth / 2 + itemWidth / 2;
            beerData.forEach((beer, i) => {
                const group = new THREE.Group();
                group.position.set(startX + i * (itemWidth + gap), 0, 0);
                const bottle = createBottleMesh(beer);
                const bottleYOffset = 0.25;
                bottle.position.set(0, bottleYOffset, 0);
                group.add(bottle);

                const bottleBottom = bottleYOffset - 1.25;
                const titleGap = 0.16;
                const infoGap = 0.18;
                const titleY = bottleBottom - titleGap - titleHeight / 2;
                const infoY = titleY - titleHeight / 2 - infoGap - infoHeight / 2;

                const titleTex = createBeerTitleTexture(beer);
                const titleMat = new THREE.MeshBasicMaterial({ map: titleTex, transparent: true });
                applyBoardStencil(titleMat);
                const titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(titleWidth, titleHeight), titleMat);
                titleMesh.position.set(0, titleY, 0.02);
                group.add(titleMesh);

                const infoTex = createBeerInfoTexture(beer);
                const infoMat = new THREE.MeshBasicMaterial({ map: infoTex, transparent: true });
                applyBoardStencil(infoMat);
                const infoMesh = new THREE.Mesh(new THREE.PlaneGeometry(infoWidth, infoHeight), infoMat);
                infoMesh.position.set(0, infoY, 0.02);
                group.add(infoMesh);

                boardContentGroup.add(group);
            });
            applyBoardStencilToGroup();
        }

        function applyBoardStencilToGroup() {
            if (!boardContentGroup || !boardClipMesh) return;
            boardContentGroup.traverse((obj) => {
                if (!obj.isMesh) return;
                obj.renderOrder = 2;
                const material = obj.material;
                if (Array.isArray(material)) {
                    material.forEach((mat) => applyBoardStencil(mat));
                } else {
                    applyBoardStencil(material);
                }
            });
        }

        function applyBoardClipping(material) {
            if (!material || !boardClipPlanes) return;
            material.clippingPlanes = boardClipPlanes;
            material.clipIntersection = true;
            material.needsUpdate = true;
        }

        function applyBoardStencil(material) {
            if (!material) return;
            material.stencilWrite = true;
            material.stencilRef = boardStencilRef;
            material.stencilFunc = THREE.EqualStencilFunc;
            material.stencilFail = THREE.KeepStencilOp;
            material.stencilZFail = THREE.KeepStencilOp;
            material.stencilZPass = THREE.KeepStencilOp;
            material.needsUpdate = true;
        }

        function updateBeerBoardArrows() {
            if (!boardArrowMeshes.length) return;
            const maxOffset = boardScrollState.maxOffset || 0;
            const offset = boardScrollState.target || 0;
            boardArrowMeshes.forEach((arrow) => {
                if (!arrow.userData.scrollDir) return;
                if (maxOffset <= 0) {
                    arrow.visible = false;
                    return;
                }
                if (arrow.userData.scrollDir > 0) {
                    arrow.visible = offset < maxOffset - 0.05;
                } else {
                    arrow.visible = offset > -maxOffset + 0.05;
                }
            });
        }

        function scrollBeerBoard(direction) {
            if (!boardContentGroup) return;
            const step = boardScrollState.step || 0;
            if (!step) return;
            const next = (boardScrollState.target ?? boardScrollState.offset ?? 0) + direction * step;
            const maxOffset = boardScrollState.maxOffset || 0;
            boardScrollState.target = Math.max(-maxOffset, Math.min(maxOffset, next));
            updateBeerBoardArrows();
        }

        function startBoardScrollHold(direction) {
            boardScrollState.holdDir = direction;
            boardScrollState.speed = 8.5;
        }

        function stopBoardScrollHold() {
            boardScrollState.holdDir = 0;
            boardScrollState.speed = 0;
        }

        function handleBeerAddLockedClick(event) {
            if (!isBeerAddOpen || !isLocked || !beerAddHitMesh || !renderer || !camera) return false;
            if (!beerAddHitMesh.visible) return false;
            const rect = renderer.domElement.getBoundingClientRect();

            boardRaycaster.setFromCamera(boardPointer, camera);

            if (!hits.length) return false;

            const cssRect = cssRenderer.domElement.getBoundingClientRect();
            const px = cssRect.left + cssRect.width / 2;
            const py = cssRect.top + cssRect.height / 2;
            const prevPointerEvents = cssRenderer.domElement.style.pointerEvents;
            cssRenderer.domElement.style.pointerEvents = 'auto';
            const elements = document.elementsFromPoint
                ? document.elementsFromPoint(px, py)
                : [document.elementFromPoint(px, py)].filter(Boolean);
            cssRenderer.domElement.style.pointerEvents = prevPointerEvents;
            const pick = (selector) => elements.find((el) => el?.matches?.(selector) || el?.closest?.(selector));
            const scoped = elements.find((el) => el?.closest && el.closest('.beer-add-3d'));
            if (!scoped) return true;
            const optionEl = pick('.cs-opt');

                optionEl.closest('.cs-opt')?.click?.();

            }
            const input = pick('input');
            if (input) {
                const field = input.closest('input') || input;
                field.focus();
                if (field.select) field.select();
                return true;
            }
            const openMenu = document.querySelector('.beer-add-3d .cs.open .cs-menu');
            if (openMenu) {

                if (px >= menuRect.left && px <= menuRect.right && py >= menuRect.top && py <= menuRect.bottom) {
                    const opts = Array.from(openMenu.querySelectorAll('.cs-opt'));
                    if (opts.length) {
                        const optHeight = opts[0].getBoundingClientRect().height || 24;

                        const pickOpt = opts[Math.max(0, Math.min(opts.length - 1, index))];
                        pickOpt?.click?.();
                        return true;
                    }
                }
            }
            const selectBtn = pick('.cs-btn');
            if (selectBtn) {
                selectBtn.closest('.cs-btn')?.click?.();

            }
            const actionBtn = pick('.beer-add-3d button');
            if (actionBtn) {
                actionBtn.closest('.beer-add-3d button')?.click?.();

            }

        function handleBeerBoardClick(event) {

                const actionHits = boardRaycaster.intersectObjects(boardActionMeshes, true);

        function toSafeImageUrl(url) {
            if (!url) return '';
            if (url.startsWith('data:image')) return url;
            const clean = url.replace(/^https?:\/\//i, '');
            return `https://images.weserv.nl/?url=${encodeURIComponent(clean)}&output=png`;
        }

        function truncateText(ctx, text, maxWidth) {
            if (!text) return '';
            if (ctx.measureText(text).width <= maxWidth) return text;
            let clipped = text;
            while (clipped.length > 1 && ctx.measureText(clipped + '…').width > maxWidth) {
                clipped = clipped.slice(0, -1);
            }
            return clipped + '…';
        }

        function connectRealtime() {
            if (!REALTIME_WS_URL) return;
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
            const url = new URL(REALTIME_WS_URL);
            url.searchParams.set('room', REALTIME_ROOM);
            const localId = getLocalClientId();
            url.searchParams.set('id', localId);
            const name = getCurrentUserName() || 'Guest';
            url.searchParams.set('name', name);
            ws = new WebSocket(url.toString());
            wsConnected = false;

            ws.addEventListener('open', () => {
                wsConnected = true;
                lastPresenceSent = 0;
                if (ladderData) {
                    broadcastLadderState();
                }
            });

            ws.addEventListener('message', (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (_) {
                    return;
                }
                if (!data || typeof data.type !== 'string') return;
                if (data.type === 'state') {
                    if (Array.isArray(data.users)) {
                        data.users.forEach((user) => {
                            if (user?.id === localId) return;
                            upsertRemotePlayer(user);
                        });
                    }
                    if (Array.isArray(data.ladders)) {
                        const seen = new Set();
                        data.ladders.forEach((ladder) => {
                            if (!ladder?.id) return;
                            seen.add(String(ladder.id));
                            upsertRemoteLadder({ ...ladder, action: 'add' });
                        });
                        remoteLadders.forEach((_, key) => {
                            if (!seen.has(String(key))) {
                                removeRemoteLadder(key);
                            }
                        });
                    }
                    return;
                }
                if (data.type === 'user_join' && data.user) {
                    if (data.user.id === localId) return;
                    upsertRemotePlayer(data.user);
                    if (ladderData) broadcastLadderState();
                    return;
                }
                if (data.type === 'user_leave' && data.id) {
                    removeRemotePlayer(data.id);
                    return;
                }
                if (data.type === 'ladder') {
                    upsertRemoteLadder(data);
                    return;
                }
                if (data.type === 'presence' && data.user) {
                    if (data.user.id === localId) return;
                    upsertRemotePlayer(data.user);
                }
            });

            ws.addEventListener('close', () => {
                wsConnected = false;
                scheduleRealtimeReconnect();
            });
            ws.addEventListener('error', () => {
                wsConnected = false;
                scheduleRealtimeReconnect();
            });
        }

        function scheduleRealtimeReconnect() {
            if (wsReconnectTimer) return;
            wsReconnectTimer = setTimeout(() => {
                wsReconnectTimer = null;
                connectRealtime();
            }, 2500);
        }

        function sendRealtime(data) {
            if (!wsConnected || !ws || ws.readyState !== WebSocket.OPEN) return;
            try {
                ws.send(JSON.stringify(data));
            } catch (_) {}
        }

        function sendPresenceUpdate() {
            if (!wsConnected || !yawObject) return;
            const now = performance.now();
            if (now - lastPresenceSent < 140) return;
            lastPresenceSent = now;
            const pos = yawObject.position;
            sendRealtime({
                type: 'presence',
                name: getCurrentUserName(),
                x: pos.x,
                y: pos.y,
                z: pos.z,
                yaw: yawObject.rotation.y
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const speed = moveState.fast ? 12 : 6;
            const t = clock.getElapsedTime();
            if (neonSignGroup?.userData?.neon) {
                const neon = neonSignGroup.userData.neon;
                const flicker = 0.9 + 0.1 * Math.sin(t * 0.6) + 0.05 * Math.sin(t * 1.1);
                const jitter = 0.02 * Math.sin(t * 2.3);
                const intensity = Math.max(0.78, flicker + jitter);
                if (neon.halo) neon.halo.intensity = 0.9 + intensity * 1.1;
                if (neon.neonMat) neon.neonMat.emissiveIntensity = 0.85 + intensity * 0.9;
                if (neon.glowMat) neon.glowMat.opacity = 0.12 + intensity * 0.16;
            }
            if (beerRatingSignGroup?.userData?.neon) {
                const neon = beerRatingSignGroup.userData.neon;
                const flicker = 0.9 + 0.1 * Math.sin(t * 0.6) + 0.05 * Math.sin(t * 1.1);
                const jitter = 0.02 * Math.sin(t * 2.1);
                const intensity = Math.max(0.78, flicker + jitter);
                if (neon.halo) neon.halo.intensity = 0.85 + intensity * 1.05;
                if (neon.neonMat) neon.neonMat.emissiveIntensity = 0.8 + intensity * 0.85;
                if (neon.glowMat) neon.glowMat.opacity = 0.1 + intensity * 0.15;
            }
            if (beerAddAnchor && !beerAddAnchor.userData.hasCustomPosition) {
                syncBeerAddModalPosition();
            }
            const dirForward = (moveState.forward ? 1 : 0) - (moveState.back ? 1 : 0);
            const dirRight = (moveState.right ? 1 : 0) - (moveState.left ? 1 : 0);
            if (dirForward !== 0 || dirRight !== 0) {
                const yaw = yawObject.rotation.y;
                const forwardVec = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const rightVec = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const moveVec = forwardVec.multiplyScalar(dirForward).add(rightVec.multiplyScalar(dirRight)).normalize().multiplyScalar(speed * delta);
                const current = yawObject.position.clone();
                const proposed = current.clone().add(moveVec);
                const yBottom = yawObject.position.y - eyeHeight;
                const yTop = yawObject.position.y;
                if (collidesWithSofa(proposed.x, proposed.z, yBottom, yTop)) {
                    const tryX = { x: proposed.x, z: current.z };
                    const tryZ = { x: current.x, z: proposed.z };
                    if (!collidesWithSofa(tryX.x, tryX.z, yBottom, yTop)) {
                        proposed.z = current.z;
                    } else if (!collidesWithSofa(tryZ.x, tryZ.z, yBottom, yTop)) {
                        proposed.x = current.x;
                    } else {
                        proposed.x = current.x;
                        proposed.z = current.z;
                    }
                }
                const wallPadding = playerRadius + 0.15;
                const halfW = room.width / 2 - wallPadding;
                const halfD = room.depth / 2 - wallPadding;
                proposed.x = Math.max(-halfW, Math.min(halfW, proposed.x));
                proposed.z = Math.max(-halfD, Math.min(halfD, proposed.z));
                yawObject.position.x = proposed.x;
                yawObject.position.z = proposed.z;
            }
            if (boardContentGroup) {
                if (boardScrollState.holdDir) {
                    const maxOffset = boardScrollState.maxOffset || 0;
                    const speed = boardScrollState.speed || 0;
                    if (speed > 0) {
                        const base = boardScrollState.target ?? boardScrollState.offset ?? 0;
                        const next = base + boardScrollState.holdDir * speed * delta;
                        boardScrollState.target = Math.max(-maxOffset, Math.min(maxOffset, next));
                        updateBeerBoardArrows();
                    }
                }
                const diff = boardScrollState.target - boardScrollState.offset;
                if (Math.abs(diff) > 0.0005) {
                    const smooth = 1 - Math.exp(-4 * delta);
                    boardScrollState.offset += diff * smooth;
                    boardContentGroup.position.x = boardScrollState.offset;
                } else if (Math.abs(diff) > 0) {
                    boardScrollState.offset = boardScrollState.target;
                    boardContentGroup.position.x = boardScrollState.offset;
                }
            }
            const currentBottom = yawObject.position.y - eyeHeight;
            const groundY = getSofaGroundHeight(yawObject.position.x, yawObject.position.z, currentBottom);
            if (yawObject.position.y > groundY + 0.02) {
                isGrounded = false;
            }
            if (!isGrounded || verticalVelocity !== 0) {
                verticalVelocity += gravity * delta;
                yawObject.position.y += verticalVelocity * delta;
                if (yawObject.position.y <= groundY) {
                    yawObject.position.y = groundY;
                    verticalVelocity = 0;
                    isGrounded = true;
                }
            }
            const ladderGround = getCombinedLadderGroundHeight(yawObject.position.x, yawObject.position.z, currentBottom);
            if (Number.isFinite(ladderGround)) {
                if (yawObject.position.y < ladderGround) {
                    yawObject.position.y = ladderGround;
                    verticalVelocity = 0;
                    isGrounded = true;
                }
            }
            sendPresenceUpdate();
            updateRemotePlayers(delta);
            renderer.render(scene, camera);
            if (cssRenderer && cssScene) {
                cssRenderer.render(cssScene, camera);
            }
        }

        function init() {
            if (!ensureAuth()) return;
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            initUI();
            initScene();
            initBeerRatingFeed();
            initWallImagesFeed();
            connectRealtime();
            const db = firebase.database();
            const cachedBeer = readCache(BEER_CACHE_KEY);
            const hasCachedBeer = Array.isArray(cachedBeer) || (cachedBeer && typeof cachedBeer === 'object');
            if (hasCachedBeer) {
                applyBeerData(cachedBeer, { cache: false });
            }
            const cachedRug = readCache(RUG_CACHE_KEY);
            if (cachedRug) {
                applyRugTexture(cachedRug);
            }
            const rugTs = readCacheTs(RUG_CACHE_TS_KEY);
            if (shouldRefreshCache(rugTs)) {
                db.ref('beerShelfRugUrl').once('value').then((snapshot) => {
                    const url = snapshot.val() || DEFAULT_RUG_URL;
                    applyRugTexture(url);
                    writeCache(RUG_CACHE_KEY, url);
                    writeCacheTs(RUG_CACHE_TS_KEY);
                }).catch((err) => console.warn('beerShelfRugUrl fetch failed', err));
            }
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState !== 'visible') return;
                const freshRugTs = readCacheTs(RUG_CACHE_TS_KEY);
                if (shouldRefreshCache(freshRugTs)) {
                    db.ref('beerShelfRugUrl').once('value').then((snapshot) => {
                        const url = snapshot.val() || DEFAULT_RUG_URL;
                        applyRugTexture(url);
                        writeCache(RUG_CACHE_KEY, url);
                        writeCacheTs(RUG_CACHE_TS_KEY);
                    }).catch((err) => console.warn('beerShelfRugUrl refresh failed', err));
                }
            });
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
