            if (!layer || !hit) return null;
            for (let i = layer.texts.length - 1; i >= 0; i -= 1) {
                const entry = layer.texts[i];
                const bbox = entry.bbox;
                if (!bbox) continue;
                if (hit.x >= bbox.minX && hit.x <= bbox.maxX && hit.y >= bbox.minY && hit.y <= bbox.maxY) {
                    return entry;
                }
            }
            return null;
        }

        function ensureWallTextInput() {
            if (wallTextEditorObject && wallTextInputEl) return wallTextInputEl;
            if (!ensureWallCssRenderer() || !window.THREE?.CSS3DObject) return null;
            const wrap = document.createElement('div');
            wrap.className = 'wall-text-editor';
            const input = document.createElement('div');
            input.contentEditable = 'true';
            input.className = 'wall-text-input';
            input.spellcheck = false;
            wrap.appendChild(input);
            wrap.addEventListener('pointerdown', (event) => event.stopPropagation());
            wrap.addEventListener('click', (event) => event.stopPropagation());
            input.addEventListener('pointerdown', (event) => event.stopPropagation());
            input.addEventListener('click', (event) => event.stopPropagation());
            input.addEventListener('input', () => {
                if (!wallTextEditing) return;
                const layer = wallDrawLayers.get(wallTextEditing.wallId);
                if (!layer) return;
                const entry = layer.texts.find((t) => t.id === wallTextEditing.textId);
                if (!entry) return;
                const liveText = input.innerText ?? input.textContent ?? '';
                entry.text = liveText.replace(/\r\n/g, '\n');
                redrawWallTexts(layer);
                updateWallTextEditorSize(entry.text, entry.size, entry.color);
                redrawWallSelection();
                scheduleWallTextSync(entry, wallTextEditing.wallId);
            });
            input.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter') return;
                if (event.ctrlKey || event.metaKey) {
                    event.preventDefault();
                    commitWallTextEdit();
                }
            });
            const obj = new THREE.CSS3DObject(wrap);
            obj.visible = false;
            obj.scale.set(
                WALL_TEXT_INPUT_WORLD.w / WALL_TEXT_INPUT_PX.w,
                WALL_TEXT_INPUT_WORLD.h / WALL_TEXT_INPUT_PX.h,
                1
            );
            wallTextEditorObject = obj;
            wallTextEditorEl = wrap;
            wallTextInputEl = input;
            wallCssScene.add(obj);
            return input;
        }

        function startWallTextEdit(hit) {
            const layer = wallDrawLayers.get(hit.wallId);
            if (!layer) return;
            let entry = findWallTextAtHit(layer, hit);
            if (!entry) {
                entry = {
                    id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
                    x: hit.x,
                    y: hit.y,
                    text: '',
                    size: getWallTextSize(),
                    color: wallDrawColor
                };
                layer.texts.push(entry);
            }
            wallTextEditing = { wallId: hit.wallId, textId: entry.id };
            wallDrawLastWallId = hit.wallId;
            redrawWallTexts(layer);
            const input = ensureWallTextInput();
            if (!input || !wallTextEditorObject) return;
            const wall = wallSurfaces.find((s) => s.id === hit.wallId);
            if (!wall) return;
            ensureWallCssAnchor(wall);
            if (wallTextEditorObject.parent !== wall.cssAnchor) {
                wall.cssAnchor.add(wallTextEditorObject);
            }
            const local = wallDrawCanvasToLocal(hit.wallId, entry.x, entry.y);
            wallTextEditorObject.position.set(local.localX, local.localY, WALL_DRAW_TEXT_OFFSET + 0.02);
            wallTextEditorObject.visible = true;
            input.innerText = entry.text || '';
            updateWallTextEditorSize(entry.text || '', entry.size, entry.color || wallDrawColor);
            requestAnimationFrame(() => {
                input.focus();
                try {
                    const selection = window.getSelection();
                    if (selection) {
                        const range = document.createRange();
                        range.selectNodeContents(input);
                        selection.removeAllRanges();
                        selection.addRange(range);
                    }
                } catch (_) {}
            });
            selectWallDrawItem({ type: 'text', wallId: hit.wallId, id: entry.id });
        }

        function commitWallTextEdit() {
            if (!wallTextEditing) return;
            if (wallTextSyncTimer) {
                clearTimeout(wallTextSyncTimer);
                wallTextSyncTimer = null;
            }
            const layer = wallDrawLayers.get(wallTextEditing.wallId);
            const editingRef = wallTextEditing;
            if (layer) {
                const entry = layer.texts.find((t) => t.id === wallTextEditing.textId);
                if (entry) {
                    const liveText = wallTextInputEl
                        ? (wallTextInputEl.innerText ?? wallTextInputEl.textContent ?? '')
                        : entry.text;
                    if (typeof liveText === 'string') {
                        if (liveText.trim() || !String(entry.text || '').trim()) {
                            entry.text = liveText.replace(/\r\n/g, '\n');
                        }
                    }
                    entry.size = entry.size || getWallTextSize();
                    entry.color = entry.color || wallDrawColor;
                    if (!String(entry.text || '').trim()) {
                        layer.texts = layer.texts.filter((t) => t.id !== entry.id);
                        if (wallDrawSelected && wallDrawSelected.type === 'text' && wallDrawSelected.id === entry.id) {
                            wallDrawSelected = null;
                        }
                        sendRealtime({
                            type: 'wall_draw',
                            action: 'delete',
                            wallId: editingRef.wallId,
                            itemType: 'text',
                            itemId: entry.id,
                            clientId: getLocalClientId()
                        });
                    }
                }
                if (entry && String(entry.text || '').trim()) {
                    const payload = {
                        ...entry,
                        text: String(entry.text || '')
                    };
                    sendWallDrawText(payload, editingRef.wallId);
                }
            }
            if (wallTextEditorObject) {
                wallTextEditorObject.visible = false;
            }
            wallTextEditing = null;
            if (layer) {
                redrawWallTexts(layer);
            }
            redrawWallSelection();
            if (wallDrawTool === 'text') {
                setWallDrawTool('cursor');
                updateWallDrawUi();
            }
        }

        function scheduleWallTextSync(entry, wallId) {
            if (!entry || !wallId) return;
            if (!String(entry.text || '').trim()) return;
            if (wallTextSyncTimer) clearTimeout(wallTextSyncTimer);
            wallTextSyncTimer = setTimeout(() => {
                wallTextSyncTimer = null;
                sendWallDrawText(entry, wallId);
            }, 120);
        }

        function clearWallDrawing(id) {
            const layer = wallDrawLayers.get(id);
            if (!layer) return;
            layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
            layer.texture.needsUpdate = true;
            if (layer.textCtx) {
                layer.textCtx.clearRect(0, 0, layer.textCanvas.width, layer.textCanvas.height);
                layer.texts = [];
                layer.textTexture.needsUpdate = true;
            }
            if (Array.isArray(layer.strokes)) {
                layer.strokes = [];
            }
        }

        function clearAllWallDrawings() {
            wallDrawLayers.forEach((_, id) => clearWallDrawing(id));
        }

        function updateWallDrawUi() {
            const panel = document.getElementById('wallDrawPanel');
            if (!panel) return;
            panel.classList.toggle('open', !isLocked);
            panel.classList.toggle('text-mode', wallDrawTool === 'text');
        }

        function setWallDrawTool(tool) {
            wallDrawTool = tool;
            document.querySelectorAll('[data-wall-draw-tool]').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.wallDrawTool === tool);
            });
            const panel = document.getElementById('wallDrawPanel');
            if (panel) {
                panel.classList.toggle('text-mode', tool === 'text');
            }
            if (tool !== 'select-area' && wallSelectDrag.active) {
                wallSelectDrag.active = false;
                wallSelectDrag.wallId = null;
                wallSelectDrag.startX = 0;
                wallSelectDrag.startY = 0;
                wallSelectDrag.endX = 0;
                wallSelectDrag.endY = 0;
            }
            if (tool !== 'cursor') {
                wallDrawSelected = null;
                wallDrawSelectedGroup = null;
                redrawWallSelection();
            }
            if (tool !== 'text') {
                wallDrawPendingTextHit = null;
                commitWallTextEdit();
            }
        }

        function setWallDrawColor(color) {
            wallDrawColor = color;
            document.querySelectorAll('.wall-draw-color').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.color === color);
            });
            if (wallTextEditing) {
                const layer = wallDrawLayers.get(wallTextEditing.wallId);
                if (layer) {
                    const entry = layer.texts.find((t) => t.id === wallTextEditing.textId);
                    if (entry) {
                        entry.color = color;
                        redrawWallTexts(layer);
                        if (wallTextInputEl) {
                            wallTextInputEl.style.color = color;
                        }
                    }
                }
            }
        }

        function initWallDrawPanel() {
            const panel = document.getElementById('wallDrawPanel');
            if (!panel) return;
            panel.addEventListener('pointerdown', (event) => event.stopPropagation());
            panel.addEventListener('pointerup', (event) => event.stopPropagation());
            panel.addEventListener('click', (event) => event.stopPropagation());
            const colorsWrap = document.getElementById('wallDrawColors');
            const colors = ['#f59e0b', '#ffffff', '#ef4444', '#22c55e', '#3b82f6', '#a855f7', '#f97316', '#0f172a'];
            if (colorsWrap) {
                colorsWrap.innerHTML = '';
                colors.forEach((color) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'wall-draw-color';
                    btn.dataset.color = color;
                    btn.style.background = color;
                    btn.addEventListener('click', () => setWallDrawColor(color));
                    colorsWrap.appendChild(btn);
                });
            }
            setWallDrawColor(wallDrawColor);
            panel.querySelectorAll('[data-wall-draw-tool]').forEach((btn) => {
                btn.addEventListener('click', () => setWallDrawTool(btn.dataset.wallDrawTool));
            });
            panel.querySelectorAll('[data-wall-draw-action]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.wallDrawAction;
                    if (action === 'delete') {
                        deleteSelectedWallDraw();
                    }
                });
            });
            const sizeInput = document.getElementById('wallDrawSize');
            if (sizeInput) {
                sizeInput.addEventListener('input', () => {
                    wallDrawSize = Number(sizeInput.value) || 8;
                    if (wallTextEditing) {
                        const layer = wallDrawLayers.get(wallTextEditing.wallId);
                        if (layer) {
                            const entry = layer.texts.find((t) => t.id === wallTextEditing.textId);
                            if (entry) {
                                entry.size = getWallTextSize();
                                redrawWallTexts(layer);
                                scheduleWallTextSync(entry, wallTextEditing.wallId);
                                if (wallTextInputEl) {
                                    wallTextInputEl.style.fontSize = `${entry.size}px`;
                                }
                            }
                        }
                    }
                    if (wallDrawSelected && wallDrawSelected.type === 'text' && !wallTextEditing) {
                        const layer = wallDrawLayers.get(wallDrawSelected.wallId);
                        if (layer) {
                            const entry = layer.texts.find((t) => t.id === wallDrawSelected.id);
                            if (entry) {
                                entry.size = getWallTextSize();
                                redrawWallTexts(layer);
                                sendWallDrawText(entry, wallDrawSelected.wallId);
                                redrawWallSelection();
                            }
                        }
                    }
                });
            }
        }

        function applyCeilingLightSettings() {
            if (!ceilingLight) return;
            const beamOn = !lightState.off;
            ceilingLight.color.set(lightState.color || '#f5c15c');
            if (ceilingLamp && ceilingLamp.material && ceilingLamp.material.emissive) {
                ceilingLamp.material.emissive.set(lightState.color || '#f5c15c');
            }
            if (ceilingBeam && ceilingBeam.material) {
                ceilingBeam.material.color.set(lightState.color || '#f5c15c');
            }
            const safeIntensity = Number.isFinite(lightState.intensity) ? lightState.intensity : 1.2;
            ceilingLight.intensity = safeIntensity;
            if (ambientLight) ambientLight.intensity = 0.12 + safeIntensity * 1.05;
            if (dirLight) dirLight.intensity = 0.18 + safeIntensity * 1.1;
            if (ceilingBeam) {
                const beamOpacity = beamOn ? Math.min(0.6, 0.12 + safeIntensity * 0.12) : 0.0;
                ceilingBeam.material.opacity = beamOpacity;
                ceilingBeam.visible = beamOpacity > 0;
            }
            const minAngle = 0.2;
            const maxAngle = 1.3;
            const safeAngle = Number.isFinite(lightState.spread) ? lightState.spread : 0.7;
            const t = Math.min(1, Math.max(0, (safeAngle - minAngle) / (maxAngle - minAngle)));
            const maxRadius = Math.min(room.width, room.depth) * 0.5 - 0.2;
            const radiusBottom = ceilingBeamRadius + t * Math.max(0.1, (maxRadius - ceilingBeamRadius));
            const height = ceilingBeamHeight || (ceilingBeam?.userData?.height) || room.height * 0.9;
            ceilingLight.angle = Math.atan(radiusBottom / height);
            if (ceilingBeam) {
                const nextGeo = new THREE.CylinderGeometry(ceilingBeamRadius, radiusBottom, height, 24, 1, true);
                ceilingBeam.geometry.dispose();
                ceilingBeam.geometry = nextGeo;
                ceilingBeam.position.set(0, ceilingLight.position.y - height / 2, 0);
            }
        }

        function getLightStateFromInputs() {
            const colorInput = document.getElementById('ceilingLightColor');
            const intensityInput = document.getElementById('ceilingLightIntensity');
            const spreadInput = document.getElementById('ceilingLightSpread');
            const rawIntensity = intensityInput ? Number(intensityInput.value) : NaN;
            const rawSpread = spreadInput ? Number(spreadInput.value) : NaN;
            return {
                color: colorInput?.value || lightState.color || '#f5c15c',
                intensity: Number.isFinite(rawIntensity) ? rawIntensity : (Number.isFinite(lightState.intensity) ? lightState.intensity : 0),
                spread: Number.isFinite(rawSpread) ? rawSpread : (Number.isFinite(lightState.spread) ? lightState.spread : 0.7),
                off: !!ceilingLight?.userData?.off,
                updatedAt: lightState.updatedAt || 0
            };
        }

        function sendLightState() {
            if (lightSyncMuted) return;
            const state = getLightStateFromInputs();
            const now = Date.now();
            lightState = { ...lightState, ...state, updatedAt: now };
            lightPendingLocalUntil = now + 1200;
            try {
                localStorage.setItem(LIGHT_PREFS_KEY, JSON.stringify(lightState));
            } catch (_) {}
            try {
                console.log('[light] send', lightState);
            } catch (_) {}
            if (!USE_FIREBASE_LIGHT) {
                sendRealtime({ type: 'light', state: lightState });
            }
            saveLightSettingsToFirebase();
        }

        function syncLightPanelUI() {
            const colorInput = document.getElementById('ceilingLightColor');
            const intensityInput = document.getElementById('ceilingLightIntensity');
            const spreadInput = document.getElementById('ceilingLightSpread');
            if (colorInput) colorInput.value = lightState.color || '#f5c15c';
            if (intensityInput) intensityInput.value = String(lightState.intensity ?? 3.2);
            if (spreadInput) spreadInput.value = String(lightState.spread ?? 0.85);
            const toggleBtn = document.getElementById('lightToggleButton');
            if (toggleBtn) {
                toggleBtn.classList.toggle('off', lightState.off);
                toggleBtn.textContent = lightState.off ? 'Свет: выкл' : 'Свет: вкл';
            }
        }

        function commitLightInputs() {
            if (!ceilingLight) return;
            const next = getLightStateFromInputs();
            lightState = { ...lightState, ...next, updatedAt: Date.now() };
            lightPendingLocalUntil = lightState.updatedAt + 1200;
            ceilingLight.userData.off = !!lightState.off;
            applyCeilingLightSettings();
            try {
                localStorage.setItem(LIGHT_PREFS_KEY, JSON.stringify(lightState));
            } catch (_) {}
            try {
                console.log('[light] commit', lightState);
            } catch (_) {}
            if (!USE_FIREBASE_LIGHT) {
                sendRealtime({ type: 'light', state: lightState });
            }
            saveLightSettingsToFirebase();
        }

        function applyLightState(state, { silent = false } = {}) {
            if (!state) return;
            const incomingTs = Number(state.updatedAt || 0);
            const localTs = Number(lightState.updatedAt || 0);
            if (USE_FIREBASE_LIGHT && !incomingTs) return;
            const shouldBootstrap = USE_FIREBASE_LIGHT ? Boolean(incomingTs) : true;
            if (!incomingTs && hasLocalLightPrefs) {
                try {
                    console.log('[light] ignore server state without updatedAt');
                } catch (_) {}
                return;
            }
            if (incomingTs && localTs && incomingTs + 20 < localTs) {
                try {
                    console.log('[light] ignore stale', { incomingTs, localTs });
                } catch (_) {}
                return;
            }
            lightSyncMuted = true;
            lightState = {
                color: typeof state.color === 'string' ? state.color : lightState.color,
                intensity: Number.isFinite(state.intensity) ? Number(state.intensity) : lightState.intensity,
                spread: Number.isFinite(state.spread) ? Number(state.spread) : lightState.spread,
                off: !!state.off,
                updatedAt: incomingTs || lightState.updatedAt
            };
            if (!ceilingLight) {
                lightSyncMuted = false;
                if (shouldBootstrap) {
                    lightStateBootstrapped = true;
                }
                try {
                    localStorage.setItem(LIGHT_PREFS_KEY, JSON.stringify(lightState));
                } catch (_) {}
                try {
                    console.log('[light] apply without scene', lightState);
                } catch (_) {}
                return;
            }
            ceilingLight.userData.off = !!lightState.off;
            syncLightPanelUI();
            applyCeilingLightSettings();
            lightSyncMuted = false;
            try {
                localStorage.setItem(LIGHT_PREFS_KEY, JSON.stringify(lightState));
            } catch (_) {}
            try {
                console.log('[light] apply', lightState);
            } catch (_) {}
            if (shouldBootstrap) {
                lightStateBootstrapped = true;
            }
            if (!silent) sendLightState();
        }

        function initLightSettingsFeed() {
            if (!firebase?.database) return;
            const db = firebase.database();
            db.ref(LIGHT_SETTINGS_PATH).once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data && typeof data === 'object') {
                    applyLightState(data, { silent: true });
                    lightStateBootstrapped = true;
                    hasLocalLightPrefs = true;
                }
            }).catch((err) => {
                try {
                    console.warn('[light] firebase once failed', err);
                } catch (_) {}
            });
            db.ref(LIGHT_SETTINGS_PATH).on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || typeof data !== 'object') {
                    if (hasLocalLightPrefs && !lightFirebaseMuted) {
                        saveLightSettingsToFirebase();
                    }
                    return;
                }
                if (lightFirebaseMuted) return;
                const incomingTs = Number(data.updatedAt || 0);
                const localTs = Number(lightState.updatedAt || 0);
                if (!incomingTs && hasLocalLightPrefs) {
                    return;
                }
                if (incomingTs && localTs && incomingTs < localTs) {
                    return;
                }
                if (lightPendingLocalUntil && Date.now() < lightPendingLocalUntil && incomingTs < localTs) {
                    return;
                }
                lightFirebaseLastTs = incomingTs || lightFirebaseLastTs;
                try {
                    console.log('[light] firebase', data);
                } catch (_) {}
                applyLightState(data, { silent: true });
                lightStateBootstrapped = true;
                hasLocalLightPrefs = true;
            });
        }

        function saveLightSettingsToFirebase() {
            if (!firebase?.database) return;
            if (lightFirebaseMuted) return;
            const db = firebase.database();
            const now = Date.now();
            const nextTs = Math.max(lightState.updatedAt || 0, lightFirebaseLastTs + 1, now);
            const serverTs = firebase?.database?.ServerValue?.TIMESTAMP;
            const payload = {
                ...lightState,
                updatedAt: serverTs || nextTs
            };
            lightFirebaseMuted = true;
            db.ref(LIGHT_SETTINGS_PATH).set(payload)
                .then(() => {
                    try {
                        console.log('[light] firebase saved', payload);
                    } catch (_) {}
                    lightFirebaseLastTs = nextTs || lightFirebaseLastTs;
                })
                .catch((err) => {
                    try {
                        console.warn('[light] firebase save failed', err);
                    } catch (_) {}
                })
                .finally(() => {
                    setTimeout(() => {
                        lightFirebaseMuted = false;
                    }, 120);
                });
        }

        function getWallImageScreenRect(mesh, rect) {
            if (!mesh || !rect) return null;
            const cssEl = mesh.userData?.cssObject?.element;
            if (cssEl && cssEl.getBoundingClientRect) {
                const imgEl = cssEl.querySelector('img');
                const bounds = (imgEl || cssEl).getBoundingClientRect();
                const pad = mesh.userData?.frame ? 14 : 6;
                let minX = bounds.left - pad;
                let maxX = bounds.right + pad;
                let minY = bounds.top - pad;
                let maxY = bounds.bottom + pad;
                const labelMesh = mesh.userData?.labelMesh;
                if (labelMesh && labelMesh.visible) {
                    labelMesh.updateWorldMatrix(true, false);
                    const labelCorners = [
                        new THREE.Vector3(-0.5, -0.5, 0),
                        new THREE.Vector3(0.5, -0.5, 0),
                        new THREE.Vector3(0.5, 0.5, 0),
                        new THREE.Vector3(-0.5, 0.5, 0)
                    ];
                    for (const corner of labelCorners) {
                        const world = labelMesh.localToWorld(corner.clone());
                        const point = projectToScreenPoint(world, rect);
                        if (!point) continue;
                        minX = Math.min(minX, point.x);
                        maxX = Math.max(maxX, point.x);
                        minY = Math.min(minY, point.y);
                        maxY = Math.max(maxY, point.y);
                    }
                }
                return { minX, maxX, minY, maxY };
            }
            if (mesh.updateWorldMatrix) mesh.updateWorldMatrix(true, false);
            const scaleX = Math.max(0.001, mesh.scale.x || 1);
            const scaleY = Math.max(0.001, mesh.scale.y || 1);
            const padWorld = mesh.userData?.frame ? 0.22 : 0.08;
            const padLocalX = padWorld / scaleX;
            const padLocalY = padWorld / scaleY;
            const halfW = 0.5 + padLocalX;
            const halfH = 0.5 + padLocalY;
            const corners = [
                new THREE.Vector3(-halfW, -halfH, 0),
                new THREE.Vector3(halfW, -halfH, 0),
                new THREE.Vector3(halfW, halfH, 0),
                new THREE.Vector3(-halfW, halfH, 0)
            ];
            let minX = Infinity;
            let maxX = -Infinity;
            let minY = Infinity;
            let maxY = -Infinity;
            for (const corner of corners) {
                const world = mesh.localToWorld(corner.clone());
                const point = projectToScreenPoint(world, rect);
                if (!point) return null;
                minX = Math.min(minX, point.x);
                maxX = Math.max(maxX, point.x);
                minY = Math.min(minY, point.y);
                maxY = Math.max(maxY, point.y);
            }
            const labelMesh = mesh.userData?.labelMesh;
            if (labelMesh && labelMesh.visible) {
                const labelCorners = [
                    new THREE.Vector3(-0.5, -0.5, 0),
                    new THREE.Vector3(0.5, -0.5, 0),
                    new THREE.Vector3(0.5, 0.5, 0),
                    new THREE.Vector3(-0.5, 0.5, 0)
                ];
                labelMesh.updateWorldMatrix(true, false);
                for (const corner of labelCorners) {
                    const world = labelMesh.localToWorld(corner.clone());
                    const point = projectToScreenPoint(world, rect);
                    if (!point) continue;
                    minX = Math.min(minX, point.x);
                    maxX = Math.max(maxX, point.x);
                    minY = Math.min(minY, point.y);
                    maxY = Math.max(maxY, point.y);
                }
            }
            if (!Number.isFinite(minX) || !Number.isFinite(minY)) return null;
            return { minX, maxX, minY, maxY };
        }

        function createBeerBoard() {
            boardGroup.clear();

            const frameTop = new THREE.Mesh(frameGeoH, frameMat);
            frameTop.position.set(0, boardMesh.position.y + boardHeight / 2 + frameThickness / 2, boardMesh.position.z);
            const frameBottom = frameTop.clone();
            frameBottom.position.y = boardMesh.position.y - boardHeight / 2 - frameThickness / 2;
            const frameLeft = new THREE.Mesh(frameGeoV, frameMat);
            frameLeft.position.set(-boardWidth / 2 - frameThickness / 2, boardMesh.position.y, boardMesh.position.z);

            const innerWidth = boardWidth - frameThickness * 2 - innerPadding;
            const innerHeight = boardHeight - frameThickness * 2 - innerPadding;
            boardGroup.userData.innerWidth = innerWidth;
            boardGroup.userData.innerHeight = innerHeight;
            const left = boardMesh.position.x - innerWidth / 2;
            const right = boardMesh.position.x + innerWidth / 2;

            boardClipPlanes = [
                new THREE.Plane(new THREE.Vector3(1, 0, 0), -left),

                new THREE.Plane(new THREE.Vector3(0, -1, 0), top)
            ];
            const clipGeo = new THREE.PlaneGeometry(innerWidth, innerHeight);
            const clipMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

            clipMat.depthTest = false;
            clipMat.depthWrite = false;
            clipMat.stencilWrite = true;
            clipMat.stencilRef = boardStencilRef;
            clipMat.stencilFunc = THREE.AlwaysStencilFunc;
            clipMat.stencilZPass = THREE.ReplaceStencilOp;
            clipMat.stencilZFail = THREE.ReplaceStencilOp;
            clipMat.stencilFail = THREE.ReplaceStencilOp;

        function bindWallImageHandlers(dom) {
            if (!dom || wallHandlerTargets.has(dom)) return;
            wallHandlerTargets.add(dom);
            const shouldSkip = (event) => {
                if (isPoopAddOpen || isBeerAddOpen) return true;
                if (!isLocked && wallDrawTool !== 'cursor') return true;
                const target = event?.target;
                if (target?.closest?.('.beer-add-3d') || target?.closest?.('.poop-add-3d')) return true;
                return false;
            };
            dom.addEventListener('pointerdown', (event) => {
                if (shouldSkip(event)) return;
                if (handleWallImagePointerDown(event)) {
                    event.preventDefault();
                    event.stopPropagation();
                }
            });
            dom.addEventListener('pointermove', (event) => {
                if (shouldSkip(event)) return;
                handleWallImagePointerMove(event);
            });
            const endHandler = (event) => {
                if (shouldSkip(event)) return;
                handleWallImagePointerUp(event);
            };
            dom.addEventListener('pointerup', endHandler);
            dom.addEventListener('pointerleave', endHandler);
            dom.addEventListener('pointercancel', endHandler);
            dom.addEventListener('click', (event) => {
                if (shouldSkip(event)) return;
                if (handleWallImageClick(event)) {
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (!isLocked && renderer?.domElement?.requestPointerLock) {
                    if (performance.now() < wallImageInteractionUntil) return;
                    const target = event?.target;
                    if (target?.closest?.('.wall-image-toolbar') || target?.closest?.('.wall-image-css')) return;
                    renderer.domElement.requestPointerLock();
                }
            });
        }

        function bindWallImageGlobalHandlers() {
            if (wallGlobalHandlersBound) return;
            wallGlobalHandlersBound = true;
            const isUiTarget = (target) => {
                if (!target?.closest) return false;
                return Boolean(target.closest('header, .modal, .wall-image-toolbar, .video-wall-panel, .beer-add-3d, .poop-add-3d, .tools-panel, .wall-draw-panel, .light-switch, .light-modal'));
            };
            const fromWallLayer = (event) => {
                for (const node of wallHandlerTargets) {
                    if (node && node.contains && node.contains(event.target)) return true;
                }
                return false;
            };
            document.addEventListener('pointerdown', (event) => {
                if (isLocked || isBeerAddOpen || isPoopAddOpen) return;
                if (isUiTarget(event.target)) return;
                let committedText = false;
                let cachedWallHit = null;
                if (wallDrawTool !== 'cursor') {
                    cachedWallHit = getWallDrawHit(event);
                }
                if (wallTextEditing && event.target !== wallTextInputEl) {
                    commitWallTextEdit();
                    committedText = true;
                    wallImageInteractionUntil = performance.now() + 300;
                    if (!cachedWallHit) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                }
                if (wallDrawTool === 'cursor') {
                    const hit = getWallDrawHit(event);
                    if (hit) {
                        const layer = wallDrawLayers.get(hit.wallId);
                        if (wallDrawSelectedGroup && wallDrawSelectedGroup.wallId === hit.wallId) {
                            const bounds = wallDrawSelectedGroup.bounds;
                            if (bounds && pointInRect(hit.x, hit.y, bounds)) {
                                wallGroupDrag.active = true;
                                wallGroupDrag.moved = false;
                                wallGroupDrag.wallId = hit.wallId;
                                wallGroupDrag.startX = hit.x;
                                wallGroupDrag.startY = hit.y;
                                wallGroupDrag.items = (wallDrawSelectedGroup.items || []).map((item) => {
                                    if (item.type === 'text') {
                                        const entry = layer?.texts?.find((t) => t.id === item.id);
                                        if (!entry) return null;
                                        return { type: 'text', id: entry.id, startX: entry.x, startY: entry.y };
                                    }
                                    if (item.type === 'stroke') {
                                        const stroke = layer?.strokes?.find((s) => s.id === item.id);
                                        if (!stroke) return null;
                                        return {
                                            type: 'stroke',
                                            id: stroke.id,
                                            x1: stroke.x1,
                                            y1: stroke.y1,
                                            x2: stroke.x2,
                                            y2: stroke.y2
                                        };
                                    }
                                    return null;
                                }).filter(Boolean);
                                wallImageInteractionUntil = performance.now() + 300;
                                event.preventDefault();
                                event.stopPropagation();
                                return;
                            }
                            wallDrawSelectedGroup = null;
                            redrawWallSelection();
                        }
                        const textHit = layer ? findWallTextAtHit(layer, hit) : null;
                        const strokeHit = layer ? findWallStrokeAtHit(layer, hit) : null;
                        if (textHit) {
                            wallTextDrag.active = true;
                            wallTextDrag.moved = false;
                            wallTextDrag.wallId = hit.wallId;
                            wallTextDrag.textId = textHit.id;
                            wallTextDrag.offsetX = hit.x - textHit.x;
                            wallTextDrag.offsetY = hit.y - textHit.y;
                            selectWallDrawItem({ type: 'text', wallId: hit.wallId, id: textHit.id });
                            wallDrawLastWallId = hit.wallId;
                            wallImageInteractionUntil = performance.now() + 500;
                            event.preventDefault();
                            event.stopPropagation();
                            return;
                        }
                        if (strokeHit) {
                            wallStrokeDrag.active = true;
                            wallStrokeDrag.moved = false;
                            wallStrokeDrag.wallId = hit.wallId;
                            wallStrokeDrag.strokeId = strokeHit.id;
                            wallStrokeDrag.startX = hit.x;
                            wallStrokeDrag.startY = hit.y;
                            wallStrokeDrag.origin = { ...strokeHit };
                            selectWallDrawItem({ type: 'stroke', wallId: hit.wallId, id: strokeHit.id });
                            wallDrawLastWallId = hit.wallId;
                            wallImageInteractionUntil = performance.now() + 300;
                            event.preventDefault();
                            event.stopPropagation();
                            return;
                        }
                        selectWallDrawItem(null);
                        wallTextClick = { wallId: null, textId: null, at: 0 };
                    } else if (wallDrawSelected || wallDrawSelectedGroup) {
                        selectWallDrawItem(null);
                        wallTextClick = { wallId: null, textId: null, at: 0 };
                    }
                }
                if (wallDrawTool !== 'cursor') {
                    if (committedText && wallDrawTool === 'text') {
                        setWallDrawTool('cursor');
                        updateWallDrawUi();
                        wallImageInteractionUntil = performance.now() + 300;
                        event.preventDefault();
                        event.stopPropagation();
                        return;
                    }
                    if (wallDrawTool === 'select-area') {
                        const hit = cachedWallHit || getWallDrawHit(event);
                        if (hit) {
                            wallSelectDrag.active = true;
                            wallSelectDrag.wallId = hit.wallId;
                            wallSelectDrag.startX = hit.x;
                            wallSelectDrag.startY = hit.y;
                            wallSelectDrag.endX = hit.x;
                            wallSelectDrag.endY = hit.y;
                            wallDrawSelected = null;
                            wallDrawSelectedGroup = null;
                            redrawWallSelection();
                            wallImageInteractionUntil = performance.now() + 300;
                            event.preventDefault();
                            event.stopPropagation();
                            return;
                        }
                        wallDrawSelected = null;
                        wallDrawSelectedGroup = null;
                        redrawWallSelection();
                        return;
                    }
                    const hit = cachedWallHit || getWallDrawHit(event);
                    if (hit) {
                        wallImageInteractionUntil = performance.now() + 500;
                        wallDrawLastWallId = hit.wallId;
                        if (wallDrawTool === 'text') {
                            wallDrawActive = false;
                            wallDrawLast = null;
                            startWallTextEdit(hit);
                        } else {
                            wallDrawActive = true;
                            wallDrawLast = hit;
                            drawWallDot(hit);
                        }
                        event.preventDefault();
                        event.stopPropagation();
                        return;
                    }
                    wallDrawPendingTextHit = null;
                    setWallDrawTool('cursor');
                    updateWallDrawUi();
                    wallImageInteractionUntil = performance.now() + 500;
                    return;
                }
                if (fromWallLayer(event)) return;
                if (handleWallImagePointerDown(event)) {
                    event.preventDefault();
                    event.stopPropagation();
                }
            }, true);
            document.addEventListener('pointermove', (event) => {
                if (wallSelectDrag.active && !isLocked) {
                    const hit = getWallDrawHit(event);
                    if (hit && hit.wallId === wallSelectDrag.wallId) {
                        wallSelectDrag.endX = hit.x;
                        wallSelectDrag.endY = hit.y;
                        redrawWallSelection();
                    }
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (wallGroupDrag.active && !isLocked) {
                    const hit = getWallDrawHit(event);
                    if (hit && hit.wallId === wallGroupDrag.wallId) {
                        const layer = wallDrawLayers.get(hit.wallId);
                        if (layer) {
                            const dx = hit.x - wallGroupDrag.startX;
                            const dy = hit.y - wallGroupDrag.startY;
                            if (!wallGroupDrag.moved && Math.hypot(dx, dy) > 2) {
                                wallGroupDrag.moved = true;
                            }
                            wallGroupDrag.items.forEach((item) => {
                                if (item.type === 'text') {
                                    const entry = layer.texts.find((t) => t.id === item.id);
                                    if (!entry) return;
                                    entry.x = item.startX + dx;
                                    entry.y = item.startY + dy;
                                } else if (item.type === 'stroke') {
                                    const stroke = layer.strokes.find((s) => s.id === item.id);
                                    if (!stroke) return;
                                    stroke.x1 = item.x1 + dx;
                                    stroke.y1 = item.y1 + dy;
                                    stroke.x2 = item.x2 + dx;
                                    stroke.y2 = item.y2 + dy;
                                }
                            });
                            redrawWallTexts(layer);
                            redrawWallStrokes(layer);
                            if (wallDrawSelectedGroup) {
                                wallDrawSelectedGroup.items = wallDrawSelectedGroup.items.map((item) => {
                                    if (item.type === 'text') {
                                        const entry = layer.texts.find((t) => t.id === item.id);
                                        if (!entry?.bbox) return item;
                                        return { ...item, bounds: { ...entry.bbox } };
                                    }
                                    if (item.type === 'stroke') {
                                        const stroke = layer.strokes.find((s) => s.id === item.id);
                                        if (!stroke) return item;
                                        const bounds = getStrokeBounds(stroke);
                                        if (!bounds) return item;
                                        return { ...item, bounds };
                                    }
                                    return item;
                                });
                                wallDrawSelectedGroup.bounds = getGroupBounds(wallDrawSelectedGroup.items);
                            }
                            redrawWallSelection();
                        }
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    return;
                }
                if (wallDrawActive && wallDrawTool !== 'cursor' && !isLocked) {
                    const hit = getWallDrawHit(event);
                    if (hit && (wallDrawTool === 'pen' || wallDrawTool === 'eraser')) {
                        drawWallLine(hit);
                        wallImageInteractionUntil = performance.now() + 200;
                    }
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (wallTextDrag.active && !isLocked) {
                    const hit = getWallDrawHit(event);
                    if (hit && hit.wallId === wallTextDrag.wallId) {
                        const layer = wallDrawLayers.get(hit.wallId);
                        if (layer) {
                            const entry = layer.texts.find((t) => t.id === wallTextDrag.textId);
                            if (entry) {
                                const nextX = hit.x - wallTextDrag.offsetX;
                                const nextY = hit.y - wallTextDrag.offsetY;
                                const dx = nextX - entry.x;
                                const dy = nextY - entry.y;
                                if (!wallTextDrag.moved && Math.hypot(dx, dy) > 2) {
                                    wallTextDrag.moved = true;
                                }
                                entry.x = nextX;
                                entry.y = nextY;
                                redrawWallTexts(layer);
                                redrawWallSelection();
                                scheduleWallTextSync(entry, hit.wallId);
                            }
                        }
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    return;
                }
                if (wallStrokeDrag.active && !isLocked) {
                    const hit = getWallDrawHit(event);
                    if (hit && hit.wallId === wallStrokeDrag.wallId) {
                        const layer = wallDrawLayers.get(hit.wallId);
                        const stroke = layer?.strokes?.find((s) => s.id === wallStrokeDrag.strokeId);
                        if (stroke && wallStrokeDrag.origin) {
                            const dx = hit.x - wallStrokeDrag.startX;
                            const dy = hit.y - wallStrokeDrag.startY;
                            if (!wallStrokeDrag.moved && Math.hypot(dx, dy) > 2) {
                                wallStrokeDrag.moved = true;
                            }
                            stroke.x1 = wallStrokeDrag.origin.x1 + dx;
                            stroke.y1 = wallStrokeDrag.origin.y1 + dy;
                            stroke.x2 = wallStrokeDrag.origin.x2 + dx;
                            stroke.y2 = wallStrokeDrag.origin.y2 + dy;
                            redrawWallStrokes(layer);
                            selectWallDrawItem({ type: 'stroke', wallId: hit.wallId, id: stroke.id });
                        }
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    return;
                }
                if (!wallImageDrag.active) return;
                handleWallImagePointerMove(event);
            }, true);
            const endHandler = (event) => {
                if (wallSelectDrag.active) {
                    const wallId = wallSelectDrag.wallId;
                    const rect = normalizeWallRect(
                        wallSelectDrag.startX,
                        wallSelectDrag.startY,
                        wallSelectDrag.endX,
                        wallSelectDrag.endY
                    );
                    const width = rect.maxX - rect.minX;
                    const height = rect.maxY - rect.minY;
                    wallSelectDrag.active = false;
                    wallSelectDrag.wallId = null;
                    wallSelectDrag.startX = 0;
                    wallSelectDrag.startY = 0;
                    wallSelectDrag.endX = 0;
                    wallSelectDrag.endY = 0;
                    if (wallId && width > 6 && height > 6) {
                        selectWallDrawGroup(wallId, rect);
                    } else {
                        wallDrawSelectedGroup = null;
                        wallDrawSelected = null;
                        redrawWallSelection();
                    }
                    wallImageInteractionUntil = performance.now() + 200;
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (wallGroupDrag.active) {
                    const moved = wallGroupDrag.moved;
                    const wallId = wallGroupDrag.wallId;
                    const layer = wallDrawLayers.get(wallId);
                    const items = wallGroupDrag.items || [];
                    wallGroupDrag.active = false;
                    wallGroupDrag.moved = false;
                    wallGroupDrag.wallId = null;
                    wallGroupDrag.items = [];
                    if (moved && layer) {
                        items.forEach((item) => {
                            if (item.type === 'text') {
                                const entry = layer.texts.find((t) => t.id === item.id);
                                if (entry) {
                                    sendWallDrawText(entry, wallId);
                                }
                            } else if (item.type === 'stroke') {
                                const stroke = layer.strokes.find((s) => s.id === item.id);
                                if (stroke) {
                                    sendRealtime({
                                        type: 'wall_draw',
                                        action: 'stroke',
                                        wallId,
                                        strokeId: stroke.id,
                                        tool: stroke.tool,
                                        color: stroke.color,
                                        size: stroke.size,
                                        x1: stroke.x1,
                                        y1: stroke.y1,
                                        x2: stroke.x2,
                                        y2: stroke.y2,
                                        clientId: getLocalClientId()
                                    });
                                }
                            }
                        });
                    }
                    wallImageInteractionUntil = performance.now() + 200;
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (wallDrawActive && wallDrawTool !== 'cursor') {
                    wallDrawActive = false;
                    wallDrawLast = null;
                    wallImageInteractionUntil = performance.now() + 300;
                }
                if (wallTextDrag.active) {
                    const moved = wallTextDrag.moved;
                    const wallId = wallTextDrag.wallId;
                    const layer = wallDrawLayers.get(wallId);
                    const entry = layer?.texts?.find((t) => t.id === wallTextDrag.textId);
                    wallTextDrag.active = false;
                    wallTextDrag.moved = false;
                    wallTextDrag.wallId = null;
                    wallTextDrag.textId = null;
                    if (entry && !moved) {
                        const now = performance.now();
                        const isDoubleClick = wallTextClick.wallId === wallId
                            && wallTextClick.textId === entry.id
                            && (now - wallTextClick.at) < 350;
                        wallTextClick = { wallId, textId: entry.id, at: now };
                        if (isDoubleClick) {
                            const local = wallDrawCanvasToLocal(wallId, entry.x, entry.y);
                            setWallDrawTool('text');
                            startWallTextEdit({
                                wallId,
                                x: entry.x,
                                y: entry.y,
                                localX: local.localX,
                                localY: local.localY
                            });
                        }
                    } else if (entry && moved) {
                        sendWallDrawText(entry, wallId);
                        wallTextClick = { wallId: null, textId: null, at: 0 };
                    }
                    wallImageInteractionUntil = performance.now() + 300;
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (wallStrokeDrag.active) {
                    const moved = wallStrokeDrag.moved;
                    const wallId = wallStrokeDrag.wallId;
                    const layer = wallDrawLayers.get(wallId);
                    const stroke = layer?.strokes?.find((s) => s.id === wallStrokeDrag.strokeId);
                    wallStrokeDrag.active = false;
                    wallStrokeDrag.moved = false;
                    wallStrokeDrag.wallId = null;
                    wallStrokeDrag.strokeId = null;
                    wallStrokeDrag.origin = null;
                    if (stroke && moved) {
                        sendRealtime({
                            type: 'wall_draw',
                            action: 'stroke',
                            wallId,
                            strokeId: stroke.id,
                            tool: stroke.tool,
                            color: stroke.color,
                            size: stroke.size,
                            x1: stroke.x1,
                            y1: stroke.y1,
                            x2: stroke.x2,
                            y2: stroke.y2,
                            clientId: getLocalClientId()
                        });
                    }
                    wallImageInteractionUntil = performance.now() + 300;
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (wallImageDrag.active) {
                    handleWallImagePointerUp(event);
                }
                if (isLocked || isBeerAddOpen || isPoopAddOpen) return;
                if (isUiTarget(event.target)) return;
                if (wallImageDrag.suppressClick) {
                    wallImageDrag.suppressClick = false;
                    return;
                }
                const picked = pickWallImageByDomPoint(event.clientX, event.clientY);
                if (picked) {
                    setSelectedWallImage(picked);
                    wallImageInteractionUntil = performance.now() + 500;
                    event.preventDefault();
                    event.stopPropagation();
                }
            };
            document.addEventListener('pointerup', endHandler, true);
            document.addEventListener('pointercancel', endHandler, true);
        }

        function scheduleCssRendererRetry() {
            if (cssInitRetryId) return;
            cssInitRetryId = window.setTimeout(() => {
                cssInitRetryId = null;
                if (ensureCssRenderer()) {
                    refreshCssContentAfterInit();
                } else {
                    scheduleCssRendererRetry();
                }
            }, 120);
        }

        function refreshCssContentAfterInit() {
            if (wallSurfaces.length) {
                wallSurfaces.forEach((wall) => ensureWallCssAnchor(wall));
            }
            if (wallImageMeshMap.size) {
                wallImageMeshMap.forEach((mesh) => {
                    const url = mesh.userData.url || wallImages.find((img) => String(img.id) === String(mesh.userData.id))?.url || '';
                    if (mesh?.material?.map) return;
                    if (url) setupWallImageTexture(mesh, url);
                });
            }
            if (boardGroup && beerData.length) {
                updateBeerBoard();
            }
        }

        function updateBeerAddPointerEvents() {
            if (!cssRenderer?.domElement) return;
            if (isLightControlOpen) {
                cssRenderer.domElement.style.pointerEvents = 'auto';
                if (renderer?.domElement) renderer.domElement.style.pointerEvents = 'auto';
                if (wallCssRenderer?.domElement) wallCssRenderer.domElement.style.pointerEvents = 'none';
                cssRenderer.domElement.style.cursor = '';
                if (renderer?.domElement) renderer.domElement.style.cursor = '';
                return;
            }
            if (isPoopAddOpen) {
                cssRenderer.domElement.style.pointerEvents = 'auto';
                if (renderer?.domElement) renderer.domElement.style.pointerEvents = 'auto';
                if (wallImageGroup) wallImageGroup.visible = true;
                if (wallCssRenderer?.domElement) wallCssRenderer.domElement.style.pointerEvents = 'none';
                cssRenderer.domElement.style.cursor = '';
                if (renderer?.domElement) renderer.domElement.style.cursor = '';
                return;
            }
            if (!isBeerAddOpen && !isPoopAddOpen) {
                const allowVideoPanelPointer = !isLocked && (videoScreenOpen || lightSwitchObject);
                cssRenderer.domElement.style.pointerEvents = allowVideoPanelPointer ? 'auto' : 'none';
                if (renderer?.domElement) renderer.domElement.style.pointerEvents = 'auto';
                if (wallCssRenderer?.domElement) {
                    wallCssRenderer.domElement.style.pointerEvents = isLocked ? 'none' : 'auto';
                }
                cssRenderer.domElement.style.cursor = '';
                if (renderer?.domElement) renderer.domElement.style.cursor = '';
                return;
            }
            cssRenderer.domElement.style.pointerEvents = isLocked ? 'none' : 'auto';
            if (renderer?.domElement) renderer.domElement.style.pointerEvents = 'auto';
            if (wallCssRenderer?.domElement) {
                wallCssRenderer.domElement.style.pointerEvents = 'none';
            }
            cssRenderer.domElement.style.cursor = '';
            if (renderer?.domElement) renderer.domElement.style.cursor = '';
        }

        function exitBeerAddEditing(event) {
            if (!isBeerAddOpen) return;
            const active = document.activeElement;
            if (active && active.closest && active.closest('.beer-add-3d')) {
                active.blur();
            }
            document.querySelectorAll('.beer-add-3d .cs.open').forEach((node) => {
                node.classList.remove('open');
                const btn = node.querySelector('.cs-btn');
                if (btn) btn.setAttribute('aria-expanded', 'false');
            });
            if (cssRenderer?.domElement) cssRenderer.domElement.style.pointerEvents = 'none';
            const prefersCssLock = Boolean(
                cssRenderer?.domElement &&
                event?.target &&
                cssRenderer.domElement.contains(event.target)
            );
            const lockTarget = prefersCssLock ? cssRenderer?.domElement : renderer?.domElement;
            if (lockTarget?.requestPointerLock) {
                lockTarget.requestPointerLock();
            } else if (cssRenderer?.domElement?.requestPointerLock) {
                cssRenderer.domElement.requestPointerLock();
            }
            window.setTimeout(() => {
                if (!isBeerAddOpen) return;
                if (
                    document.pointerLockElement !== renderer?.domElement &&
                    document.pointerLockElement !== cssRenderer?.domElement
                ) {
                    updateBeerAddPointerEvents();
                }
            }, 250);
        }

        function exitPoopAddEditing() {
            if (!isPoopAddOpen) return;
            closePoopAddModal3D();
            if (renderer?.domElement?.requestPointerLock) {
                renderer.domElement.requestPointerLock();
            }
        }

        function setupCustomSelect(wrapper, options, defaultValue, onChange) {
            if (!wrapper || !options?.length) return;
            if (wrapper.dataset.ready === 'true') return;
            const btn = wrapper.querySelector('.cs-btn');
            const menu = wrapper.querySelector('.cs-menu');
            if (!btn || !menu) return;
            wrapper.dataset.ready = 'true';

            const setValue = (value) => {
                const option = options.find((opt) => opt.value === value) || options[0];
                wrapper.dataset.value = option.value;
                btn.textContent = option.label;
                menu.querySelectorAll('.cs-opt').forEach((opt) => {
                    opt.setAttribute('aria-selected', String(opt.dataset.value === option.value));
                });
                if (typeof onChange === 'function') {
                    onChange(option.value);
                }
            };

            menu.innerHTML = '';
            options.forEach((opt) => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'cs-opt';
                item.dataset.value = opt.value;
                item.textContent = opt.label;
                item.setAttribute('aria-selected', 'false');
                item.addEventListener('pointerdown', (event) => event.stopPropagation());
                item.addEventListener('click', (event) => {

                const root = wrapper.closest('.beer-add-3d');

                    root.querySelectorAll('.cs.open').forEach((node) => {

                            node.classList.remove('open');
                            const nodeBtn = node.querySelector('.cs-btn');

                    });

                const open = !wrapper.classList.contains('open');

        function setBeerAddSelectValue(root, key, value) {
            if (!root) return;
            const wrap = root.querySelector(`.cs[data-key="${key}"]`);
            if (!wrap) return;
            const options = BEER_SELECT_OPTIONS[key] || [];
            const btn = wrap.querySelector('.cs-btn');
            const menu = wrap.querySelector('.cs-menu');
            if (!btn || !menu || !options.length) return;
            const raw = String(value ?? '').trim();
            const normalized = raw.toLowerCase();
            const normalizedNoEmoji = normalized.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '').trim();
            const opt =
                options.find((item) => item.value === raw) ||
                options.find((item) => String(item.value).toLowerCase() === normalized) ||
                options.find((item) => String(item.label).toLowerCase().includes(normalizedNoEmoji)) ||
                options[0];
            wrap.dataset.value = opt.value;
            btn.textContent = opt.label;
            menu.querySelectorAll('.cs-opt').forEach((item) => {
                item.setAttribute('aria-selected', String(item.dataset.value === opt.value));
            });

        function queueBeerAddSync() {
            if ((!wsConnected && !realtimeHttpEnabled) || suppressBeerAddSync || !isBeerAddOpen) return;
            if (beerAddMode !== 'add') return;
                if (beerAddSyncTimer) return;
                beerAddSyncTimer = setTimeout(() => {
                    beerAddSyncTimer = null;
                    const now = performance.now();
                    if (now - lastBeerAddBroadcast < 200) return;
                    lastBeerAddBroadcast = now;
                    sendRealtime({ type: 'beer_add', open: isBeerAddOpen, data: collectBeerAddFormState() });
                }, 180);

        function syncBeerAddOpenState(open, data) {
            suppressBeerAddSync = true;
            if (open) {
                if (!isBeerAddOpen) {
                    openBeerAddModal3D(true);
                }
                setBeerAddMode('add');
                applyBeerAddFormState(data);
            } else if (isBeerAddOpen) {
                closeBeerAddModal3D(true);
            }
            suppressBeerAddSync = false;
        }

        function projectToScreenPoint(worldPos, rect) {
            if (!camera) return null;
            beerAddScreenVec.copy(worldPos).project(camera);
            if (beerAddScreenVec.z < -1 || beerAddScreenVec.z > 1) return null;
            return {
                x: rect.left + (beerAddScreenVec.x * 0.5 + 0.5) * rect.width,
                y: rect.top + (-beerAddScreenVec.y * 0.5 + 0.5) * rect.height
            };
        }

        function getBeerAddScreenRect(x, y, z) {
            if (!renderer || !camera) return null;
            const rect = renderer.domElement.getBoundingClientRect();
            const halfW = 2.1;
            const halfH = 3.2;
            const corners = [
                new THREE.Vector3(x - halfW, y - halfH, z),
                new THREE.Vector3(x + halfW, y - halfH, z),
                new THREE.Vector3(x + halfW, y + halfH, z),
                new THREE.Vector3(x - halfW, y + halfH, z)
            ];
            let minX = Infinity;
            let maxX = -Infinity;
            let minY = Infinity;
            let maxY = -Infinity;
            for (const corner of corners) {
                const p = projectToScreenPoint(corner, rect);
                if (!p) continue;
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y);
                maxY = Math.max(maxY, p.y);
            }
            if (!Number.isFinite(minX)) return null;
            return { minX, maxX, minY, maxY, rect };
        }

        function isBeerAddOverlappingRemotePlayers(screenRect) {
            if (!screenRect || remotePlayers.size === 0) return false;
            for (const player of remotePlayers.values()) {
                const group = player.group;
                if (!group || !group.visible) continue;
                const height = group.userData?.avatarHeight || AVATAR_TARGET_HEIGHT;
                const pos = group.position.clone();
                pos.y += height * 0.6;
                const point = projectToScreenPoint(pos, screenRect.rect);
                if (!point) continue;
                if (
                    point.x >= screenRect.minX &&
                    point.x <= screenRect.maxX &&
                    point.y >= screenRect.minY &&
                    point.y <= screenRect.maxY
                ) {
                    return true;
                }
            }
            return false;
        }

        function syncBeerAddModalPosition() {
            if (!beerAddAnchor || !boardGroup?.userData?.boardPos) return;
            if (beerAddAnchor.userData.hasCustomPosition) return;
            const pos = boardGroup.userData.boardPos;
            const height = boardGroup.userData.boardHeight || 7.4;
            const width = boardGroup.userData.boardWidth || room.width * 0.7;
            const offsetX = width / 2 + 4.4;
            let targetX = pos.x + offsetX;
            const targetY = pos.y + height * 0.05;
            const targetZ = pos.z + 0.9;
            if (isBeerAddOpen && renderer && camera && remotePlayers.size > 0) {
                const shiftStep = 2.4;
                const candidates = [0, shiftStep, -shiftStep, shiftStep * 2, -shiftStep * 2, shiftStep * 3, -shiftStep * 3];
                for (const shift of candidates) {
                    const rect = getBeerAddScreenRect(targetX + shift, targetY, targetZ);
                    if (!rect) continue;
                    if (!isBeerAddOverlappingRemotePlayers(rect)) {
                        targetX = targetX + shift;
                        break;
                    }
                }
            }
            beerAddAnchor.position.set(targetX, targetY, targetZ);
            beerAddAnchor.rotation.set(0, 0, 0);
            if (beerAddHitMesh) {
                beerAddHitMesh.position.set(targetX, targetY, targetZ + 0.01);
                beerAddHitMesh.rotation.set(0, 0, 0);
            }
        }

        function setupBeerAddModal3D() {
            if (beerAddObject || !ensureCssRenderer()) return;
            const el = buildBeerAddModalElement();
            beerAddObject = new THREE.CSS3DObject(el);
            beerAddObject.scale.set(0.01, 0.01, 0.01);
            beerAddAnchor = new THREE.Group();
            beerAddAnchor.userData.hasCustomPosition = false;
            beerAddAnchor.add(beerAddObject);
            cssScene.add(beerAddAnchor);
            if (!beerAddHitMesh) {
                const hitGeo = new THREE.PlaneGeometry(4.2, 6.4);
                const hitMat = new THREE.MeshBasicMaterial({
                    transparent: true,
                    opacity: 0,
                    depthWrite: false,
                    side: THREE.DoubleSide
                });
                beerAddHitMesh = new THREE.Mesh(hitGeo, hitMat);
                beerAddHitMesh.visible = false;
                scene.add(beerAddHitMesh);
            }
            syncBeerAddModalPosition();
            initBeerAddCustomSelects(el);
            setBeerAddMode('add');

            const submitBtn = el.querySelector('#beer3dSubmit');
            const cancelBtn = el.querySelector('#beer3dCancel');
            if (submitBtn) submitBtn.addEventListener('click', submitBeerFrom3DModal);
            if (cancelBtn) cancelBtn.addEventListener('click', closeBeerAddModal3D);

            const nameInput = el.querySelector('#beer3dName');
            const alcoholInput = el.querySelector('#beer3dAlcohol');
            const caloriesInput = el.querySelector('#beer3dCalories');
            [nameInput, alcoholInput, caloriesInput].forEach((input) => {
                if (!input) return;
                input.addEventListener('input', () => {

        function openBeerAddModal3D(fromRemoteOrOptions = false) {
            const isRemote = fromRemoteOrOptions === true;
            const opts = !isRemote && typeof fromRemoteOrOptions === 'object' ? fromRemoteOrOptions : {};
            const mode = opts.mode === 'edit' ? 'edit' : 'add';
            const beer = opts.beer || null;
            const broadcast = opts.broadcast !== false;
            setupBeerAddModal3D();
            if (!beerAddObject) return;
            isBeerAddOpen = true;
            syncBeerAddModalPosition();
            beerAddObject.element.classList.add('open');
            if (beerAddHitMesh) beerAddHitMesh.visible = true;
            updateBeerAddPointerEvents();
            setBeerAddMode(mode, beer);
            if (mode === 'edit' && beer) {
                applyBeerAddFormFromBeer(beer);
            } else {
                resetBeerAddModalForm();
            }
            moveState.forward = false;
            moveState.back = false;
            moveState.left = false;
            moveState.right = false;
            moveState.fast = false;
            if (!isRemote && !suppressBeerAddSync && broadcast && beerAddMode === 'add') {
                sendRealtime({ type: 'beer_add', open: true, data: collectBeerAddFormState() });
            }
        }

        function closeBeerAddModal3D(fromRemote = false) {
            const isRemote = fromRemote === true;
            if (!beerAddObject) return;
            isBeerAddOpen = false;
            beerAddObject.element.classList.remove('open');
            if (beerAddHitMesh) beerAddHitMesh.visible = false;
            updateBeerAddPointerEvents();
            setBeerAddMode('add');
            if (beerAddSyncTimer) {
                clearTimeout(beerAddSyncTimer);
                beerAddSyncTimer = null;
            }
            if (!isRemote && !suppressBeerAddSync) {
                sendRealtime({ type: 'beer_add', open: false, data: null });

        async function setBeerRatingFromBoard(beerId, value) {
            const userName = getCurrentUserName();
            if (!userName) return;
            const numeric = Number(value);
            if (!Number.isFinite(numeric)) return;
            const rating = Math.max(0.5, Math.min(10, Math.round(numeric * 2) / 2));
            const beer = beerData.find((item) => String(item.id) === String(beerId));
            if (!beer) return;
            const ratings = beer.ratings && typeof beer.ratings === 'object' ? { ...beer.ratings } : {};
            ratings[userName] = rating;
            const updated = beerData.map((item) => {
                if (String(item.id) !== String(beerId)) return item;
                return { ...item, ratings };
            });
            try {
                const db = firebase.database();
                await db.ref('beerRating').set(updated);
                applyBeerData(updated);
            } catch (err) {
                console.warn('rating update failed', err);
            }
        }

        async function submitBeerFrom3DModal() {
            const root = beerAddObject?.element;
            if (!root) return;
            const name = root.querySelector('#beer3dName').value.trim();
            const type = getBeerAddSelectValue(root, 'type');
            const style = getBeerAddSelectValue(root, 'style');
            const filtered = getBeerAddSelectValue(root, 'filtered');
            const country = getBeerAddSelectValue(root, 'country');
            const volume = getBeerAddSelectValue(root, 'volume');
            const alcohol = root.querySelector('#beer3dAlcohol').value.trim();
            const calories = root.querySelector('#beer3dCalories').value.trim();
            const author = getCurrentUserName();

            if (!name || !alcohol || !author) {
                alert('Заполните все поля!');
                return;
            }
            try {
                const db = firebase.database();
                let updated = [];
                if (beerAddMode === 'edit' && beerEditId) {
                    const current = beerData.find((item) => String(item.id) === String(beerEditId));
                    if (!current) {
                        closeBeerAddModal3D();
                        return;
                    }
                    const edited = {
                        ...current,
                        name,
                        type,
                        style,
                        filtered,
                        country,
                        volume,
                        alcohol,
                        calories,
                        imageUrl: current.imageUrl || '',
                        updatedAt: Date.now()
                    };
                    updated = beerData.map((item) => (String(item.id) === String(beerEditId) ? edited : item));
                } else {
                    const beer = {
                        id: Date.now().toString(),
                        name,
                        type,
                        style,
                        filtered,
                        country,
                        volume,
                        alcohol,
                        calories,
                        imageUrl: '',
                        author,
                        ratings: {},
                        timestamp: Date.now()
                    };
                    updated = [...beerData, beer];
                }
                await db.ref('beerRating').set(updated);
                applyBeerData(updated);
                closeBeerAddModal3D();
            } catch (err) {
                console.warn('beer save failed', err);
            }
        }
