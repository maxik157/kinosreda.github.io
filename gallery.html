            const countryY = nameY + nameLineHeight * Math.min(nameLines.length, 2) + 8;
            const emojiFont = '26px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
            const textFont = '26px Comfortaa, sans-serif';
            let x = leftPad;
            if (flag) {
                ctx.font = emojiFont;
                ctx.fillText(flag, x, countryY);
                x += ctx.measureText(flag).width + 6;
            }
            ctx.font = textFont;
            ctx.fillStyle = 'rgba(226, 232, 240, 0.85)';
            const countryText = truncateText(ctx, countryName || '—', maxWidth - (x - leftPad));
            ctx.fillText(countryText, x, countryY);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function createBeerInfoTexture(beer) {
            const canvas = document.createElement('canvas');
            canvas.width = BEER_INFO_CANVAS.width;
            canvas.height = BEER_INFO_CANVAS.height;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(12, 16, 24, 0.82)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, 'rgba(245, 158, 11, 0.12)');
            grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
            ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = '20px Comfortaa, sans-serif';
            ctx.fillStyle = 'rgba(226, 232, 240, 0.95)';

            const summary = getRatingsSummary(beer);
            const avgText = summary.avg != null ? formatNumber(summary.avg, 1) : formatBeerValue(beer?.rating);
            const countText = summary.count != null ? String(summary.count) : (getRatingsCount(beer) != null ? String(getRatingsCount(beer)) : '—');
            const ratingsText = getRatingsSummaryText(beer);

            const filteredValue = String(beer?.filtered || '').trim().toLowerCase();
            const isFiltered = filteredValue && !filteredValue.startsWith('не') && filteredValue.includes('фильтр');
            const entries = [
                { text: `Рейтинг: ${avgText} (оценок: ${countText})` },
                { text: `Оценки: ${ratingsText}` },
                { text: `Автор: ${formatBeerValue(beer?.author)}` },
                { text: `Вид: ${formatBeerValue(beer?.type)}`, icon: isFiltered },
                { text: `Сорт: ${formatBeerValue(beer?.style)}` },
                { text: `Объём: ${formatBeerValue(beer?.volume, ' л')}` },
                { text: `Крепость: ${formatBeerValue(formatNumber(beer?.alcohol, 1), '%')}` },
                { text: `Калории: ${formatBeerValue(formatNumber(beer?.calories, 0), ' ккал')}` }
            ];

            const leftPad = 26;
            const maxWidth = canvas.width - leftPad * 2;
            let fontSize = 26;
            let lineHeight = Math.round(fontSize * 1.3);
            let iconSize = Math.round(lineHeight * 0.7);
            const maxHeight = canvas.height - leftPad * 2;
            let wrapped = [];
            const buildWrapped = () => {
                ctx.font = `${fontSize}px Comfortaa, sans-serif`;
                lineHeight = Math.round(fontSize * 1.3);
                iconSize = Math.round(lineHeight * 0.7);
                wrapped = [];
                entries.forEach((entry) => {
                    const lineMaxWidth = entry.icon ? (maxWidth - iconSize - 8) : maxWidth;
                    const parts = wrapTextLines(ctx, entry.text, lineMaxWidth);
                    parts.forEach((part, idx) => {
                        const iconAfterText = entry.icon && idx === 0;
                        const textWidth = iconAfterText ? ctx.measureText(part).width : 0;
                        wrapped.push({
                            text: part,
                            icon: iconAfterText,
                            iconXOffset: iconAfterText ? Math.min(textWidth + 8, maxWidth - iconSize) : 0
                        });
                    });
                });
            };
            buildWrapped();
            while (wrapped.length * lineHeight > maxHeight && fontSize > 18) {
                fontSize -= 1;
                buildWrapped();
            }
            const maxLines = Math.max(1, Math.floor(maxHeight / lineHeight));
            const finalLines = clampLinesToHeight(ctx, wrapped, maxWidth, maxLines);
            let y = 20;
            finalLines.forEach((line) => {
                const lineMaxWidth = line.icon ? (maxWidth - iconSize - 8) : maxWidth;
                const text = truncateText(ctx, line.text, lineMaxWidth);
                ctx.fillText(text, leftPad, y);
                if (line.icon) {
                    const offset = Number.isFinite(line.iconXOffset) ? line.iconXOffset : (maxWidth - iconSize);
                    const iconX = leftPad + offset;
                    const iconY = y + (lineHeight - iconSize) / 2;
                    drawFunnelIcon(ctx, iconX, iconY, iconSize, 'rgba(253, 230, 138, 0.95)');
                }
                y += lineHeight;
            });
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function createBottleMesh(beer) {
            const group = new THREE.Group();
            const width = 1.35;
            const height = 2.5;
            const planeGeo = new THREE.PlaneGeometry(width, height);
            const mat = new THREE.MeshBasicMaterial({ transparent: true, color: 0xffffff, opacity: 0 });
            applyBoardStencil(mat);
            const mesh = new THREE.Mesh(planeGeo, mat);
            mesh.position.set(0, height / 2, 0.02);
            mesh.visible = false;
            group.add(mesh);
            group.userData.mesh = mesh;
            return group;
        }

        const WALL_IMAGE_WALL_OFFSET = 0.0;
        const WALL_IMAGE_SURFACE_OFFSET = -1.4;

        function setupWallSurfaces(backWall, frontWall, leftWall, rightWall) {
            wallImageGroup = new THREE.Group();
            scene.add(wallImageGroup);
            const makeSurface = (id, mesh, width, height) => {
                const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(mesh.quaternion);
                const anchor = new THREE.Group();
                anchor.position.copy(mesh.position).addScaledVector(normal, WALL_IMAGE_WALL_OFFSET);
                anchor.rotation.copy(mesh.rotation);
                wallImageGroup.add(anchor);
                return { id, mesh, anchor, cssAnchor: null, normal, width, height };
            };
            wallSurfaces = [
                makeSurface('back', backWall, room.width, room.height),
                makeSurface('front', frontWall, room.width, room.height),
                makeSurface('left', leftWall, room.depth, room.height),
                makeSurface('right', rightWall, room.depth, room.height)
            ];
            wallSurfaces.forEach((wall) => ensureWallCssAnchor(wall));
            const stored = loadWallImagesFromStorage();
            if (stored.length) applyWallImages(stored, { cache: false });
        }

        function ensureWallCssAnchor(wall) {
            if (!wall) return null;
            if (wall.cssAnchor) return wall.cssAnchor;
            if (!ensureCssRenderer()) return null;
            const cssAnchor = new THREE.Group();
            cssAnchor.position.copy(wall.anchor.position);
            cssAnchor.rotation.copy(wall.anchor.rotation);
            cssScene.add(cssAnchor);
            wall.cssAnchor = cssAnchor;
            return cssAnchor;
        }

        function addWallImage(url) {
            const placement = pickWallPlacement();
            const id = Date.now() + (wallImageIdCounter++ % 1000);
            const data = {
                id,
                url,
                wallId: placement.wall.id,
                x: placement.local.x,
                y: placement.local.y,
                scale: 1,
                baseW: 2,
                baseH: 2,
                frame: false,
                labelText: ''
            };
            wallImages.push(data);
            queueWallImagesSave();
            const mesh = createWallImageMesh(data);
            if (mesh) setSelectedWallImage(mesh);
        }

        function pickWallPlacement() {
            const pointer = new THREE.Vector2(0, 0);
            wallImageRaycaster.setFromCamera(pointer, camera);
            const hits = wallImageRaycaster.intersectObjects(wallSurfaces.map((s) => s.mesh), false);
            if (hits.length) {
                const hit = hits[0];
                const wall = wallSurfaces.find((s) => s.mesh === hit.object) || wallSurfaces[0];
                const local = wall.anchor.worldToLocal(hit.point.clone());
                return { wall, local };
            }
            const fallback = wallSurfaces[0];
            return { wall: fallback, local: new THREE.Vector3(0, 0, 0) };
        }

        function applyWallImageTransform(mesh) {
            let scale = Number.isFinite(mesh.userData.scale) ? mesh.userData.scale : 1;
            scale = Math.min(6, Math.max(0.35, scale));
            let baseW = Number.isFinite(mesh.userData.baseW) ? mesh.userData.baseW : 2;
            let baseH = Number.isFinite(mesh.userData.baseH) ? mesh.userData.baseH : 2;
            baseW = Math.min(10, Math.max(0.4, baseW));
            baseH = Math.min(10, Math.max(0.4, baseH));
            mesh.userData.scale = scale;
            mesh.userData.baseW = baseW;
            mesh.userData.baseH = baseH;
            mesh.scale.set(baseW * scale, baseH * scale, 1);
            if (mesh.userData.outline) {
                mesh.userData.outline.scale.set(1, 1, 1);
            }
            if (mesh.userData.frameGroup) {
                mesh.userData.frameGroup.scale.set(1, 1, 1);
            }
            if (mesh.userData.labelMesh) {
                updateWallImageLabel(mesh);
            }
            const wall = wallSurfaces.find((s) => s.id === mesh.userData.wallId);
            if (wall) clampWallImagePosition(mesh, wall);
            updateWallImageCss(mesh);
        }

        function clampWallImagePosition(mesh, wall) {
            const baseW = mesh.userData.baseW || 2;
            const baseH = mesh.userData.baseH || 2;
            const scale = mesh.userData.scale || 1;
            const halfW = (baseW * scale) / 2;
            const halfH = (baseH * scale) / 2;
            const margin = 0.2;
            const maxX = wall.width / 2 - halfW - margin;
            const maxY = wall.height / 2 - halfH - margin;
            mesh.position.x = Math.min(maxX, Math.max(-maxX, mesh.position.x));
            mesh.position.y = Math.min(maxY, Math.max(-maxY, mesh.position.y));
        }

        function syncWallImageData(mesh) {
            const id = mesh.userData.id;
            const item = wallImages.find((img) => String(img.id) === String(id));
            if (!item) return;
            item.x = mesh.position.x;
            item.y = mesh.position.y;
            item.scale = mesh.userData.scale || 1;
            item.baseW = mesh.userData.baseW || item.baseW || 2;
            item.baseH = mesh.userData.baseH || item.baseH || 2;
            item.frame = Boolean(mesh.userData.frame);
            item.labelText = String(mesh.userData.labelText || '');
            if (Number.isFinite(mesh.userData.layer)) {
                item.layer = mesh.userData.layer;
            }
        }

        function removeWallImageById(id) {
            const idx = wallImages.findIndex((img) => String(img.id) === String(id));
            if (idx !== -1) wallImages.splice(idx, 1);
            const mesh = wallImageMeshMap.get(String(id));
            if (mesh && mesh.parent) mesh.parent.remove(mesh);
            if (mesh?.userData?.cssObject?.parent) {
                mesh.userData.cssObject.parent.remove(mesh.userData.cssObject);
            }
            wallImageMeshMap.delete(String(id));
            if (selectedWallImageId && String(selectedWallImageId) === String(id)) {
                setSelectedWallImage(null);
            }
            queueWallImagesSave();
        }

        function createWallImageMesh(data) {
            const wall = wallSurfaces.find((s) => s.id === data.wallId);
            if (!wall) return null;
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(1, 1),
                new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0,
                    depthWrite: false
                })
            );
            mesh.position.set(data.x || 0, data.y || 0, 0);
            mesh.userData.id = data.id;
            mesh.userData.url = data.url || '';
            mesh.userData.wallId = data.wallId;
            mesh.userData.scale = Number.isFinite(data.scale) ? data.scale : 1;
            mesh.userData.baseW = Number.isFinite(data.baseW) ? data.baseW : 2;
            mesh.userData.baseH = Number.isFinite(data.baseH) ? data.baseH : 2;
            mesh.userData.frame = Boolean(data.frame);
            mesh.userData.labelText = String(data.labelText || '');
            if (!Number.isFinite(data.layer)) {
                data.layer = wallImageLayerCounter++;
            } else {
                wallImageLayerCounter = Math.max(wallImageLayerCounter, data.layer + 1);
            }
            mesh.position.z = WALL_IMAGE_SURFACE_OFFSET + (data.layer || 0) * 0.002;
            mesh.renderOrder = 30 + (data.layer || 0);
            const outline = new THREE.LineSegments(
                new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, 1)),
                new THREE.LineBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.8 })
            );
            outline.visible = false;
            outline.position.z = 0.01;
            outline.raycast = () => {};
            mesh.add(outline);
            mesh.userData.outline = outline;
            ensureWallImageFrame(mesh);
            setWallImageFrameVisible(mesh, mesh.userData.frame);
            ensureWallImageLabel(mesh);
            updateWallImageLabel(mesh);
            applyWallImageTransform(mesh);
            wall.anchor.add(mesh);
            wallImageMeshMap.set(String(data.id), mesh);
            if (data.url) {
                setupWallImageCss(mesh, data.url, wall);
            }
            return mesh;
        }

        function setupWallImageCss(mesh, url, wall) {
            if (!mesh || !url) return;
            const cssAnchor = ensureWallCssAnchor(wall);
            if (!cssAnchor) return;
            const img = document.createElement('img');
            img.src = url;
            img.alt = '';
            img.decoding = 'async';
            img.loading = 'eager';
            img.style.display = 'block';
            img.style.width = '600px';
            img.style.height = 'auto';
            img.style.objectFit = 'contain';
            img.style.pointerEvents = 'auto';

            const wrapper = document.createElement('div');
            wrapper.className = 'wall-image-css';
            wrapper.dataset.wallImageId = String(mesh.userData.id || '');
            wrapper.style.width = '600px';
            wrapper.style.height = 'auto';
            wrapper.style.pointerEvents = 'auto';
            wrapper.appendChild(img);
            img.dataset.wallImageId = String(mesh.userData.id || '');

            const cssObj = new THREE.CSS3DObject(wrapper);
            mesh.userData.cssObject = cssObj;
            mesh.userData.cssWidthPx = 600;
            mesh.userData.cssHeightPx = 600;
            cssAnchor.add(cssObj);
            updateWallImageCss(mesh);

            img.addEventListener('load', () => {
                let aspect = img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 1;
                if (!Number.isFinite(aspect) || aspect <= 0) aspect = 1;
                aspect = Math.min(4, Math.max(0.25, aspect));
                mesh.userData.baseH = 2;
                mesh.userData.baseW = 2 * aspect;
                const heightPx = Math.round(600 / Math.max(0.2, aspect));
                mesh.userData.cssHeightPx = heightPx;
                wrapper.style.height = `${heightPx}px`;
                img.style.height = `${heightPx}px`;
                updateWallImageCss(mesh);
                applyWallImageTransform(mesh);
                syncWallImageData(mesh);
                saveWallImagesToStorage();
            });
        }

        function updateWallImageCss(mesh) {
            const cssObj = mesh?.userData?.cssObject;
            if (!cssObj) return;
            const wall = wallSurfaces.find((s) => s.id === mesh.userData.wallId);
            if (wall?.cssAnchor) {
                wall.cssAnchor.position.copy(wall.anchor.position);
                wall.cssAnchor.rotation.copy(wall.anchor.rotation);
            }
            const widthPx = mesh.userData.cssWidthPx || 600;
            const heightPx = mesh.userData.cssHeightPx || 600;
            cssObj.position.copy(mesh.position);
            cssObj.rotation.copy(mesh.rotation);
            cssObj.scale.set(
                mesh.scale.x / widthPx,
                mesh.scale.y / heightPx,
                1
            );
            cssObj.renderOrder = mesh.renderOrder;
        }

        function ensureWallImageFrame(mesh) {
            if (mesh.userData.frameGroup) return;
            const t = 0.08;
            const depth = 0.06;
            const frameMat = new THREE.MeshStandardMaterial({
                color: 0x4a2d16,
                roughness: 0.7,
                metalness: 0.1
            });
            const frameGroup = new THREE.Group();
            const horizGeo = new THREE.BoxGeometry(1 + t * 2, t, depth);
            const vertGeo = new THREE.BoxGeometry(t, 1 + t * 2, depth);
            const top = new THREE.Mesh(horizGeo, frameMat);
            top.position.set(0, 0.5 + t / 2, 0.02);
            const bottom = top.clone();
            bottom.position.y = -0.5 - t / 2;
            const left = new THREE.Mesh(vertGeo, frameMat);
            left.position.set(-0.5 - t / 2, 0, 0.02);
            const right = left.clone();
            right.position.x = 0.5 + t / 2;
            frameGroup.add(top, bottom, left, right);
            frameGroup.raycast = () => {};
            frameGroup.visible = false;
            mesh.add(frameGroup);
            mesh.userData.frameGroup = frameGroup;
        }

        function setWallImageFrameVisible(mesh, visible) {
            if (!mesh) return;
            ensureWallImageFrame(mesh);
            mesh.userData.frame = Boolean(visible);
            if (mesh.userData.frameGroup) {
                mesh.userData.frameGroup.visible = mesh.userData.frame;
            }
        }

        function ensureWallImageLabel(mesh) {
            if (mesh.userData.labelMesh) return;
            const mat = new THREE.MeshBasicMaterial({
                transparent: true,
                color: 0xffffff,
                depthTest: true,
                depthWrite: false,
                polygonOffset: true,
                polygonOffsetFactor: -1,
                polygonOffsetUnits: -1
            });
            const labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
            labelMesh.position.z = 0.05;
            labelMesh.renderOrder = (mesh.renderOrder || 0) + 2;
            labelMesh.visible = false;
            labelMesh.raycast = () => {};
            mesh.add(labelMesh);
            mesh.userData.labelMesh = labelMesh;
            mesh.userData.labelCanvas = document.createElement('canvas');
        }

        function updateWallImageLabel(mesh) {
            const text = String(mesh.userData.labelText || '').trim();
            ensureWallImageLabel(mesh);
            const labelMesh = mesh.userData.labelMesh;
            if (!labelMesh) return;
            if (!text) {
                labelMesh.visible = false;
                return;
            }
            const canvas = mesh.userData.labelCanvas || document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const baseW = mesh.userData.baseW || 2;
            const baseH = mesh.userData.baseH || 2;
            const labelW = Math.max(0.6, baseW * 0.6);
            const labelH = Math.max(0.08, Math.min(baseH * 0.09, 0.18));
            const localW = labelW / baseW;
            const localH = labelH / baseH;
            labelMesh.scale.set(localW, localH, 1);
            const gap = 0.06 / baseH;
            labelMesh.position.y = -0.5 - gap - localH / 2;
            labelMesh.renderOrder = (mesh.renderOrder || 0) + 2;

            const pxPerUnit = 220;
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            const widthPx = Math.max(1, Math.round(labelW * pxPerUnit * pixelRatio));
            const heightPx = Math.max(1, Math.round(labelH * pxPerUnit * pixelRatio));
            canvas.width = widthPx;
            canvas.height = heightPx;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, widthPx, heightPx);
            ctx.scale(pixelRatio, pixelRatio);
            ctx.imageSmoothingEnabled = true;
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';

            const cssW = widthPx / pixelRatio;
            const cssH = heightPx / pixelRatio;
            ctx.fillStyle = '#f6f1e8';
            ctx.fillRect(0, 0, cssW, cssH);
            ctx.strokeStyle = '#d7c6a8';
            ctx.lineWidth = 2;
            ctx.strokeRect(1, 1, cssW - 2, cssH - 2);
            const paddingX = 10;
            const paddingY = 8;
            let fontSize = Math.floor(cssH * 0.3);
            const minFontSize = Math.max(9, Math.floor(cssH * 0.22));
            const maxLines = 2;
            const applyFont = () => {
                ctx.font = `600 ${fontSize}px Comfortaa, sans-serif`;
                if ('fontKerning' in ctx) ctx.fontKerning = 'normal';
            };
            const wrapText = () => {
                const words = text.split(/\s+/).filter(Boolean);
                const lines = [];
                let line = '';
                words.forEach((word) => {
                    const test = line ? `${line} ${word}` : word;
                    const width = ctx.measureText(test).width;
                    if (width <= cssW - paddingX * 2) {
                        line = test;
                    } else {
                        if (line) lines.push(line);
                        line = word;
                    }
                });
                if (line) lines.push(line);
                return lines;
            };
            applyFont();
            let lines = wrapText();
            while (lines.length > maxLines && fontSize > minFontSize) {
                fontSize -= 1;
                applyFont();
                lines = wrapText();
            }
            if (lines.length > maxLines) {
                lines = lines.slice(0, maxLines);
                let last = lines[lines.length - 1];
                while (ctx.measureText(`${last}…`).width > cssW - paddingX * 2 && last.length > 1) {
                    last = last.slice(0, -1);
                }
                lines[lines.length - 1] = `${last}…`;
            }
            ctx.fillStyle = '#1a1a1a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const lineHeight = fontSize * 1.2;
            const totalHeight = lines.length * lineHeight;
            let startY = (cssH - totalHeight) / 2 + lineHeight / 2;
            startY = Math.max(startY, paddingY + lineHeight / 2);
            lines.forEach((line, idx) => {
                ctx.fillText(line, cssW / 2, startY + idx * lineHeight);
            });

            let texture = labelMesh.material.map;
            if (!texture) {
                texture = new THREE.CanvasTexture(canvas);
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                if (renderer?.capabilities?.getMaxAnisotropy) {
                    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                }
                labelMesh.material.map = texture;
            } else {
                texture.image = canvas;
                texture.needsUpdate = true;
            }
            labelMesh.material.needsUpdate = true;
            labelMesh.visible = true;
        }

        function getSelectedWallImageMesh() {
            if (!selectedWallImageId) return null;
            return wallImageMeshMap.get(String(selectedWallImageId)) || null;
        }

        function setSelectedWallImage(mesh) {
            const prev = getSelectedWallImageMesh();
            if (prev && prev.userData?.outline) prev.userData.outline.visible = false;
            if (!mesh) {
                selectedWallImageId = null;
                const toolbar = document.getElementById('wallImageToolbar');
                if (toolbar) toolbar.style.display = 'none';
                return;
            }
            selectedWallImageId = mesh.userData.id;
            if (mesh.userData?.outline) mesh.userData.outline.visible = true;
            if (!Number.isFinite(mesh.userData.layer)) {
                mesh.userData.layer = wallImageLayerCounter++;
            } else {
                mesh.userData.layer = wallImageLayerCounter++;
            }
            mesh.position.z = WALL_IMAGE_SURFACE_OFFSET + mesh.userData.layer * 0.002;
            mesh.renderOrder = 30 + mesh.userData.layer;
            syncWallImageData(mesh);
            queueWallImagesSave();
            const toolbar = document.getElementById('wallImageToolbar');
            if (toolbar) toolbar.style.display = 'flex';
            const scaleInput = document.getElementById('wallImageScale');
            if (scaleInput) scaleInput.value = String(mesh.userData.scale || 1);
            const frameInput = document.getElementById('wallImageFrame');
            if (frameInput) frameInput.checked = Boolean(mesh.userData.frame);
            const labelInput = document.getElementById('wallImageLabel');
            if (labelInput) labelInput.value = String(mesh.userData.labelText || '');
        }

        function handleWallImagePointerDown(event) {
            if (!wallImageGroup) return false;
            if (isLocked) return false;
            if (performance.now() < wallImagePickSuppressUntil) return false;
            wallImageSelectedOnPointerDown = false;
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = isLocked ? rect.left + rect.width / 2 : event.clientX;
            const clientY = isLocked ? rect.top + rect.height / 2 : event.clientY;
            const domPicked = pickWallImageByDomPoint(clientX, clientY);
            wallImagePointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            wallImagePointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            wallImageRaycaster.setFromCamera(wallImagePointer, camera);
            const hits = getWallImageHits();
            const wallHit = wallImageRaycaster.intersectObjects(wallSurfaces.map((s) => s.mesh), false)[0];
            if (!wallHit) return false;
            const wall = wallSurfaces.find((s) => s.mesh === wallHit.object);
            const root = getWallImageRootFromHits(hits);
            const domOk = domPicked && domPicked.userData?.wallId === wall?.id ? domPicked : null;
            const rootOk = root && root.userData?.wallId === wall?.id ? root : null;
            const picked = domOk || rootOk;
            if (!picked) return false;
            const pickedWall = wall;
            if (!pickedWall) {
                setSelectedWallImage(picked);
                return true;
            }
            const local = pickedWall.anchor.worldToLocal(wallHit.point.clone());
            wallImageDrag.active = true;
            wallImageDrag.mesh = picked;
            wallImageDrag.wall = pickedWall;
            wallImageDrag.offset.set(local.x - picked.position.x, local.y - picked.position.y);
            wallImageDrag.moved = false;
            wallImageDrag.suppressClick = false;
            setSelectedWallImage(picked);
            wallImageSelectedOnPointerDown = true;
            if (event?.target?.setPointerCapture) {
                event.target.setPointerCapture(event.pointerId);
            } else if (renderer?.domElement?.setPointerCapture) {
                renderer.domElement.setPointerCapture(event.pointerId);
            }
            return true;
        }

        function handleWallImagePointerMove(event) {
            if (!wallImageDrag.active || !wallImageDrag.mesh || !wallImageDrag.wall) return;
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = isLocked ? rect.left + rect.width / 2 : event.clientX;
            const clientY = isLocked ? rect.top + rect.height / 2 : event.clientY;
            wallImagePointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            wallImagePointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            wallImageRaycaster.setFromCamera(wallImagePointer, camera);
            const wallHit = wallImageRaycaster.intersectObject(wallImageDrag.wall.mesh, false)[0];
            if (!wallHit) return;
            const local = wallImageDrag.wall.anchor.worldToLocal(wallHit.point.clone());
            const nextX = local.x - wallImageDrag.offset.x;
            const nextY = local.y - wallImageDrag.offset.y;
            if (!wallImageDrag.moved) {
                const dx = nextX - wallImageDrag.mesh.position.x;
                const dy = nextY - wallImageDrag.mesh.position.y;
                if (Math.hypot(dx, dy) > 0.02) wallImageDrag.moved = true;
            }
            wallImageDrag.mesh.position.x = nextX;
            wallImageDrag.mesh.position.y = nextY;
            clampWallImagePosition(wallImageDrag.mesh, wallImageDrag.wall);
            updateWallImageCss(wallImageDrag.mesh);
            syncWallImageData(wallImageDrag.mesh);
        }

        function handleWallImagePointerUp(event) {
            if (!wallImageDrag.active) return;
            wallImageDrag.active = false;
            if (event?.target?.hasPointerCapture?.(event.pointerId)) {
                event.target.releasePointerCapture(event.pointerId);
            } else if (event && renderer?.domElement && renderer.domElement.hasPointerCapture?.(event.pointerId)) {
                renderer.domElement.releasePointerCapture(event.pointerId);
            }
            if (wallImageDrag.moved) wallImageDrag.suppressClick = true;
            wallImageDrag.mesh = null;
            wallImageDrag.wall = null;
            wallImageDrag.offset.set(0, 0);
            if (wallImageDrag.moved) queueWallImagesSave();
        }

        function handleWallImageClick(event) {
            if (!wallImageGroup) return false;
            if (isLocked) return false;
            if (performance.now() < wallImagePickSuppressUntil) return false;
            if (wallImageSelectedOnPointerDown) {
                wallImageSelectedOnPointerDown = false;
                return true;
            }
            if (wallImageDrag.suppressClick) {
                wallImageDrag.suppressClick = false;
                return true;
            }
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = isLocked ? rect.left + rect.width / 2 : event.clientX;
            const clientY = isLocked ? rect.top + rect.height / 2 : event.clientY;
            const domPicked = pickWallImageByDomPoint(clientX, clientY);
            wallImagePointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            wallImagePointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            wallImageRaycaster.setFromCamera(wallImagePointer, camera);
            const hits = getWallImageHits();
            const wallHit = wallImageRaycaster.intersectObjects(wallSurfaces.map((s) => s.mesh), false)[0];
            if (!wallHit) {
                if (selectedWallImageId) setSelectedWallImage(null);
                return false;
            }
            const wall = wallSurfaces.find((s) => s.mesh === wallHit.object);
            const root = getWallImageRootFromHits(hits);
            const domOk = domPicked && domPicked.userData?.wallId === wall?.id ? domPicked : null;
            const rootOk = root && root.userData?.wallId === wall?.id ? root : null;
            const picked = domOk || rootOk;
            if (!picked) {
                if (selectedWallImageId) {
                    setSelectedWallImage(null);
                }
                return false;
            }
            setSelectedWallImage(picked);
            return true;
        }

        function getWallImageHits() {
            const meshes = wallImageMeshMap.size ? [...wallImageMeshMap.values()] : wallImageGroup?.children || [];
            return wallImageRaycaster.intersectObjects(meshes, true);
        }

        function getWallImageRootFromHits(hits) {
            if (!hits || !hits.length) return null;
            const obj = hits[0].object;
            const root = obj?.userData?.id ? obj : obj?.parent;
            return root && root.userData?.id ? root : null;
        }

        function pickWallImageByWallHit(wall, wallHit) {
            if (!wall || !wallHit || !wallImageMeshMap.size) return null;
            const local = wall.anchor.worldToLocal(wallHit.point.clone());
            let best = null;
            let bestDist = Infinity;
            wallImageMeshMap.forEach((mesh) => {
                if (!mesh || mesh.userData?.wallId !== wall.id) return;
                const baseW = mesh.userData.baseW || 2;
                const baseH = mesh.userData.baseH || 2;
                const scale = mesh.userData.scale || 1;
                const halfW = (baseW * scale) / 2;
                const halfH = (baseH * scale) / 2;
                const dx = local.x - mesh.position.x;
                const dy = local.y - mesh.position.y;
                const inside = Math.abs(dx) <= halfW && Math.abs(dy) <= halfH;
                const dist = Math.hypot(dx, dy);
                if (inside && dist < bestDist) {
                    best = mesh;
                    bestDist = dist;
                }
            });
            return best;
        }

        function pickWallImageByScreenRect(wall, x, y, rect, strict = false) {
            if (!wallImageMeshMap.size || !rect) return null;
            let best = null;
            let bestScore = Infinity;
            wallImageMeshMap.forEach((mesh) => {
                if (!mesh) return;
                if (wall && mesh.userData?.wallId !== wall.id) return;
                const bounds = getWallImageScreenRect(mesh, rect);
                if (!bounds) return;
                if (x < bounds.minX || x > bounds.maxX || y < bounds.minY || y > bounds.maxY) return;
                if (strict) {
                    const inset = 6;
                    if (x < bounds.minX + inset || x > bounds.maxX - inset || y < bounds.minY + inset || y > bounds.maxY - inset) {
                        return;
                    }
                }
                const area = Math.max(1, (bounds.maxX - bounds.minX) * (bounds.maxY - bounds.minY));
                const dist = camera ? camera.position.distanceTo(mesh.getWorldPosition(new THREE.Vector3())) : 0;
                const score = dist * 1000 + area;
                if (score < bestScore) {
                    bestScore = score;
                    best = mesh;
                }
            });
            return best;
        }

        function pickWallImageByDomPoint(x, y) {
            const prevPointer = cssRenderer?.domElement?.style?.pointerEvents;
            if (cssRenderer?.domElement) cssRenderer.domElement.style.pointerEvents = 'auto';
            const list = document.elementsFromPoint
                ? document.elementsFromPoint(x, y)
                : [document.elementFromPoint(x, y)].filter(Boolean);
            if (cssRenderer?.domElement) cssRenderer.domElement.style.pointerEvents = prevPointer || 'none';
            const element = list.find((node) => node?.closest?.('.wall-image-css'));
            const wrapper = element?.closest?.('.wall-image-css');
            const id = wrapper?.dataset?.wallImageId;
            if (!id) return null;
            return wallImageMeshMap.get(String(id)) || null;
        }

        function getWallImageScreenRect(mesh, rect) {
            if (!mesh || !rect) return null;
            const cssEl = mesh.userData?.cssObject?.element;
            if (cssEl && cssEl.getBoundingClientRect) {
                const imgEl = cssEl.querySelector('img');
                const bounds = (imgEl || cssEl).getBoundingClientRect();
                const pad = mesh.userData?.frame ? 14 : 6;
                let minX = bounds.left - pad;
                let maxX = bounds.right + pad;
                let minY = bounds.top - pad;
                let maxY = bounds.bottom + pad;
                const labelMesh = mesh.userData?.labelMesh;
                if (labelMesh && labelMesh.visible) {
                    labelMesh.updateWorldMatrix(true, false);
                    const labelCorners = [
                        new THREE.Vector3(-0.5, -0.5, 0),
                        new THREE.Vector3(0.5, -0.5, 0),
                        new THREE.Vector3(0.5, 0.5, 0),
                        new THREE.Vector3(-0.5, 0.5, 0)
                    ];
                    for (const corner of labelCorners) {
                        const world = labelMesh.localToWorld(corner.clone());
                        const point = projectToScreenPoint(world, rect);
                        if (!point) continue;
                        minX = Math.min(minX, point.x);
                        maxX = Math.max(maxX, point.x);
                        minY = Math.min(minY, point.y);
                        maxY = Math.max(maxY, point.y);
                    }
                }
                return { minX, maxX, minY, maxY };
            }
            if (mesh.updateWorldMatrix) mesh.updateWorldMatrix(true, false);
            const scaleX = Math.max(0.001, mesh.scale.x || 1);
            const scaleY = Math.max(0.001, mesh.scale.y || 1);
            const padWorld = mesh.userData?.frame ? 0.22 : 0.08;
            const padLocalX = padWorld / scaleX;
            const padLocalY = padWorld / scaleY;
            const halfW = 0.5 + padLocalX;
            const halfH = 0.5 + padLocalY;
            const corners = [
                new THREE.Vector3(-halfW, -halfH, 0),
                new THREE.Vector3(halfW, -halfH, 0),
                new THREE.Vector3(halfW, halfH, 0),
                new THREE.Vector3(-halfW, halfH, 0)
            ];
            let minX = Infinity;
            let maxX = -Infinity;
            let minY = Infinity;
            let maxY = -Infinity;
            for (const corner of corners) {
                const world = mesh.localToWorld(corner.clone());
                const point = projectToScreenPoint(world, rect);
                if (!point) return null;
                minX = Math.min(minX, point.x);
                maxX = Math.max(maxX, point.x);
                minY = Math.min(minY, point.y);
                maxY = Math.max(maxY, point.y);
            }
            const labelMesh = mesh.userData?.labelMesh;
            if (labelMesh && labelMesh.visible) {
                const labelCorners = [
                    new THREE.Vector3(-0.5, -0.5, 0),
                    new THREE.Vector3(0.5, -0.5, 0),
                    new THREE.Vector3(0.5, 0.5, 0),
                    new THREE.Vector3(-0.5, 0.5, 0)
                ];
                labelMesh.updateWorldMatrix(true, false);
                for (const corner of labelCorners) {
                    const world = labelMesh.localToWorld(corner.clone());
                    const point = projectToScreenPoint(world, rect);
                    if (!point) continue;
                    minX = Math.min(minX, point.x);
                    maxX = Math.max(maxX, point.x);
                    minY = Math.min(minY, point.y);
                    maxY = Math.max(maxY, point.y);
                }
            }
            if (!Number.isFinite(minX) || !Number.isFinite(minY)) return null;
            return { minX, maxX, minY, maxY };
        }

        function createBeerBoard() {
            boardGroup.clear();
            boardArrowMeshes = [];
            boardActionMeshes = [];
            boardContentGroup = new THREE.Group();
            if (boardCssGroup?.parent) {
                boardCssGroup.parent.remove(boardCssGroup);
            }
            boardCssGroup = null;
            boardCssMaskObject = null;
            boardCssMaskEl = null;
            boardCssContentEl = null;
            if (cssRenderer?.domElement) {
                cssRenderer.domElement.querySelectorAll('.board-css-mask').forEach((node) => node.remove());
            }

            const boardWidth = room.width * 0.7;
            const boardHeight = 7.4;
            const boardDepth = 0.3;
            const frameThickness = 0.35;
            const innerPadding = 0.8;
            const boardMat = new THREE.MeshStandardMaterial({ color: 0x0f141d, roughness: 0.9, metalness: 0.05 });
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x3c2a1d, roughness: 0.7, metalness: 0.1 });
            const boardMesh = new THREE.Mesh(new THREE.BoxGeometry(boardWidth, boardHeight, boardDepth), boardMat);
            boardMesh.position.set(0, 4.15, -room.depth / 2 + 0.2);
            boardMesh.rotation.y = 0;
            boardGroup.add(boardMesh);
            boardGroup.userData.boardPos = boardMesh.position.clone();

            const frameGeoH = new THREE.BoxGeometry(boardWidth + frameThickness * 2, frameThickness, boardDepth + 0.05);
            const frameGeoV = new THREE.BoxGeometry(frameThickness, boardHeight + frameThickness * 2, boardDepth + 0.05);
            const frameTop = new THREE.Mesh(frameGeoH, frameMat);
            frameTop.position.set(0, boardMesh.position.y + boardHeight / 2 + frameThickness / 2, boardMesh.position.z);
            const frameBottom = frameTop.clone();
            frameBottom.position.y = boardMesh.position.y - boardHeight / 2 - frameThickness / 2;
            const frameLeft = new THREE.Mesh(frameGeoV, frameMat);
            frameLeft.position.set(-boardWidth / 2 - frameThickness / 2, boardMesh.position.y, boardMesh.position.z);
            const frameRight = frameLeft.clone();
            frameRight.position.x = boardWidth / 2 + frameThickness / 2;
            boardGroup.add(frameTop, frameBottom, frameLeft, frameRight);

            boardContentGroup.position.set(0, boardMesh.position.y + boardHeight * 0.015, boardMesh.position.z + 0.18);
            boardGroup.add(boardContentGroup);
            ensureBoardCssGroup();

            const arrowMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.6, metalness: 0.2 });
            const arrowGeo = new THREE.ConeGeometry(0.5, 1.05, 3);
            const arrowLeft = new THREE.Mesh(arrowGeo, arrowMat);
            arrowLeft.rotation.z = Math.PI / 2;
            arrowLeft.position.set(-boardWidth / 2 - 0.9, boardMesh.position.y, boardMesh.position.z + 0.55);
            arrowLeft.userData.scrollDir = 1;
            const arrowRight = new THREE.Mesh(arrowGeo, arrowMat);
            arrowRight.rotation.z = -Math.PI / 2;
            arrowRight.position.set(boardWidth / 2 + 0.9, boardMesh.position.y, boardMesh.position.z + 0.55);
            arrowRight.userData.scrollDir = -1;
            boardGroup.add(arrowLeft, arrowRight);
            boardArrowMeshes.push(arrowLeft, arrowRight);

            boardGroup.userData.boardWidth = boardWidth;
            boardGroup.userData.boardHeight = boardHeight;

            const innerWidth = boardWidth - frameThickness * 2 - innerPadding;
            const innerHeight = boardHeight - frameThickness * 2 - innerPadding;
            boardGroup.userData.innerWidth = innerWidth;
            boardGroup.userData.innerHeight = innerHeight;
            const left = boardMesh.position.x - innerWidth / 2;
            const right = boardMesh.position.x + innerWidth / 2;
            const bottom = boardMesh.position.y - innerHeight / 2;
            const top = boardMesh.position.y + innerHeight / 2;
            boardClipPlanes = [
                new THREE.Plane(new THREE.Vector3(1, 0, 0), -left),
                new THREE.Plane(new THREE.Vector3(-1, 0, 0), right),
                new THREE.Plane(new THREE.Vector3(0, 1, 0), -bottom),
                new THREE.Plane(new THREE.Vector3(0, -1, 0), top)
            ];
            const clipGeo = new THREE.PlaneGeometry(innerWidth, innerHeight);
            const clipMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            clipMat.colorWrite = false;
            clipMat.depthTest = false;
            clipMat.depthWrite = false;
            clipMat.stencilWrite = true;
            clipMat.stencilRef = boardStencilRef;
            clipMat.stencilFunc = THREE.AlwaysStencilFunc;
            clipMat.stencilZPass = THREE.ReplaceStencilOp;
            clipMat.stencilZFail = THREE.ReplaceStencilOp;
            clipMat.stencilFail = THREE.ReplaceStencilOp;
            clipMat.side = THREE.DoubleSide;
            boardClipMesh = new THREE.Mesh(clipGeo, clipMat);
            boardClipMesh.position.set(boardMesh.position.x, boardMesh.position.y, boardMesh.position.z + 0.16);
            boardClipMesh.renderOrder = 1;
            boardGroup.add(boardClipMesh);

            const addButtonTex = createBoardButtonTexture('Добавить пиво');
            const addButtonMat = new THREE.MeshBasicMaterial({ map: addButtonTex, transparent: true });
            const addButtonMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.85, 0.55), addButtonMat);
            addButtonMesh.position.set(boardMesh.position.x + boardWidth / 2 - 1.28, boardMesh.position.y + boardHeight / 2 - 0.45, boardMesh.position.z + 0.26);
            addButtonMesh.userData.action = 'add-beer';
            boardGroup.add(addButtonMesh);
            boardActionMeshes.push(addButtonMesh);
        }

        function ensureCssRenderer() {
            if (!window.THREE?.CSS3DRenderer || !window.THREE?.CSS3DObject) {
                if (typeof ensureCssModules === 'function') {
                    ensureCssModules();
                }
            }
            if (cssRenderer && cssScene) return true;
            if (!window.THREE?.CSS3DRenderer || !window.THREE?.CSS3DObject) {
                scheduleCssRendererRetry();
                return false;
            }
            cssScene = new THREE.Scene();
            cssRenderer = new THREE.CSS3DRenderer();
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.domElement.className = 'css3d-root';
            cssRenderer.domElement.style.position = 'absolute';
            cssRenderer.domElement.style.top = '0';
            cssRenderer.domElement.style.left = '0';
            cssRenderer.domElement.style.zIndex = '3';
            cssRenderer.domElement.style.pointerEvents = 'none';
            const exitHandler = (event) => {
                if (isBeerAddOpen) {
                    if (event.target.closest && event.target.closest('.beer-add-3d')) return;
                    exitBeerAddEditing(event);
                    return;
                }
                if (isPoopAddOpen) return;
            };
            cssRenderer.domElement.addEventListener('pointerdown', exitHandler);
            cssRenderer.domElement.addEventListener('click', exitHandler);
            cssRenderer.domElement.addEventListener('click', (event) => {
                if (isPoopAddOpen && handlePoopAddLockedClick(event)) {
                    event.preventDefault();
                    event.stopPropagation();
                }
            });
            cssRenderer.domElement.addEventListener('wheel', (event) => {
                if ((isPoopAddOpen && handlePoopAddLockedScroll(event)) || handleBeerAddLockedScroll(event)) {
                    event.preventDefault();
                }
            }, { passive: false });
            document.getElementById('scene').appendChild(cssRenderer.domElement);
            if (!cssWallHandlersBound) {
                cssWallHandlersBound = true;
                const shouldSkip = (event) => {
                    if (isPoopAddOpen || isBeerAddOpen) return true;
                    const target = event?.target;
                    if (target?.closest?.('.beer-add-3d') || target?.closest?.('.poop-add-3d')) return true;
                    return false;
                };
                cssRenderer.domElement.addEventListener('pointerdown', (event) => {
                    if (shouldSkip(event)) return;
                    if (handleWallImagePointerDown(event)) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                });
                cssRenderer.domElement.addEventListener('pointermove', (event) => {
                    if (shouldSkip(event)) return;
                    handleWallImagePointerMove(event);
                });
                const endHandler = (event) => {
                    if (shouldSkip(event)) return;
                    handleWallImagePointerUp(event);
                };
                cssRenderer.domElement.addEventListener('pointerup', endHandler);
                cssRenderer.domElement.addEventListener('pointerleave', endHandler);
                cssRenderer.domElement.addEventListener('pointercancel', endHandler);
                cssRenderer.domElement.addEventListener('click', (event) => {
                    if (shouldSkip(event)) return;
                    if (handleWallImageClick(event)) {
                        event.preventDefault();
                        event.stopPropagation();
                        return;
                    }
                    if (!isLocked && renderer?.domElement?.requestPointerLock) {
                        const target = event?.target;
                        if (target?.closest?.('.wall-image-toolbar') || target?.closest?.('.wall-image-css')) return;
                        renderer.domElement.requestPointerLock();
                    }
                });
            }
            return true;
        }

        function scheduleCssRendererRetry() {
            if (cssInitRetryId) return;
            cssInitRetryId = window.setTimeout(() => {
                cssInitRetryId = null;
                if (ensureCssRenderer()) {
                    refreshCssContentAfterInit();
                } else {
                    scheduleCssRendererRetry();
                }
            }, 120);
        }

        function refreshCssContentAfterInit() {
            if (wallSurfaces.length) {
                wallSurfaces.forEach((wall) => ensureWallCssAnchor(wall));
            }
            if (wallImageMeshMap.size) {
                wallImageMeshMap.forEach((mesh) => {
                    if (mesh?.userData?.cssObject) return;
                    const wall = wallSurfaces.find((s) => s.id === mesh.userData.wallId);
                    const url = mesh.userData.url || wallImages.find((img) => String(img.id) === String(mesh.userData.id))?.url || '';
                    if (url && wall) setupWallImageCss(mesh, url, wall);
                });
            }
            if (boardGroup && beerData.length) {
                updateBeerBoard();
            }
        }

        function updateBeerAddPointerEvents() {
            if (!cssRenderer?.domElement) return;
            if (isPoopAddOpen) {
                cssRenderer.domElement.style.pointerEvents = 'none';
                if (renderer?.domElement) renderer.domElement.style.pointerEvents = 'auto';
                if (wallImageGroup) wallImageGroup.visible = true;
                cssRenderer.domElement.style.cursor = '';
                if (renderer?.domElement) renderer.domElement.style.cursor = '';
                return;
            }
            if (!isBeerAddOpen && !isPoopAddOpen) {
                cssRenderer.domElement.style.pointerEvents = isLocked ? 'none' : 'auto';
                if (renderer?.domElement) renderer.domElement.style.pointerEvents = 'auto';
                cssRenderer.domElement.style.cursor = '';
                if (renderer?.domElement) renderer.domElement.style.cursor = '';
                return;
            }
            cssRenderer.domElement.style.pointerEvents = isLocked ? 'none' : 'auto';
            if (renderer?.domElement) renderer.domElement.style.pointerEvents = 'auto';
            cssRenderer.domElement.style.cursor = '';
            if (renderer?.domElement) renderer.domElement.style.cursor = '';
        }

        function exitBeerAddEditing(event) {
            if (!isBeerAddOpen) return;
            const active = document.activeElement;
            if (active && active.closest && active.closest('.beer-add-3d')) {
                active.blur();
            }
            document.querySelectorAll('.beer-add-3d .cs.open').forEach((node) => {
                node.classList.remove('open');
                const btn = node.querySelector('.cs-btn');
                if (btn) btn.setAttribute('aria-expanded', 'false');
            });
            if (cssRenderer?.domElement) cssRenderer.domElement.style.pointerEvents = 'none';
            const prefersCssLock = Boolean(
                cssRenderer?.domElement &&
                event?.target &&
                cssRenderer.domElement.contains(event.target)
            );
            const lockTarget = prefersCssLock ? cssRenderer?.domElement : renderer?.domElement;
            if (lockTarget?.requestPointerLock) {
                lockTarget.requestPointerLock();
            } else if (cssRenderer?.domElement?.requestPointerLock) {
                cssRenderer.domElement.requestPointerLock();
            }
            window.setTimeout(() => {
                if (!isBeerAddOpen) return;
                if (
                    document.pointerLockElement !== renderer?.domElement &&
                    document.pointerLockElement !== cssRenderer?.domElement
                ) {
                    updateBeerAddPointerEvents();
                }
            }, 250);
        }

        function exitPoopAddEditing() {
            if (!isPoopAddOpen) return;
            closePoopAddModal3D();
            if (renderer?.domElement?.requestPointerLock) {
                renderer.domElement.requestPointerLock();
            }
        }

        function setupCustomSelect(wrapper, options, defaultValue, onChange) {
            if (!wrapper || !options?.length) return;
            if (wrapper.dataset.ready === 'true') return;
            const btn = wrapper.querySelector('.cs-btn');
            const menu = wrapper.querySelector('.cs-menu');
            if (!btn || !menu) return;
            wrapper.dataset.ready = 'true';

            const setValue = (value) => {
                const option = options.find((opt) => opt.value === value) || options[0];
                wrapper.dataset.value = option.value;
                btn.textContent = option.label;
                menu.querySelectorAll('.cs-opt').forEach((opt) => {
                    opt.setAttribute('aria-selected', String(opt.dataset.value === option.value));
                });
                if (typeof onChange === 'function') {
                    onChange(option.value);
                }
            };

            menu.innerHTML = '';
            options.forEach((opt) => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'cs-opt';
                item.dataset.value = opt.value;
                item.textContent = opt.label;
                item.setAttribute('aria-selected', 'false');
                item.addEventListener('pointerdown', (event) => event.stopPropagation());
                item.addEventListener('click', (event) => {
                    event.stopPropagation();
                    setValue(opt.value);
                    wrapper.classList.remove('open');
                    btn.setAttribute('aria-expanded', 'false');
                });
                menu.appendChild(item);
            });

            btn.addEventListener('click', (event) => {
                event.stopPropagation();
                const root = wrapper.closest('.beer-add-3d');
                if (root) {
                    root.querySelectorAll('.cs.open').forEach((node) => {
                        if (node !== wrapper) {
                            node.classList.remove('open');
                            const nodeBtn = node.querySelector('.cs-btn');
                            if (nodeBtn) nodeBtn.setAttribute('aria-expanded', 'false');
                        }
                    });
                }
                const open = !wrapper.classList.contains('open');
                wrapper.classList.toggle('open', open);
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
            });

            setValue(defaultValue ?? options[0].value);
        }

        function projectToScreenPoint(worldPos, rect) {
            if (!camera) return null;
            beerAddScreenVec.copy(worldPos).project(camera);
            if (beerAddScreenVec.z < -1 || beerAddScreenVec.z > 1) return null;
            return {
                x: rect.left + (beerAddScreenVec.x * 0.5 + 0.5) * rect.width,
                y: rect.top + (-beerAddScreenVec.y * 0.5 + 0.5) * rect.height
            };
        }

        function getBeerAddScreenRect(x, y, z) {
            if (!renderer || !camera) return null;
            const rect = renderer.domElement.getBoundingClientRect();
            const halfW = 2.1;
            const halfH = 3.2;
            const corners = [
                new THREE.Vector3(x - halfW, y - halfH, z),
                new THREE.Vector3(x + halfW, y - halfH, z),
                new THREE.Vector3(x + halfW, y + halfH, z),
                new THREE.Vector3(x - halfW, y + halfH, z)
            ];
            let minX = Infinity;
            let maxX = -Infinity;
            let minY = Infinity;
            let maxY = -Infinity;
            for (const corner of corners) {
                const p = projectToScreenPoint(corner, rect);
                if (!p) continue;
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y);
                maxY = Math.max(maxY, p.y);
            }
            if (!Number.isFinite(minX)) return null;
            return { minX, maxX, minY, maxY, rect };
        }

        function isBeerAddOverlappingRemotePlayers(screenRect) {
            if (!screenRect || remotePlayers.size === 0) return false;
            for (const player of remotePlayers.values()) {
                const group = player.group;
                if (!group || !group.visible) continue;
                const height = group.userData?.avatarHeight || AVATAR_TARGET_HEIGHT;
                const pos = group.position.clone();
                pos.y += height * 0.6;
                const point = projectToScreenPoint(pos, screenRect.rect);
                if (!point) continue;
                if (
                    point.x >= screenRect.minX &&
                    point.x <= screenRect.maxX &&
                    point.y >= screenRect.minY &&
                    point.y <= screenRect.maxY
                ) {
                    return true;
                }
            }
            return false;
        }

        function syncBeerAddModalPosition() {
            if (!beerAddAnchor || !boardGroup?.userData?.boardPos) return;
            if (beerAddAnchor.userData.hasCustomPosition) return;
            const pos = boardGroup.userData.boardPos;
            const height = boardGroup.userData.boardHeight || 7.4;
            const width = boardGroup.userData.boardWidth || room.width * 0.7;
            const offsetX = width / 2 + 4.4;
            let targetX = pos.x + offsetX;
            const targetY = pos.y + height * 0.05;
            const targetZ = pos.z + 0.9;
            if (isBeerAddOpen && renderer && camera && remotePlayers.size > 0) {
                const shiftStep = 2.4;
                const candidates = [0, shiftStep, -shiftStep, shiftStep * 2, -shiftStep * 2, shiftStep * 3, -shiftStep * 3];
                for (const shift of candidates) {
                    const rect = getBeerAddScreenRect(targetX + shift, targetY, targetZ);
                    if (!rect) continue;
                    if (!isBeerAddOverlappingRemotePlayers(rect)) {
                        targetX = targetX + shift;
                        break;
                    }
                }
            }
            beerAddAnchor.position.set(targetX, targetY, targetZ);
            beerAddAnchor.rotation.set(0, 0, 0);
            if (beerAddHitMesh) {
                beerAddHitMesh.position.set(targetX, targetY, targetZ + 0.01);
                beerAddHitMesh.rotation.set(0, 0, 0);
            }
        }

        async function addBeerFrom3DModal() {
            const root = beerAddObject?.element;
            if (!root) return;
            const name = root.querySelector('#beer3dName').value.trim();
            const type = getBeerAddSelectValue(root, 'type');
            const style = getBeerAddSelectValue(root, 'style');
            const filtered = getBeerAddSelectValue(root, 'filtered');
            const country = getBeerAddSelectValue(root, 'country');
            const volume = getBeerAddSelectValue(root, 'volume');
            const alcohol = root.querySelector('#beer3dAlcohol').value.trim();
            const calories = root.querySelector('#beer3dCalories').value.trim();
            const author = getCurrentUserName();

            if (!name || !alcohol || !author) {
                alert('Заполните все поля!');
                return;
            }
            const beer = {
                id: Date.now().toString(),
                name,
                type,
                style,
                filtered,
                country,
                volume,
                alcohol,
                calories,
                author,
                ratings: {},
                timestamp: Date.now()
            };
            const updated = [...beerData, beer];
            try {
                const db = firebase.database();
                const updates = { beerRating: updated };
                updates[BEER_RATING_META_PATH] = firebase.database.ServerValue.TIMESTAMP;
                await db.ref().update(updates);
                applyBeerData(updated);
                closeBeerAddModal3D();
            } catch (err) {
                console.warn('add beer failed', err);
            }
        }
