        function formatBeerValue(value, suffix = '') {
            if (value === undefined || value === null || value === '') return '—';
            return `${value}${suffix}`;
        }

        function getCountryMeta(raw) {
            const value = String(raw || '').trim();
            if (!value) return { flag: '', name: '—' };
            const flagMatch = value.match(/[\u{1F1E6}-\u{1F1FF}]{2}/u);
            if (flagMatch) {
                const flag = flagMatch[0];
                const name = value.replace(flag, '').trim();
                return { flag, name: name || value };
            }
            const key = value.toLowerCase();
            if (COUNTRY_INFO[key]) return COUNTRY_INFO[key];
            const stripped = key.replace(/[^a-zа-яё\s]/g, '').trim();
            if (COUNTRY_INFO[stripped]) return COUNTRY_INFO[stripped];
            if (COUNTRY_INFO[stripped.slice(0, 2)]) return COUNTRY_INFO[stripped.slice(0, 2)];
            return { flag: '', name: value };
        }

        function wrapTextLines(ctx, text, maxWidth) {
            const words = String(text || '').split(/\s+/).filter(Boolean);
            if (!words.length) return [''];
            const lines = [];
            let line = words[0];
            for (let i = 1; i < words.length; i += 1) {
                const next = `${line} ${words[i]}`;
                if (ctx.measureText(next).width <= maxWidth) {
                    line = next;
                } else {
                    lines.push(line);
                    line = words[i];
                }
            }
            lines.push(line);
            return lines;
        }

        function clampLinesToHeight(ctx, lines, maxWidth, maxLines) {
            if (lines.length <= maxLines) return lines;
            const trimmed = lines.slice(0, maxLines).map((line) => {
                if (typeof line === 'string') return { text: line };
                return line;
            });
            const lastIndex = trimmed.length - 1;
            const last = trimmed[lastIndex];
            const text = typeof last.text === 'string' ? last.text : String(last.text || '');
            trimmed[lastIndex] = { ...last, text: truncateText(ctx, text, maxWidth) };
            return trimmed;
        }

        function drawFunnelIcon(ctx, x, y, size, color) {
            const scale = size / 24;
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.4;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(3, 4);
            ctx.lineTo(21, 4);
            ctx.lineTo(14, 12);
            ctx.lineTo(14, 18);
            ctx.lineTo(10, 20);
            ctx.lineTo(10, 12);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(canvas.width - radius, 0);
            ctx.quadraticCurveTo(canvas.width, 0, canvas.width, radius);
            ctx.lineTo(canvas.width, canvas.height - radius);
            ctx.quadraticCurveTo(canvas.width, canvas.height, canvas.width - radius, canvas.height);
            ctx.lineTo(radius, canvas.height);
            ctx.quadraticCurveTo(0, canvas.height, 0, canvas.height - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.7)';
            ctx.lineWidth = 6;
            ctx.stroke();
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);

        function getRatingsSummaryText(beer) {
            const ratings = beer?.ratings && typeof beer.ratings === 'object' ? beer.ratings : null;
            if (!ratings) return '—';
            const entries = Object.entries(ratings).map(([name, val]) => {
                const num = parseFloat(String(val || '').replace(',', '.'));
                return `${name}: ${Number.isFinite(num) ? formatNumber(num, 1) : '—'}`;
            });
            return entries.length ? entries.join(' · ') : '—';
        }

                ctx.font = `bold ${nameFont}px Comfortaa, sans-serif`;
                nameLines = wrapTextLines(ctx, name, maxWidth);
                if (nameLines.length <= 2) break;
                nameFont -= 2;
            }
            const nameLineHeight = Math.round(nameFont * 1.2);
            const nameY = 18;
            ctx.fillStyle = '#f8fafc';
            nameLines.slice(0, 2).forEach((line, idx) => {
                ctx.fillText(line, leftPad, nameY + idx * nameLineHeight);
            });

            const { flag, name: countryName } = getCountryMeta(beer?.country || '');
            const countryY = nameY + nameLineHeight * Math.min(nameLines.length, 2) + 8;
            const emojiFont = '26px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
            const textFont = '26px Comfortaa, sans-serif';
            let x = leftPad;

            ctx.font = textFont;

            texture.colorSpace = THREE.SRGBColorSpace;

        function createBeerInfoTexture(beer) {
            const canvas = document.createElement('canvas');
            canvas.width = BEER_INFO_CANVAS.width;
            canvas.height = BEER_INFO_CANVAS.height;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(12, 16, 24, 0.82)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, 'rgba(245, 158, 11, 0.12)');
            grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
            ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = '20px Comfortaa, sans-serif';
            ctx.fillStyle = 'rgba(226, 232, 240, 0.95)';

            const summary = getRatingsSummary(beer);
            const avgText = summary.avg != null ? formatNumber(summary.avg, 1) : formatBeerValue(beer?.rating);
            const countText = summary.count != null ? String(summary.count) : (getRatingsCount(beer) != null ? String(getRatingsCount(beer)) : '—');
            const ratingsText = getRatingsSummaryText(beer);

            const filteredValue = String(beer?.filtered || '').trim().toLowerCase();
            const isFiltered = filteredValue && !filteredValue.startsWith('не') && filteredValue.includes('фильтр');
            const entries = [
                { text: `Рейтинг: ${avgText} (оценок: ${countText})` },
                { text: `Оценки: ${ratingsText}` },
                { text: `Автор: ${formatBeerValue(beer?.author)}` },
                { text: `Вид: ${formatBeerValue(beer?.type)}`, icon: isFiltered },
                { text: `Сорт: ${formatBeerValue(beer?.style)}` },
                { text: `Объём: ${formatBeerValue(beer?.volume, ' л')}` },
                { text: `Крепость: ${formatBeerValue(formatNumber(beer?.alcohol, 1), '%')}` },
                { text: `Калории: ${formatBeerValue(formatNumber(beer?.calories, 0), ' ккал')}` }
            ];

            const leftPad = 26;
            const maxWidth = canvas.width - leftPad * 2;
            let fontSize = 26;
            let lineHeight = Math.round(fontSize * 1.3);
            let iconSize = Math.round(lineHeight * 0.7);
            const maxHeight = canvas.height - leftPad * 2;
            let wrapped = [];
            const buildWrapped = () => {
                ctx.font = `${fontSize}px Comfortaa, sans-serif`;
                lineHeight = Math.round(fontSize * 1.3);
                iconSize = Math.round(lineHeight * 0.7);
                wrapped = [];
                entries.forEach((entry) => {
                    const lineMaxWidth = entry.icon ? (maxWidth - iconSize - 8) : maxWidth;
                    const parts = wrapTextLines(ctx, entry.text, lineMaxWidth);
                    parts.forEach((part, idx) => {
                        const iconAfterText = entry.icon && idx === 0;
                        const textWidth = iconAfterText ? ctx.measureText(part).width : 0;
                        wrapped.push({
                            text: part,
                            icon: iconAfterText,
                            iconXOffset: iconAfterText ? Math.min(textWidth + 8, maxWidth - iconSize) : 0
                        });
                    });
                });
            };
            buildWrapped();
            while (wrapped.length * lineHeight > maxHeight && fontSize > 18) {
                fontSize -= 1;
                buildWrapped();
            }
            const maxLines = Math.max(1, Math.floor(maxHeight / lineHeight));
            const finalLines = clampLinesToHeight(ctx, wrapped, maxWidth, maxLines);
            let y = 20;
            finalLines.forEach((line) => {
                const lineMaxWidth = line.icon ? (maxWidth - iconSize - 8) : maxWidth;
                const text = truncateText(ctx, line.text, lineMaxWidth);
                ctx.fillText(text, leftPad, y);
                if (line.icon) {
                    const offset = Number.isFinite(line.iconXOffset) ? line.iconXOffset : (maxWidth - iconSize);
                    const iconX = leftPad + offset;
                    const iconY = y + (lineHeight - iconSize) / 2;
                    drawFunnelIcon(ctx, iconX, iconY, iconSize, 'rgba(253, 230, 138, 0.95)');
                }
                y += lineHeight;
            });
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

                ctx.rect(left, 0, fillWidth, canvas.height);

                ctx.fillStyle = 'rgba(245, 158, 11, 0.95)';

        function setupWallSurfaces(backWall, frontWall, leftWall, rightWall) {
            wallImageGroup = new THREE.Group();
            scene.add(wallImageGroup);
            const makeSurface = (id, mesh, width, height) => {
                const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(mesh.quaternion);
                const anchor = new THREE.Group();
                anchor.position.copy(mesh.position).addScaledVector(normal, WALL_IMAGE_WALL_OFFSET);
                anchor.rotation.copy(mesh.rotation);
                wallImageGroup.add(anchor);
                return { id, mesh, anchor, cssAnchor: null, normal, width, height };
            };
            wallSurfaces = [
                makeSurface('back', backWall, room.width, room.height),
                makeSurface('front', frontWall, room.width, room.height),
                makeSurface('left', leftWall, room.depth, room.height),
                makeSurface('right', rightWall, room.depth, room.height)
            ];
            wallSurfaces.forEach((wall) => ensureWallCssAnchor(wall));
            ensureWallDrawLayers();
            if (wallDrawPendingState) {
                const pending = wallDrawPendingState;
                wallDrawPendingState = null;
                applyWallDrawState(pending);
            }
            const stored = loadWallImagesFromStorage();
            if (stored.length) applyWallImages(stored, { cache: false });
        }

        function ensureWallCssAnchor(wall) {
            if (!wall) return null;
            if (wall.cssAnchor) return wall.cssAnchor;
            if (!ensureWallCssRenderer()) return null;
            const cssAnchor = new THREE.Group();
            cssAnchor.position.copy(wall.anchor.position);
            cssAnchor.rotation.copy(wall.anchor.rotation);
            wallCssScene.add(cssAnchor);
            wall.cssAnchor = cssAnchor;
            return cssAnchor;
        }

        function ensureWallDrawLayers() {
            if (!wallSurfaces.length) return;
            wallSurfaces.forEach((wall) => ensureWallDrawLayer(wall));
        }

        function ensureWallDrawLayer(wall) {
            if (!wall || wallDrawLayers.has(wall.id)) return;
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(512, Math.round(wall.width * WALL_DRAW_CANVAS_SCALE));
            canvas.height = Math.max(512, Math.round(wall.height * WALL_DRAW_CANVAS_SCALE));
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const texture = new THREE.CanvasTexture(canvas);
            if (THREE.SRGBColorSpace) texture.colorSpace = THREE.SRGBColorSpace;
            const material = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                depthWrite: false,
                depthTest: true,
                side: THREE.DoubleSide
            });
            material.polygonOffset = true;
            material.polygonOffsetFactor = -1;
            material.polygonOffsetUnits = -1;
            const geometry = new THREE.PlaneGeometry(wall.width, wall.height);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0, 0.002);
            mesh.renderOrder = 5;
            wall.anchor.add(mesh);
            const textCanvas = document.createElement('canvas');
            textCanvas.width = canvas.width;
            textCanvas.height = canvas.height;
            const textCtx = textCanvas.getContext('2d');
            textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
            const textTexture = new THREE.CanvasTexture(textCanvas);
            if (THREE.SRGBColorSpace) textTexture.colorSpace = THREE.SRGBColorSpace;
            const textMaterial = new THREE.MeshBasicMaterial({
                map: textTexture,
                transparent: true,
                depthWrite: false,
                depthTest: true,
                side: THREE.DoubleSide
            });
            textMaterial.polygonOffset = true;
            textMaterial.polygonOffsetFactor = -2;
            textMaterial.polygonOffsetUnits = -2;
            const textMesh = new THREE.Mesh(geometry.clone(), textMaterial);
            textMesh.position.set(0, 0, WALL_DRAW_TEXT_OFFSET);
            textMesh.renderOrder = 6;
            wall.anchor.add(textMesh);
            const selectCanvas = document.createElement('canvas');
            selectCanvas.width = canvas.width;
            selectCanvas.height = canvas.height;
            const selectCtx = selectCanvas.getContext('2d');
            selectCtx.clearRect(0, 0, selectCanvas.width, selectCanvas.height);
            const selectTexture = new THREE.CanvasTexture(selectCanvas);
            if (THREE.SRGBColorSpace) selectTexture.colorSpace = THREE.SRGBColorSpace;
            const selectMaterial = new THREE.MeshBasicMaterial({
                map: selectTexture,
                transparent: true,
                depthWrite: false,
                depthTest: true,
                side: THREE.DoubleSide
            });
            const selectMesh = new THREE.Mesh(geometry.clone(), selectMaterial);
            selectMesh.position.set(0, 0, WALL_DRAW_TEXT_OFFSET + 0.02);
            selectMesh.renderOrder = 8;
            wall.anchor.add(selectMesh);
            wallDrawLayers.set(wall.id, {
                wall,
                wallId: wall.id,
                canvas,
                ctx,
                texture,
                mesh,
                textCanvas,
                textCtx,
                textTexture,
                textMesh,
                texts: [],
                strokes: [],
                selectCanvas,
                selectCtx,
                selectTexture,
                selectMesh
            });
        }

        function addWallImage(url) {
            const placement = pickWallPlacement();
            const id = Date.now() + (wallImageIdCounter++ % 1000);
            const data = {
                id,
                url,
                wallId: placement.wall.id,
                x: placement.local.x,
                y: placement.local.y,
                scale: 1,
                baseW: 2,
                baseH: 2,
                frame: false,
                labelText: ''
            };
            wallImages.push(data);
            queueWallImagesSave();
            const mesh = createWallImageMesh(data);
            if (mesh) setSelectedWallImage(mesh);
        }

        function pickWallPlacement() {
            const pointer = new THREE.Vector2(0, 0);
            wallImageRaycaster.setFromCamera(pointer, camera);
            const hits = wallImageRaycaster.intersectObjects(wallSurfaces.map((s) => s.mesh), false);
            if (hits.length) {
                const hit = hits[0];
                const wall = wallSurfaces.find((s) => s.mesh === hit.object) || wallSurfaces[0];
                const local = wall.anchor.worldToLocal(hit.point.clone());
                return { wall, local };
            }
            const fallback = wallSurfaces[0];
            return { wall: fallback, local: new THREE.Vector3(0, 0, 0) };
        }

        function applyWallImageTransform(mesh) {
            let scale = Number.isFinite(mesh.userData.scale) ? mesh.userData.scale : 1;
            scale = Math.min(6, Math.max(0.35, scale));
            let baseW = Number.isFinite(mesh.userData.baseW) ? mesh.userData.baseW : 2;
            let baseH = Number.isFinite(mesh.userData.baseH) ? mesh.userData.baseH : 2;
            baseW = Math.min(10, Math.max(0.4, baseW));
            baseH = Math.min(10, Math.max(0.4, baseH));
            mesh.userData.scale = scale;
            mesh.userData.baseW = baseW;
            mesh.userData.baseH = baseH;
            mesh.scale.set(baseW * scale, baseH * scale, 1);
            if (mesh.userData.outline) {
                mesh.userData.outline.scale.set(1, 1, 1);
            }
            if (mesh.userData.frameGroup) {
                mesh.userData.frameGroup.scale.set(1, 1, 1);
            }
            if (mesh.userData.labelMesh) {
                updateWallImageLabel(mesh);
            }
            const wall = wallSurfaces.find((s) => s.id === mesh.userData.wallId);
            if (wall) clampWallImagePosition(mesh, wall);
            updateWallImageCss(mesh);
        }

        function clampWallImagePosition(mesh, wall) {
            const baseW = mesh.userData.baseW || 2;
            const baseH = mesh.userData.baseH || 2;
            const scale = mesh.userData.scale || 1;
            const halfW = (baseW * scale) / 2;
            const halfH = (baseH * scale) / 2;
            const margin = 0.2;
            const maxX = wall.width / 2 - halfW - margin;
            const maxY = wall.height / 2 - halfH - margin;
            mesh.position.x = Math.min(maxX, Math.max(-maxX, mesh.position.x));
            mesh.position.y = Math.min(maxY, Math.max(-maxY, mesh.position.y));
        }

        function syncWallImageData(mesh) {
            const id = mesh.userData.id;
            const item = wallImages.find((img) => String(img.id) === String(id));
            if (!item) return;
            item.x = mesh.position.x;
            item.y = mesh.position.y;
            item.scale = mesh.userData.scale || 1;
            item.baseW = mesh.userData.baseW || item.baseW || 2;
            item.baseH = mesh.userData.baseH || item.baseH || 2;
            item.frame = Boolean(mesh.userData.frame);
            item.labelText = String(mesh.userData.labelText || '');
            if (Number.isFinite(mesh.userData.layer)) {
                item.layer = mesh.userData.layer;
            }
        }

        function removeWallImageById(id) {
            const idx = wallImages.findIndex((img) => String(img.id) === String(id));
            if (idx !== -1) wallImages.splice(idx, 1);
            const mesh = wallImageMeshMap.get(String(id));
            if (mesh && mesh.parent) mesh.parent.remove(mesh);
            if (mesh?.userData?.cssObject?.parent) {
                mesh.userData.cssObject.parent.remove(mesh.userData.cssObject);
            }
            wallImageMeshMap.delete(String(id));
            if (selectedWallImageId && String(selectedWallImageId) === String(id)) {
                setSelectedWallImage(null);
            }
            queueWallImagesSave();
        }

        function createWallImageMesh(data) {
            const wall = wallSurfaces.find((s) => s.id === data.wallId);
            if (!wall) return null;
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(1, 1),
                new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0,
                    depthWrite: true
                })
            );
            mesh.position.set(data.x || 0, data.y || 0, 0);
            mesh.userData.id = data.id;
            mesh.userData.url = data.url || '';
            mesh.userData.wallId = data.wallId;
            mesh.userData.scale = Number.isFinite(data.scale) ? data.scale : 1;
            mesh.userData.baseW = Number.isFinite(data.baseW) ? data.baseW : 2;
            mesh.userData.baseH = Number.isFinite(data.baseH) ? data.baseH : 2;
            mesh.userData.frame = Boolean(data.frame);
            mesh.userData.labelText = String(data.labelText || '');
            if (!Number.isFinite(data.layer)) {
                data.layer = wallImageLayerCounter++;
            } else {
                wallImageLayerCounter = Math.max(wallImageLayerCounter, data.layer + 1);
            }
            mesh.position.z = WALL_IMAGE_SURFACE_OFFSET + (data.layer || 0) * 0.002;
            mesh.renderOrder = 30 + (data.layer || 0);
            const outline = new THREE.LineSegments(
                new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, 1)),
                new THREE.LineBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.8 })
            );
            outline.visible = false;
            outline.position.z = 0.01;
            outline.raycast = () => {};
            mesh.add(outline);
            mesh.userData.outline = outline;
            ensureWallImageFrame(mesh);
            setWallImageFrameVisible(mesh, mesh.userData.frame);
            ensureWallImageLabel(mesh);
            updateWallImageLabel(mesh);
            applyWallImageTransform(mesh);
            wall.anchor.add(mesh);
            wallImageMeshMap.set(String(data.id), mesh);
            if (data.url) {
                setupWallImageTexture(mesh, data.url);
            }
            return mesh;
        }

        function setupWallImageTexture(mesh, url) {
            if (!mesh || !url) return;
            const loader = wallImageTextureLoader || new THREE.TextureLoader();
            loadTextureWithProxy(url, loader, (texture) => {
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                if (renderer?.capabilities?.getMaxAnisotropy) {
                    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                }
                mesh.material.map = texture;
                mesh.material.opacity = 1;
                mesh.material.needsUpdate = true;
                let aspect = 1;
                const image = texture.image;
                if (image?.width && image?.height) {
                    aspect = image.width / image.height;
                }
                if (!Number.isFinite(aspect) || aspect <= 0) aspect = 1;
                aspect = Math.min(4, Math.max(0.25, aspect));
                mesh.userData.baseH = 2;
                mesh.userData.baseW = 2 * aspect;
                applyWallImageTransform(mesh);
                syncWallImageData(mesh);
                saveWallImagesToStorage();
            }, [WALL_IMAGE_PROXY_ENDPOINT]);
        }

        function updateWallImageCss(mesh) {
            const cssObj = mesh?.userData?.cssObject;
            if (!cssObj) return;
            const wall = wallSurfaces.find((s) => s.id === mesh.userData.wallId);
            if (wall?.cssAnchor) {
                wall.cssAnchor.position.copy(wall.anchor.position);
                wall.cssAnchor.rotation.copy(wall.anchor.rotation);
            }
            const widthPx = mesh.userData.cssWidthPx || 600;
            const heightPx = mesh.userData.cssHeightPx || 600;
            cssObj.position.copy(mesh.position);
            cssObj.rotation.copy(mesh.rotation);
            cssObj.scale.set(
                mesh.scale.x / widthPx,
                mesh.scale.y / heightPx,
                1
            );
            cssObj.renderOrder = mesh.renderOrder;
        }

        function ensureWallImageFrame(mesh) {
            if (mesh.userData.frameGroup) return;
            const t = 0.08;
            const depth = 0.06;
            const frameMat = new THREE.MeshStandardMaterial({
                color: 0x4a2d16,
                roughness: 0.7,
                metalness: 0.1
            });
            const frameGroup = new THREE.Group();
            const horizGeo = new THREE.BoxGeometry(1 + t * 2, t, depth);
            const vertGeo = new THREE.BoxGeometry(t, 1 + t * 2, depth);
            const top = new THREE.Mesh(horizGeo, frameMat);
            top.position.set(0, 0.5 + t / 2, 0.02);
            const bottom = top.clone();
            bottom.position.y = -0.5 - t / 2;
            const left = new THREE.Mesh(vertGeo, frameMat);
            left.position.set(-0.5 - t / 2, 0, 0.02);
            const right = left.clone();
            right.position.x = 0.5 + t / 2;
            frameGroup.add(top, bottom, left, right);
            frameGroup.raycast = () => {};
            frameGroup.visible = false;
            mesh.add(frameGroup);
            mesh.userData.frameGroup = frameGroup;
        }

        function setWallImageFrameVisible(mesh, visible) {
            if (!mesh) return;
            ensureWallImageFrame(mesh);
            mesh.userData.frame = Boolean(visible);
            if (mesh.userData.frameGroup) {
                mesh.userData.frameGroup.visible = mesh.userData.frame;
            }
        }

        function ensureWallImageLabel(mesh) {
            if (mesh.userData.labelMesh) return;
            const mat = new THREE.MeshBasicMaterial({
                transparent: true,
                color: 0xffffff,
                depthTest: true,
                depthWrite: false,
                polygonOffset: true,
                polygonOffsetFactor: -1,
                polygonOffsetUnits: -1
            });
            const labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
            labelMesh.position.z = 0.05;
            labelMesh.renderOrder = (mesh.renderOrder || 0) + 2;
            labelMesh.visible = false;
            labelMesh.raycast = () => {};
            mesh.add(labelMesh);
            mesh.userData.labelMesh = labelMesh;
            mesh.userData.labelCanvas = document.createElement('canvas');
        }

        function updateWallImageLabel(mesh) {
            const text = String(mesh.userData.labelText || '').trim();
            ensureWallImageLabel(mesh);
            const labelMesh = mesh.userData.labelMesh;
            if (!labelMesh) return;
            if (!text) {
                labelMesh.visible = false;
                return;
            }
            const canvas = mesh.userData.labelCanvas || document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const baseW = mesh.userData.baseW || 2;
            const baseH = mesh.userData.baseH || 2;
            const labelW = Math.max(0.6, baseW * 0.6);
            const labelH = Math.max(0.08, Math.min(baseH * 0.09, 0.18));
            const localW = labelW / baseW;
            const localH = labelH / baseH;
            labelMesh.scale.set(localW, localH, 1);
            const gap = 0.06 / baseH;
            labelMesh.position.y = -0.5 - gap - localH / 2;
            labelMesh.renderOrder = (mesh.renderOrder || 0) + 2;

            const pxPerUnit = 220;
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            const widthPx = Math.max(1, Math.round(labelW * pxPerUnit * pixelRatio));
            const heightPx = Math.max(1, Math.round(labelH * pxPerUnit * pixelRatio));
            canvas.width = widthPx;
            canvas.height = heightPx;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, widthPx, heightPx);
            ctx.scale(pixelRatio, pixelRatio);
            ctx.imageSmoothingEnabled = true;
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';

            const cssW = widthPx / pixelRatio;
            const cssH = heightPx / pixelRatio;
            ctx.fillStyle = '#f6f1e8';
            ctx.fillRect(0, 0, cssW, cssH);
            ctx.strokeStyle = '#d7c6a8';
            ctx.lineWidth = 2;
            ctx.strokeRect(1, 1, cssW - 2, cssH - 2);
            const paddingX = 10;
            const paddingY = 8;
            let fontSize = Math.floor(cssH * 0.3);
            const minFontSize = Math.max(9, Math.floor(cssH * 0.22));
            const maxLines = 2;
            const applyFont = () => {
                ctx.font = `600 ${fontSize}px Comfortaa, sans-serif`;
                if ('fontKerning' in ctx) ctx.fontKerning = 'normal';
            };
            const wrapText = () => {
                const words = text.split(/\s+/).filter(Boolean);
                const lines = [];
                let line = '';
                words.forEach((word) => {
                    const test = line ? `${line} ${word}` : word;
                    const width = ctx.measureText(test).width;
                    if (width <= cssW - paddingX * 2) {
                        line = test;
                    } else {
                        if (line) lines.push(line);
                        line = word;
                    }
                });
                if (line) lines.push(line);
                return lines;
            };
            applyFont();
            let lines = wrapText();
            while (lines.length > maxLines && fontSize > minFontSize) {
                fontSize -= 1;
                applyFont();
                lines = wrapText();
            }
            if (lines.length > maxLines) {
                lines = lines.slice(0, maxLines);
                let last = lines[lines.length - 1];
                while (ctx.measureText(`${last}…`).width > cssW - paddingX * 2 && last.length > 1) {
                    last = last.slice(0, -1);
                }
                lines[lines.length - 1] = `${last}…`;
            }
            ctx.fillStyle = '#1a1a1a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const lineHeight = fontSize * 1.2;
            const totalHeight = lines.length * lineHeight;
            let startY = (cssH - totalHeight) / 2 + lineHeight / 2;
            startY = Math.max(startY, paddingY + lineHeight / 2);
            lines.forEach((line, idx) => {
                ctx.fillText(line, cssW / 2, startY + idx * lineHeight);
            });

            let texture = labelMesh.material.map;
            if (!texture) {
                texture = new THREE.CanvasTexture(canvas);
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                if (renderer?.capabilities?.getMaxAnisotropy) {
                    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                }
                labelMesh.material.map = texture;
            } else {
                texture.image = canvas;
                texture.needsUpdate = true;
            }
            labelMesh.material.needsUpdate = true;
            labelMesh.visible = true;
        }

        function getSelectedWallImageMesh() {
            if (!selectedWallImageId) return null;
            return wallImageMeshMap.get(String(selectedWallImageId)) || null;
        }

        function setSelectedWallImage(mesh) {
            const prev = getSelectedWallImageMesh();
            if (prev && prev.userData?.outline) prev.userData.outline.visible = false;
            if (!mesh) {
                selectedWallImageId = null;
                const toolbar = document.getElementById('wallImageToolbar');
                if (toolbar) toolbar.style.display = 'none';
                return;
            }
            selectedWallImageId = mesh.userData.id;
            if (mesh.userData?.outline) mesh.userData.outline.visible = true;
            if (!Number.isFinite(mesh.userData.layer)) {
                mesh.userData.layer = wallImageLayerCounter++;
            } else {
                mesh.userData.layer = wallImageLayerCounter++;
            }
            mesh.position.z = WALL_IMAGE_SURFACE_OFFSET + mesh.userData.layer * 0.002;
            mesh.renderOrder = 30 + mesh.userData.layer;
            syncWallImageData(mesh);
            queueWallImagesSave();
            const toolbar = document.getElementById('wallImageToolbar');
            if (toolbar) toolbar.style.display = 'flex';
            const scaleInput = document.getElementById('wallImageScale');
            if (scaleInput) scaleInput.value = String(mesh.userData.scale || 1);
            const frameInput = document.getElementById('wallImageFrame');
            if (frameInput) frameInput.checked = Boolean(mesh.userData.frame);
            const labelInput = document.getElementById('wallImageLabel');
            if (labelInput) labelInput.value = String(mesh.userData.labelText || '');
        }

        function handleWallImagePointerDown(event) {
            if (!wallImageGroup) return false;
            if (isLocked) return false;
            if (performance.now() < wallImagePickSuppressUntil) return false;
            wallImageSelectedOnPointerDown = false;
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = isLocked ? rect.left + rect.width / 2 : event.clientX;
            const clientY = isLocked ? rect.top + rect.height / 2 : event.clientY;
            const domPicked = pickWallImageByDomPoint(clientX, clientY);
            wallImagePointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            wallImagePointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            wallImageRaycaster.setFromCamera(wallImagePointer, camera);
            const hits = getWallImageHits();
            let wallHit = wallImageRaycaster.intersectObjects(wallSurfaces.map((s) => s.mesh), false)[0];
            let wall = wallSurfaces.find((s) => s.mesh === wallHit?.object);
            if (!wall && domPicked?.userData?.wallId) {
                wall = wallSurfaces.find((s) => s.id === domPicked.userData.wallId) || null;
                if (wall) {
                    wallHit = wallImageRaycaster.intersectObject(wall.mesh, false)[0] || null;
                    if (!wallHit) {
                        const plane = new THREE.Plane();
                        const normal = wall.normal.clone().normalize();
                        const origin = wall.mesh.getWorldPosition(new THREE.Vector3());
                        plane.setFromNormalAndCoplanarPoint(normal, origin);
                        const hitPoint = new THREE.Vector3();
                        if (wallImageRaycaster.ray.intersectPlane(plane, hitPoint)) {
                            wallHit = { point: hitPoint, object: wall.mesh };
                        }
                    }
                }
            }
            if (!wallHit && !domPicked) return false;
            const byWall = pickWallImageByWallHit(wall, wallHit);
            const domOk = domPicked && (!wall || domPicked.userData?.wallId === wall?.id) ? domPicked : null;
            const picked = domOk || byWall;
            if (!picked) return false;
            const pickedWall = wall || wallSurfaces.find((s) => s.id === picked.userData.wallId);
            if (!pickedWall) {
                setSelectedWallImage(picked);
                wallImageInteractionUntil = performance.now() + 500;
                return true;
            }
            const local = pickedWall.anchor.worldToLocal((wallHit?.point || pickedWall.anchor.getWorldPosition(new THREE.Vector3())).clone());
            wallImageDrag.active = true;
            wallImageDrag.mesh = picked;
            wallImageDrag.wall = pickedWall;
            wallImageDrag.offset.set(local.x - picked.position.x, local.y - picked.position.y);
            wallImageDrag.moved = false;
            wallImageDrag.suppressClick = false;
            setSelectedWallImage(picked);
            wallImageSelectedOnPointerDown = true;
            wallImageInteractionUntil = performance.now() + 500;
            if (event?.target?.setPointerCapture) {
                event.target.setPointerCapture(event.pointerId);
            } else if (renderer?.domElement?.setPointerCapture) {
                renderer.domElement.setPointerCapture(event.pointerId);
            }
            return true;
        }

        function handleWallImagePointerMove(event) {
            if (!wallImageDrag.active || !wallImageDrag.mesh || !wallImageDrag.wall) return;
            wallImageInteractionUntil = performance.now() + 200;
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = isLocked ? rect.left + rect.width / 2 : event.clientX;
            const clientY = isLocked ? rect.top + rect.height / 2 : event.clientY;
            wallImagePointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            wallImagePointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            wallImageRaycaster.setFromCamera(wallImagePointer, camera);
            const wallHit = wallImageRaycaster.intersectObject(wallImageDrag.wall.mesh, false)[0];
            if (!wallHit) return;
            const local = wallImageDrag.wall.anchor.worldToLocal(wallHit.point.clone());
            const nextX = local.x - wallImageDrag.offset.x;
            const nextY = local.y - wallImageDrag.offset.y;
            if (!wallImageDrag.moved) {
                const dx = nextX - wallImageDrag.mesh.position.x;
                const dy = nextY - wallImageDrag.mesh.position.y;
                if (Math.hypot(dx, dy) > 0.02) wallImageDrag.moved = true;
            }
            wallImageDrag.mesh.position.x = nextX;
            wallImageDrag.mesh.position.y = nextY;
            clampWallImagePosition(wallImageDrag.mesh, wallImageDrag.wall);
            updateWallImageCss(wallImageDrag.mesh);
            syncWallImageData(wallImageDrag.mesh);
        }

        function handleWallImagePointerUp(event) {
            if (!wallImageDrag.active) return;
            wallImageDrag.active = false;
            wallImageInteractionUntil = performance.now() + 300;
            if (event?.target?.hasPointerCapture?.(event.pointerId)) {
                event.target.releasePointerCapture(event.pointerId);
            } else if (event && renderer?.domElement && renderer.domElement.hasPointerCapture?.(event.pointerId)) {
                renderer.domElement.releasePointerCapture(event.pointerId);
            }
            if (wallImageDrag.moved) wallImageDrag.suppressClick = true;
            wallImageDrag.mesh = null;
            wallImageDrag.wall = null;
            wallImageDrag.offset.set(0, 0);
            if (wallImageDrag.moved) queueWallImagesSave();
        }

        function handleWallImageClick(event) {
            if (!wallImageGroup) return false;
            if (isLocked) return false;
            if (performance.now() < wallImagePickSuppressUntil) return false;
            if (wallImageSelectedOnPointerDown) {
                wallImageSelectedOnPointerDown = false;
                return true;
            }
            if (wallImageDrag.suppressClick) {
                wallImageDrag.suppressClick = false;
                return true;
            }
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = isLocked ? rect.left + rect.width / 2 : event.clientX;
            const clientY = isLocked ? rect.top + rect.height / 2 : event.clientY;
            const domPicked = pickWallImageByDomPoint(clientX, clientY);
            wallImagePointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            wallImagePointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            wallImageRaycaster.setFromCamera(wallImagePointer, camera);
            const wallHit = wallImageRaycaster.intersectObjects(wallSurfaces.map((s) => s.mesh), false)[0];
            const wall = wallSurfaces.find((s) => s.mesh === wallHit?.object);
            const byWall = wallHit ? pickWallImageByWallHit(wall, wallHit) : null;
            const domOk = domPicked && (!wall || domPicked.userData?.wallId === wall?.id) ? domPicked : null;
            const picked = domOk || byWall || domPicked;
            if (!picked) {
                if (selectedWallImageId) {
                    setSelectedWallImage(null);
                }
                return false;
            }
            setSelectedWallImage(picked);
            return true;
        }

        function getWallImageHits() {
            const meshes = wallImageMeshMap.size ? [...wallImageMeshMap.values()] : wallImageGroup?.children || [];
            return wallImageRaycaster.intersectObjects(meshes, true);
        }

        function getWallImageRootFromHits(hits) {
            if (!hits || !hits.length) return null;
            const obj = hits[0].object;
            const root = obj?.userData?.id ? obj : obj?.parent;
            return root && root.userData?.id ? root : null;
        }

        function pickWallImageByWallHit(wall, wallHit) {
            if (!wall || !wallHit || !wallImageMeshMap.size) return null;
            const local = wall.anchor.worldToLocal(wallHit.point.clone());
            let best = null;
            let bestDist = Infinity;
            wallImageMeshMap.forEach((mesh) => {
                if (!mesh || mesh.userData?.wallId !== wall.id) return;
                const baseW = mesh.userData.baseW || 2;
                const baseH = mesh.userData.baseH || 2;
                const scale = mesh.userData.scale || 1;
                const halfW = (baseW * scale) / 2;
                const halfH = (baseH * scale) / 2;
                const dx = local.x - mesh.position.x;
                const dy = local.y - mesh.position.y;
                const inside = Math.abs(dx) <= halfW && Math.abs(dy) <= halfH;
                const dist = Math.hypot(dx, dy);
                if (inside && dist < bestDist) {
                    best = mesh;
                    bestDist = dist;
                }
            });
            return best;
        }

        function pickWallImageByScreenRect(wall, x, y, rect, strict = false) {
            if (!wallImageMeshMap.size || !rect) return null;
            let best = null;
            let bestScore = Infinity;
            wallImageMeshMap.forEach((mesh) => {
                if (!mesh) return;
                if (wall && mesh.userData?.wallId !== wall.id) return;
                const bounds = getWallImageScreenRect(mesh, rect);
                if (!bounds) return;
                if (x < bounds.minX || x > bounds.maxX || y < bounds.minY || y > bounds.maxY) return;
                if (strict) {
                    const inset = 6;
                    if (x < bounds.minX + inset || x > bounds.maxX - inset || y < bounds.minY + inset || y > bounds.maxY - inset) {
                        return;
                    }
                }
                const area = Math.max(1, (bounds.maxX - bounds.minX) * (bounds.maxY - bounds.minY));
                const dist = camera ? camera.position.distanceTo(mesh.getWorldPosition(new THREE.Vector3())) : 0;
                const score = dist * 1000 + area;
                if (score < bestScore) {
                    bestScore = score;
                    best = mesh;
                }
            });
            return best;
        }

        function pickWallImageByDomPoint(x, y) {
            if (!renderer?.domElement || !wallImageMeshMap.size) return null;
            const rect = renderer.domElement.getBoundingClientRect();
            return pickWallImageByScreenRect(null, x, y, rect, false);
        }

        function getWallDrawHit(event) {
            if (!wallSurfaces.length || !renderer?.domElement) return null;
            const rect = renderer.domElement.getBoundingClientRect();
            const clientX = event.clientX;
            const clientY = event.clientY;
            wallImagePointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            wallImagePointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            wallImageRaycaster.setFromCamera(wallImagePointer, camera);
            const wallHit = wallImageRaycaster.intersectObjects(wallSurfaces.map((s) => s.mesh), false)[0];
            if (!wallHit) return null;
            const wall = wallSurfaces.find((s) => s.mesh === wallHit.object);
            if (!wall) return null;
            const local = wall.anchor.worldToLocal(wallHit.point.clone());
            const u = (local.x / (wall.width / 2) + 1) * 0.5;
            const v = (local.y / (wall.height / 2) + 1) * 0.5;
            if (u < 0 || u > 1 || v < 0 || v > 1) return null;
            const layer = wallDrawLayers.get(wall.id);
            if (!layer) return null;
            const x = u * layer.canvas.width;
            const y = (1 - v) * layer.canvas.height;
            return { wall, wallId: wall.id, x, y, localX: local.x, localY: local.y };
        }

        function wallDrawCanvasToLocal(wallId, x, y) {
            const wall = wallSurfaces.find((s) => s.id === wallId);
            const layer = wallDrawLayers.get(wallId);
            if (!wall || !layer) return { localX: 0, localY: 0 };
            const u = x / layer.canvas.width;
            const v = 1 - y / layer.canvas.height;
            const localX = (u - 0.5) * wall.width;
            const localY = (v - 0.5) * wall.height;
            return { localX, localY };
        }

        function applyWallDrawTool(ctx) {
            if (wallDrawTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = wallDrawSize * 2.6;
                ctx.globalAlpha = 1;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = wallDrawColor;
                ctx.lineWidth = wallDrawSize;
                ctx.globalAlpha = 0.9;
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function drawWallDot(hit) {
            const layer = wallDrawLayers.get(hit.wallId);
            if (!layer) return;
            const ctx = layer.ctx;
            applyWallDrawTool(ctx);
            ctx.beginPath();
            ctx.arc(hit.x, hit.y, Math.max(1, wallDrawSize / 2), 0, Math.PI * 2);
            ctx.fillStyle = wallDrawTool === 'eraser' ? '#000' : wallDrawColor;
            ctx.fill();
            layer.texture.needsUpdate = true;
            wallDrawLastWallId = hit.wallId;
            sendWallDrawStroke(hit, hit);
        }

        function drawWallLine(hit) {
            const layer = wallDrawLayers.get(hit.wallId);
            if (!layer) return;
            const ctx = layer.ctx;
            applyWallDrawTool(ctx);
            if (!wallDrawLast || wallDrawLast.wallId !== hit.wallId) {
                wallDrawLast = hit;
                drawWallDot(hit);
                return;
            }
            const from = wallDrawLast;
            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(hit.x, hit.y);
            ctx.stroke();
            layer.texture.needsUpdate = true;
            wallDrawLast = hit;
            wallDrawLastWallId = hit.wallId;
            sendWallDrawStroke(from, hit);
        }

        function applyWallDrawStrokeEvent(evt) {
            const wallId = String(evt.wallId || '');
            const layer = wallDrawLayers.get(wallId);
            if (!layer) return;
            const ctx = layer.ctx;
            const tool = evt.tool === 'eraser' ? 'eraser' : 'pen';
            const color = evt.color || '#f59e0b';
            const size = Number(evt.size) || 8;
            const x1 = Number(evt.x1);
            const y1 = Number(evt.y1);
            const x2 = Number(evt.x2);
            const y2 = Number(evt.y2);
            if (!Number.isFinite(x1) || !Number.isFinite(y1) || !Number.isFinite(x2) || !Number.isFinite(y2)) return;
            const strokeId = String(evt.strokeId || evt.id || `${Date.now()}-${Math.random()}`);
            if (tool === 'eraser') {
                drawStrokeToCtx(ctx, { tool, color, size, x1, y1, x2, y2 });
                layer.texture.needsUpdate = true;
                return;
            }
            if (!layer.strokes) layer.strokes = [];
            const existing = layer.strokes.find((s) => s.id === strokeId);
            if (existing) {
                Object.assign(existing, { tool, color, size, x1, y1, x2, y2 });
                redrawWallStrokes(layer);
            } else {
                const stroke = { id: strokeId, tool, color, size, x1, y1, x2, y2 };
                layer.strokes.push(stroke);
                drawStrokeToCtx(ctx, stroke);
                layer.texture.needsUpdate = true;
            }
        }

        function applyWallDrawTextEvent(evt) {
            const wallId = String(evt.wallId || '');
            const layer = wallDrawLayers.get(wallId);
            if (!layer) return;
            const textId = String(evt.textId || '');
            if (!textId) return;
            const text = String(evt.text || '');
            const entryIdx = layer.texts.findIndex((t) => t.id === textId);
            if (!text.trim()) {
                if (entryIdx !== -1) {
                    layer.texts.splice(entryIdx, 1);
                    redrawWallTexts(layer);
                }
                return;
            }
            const next = {
                id: textId,
                x: Number(evt.x) || 0,
                y: Number(evt.y) || 0,
                text,
                size: Number(evt.size) || getWallTextSize(),
                color: evt.color || wallDrawColor
            };
            if (entryIdx === -1) {
                layer.texts.push(next);
            } else {
                layer.texts[entryIdx] = { ...layer.texts[entryIdx], ...next };
            }
            redrawWallTexts(layer);
        }

        function sendWallDrawStroke(from, to) {
            if (!from || !to) return;
            const strokeId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            const tool = wallDrawTool === 'eraser' ? 'eraser' : 'pen';
            sendRealtime({
                type: 'wall_draw',
                action: 'stroke',
                wallId: from.wallId || to.wallId,
                strokeId,
                tool,
                color: wallDrawColor,
                size: wallDrawSize,
                x1: from.x,
                y1: from.y,
                x2: to.x,
                y2: to.y,
                clientId: getLocalClientId()
            });
            const layer = wallDrawLayers.get(from.wallId || to.wallId);
            if (layer) {
                if (tool === 'pen') {
                    if (!layer.strokes) layer.strokes = [];
                    layer.strokes.push({
                        id: strokeId,
                        tool,
                        color: wallDrawColor,
                        size: wallDrawSize,
                        x1: from.x,
                        y1: from.y,
                        x2: to.x,
                        y2: to.y
                    });
                }
            }
        }

        function sendWallDrawText(entry, wallId) {
            if (!entry || !wallId) return;
            sendRealtime({
                type: 'wall_draw',
                action: 'text',
                wallId,
                textId: entry.id,
                x: entry.x,
                y: entry.y,
                text: entry.text,
                size: entry.size,
                color: entry.color,
                clientId: getLocalClientId()
            });
        }

        function sendWallDrawClear(wallId) {
            if (!wallId) return;
            sendRealtime({
                type: 'wall_draw',
                action: 'clear',
                wallId,
                clientId: getLocalClientId()
            });
        }

        function sendWallDrawClearAll() {
            sendRealtime({
                type: 'wall_draw',
                action: 'clear_all',
                clientId: getLocalClientId()
            });
        }

        function getStrokeHitScore(stroke, x, y) {
            const x1 = stroke.x1;
            const y1 = stroke.y1;
            const x2 = stroke.x2;
            const y2 = stroke.y2;
            const dx = x2 - x1;
            const dy = y2 - y1;
            const lenSq = dx * dx + dy * dy;
            if (lenSq <= 0.0001) {
                return Math.hypot(x - x1, y - y1);
            }
            const t = Math.max(0, Math.min(1, ((x - x1) * dx + (y - y1) * dy) / lenSq));
            const projX = x1 + t * dx;
            const projY = y1 + t * dy;
            return Math.hypot(x - projX, y - projY);
        }

        function findWallStrokeAtHit(layer, hit) {
            if (!layer?.strokes?.length) return null;
            let best = null;
            let bestDist = Infinity;
            for (let i = layer.strokes.length - 1; i >= 0; i -= 1) {
                const stroke = layer.strokes[i];
                if (stroke.tool === 'eraser') continue;
                if (
                    !Number.isFinite(stroke.x1)
                    || !Number.isFinite(stroke.y1)
                    || !Number.isFinite(stroke.x2)
                    || !Number.isFinite(stroke.y2)
                ) {
                    continue;
                }
                const dist = getStrokeHitScore(stroke, hit.x, hit.y);
                const threshold = Math.max(WALL_DRAW_HIT_PAD, (stroke.size || wallDrawSize) * 1.2);
                if (dist <= threshold && dist < bestDist) {
                    best = stroke;
                    bestDist = dist;
                }
            }
            return best;
        }

        function redrawWallStrokes(layer) {
            if (!layer) return;
            layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
            layer.texture.needsUpdate = true;
            if (Array.isArray(layer.strokes)) {
                layer.strokes = layer.strokes.filter((stroke) => {
                    if (!stroke || stroke.tool === 'eraser') return false;
                    if (
                        !Number.isFinite(stroke.x1)
                        || !Number.isFinite(stroke.y1)
                        || !Number.isFinite(stroke.x2)
                        || !Number.isFinite(stroke.y2)
                    ) {
                        return false;
                    }
                    return true;
                });
                layer.strokes.forEach((stroke) => {
                    drawStrokeToCtx(layer.ctx, stroke);
                });
            }
            layer.texture.needsUpdate = true;
        }

        function drawStrokeToCtx(ctx, stroke) {
            const tool = stroke.tool === 'eraser' ? 'eraser' : 'pen';
            const color = stroke.color || '#f59e0b';
            const size = Number(stroke.size) || 8;
            const x1 = Number(stroke.x1);
            const y1 = Number(stroke.y1);
            const x2 = Number(stroke.x2);
            const y2 = Number(stroke.y2);
            if (!Number.isFinite(x1) || !Number.isFinite(y1) || !Number.isFinite(x2) || !Number.isFinite(y2)) return;
            ctx.save();
            if (tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = size * 2.6;
                ctx.globalAlpha = 1;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.globalAlpha = 0.9;
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (x1 === x2 && y1 === y2) {
                ctx.beginPath();
                ctx.arc(x1, y1, Math.max(1, size / 2), 0, Math.PI * 2);
                ctx.fillStyle = tool === 'eraser' ? '#000' : color;
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            ctx.restore();
        }

        function normalizeWallRect(x1, y1, x2, y2) {
            const minX = Math.min(x1, x2);
            const maxX = Math.max(x1, x2);
            const minY = Math.min(y1, y2);
            const maxY = Math.max(y1, y2);
            return { minX, maxX, minY, maxY };
        }

        function rectsIntersect(a, b) {
            return !(a.maxX < b.minX || a.minX > b.maxX || a.maxY < b.minY || a.minY > b.maxY);
        }

        function pointInRect(x, y, rect) {
            return x >= rect.minX && x <= rect.maxX && y >= rect.minY && y <= rect.maxY;
        }

        function getStrokeBounds(stroke) {
            if (
                !stroke
                || !Number.isFinite(stroke.x1)
                || !Number.isFinite(stroke.y1)
                || !Number.isFinite(stroke.x2)
                || !Number.isFinite(stroke.y2)
            ) {
                return null;
            }
            const pad = Math.max(10, (stroke.size || wallDrawSize) * 1.4);
            const minX = Math.min(stroke.x1, stroke.x2) - pad;
            const maxX = Math.max(stroke.x1, stroke.x2) + pad;
            const minY = Math.min(stroke.y1, stroke.y2) - pad;
            const maxY = Math.max(stroke.y1, stroke.y2) + pad;
            return { minX, maxX, minY, maxY };
        }

        function collectWallItemsInRect(layer, rect) {
            if (!layer) return [];
            const items = [];
            if (Array.isArray(layer.texts)) {
                layer.texts.forEach((entry) => {
                    if (!entry?.bbox) return;
                    if (rectsIntersect(rect, entry.bbox)) {
                        items.push({ type: 'text', id: entry.id, wallId: layer.wallId, bounds: { ...entry.bbox } });
                    }
                });
            }
            if (Array.isArray(layer.strokes)) {
                layer.strokes.forEach((stroke) => {
                    if (stroke.tool === 'eraser') return;
                    const bounds = getStrokeBounds(stroke);
                    if (bounds && rectsIntersect(rect, bounds)) {
                        items.push({ type: 'stroke', id: stroke.id, wallId: layer.wallId, bounds });
                    }
                });
            }
            return items;
        }

        function getGroupBounds(items) {
            if (!items?.length) return null;
            let minX = Infinity;
            let maxX = -Infinity;
            let minY = Infinity;
            let maxY = -Infinity;
            items.forEach((item) => {
                const bounds = item.bounds;
                if (!bounds) return;
                minX = Math.min(minX, bounds.minX);
                maxX = Math.max(maxX, bounds.maxX);
                minY = Math.min(minY, bounds.minY);
                maxY = Math.max(maxY, bounds.maxY);
            });
            if (!Number.isFinite(minX) || !Number.isFinite(minY)) return null;
            return { minX, maxX, minY, maxY };
        }

        function selectWallDrawGroup(wallId, rect) {
            const layer = wallDrawLayers.get(String(wallId));
            if (!layer) {
                wallDrawSelectedGroup = null;
                wallDrawSelected = null;
                redrawWallSelection();
                return;
            }
            redrawWallTexts(layer);
            const items = collectWallItemsInRect(layer, rect);
            if (!items.length) {
                wallDrawSelectedGroup = null;
            } else {
                wallDrawSelectedGroup = {
                    wallId: layer.wallId,
                    items,
                    bounds: getGroupBounds(items)
                };
            }
            wallDrawSelected = null;
            redrawWallSelection();
        }

        function selectWallDrawItem(item) {
            if (item) {
                const layer = wallDrawLayers.get(item.wallId);
                if (!layer) {
                    wallDrawSelected = null;
                } else if (item.type === 'text') {
                    const exists = layer.texts.some((t) => t.id === item.id);
                    wallDrawSelected = exists ? item : null;
                } else if (item.type === 'stroke') {
                    const exists = (layer.strokes || []).some((s) => s.id === item.id);
                    wallDrawSelected = exists ? item : null;
                } else {
                    wallDrawSelected = null;
                }
            } else {
                wallDrawSelected = null;
            }
            if (item) {
                wallDrawSelectedGroup = null;
            } else {
                wallDrawSelectedGroup = null;
            }
            redrawWallSelection();
        }

        function deleteWallDrawItem(wallId, itemType, itemId, fromLocal = false) {
            if (!wallId || !itemType || !itemId) return;
            const layer = wallDrawLayers.get(String(wallId));
            if (!layer) return;
            if (itemType === 'text') {
                if (wallTextEditing && wallTextEditing.wallId === wallId && wallTextEditing.textId === itemId) {
                    wallTextEditing = null;
                    if (wallTextEditorObject) {
                        wallTextEditorObject.visible = false;
                    }
                }
                if (wallTextSyncTimer) {
                    clearTimeout(wallTextSyncTimer);
                    wallTextSyncTimer = null;
                }
                layer.texts = layer.texts.filter((t) => t.id !== itemId);
                redrawWallTexts(layer);
            } else if (itemType === 'stroke') {
                layer.strokes = (layer.strokes || []).filter((s) => s.id !== itemId);
                redrawWallStrokes(layer);
            }
            if (wallDrawSelected && wallDrawSelected.wallId === wallId && wallDrawSelected.id === itemId) {
                wallDrawSelected = null;
            }
            if (wallDrawSelectedGroup?.items?.length && wallDrawSelectedGroup.wallId === wallId) {
                wallDrawSelectedGroup.items = wallDrawSelectedGroup.items.filter((item) => item.id !== itemId);
                if (!wallDrawSelectedGroup.items.length) {
                    wallDrawSelectedGroup = null;
                } else {
                    wallDrawSelectedGroup.items = wallDrawSelectedGroup.items.map((item) => {
                        if (item.type === 'text') {
                            const entry = layer.texts?.find((t) => t.id === item.id);
                            if (!entry?.bbox) return null;
                            return { ...item, bounds: { ...entry.bbox } };
                        }
                        if (item.type === 'stroke') {
                            const stroke = layer.strokes?.find((s) => s.id === item.id);
                            if (!stroke) return null;
                            const bounds = getStrokeBounds(stroke);
                            if (!bounds) return null;
                            return { ...item, bounds };
                        }
                        return null;
                    }).filter(Boolean);
                    if (!wallDrawSelectedGroup.items.length) {
                        wallDrawSelectedGroup = null;
                    } else {
                        wallDrawSelectedGroup.bounds = getGroupBounds(wallDrawSelectedGroup.items);
                        if (!wallDrawSelectedGroup.bounds) {
                            wallDrawSelectedGroup = null;
                        }
                    }
                }
            }
            redrawWallSelection();
            if (fromLocal) {
                sendRealtime({
                    type: 'wall_draw',
                    action: 'delete',
                    wallId,
                    itemType,
                    itemId,
                    clientId: getLocalClientId()
                });
                if (itemType === 'text') {
                    sendRealtime({
                        type: 'wall_draw',
                        action: 'text',
                        wallId,
                        textId: itemId,
                        text: '',
                        clientId: getLocalClientId()
                    });
                }
            }
        }

        function deleteSelectedWallDraw() {
            if (wallDrawSelectedGroup?.items?.length) {
                const items = wallDrawSelectedGroup.items.slice();
                wallDrawSelectedGroup = null;
                items.forEach((item) => {
                    deleteWallDrawItem(item.wallId, item.type, item.id, true);
                });
                redrawWallSelection();
                return;
            }
            if (!wallDrawSelected) return;
            deleteWallDrawItem(wallDrawSelected.wallId, wallDrawSelected.type, wallDrawSelected.id, true);
            wallDrawSelected = null;
            redrawWallSelection();
        }

        function redrawWallSelection() {
            wallDrawLayers.forEach((layer) => {
                if (!layer.selectCtx) return;
                layer.selectCtx.clearRect(0, 0, layer.selectCanvas.width, layer.selectCanvas.height);
                layer.selectTexture.needsUpdate = true;
            });
            if (wallSelectDrag.active && wallSelectDrag.wallId) {
                const dragLayer = wallDrawLayers.get(wallSelectDrag.wallId);
                if (dragLayer?.selectCtx) {
                    const rect = normalizeWallRect(
                        wallSelectDrag.startX,
                        wallSelectDrag.startY,
                        wallSelectDrag.endX,
                        wallSelectDrag.endY
                    );
                    const ctx = dragLayer.selectCtx;
                    ctx.save();
                    ctx.strokeStyle = 'rgba(245, 158, 11, 0.9)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);
                    ctx.fillStyle = 'rgba(245, 158, 11, 0.12)';
                    ctx.fillRect(rect.minX, rect.minY, rect.maxX - rect.minX, rect.maxY - rect.minY);
                    ctx.strokeRect(rect.minX, rect.minY, rect.maxX - rect.minX, rect.maxY - rect.minY);
                    ctx.restore();
                    dragLayer.selectTexture.needsUpdate = true;
                }
            }
            if (wallDrawSelectedGroup?.items?.length) {
                const layer = wallDrawLayers.get(wallDrawSelectedGroup.wallId);
                if (!layer) {
                    wallDrawSelectedGroup = null;
                } else {
                    const filtered = wallDrawSelectedGroup.items.map((item) => {
                        if (item.type === 'text') {
                            const entry = layer.texts?.find((t) => t.id === item.id);
                            if (!entry?.bbox) return null;
                            return { ...item, bounds: { ...entry.bbox } };
                        }
                        if (item.type === 'stroke') {
                            const stroke = layer.strokes?.find((s) => s.id === item.id);
                            if (!stroke) return null;
                            const bounds = getStrokeBounds(stroke);
                            if (!bounds) return null;
                            return { ...item, bounds };
                        }
                        return null;
                    }).filter(Boolean);
                    if (!filtered.length) {
                        wallDrawSelectedGroup = null;
                    } else {
                        wallDrawSelectedGroup.items = filtered;
                        wallDrawSelectedGroup.bounds = getGroupBounds(filtered);
                        if (!wallDrawSelectedGroup.bounds) {
                            wallDrawSelectedGroup = null;
                        } else if (layer.selectCtx) {
                            const bounds = wallDrawSelectedGroup.bounds;
                            const ctx = layer.selectCtx;
                            ctx.save();
                            ctx.strokeStyle = 'rgba(245, 158, 11, 0.85)';
                            ctx.lineWidth = 3;
                            ctx.setLineDash([10, 6]);
                            ctx.strokeRect(
                                bounds.minX,
                                bounds.minY,
                                bounds.maxX - bounds.minX,
                                bounds.maxY - bounds.minY
                            );
                            ctx.restore();
                            layer.selectTexture.needsUpdate = true;
                        }
                    }
                }
                return;
            }
            if (!wallDrawSelected && wallTextEditing) {
                const layer = wallDrawLayers.get(wallTextEditing.wallId);
                const entry = layer?.texts?.find((t) => t.id === wallTextEditing.textId);
                if (entry?.bbox && layer?.selectCtx) {
                    const ctx = layer.selectCtx;
                    const pad = 8;
                    ctx.save();
                    ctx.strokeStyle = 'rgba(245, 158, 11, 0.9)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([8, 6]);
                    ctx.strokeRect(
                        entry.bbox.minX - pad,
                        entry.bbox.minY - pad,
                        (entry.bbox.maxX - entry.bbox.minX) + pad * 2,
                        (entry.bbox.maxY - entry.bbox.minY) + pad * 2
                    );
                    ctx.restore();
                    layer.selectTexture.needsUpdate = true;
                }
                return;
            }
            if (!wallDrawSelected) return;
            const layer = wallDrawLayers.get(wallDrawSelected.wallId);
            if (!layer?.selectCtx) return;
            const ctx = layer.selectCtx;
            ctx.save();
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.9)';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            if (wallDrawSelected.type === 'text') {
                const entry = layer.texts.find((t) => t.id === wallDrawSelected.id);
                if (!entry?.bbox) {
                    wallDrawSelected = null;
                    ctx.restore();
                    return;
                }
                const pad = 8;
                ctx.strokeRect(
                    entry.bbox.minX - pad,
                    entry.bbox.minY - pad,
                    (entry.bbox.maxX - entry.bbox.minX) + pad * 2,
                    (entry.bbox.maxY - entry.bbox.minY) + pad * 2
                );
            } else if (wallDrawSelected.type === 'stroke') {
                const stroke = layer.strokes.find((s) => s.id === wallDrawSelected.id);
                if (!stroke) {
                    wallDrawSelected = null;
                    ctx.restore();
                    return;
                }
                const bounds = getStrokeBounds(stroke);
                if (!bounds) {
                    wallDrawSelected = null;
                    ctx.restore();
                    return;
                }
                ctx.strokeRect(bounds.minX, bounds.minY, bounds.maxX - bounds.minX, bounds.maxY - bounds.minY);
            }
            ctx.restore();
            layer.selectTexture.needsUpdate = true;
        }

        function applyWallDrawEvent(data) {
            if (!data || !data.action) return;
            ensureWallDrawLayers();
            if (data.action === 'stroke') {
                applyWallDrawStrokeEvent(data);
                return;
            }
            if (data.action === 'text') {
                applyWallDrawTextEvent(data);
                return;
            }
            if (data.action === 'delete' && data.wallId) {
                deleteWallDrawItem(data.wallId, data.itemType, data.itemId);
                return;
            }
            if (data.action === 'clear' && data.wallId) {
                clearWallDrawing(String(data.wallId));
                return;
            }
            if (data.action === 'clear_all') {
                clearAllWallDrawings();
            }
        }

        function applyWallDrawState(payload) {
            if (!payload) return;
            if (!wallSurfaces.length) {
                wallDrawPendingState = payload;
                return;
            }
            ensureWallDrawLayers();
            clearAllWallDrawings();
            const strokes = payload.strokes || {};
            Object.keys(strokes).forEach((wallId) => {
                const list = Array.isArray(strokes[wallId]) ? strokes[wallId] : [];
                list.forEach((evt) => {
                    if (evt?.tool === 'eraser') return;
                    applyWallDrawStrokeEvent({ ...evt, wallId });
                });
            });
            const texts = payload.texts || {};
            Object.keys(texts).forEach((wallId) => {
                const list = Array.isArray(texts[wallId]) ? texts[wallId] : [];
                const layer = wallDrawLayers.get(wallId);
                if (!layer) return;
                layer.texts = list.map((entry) => ({
                    id: String(entry.id || entry.textId || `${Math.random()}`),
                    x: Number(entry.x) || 0,
                    y: Number(entry.y) || 0,
                    text: String(entry.text || ''),
                    size: Number(entry.size) || getWallTextSize(),
                    color: entry.color || wallDrawColor
                }));
                redrawWallTexts(layer);
            });
            redrawWallSelection();
        }

        function getWallTextSize() {
            return Math.max(12, wallDrawSize * 3);
        }

        function measureWallTextPx(text, size) {
            const fontSize = Number(size) || getWallTextSize();
            const lineHeight = fontSize * 1.2;
            const lines = String(text || '').split('\n');
            if (!wallTextMeasureCtx) {
                return {
                    width: Math.max(140, fontSize * 2),
                    height: Math.max(24, lineHeight * Math.max(1, lines.length))
                };
            }
            wallTextMeasureCtx.font = `600 ${fontSize}px Comfortaa, sans-serif`;
            let maxWidth = 0;
            lines.forEach((line) => {
                const metrics = wallTextMeasureCtx.measureText(line || ' ');
                maxWidth = Math.max(maxWidth, metrics.width);
            });
            const width = Math.max(140, Math.ceil(maxWidth + 16));
            const height = Math.max(24, Math.ceil(lineHeight * Math.max(1, lines.length) + 8));
            return { width, height };
        }

        function updateWallTextEditorSize(text, size, color) {
            if (!wallTextEditorEl || !wallTextInputEl || !wallTextEditorObject) return;
            const fontSize = Number(size) || getWallTextSize();
            const { width, height } = measureWallTextPx(text, fontSize);
            wallTextEditorEl.style.width = `${width}px`;
            wallTextEditorEl.style.height = `${height}px`;
            wallTextInputEl.style.width = `${width}px`;
            wallTextInputEl.style.height = `${height}px`;
            wallTextInputEl.style.fontSize = `${fontSize}px`;
            if (color) {
                wallTextInputEl.style.color = color;
            }
            const scale = WALL_TEXT_INPUT_WORLD.w / WALL_TEXT_INPUT_PX.w;
            wallTextEditorObject.scale.set(scale, scale, 1);
        }

        function redrawWallTexts(layer) {
            if (!layer?.textCtx) return;
            const ctx = layer.textCtx;
            ctx.clearRect(0, 0, layer.textCanvas.width, layer.textCanvas.height);
            const editingId = wallTextEditing && wallTextEditing.wallId === layer.wallId ? wallTextEditing.textId : null;
            layer.texts = (layer.texts || []).filter((entry) => {
                if (editingId && entry.id === editingId) return true;
                return String(entry.text || '').trim();
            });
            let clearedSelection = false;
            if (wallDrawSelected && wallDrawSelected.type === 'text' && wallDrawSelected.wallId === layer.wallId) {
                const stillExists = layer.texts.some((t) => t.id === wallDrawSelected.id);
                if (!stillExists) {
                    wallDrawSelected = null;
                    clearedSelection = true;
                }
            }
            layer.texts.forEach((entry) => {
                const rawText = String(entry.text || '');
                const text = rawText.trim();
                const size = Number(entry.size) || getWallTextSize();
                const isEditing = Boolean(
                    wallTextEditing
                    && wallTextEditing.wallId === layer.wallId
                    && wallTextEditing.textId === entry.id
                );
                const lines = rawText.split('\n');
                const lineHeight = size * 1.2;
                ctx.save();
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = entry.color || wallDrawColor;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `600 ${size}px Comfortaa, sans-serif`;
                let maxWidth = 0;
                lines.forEach((line) => {
                    const width = ctx.measureText(line || ' ').width;
                    maxWidth = Math.max(maxWidth, width);
                });
                const totalHeight = lineHeight * Math.max(1, lines.length);
                entry.bbox = {
                    minX: entry.x - maxWidth / 2,
                    maxX: entry.x + maxWidth / 2,
                    minY: entry.y - totalHeight / 2,
                    maxY: entry.y + totalHeight / 2
                };
                if (!isEditing) {
                    const startY = entry.y - (totalHeight / 2) + lineHeight / 2;
                    lines.forEach((line, idx) => {
                        const y = startY + idx * lineHeight;
                        ctx.fillText(line, entry.x, y);
                    });
                }
                ctx.restore();
            });
            layer.textTexture.needsUpdate = true;
            if (clearedSelection) {
                redrawWallSelection();
            }
        }

        function findWallTextAtHit(layer, hit) {
