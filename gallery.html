<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Киносреда — Галерея</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='20' y='30' width='45' height='55' rx='5' fill='none' stroke='%23b45309' stroke-width='4'/%3E%3Crect x='22' y='45' width='41' height='38' rx='3' fill='%23f59e0b'/%3E%3Cellipse cx='42' cy='35' rx='24' ry='8' fill='%23fff'/%3E%3Ccircle cx='30' cy='33' r='5' fill='%23fff'/%3E%3Ccircle cx='45' cy='31' r='4' fill='%23fff'/%3E%3Ccircle cx='55' cy='34' r='4' fill='%23fff'/%3E%3Cpath d='M65 38 Q85 38 85 55 Q85 72 65 72' fill='none' stroke='%23b45309' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        (function(){
            const html = document.documentElement;
            const KEY = 'logoFontFamily';
            const DEFAULT = 'Rubik Wet Paint';
            const LINK_ID = 'logoFontGF';

            function familyToHref(fam){
                const q = encodeURIComponent(fam).replace(/%20/g, '+');
                return `https://fonts.googleapis.com/css2?family=${q}&display=swap`;
            }

            function ensureStylesheet(fam){
                const family = (fam || DEFAULT).trim();
                if (!family) return;
                const href = familyToHref(family);
                let link = document.getElementById(LINK_ID);
                if (!link) {
                    link = document.createElement('link');
                    link.id = LINK_ID;
                    link.rel = 'stylesheet';
                    document.head.appendChild(link);
                }
                if (link.getAttribute('href') !== href) link.setAttribute('href', href);
            }

            function markReady(){
                html.classList.add('logo-font-ready');
                html.classList.remove('logo-font-loading');
            }

            function waitForFont(fam){
                const family = (fam || DEFAULT).trim();
                if (!family) return markReady();
                ensureStylesheet(family);
                html.classList.add('logo-font-loading');
                html.classList.remove('logo-font-ready');
                try {
                    if (document.fonts && document.fonts.load) {
                        document.fonts.load(`1em "${family}"`).then(markReady, markReady);
                    } else {
                        setTimeout(markReady, 1);
                    }
                } catch (_) {
                    markReady();
                }
            }

            try {
                const fam = localStorage.getItem(KEY) || DEFAULT;
                html.style.setProperty('--logo-font', `'${fam}'`);
                window.__loadLogoFont = waitForFont;
                waitForFont(fam);
            } catch(_) {
                window.__loadLogoFont = waitForFont;
                markReady();
            }
        })();
    </script>
    <style>
        html:not(.logo-font-ready) .logo-text { opacity: 0; }

            --bg-1: #0b0f16;
            --bg-2: #141a26;
            --bg-3: #1b2233;

        .tools-panel {

        .wall-image-toolbar .label-toggle {
            display: inline-flex;

        }
        .wall-image-toolbar .label-toggle input[type="text"] {

            border: 1px solid rgba(255, 255, 255, 0.18);

        }
        .wall-image-toolbar .label-toggle input[type="text"]:focus {

        .wall-image-toolbar .label-toggle {
            display: inline-flex;

        }
    </style>
</head>
<body>
    <div id="scene" aria-label="3D пространство"></div>

    <header class="header-shell">
        <div class="header-inner header-actions">
            <div class="logo-block">
                <a href="index.html" aria-label="Киносреда">
                    <svg class="logo-svg" width="300" height="72" viewBox="0 0 580 120" style="overflow: visible;">
                        <defs>
                    <linearGradient id="beerGradShelf" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#fcd34d"/>
                        <stop offset="50%" style="stop-color:#fbbf24"/>
                        <stop offset="100%" style="stop-color:#d97706"/>
                    </linearGradient>
                    <linearGradient id="foamGradShelf" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ffffff"/>
                        <stop offset="100%" style="stop-color:#fef3c7"/>
                    </linearGradient>
                            <clipPath id="mugClipShelf">
                                <rect x="0" y="0" width="50" height="55" rx="3"/>
                            </clipPath>
                            <filter id="glowShelf">
                                <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <text id="logoText" x="28" y="78" text-anchor="start" class="logo-text" fill="#f59e0b" font-size="62" textLength="395" lengthAdjust="spacingAndGlyphs" filter="url(#glowShelf)">КИНОСРЕДА</text>
                        <g id="logoMug" transform="translate(438, 2)" style="cursor: pointer;" onclick="event.preventDefault(); event.stopPropagation(); location.assign('roulette.html');">
                            <rect x="0" y="25" width="50" height="60" rx="5" fill="none" stroke="#b45309" stroke-width="3"/>
                        <g clip-path="url(#mugClipShelf)" transform="translate(0, 30)">
                            <rect x="0" y="55" height="0" width="50" fill="url(#beerGradShelf)">
                                <animate attributeName="height" from="0" to="55" dur="2.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
                                <animate attributeName="y" from="55" to="0" dur="2.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
                            </rect>
                        </g>
                        <rect x="6" y="30" width="6" height="50" rx="3" fill="rgba(255,255,255,0.3)" opacity="0.5"/>
                        <g opacity="0">
                            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>
                            <ellipse cx="25" cy="27" rx="27" ry="10" fill="url(#foamGradShelf)"/>
                            <circle cx="12" cy="24" r="6" fill="white" opacity="0.95"/>
                            <circle cx="28" cy="22" r="5" fill="white" opacity="0.9"/>
                            <circle cx="40" cy="25" r="5" fill="white" opacity="0.9"/>
                        </g>
                        <path d="M50 32 Q72 32 72 55 Q72 78 50 78" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
                        <g opacity="0">
                            <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1s" fill="freeze"/>
                            <circle cx="15" cy="55" r="2.5" fill="#fef3c7" opacity="0.6"/>
                            <circle cx="28" cy="65" r="2" fill="#fef3c7" opacity="0.5"/>
                            <circle cx="38" cy="58" r="1.5" fill="#fef3c7" opacity="0.6"/>
                        </g>
                    </g>
                    </svg>
                </a>
            </div>

        async function cropTransparentEdges(dataUrl) {
            if (!dataUrl || !dataUrl.startsWith('data:image')) return dataUrl;
            const img = await loadImage(dataUrl);
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            const ctx = canvas.getContext('2d');
            if (!ctx) return dataUrl;
            ctx.drawImage(img, 0, 0);
            const { data, width, height } = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let minX = width, maxX = -1;
            let minY = height, maxY = -1;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4 + 3;
                    if (data[idx] > 8) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }
            if (maxX < 0 || maxY < 0) return dataUrl;
            const cropW = Math.max(1, maxX - minX + 1);
            const cropH = Math.max(1, maxY - minY + 1);
            const out = document.createElement('canvas');
            out.width = cropW;
            out.height = cropH;
            const outCtx = out.getContext('2d');
            if (!outCtx) return dataUrl;
            outCtx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
            return out.toDataURL('image/png');
        }

        async function normalizeImageToBox(dataUrl, boxW = 90, boxH = 170, scaleFactor = IMAGE_OUTPUT_SCALE) {
            const cropped = await cropTransparentEdges(dataUrl);
            const img = await loadImage(cropped);
            const srcW = img.naturalWidth || img.width;
            const srcH = img.naturalHeight || img.height;
            if (!srcW || !srcH) return dataUrl;
            const targetW = Math.max(1, Math.round(boxW * scaleFactor));
            const targetH = Math.max(1, Math.round(boxH * scaleFactor));
            const scale = targetH / srcH;
            const scaledW = srcW * scale;
            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            if (!ctx) return dataUrl;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.clearRect(0, 0, targetW, targetH);
            const drawW = scaledW;
            const drawH = targetH;
            const dx = (targetW - drawW) / 2;
            ctx.drawImage(img, 0, 0, srcW, srcH, dx, 0, drawW, drawH);
            return canvas.toDataURL('image/png');
        }

            const response = await fetch(LOCAL_IMAGE_PROXY_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })

            if (!response.ok) throw new Error('image_proxy_failed');
            const data = await response.json();
            const base64 = data?.image_base64 || data?.result_base64;
            if (!base64) throw new Error('image_proxy_failed');
            return `data:image/png;base64,${base64}`;
        }

        async function loadImageAsDataUrl(url) {
            if (!url) throw new Error('image_url_missing');
            if (/^data:/i.test(url)) return url;
            const resolved = new URL(url, location.href).href;
            const isCrossOrigin = (() => {
                try {
                    return new URL(resolved).origin !== location.origin;
                } catch (_) {
                    return false;
                }
            })();
            const canUseLocal = location.protocol === 'http:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            const localProxyIsLocal = isLocalEndpoint(LOCAL_IMAGE_PROXY_ENDPOINT);
            if (isCrossOrigin) {
                if (LOCAL_IMAGE_PROXY_ENDPOINT && (canUseLocal || !localProxyIsLocal)) {
                    return fetchImageViaLocalProxy(resolved);
                }
                throw new Error('image_fetch_blocked');
            }
            try {
                const response = await fetch(resolved);
                if (!response.ok) throw new Error('image_fetch_failed');
                const blob = await response.blob();
                return blobToDataUrl(blob);
            } catch (err) {
                if (LOCAL_IMAGE_PROXY_ENDPOINT && (canUseLocal || !localProxyIsLocal)) {
                    return fetchImageViaLocalProxy(resolved);
                }
                throw err;
            }
        }

            const data = await response.json();

            const base64 = dataUrlToBase64(dataUrl);
            const endpoints = [];
            const canUseLocal = location.protocol === 'http:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            const localBgIsLocal = isLocalEndpoint(LOCAL_BG_ENDPOINT);
            if (LOCAL_BG_ENDPOINT && (canUseLocal || !localBgIsLocal)) {
                endpoints.push({ url: LOCAL_BG_ENDPOINT, key: '' });
            }
            if (REMOVE_BG_PROXY_URL) endpoints.push({ url: REMOVE_BG_PROXY_URL, key: '' });
            for (const item of endpoints) {
                try {
                    if (!item.url) continue;
                    return await removeBackgroundWithEndpoint(item.url, item.key, base64);
                } catch (_) {}
            }
            throw new Error('removebg_failed');
        }

        function createStoneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#7a7f86';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 1400; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const w = 20 + Math.random() * 60;
                const h = 12 + Math.random() * 40;
                ctx.fillStyle = `rgba(40, 40, 40, ${Math.random() * 0.12 + 0.08})`;
                ctx.fillRect(x, y, w, h);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(8, 8);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function loadRepeatTexture(url, repeatX, repeatY) {

            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearMipMapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            return texture;
        }

        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#6b4a2f');
            gradient.addColorStop(1, '#4f3622');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 800; i++) {
                ctx.strokeStyle = `rgba(30, 20, 10, ${Math.random() * 0.2})`;
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.stroke();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(6, 3);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function buildMeshColliders(root) {
            const colliders = [];
            if (!root) return colliders;
            root.updateMatrixWorld(true);
            root.traverse((obj) => {
                if (!obj.isMesh || !obj.geometry) return;
                if (!obj.geometry.boundingBox) {
                    obj.geometry.computeBoundingBox();
                }
                if (!obj.geometry.boundingBox) return;
                const box = obj.geometry.boundingBox.clone();
                box.applyMatrix4(obj.matrixWorld);
                colliders.push(box);
            });
            return colliders;
        }

        function buildSofaColliders(sofa) {
            return buildMeshColliders(sofa);
        }

        function buildPoopCollisionSpheres(poop) {
            if (!poop?.userData?.poopSegments) return [];
            const scale = poop.scale.x || 1;
            const pos = poop.position.clone();
            return poop.userData.poopSegments.map((seg) => {
                const local = new THREE.Vector3(seg.x, seg.y + seg.h / 2, seg.z);
                local.multiplyScalar(scale);
                const center = local.add(pos);
                return {
                    center,
                    radius: seg.r * scale * 0.95
                };
            });
        }

        function createLadderModel(height) {
            const group = new THREE.Group();
            const width = 1.4;
            const depth = 2.2;
            const steps = Math.max(6, Math.floor(height / 0.6));
            const platformThickness = 0.08;
            const railMat = new THREE.MeshStandardMaterial({ color: 0x8b5e34, roughness: 0.65, metalness: 0.05 });
            const stepMat = new THREE.MeshStandardMaterial({ color: 0xb38b5c, roughness: 0.7, metalness: 0.05 });

            const railLength = Math.hypot(height, depth);
            const railGeo = new THREE.BoxGeometry(0.08, railLength, 0.08);
            const railAngle = Math.atan2(depth, height);
            const railY = height / 2;
            const railZ = depth / 2;
            const leftRail = new THREE.Mesh(railGeo, railMat);
            leftRail.position.set(-width / 2, railY, railZ);
            leftRail.rotation.x = railAngle;
            leftRail.userData.ladderCollide = true;
            const rightRail = leftRail.clone();
            rightRail.position.x = width / 2;
            rightRail.userData.ladderCollide = true;
            group.add(leftRail, rightRail);

            const topRailGeo = new THREE.BoxGeometry(width + 0.12, 0.08, 0.08);
            const topRail = new THREE.Mesh(topRailGeo, railMat);
            topRail.position.set(0, height + 0.08, depth);
            topRail.userData.ladderCollide = true;
            group.add(topRail);

            const stepDepth = depth / steps * 0.8;
            const stepGeo = new THREE.BoxGeometry(width * 0.98, 0.06, stepDepth);
            for (let i = 0; i < steps; i += 1) {
                const t = (i + 1) / steps;
                const step = new THREE.Mesh(stepGeo, stepMat);
                step.position.set(0, t * height, t * depth - stepDepth * 0.3);
                group.add(step);
            }

            const railConnectorGeo = new THREE.BoxGeometry(width * 0.98, 0.05, 0.05);
            for (let i = 0; i < steps; i += 1) {
                const t = (i + 0.5) / steps;
                const connector = new THREE.Mesh(railConnectorGeo, railMat);
                connector.position.set(0, t * height, t * depth - stepDepth * 0.45);
                group.add(connector);
            }

            const baseGeo = new THREE.BoxGeometry(width * 0.95, 0.08, depth * 0.18);
            const base = new THREE.Mesh(baseGeo, stepMat);
            base.position.set(0, 0.04, 0.05);
            group.add(base);

            const platformDepth = Math.min(1.6, depth * 0.64);
            const platformOffset = 0.02;
            const platformGeo = new THREE.BoxGeometry(width * 0.95, platformThickness, platformDepth);
            const platform = new THREE.Mesh(platformGeo, stepMat);
            platform.position.set(0, height + platformThickness / 2, depth + platformDepth / 2 + platformOffset);
            platform.userData.ladderCollide = true;
            group.add(platform);

            const platformConnectorGeo = new THREE.BoxGeometry(width * 0.9, 0.06, 0.08);
            const platformConnector = new THREE.Mesh(platformConnectorGeo, railMat);
            platformConnector.position.set(0, height + 0.08, depth + platformOffset);
            platformConnector.userData.ladderCollide = true;
            group.add(platformConnector);

            group.userData.width = width;
            group.userData.depth = depth;
            group.userData.height = height;
            group.userData.platformDepth = platformDepth;
            group.userData.platformThickness = platformThickness;
            group.userData.platformOffset = platformOffset;
            return group;
        }

        function buildLadderColliders(ladder) {
            const colliders = [];
            if (!ladder) return colliders;
            ladder.updateMatrixWorld(true);
            ladder.traverse((obj) => {
                if (!obj.isMesh || !obj.geometry || !obj.userData?.ladderCollide) return;
                if (!obj.geometry.boundingBox) {
                    obj.geometry.computeBoundingBox();
                }
                if (!obj.geometry.boundingBox) return;
                const box = obj.geometry.boundingBox.clone();
                box.applyMatrix4(obj.matrixWorld);
                colliders.push(box);
            });
            return colliders;
        }

        function buildLadderData(position, rotationY, width, depth, height, platformDepth, platformThickness) {
            const axis = new THREE.Vector3(0, 1, 0);
            const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(axis, rotationY);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(axis, rotationY);
            const platform = Number.isFinite(platformDepth) ? platformDepth : 0.6;
            const topOffset = Number.isFinite(platformThickness) ? platformThickness : 0.08;
            return {
                position: position.clone(),
                forward,
                right,
                width,
                depth,
                height,
                platformDepth: platform,
                platformTopOffset: topOffset,
                platformStart: depth,
                platformEnd: depth + platform + 0.2
            };
        }

        function getLadderGroundHeightFor(data, x, z, yBottom) {
            if (!data) return null;
            const dx = x - data.position.x;
            const dz = z - data.position.z;
            const localZ = dx * data.forward.x + dz * data.forward.z;
            const localX = dx * data.right.x + dz * data.right.z;
            if (localZ < -0.2 || localZ > data.platformEnd + 0.15) return null;
            const entryLimit = Math.max(0.35, data.depth * 0.3);
            if (yBottom <= 0.06 && localZ > entryLimit) return null;
            const halfW = data.width / 2 + playerRadius * 0.35;
            if (Math.abs(localX) > halfW) return null;
            const rampDepth = Math.max(0.2, data.depth);
            if (localZ >= data.platformStart) {
                return data.height + (data.platformTopOffset || 0) + eyeHeight;
            }
            const progress = Math.max(0, Math.min(1, localZ / rampDepth));
            const topOffset = data.platformTopOffset || 0;
            return data.height * progress + topOffset * progress + eyeHeight;
        }

        function getCombinedLadderGroundHeight(x, z, yBottom) {
            let ground = getLadderGroundHeightFor(ladderData, x, z, yBottom);
            remoteLadders.forEach((entry) => {
                const candidate = getLadderGroundHeightFor(entry?.data, x, z, yBottom);
                if (Number.isFinite(candidate)) {
                    ground = Number.isFinite(ground) ? Math.max(ground, candidate) : candidate;
                }
            });
            return ground;
        }

        function ladderRailCollides(data, x, z, yBottom, yTop) {
            if (!data) return false;
            const dx = x - data.position.x;
            const dz = z - data.position.z;
            const localZ = dx * data.forward.x + dz * data.forward.z;
            const localX = dx * data.right.x + dz * data.right.z;
            const depthPad = 0.2;
            if (localZ <= -depthPad || localZ >= data.depth + depthPad) return false;
            const railThickness = 0.1;
            const innerWidth = data.width / 2 - railThickness;
            const outerWidth = data.width / 2 + railThickness;
            if (Math.abs(localX) <= innerWidth || Math.abs(localX) >= outerWidth) return false;
            const top = data.height + eyeHeight;
            return yBottom <= top;
        }

        function ladderBackCollides(data, x, z, yBottom, yTop) {
            if (!data) return false;
            const dx = x - data.position.x;
            const dz = z - data.position.z;
            const localZ = dx * data.forward.x + dz * data.forward.z;
            const localX = dx * data.right.x + dz * data.right.z;
            const backThickness = Math.max(0.35, playerRadius * 0.6);
            if (yBottom > 0.12) return false;
            if (localZ < data.depth - backThickness || localZ > data.depth + backThickness) return false;
            const halfW = data.width / 2 + playerRadius * 0.3;
            if (Math.abs(localX) > halfW) return false;
            const top = data.height + eyeHeight;
            return yBottom <= top;
        }

        function removeLadder() {
            if (ladderGroup && ladderGroup.parent) ladderGroup.parent.remove(ladderGroup);
            ladderGroup = null;
            ladderData = null;
            ladderColliders = [];
        }

        function broadcastLadderState() {
            if (!wsConnected) return;
            const id = getLocalClientId();
            if (!ladderGroup || !ladderData) {
                sendRealtime({ type: 'ladder', id, action: 'remove' });
                return;
            }
            sendRealtime({
                type: 'ladder',
                id,
                action: 'add',
                position: {
                    x: ladderGroup.position.x,
                    y: ladderGroup.position.y,
                    z: ladderGroup.position.z
                },
                rotationY: ladderGroup.rotation.y,
                height: ladderData.height,
                width: ladderData.width,
                depth: ladderData.depth,
                platformDepth: ladderData.platformDepth
            });
        }

        function upsertRemoteLadder(payload) {
            if (!payload || !payload.id) return;
            const localId = getLocalClientId();
            if (payload.id === localId) return;
            if (payload.action === 'remove') {
                removeRemoteLadder(payload.id);
                return;
            }
            const height = Number(payload.height) || room.height * 0.5;
            let entry = remoteLadders.get(payload.id);
            let ladder = entry?.group;
            if (!ladder || Math.abs((ladder.userData.height || 0) - height) > 0.01) {
                if (ladder && ladder.parent) ladder.parent.remove(ladder);
                ladder = createLadderModel(height);
                scene.add(ladder);
            }
            const pos = payload.position || {};
            const position = new THREE.Vector3(Number(pos.x) || 0, Number(pos.y) || 0, Number(pos.z) || 0);
            const rotationY = Number.isFinite(payload.rotationY) ? payload.rotationY : 0;
            ladder.position.copy(position);
            ladder.rotation.y = rotationY;
            const width = Number(payload.width) || ladder.userData.width || 1.4;
            const depth = Number(payload.depth) || ladder.userData.depth || 2.2;
            const platformDepth = Number(payload.platformDepth) || ladder.userData.platformDepth || 0.6;
            const platformThickness = ladder.userData.platformThickness || 0.08;
            const data = buildLadderData(position, rotationY, width, depth, height, platformDepth, platformThickness);
            remoteLadders.set(payload.id, { group: ladder, data });
        }

        function removeRemoteLadder(id) {
            const entry = remoteLadders.get(id);
            if (!entry) return;
            if (entry.group?.parent) entry.group.parent.remove(entry.group);
            remoteLadders.delete(id);
        }

        function toggleLadder() {
            if (ladderGroup) {
                removeLadder();
                broadcastLadderState();
                return;
            }
            if (!yawObject) return;
            if (!isGrounded || Math.abs(yawObject.position.y - eyeHeight) > 0.12) return;
            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yawObject.rotation.y);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yawObject.rotation.y);
            const height = room.height * 0.5;
            const tempLadder = createLadderModel(height);
            const width = tempLadder.userData.width || 1.4;
            const depth = tempLadder.userData.depth || 2.2;
            const base = yawObject.position.clone().addScaledVector(forward, 1.4);
            base.y = 0;

            const halfW = room.width / 2 - 2;
            const halfD = room.depth / 2 - 2;
            const halfDepth = depth / 2;
            const halfWidth = width / 2;
            const center = base.clone().addScaledVector(forward, halfDepth);
            const extentX = Math.abs(forward.x) * halfDepth + Math.abs(right.x) * halfWidth;
            const extentZ = Math.abs(forward.z) * halfDepth + Math.abs(right.z) * halfWidth;
            center.x = Math.max(-halfW + extentX, Math.min(halfW - extentX, center.x));
            center.z = Math.max(-halfD + extentZ, Math.min(halfD - extentZ, center.z));
            base.copy(center.addScaledVector(forward, -halfDepth));

            ladderGroup = tempLadder;
            ladderGroup.position.set(base.x, 0, base.z);
            ladderGroup.rotation.y = yawObject.rotation.y + Math.PI;
            scene.add(ladderGroup);
            ladderColliders = buildLadderColliders(ladderGroup);
            ladderData = buildLadderData(
                new THREE.Vector3(base.x, 0, base.z),
                ladderGroup.rotation.y,
                width,
                depth,
                height,
                tempLadder.userData.platformDepth || 0.6,
                tempLadder.userData.platformThickness || 0.08
            );
            broadcastLadderState();
        }

        function getLadderGroundHeight(x, z, yBottom) {
            return getLadderGroundHeightFor(ladderData, x, z, yBottom);
        }

        function collidesWithSofa(x, z, yBottom, yTop) {
            if (sofaColliders.length) {
                for (const box of sofaColliders) {
                    if (yBottom >= box.max.y - 0.05) continue;
                    if (yTop < box.min.y || yBottom > box.max.y) continue;
                    const clampedX = Math.max(box.min.x, Math.min(box.max.x, x));
                    const clampedZ = Math.max(box.min.z, Math.min(box.max.z, z));
                    const dx = x - clampedX;
                    const dz = z - clampedZ;
                    if ((dx * dx + dz * dz) <= playerRadius * playerRadius) return true;
                }
            }
            if (ladderRailCollides(ladderData, x, z, yBottom, yTop)) return true;
            if (ladderBackCollides(ladderData, x, z, yBottom, yTop)) return true;
            for (const entry of remoteLadders.values()) {
                if (ladderRailCollides(entry?.data, x, z, yBottom, yTop)) return true;
                if (ladderBackCollides(entry?.data, x, z, yBottom, yTop)) return true;
            }
            if (poopCollisionSpheres.length) {
                for (const sphere of poopCollisionSpheres) {
                    const top = sphere.center.y + sphere.radius;
                    const bottom = sphere.center.y - sphere.radius;
                    if (yTop < bottom || yBottom > top) continue;
                    const dx = x - sphere.center.x;
                    const dz = z - sphere.center.z;
                    const dist = Math.hypot(dx, dz);
                    if (dist <= playerRadius + sphere.radius) return true;
                }
            }
            return false;
        }

        function getSofaGroundHeight(x, z, yBottom) {
            let ground = eyeHeight;
            if (sofaColliders.length) {
                for (const box of sofaColliders) {
                    const inXZ = (
                        x > box.min.x - playerRadius &&
                        x < box.max.x + playerRadius &&
                        z > box.min.z - playerRadius &&
                        z < box.max.z + playerRadius
                    );
                    if (!inXZ) continue;
                    if (yBottom >= box.max.y - 0.05) {
                        ground = Math.max(ground, box.max.y + eyeHeight);
                    }
                }
            }
            const ladderGround = getCombinedLadderGroundHeight(x, z, yBottom);
            if (Number.isFinite(ladderGround)) {
                ground = Math.max(ground, ladderGround);
            }
            return ground;
        }

        function createPoopModel() {
            const group = new THREE.Group();
            const mats = [
                new THREE.MeshStandardMaterial({ color: 0x6b3612, roughness: 0.9, metalness: 0.02 }),
                new THREE.MeshStandardMaterial({ color: 0x7b4216, roughness: 0.86, metalness: 0.03 }),
                new THREE.MeshStandardMaterial({ color: 0x5a2c0c, roughness: 0.92, metalness: 0.02 })
            ];
            const sphere = new THREE.SphereGeometry(1, 24, 18);
            const segments = [
                { r: 1.25, h: 0.95, y: 0.0, x: 0.0, z: 0.0, m: 0 },
                { r: 0.95, h: 0.78, y: 0.72, x: 0.12, z: 0.1, m: 1 },
                { r: 0.7, h: 0.62, y: 1.32, x: -0.05, z: 0.08, m: 0 },
                { r: 0.48, h: 0.48, y: 1.78, x: 0.06, z: -0.02, m: 1 },
                { r: 0.3, h: 0.32, y: 2.08, x: 0.02, z: 0.02, m: 2 }
            ];
            group.userData.poopSegments = segments;
            segments.forEach((seg) => {
                const mesh = new THREE.Mesh(sphere, mats[seg.m]);
                mesh.scale.set(seg.r, seg.h / 2, seg.r);
                mesh.position.set(seg.x, seg.y + seg.h / 2, seg.z);
                group.add(mesh);
            });

            const gloss = new THREE.Mesh(
                new THREE.SphereGeometry(0.18, 16, 12),
                new THREE.MeshStandardMaterial({
                    color: 0x9a5a2a,
                    roughness: 0.6,
                    metalness: 0.08,
                    transparent: true,
                    opacity: 0.55
                })
            );
            gloss.position.set(0.35, 1.1, 0.45);
            group.add(gloss);
            return group;
        }

            }, { passive: false });
            dom.addEventListener('pointermove', handleWallImagePointerMove);
            dom.addEventListener('pointerup', () => stopBoardScrollHold());
            dom.addEventListener('pointerleave', () => stopBoardScrollHold());
            dom.addEventListener('pointercancel', () => stopBoardScrollHold());
            dom.addEventListener('click', (event) => {
                const target = event.target;
                if (target.closest('header') || target.closest('.modal') || target.closest('.wall-image-toolbar') || target.closest('.tools-panel')) return;
                if (handleBeerAddLockedClick(event)) {
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (handleBeerBoardClick(event)) return;
                if (handleWallImageClick(event)) return;
                dom.requestPointerLock();
            });
            dom.addEventListener('pointerup', handleWallImagePointerUp);
            dom.addEventListener('pointerleave', handleWallImagePointerUp);
            dom.addEventListener('pointercancel', handleWallImagePointerUp);

            document.addEventListener('pointerlockchange', () => {
                isLocked = document.pointerLockElement === dom || document.pointerLockElement === cssRenderer?.domElement;
                document.body.classList.toggle('pointer-locked', isLocked);
                if (!isLocked) stopBoardScrollHold();
                updateBeerAddPointerEvents();
            });

            document.addEventListener('mousemove', (event) => {
                if (!isLocked) return;
                const movementX = event.movementX || 0;
                const movementY = event.movementY || 0;
                yawObject.rotation.y -= movementX * 0.002;
                pitchObject.rotation.x -= movementY * 0.002;
                const maxPitch = Math.PI / 2 - 0.1;
                pitchObject.rotation.x = Math.max(-maxPitch, Math.min(maxPitch, pitchObject.rotation.x));
            });

            document.addEventListener('keydown', (event) => {
                if (isWallLabelEditing) return;
                if (event.target && event.target.closest && event.target.closest('.beer-add-3d')) {
                    return;
                }
                if (event.target && (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA' || event.target.isContentEditable)) {
                    return;
                }
                if ((event.ctrlKey || event.metaKey) && (event.code === 'KeyA' || event.code === 'KeyD')) {
                    return;
                }
                if (event.code === 'Escape') {
                    if (isBeerAddOpen) {
                        closeBeerAddModal3D();
                        return;
                    }
                    if (selectedWallImageId) setSelectedWallImage(null);
                    return;
                }
                if (event.code === 'KeyC') {
                    if (!event.repeat) toggleLadder();
                    return;
                }
                if (event.code === 'KeyW') moveState.forward = true;
                if (event.code === 'KeyS') moveState.back = true;
                if (event.code === 'KeyA') moveState.left = true;
                if (event.code === 'KeyD') moveState.right = true;
                if (event.code === 'ShiftLeft' || event.code === 'ShiftRight') moveState.fast = true;
                if (event.code === 'Space') {
                    if (isGrounded) {
                        verticalVelocity = jumpVelocity;
                        isGrounded = false;
                    }
                }
            });
            document.addEventListener('keyup', (event) => {
                if (isWallLabelEditing) return;
                if (event.target && event.target.closest && event.target.closest('.beer-add-3d')) {
                    return;
                }
                if (event.code === 'KeyW') moveState.forward = false;
                if (event.code === 'KeyS') moveState.back = false;
                if (event.code === 'KeyA') moveState.left = false;
                if (event.code === 'KeyD') moveState.right = false;
                if (event.code === 'ShiftLeft' || event.code === 'ShiftRight') moveState.fast = false;
            });
            window.addEventListener('blur', () => {
                moveState.forward = false;
                moveState.back = false;
                moveState.left = false;
                moveState.right = false;
                moveState.fast = false;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                if (cssRenderer) cssRenderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createNameSprite(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 26px Comfortaa, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(2.6, 0.65, 1);
            sprite.userData.text = text;
            sprite.renderOrder = 1000;
            sprite.material.depthTest = false;
            sprite.material.depthWrite = false;
            sprite.material.transparent = true;
            return sprite;
        }

        function loadAvatarModel() {
            if (avatarLoadPromise) return avatarLoadPromise;
            if (!THREE.GLTFLoader) {
                console.warn('GLTFLoader not available for avatar.');
                return Promise.resolve(null);
            }
            const loader = new THREE.GLTFLoader();
            avatarLoadPromise = new Promise((resolve) => {
                const handleLoad = (gltf) => {
                    avatarTemplate = gltf.scene;
                    avatarClips = Array.isArray(gltf.animations) ? gltf.animations : [];
                    resolve(avatarTemplate);
                };
                const handleError = (err) => {
                    console.warn('Avatar load failed', err);
                    if (AVATAR_MODEL_FALLBACK_URL && AVATAR_MODEL_FALLBACK_URL !== AVATAR_MODEL_URL) {
                        loader.load(AVATAR_MODEL_FALLBACK_URL, handleLoad, undefined, (fallbackErr) => {
                            console.warn('Avatar fallback failed', fallbackErr);
                            resolve(null);
                        });
                    } else {
                        resolve(null);
                    }
                };
                loader.load(AVATAR_MODEL_URL, handleLoad, undefined, handleError);
            });
            return avatarLoadPromise;
        }

        function cloneAvatar() {
            if (!avatarTemplate) return null;
            if (THREE.SkeletonUtils && THREE.SkeletonUtils.clone) {
                return THREE.SkeletonUtils.clone(avatarTemplate);
            }
            return avatarTemplate.clone(true);
        }

        function findClip(namePart) {
            const target = String(namePart || '').toLowerCase();
            return avatarClips.find((clip) => String(clip.name || '').toLowerCase().includes(target));
        }

        function setupAvatar(group, bodyColor) {
            const avatar = cloneAvatar();
            if (!avatar) return null;
            avatar.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = false;
                    child.receiveShadow = false;
                    child.frustumCulled = false;
                }
            });
            applyUserColorToAvatar(avatar, bodyColor);
            const box = new THREE.Box3().setFromObject(avatar);
            const size = box.getSize(new THREE.Vector3());
            const height = Math.max(size.y, 0.0001);
            const scale = AVATAR_TARGET_HEIGHT / height;
            avatar.scale.setScalar(scale);
            avatar.updateMatrixWorld(true);
            const adjustedBox = new THREE.Box3().setFromObject(avatar);
            avatar.position.y -= adjustedBox.min.y;
            group.add(avatar);
            const avatarHeight = adjustedBox.getSize(new THREE.Vector3()).y;
            const mixer = new THREE.AnimationMixer(avatar);
            const actions = {
                idle: findClip('idle'),
                walk: findClip('walk'),
                run: findClip('run')
            };
            const actionMap = {};
            Object.entries(actions).forEach(([key, clip]) => {
                if (!clip) return;
                const action = mixer.clipAction(clip);
                action.play();
                action.enabled = true;
                action.weight = key === 'idle' ? 1 : 0;
                actionMap[key] = action;
            });
            group.userData.avatar = avatar;
            group.userData.avatarHeight = avatarHeight;
            group.userData.mixer = mixer;
            group.userData.actions = actionMap;
            group.userData.activeAction = 'idle';
            if (group.userData.label) {
                group.userData.label.position.y = (avatarHeight || AVATAR_TARGET_HEIGHT) + LABEL_OFFSET;
            }
            if (group.userData.placeholder) {
                group.remove(group.userData.placeholder);
                group.userData.placeholder = null;
            }
            return avatar;
        }

        function setAvatarAction(group, name) {
            const actions = group?.userData?.actions;
            if (!actions || !actions[name]) return;
            if (group.userData.activeAction === name) return;
            Object.entries(actions).forEach(([key, action]) => {
                action.weight = key === name ? 1 : 0;
            });
            group.userData.activeAction = name;
        }

        function upsertRemotePlayer(user) {
            if (!user || !scene) return;
            const id = user.id;
            if (!id) return;
            let current = remotePlayers.get(id);
            if (!current) {
                const group = createRemotePlayer(user);
                scene.add(group);
                current = { group, target: new THREE.Vector3(), yaw: 0 };
                remotePlayers.set(id, current);
            }
            const baseY = (Number(user.y) || eyeHeight) - eyeHeight;
            current.target.set(user.x || 0, baseY, user.z || 0);
            current.yaw = user.yaw || 0;
            if (user.name && current.group.userData.label) {
                const label = current.group.userData.label;
                if (label.userData?.text !== user.name) {
                    const newLabel = createNameSprite(user.name);
                    newLabel.position.copy(label.position);
                    current.group.remove(label);
                    current.group.add(newLabel);
                    current.group.userData.label = newLabel;
                }
            }
        }

        function removeRemotePlayer(id) {
            const current = remotePlayers.get(id);
            if (!current) return;
            scene.remove(current.group);
            remotePlayers.delete(id);
            removeRemoteLadder(id);
        }

        function updateRemotePlayers(delta) {
            remotePlayers.forEach((player) => {
                const smoothing = 1 - Math.pow(0.001, delta);
                const prev = player.group.position.clone();
                player.group.position.lerp(player.target, smoothing);
                player.group.rotation.y += (player.yaw - player.group.rotation.y) * smoothing;
                if (player.group.userData.label) {
                    player.group.userData.label.lookAt(camera.position);
                }
                const horizontal = new THREE.Vector2(
                    player.group.position.x - prev.x,
                    player.group.position.z - prev.z
                );
                const speed = horizontal.length() / Math.max(delta, 0.0001);
                const speedSmoothing = 1 - Math.pow(0.001, delta);
                const prevSpeed = player.speed || 0;
                const smoothSpeed = prevSpeed + (speed - prevSpeed) * speedSmoothing;
                player.speed = smoothSpeed;
                if (player.group.userData.mixer) {
                    player.group.userData.mixer.update(delta);
                    if (speed > 1.8 && player.group.userData.actions?.run) {
                        setAvatarAction(player.group, 'run');
                    } else if (speed > 0.15 && player.group.userData.actions?.walk) {
                        setAvatarAction(player.group, 'walk');
                    } else {
                        setAvatarAction(player.group, 'idle');
                    }
                } else if (player.group.userData.placeholder?.userData?.limbs) {
                    const limbs = player.group.userData.placeholder.userData.limbs;
                    const stride = Math.min(1, smoothSpeed / 1.6);
                    if (!player.walkPhase) player.walkPhase = 0;
                    if (smoothSpeed > 0.05) {
                        player.walkPhase += smoothSpeed * delta * 3.6;
                    } else {
                        player.walkPhase *= Math.max(0, 1 - delta * 6);
                    }
                    const phase = player.walkPhase;
                    const swing = Math.sin(phase) * 0.24 * stride;
                    const sway = Math.cos(phase) * 0.05 * stride;
                    const leftBaseX = typeof limbs.armLeft.userData.baseRotX === 'number' ? limbs.armLeft.userData.baseRotX : 0;
                    const rightBaseX = typeof limbs.armRight.userData.baseRotX === 'number' ? limbs.armRight.userData.baseRotX : 0;
                    limbs.armLeft.rotation.x = leftBaseX + swing;
                    limbs.armRight.rotation.x = rightBaseX - swing;
                    limbs.legLeft.rotation.x = -swing;
                    limbs.legRight.rotation.x = swing;
                    if (typeof limbs.armLeft.userData.baseRotZ === 'number') {
                        limbs.armLeft.rotation.z = limbs.armLeft.userData.baseRotZ + sway * 0.25;
                    } else {
                        limbs.armLeft.rotation.z = sway * 0.25;
                    }
                    if (typeof limbs.armRight.userData.baseRotZ === 'number') {
                        limbs.armRight.rotation.z = limbs.armRight.userData.baseRotZ - sway * 0.25;
                    } else {
                        limbs.armRight.rotation.z = -sway * 0.25;
                    }
                    limbs.legLeft.rotation.z = -sway * 0.12;
                    limbs.legRight.rotation.z = sway * 0.12;
                }
            });
        }

        function compareBeerNames(a, b) {
            const nameA = getBeerName(a).toLowerCase();
            const nameB = getBeerName(b).toLowerCase();
            const isLatinA = /^[a-z0-9]/i.test(nameA);
            const isLatinB = /^[a-z0-9]/i.test(nameB);
            if (isLatinA && !isLatinB) return -1;
            if (!isLatinA && isLatinB) return 1;
            return nameA.localeCompare(nameB, 'ru');
        }

        function getUserBodyColor(user) {
            const key = String(user?.id || user?.name || 'guest');
            if (userColorCache.has(key)) return userColorCache.get(key);
            let hash = 0;
            for (let i = 0; i < key.length; i += 1) {
                hash = ((hash << 5) - hash) + key.charCodeAt(i);
                hash |= 0;
            }
            const hue = ((hash % 360) + 360) % 360;
            const color = new THREE.Color();
            color.setHSL(hue / 360, 0.5, 0.55);
            userColorCache.set(key, color);
            return color;
        }

        function applyUserColorToAvatar(avatar, color) {
            if (!avatar || !color) return;
            avatar.traverse((child) => {
                if (!child.isMesh) return;
                const name = String(child.name || '').toLowerCase();
                const isSkin = /(head|face|skin|hand|leg|arm)/.test(name);
                const isBody = /(body|torso|shirt|upper|jacket|cloth|uniform)/.test(name);
                const apply = isBody || (!isSkin);
                if (!apply) return;
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                materials.forEach((mat) => {
                    if (!mat || !mat.color) return;
                    mat.color = mat.color.clone ? mat.color.clone() : new THREE.Color(mat.color);
                    mat.color.set(color);
                    mat.needsUpdate = true;
                });
            });
        }

        function normalizeBeerData(raw) {
            if (Array.isArray(raw)) return raw;
            if (raw && typeof raw === 'object') {
                return Object.entries(raw)
                    .map(([key, value]) => {
                        if (!value || typeof value !== 'object') return null;
                        return { id: value.id ?? key, ...value };
                    })
                    .filter(Boolean);
            }
            return [];
        }

        function applyBeerData(raw, { cache = true } = {}) {
            const normalized = normalizeBeerData(raw);
            beerData = normalized;
            beerData.sort(compareBeerNames);
            if (beerData.length) {
                const exists = beerData.some((beer) => String(beer.id) === String(selectedBeerId));
                if (!exists) selectedBeerId = String(beerData[0].id);
            }
            renderBeerSelect();
            createBeerBoard();
            updateBeerBoard();
            updateBeerBoardArrows();
            if (cache) {
                writeCache(BEER_CACHE_KEY, beerData);
                writeCacheTs(BEER_CACHE_TS_KEY);
            }
        }

        function initBeerRatingFeed() {
            if (!window.firebase) return;
            const db = firebase.database();
            let lastMeta = readCache(BEER_META_TS_KEY) || 0;
            db.ref(BEER_RATING_META_PATH).on('value', (snapshot) => {
                const remoteTs = snapshot.val();
                if (!remoteTs) return;
                if (lastMeta && remoteTs <= lastMeta) return;
                db.ref('beerRating').once('value').then((dataSnap) => {
                    applyBeerData(dataSnap.val());
                    lastMeta = remoteTs;
                    writeCache(BEER_META_TS_KEY, remoteTs);
                }).catch((err) => console.warn('beerRating meta fetch failed', err));
            });
        }

        function getBeerName(beer) {
            return String(beer?.name || '').trim();
        }

        function getRatingsCount(beer) {
            if (!beer) return null;
            if (typeof beer.rating_count === 'number') return beer.rating_count;
            if (Array.isArray(beer.ratings)) return beer.ratings.length;
            if (beer.ratings && typeof beer.ratings === 'object') return Object.keys(beer.ratings).length;
            return null;
        }

        function getRatingsSummary(beer) {
            const result = { avg: null, my: null, count: null };
            if (!beer) return result;
            const ratings = beer.ratings && typeof beer.ratings === 'object' ? beer.ratings : null;
            if (ratings) {
                const values = Object.values(ratings)
                    .map((val) => parseFloat(String(val || '').replace(',', '.')))
                    .filter((num) => Number.isFinite(num) && num > 0);
                result.count = values.length || null;
                if (values.length) {
                    result.avg = values.reduce((sum, val) => sum + val, 0) / values.length;
                }
                const userName = getCurrentUserName();
                if (userName && ratings[userName] != null) {
                    const myVal = parseFloat(String(ratings[userName] || '').replace(',', '.'));
                    if (Number.isFinite(myVal)) result.my = myVal;
                }
            }
            return result;
        }

        function formatNumber(value, digits = 1) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '—';
            return num.toFixed(digits).replace(/\.0+$/, '').replace(/\.$/, '');
        }

        function formatBeerValue(value, suffix = '') {
            if (value === undefined || value === null || value === '') return '—';
            return `${value}${suffix}`;
        }

        function getCountryMeta(raw) {
            const value = String(raw || '').trim();
            if (!value) return { flag: '', name: '—' };
            const flagMatch = value.match(/[\u{1F1E6}-\u{1F1FF}]{2}/u);
            if (flagMatch) {
                const flag = flagMatch[0];
                const name = value.replace(flag, '').trim();
                return { flag, name: name || value };
            }
            const key = value.toLowerCase();
            if (COUNTRY_INFO[key]) return COUNTRY_INFO[key];
            const stripped = key.replace(/[^a-zа-яё\s]/g, '').trim();
            if (COUNTRY_INFO[stripped]) return COUNTRY_INFO[stripped];
            if (COUNTRY_INFO[stripped.slice(0, 2)]) return COUNTRY_INFO[stripped.slice(0, 2)];
            return { flag: '', name: value };
        }

        function wrapTextLines(ctx, text, maxWidth) {
            const words = String(text || '').split(/\s+/).filter(Boolean);
            if (!words.length) return [''];
            const lines = [];
            let line = words[0];
            for (let i = 1; i < words.length; i += 1) {
                const next = `${line} ${words[i]}`;
                if (ctx.measureText(next).width <= maxWidth) {
                    line = next;
                } else {
                    lines.push(line);
                    line = words[i];
                }
            }
            lines.push(line);
            return lines;
        }

        function clampLinesToHeight(ctx, lines, maxWidth, maxLines) {
            if (lines.length <= maxLines) return lines;
            const trimmed = lines.slice(0, maxLines).map((line) => {
                if (typeof line === 'string') return { text: line };
                return line;
            });
            const lastIndex = trimmed.length - 1;
            const last = trimmed[lastIndex];
            const text = typeof last.text === 'string' ? last.text : String(last.text || '');
            trimmed[lastIndex] = { ...last, text: truncateText(ctx, text, maxWidth) };
            return trimmed;
        }

        function drawFunnelIcon(ctx, x, y, size, color) {
            const scale = size / 24;
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.4;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(3, 4);
            ctx.lineTo(21, 4);
            ctx.lineTo(14, 12);
            ctx.lineTo(14, 18);
            ctx.lineTo(10, 20);
            ctx.lineTo(10, 12);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        function createBoardButtonTexture(label) {
            const canvas = document.createElement('canvas');
            canvas.width = 420;
            canvas.height = 140;
            const ctx = canvas.getContext('2d');
            const radius = 36;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(canvas.width - radius, 0);
            ctx.quadraticCurveTo(canvas.width, 0, canvas.width, radius);
            ctx.lineTo(canvas.width, canvas.height - radius);
            ctx.quadraticCurveTo(canvas.width, canvas.height, canvas.width - radius, canvas.height);
            ctx.lineTo(radius, canvas.height);
            ctx.quadraticCurveTo(0, canvas.height, 0, canvas.height - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.7)';
            ctx.lineWidth = 6;
            ctx.stroke();
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, 'rgba(245, 158, 11, 0.18)');
            grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.font = 'bold 40px Comfortaa, sans-serif';
            ctx.fillStyle = '#f8fafc';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, canvas.width / 2, canvas.height / 2);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function getRatingsSummaryText(beer) {
            const ratings = beer?.ratings && typeof beer.ratings === 'object' ? beer.ratings : null;
            if (!ratings) return '—';
            const entries = Object.entries(ratings).map(([name, val]) => {
                const num = parseFloat(String(val || '').replace(',', '.'));
                return `${name}: ${Number.isFinite(num) ? formatNumber(num, 1) : '—'}`;
            });
            return entries.length ? entries.join(' · ') : '—';
        }

        function createBeerTitleTexture(beer) {
            const canvas = document.createElement('canvas');
            canvas.width = BEER_TITLE_CANVAS.width;
            canvas.height = BEER_TITLE_CANVAS.height;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(14, 18, 26, 0.82)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, 'rgba(245, 158, 11, 0.14)');
            grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.55)';
            ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            const name = String(beer?.name || 'Без названия');
            const leftPad = 28;
            const maxWidth = canvas.width - leftPad * 2;
            let nameFont = 38;
            let nameLines = [];
            while (nameFont >= 22) {
                ctx.font = `bold ${nameFont}px Comfortaa, sans-serif`;
                nameLines = wrapTextLines(ctx, name, maxWidth);
                if (nameLines.length <= 2) break;
                nameFont -= 2;
            }
            const nameLineHeight = Math.round(nameFont * 1.2);
            const nameY = 18;
            ctx.fillStyle = '#f8fafc';
            nameLines.slice(0, 2).forEach((line, idx) => {
                ctx.fillText(line, leftPad, nameY + idx * nameLineHeight);
            });

            const { flag, name: countryName } = getCountryMeta(beer?.country || '');
            const countryY = nameY + nameLineHeight * Math.min(nameLines.length, 2) + 8;
            const emojiFont = '26px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
            const textFont = '26px Comfortaa, sans-serif';
            let x = leftPad;
            if (flag) {
                ctx.font = emojiFont;
                ctx.fillText(flag, x, countryY);
                x += ctx.measureText(flag).width + 6;
            }
            ctx.font = textFont;
            ctx.fillStyle = 'rgba(226, 232, 240, 0.85)';
            const countryText = truncateText(ctx, countryName || '—', maxWidth - (x - leftPad));
            ctx.fillText(countryText, x, countryY);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function createBeerInfoTexture(beer) {
            const canvas = document.createElement('canvas');
            canvas.width = BEER_INFO_CANVAS.width;
            canvas.height = BEER_INFO_CANVAS.height;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(12, 16, 24, 0.82)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, 'rgba(245, 158, 11, 0.12)');
            grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
            ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = '20px Comfortaa, sans-serif';
            ctx.fillStyle = 'rgba(226, 232, 240, 0.95)';

            const summary = getRatingsSummary(beer);
            const avgText = summary.avg != null ? formatNumber(summary.avg, 1) : formatBeerValue(beer?.rating);
            const countText = summary.count != null ? String(summary.count) : (getRatingsCount(beer) != null ? String(getRatingsCount(beer)) : '—');
            const ratingsText = getRatingsSummaryText(beer);

            const filteredValue = String(beer?.filtered || '').trim().toLowerCase();
            const isFiltered = filteredValue && !filteredValue.startsWith('не') && filteredValue.includes('фильтр');
            const entries = [
                { text: `Рейтинг: ${avgText} (оценок: ${countText})` },
                { text: `Оценки: ${ratingsText}` },
                { text: `Автор: ${formatBeerValue(beer?.author)}` },
                { text: `Вид: ${formatBeerValue(beer?.type)}`, icon: isFiltered },
                { text: `Сорт: ${formatBeerValue(beer?.style)}` },
                { text: `Объём: ${formatBeerValue(beer?.volume, ' л')}` },
                { text: `Крепость: ${formatBeerValue(formatNumber(beer?.alcohol, 1), '%')}` },
                { text: `Калории: ${formatBeerValue(formatNumber(beer?.calories, 0), ' ккал')}` }
            ];

            const leftPad = 26;
            const maxWidth = canvas.width - leftPad * 2;
            let fontSize = 26;
            let lineHeight = Math.round(fontSize * 1.3);
            let iconSize = Math.round(lineHeight * 0.7);
            const maxHeight = canvas.height - leftPad * 2;
            let wrapped = [];
            const buildWrapped = () => {
                ctx.font = `${fontSize}px Comfortaa, sans-serif`;
                lineHeight = Math.round(fontSize * 1.3);
                iconSize = Math.round(lineHeight * 0.7);
                wrapped = [];
                entries.forEach((entry) => {
                    const lineMaxWidth = entry.icon ? (maxWidth - iconSize - 8) : maxWidth;
                    const parts = wrapTextLines(ctx, entry.text, lineMaxWidth);
                    parts.forEach((part, idx) => {
                        const iconAfterText = entry.icon && idx === 0;
                        const textWidth = iconAfterText ? ctx.measureText(part).width : 0;
                        wrapped.push({
                            text: part,
                            icon: iconAfterText,
                            iconXOffset: iconAfterText ? Math.min(textWidth + 8, maxWidth - iconSize) : 0
                        });
                    });
                });
            };
            buildWrapped();
            while (wrapped.length * lineHeight > maxHeight && fontSize > 18) {
                fontSize -= 1;
                buildWrapped();
            }
            const maxLines = Math.max(1, Math.floor(maxHeight / lineHeight));
            const finalLines = clampLinesToHeight(ctx, wrapped, maxWidth, maxLines);
            let y = 20;
            finalLines.forEach((line) => {
                const lineMaxWidth = line.icon ? (maxWidth - iconSize - 8) : maxWidth;
                const text = truncateText(ctx, line.text, lineMaxWidth);
                ctx.fillText(text, leftPad, y);
                if (line.icon) {
                    const offset = Number.isFinite(line.iconXOffset) ? line.iconXOffset : (maxWidth - iconSize);
                    const iconX = leftPad + offset;
                    const iconY = y + (lineHeight - iconSize) / 2;
                    drawFunnelIcon(ctx, iconX, iconY, iconSize, 'rgba(253, 230, 138, 0.95)');
                }
                y += lineHeight;
            });
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function createBottleMesh(beer) {
            const group = new THREE.Group();
            const width = 1.35;
            const height = 2.5;
            const planeGeo = new THREE.PlaneGeometry(width, height);
            const mat = new THREE.MeshBasicMaterial({ transparent: true, color: 0xffffff });
            applyBoardStencil(mat);
            const mesh = new THREE.Mesh(planeGeo, mat);
            mesh.position.set(0, height / 2, 0.02);
            group.add(mesh);
            const url = (beer.imageUrl || '').trim();
            if (url && !/^data:image/i.test(url)) {
                const safe = toSafeImageUrl(url);
                bottleTextureLoader.load(safe, (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    texture.minFilter = THREE.LinearFilter;
                    texture.magFilter = THREE.LinearFilter;
                    mesh.material.map = texture;
                    mesh.material.needsUpdate = true;
                    const img = texture.image;
                    if (img && img.width && img.height) {
                        const aspect = img.width / img.height;
                        const targetWidth = height * aspect;
                        mesh.scale.x = targetWidth / width;
                    }
                });
            }
            group.userData.mesh = mesh;
            return group;
        }

        function setupWallSurfaces(backWall, frontWall, leftWall, rightWall) {
            wallImageGroup = new THREE.Group();
            scene.add(wallImageGroup);
            const makeSurface = (id, mesh, width, height) => {
                const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(mesh.quaternion);
                const anchor = new THREE.Group();
                anchor.position.copy(mesh.position).addScaledVector(normal, 0.12);
                anchor.rotation.copy(mesh.rotation);
                wallImageGroup.add(anchor);
                return { id, mesh, anchor, normal, width, height };
            };
            wallSurfaces = [
                makeSurface('back', backWall, room.width, room.height),
                makeSurface('front', frontWall, room.width, room.height),
                makeSurface('left', leftWall, room.depth, room.height),
                makeSurface('right', rightWall, room.depth, room.height)
            ];
            const stored = loadWallImagesFromStorage();
            if (stored.length) applyWallImages(stored, { cache: false });
        }

        function addWallImage(url) {
            const placement = pickWallPlacement();
            const id = Date.now() + (wallImageIdCounter++ % 1000);
            const data = {
                id,
                url,
                wallId: placement.wall.id,
                x: placement.local.x,
                y: placement.local.y,
                scale: 1,
                baseW: 2,
                baseH: 2,
                frame: false,
                labelText: ''
            };
            wallImages.push(data);
            queueWallImagesSave();
            const mesh = createWallImageMesh(data);
            if (mesh) setSelectedWallImage(mesh);
        }

        function pickWallPlacement() {
            const pointer = new THREE.Vector2(0, 0);
            wallImageRaycaster.setFromCamera(pointer, camera);
            const hits = wallImageRaycaster.intersectObjects(wallSurfaces.map((s) => s.mesh), false);
            if (hits.length) {
                const hit = hits[0];
                const wall = wallSurfaces.find((s) => s.mesh === hit.object) || wallSurfaces[0];
                const local = wall.anchor.worldToLocal(hit.point.clone());
                return { wall, local };
            }
            const fallback = wallSurfaces[0];
            return { wall: fallback, local: new THREE.Vector3(0, 0, 0) };
        }

        function applyWallImageTransform(mesh) {
            const scale = mesh.userData.scale || 1;
            const baseW = mesh.userData.baseW || 2;
            const baseH = mesh.userData.baseH || 2;
            mesh.scale.set(baseW * scale, baseH * scale, 1);
            if (mesh.userData.outline) {
                mesh.userData.outline.scale.set(1, 1, 1);
            }
            if (mesh.userData.frameGroup) {
                mesh.userData.frameGroup.scale.set(1, 1, 1);
            }
            if (mesh.userData.labelMesh) {
                updateWallImageLabel(mesh);
            }
            const wall = wallSurfaces.find((s) => s.id === mesh.userData.wallId);
            if (wall) clampWallImagePosition(mesh, wall);
        }

        function clampWallImagePosition(mesh, wall) {
            const baseW = mesh.userData.baseW || 2;
            const baseH = mesh.userData.baseH || 2;
            const scale = mesh.userData.scale || 1;
            const halfW = (baseW * scale) / 2;
            const halfH = (baseH * scale) / 2;
            const margin = 0.2;
            const maxX = wall.width / 2 - halfW - margin;
            const maxY = wall.height / 2 - halfH - margin;
            mesh.position.x = Math.min(maxX, Math.max(-maxX, mesh.position.x));
            mesh.position.y = Math.min(maxY, Math.max(-maxY, mesh.position.y));
        }

        function syncWallImageData(mesh) {
            const id = mesh.userData.id;
            const item = wallImages.find((img) => String(img.id) === String(id));
            if (!item) return;
            item.x = mesh.position.x;
            item.y = mesh.position.y;
            item.scale = mesh.userData.scale || 1;
            item.baseW = mesh.userData.baseW || item.baseW || 2;
            item.baseH = mesh.userData.baseH || item.baseH || 2;
            item.frame = Boolean(mesh.userData.frame);
            item.labelText = String(mesh.userData.labelText || '');
            if (Number.isFinite(mesh.userData.layer)) {
                item.layer = mesh.userData.layer;
            }
        }

        function removeWallImageById(id) {
            const idx = wallImages.findIndex((img) => String(img.id) === String(id));
            if (idx !== -1) wallImages.splice(idx, 1);
            const mesh = wallImageMeshMap.get(String(id));
            if (mesh && mesh.parent) mesh.parent.remove(mesh);
            wallImageMeshMap.delete(String(id));
            if (selectedWallImageId && String(selectedWallImageId) === String(id)) {
                setSelectedWallImage(null);
            }
            queueWallImagesSave();
        }

        function createWallImageMesh(data) {
            const wall = wallSurfaces.find((s) => s.id === data.wallId);
            if (!wall) return null;
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(1, 1),
                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1 })
            );
            mesh.position.set(data.x || 0, data.y || 0, 0);
            mesh.userData.id = data.id;
            mesh.userData.wallId = data.wallId;
            mesh.userData.scale = data.scale || 1;
            mesh.userData.baseW = data.baseW || 2;
            mesh.userData.baseH = data.baseH || 2;
            mesh.userData.frame = Boolean(data.frame);
            mesh.userData.labelText = String(data.labelText || '');
            if (!Number.isFinite(data.layer)) {
                data.layer = wallImageLayerCounter++;
            } else {
                wallImageLayerCounter = Math.max(wallImageLayerCounter, data.layer + 1);
            }
            mesh.position.z = (data.layer || 0) * 0.002;
            mesh.renderOrder = 30 + (data.layer || 0);
            const outline = new THREE.LineSegments(
                new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, 1)),
                new THREE.LineBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.8 })
            );
            outline.visible = false;
            outline.position.z = 0.01;
            outline.raycast = () => {};
            mesh.add(outline);
            mesh.userData.outline = outline;
            ensureWallImageFrame(mesh);
            setWallImageFrameVisible(mesh, mesh.userData.frame);
            ensureWallImageLabel(mesh);
            updateWallImageLabel(mesh);
            applyWallImageTransform(mesh);
            wall.anchor.add(mesh);
            wallImageMeshMap.set(String(data.id), mesh);
            if (data.url) {
                const safeUrl = data.url.startsWith('data:image') ? data.url : toSafeImageUrl(data.url);
                wallImageTextureLoader.load(safeUrl, (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    texture.minFilter = THREE.LinearFilter;
                    texture.magFilter = THREE.LinearFilter;
                    mesh.material.map = texture;
                    mesh.material.needsUpdate = true;
                    const img = texture.image;
                    if (img && img.width && img.height) {
                        const aspect = img.width / img.height;
                        mesh.userData.baseH = 2;
                        mesh.userData.baseW = 2 * aspect;
                        applyWallImageTransform(mesh);
                        syncWallImageData(mesh);
                        saveWallImagesToStorage();
                    }
                });
            }
            return mesh;
        }

        function ensureWallImageFrame(mesh) {
            if (mesh.userData.frameGroup) return;
            const t = 0.08;
            const depth = 0.06;
            const frameMat = new THREE.MeshStandardMaterial({
                color: 0x4a2d16,
                roughness: 0.7,
                metalness: 0.1
            });
            const frameGroup = new THREE.Group();
            const horizGeo = new THREE.BoxGeometry(1 + t * 2, t, depth);
            const vertGeo = new THREE.BoxGeometry(t, 1 + t * 2, depth);
            const top = new THREE.Mesh(horizGeo, frameMat);
            top.position.set(0, 0.5 + t / 2, 0.02);
            const bottom = top.clone();
            bottom.position.y = -0.5 - t / 2;
            const left = new THREE.Mesh(vertGeo, frameMat);
            left.position.set(-0.5 - t / 2, 0, 0.02);
            const right = left.clone();
            right.position.x = 0.5 + t / 2;
            frameGroup.add(top, bottom, left, right);
            frameGroup.raycast = () => {};
            frameGroup.visible = false;
            mesh.add(frameGroup);
            mesh.userData.frameGroup = frameGroup;
        }

        function setWallImageFrameVisible(mesh, visible) {
            if (!mesh) return;
            ensureWallImageFrame(mesh);
