        function handleRealtimeEvent(data, localId) {
            if (!data || typeof data.type !== 'string') return;
            if (data.type === 'state') {
                applyRealtimeState(data, localId);
                return;
            }
            if (data.type === 'user_join' && data.user) {
                if (data.user.id === localId) return;
                upsertRemotePlayer(data.user);
                upsertOnlineUser(data.user, localId);
                if (voiceStream && shouldOfferVoice(String(data.user.id))) {
                    sendVoiceOffer(String(data.user.id));
                }
                if (ladderData) broadcastLadderState();
                return;
            }
            if (data.type === 'user_leave' && data.id) {
                removeRemotePlayer(data.id);
                closeVoicePeer(String(data.id));
                voiceRemoteSpeaking.delete(String(data.id));
                removeOnlineUser(String(data.id));
                return;
            }
            if (data.type === 'ladder') {
                upsertRemoteLadder(data);
                return;
            }
            if (data.type === 'board_scroll' && Number.isFinite(data.target)) {
                applyRemoteBoardScroll(Number(data.target));
                return;
            }
            if (data.type === 'beer_add') {
                syncBeerAddOpenState(Boolean(data.open), data.data || null);
                return;
            }
            if (data.type === 'video' && data.state) {
                applyRemoteVideoState(data.state);
                return;
            }
            if (data.type === 'light' && data.state) {
                if (USE_FIREBASE_LIGHT) return;
                if (!hasLocalLightPrefs && !lightStateBootstrapped) {
                    applyLightState(data.state, { silent: true });
                }
                return;
            }
            if (data.type === 'wall_draw') {
                if (data.clientId && data.clientId === localId) return;
                applyWallDrawEvent(data);
                return;
            }
            if (data.type === 'voice:signal') {
                if (data.target !== localId) return;
                handleVoiceSignal(String(data.from || ''), data.data);
                return;
            }
            if (data.type === 'voice:talking') {
                const speakerId = String(data.clientId || data.id || '');
                if (!speakerId || speakerId === localId) return;
                voiceRemoteSpeaking.set(speakerId, Boolean(data.speaking));
                updateVoiceActivity();
                renderOnlineUsers();
                return;
            }
            if (data.type === 'presence' && data.user) {
                if (data.user.id === localId) return;
                upsertRemotePlayer(data.user);
                upsertOnlineUser(data.user, localId);
                if (voiceStream && shouldOfferVoice(String(data.user.id))) {
                    sendVoiceOffer(String(data.user.id));
                }
            }
        }

        function getRealtimeSyncState() {
            const videoState = {
                url: videoUrl || '',
                time: getVideoTimeNow(),
                playing: Boolean(videoDesiredPlaying || videoPlaying || rutubeAwaitingPlay),
                open: Boolean(videoScreenOpen)
            };
            if (videoIsRutube) {
                videoState.source = 'rutube';
            } else if (videoUrl) {
                videoState.source = 'file';
            }
            return {
                boardScroll: { target: boardScrollState.target },
                beerAdd: { open: isBeerAddOpen, data: collectBeerAddFormState?.() || null },
                video: videoState,
                light: getLightStateFromInputs()
            };
        }

        function connectRealtime() {
            if (ws) return;
            if (!REALTIME_WS_URLS.length) {
                startRealtimeHttp();
                return;
            }
            const localId = getLocalClientId() || crypto.randomUUID();
            const name = getCurrentUserName() || 'Guest';
            const baseUrl = REALTIME_WS_URLS[realtimeUrlIndex % REALTIME_WS_URLS.length];
            const wsUrl = `${baseUrl}?room=${encodeURIComponent(REALTIME_ROOM)}&id=${encodeURIComponent(localId)}&name=${encodeURIComponent(name)}`;
            realtimeUrlIndex = (realtimeUrlIndex + 1) % REALTIME_WS_URLS.length;
            try {
                ws = new WebSocket(wsUrl);
                window.ws = ws;
            } catch (_) {
                ws = null;
                wsConnected = false;
                window.wsConnected = false;
                if (!wsReconnectTimer) {
                    wsReconnectTimer = setTimeout(() => {
                        wsReconnectTimer = null;
                        connectRealtime();
                    }, 2000);
                }
                return;
            }

            ws.addEventListener('open', () => {
                wsConnected = true;
                window.wsConnected = true;
                wsEverConnected = true;
                wsLastOpenAt = Date.now();
                lastPresenceSent = 0;
                if (ladderData) broadcastLadderState();
                startPresenceHeartbeat();
                try {
                    console.log('[realtime] ws open', wsUrl);
                } catch (_) {}
            });

            ws.addEventListener('message', (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (_) {
                    return;
                }
                try {
                    window.lastRealtimeMessage = data;
                } catch (_) {}
                try {
                    console.log('[realtime] message', data);
                } catch (_) {}
                handleRealtimeEvent(data, localId);
            });

            const handleClose = () => {
                wsConnected = false;
                window.wsConnected = false;
                if (ws) {
                    ws.close();
                }
                ws = null;
                window.ws = null;
                if (!wsReconnectTimer) {
                    wsReconnectTimer = setTimeout(() => {
                        wsReconnectTimer = null;
                        connectRealtime();
                    }, 2000);
                }
            };
            ws.addEventListener('close', handleClose);
            ws.addEventListener('error', handleClose);
        }

        function sendRealtime(data) {
            if (ws && wsConnected) {
                try {
                    ws.send(JSON.stringify(data));
                } catch (_) {}
                return;
            }
            sendRealtimeHttp(data);
        }

        function bumpRealtimePolling(interval = 150, durationMs = 2500) {
            if (!realtimeHttpEnabled) return;
            const now = performance.now();
            realtimePollFastUntil = Math.max(realtimePollFastUntil || 0, now + durationMs);
            realtimePollInterval = Math.min(realtimePollInterval || 900, interval);
        }

        function sendPresenceUpdate() {
            if (!yawObject || (!wsConnected && !realtimeHttpEnabled)) return;
            const now = performance.now();
            const pos = yawObject.position;
            const dx = pos.x - (lastPresenceState.x || 0);
            const dy = pos.y - (lastPresenceState.y || 0);
            const dz = pos.z - (lastPresenceState.z || 0);
            const dyaw = yawObject.rotation.y - (lastPresenceState.yaw || 0);
            const moved = (dx * dx + dy * dy + dz * dz) > 0.0025;
            const rotated = Math.abs(dyaw) > 0.02;
            if (!avatarPresenceDirty && now - lastPresenceSent < 180) return;
            if (!avatarPresenceDirty && !moved && !rotated && now - lastPresenceSent < 2000) return;
            lastPresenceSent = now;
            lastPresenceState = { x: pos.x, y: pos.y, z: pos.z, yaw: yawObject.rotation.y };
            if (moved || rotated) {
                bumpRealtimePolling(150, 2500);
            }
            sendRealtime({
                type: 'presence',
                id: getLocalClientId(),
                name: getCurrentUserName(),
                x: pos.x,
                y: pos.y,
                z: pos.z,
                yaw: yawObject.rotation.y,
                avatar: getShareableAvatarPrefs()
            });
            avatarPresenceDirty = false;
        }

        function getRealtimeHttpBase() {
            return REALTIME_HTTP_BASE;
        }

        function sendRealtimeHttp(data) {
            if (!realtimeHttpBase || !data) return;
            const localId = getLocalClientId();
            const name = getCurrentUserName() || 'Guest';
            fetch(`${realtimeHttpBase}/event?room=${encodeURIComponent(REALTIME_ROOM)}&id=${encodeURIComponent(localId)}&name=${encodeURIComponent(name)}`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(() => {});
        }

        function pollRealtimeState() {
            if (!realtimeHttpEnabled || !realtimeHttpBase) return;
            if (realtimePollInFlight) return;
            const localId = getLocalClientId();
            const name = getCurrentUserName() || 'Guest';
            realtimePollInFlight = true;
            fetch(`${realtimeHttpBase}/state?room=${encodeURIComponent(REALTIME_ROOM)}&id=${encodeURIComponent(localId)}&name=${encodeURIComponent(name)}`)
                .then((res) => res.json())
                .then((data) => {
                    if (!data) return;
                    if (data.type === 'state') {
                        applyRealtimeState(data, localId);
                    }
                })
                .catch(() => {})
                .finally(() => {
                    realtimePollInFlight = false;
                    const now = performance.now();
                    if (now > (realtimePollFastUntil || 0)) {
                        realtimePollInterval = 1100;
                    }
                    scheduleRealtimePoll(realtimePollInterval);
                });
        }

        function startRealtimeHttp() {
            if (realtimeHttpEnabled) return;
            realtimeHttpBase = getRealtimeHttpBase();
            if (!realtimeHttpBase) return;
            realtimeHttpEnabled = true;
            if (realtimePollTimer) clearTimeout(realtimePollTimer);
            realtimePollInterval = 900;
            realtimePollFastUntil = 0;
            scheduleRealtimePoll(0);
            startPresenceHeartbeat();
        }

        function scheduleRealtimePoll(delay) {
            if (!realtimeHttpEnabled) return;
            if (realtimePollTimer) clearTimeout(realtimePollTimer);
            realtimePollTimer = window.setTimeout(pollRealtimeState, Math.max(50, delay || 0));
        }

        function startPresenceHeartbeat() {
            if (presenceHeartbeatId) return;
            presenceHeartbeatId = window.setInterval(() => {
                sendPresenceUpdate();
            }, 320);
        }

        function applyRealtimeState(data, localId) {
            if (Array.isArray(data.users)) {
                data.users.forEach((user) => {
                    if (user?.id === localId) return;
                    upsertRemotePlayer(user);
                });
                updateOnlineUsers(data.users, localId);
                syncVoicePeersFromUsers(data.users, localId);
            }
            if (Array.isArray(data.ladders)) {
                const seen = new Set();
                data.ladders.forEach((ladder) => {
                    if (!ladder?.id) return;
                    seen.add(String(ladder.id));
                    upsertRemoteLadder({ ...ladder, action: 'add' });
                });
                remoteLadders.forEach((_, key) => {
                    if (!seen.has(String(key))) {
                        removeRemoteLadder(key);
                    }
                });
            }
            if (data.boardScroll && Number.isFinite(data.boardScroll.target)) {
                applyRemoteBoardScroll(Number(data.boardScroll.target));
            }
            if (data.beerAdd && typeof data.beerAdd.open === 'boolean') {
                syncBeerAddOpenState(Boolean(data.beerAdd.open), data.beerAdd.data || null);
            }
            if (data.video) {
                applyRemoteVideoState(data.video);
            }
            if (data.light) {
                if (USE_FIREBASE_LIGHT) return;
                if (!hasLocalLightPrefs && !lightStateBootstrapped) {
                    applyLightState(data.light, { silent: true });
                }
            }
            if (data.wallDraw) {
                applyWallDrawState(data.wallDraw);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            monitorPerformance(delta);
            const speed = moveState.fast ? 12 : 6;
            const t = clock.getElapsedTime();
            if (neonSignGroup?.userData?.neon) {
                const neon = neonSignGroup.userData.neon;
                const flicker = 0.9 + 0.1 * Math.sin(t * 0.6) + 0.05 * Math.sin(t * 1.1);
                const jitter = 0.02 * Math.sin(t * 2.3);
                const intensity = Math.max(0.78, flicker + jitter);
                if (neon.halo) neon.halo.intensity = 0.9 + intensity * 1.1;
                if (neon.neonMat) neon.neonMat.emissiveIntensity = 0.85 + intensity * 0.9;
                if (neon.glowMat) neon.glowMat.opacity = 0.12 + intensity * 0.16;
            }
            if (beerRatingSignGroup?.userData?.neon) {
                const neon = beerRatingSignGroup.userData.neon;
                const flicker = 0.9 + 0.1 * Math.sin(t * 0.6) + 0.05 * Math.sin(t * 1.1);
                const jitter = 0.02 * Math.sin(t * 2.1);
                const intensity = Math.max(0.78, flicker + jitter);
                if (neon.halo) neon.halo.intensity = 0.85 + intensity * 1.05;
                if (neon.neonMat) neon.neonMat.emissiveIntensity = 0.8 + intensity * 0.85;
                if (neon.glowMat) neon.glowMat.opacity = 0.1 + intensity * 0.15;
            }
            if (beerAddAnchor && !beerAddAnchor.userData.hasCustomPosition) {
                syncBeerAddModalPosition();
            }
            if (videoScreenGroup) {
                const smooth = 1 - Math.exp(-2.2 * delta);
                videoScreenSlide += (videoScreenTarget - videoScreenSlide) * smooth;
                const screenY = videoScreenHiddenY + (videoScreenVisibleY - videoScreenHiddenY) * videoScreenSlide;
                videoScreenGroup.position.y = screenY;
                const screenRect = getVideoScreenRect();
                const occluded = false;
                const underFloor = screenY < 0.35;
                const visibleScreen = videoScreenSlide > 0.05 && !occluded && !underFloor;
                videoScreenGroup.visible = visibleScreen;
                if (videoSurfaceMesh) videoSurfaceMesh.visible = visibleScreen && !videoIsRutube;
                if (videoIframeObject) {
                    videoIframeObject.position.set(videoScreenGroup.position.x, screenY, videoScreenGroup.position.z + 0.02);
                    videoIframeObject.rotation.copy(videoScreenGroup.rotation);
                    videoIframeObject.visible = visibleScreen && videoIsRutube;
                }
                if (videoControlObject) {
                    const panelScaleY = videoControlObject.scale?.y || (5.6 / 360);
                    const panelHeightWorld = (videoControlPanelHeight || 220) * panelScaleY;
                    const panelWidthWorld = (videoControlPanelWidth || 360) * panelScaleY;
                    const panelHalf = panelHeightWorld * 0.5;
                    const controlY = Math.max(panelHalf + 0.35, screenY - (videoScreenHeight / 2) - panelHalf - 0.35);
                    videoControlObject.position.set(
                        videoScreenGroup.position.x,
                        controlY,
                        videoScreenGroup.position.z + 0.04
                    );
                    videoControlObject.rotation.copy(videoScreenGroup.rotation);
                    videoControlObject.visible = videoScreenSlide > 0.05 && !underFloor;
                }
            }
            if (videoToggleMesh && videoScreenGroup) {
                if (!videoToggleAnchor) {
                    videoToggleAnchor = new THREE.Vector3();
                }
                const panelScaleY = videoControlObject?.scale?.y || (5.6 / 360);
                const panelWidthWorld = (videoControlPanelWidth || 360) * panelScaleY;
                const buttonHalf = 3.2 / 2;
                const offsetX = (panelWidthWorld / 2) + buttonHalf + 0.35;
                const anchorX = videoScreenGroup.position.x - offsetX;
                const anchorY = Math.max(0.9, videoScreenVisibleY - (videoScreenHeight / 2) - 0.9);
                const anchorZ = videoScreenGroup.position.z - 0.02;
                videoToggleAnchor.set(anchorX, anchorY, anchorZ);
                videoToggleMesh.position.copy(videoToggleAnchor);
                videoToggleMesh.rotation.copy(videoScreenGroup.rotation);
                videoToggleMesh.visible = true;
            }
            if (videoScreenGroup && cssScene && !videoIframeObject) {
                ensureVideoCssOverlay();
            }
            updateVideoControlPanel(delta);
            const dirForward = (moveState.forward ? 1 : 0) - (moveState.back ? 1 : 0);
            const dirRight = (moveState.right ? 1 : 0) - (moveState.left ? 1 : 0);
            if (dirForward !== 0 || dirRight !== 0) {
                const yaw = yawObject.rotation.y;
                const forwardVec = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const rightVec = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const moveVec = forwardVec.multiplyScalar(dirForward).add(rightVec.multiplyScalar(dirRight)).normalize().multiplyScalar(speed * delta);
                const current = yawObject.position.clone();
                const proposed = current.clone().add(moveVec);
                const yBottom = yawObject.position.y - eyeHeight;
                const yTop = yawObject.position.y;
                if (collidesWithSofa(proposed.x, proposed.z, yBottom, yTop)) {
                    const tryX = { x: proposed.x, z: current.z };
                    const tryZ = { x: current.x, z: proposed.z };
                    if (!collidesWithSofa(tryX.x, tryX.z, yBottom, yTop)) {
                        proposed.z = current.z;
                    } else if (!collidesWithSofa(tryZ.x, tryZ.z, yBottom, yTop)) {
                        proposed.x = current.x;
                    } else {
                        proposed.x = current.x;
                        proposed.z = current.z;
                    }
                }
                const wallPadding = playerRadius + 0.15;
                const halfW = room.width / 2 - wallPadding;
                const halfD = room.depth / 2 - wallPadding;
                proposed.x = Math.max(-halfW, Math.min(halfW, proposed.x));
                proposed.z = Math.max(-halfD, Math.min(halfD, proposed.z));
                yawObject.position.x = proposed.x;
                yawObject.position.z = proposed.z;
            }
            if (boardContentGroup) {
                if (boardScrollState.holdDir) {
                    const maxOffset = boardScrollState.maxOffset || 0;
                    const speed = boardScrollState.speed || 0;
                    if (speed > 0) {
                        const base = Number.isFinite(boardScrollState.offset) ? boardScrollState.offset : (boardScrollState.target ?? 0);
                        const next = Math.max(-maxOffset, Math.min(maxOffset, base + boardScrollState.holdDir * speed * delta));
                        boardScrollState.target = next;
                        boardScrollState.offset = next;
                        boardContentGroup.position.x = boardScrollState.offset;
                        updateBeerBoardArrows();
                        const now = performance.now();
                        if (now - lastBoardScrollSent > 140) {
                            sendBoardScrollUpdate(true);
                        }
                    }
                }
                const diff = boardScrollState.target - boardScrollState.offset;
                if (!boardScrollState.holdDir) {
                    if (Math.abs(diff) > 0.002) {
                        const smooth = 1 - Math.exp(-10 * delta);
                        boardScrollState.offset += diff * smooth;
                        boardContentGroup.position.x = boardScrollState.offset;
                    } else if (Math.abs(diff) > 0) {
                        boardScrollState.offset = boardScrollState.target;
                        boardContentGroup.position.x = boardScrollState.offset;
                    }
                }
                if (boardCssContentEl) {
                    const pxPerUnit = boardCssGroup?.userData?.pxPerUnit || 120;
                    boardCssContentEl.style.transform = `translateX(${boardScrollState.offset * pxPerUnit}px)`;
                }
            }
            if (beerRatingAnimMeshes.size) {
                const toRemove = [];
                beerRatingAnimMeshes.forEach((mesh) => {
                    if (!mesh || !mesh.material) {
                        toRemove.push(mesh);
                        return;
                    }
                    const anim = mesh.userData.ratingAnim || { t: 0 };
                    anim.t = Math.min(1, anim.t + delta * 6);
                    const ease = 1 - Math.exp(-4 * anim.t);
                    mesh.material.opacity = ease;
                    const scale = 0.85 + 0.15 * ease;
                    mesh.scale.set(scale, scale, scale);
                    mesh.userData.ratingAnim = anim;
                    if (anim.t >= 1) {
                        mesh.material.opacity = 1;
                        toRemove.push(mesh);
                    }
                });
                toRemove.forEach((mesh) => beerRatingAnimMeshes.delete(mesh));
            }
            sendBoardScrollUpdate();
            const currentBottom = yawObject.position.y - eyeHeight;
            const groundY = getSofaGroundHeight(yawObject.position.x, yawObject.position.z, currentBottom);
            if (yawObject.position.y > groundY + 0.02) {
                isGrounded = false;
            }
            if (!isGrounded || verticalVelocity !== 0) {
                verticalVelocity += gravity * delta;
                yawObject.position.y += verticalVelocity * delta;
                if (yawObject.position.y <= groundY) {
                    yawObject.position.y = groundY;
                    verticalVelocity = 0;
                    isGrounded = true;
                }
            }
            const ladderGround = getCombinedLadderGroundHeight(yawObject.position.x, yawObject.position.z, currentBottom);
            if (Number.isFinite(ladderGround)) {
                if (yawObject.position.y < ladderGround) {
                    yawObject.position.y = ladderGround;
                    verticalVelocity = 0;
                    isGrounded = true;
                }
            }
            const onToilet = isPlayerOnToilet();
            if (onToilet && !isPoopAddOpen && !poopModalSuppressed) {
                openPoopAddModal3D();
            } else if (!onToilet && isPoopAddOpen) {
                closePoopAddModal3D();
            } else if (!onToilet && poopModalSuppressed) {
                poopModalSuppressed = false;
            }
            if (isPoopAddOpen && !poopModalAnchorPos) {
                positionPoopAddModalInFront();
            }
            sendPresenceUpdate();
            updateRemotePlayers(delta);
            updateSlotMachine(delta);
            if (wallCssRenderer && wallCssScene) {
                wallCssRenderer.render(wallCssScene, camera);
            }
            renderer.render(scene, camera);
            if (cssRenderer && cssScene) {
                cssRenderer.render(cssScene, camera);
            }
        }

        function init() {
            if (!ensureAuth()) return;
            if (firebase.database && firebase.database.INTERNAL && typeof firebase.database.INTERNAL.forceLongPolling === 'function') {
                firebase.database.INTERNAL.forceLongPolling();
            }
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            initUI();
            initLightSettingsFeed();
            initScene();
            initBeerRatingFeed();
            initWallImagesFeed();
            initAvatarPresenceFeed();
            connectRealtime();
            window.addEventListener('message', handleRutubeMessage);
            startPresenceHeartbeat();
            const db = firebase.database();
            const cachedBeer = readCache(BEER_CACHE_KEY);
            const hasCachedBeer = Array.isArray(cachedBeer) || (cachedBeer && typeof cachedBeer === 'object');
            if (hasCachedBeer) {
                applyBeerData(cachedBeer, { cache: false });
            }
            const cachedRug = readCache(RUG_CACHE_KEY);
            if (cachedRug) {
                applyRugTexture(cachedRug);
            }
            const rugTs = readCacheTs(RUG_CACHE_TS_KEY);
            if (shouldRefreshCache(rugTs)) {
                db.ref('beerShelfRugUrl').once('value').then((snapshot) => {
                    const url = snapshot.val() || DEFAULT_RUG_URL;
                    applyRugTexture(url);
                    writeCache(RUG_CACHE_KEY, url);
                    writeCacheTs(RUG_CACHE_TS_KEY);
                }).catch((err) => console.warn('beerShelfRugUrl fetch failed', err));
            }
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState !== 'visible') return;
                const freshRugTs = readCacheTs(RUG_CACHE_TS_KEY);
                if (shouldRefreshCache(freshRugTs)) {
                    db.ref('beerShelfRugUrl').once('value').then((snapshot) => {
                        const url = snapshot.val() || DEFAULT_RUG_URL;
                        applyRugTexture(url);
                        writeCache(RUG_CACHE_KEY, url);
                        writeCacheTs(RUG_CACHE_TS_KEY);
                    }).catch((err) => console.warn('beerShelfRugUrl refresh failed', err));
                }
            });
        }

        window.addEventListener('load', init);
    </script>
