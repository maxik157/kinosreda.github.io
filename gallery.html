                easeScale: root.querySelector('#poopEaseScale'),
                satisfactionScale: root.querySelector('#poopSatisfactionScale'),
                sizeScale: root.querySelector('#poopSizeScale'),
                easeValueLabel: root.querySelector('#poopEaseValueLabel'),
                satisfactionValueLabel: root.querySelector('#poopSatisfactionValueLabel'),
                sizeValueLabel: root.querySelector('#poopSizeValueLabel'),
                bristolOptions: root.querySelector('#poopBristolOptions'),
                drawingToggle: root.querySelector('#poopDrawingToggle'),
                drawingPanel: root.querySelector('#poopDrawingPanel'),
                drawingCanvas: root.querySelector('#poopDrawingCanvas'),
                drawingInput: root.querySelector('#poopDrawingInput'),
                drawingClear: root.querySelector('#poopDrawingClear'),
                drawingToolButtons: root.querySelectorAll('[data-drawing-tool]'),
                drawingColorButtons: root.querySelectorAll('[data-color]')
            };

            const TIME_WHEEL_ITEM_HEIGHT = 48;
            const DURATION_MAX_MINUTES = 180;
            const PAPER_MAX_COUNT = 100;

            const pad = (n) => String(n).padStart(2, '0');
            const formatTimeValue = (h, m) => `${pad(h)}:${pad(m)}`;
            const parseTimeValue = (val) => {
                const parts = String(val || '').split(':');
                return {
                    h: Math.min(23, Math.max(0, Number(parts[0]) || 0)),
                    m: Math.min(59, Math.max(0, Number(parts[1]) || 0))
                };
            };
            const defaultTime = () => {
                const now = new Date();
                return `${pad(now.getHours())}:${pad(now.getMinutes())}`;
            };

            const updateWheelSelection = (col, forcedIndex) => {
                if (!col) return 0;
                const list = col.querySelector('.time-wheel-list');
                const max = Number(list?.dataset.max || 0);
                let index = typeof forcedIndex === 'number' ? forcedIndex : Math.round((list?.scrollTop || 0) / TIME_WHEEL_ITEM_HEIGHT);
                index = Math.max(0, Math.min(max - 1, index));
                if (col._selectedIndex === index) return index;
                if (col._selectedEl) col._selectedEl.classList.remove('is-selected');
                const el = list?.querySelector(`.time-wheel-item[data-value="${index}"]`);
                if (el) {
                    el.classList.add('is-selected');
                    col._selectedEl = el;
                }
                col._selectedIndex = index;
                return index;
            };

            const buildWheelList = (col, count, onPick, formatValue) => {
                if (!col) return;
                const list = col.querySelector('.time-wheel-list');
                if (!list) return;
                list.innerHTML = '';
                list.dataset.max = String(count);
                col._selectedIndex = null;
                col._selectedEl = null;
                const format = typeof formatValue === 'function' ? formatValue : pad;
                for (let i = 0; i < count; i += 1) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'time-wheel-item';
                    btn.dataset.value = String(i);
                    btn.textContent = format(i);
                    btn.addEventListener('click', () => {
                        list.scrollTo({ top: i * TIME_WHEEL_ITEM_HEIGHT, behavior: 'smooth' });
                        updateWheelSelection(col, i);
                        if (onPick) onPick();
                    });
                    list.appendChild(btn);
                }
                list.addEventListener('scroll', () => {
                    if (col._scrollRaf) cancelAnimationFrame(col._scrollRaf);
                    col._scrollRaf = requestAnimationFrame(() => {
                        updateWheelSelection(col);
                        if (onPick) onPick();
                    });
                });
            };

            const syncTimeFromWheel = () => {
                const hourCol = poopModalRefs.timeWheel?.querySelector('[data-part="hour"]');
                const minuteCol = poopModalRefs.timeWheel?.querySelector('[data-part="minute"]');
                const h = updateWheelSelection(hourCol);
                const m = updateWheelSelection(minuteCol);
                const formatted = formatTimeValue(h, m);
                poopTimeValue = formatted;
                if (poopModalRefs.timeInput) poopModalRefs.timeInput.value = formatted;
            };

            const buildTimeWheel = () => {
                const hourCol = poopModalRefs.timeWheel?.querySelector('[data-part="hour"]');
                const minuteCol = poopModalRefs.timeWheel?.querySelector('[data-part="minute"]');
                buildWheelList(hourCol, 24, syncTimeFromWheel);
                buildWheelList(minuteCol, 60, syncTimeFromWheel);
            };

            const buildTimeSelectOptions = () => {
                const wrap = poopModalRefs.timeSelect;
                const btn = poopModalRefs.timeSelectBtn;
                const menu = poopModalRefs.timeSelectMenu;
                if (!wrap || !btn || !menu) return;
                const options = [];
                for (let h = 0; h < 24; h += 1) {
                    for (let m = 0; m < 60; m += 15) {
                        const val = formatTimeValue(h, m);
                        options.push({ value: val, label: val });
                    }
                }
                poopModalRefs.timeSelectOptions = options;
                wrap.dataset.ready = 'false';
                setupCustomSelect(wrap, options, options[0]?.value, (value) => {
                    if (value) setTime(value);
                });
                if (!wrap.dataset.value) {
                    wrap.dataset.value = options[0]?.value || '';
                    btn.textContent = wrap.dataset.value || 'Выберите время';
                }
            };

            const setTime = (val) => {
                const parsed = parseTimeValue(val);
                let h = parsed.h;
                let m = parsed.m;
                if (poopTimeInputMode === 'list' && poopModalRefs.timeSelectOptions?.length) {
                    const rounded = Math.round(m / 15) * 15;
                    if (rounded >= 60) {
                        m = 0;
                        h = (h + 1) % 24;
                    } else {
                        m = rounded;
                    }
                }
                const formatted = formatTimeValue(h, m);
                const hourCol = poopModalRefs.timeWheel?.querySelector('[data-part="hour"]');
                const minuteCol = poopModalRefs.timeWheel?.querySelector('[data-part="minute"]');
                const hourList = hourCol?.querySelector('.time-wheel-list');
                const minuteList = minuteCol?.querySelector('.time-wheel-list');
                if (hourList) hourList.scrollTop = h * TIME_WHEEL_ITEM_HEIGHT;
                if (minuteList) minuteList.scrollTop = m * TIME_WHEEL_ITEM_HEIGHT;
                updateWheelSelection(hourCol, h);
                updateWheelSelection(minuteCol, m);
                poopTimeValue = formatted;
                if (poopModalRefs.timeInput) poopModalRefs.timeInput.value = formatted;
                if (poopModalRefs.timeSelectOptions?.length) {
                    const wrap = poopModalRefs.timeSelect;
                    const btn = poopModalRefs.timeSelectBtn;
                    const menu = poopModalRefs.timeSelectMenu;
                    if (wrap && btn && menu) {
                        const opt = poopModalRefs.timeSelectOptions.find((item) => item.value === formatted) || poopModalRefs.timeSelectOptions[0];
                        if (opt) {
                            wrap.dataset.value = opt.value;
                            btn.textContent = opt.label;
                            menu.querySelectorAll('.cs-opt').forEach((item) => {
                                item.setAttribute('aria-selected', String(item.dataset.value === opt.value));
                            });
                        }
                    }
                }
            };

            const setTimeInputMode = (mode) => {
                poopTimeInputMode = mode === 'list' ? 'list' : 'wheel';
                poopModalRefs.timeModeToggle?.classList.toggle('toggle-on', poopTimeInputMode === 'list');
                if (poopModalRefs.timeModeLabel) {
                    poopModalRefs.timeModeLabel.textContent = poopTimeInputMode === 'list' ? 'Список' : 'Колесо';
                }
                poopModalRefs.timeWheelWrap?.classList.toggle('hidden', poopTimeInputMode === 'list');
                poopModalRefs.timeSelectWrap?.classList.toggle('hidden', poopTimeInputMode !== 'list');
                setTime(poopTimeValue || defaultTime());
            };

            const syncDurationFromWheel = () => {
                const minuteCol = poopModalRefs.durationWheel?.querySelector('[data-part="minute"]');
                const secondCol = poopModalRefs.durationWheel?.querySelector('[data-part="second"]');
                const m = updateWheelSelection(minuteCol);
                const s = updateWheelSelection(secondCol);
                const total = m * 60 + s;
                poopDurationValue = total;
                if (poopModalRefs.durationSecondsInput) poopModalRefs.durationSecondsInput.value = String(total);
                if (poopModalRefs.durationInput) poopModalRefs.durationInput.value = String(m);
            };

            const buildDurationWheel = () => {
                const minuteCol = poopModalRefs.durationWheel?.querySelector('[data-part="minute"]');
                const secondCol = poopModalRefs.durationWheel?.querySelector('[data-part="second"]');
                buildWheelList(minuteCol, DURATION_MAX_MINUTES + 1, syncDurationFromWheel);
                buildWheelList(secondCol, 60, syncDurationFromWheel);
            };

            const setDurationSeconds = (totalSeconds) => {
                const safeSeconds = Math.max(0, Math.min(DURATION_MAX_MINUTES * 60 + 59, Number(totalSeconds) || 0));
                const m = Math.floor(safeSeconds / 60);
                const s = safeSeconds % 60;
                const minuteCol = poopModalRefs.durationWheel?.querySelector('[data-part="minute"]');
                const secondCol = poopModalRefs.durationWheel?.querySelector('[data-part="second"]');
                const minuteList = minuteCol?.querySelector('.time-wheel-list');
                const secondList = secondCol?.querySelector('.time-wheel-list');
                if (minuteList) minuteList.scrollTop = m * TIME_WHEEL_ITEM_HEIGHT;
                if (secondList) secondList.scrollTop = s * TIME_WHEEL_ITEM_HEIGHT;
                updateWheelSelection(minuteCol, m);
                updateWheelSelection(secondCol, s);
                poopDurationValue = safeSeconds;
                if (poopModalRefs.durationSecondsInput) poopModalRefs.durationSecondsInput.value = String(safeSeconds);
                if (poopModalRefs.durationInput) poopModalRefs.durationInput.value = String(m);
            };

            const syncPaperFromWheel = () => {
                const paperCol = poopModalRefs.paperWheel?.querySelector('[data-part="paper"]');
                const val = updateWheelSelection(paperCol);
                poopPaperValue = val;
                if (poopModalRefs.paperInput) poopModalRefs.paperInput.value = String(val);
            };

            const buildPaperWheel = () => {
                const paperCol = poopModalRefs.paperWheel?.querySelector('[data-part="paper"]');
                buildWheelList(paperCol, PAPER_MAX_COUNT + 1, syncPaperFromWheel, (n) => String(n));
            };

            const setPaperValue = (val) => {
                const num = Number(val);
                const safe = Number.isFinite(num) ? Math.max(0, Math.min(PAPER_MAX_COUNT, Math.round(num))) : 1;
                const paperCol = poopModalRefs.paperWheel?.querySelector('[data-part="paper"]');
                const paperList = paperCol?.querySelector('.time-wheel-list');
                if (paperList) paperList.scrollTop = safe * TIME_WHEEL_ITEM_HEIGHT;
                updateWheelSelection(paperCol, safe);
                poopPaperValue = safe;
                if (poopModalRefs.paperInput) poopModalRefs.paperInput.value = String(safe);
            };

            const renderEmojiScale = (scaleEl, value, hover) => {
                if (!scaleEl) return;
                scaleEl.querySelectorAll('[data-scale-value]').forEach((seg) => {
                    const val = Number(seg.dataset.scaleValue);
                    seg.classList.toggle('is-active', value && val <= value);
                    seg.classList.toggle('is-hover', hover && val <= hover);
                });
            };

            const renderSizeScale = () => {
                if (!poopModalRefs.sizeScale) return;
                poopModalRefs.sizeScale.querySelectorAll('[data-size]').forEach((seg) => {
                    const val = Number(seg.dataset.size);
                    seg.classList.toggle('is-active', poopSizeValue && val <= poopSizeValue);
                    seg.classList.toggle('is-hover', poopSizeHover && val <= poopSizeHover);
                });
                if (poopModalRefs.sizeValueLabel) poopModalRefs.sizeValueLabel.textContent = poopSizeValue ? String(poopSizeValue) : '—';
            };

            const setEaseValue = (val) => {
                const num = Number(val);
                poopEaseValue = Number.isFinite(num) && num > 0 ? num : null;
                renderEmojiScale(poopModalRefs.easeScale, poopEaseValue, poopEaseHover);
                if (poopModalRefs.easeValueLabel) poopModalRefs.easeValueLabel.textContent = poopEaseValue ? String(poopEaseValue) : '—';
            };

            const setSatisfactionValue = (val) => {
                const num = Number(val);
                poopSatisfactionValue = Number.isFinite(num) && num > 0 ? num : null;
                renderEmojiScale(poopModalRefs.satisfactionScale, poopSatisfactionValue, poopSatisfactionHover);
                if (poopModalRefs.satisfactionValueLabel) poopModalRefs.satisfactionValueLabel.textContent = poopSatisfactionValue ? String(poopSatisfactionValue) : '—';
            };

            const setSizeValue = (val) => {
                const num = Number(val);
                poopSizeValue = Number.isFinite(num) && num > 0 ? num : null;
                renderSizeScale();
            };

            const renderBristolOptions = () => {
                if (!poopModalRefs.bristolOptions) return;
                poopModalRefs.bristolOptions.innerHTML = '';
                Object.entries(BRISTOL).forEach(([value, meta]) => {
                    const item = document.createElement('label');
                    item.className = 'bristol-option';
                    item.innerHTML = `
                        <input class="sr-only" type="radio" name="bristol" value="${value}">
                        <span class="bristol-icon">${meta.icon}</span>
                        <span>
                            <strong>Тип ${value}</strong><br>
                            <span>${meta.title}</span>
                        </span>
                    `;
                    item.addEventListener('click', () => {
                        poopModalRefs.bristolOptions.querySelectorAll('.bristol-option').forEach((opt) => opt.classList.remove('is-active'));
                        item.classList.add('is-active');
                    });
                    poopModalRefs.bristolOptions.appendChild(item);
                });
            };

            const initScaleInteractions = () => {
                const bindScale = (scaleEl, setter, hoverSetter) => {
                    if (!scaleEl) return;
                    scaleEl.querySelectorAll('[data-scale-value]').forEach((seg) => {
                        seg.addEventListener('pointerenter', () => {
                            if (hoverSetter) hoverSetter(Number(seg.dataset.scaleValue));
                        });
                        seg.addEventListener('pointerleave', () => {
                            if (hoverSetter) hoverSetter(0);
                        });
                        seg.addEventListener('click', () => setter(Number(seg.dataset.scaleValue)));
                    });
                };
                bindScale(poopModalRefs.easeScale, setEaseValue, (val) => {
                    poopEaseHover = val;
                    renderEmojiScale(poopModalRefs.easeScale, poopEaseValue, poopEaseHover);
                });
                bindScale(poopModalRefs.satisfactionScale, setSatisfactionValue, (val) => {
                    poopSatisfactionHover = val;
                    renderEmojiScale(poopModalRefs.satisfactionScale, poopSatisfactionValue, poopSatisfactionHover);
                });
                if (poopModalRefs.sizeScale) {
                    poopModalRefs.sizeScale.querySelectorAll('[data-size]').forEach((seg) => {
                        seg.addEventListener('pointerenter', () => {
                            poopSizeHover = Number(seg.dataset.size);
                            renderSizeScale();
                        });
                        seg.addEventListener('pointerleave', () => {
                            poopSizeHover = 0;
                            renderSizeScale();
                        });
                        seg.addEventListener('click', () => setSizeValue(Number(seg.dataset.size)));
                    });
                }
            };

            const initDrawing = () => {
                const canvas = poopModalRefs.drawingCanvas;
                if (!canvas) return;
                poopDrawingCtx = canvas.getContext('2d');
                if (!poopDrawingCtx) return;
                poopDrawingCtx.lineCap = 'round';
                poopDrawingCtx.lineJoin = 'round';
                poopDrawingCtx.fillStyle = '#000';
                poopDrawingCtx.fillRect(0, 0, canvas.width, canvas.height);

                const setTool = (tool) => {
                    poopDrawingTool = tool;
                };
                const setColor = (color) => {
                    poopDrawingColor = color;
                };
                poopModalRefs.drawingToolButtons?.forEach((btn) => {
                    btn.addEventListener('click', () => setTool(btn.dataset.drawingTool));
                });
                poopModalRefs.drawingColorButtons?.forEach((btn) => {
                    btn.addEventListener('click', () => setColor(btn.dataset.color));
                });
                if (poopModalRefs.drawingClear) {
                    poopModalRefs.drawingClear.addEventListener('click', () => {
                        poopDrawingCtx.clearRect(0, 0, canvas.width, canvas.height);
                        poopDrawingCtx.fillStyle = '#000';
                        poopDrawingCtx.fillRect(0, 0, canvas.width, canvas.height);
                        poopDrawingHasContent = false;
                    });
                }

                const startDraw = (x, y) => {
                    if (!poopDrawingCtx) return;
                    poopDrawingActive = true;
                    poopDrawingCtx.beginPath();
                    poopDrawingCtx.moveTo(x, y);
                };
                const draw = (x, y) => {
                    if (!poopDrawingActive || !poopDrawingCtx) return;
                    if (poopDrawingTool === 'fill') {
                        poopDrawingCtx.fillStyle = poopDrawingColor;
                        poopDrawingCtx.fillRect(0, 0, canvas.width, canvas.height);
                        poopDrawingHasContent = true;
                        poopDrawingActive = false;
                        return;
                    }
                    if (poopDrawingTool === 'eraser') {
                        poopDrawingCtx.globalCompositeOperation = 'destination-out';
                        poopDrawingCtx.lineWidth = poopEraserSize;
                        poopDrawingCtx.strokeStyle = 'rgba(0,0,0,1)';
                    } else {
                        poopDrawingCtx.globalCompositeOperation = 'source-over';
                        const width = poopDrawingTool === 'marker' ? 10 : 4;
                        const opacity = poopDrawingTool === 'marker' ? 0.7 : 1;
                        poopDrawingCtx.lineWidth = width;
                        poopDrawingCtx.strokeStyle = poopDrawingColor;
                        poopDrawingCtx.globalAlpha = opacity;
                    }
                    poopDrawingCtx.lineTo(x, y);
                    poopDrawingCtx.stroke();
                    poopDrawingHasContent = true;
                };
                const endDraw = () => {
                    if (!poopDrawingCtx) return;
                    poopDrawingCtx.globalCompositeOperation = 'source-over';
                    poopDrawingCtx.globalAlpha = 1;
                    poopDrawingActive = false;
                };
                poopModalRefs.drawingStart = startDraw;
                poopModalRefs.drawingMove = draw;
                poopModalRefs.drawingEnd = endDraw;

                const getPos = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    return {
                        x: (e.clientX - rect.left) * (canvas.width / rect.width),
                        y: (e.clientY - rect.top) * (canvas.height / rect.height)
                    };
                };
                canvas.addEventListener('pointerdown', (e) => {
                    const pos = getPos(e);
                    startDraw(pos.x, pos.y);
                    e.preventDefault();
                });
                canvas.addEventListener('pointermove', (e) => {
                    if (!poopDrawingActive) return;
                    const pos = getPos(e);
                    draw(pos.x, pos.y);
                    e.preventDefault();
                });
                canvas.addEventListener('pointerup', endDraw);
                canvas.addEventListener('pointerleave', endDraw);
                canvas.addEventListener('pointercancel', endDraw);
            };

            const bristolIconSvg = (type) => {
                const base = 'stroke="rgba(245,158,11,0.7)" fill="rgba(245,158,11,0.35)" stroke-width="1.5"';
                switch (type) {
                    case '1': return `<svg viewBox="0 0 48 28"><circle cx="12" cy="16" r="6" ${base}/><circle cx="23" cy="12" r="5.5" ${base}/><circle cx="32" cy="17" r="5.5" ${base}/></svg>`;
                    case '2': return `<svg viewBox="0 0 48 28"><rect x="10" y="9" width="28" height="12" rx="6" ${base}/><path d="M16 11c2 2 0 5 3 6" ${base}/><path d="M30 12c-1 2 2 4 0 6" ${base}/></svg>`;
                    case '3': return `<svg viewBox="0 0 48 28"><rect x="8" y="9" width="32" height="12" rx="6" ${base}/><path d="M16 11l3 5M26 10l-2 7M34 12l-1 6" ${base}/></svg>`;
                    case '4': return `<svg viewBox="0 0 48 28"><rect x="8" y="8" width="32" height="12" rx="6" ${base.replace('0.35','0.45')}/></svg>`;
                    case '5': return `<svg viewBox="0 0 48 28"><circle cx="15" cy="14" r="6" ${base}/><circle cx="25" cy="12" r="5" ${base}/><circle cx="32" cy="15" r="5.5" ${base}/></svg>`;
                    case '6': return `<svg viewBox="0 0 48 28"><circle cx="8" cy="16" r="3" ${base}/><circle cx="14" cy="12" r="2.5" ${base}/><circle cx="20" cy="16" r="3" ${base}/><circle cx="26" cy="11" r="2.5" ${base}/><circle cx="30" cy="16" r="3" ${base}/><circle cx="36" cy="12" r="2.5" ${base}/><circle cx="40" cy="17" r="2.5" ${base}/><circle cx="23" cy="20" r="2.5" ${base}/></svg>`;
                    case '7': return `<svg viewBox="0 0 48 28"><path d="M8 15c4-5 10 1 14-1s7-5 12-2 6 7 1 8-9-4-14-2-10 4-13-3z" ${base.replace('0.35','0.25')}/></svg>`;
                    default: return '';
                }
            };

            function bristolIcon(type) {
                return bristolIconSvg(type);
            }

            const BRISTOL = {
                1: { title: 'Отдельные твёрдые комки', icon: bristolIcon('1') },
                2: { title: 'Колбаска с буграми', icon: bristolIcon('2') },
                3: { title: 'Колбаска с трещинами', icon: bristolIcon('3') },
                4: { title: 'Гладкая мягкая колбаска', icon: bristolIcon('4') },
                5: { title: 'Мягкие кусочки', icon: bristolIcon('5') },
                6: { title: 'Кашицеобразные кусочки', icon: bristolIcon('6') },
                7: { title: 'Водянистый', icon: bristolIcon('7') }
            };

            renderBristolOptions();
            buildTimeWheel();
            buildTimeSelectOptions();
            buildDurationWheel();
            buildPaperWheel();
            initScaleInteractions();
            initDrawing();

            poopModalRefs.setTime = setTime;
            poopModalRefs.setTimeInputMode = setTimeInputMode;
            poopModalRefs.setDurationSeconds = setDurationSeconds;
            poopModalRefs.setPaperValue = setPaperValue;
            poopModalRefs.setEaseValue = setEaseValue;
            poopModalRefs.setSatisfactionValue = setSatisfactionValue;
            poopModalRefs.setSizeValue = setSizeValue;
            poopModalRefs.defaultTime = defaultTime;

            setTimeInputMode(poopTimeInputMode);
            setTime(defaultTime());
            setDurationSeconds(0);
            setPaperValue(1);
            setEaseValue(null);
            setSatisfactionValue(null);
            setSizeValue(null);

            if (poopModalRefs.timeModeToggle) {
                poopModalRefs.timeModeToggle.addEventListener('click', () => {
                    const next = poopTimeInputMode === 'list' ? 'wheel' : 'list';
                    setTimeInputMode(next);
                });
            }
            poopModalRefs.drawingToggle?.addEventListener('click', () => {
                const open = !poopModalRefs.drawingPanel.classList.contains('open');
                poopModalRefs.drawingPanel.classList.toggle('open', open);
            });
            poopModalRefs.closeBtn?.addEventListener('click', closePoopAddModal3D);
            poopModalRefs.cancelBtn?.addEventListener('click', closePoopAddModal3D);
            poopModalRefs.anonToggle?.addEventListener('click', () => {
                poopAnonymityOn = !poopAnonymityOn;
                poopModalRefs.anonToggle.classList.toggle('toggle-on', poopAnonymityOn);
            });
            poopModalRefs.form?.addEventListener('submit', (event) => {
                event.preventDefault();
                addPoopFrom3DModal();
            });
        }

        function resetPoopAddModalForm() {
            if (!poopModalRefs?.form) return;
            poopModalRefs.form.reset();
            poopTimeValue = '';
            poopDurationValue = 0;
            poopPaperValue = 1;
            poopSizeValue = null;
            poopEaseValue = null;
            poopSatisfactionValue = null;
            poopSizeHover = 0;
            poopEaseHover = 0;
            poopSatisfactionHover = 0;
            poopAnonymityOn = false;
            poopModalRefs.anonToggle?.classList.remove('toggle-on');
            poopModalRefs.drawingPanel?.classList.remove('open');
            poopModalRefs.root?.querySelectorAll('.cs.open').forEach((node) => {
                node.classList.remove('open');
                const btn = node.querySelector('.cs-btn');
                if (btn) btn.setAttribute('aria-expanded', 'false');
            });
            if (poopModalRefs.drawingInput) poopModalRefs.drawingInput.value = '';
            if (poopDrawingCtx && poopModalRefs.drawingCanvas) {
                poopDrawingCtx.clearRect(0, 0, poopModalRefs.drawingCanvas.width, poopModalRefs.drawingCanvas.height);
                poopDrawingCtx.fillStyle = '#000';
                poopDrawingCtx.fillRect(0, 0, poopModalRefs.drawingCanvas.width, poopModalRefs.drawingCanvas.height);
            }
            poopDrawingHasContent = false;
            poopModalRefs.setTimeInputMode?.(poopTimeInputMode);
            poopModalRefs.setTime?.(poopModalRefs.defaultTime?.() || '');
            poopModalRefs.setDurationSeconds?.(0);
            poopModalRefs.setPaperValue?.(1);
            poopModalRefs.setEaseValue?.(null);
            poopModalRefs.setSatisfactionValue?.(null);
            poopModalRefs.setSizeValue?.(null);
        }

        function addPoopFrom3DModal() {
            if (!poopModalRefs?.form) return;
            if (poopModalRefs.drawingInput && poopModalRefs.drawingCanvas) {
                if (poopDrawingHasContent) {
                    poopModalRefs.drawingInput.value = poopModalRefs.drawingCanvas.toDataURL('image/png');
                } else {
                    poopModalRefs.drawingInput.value = '';
                }
            }
            const formData = new FormData(poopModalRefs.form);
            const durationSeconds = Number(formData.get('durationSeconds') || 0);
            const sizeVal = Number(formData.get('size') || 0);
            if (!durationSeconds) {
                alert('Укажи продолжительность покака.');
                return;
            }
            if (!sizeVal) {
                alert('Укажи размер покака.');
                return;
            }
            const dateKey = (() => {
                const now = new Date();
                const pad = (n) => String(n).padStart(2, '0');
                return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
            })();
            const currentUser = (() => {
                try {
                    return JSON.parse(localStorage.getItem('currentUser') || '{}');
                } catch (_) {
                    return {};
                }
            })();
            const entry = {
                time: formData.get('time') || '',
                duration: Math.floor(durationSeconds / 60),
                durationSeconds,
                paper: Number(formData.get('paper') || 0),
                ease: Number(formData.get('ease') || 0),
                satisfaction: Number(formData.get('satisfaction') || 0),
                size: sizeVal,
                bristol: Number(formData.get('bristol') || 0),
                comment: (formData.get('comment') || '').trim(),
                drawing: formData.get('drawing') || '',
                createdAt: new Date().toISOString(),
                author: currentUser?.username || '',
                authorName: poopAnonymityOn ? 'Аноним' : (currentUser?.name || currentUser?.username || 'Аноним')
            };
            if (!firebase?.database) {
                alert('Сеть недоступна, попробуй позже.');
                return;
            }
            firebase.database().ref(`poopSchedule/${dateKey}`).push(entry);
            closePoopAddModal3D();
        }

        function positionPoopAddModalInFront() {
            if (!poopAddAnchor || !camera) return;
            const cameraWorld = new THREE.Vector3();
            camera.getWorldPosition(cameraWorld);
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            const target = poopModalAnchorPos ? poopModalAnchorPos.clone() : cameraWorld.clone().addScaledVector(forward, 1.6);
            let yaw = yawObject?.rotation?.y || 0;
            if (poopModalAnchorPos && poopModalAnchorYaw !== null) {
                yaw = poopModalAnchorYaw;
            } else if (!poopModalAnchorPos) {
                const toCam = cameraWorld.clone().sub(target);
                toCam.y = 0;
                yaw = toCam.lengthSq() > 1e-4 ? Math.atan2(toCam.x, toCam.z) : yaw;
            }
            poopAddAnchor.position.copy(target);
            poopAddAnchor.rotation.set(0, yaw, 0);
            if (poopAddHitMesh) {
                poopAddHitMesh.position.copy(target);
                poopAddHitMesh.rotation.set(0, yaw, 0);
            }
        }

        function setPoopModalAnchorFromToilet() {
            if (!toiletData || !camera) {
                poopModalAnchorPos = null;
                poopModalAnchorYaw = null;
                return;
            }
            const forward = toiletData.forward ? toiletData.forward.clone() : new THREE.Vector3(0, 0, 1);
            const dist = ((toiletData.radius || 0.5) + 2.0) * 3;
            const target = toiletData.position.clone().addScaledVector(forward, dist);
            target.y = toiletData.topY + eyeHeight * 0.25;
            const back = forward.clone().multiplyScalar(-1);
            poopModalAnchorYaw = Math.atan2(back.x, back.z);
            poopModalAnchorPos = target;
        }

        function setupPoopAddModal3D() {
            if (poopAddObject || !ensureCssRenderer()) return;
            const el = buildPoopAddModalElement();
            poopAddObject = new THREE.CSS3DObject(el);
            poopAddObject.scale.set(0.01, 0.01, 0.01);
            poopAddAnchor = new THREE.Group();
            poopAddAnchor.add(poopAddObject);
            cssScene.add(poopAddAnchor);
            if (!poopAddHitMesh) {
                const hitGeo = new THREE.PlaneGeometry(POOP_MODAL_WIDTH, POOP_MODAL_HEIGHT);
                const hitMat = new THREE.MeshBasicMaterial({
                    transparent: true,
                    opacity: 0,
                    depthWrite: false,
                    side: THREE.DoubleSide
                });
                poopAddHitMesh = new THREE.Mesh(hitGeo, hitMat);
                poopAddHitMesh.visible = false;
                scene.add(poopAddHitMesh);
            } else {
                const nextGeo = new THREE.PlaneGeometry(POOP_MODAL_WIDTH, POOP_MODAL_HEIGHT);
                poopAddHitMesh.geometry.dispose();
                poopAddHitMesh.geometry = nextGeo;
            }
            positionPoopAddModalInFront();
        }

        function openPoopAddModal3D() {
            setupPoopAddModal3D();
            if (!poopAddObject) return;
            initPoopAddModalUI();
            isPoopAddOpen = true;
            poopModalSuppressed = false;
            setPoopModalAnchorFromToilet();
            positionPoopAddModalInFront();

                reticleEl.style.left = '50%';
                reticleEl.style.top = '50%';
                reticleEl.style.transform = '';
            }
            moveState.forward = false;
            moveState.back = false;
            moveState.left = false;
            moveState.right = false;
            moveState.fast = false;
            resetPoopAddModalForm();
            requestAnimationFrame(() => {
                if (!isPoopAddOpen) return;

        function closePoopAddModal3D() {
            if (!poopAddObject) return;
            isPoopAddOpen = false;
            poopModalSuppressed = true;
            poopModalAnchorPos = null;
            poopModalAnchorYaw = null;

            if (active && active.closest && active.closest('.poop-add-3d') && active.blur) {
                active.blur();
            }
            updateBeerAddPointerEvents();
            document.body.classList.remove('poop-ui-active');

            if (reticleEl) {
                reticleEl.style.left = '50%';
                reticleEl.style.top = '50%';
                reticleEl.style.transform = '';

        function updateBeerBoard() {
            if (!boardGroup) return;
            if (!beerData.length) {
                boardContentGroup.clear();
                if (boardCssContentEl) {
                    boardCssContentEl.innerHTML = '';
                    boardCssContentEl.style.transform = 'translateX(0px)';
                }
                return;
            }
            const prevTarget = boardScrollState.target;
            const prevOffset = boardScrollState.offset;
            boardContentGroup.clear();
            ensureBoardCssGroup();
            if (boardCssContentEl) {
                boardCssContentEl.innerHTML = '';
            }
            const boardWidth = boardGroup.userData.boardWidth || room.width * 0.7;
            const innerWidth = boardGroup.userData.innerWidth || (boardWidth - 4.4);
            const innerHeight = boardGroup.userData.innerHeight || 6;
            const gap = 0.2;
            const itemWidth = Math.min(2.6, Math.max(1.9, innerWidth / Math.min(beerData.length, 22)));
            const titleAspect = BEER_TITLE_CANVAS.width / BEER_TITLE_CANVAS.height;
            const infoAspect = BEER_INFO_CANVAS.width / BEER_INFO_CANVAS.height;
            const titleWidth = itemWidth * 0.98;
            const titleHeight = titleWidth / titleAspect;
            const infoWidth = itemWidth * 1.02;
            const infoHeight = infoWidth / infoAspect;
            const totalWidth = itemWidth * beerData.length + gap * (beerData.length - 1);
            boardScrollState.maxOffset = Math.max(0, (totalWidth - innerWidth) / 2);
            boardScrollState.step = itemWidth + gap;
            const maxOffset = boardScrollState.maxOffset || 0;
            const clampOffset = (value) => Math.max(-maxOffset, Math.min(maxOffset, value));
            if (boardScrollState.initialized) {
                const nextTarget = Number.isFinite(prevTarget) ? prevTarget : prevOffset;
                const nextOffset = Number.isFinite(prevOffset) ? prevOffset : nextTarget;
                boardScrollState.target = clampOffset(Number.isFinite(nextTarget) ? nextTarget : 0);
                boardScrollState.offset = clampOffset(Number.isFinite(nextOffset) ? nextOffset : boardScrollState.target);
            } else {
                boardScrollState.target = maxOffset;
                boardScrollState.offset = boardScrollState.target;
                boardScrollState.initialized = true;
            }
            boardContentGroup.position.x = boardScrollState.offset;
            if (boardCssContentEl) {
                const pxPerUnit = boardCssGroup?.userData?.pxPerUnit || 120;
                boardCssContentEl.style.width = `${Math.max(200, Math.round(totalWidth * pxPerUnit))}px`;
                boardCssContentEl.style.transform = `translateX(${boardScrollState.offset * pxPerUnit}px)`;
            }

            const startX = -totalWidth / 2 + itemWidth / 2;
            beerData.forEach((beer, i) => {
                const group = new THREE.Group();
                group.position.set(startX + i * (itemWidth + gap), 0, 0);
                const bottle = createBottleMesh(beer);
                const bottleYOffset = 0.25;
                bottle.position.set(0, bottleYOffset, 0);
                group.add(bottle);
                if (boardCssContentEl) {
                    const pxPerUnit = boardCssGroup?.userData?.pxPerUnit || 120;
                    const imgWidthUnits = 1.35;
                    const imgHeightUnits = 2.5;
                    const imgWidthPx = imgWidthUnits * pxPerUnit;
                    const imgHeightPx = imgHeightUnits * pxPerUnit;
                    const offsetX = group.position.x;
                    const offsetY = bottleYOffset;
                    const leftPx = (offsetX + innerWidth / 2) * pxPerUnit - imgWidthPx / 2;
                    const topPx = (innerHeight / 2 - offsetY) * pxPerUnit - imgHeightPx / 2;

                    const item = document.createElement('div');
                    item.className = 'board-css-item';
                    item.style.width = `${imgWidthPx}px`;
                    item.style.height = `${imgHeightPx}px`;
                    item.style.left = `${leftPx}px`;
                    item.style.top = `${topPx}px`;

                    const img = document.createElement('img');
                    img.src = (beer?.imageUrl || '').trim();
                    img.alt = '';
                    img.decoding = 'async';
                    img.loading = 'eager';
                    item.appendChild(img);
                    boardCssContentEl.appendChild(item);
                }

                const bottleBottom = bottleYOffset - 1.25;
                const titleGap = 0.16;
                const infoGap = 0.18;
                const titleY = bottleBottom - titleGap - titleHeight / 2;
                const infoY = titleY - titleHeight / 2 - infoGap - infoHeight / 2;

                const titleTex = createBeerTitleTexture(beer);
                const titleMat = new THREE.MeshBasicMaterial({ map: titleTex, transparent: true });
                applyBoardStencil(titleMat);
                const titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(titleWidth, titleHeight), titleMat);
                titleMesh.position.set(0, titleY, 0.02);
                group.add(titleMesh);

                const infoTex = createBeerInfoTexture(beer);
                const infoMat = new THREE.MeshBasicMaterial({ map: infoTex, transparent: true });
                applyBoardStencil(infoMat);
                const infoMesh = new THREE.Mesh(new THREE.PlaneGeometry(infoWidth, infoHeight), infoMat);
                infoMesh.position.set(0, infoY, 0.02);
                group.add(infoMesh);

                boardContentGroup.add(group);
            });
            applyBoardStencilToGroup();
        }

        function applyBoardStencilToGroup() {
            if (!boardContentGroup || !boardClipMesh) return;
            boardContentGroup.traverse((obj) => {
                if (!obj.isMesh) return;
                obj.renderOrder = 2;
                const material = obj.material;
                if (Array.isArray(material)) {
                    material.forEach((mat) => applyBoardStencil(mat));
                } else {
                    applyBoardStencil(material);
                }
            });
        }

        function applyBoardClipping(material) {
            if (!material || !boardClipPlanes) return;
            material.clippingPlanes = boardClipPlanes;
            material.clipIntersection = true;
            material.needsUpdate = true;
        }

        function applyBoardStencil(material) {
            if (!material) return;
            material.stencilWrite = true;
            material.stencilRef = boardStencilRef;
            material.stencilFunc = THREE.EqualStencilFunc;
            material.stencilFail = THREE.KeepStencilOp;
            material.stencilZFail = THREE.KeepStencilOp;
            material.stencilZPass = THREE.KeepStencilOp;
            material.needsUpdate = true;
        }

        function updateBeerBoardArrows() {
            if (!boardArrowMeshes.length) return;
            const maxOffset = boardScrollState.maxOffset || 0;
            const offset = boardScrollState.target || 0;
            boardArrowMeshes.forEach((arrow) => {
                if (!arrow.userData.scrollDir) return;
                if (maxOffset <= 0) {
                    arrow.visible = false;
                    return;
                }
                if (arrow.userData.scrollDir > 0) {
                    arrow.visible = offset < maxOffset - 0.05;
                } else {
                    arrow.visible = offset > -maxOffset + 0.05;
                }
            });
        }

        function ensureBoardCssGroup() {
            if (!boardContentGroup) return null;
            if (!ensureCssRenderer()) return null;
            if (cssRenderer?.domElement) {
                const masks = Array.from(cssRenderer.domElement.querySelectorAll('.board-css-mask'));
                if (masks.length > 1) {
                    masks.forEach((node) => node.remove());
                    boardCssGroup = null;
                    boardCssMaskObject = null;
                    boardCssMaskEl = null;
                    boardCssContentEl = null;
                } else if (masks.length === 1 && boardCssMaskEl && masks[0] !== boardCssMaskEl) {
                    boardCssMaskEl = masks[0];
                    boardCssContentEl = boardCssMaskEl.querySelector('.board-css-content');
                }
            }
            if (cssScene) {
                const removeTargets = cssScene.children.filter((child) => child?.userData?.boardCss && child !== boardCssGroup);
                removeTargets.forEach((child) => {
                    cssScene.remove(child);
                    const maskEl = child.userData?.maskEl;
                    if (maskEl && maskEl.parentNode) {
                        maskEl.parentNode.removeChild(maskEl);
                    }
                });
            }
            if (!boardCssGroup) {
                boardCssGroup = new THREE.Group();
                const maskEl = document.createElement('div');
                maskEl.className = 'board-css-mask';
                const contentEl = document.createElement('div');
                contentEl.className = 'board-css-content';
                maskEl.appendChild(contentEl);
                boardCssMaskEl = maskEl;
                boardCssContentEl = contentEl;
                boardCssMaskObject = new THREE.CSS3DObject(maskEl);
                boardCssGroup.add(boardCssMaskObject);
                boardCssGroup.userData.boardCss = true;
                boardCssGroup.userData.maskEl = maskEl;
                cssScene.add(boardCssGroup);
            }
            const boardWidth = boardGroup?.userData?.innerWidth || 20;
            const boardHeight = boardGroup?.userData?.innerHeight || 6;
            const pxPerUnit = 120;
            boardCssGroup.userData.pxPerUnit = pxPerUnit;
            const widthPx = Math.max(200, Math.round(boardWidth * pxPerUnit));
            const heightPx = Math.max(200, Math.round(boardHeight * pxPerUnit));
            if (boardCssMaskEl) {
                boardCssMaskEl.style.width = `${widthPx}px`;
                boardCssMaskEl.style.height = `${heightPx}px`;
            }
            if (boardCssContentEl) {
                boardCssContentEl.style.width = `${Math.max(widthPx, Math.round(boardWidth * pxPerUnit))}px`;
                boardCssContentEl.style.height = `${heightPx}px`;
            }
            if (boardCssMaskObject) {
                boardCssMaskObject.scale.set(1 / pxPerUnit, 1 / pxPerUnit, 1);
            }
            boardCssGroup.position.set(
                0,
                boardContentGroup.position.y,
                boardContentGroup.position.z
            );
            boardCssGroup.rotation.copy(boardContentGroup.rotation);
            return boardCssGroup;
        }

        function applyRemoteBoardScroll(target) {
            const maxOffset = boardScrollState.maxOffset || 0;
            const clamp = (value) => Math.max(-maxOffset, Math.min(maxOffset, value));
            const next = Number.isFinite(target) ? Number(target) : 0;
            const clamped = maxOffset ? clamp(next) : next;
            boardScrollState.target = clamped;
            if (!boardScrollState.initialized) {
                boardScrollState.offset = clamped;
                boardScrollState.initialized = true;
            }
            lastBoardScrollTarget = clamped;
            lastBoardScrollSent = performance.now();
            updateBeerBoardArrows();
        }

        function sendBoardScrollUpdate(force = false) {
            if (!wsConnected) return;
            const now = performance.now();
            const target = Number.isFinite(boardScrollState.target) ? boardScrollState.target : 0;
            const delta = Math.abs(target - (lastBoardScrollTarget ?? 0));
            if (!force) {
                if (now - lastBoardScrollSent < 120 && delta < 0.02) return;
                if (delta < 0.002) return;
            }
            lastBoardScrollSent = now;
            lastBoardScrollTarget = target;
            sendRealtime({ type: 'board_scroll', target });
        }

        function scrollBeerBoard(direction) {
            if (!boardContentGroup) return;
            const step = boardScrollState.step || 0;
            if (!step) return;
            const next = (boardScrollState.target ?? boardScrollState.offset ?? 0) + direction * step;
            const maxOffset = boardScrollState.maxOffset || 0;
            boardScrollState.target = Math.max(-maxOffset, Math.min(maxOffset, next));
            updateBeerBoardArrows();
            sendBoardScrollUpdate(true);
        }

        function startBoardScrollHold(direction) {
            boardScrollState.holdDir = direction;
            boardScrollState.speed = 8.5;
            sendBoardScrollUpdate(true);
        }

        function stopBoardScrollHold() {
            boardScrollState.holdDir = 0;
            boardScrollState.speed = 0;
            sendBoardScrollUpdate(true);
        }

        function handleBeerAddLockedClick(event) {
            if (!isBeerAddOpen || !isLocked || !beerAddHitMesh || !renderer || !camera) return false;
            if (!beerAddHitMesh.visible) return false;
            const rect = renderer.domElement.getBoundingClientRect();
            const x = rect.width / 2;
            const y = rect.height / 2;
            boardPointer.x = (x / rect.width) * 2 - 1;
            boardPointer.y = -(y / rect.height) * 2 + 1;
            boardRaycaster.setFromCamera(boardPointer, camera);
            const hits = boardRaycaster.intersectObject(beerAddHitMesh, true);
            if (!hits.length) return false;
            if (!cssRenderer?.domElement) return false;
            const cssRect = cssRenderer.domElement.getBoundingClientRect();
            const px = cssRect.left + cssRect.width / 2;
            const py = cssRect.top + cssRect.height / 2;
            const prevPointerEvents = cssRenderer.domElement.style.pointerEvents;
            cssRenderer.domElement.style.pointerEvents = 'auto';
            const elements = document.elementsFromPoint
                ? document.elementsFromPoint(px, py)
                : [document.elementFromPoint(px, py)].filter(Boolean);
            cssRenderer.domElement.style.pointerEvents = prevPointerEvents;
            const pick = (selector) => elements.find((el) => el?.matches?.(selector) || el?.closest?.(selector));
            const scoped = elements.find((el) => el?.closest && el.closest('.beer-add-3d'));
            if (!scoped) return true;
            const optionEl = pick('.cs-opt');
            if (optionEl) {
                optionEl.closest('.cs-opt')?.click?.();
                return true;
            }
            const input = pick('input');
            if (input) {
                const field = input.closest('input') || input;
                field.focus();
                if (field.select) field.select();
                return true;
            }
            const openMenu = document.querySelector('.beer-add-3d .cs.open .cs-menu');
            if (openMenu) {
                const menuRect = openMenu.getBoundingClientRect();
                if (px >= menuRect.left && px <= menuRect.right && py >= menuRect.top && py <= menuRect.bottom) {
                    const opts = Array.from(openMenu.querySelectorAll('.cs-opt'));
                    if (opts.length) {
                        const optHeight = opts[0].getBoundingClientRect().height || 24;
                        const index = Math.floor((py - menuRect.top + openMenu.scrollTop) / optHeight);
                        const pickOpt = opts[Math.max(0, Math.min(opts.length - 1, index))];
                        pickOpt?.click?.();
                        return true;
                    }
                }
            }
            const selectBtn = pick('.cs-btn');
            if (selectBtn) {
                selectBtn.closest('.cs-btn')?.click?.();
                return true;
            }
            const actionBtn = pick('.beer-add-3d button');
            if (actionBtn) {
                actionBtn.closest('.beer-add-3d button')?.click?.();
                return true;
            }
            return true;
        }

            const rect = renderer.domElement.getBoundingClientRect();
            const centerX = rect.width / 2;

            const drawBtn = pick('.poop-add-3d .drawing-tools button, .poop-add-3d .drawing-color, .poop-add-3d #poopDrawingToggle');

                drawBtn.closest('button, .drawing-color')?.click?.();
                blurPoopFocus();
                return true;
            }
            const selectBtn = pick('.poop-add-3d .cs-btn');
            if (selectBtn) {
                selectBtn.closest('.cs-btn')?.click?.();

                return true;
            }
            const openMenu = document.querySelector('.poop-add-3d .cs.open .cs-menu');
            if (openMenu) {
                const menuRect = openMenu.getBoundingClientRect();
                if (px >= menuRect.left && px <= menuRect.right && py >= menuRect.top && py <= menuRect.bottom) {
                    const opts = Array.from(openMenu.querySelectorAll('.cs-opt'));
                    if (opts.length) {
                        const optHeight = opts[0].getBoundingClientRect().height || 24;
                        const index = Math.floor((py - menuRect.top + openMenu.scrollTop) / optHeight);
                        const pickOpt = opts[Math.max(0, Math.min(opts.length - 1, index))];
                        pickOpt?.click?.();
                        blurPoopFocus();
                        return true;
                    }
                }
            }
            const actionBtn = pick('.poop-add-3d .poop-btn');
            if (actionBtn) {
                actionBtn.closest('.poop-btn')?.click?.();
                blurPoopFocus();
                return true;
            }
            const input = pick('.poop-add-3d input, .poop-add-3d textarea');
            if (input) {
                const field = input.closest('input, textarea, select') || input;
                field.focus?.();
                if (field.select) field.select();
                return true;
            }
            blurPoopFocus();
            return true;
        }

        function getPoopReticleElements() {
            if (!renderer || !cssRenderer?.domElement) return null;
            const rect = renderer.domElement.getBoundingClientRect();
            const px = rect.left + rect.width / 2;
            const py = rect.top + rect.height / 2;
            const prevPointerEvents = cssRenderer.domElement.style.pointerEvents;
            const cameraRoot = cssRenderer.domElement.firstElementChild;
            const prevCameraPointer = cameraRoot?.style.pointerEvents;
            cssRenderer.domElement.style.pointerEvents = 'auto';
            if (cameraRoot) cameraRoot.style.pointerEvents = 'auto';
            const elements = document.elementsFromPoint
                ? document.elementsFromPoint(px, py)
                : [document.elementFromPoint(px, py)].filter(Boolean);
            cssRenderer.domElement.style.pointerEvents = prevPointerEvents;
            if (cameraRoot && prevCameraPointer !== undefined) cameraRoot.style.pointerEvents = prevCameraPointer;
            return { elements, px, py };
        }

        function getPoopCanvasReticlePos() {
            const hit = getPoopReticleElements();
            if (!hit) return null;
            const canvasEl = hit.elements.find((el) => el?.id === 'poopDrawingCanvas' || el?.closest?.('#poopDrawingCanvas'));
            const canvas = canvasEl?.id === 'poopDrawingCanvas' ? canvasEl : canvasEl?.closest?.('#poopDrawingCanvas');
            if (!canvas) return null;
            const rect = canvas.getBoundingClientRect();
            let x = (hit.px - rect.left) * (canvas.width / rect.width);
            let y = (hit.py - rect.top) * (canvas.height / rect.height);
            x = Math.max(0, Math.min(canvas.width, x));
            y = Math.max(0, Math.min(canvas.height, y));
            return { canvas, x, y };
        }

        function handlePoopDrawingPointerDown(event) {
            if (!isPoopAddOpen || !poopModalRefs?.drawingPanel?.classList.contains('open')) return false;
            const info = getPoopCanvasReticlePos();
            if (!info || info.canvas !== poopModalRefs.drawingCanvas) return false;
            poopDrawingReticleActive = true;
            poopModalRefs.drawingStart?.(info.x, info.y);
            return true;
        }

        function handlePoopDrawingPointerMove() {
            if (!poopDrawingReticleActive) return false;
            const info = getPoopCanvasReticlePos();
            if (!info || info.canvas !== poopModalRefs.drawingCanvas) return false;
            poopModalRefs.drawingMove?.(info.x, info.y);
            return true;
        }

        function handlePoopDrawingPointerUp() {
            if (!poopDrawingReticleActive) return false;
            poopDrawingReticleActive = false;
            poopModalRefs.drawingEnd?.();
            return true;
        }

        function handleBeerBoardClick(event) {
            if ((!boardArrowMeshes.length && !boardActionMeshes.length) || !renderer || !camera) return false;
            const rect = renderer.domElement.getBoundingClientRect();
            let x = rect.width / 2;
            let y = rect.height / 2;
            if (!isLocked && event) {
                x = event.clientX - rect.left;
                y = event.clientY - rect.top;
            }
            boardPointer.x = (x / rect.width) * 2 - 1;
            boardPointer.y = -(y / rect.height) * 2 + 1;
            boardRaycaster.setFromCamera(boardPointer, camera);
            if (boardActionMeshes.length) {
                const actionHits = boardRaycaster.intersectObjects(boardActionMeshes, true);
                if (actionHits.length) {
                    const target = actionHits[0].object;
                    const action = target.userData.action || target.parent?.userData?.action;
                    if (action === 'add-beer') {
                        if (event?.preventDefault) event.preventDefault();
                        if (event?.stopPropagation) event.stopPropagation();
                        openBeerAddModal3D();
                        return true;
                    }
                }
            }
            const hits = boardRaycaster.intersectObjects(boardArrowMeshes, true);
            if (!hits.length) return false;
            const target = hits[0].object;
            const dir = target.userData.scrollDir || target.parent?.userData?.scrollDir;
            if (!dir) return false;
            scrollBeerBoard(dir);
            return true;
        }

        function handleBeerAddLockedScroll(event) {
            if (!isBeerAddOpen || !isLocked) return false;
            const menu = document.querySelector('.beer-add-3d .cs.open .cs-menu');
            if (!menu) return false;
            menu.scrollTop += event.deltaY;
            return true;
        }

        function handlePoopAddLockedScroll(event) {
            if (!isPoopAddOpen || !renderer || !camera || !cssRenderer?.domElement) return false;
            const rect = renderer.domElement.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const px = rect.left + centerX;
            const py = rect.top + centerY;
            const prevPointerEvents = cssRenderer.domElement.style.pointerEvents;
            const cameraRoot = cssRenderer.domElement.firstElementChild;
            const prevCameraPointer = cameraRoot?.style.pointerEvents;
            cssRenderer.domElement.style.pointerEvents = 'auto';
            if (cameraRoot) cameraRoot.style.pointerEvents = 'auto';
            const elements = document.elementsFromPoint
                ? document.elementsFromPoint(px, py)
                : [document.elementFromPoint(px, py)].filter(Boolean);
            cssRenderer.domElement.style.pointerEvents = prevPointerEvents;
            if (cameraRoot && prevCameraPointer !== undefined) cameraRoot.style.pointerEvents = prevCameraPointer;
            const scoped = elements.find((el) => el?.closest && el.closest('.poop-add-3d'));
            if (!scoped) return false;
            let delta = event.deltaY;
            if (event.deltaMode === 1) delta *= 16;
            if (event.deltaMode === 2) delta *= 120;
            const maxStep = 48;
            delta = Math.max(-maxStep, Math.min(maxStep, delta));
            const openMenu = document.querySelector('.poop-add-3d .cs.open .cs-menu');
            if (openMenu) {
                openMenu.scrollBy({ top: delta, behavior: 'auto' });
                return true;
            }
            const activeList = document.activeElement?.closest?.('.poop-add-3d .time-wheel-list');
            if (activeList) {
                activeList.scrollBy({ top: delta, behavior: 'auto' });
                return true;
            }
            const listEl = elements.find((el) => el?.closest && el.closest('.poop-add-3d .time-wheel-list'));
            if (listEl) {
                const list = listEl.closest('.time-wheel-list');
                list.scrollBy({ top: delta, behavior: 'auto' });
                return true;
            }
            const card = elements.find((el) => el?.closest && el.closest('.poop-add-3d .poop-card'));
            if (card) {
                const wrap = card.closest('.poop-card');
                wrap.scrollBy({ top: delta, behavior: 'auto' });
                return true;
            }
            return true;
        }

        function handleBeerBoardPress(event) {
            if (!boardArrowMeshes.length || !renderer || !camera) return false;
            const rect = renderer.domElement.getBoundingClientRect();
            let x = rect.width / 2;
            let y = rect.height / 2;
            if (!isLocked && event) {
                x = event.clientX - rect.left;
                y = event.clientY - rect.top;
            }
            boardPointer.x = (x / rect.width) * 2 - 1;
            boardPointer.y = -(y / rect.height) * 2 + 1;
            boardRaycaster.setFromCamera(boardPointer, camera);
            const hits = boardRaycaster.intersectObjects(boardArrowMeshes, true);
            if (!hits.length) return false;
            const target = hits[0].object;
            const dir = target.userData.scrollDir || target.parent?.userData?.scrollDir;
            if (!dir) return false;
            startBoardScrollHold(dir);
