        function setupControls() {
            const dom = renderer.domElement;
            reticleEl = document.getElementById('reticle');
            dom.addEventListener('pointerdown', (event) => {
                const target = event.target;
                if (isPoopAddOpen) {
                    if (handlePoopDrawingPointerDown(event)) {
                        event.preventDefault();
                        return;
                    }
                    return;
                }
                if (target.closest('header') || target.closest('.modal') || target.closest('.wall-image-toolbar') || target.closest('.tools-panel')) return;
                if (handleBeerRatingPointerDown(event)) {
                    event.preventDefault();
                    return;
                }
                if (handleWallImagePointerDown(event)) {
                    event.preventDefault();
                    return;
                }
                if (handleBeerBoardPress(event)) {
                    event.preventDefault();
                    return;
                }
            });
            dom.addEventListener('wheel', (event) => {
                if ((isPoopAddOpen && handlePoopAddLockedScroll(event)) || handleBeerAddLockedScroll(event)) {
                    event.preventDefault();
                }
            }, { passive: false });
            dom.addEventListener('pointermove', (event) => {
                if (isPoopAddOpen && poopDrawingReticleActive) {
                    if (handlePoopDrawingPointerMove()) {
                        event.preventDefault();
                        return;
                    }
                }
                if (handleBeerRatingPointerMove(event)) {
                    event.preventDefault();
                    return;
                }
                handleWallImagePointerMove(event);
            });
            dom.addEventListener('pointerup', (event) => {
                if (isPoopAddOpen && handlePoopDrawingPointerUp()) {
                    event.preventDefault();
                    return;
                }
                if (handleBeerRatingPointerUp()) {
                    event.preventDefault();
                    return;
                }
                stopBoardScrollHold();
            });
            dom.addEventListener('pointerleave', () => {
                if (isPoopAddOpen) handlePoopDrawingPointerUp();
                handleBeerRatingPointerUp();
                stopBoardScrollHold();
            });
            dom.addEventListener('pointercancel', () => {
                if (isPoopAddOpen) handlePoopDrawingPointerUp();
                handleBeerRatingPointerUp();
                stopBoardScrollHold();
            });
            dom.addEventListener('click', (event) => {
                const target = event.target;
                if (target.closest('header') || target.closest('.modal') || target.closest('.wall-image-toolbar') || target.closest('.tools-panel')) return;
                if (isPoopAddOpen && handlePoopAddLockedClick(event)) {
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (handleBeerAddLockedClick(event)) {
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (handleVideoControlLockedClick(event)) {
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (handleVideoActionClick(event)) {
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (handleSlotMachineClick(event)) {
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (handleBeerBoardClick(event)) return;
                if (handleWallImageClick(event)) return;
                if (isPoopAddOpen) return;
                dom.requestPointerLock();
            });
            dom.addEventListener('pointerup', handleWallImagePointerUp);
            dom.addEventListener('pointerleave', handleWallImagePointerUp);
            dom.addEventListener('pointercancel', handleWallImagePointerUp);

            document.addEventListener('pointerlockchange', () => {
                const locked = document.pointerLockElement === dom ||
                    document.pointerLockElement === cssRenderer?.domElement ||
                    document.pointerLockElement === wallCssRenderer?.domElement;
                isLocked = locked;
                if (isLocked) {
                    wallDrawActive = false;
                    wallDrawLast = null;
                    wallDrawPendingTextHit = null;
                    commitWallTextEdit();
                    setWallDrawTool('cursor');
                }
                updateWallDrawUi();
                if (!isLocked) {
                    wallImagePickSuppressUntil = performance.now() + 800;
                }
                document.body.classList.toggle('pointer-locked', isLocked);
                if (!isLocked) stopBoardScrollHold();
                updateBeerAddPointerEvents();
                if (isLocked) {
                    reticleFollow = false;
                    if (reticleEl) {
                        reticleEl.style.left = '50%';
                        reticleEl.style.top = '50%';
                        reticleEl.style.transform = '';
                    }
                }
            });

            document.addEventListener('mousemove', (event) => {
                if (reticleFollow && !isLocked && reticleEl) {
                    reticleEl.style.left = `${event.clientX}px`;
                    reticleEl.style.top = `${event.clientY}px`;
                    reticleEl.style.transform = 'translate(-50%, -50%)';
                }
                if (!isLocked) {
                    if (isPoopAddOpen) {
                        const movementX = event.movementX || 0;
                        const movementY = event.movementY || 0;
                        yawObject.rotation.y -= movementX * 0.002;
                        pitchObject.rotation.x -= movementY * 0.002;
                        const maxPitch = Math.PI / 2 - 0.1;
                        pitchObject.rotation.x = Math.max(-maxPitch, Math.min(maxPitch, pitchObject.rotation.x));
                    }
                    return;
                }
                const movementX = event.movementX || 0;
                const movementY = event.movementY || 0;
                yawObject.rotation.y -= movementX * 0.002;
                pitchObject.rotation.x -= movementY * 0.002;
                const maxPitch = Math.PI / 2 - 0.1;
                pitchObject.rotation.x = Math.max(-maxPitch, Math.min(maxPitch, pitchObject.rotation.x));
            });

            dom.addEventListener('contextmenu', (event) => {
                if (isPoopAddOpen) event.preventDefault();
            });

            document.addEventListener('keydown', (event) => {
                if (isWallLabelEditing) return;
                if (event.target && event.target.closest && event.target.closest('.beer-add-3d')) {
                    return;
                }
                if (event.target && event.target.closest && event.target.closest('.poop-add-3d')) {
                    const tag = event.target.tagName;
                    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || event.target.isContentEditable) {
                        return;
                    }
                }
                if (event.target && (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA' || event.target.isContentEditable)) {
                    return;
                }
                if ((event.ctrlKey || event.metaKey) && (event.code === 'KeyA' || event.code === 'KeyD')) {
                    return;
                }
                if (event.code === 'Escape') {
                    if (isBeerAddOpen) {
                        closeBeerAddModal3D();
                        return;
                    }
                    if (isPoopAddOpen) {
                        closePoopAddModal3D();
                        return;
                    }
                    if (selectedWallImageId) setSelectedWallImage(null);
                    if (document.pointerLockElement) {
                        document.exitPointerLock();
                        return;
                    }
                    return;
                }
                if (event.code === 'KeyF') {
                    if (!event.repeat) {
                        if (voiceMode === 'toggle') {
                            if (voiceTalking) {
                                stopVoiceTalk();
                            } else {
                                startVoiceTalk();
                            }
                        } else {
                            startVoiceTalk();
                        }
                    }
                    return;
                }
                if (event.code === 'KeyC') {
                    if (!event.repeat) toggleLadder();
                    return;
                }
                if (event.code === 'KeyW') moveState.forward = true;
                if (event.code === 'KeyS') moveState.back = true;
                if (event.code === 'KeyA') moveState.left = true;
                if (event.code === 'KeyD') moveState.right = true;
                if (event.code === 'ShiftLeft' || event.code === 'ShiftRight') moveState.fast = true;
                if (event.code === 'Space') {
                    if (isGrounded) {
                        verticalVelocity = jumpVelocity;
                        isGrounded = false;
                    }
                }
            });
            document.addEventListener('keyup', (event) => {
                if (isWallLabelEditing) return;
                if (event.target && event.target.closest && event.target.closest('.beer-add-3d')) {
                    return;
                }
                if (event.code === 'KeyF') {
                    if (voiceMode === 'hold') {
                        stopVoiceTalk();
                    }
                    return;
                }
                if (event.code === 'KeyW') moveState.forward = false;
                if (event.code === 'KeyS') moveState.back = false;
                if (event.code === 'KeyA') moveState.left = false;
                if (event.code === 'KeyD') moveState.right = false;
                if (event.code === 'ShiftLeft' || event.code === 'ShiftRight') moveState.fast = false;
            });
            window.addEventListener('blur', () => {
                moveState.forward = false;
                moveState.back = false;
                moveState.left = false;
                moveState.right = false;
                moveState.fast = false;
                stopVoiceTalk();
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(currentPixelRatio);
                if (cssRenderer) cssRenderer.setSize(window.innerWidth, window.innerHeight);
                if (wallCssRenderer) wallCssRenderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function applyRendererPixelRatio(next) {
            if (!renderer) return;
            const clamped = Math.max(0.75, Math.min(next, basePixelRatio));
            if (Math.abs(clamped - currentPixelRatio) < 0.01) return;
            currentPixelRatio = clamped;
            renderer.setPixelRatio(currentPixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function monitorPerformance(delta) {
            perfSampleTime += delta;
            perfSampleFrames += 1;
            if (perfSampleTime < 2) return;
            const avgMs = (perfSampleTime / Math.max(1, perfSampleFrames)) * 1000;
            perfSampleTime = 0;
            perfSampleFrames = 0;
            if (avgMs > 42 && !perfLowMode && currentPixelRatio > 1) {
                perfLowMode = true;
                applyRendererPixelRatio(1);
                return;
            }
            if (avgMs < 28 && perfLowMode) {
                perfLowMode = false;
                applyRendererPixelRatio(basePixelRatio);
            }
        }

        function createNameSprite(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 26px Comfortaa, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(2.6, 0.65, 1);
            sprite.userData.text = text;
            sprite.renderOrder = 2000;
            sprite.material.depthTest = false;
            sprite.material.depthWrite = false;
            sprite.material.transparent = true;
            return sprite;
        }

        function setAvatarAction(group, name) {
            const actions = group?.userData?.actions;
            if (!actions || !actions[name]) return;
            if (group.userData.activeAction === name) return;
            Object.entries(actions).forEach(([key, action]) => {
                action.weight = key === name ? 1 : 0;
            });
            group.userData.activeAction = name;
        }

        function resetAvatarGroup(group) {
            if (!group) return;
            if (group.userData.avatar) {
                group.remove(group.userData.avatar);
                group.userData.avatar = null;
                group.userData.mixer = null;
                group.userData.actions = null;
                group.userData.activeAction = null;
            }
            if (group.userData.placeholder) {
                group.remove(group.userData.placeholder);
                group.userData.placeholder = null;
            }
            if (group.userData.humanoid) {
                group.remove(group.userData.humanoid);
                group.userData.humanoid = null;
            }
        }

        function createRemotePlayer(user) {
            const prefs = getAvatarPrefsForUser(user);
            const bodyColor = getUserBodyColor({ ...user, avatar: prefs });
            const group = new THREE.Group();
            group.userData.avatarPrefsKey = JSON.stringify(prefs || {});

            if (prefs?.model === 'humanoid') {
                const humanoid = createAvatarHumanoid(bodyColor);
                group.add(humanoid.placeholder);
                group.userData.humanoid = humanoid.placeholder;
                group.userData.avatarHeight = humanoid.height;
            } else {
                const fallback = createAvatarPlaceholder(bodyColor);
                group.add(fallback.placeholder);
                group.userData.placeholder = fallback.placeholder;
                group.userData.avatarHeight = fallback.height;
            }
            applyAvatarPrefsToGroup(group, prefs);
            const labelText = user.name || 'Guest';
            const cssLabel = createNameCssLabel(labelText);
            if (cssLabel) {
                cssScene.add(cssLabel);
                group.userData.cssLabel = cssLabel;
            } else {
                const label = createNameSprite(labelText);
                label.position.set(0, (group.userData.avatarHeight || AVATAR_TARGET_HEIGHT) + LABEL_OFFSET, 0);
                group.add(label);
                group.userData.label = label;

        function upsertRemotePlayer(user) {
            if (!user || !scene) return;
            const id = user.id;
            if (!id) return;
            let current = remotePlayers.get(id);
            if (!current) {
                const group = createRemotePlayer(user);
                scene.add(group);
                current = { group, target: new THREE.Vector3(), yaw: 0 };
                remotePlayers.set(id, current);
            }
            const prefs = getAvatarPrefsForUser(user);
            const prefsKey = JSON.stringify(prefs || {});
            if (current.group.userData.avatarPrefsKey !== prefsKey) {
                current.group.userData.avatarPrefsKey = prefsKey;
                resetAvatarGroup(current.group);
                const bodyColor = getUserBodyColor({ ...user, avatar: prefs });
                if (prefs?.model === 'humanoid') {
                    const humanoid = createAvatarHumanoid(bodyColor);
                    current.group.add(humanoid.placeholder);
                    current.group.userData.humanoid = humanoid.placeholder;
                    current.group.userData.avatarHeight = humanoid.height;
                } else {
                    const fb = createAvatarPlaceholder(bodyColor);
                    current.group.add(fb.placeholder);
                    current.group.userData.placeholder = fb.placeholder;
                    current.group.userData.avatarHeight = fb.height;
                }
                applyAvatarPrefsToGroup(current.group, prefs);
                if (current.group.userData.label) {
                    current.group.userData.label.position.y = (current.group.userData.avatarHeight || AVATAR_TARGET_HEIGHT) + LABEL_OFFSET;
                }
            }
            current.group.userData.name = user.name || current.group.userData.name || 'Guest';
            const baseY = (Number(user.y) || eyeHeight) - eyeHeight;
            current.target.set(user.x || 0, baseY, user.z || 0);
            current.yaw = user.yaw || 0;
            if (user.name && current.group.userData.cssLabel) {
                const label = current.group.userData.cssLabel;
                if (label.userData?.text !== user.name) {
                    label.userData.text = user.name;
                    if (label.element) label.element.textContent = user.name;
                }
            } else if (user.name && current.group.userData.label) {
                const label = current.group.userData.label;
                if (label.userData?.text !== user.name) {
                    const newLabel = createNameSprite(user.name);
                    newLabel.position.copy(label.position);
                    current.group.remove(label);
                    current.group.add(newLabel);
                    current.group.userData.label = newLabel;
                }
            }
        }

        function updateRemotePlayers(delta) {
            remotePlayers.forEach((player) => {
                const smoothing = 1 - Math.pow(0.001, delta);
                const prev = player.group.position.clone();
                player.group.position.lerp(player.target, smoothing);
                player.group.rotation.y += (player.yaw - player.group.rotation.y) * smoothing;
                if (player.group.userData.cssLabel) {
                    const label = player.group.userData.cssLabel;
                    const height = (player.group.userData.avatarHeight || AVATAR_TARGET_HEIGHT) + LABEL_OFFSET * 0.4;
                    label.position.set(
                        player.group.position.x,
                        player.group.position.y + height,
                        player.group.position.z
                    );
                    label.scale.setScalar(0.01);
                    const dir = new THREE.Vector3();
                    camera.getWorldDirection(dir);
                    label.rotation.order = 'YXZ';
                    label.rotation.set(0, Math.atan2(dir.x, dir.z) + Math.PI, 0);
                } else if (player.group.userData.label) {
                    player.group.userData.label.lookAt(camera.position);
                }
                const horizontal = new THREE.Vector2(
                    player.group.position.x - prev.x,
                    player.group.position.z - prev.z
                );
                const speed = horizontal.length() / Math.max(delta, 0.0001);
                const speedSmoothing = 1 - Math.pow(0.001, delta);
                const prevSpeed = player.speed || 0;
                const smoothSpeed = prevSpeed + (speed - prevSpeed) * speedSmoothing;
                player.speed = smoothSpeed;
                if (player.group.userData.mixer) {
                    player.group.userData.mixer.update(delta);
                    if (speed > 1.8 && player.group.userData.actions?.run) {
                        setAvatarAction(player.group, 'run');
                    } else if (speed > 0.15 && player.group.userData.actions?.walk) {
                        setAvatarAction(player.group, 'walk');
                    } else {
                        setAvatarAction(player.group, 'idle');
                    }
                } else if (player.group.userData.humanoid?.userData?.limbs) {
                    const limbs = player.group.userData.humanoid.userData.limbs;
                    const stride = Math.min(1, smoothSpeed / 1.6);
                    if (!player.walkPhase) player.walkPhase = 0;
                    if (smoothSpeed > 0.05) {
                        player.walkPhase += smoothSpeed * delta * 3.2;
                    } else {
                        player.walkPhase *= Math.max(0, 1 - delta * 6);
                    }
                    const phase = player.walkPhase;
                    const swing = Math.sin(phase) * 0.38 * stride;
                    const sway = Math.cos(phase) * 0.06 * stride;
                    const leftBaseX = typeof limbs.armLeft.userData.baseRotX === 'number' ? limbs.armLeft.userData.baseRotX : 0;
                    const rightBaseX = typeof limbs.armRight.userData.baseRotX === 'number' ? limbs.armRight.userData.baseRotX : 0;
                    limbs.armLeft.rotation.x = leftBaseX - swing;
                    limbs.armRight.rotation.x = rightBaseX + swing;
                    limbs.legLeft.rotation.x = swing;
                    limbs.legRight.rotation.x = -swing;
                    const elbowLeftBend = Math.max(0, -swing) * 1.35 + 0.08 * stride;
                    const elbowRightBend = Math.max(0, swing) * 1.35 + 0.08 * stride;
                    limbs.elbowLeft.rotation.x = elbowLeftBend;
                    limbs.elbowRight.rotation.x = elbowRightBend;
                    const kneeLeftBend = Math.max(0, swing) * 1.5 + 0.05 * stride;
                    const kneeRightBend = Math.max(0, -swing) * 1.5 + 0.05 * stride;
                    limbs.kneeLeft.rotation.x = kneeLeftBend;
                    limbs.kneeRight.rotation.x = kneeRightBend;
                    if (typeof limbs.armLeft.userData.baseRotZ === 'number') {
                        limbs.armLeft.rotation.z = limbs.armLeft.userData.baseRotZ + sway * 0.22;
                    } else {
                        limbs.armLeft.rotation.z = sway * 0.22;
                    }
                    if (typeof limbs.armRight.userData.baseRotZ === 'number') {
                        limbs.armRight.rotation.z = limbs.armRight.userData.baseRotZ - sway * 0.22;
                    } else {
                        limbs.armRight.rotation.z = -sway * 0.22;
                    }
                    limbs.legLeft.rotation.z = -sway * 0.12;
                    limbs.legRight.rotation.z = sway * 0.12;
                } else if (player.group.userData.placeholder?.userData?.limbs) {
                    const limbs = player.group.userData.placeholder.userData.limbs;
                    const stride = Math.min(1, smoothSpeed / 1.6);
                    if (!player.walkPhase) player.walkPhase = 0;
                    if (smoothSpeed > 0.05) {
                        player.walkPhase += smoothSpeed * delta * 3.6;
                    } else {
                        player.walkPhase *= Math.max(0, 1 - delta * 6);
                    }
                    const phase = player.walkPhase;
                    const swing = Math.sin(phase) * 0.24 * stride;
                    const sway = Math.cos(phase) * 0.05 * stride;
                    const leftBaseX = typeof limbs.armLeft.userData.baseRotX === 'number' ? limbs.armLeft.userData.baseRotX : 0;
                    const rightBaseX = typeof limbs.armRight.userData.baseRotX === 'number' ? limbs.armRight.userData.baseRotX : 0;
                    limbs.armLeft.rotation.x = leftBaseX + swing;
                    limbs.armRight.rotation.x = rightBaseX - swing;
                    limbs.legLeft.rotation.x = -swing;
                    limbs.legRight.rotation.x = swing;
                    if (typeof limbs.armLeft.userData.baseRotZ === 'number') {
                        limbs.armLeft.rotation.z = limbs.armLeft.userData.baseRotZ + sway * 0.25;
                    } else {
                        limbs.armLeft.rotation.z = sway * 0.25;
                    }
                    if (typeof limbs.armRight.userData.baseRotZ === 'number') {
                        limbs.armRight.rotation.z = limbs.armRight.userData.baseRotZ - sway * 0.25;
                    } else {
                        limbs.armRight.rotation.z = -sway * 0.25;
                    }
                    limbs.legLeft.rotation.z = -sway * 0.12;
                    limbs.legRight.rotation.z = sway * 0.12;
                }
            });
        }

            iframe.addEventListener('load', () => {

                rutubeReady = true;
                sendRutubeCommand('player:getPlayOptions', {});
                sendRutubeCommand('player:getCurrentTime', {});
                if (videoDesiredPlaying || rutubeAwaitingPlay) {
                    sendRutubeCommand('player:play', {});
                    scheduleRutubePlayAssist();
                }
            });
            wrap.appendChild(iframe);
            videoIframeEl = iframe;
            return wrap;

        function createVideoToggleMesh() {
            const canvas = document.createElement('canvas');
            canvas.width = 360;
            canvas.height = 140;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(8, 12, 20, 0.85)';
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.6)';
            ctx.lineWidth = 4;
            const radius = 26;
            ctx.beginPath();
            ctx.moveTo(radius, 8);
            ctx.lineTo(canvas.width - radius, 8);
            ctx.quadraticCurveTo(canvas.width - 8, 8, canvas.width - 8, radius);
            ctx.lineTo(canvas.width - 8, canvas.height - radius);
            ctx.quadraticCurveTo(canvas.width - 8, canvas.height - 8, canvas.width - radius, canvas.height - 8);
            ctx.lineTo(radius, canvas.height - 8);
            ctx.quadraticCurveTo(8, canvas.height - 8, 8, canvas.height - radius);
            ctx.lineTo(8, radius);
            ctx.quadraticCurveTo(8, 8, radius, 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.font = '700 36px Comfortaa, sans-serif';
            ctx.fillStyle = 'rgba(248, 250, 252, 0.92)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Экран', canvas.width / 2, canvas.height / 2 + 2);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
            return new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.25), mat);
        }

        function formatVideoTime(value) {
            const total = Math.max(0, Math.floor(Number(value) || 0));
            const hours = Math.floor(total / 3600);
            const minutes = Math.floor((total % 3600) / 60);
            const seconds = total % 60;
            if (hours > 0) {
                return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
            return `${minutes}:${String(seconds).padStart(2, '0')}`;
        }

            if (videoControlTimeline) {
                const handleSeek = () => {
                    const value = Number(videoControlTimeline.value) || 0;
                    runWithVideoLeader(() => {
                        sendRealtime({ type: 'video:seek', time: value });
                        videoRemoteTime = value;
                        videoRemoteTimeStamp = Date.now();
                        if (!videoIsRutube && videoElement) {
                            try {
                                videoElement.currentTime = value;
                            } catch (_) {}
                        } else if (videoIsRutube && videoIframeEl && videoUrl) {
                            if (!rutubeReady) {
                                rutubePendingSeek = value;
                            } else if (!sendRutubeCommand('player:setCurrentTime', { time: value })) {
                                videoIframeEl.src = buildRutubeEmbedUrl(videoUrl, value, videoPlaying);
                            }
                            armRutubeInteraction();
                        }
                    });
                };
                videoControlTimeline.addEventListener('input', () => {
                    videoControlSeeking = true;
                    const value = Number(videoControlTimeline.value) || 0;
                    if (videoControlTime) {
                        const maxVal = Number(videoControlTimeline.max) || 0;
                        videoControlTime.textContent = `${formatVideoTime(value)} / ${formatVideoTime(maxVal)}`;
                    }
                });
                videoControlTimeline.addEventListener('change', () => {
                    videoControlSeeking = false;
                    handleSeek();
                });
            }
            updateVideoToggleLabel();
            return panel;
        }

        function initVideoControlPanel(screenWidth, z) {
            if (videoControlObject || !cssScene) return;
            const panel = createVideoControlPanel();
            panel.style.position = 'absolute';
            panel.style.visibility = 'hidden';
            const bodyEl = document.body || document.documentElement;
            if (bodyEl) {
                bodyEl.appendChild(panel);
                videoControlPanelWidth = panel.offsetWidth || 440;
                videoControlPanelHeight = panel.offsetHeight || 220;
                bodyEl.removeChild(panel);
            } else {
                videoControlPanelWidth = 360;
                videoControlPanelHeight = 200;
            }
            panel.style.position = '';
            panel.style.visibility = '';
            const panelWidthWorld = 5.6;
            const scale = panelWidthWorld / (videoControlPanelWidth || 360);
            videoControlObject = new THREE.CSS3DObject(panel);
            videoControlObject.scale.set(scale, scale, scale);
            const panelHeightWorld = (videoControlPanelHeight || 220) * scale;
            const panelHalf = panelHeightWorld * 0.5;
            const y = Math.max(panelHalf + 0.35, (videoScreenGroup?.position?.y ?? room.height * 0.55) - (videoScreenHeight / 2) - panelHalf - 0.35);
            videoControlObject.position.set(0, y, z + 0.04);
            videoControlObject.rotation.y = Math.PI;
            cssScene.add(videoControlObject);
        }

        function handleRutubeMessage(event) {
            if (!event?.data) return;
            let payload = event.data;
            if (typeof payload === 'string') {
                try {
                    payload = JSON.parse(payload);
                } catch (_) {
                    if (payload.includes('player:')) {
                        payload = { type: payload, data: {} };
                    } else {
                        try {
                            console.log('[rutube] message raw', payload);
                        } catch (_) {}
                        return;
                    }
                }
            }
            if (!payload || typeof payload !== 'object') return;
            try {
                console.log('[rutube] message', payload);
            } catch (_) {}
            const type = payload.type || payload.event;
            const data = payload.data || payload;
            if (!type) return;
            if (type === 'player:init' || type === 'player:ready') {
                if (data?.playerId) rutubePlayerId = data.playerId;
                if (data?.videoId) rutubeVideoId = data.videoId;
                rutubeReady = true;
                if (videoIsRutube && videoUrl) {
                    sendRutubeCommand('player:getPlayOptions', {});
                    if (Number.isFinite(rutubePendingSeek)) {
                        sendRutubeCommand('player:setCurrentTime', { time: rutubePendingSeek });
                        rutubePendingSeek = null;
                    } else if (rutubeAwaitingPlay) {
                        sendRutubeCommand('player:setCurrentTime', { time: getRutubeQueuedTime() });
                    }
                    if (rutubePendingAction === 'play') {
                        sendRutubeCommand('player:play', {});
                        rutubePendingAction = '';
                        scheduleRutubePlayAssist();
                    } else if (rutubePendingAction === 'pause') {
                        sendRutubeCommand('player:pause', {});
                        rutubePendingAction = '';
                    }
                    if (rutubeAwaitingPlay && !rutubePendingAction) {
                        sendRutubeCommand('player:play', {});
                        scheduleRutubePlayAssist();
                    }
                }
                return;
            }
            if (type === 'player:playOptionLoaded' || type === 'player:playOptionsLoaded') {
                if (data?.duration) {
                    rutubeDuration = Number(data.duration) || rutubeDuration;
                }
                return;
            }
            if (type === 'player:durationChange') {
                if (data?.duration) {
                    rutubeDuration = Number(data.duration) || rutubeDuration;
                }
                return;
            }
            if (type === 'player:currentTime' || type === 'player:time' || type === 'player:timeUpdate' || type === 'player:timeChanged') {
                const nextTime = Number(data?.time ?? data?.currentTime ?? data?.value);
                if (Number.isFinite(nextTime)) {
                    videoRemoteTime = Math.max(0, nextTime);
                    videoRemoteTimeStamp = Date.now();
                }
                return;
            }
            if (type === 'player:changeState' || type === 'player:stateChange') {
                if (typeof data?.state === 'string') {
                    const nextPlaying = data.state === 'playing';
                    const now = Date.now();
                    const current = getVideoTimeNow();
                    videoPlaying = nextPlaying;
                    if (nextPlaying) {
                        rutubeAwaitingPlay = false;
                        videoDesiredPlaying = true;
                        if (rutubePlayRetryTimer) {
                            clearTimeout(rutubePlayRetryTimer);
                            rutubePlayRetryTimer = null;
                        }
                        if (rutubePlayFailTimer) {
                            clearTimeout(rutubePlayFailTimer);
                            rutubePlayFailTimer = null;
                        }
                        videoRemoteTime = current;
                        videoRemoteTimeStamp = now;
                        if (!rutubeAnnouncedPlay && !suppressVideoSync) {
                            rutubeAnnouncedPlay = true;
                            sendRealtime({ type: 'video:play', time: current });
                        }
                    } else {
                        videoRemoteTime = current;
                        videoRemoteTimeStamp = now;
                        rutubeAnnouncedPlay = false;
                        if (videoDesiredPlaying && videoIsRutube) {
                            const since = now - rutubeAutoResumeAt;
                            if (since > 4000) {
                                rutubeAutoResumeAt = now;
                                rutubeAwaitingPlay = true;
                                if (rutubeReady) {
                                    sendRutubeCommand('player:play', {});
                                    scheduleRutubePlayAssist();
                                } else {
                                    rutubePendingAction = 'play';
                                }
                            }
                        }
                    }
                    updateVideoToggleLabel();
                    if (rutubeReady) {
                        sendRutubeCommand('player:getCurrentTime', {});
                        lastRutubeTimeSync = now;
                    }
                }
            }
        }

        function ensureVideoCssOverlay() {
            if (!cssScene || !videoScreenGroup || videoIframeObject) return;
            const wrap = createRutubeOverlay();
            videoIframeObject = new THREE.CSS3DObject(wrap);
            const scale = (videoScreenWidth || 16) / 1280;
            videoIframeObject.scale.set(scale, scale, scale);
            videoIframeObject.position.set(0, 0, 0.02);
            videoIframeObject.rotation.y = Math.PI;
            cssScene.add(videoIframeObject);
            setVideoProvider(videoUrl || '');
            if (videoUrl && videoIsRutube) {
                const startTime = extractRutubeStartTime(videoUrl);
                videoIframeEl.src = buildRutubeEmbedUrl(videoUrl, startTime, videoPlaying);
            }
            if (!videoControlObject) {
                const width = videoScreenGroup.userData?.screenWidth || videoScreenWidth || 16;
                const z = videoScreenGroup.userData?.screenZ ?? videoScreenZ;
                initVideoControlPanel(width, z);
            }
        }

        function isRutubeUrl(url) {
            const value = String(url || '');
            if (value.includes('<iframe')) return true;
            return /rutube\.ru/.test(value);
        }

        function extractRutubeSrc(input) {
            const raw = String(input || '').trim();
            if (!raw) return '';
            if (raw.includes('<iframe')) {
                const srcMatch = raw.match(/src=["']([^"']+)["']/i);
                if (srcMatch?.[1]) return srcMatch[1];
            }
            return raw;
        }

        function parseRutubeInput(input) {
            const clean = extractRutubeSrc(input);
            if (!clean) return { id: '', accessKey: '', startTime: 0 };
            const idMatch = clean.match(/rutube\.ru\/(?:play\/embed|video\/private|video|shorts)\/([a-zA-Z0-9]+)/);
            const id = idMatch?.[1] || '';
            let accessKey = '';
            const pMatch = clean.match(/[?&]p=([a-zA-Z0-9_-]+)/);
            if (pMatch?.[1]) accessKey = pMatch[1];
            const startTime = extractRutubeStartTime(clean);
            if (id) return { id, accessKey, startTime };
            const dataIdMatch = String(input || '').match(/data-video-id=["']([^"']+)["']/i)
                || String(input || '').match(/data-video-uuid=["']([^"']+)["']/i);
            if (dataIdMatch?.[1]) {
                return { id: dataIdMatch[1], accessKey, startTime };
            }
            return { id: '', accessKey, startTime };
        }

        function getRutubeEmbedUrl(url) {
            const clean = extractRutubeSrc(url);
            if (!clean) return '';
            if (/rutube\.ru\/play\/embed\//.test(clean) || /rutube\.ru\/info\/embed\//.test(clean)) {
                return clean;
            }
            const { id, accessKey } = parseRutubeInput(clean);
            if (!id) return '';
            let base = `https://rutube.ru/play/embed/${id}`;
            if (accessKey) {
                base += `/?p=${accessKey}`;
            }
            return base;
        }

        function buildRutubeEmbedUrl(url, time = 0, autoplay = false) {
            const base = getRutubeEmbedUrl(url);
            if (!base) {
                const clean = extractRutubeSrc(url);
                return clean || '';
            }
            const params = [];
            params.push('getPlayOptions=duration');
            params.push('api=1');
            params.push('skinColor=f59e0b');
            if (autoplay) {
                params.push('autoplay=1');
                params.push('mute=1');
            }
            if (Number.isFinite(time) && time > 0) params.push(`t=${Math.floor(time)}`);
            if (!params.length) return base;
            return `${base}${base.includes('?') ? '&' : '?'}${params.join('&')}`;
        }

        function sendRutubeCommand(type, data = {}) {
            if (!videoIframeEl?.contentWindow) return false;
            try {
                console.log('[rutube] send', type, data);
            } catch (_) {}
            const payload = { type, data };
            try {
                videoIframeEl.contentWindow.postMessage(JSON.stringify(payload), '*');
                return true;
            } catch (_) {
                return false;
            }
        }

        function setVideoCssPointerEvents(enabled) {
            if (cssRenderer?.domElement) {
                if (enabled) {
                    cssRenderer.domElement.style.pointerEvents = 'auto';
                } else {
                    const allowVideoPanelPointer = videoScreenOpen && !isLocked;
                    cssRenderer.domElement.style.pointerEvents = allowVideoPanelPointer ? 'auto' : 'none';
                }
            }
            if (videoIframeEl) {
                videoIframeEl.style.pointerEvents = enabled ? 'auto' : 'none';
            }
            if (videoIframeEl?.parentElement) {
                videoIframeEl.parentElement.style.pointerEvents = enabled ? 'auto' : 'none';
            }
        }

        function toggleVideoFullscreen() {
            const target = (videoIsRutube && videoIframeEl)
                ? videoIframeEl
                : (!videoIsRutube && videoElement)
                    ? videoElement
                    : videoIframeEl?.parentElement || videoIframeEl;
            if (!target) return;
            if (document.fullscreenElement) {
                document.exitFullscreen?.();
                return;
            }
            target.requestFullscreen?.().catch(() => {});
        }

        function armRutubeInteraction() {
            if (!videoIsRutube || !videoIframeEl) return;
            rutubeInteractionActive = true;
            setVideoCssPointerEvents(true);
            if (rutubeInteractionHandler) {
                cssRenderer?.domElement?.removeEventListener('pointerdown', rutubeInteractionHandler, true);
            }
            rutubeInteractionHandler = (event) => {
                if (!videoIframeEl) return;
                if (event?.target && (event.target === videoIframeEl || videoIframeEl.contains(event.target))) {
                    rutubeInteractionActive = false;
                    setVideoCssPointerEvents(false);
                }
            };
            cssRenderer?.domElement?.addEventListener('pointerdown', rutubeInteractionHandler, true);
            if (rutubeInteractionTimer) clearTimeout(rutubeInteractionTimer);
            rutubeInteractionTimer = setTimeout(() => {
                rutubeInteractionActive = false;
                setVideoCssPointerEvents(false);
                if (rutubeInteractionHandler) {
                    cssRenderer?.domElement?.removeEventListener('pointerdown', rutubeInteractionHandler, true);
                    rutubeInteractionHandler = null;
                }
            }, 4500);
        }

        function scheduleRutubePlayAssist() {
            if (rutubePlayRetryTimer) clearTimeout(rutubePlayRetryTimer);
            rutubePlayRetryTimer = setTimeout(() => {
                rutubePlayRetryTimer = null;
                if (!videoIsRutube || videoPlaying || !rutubeAwaitingPlay) return;
                if (rutubeReady) {
                    const seekTime = getRutubeQueuedTime();
                    sendRutubeCommand('player:setCurrentTime', { time: seekTime });
                    sendRutubeCommand('player:play', {});
                }
                armRutubeInteraction();
            }, 1200);
            if (rutubePlayFailTimer) clearTimeout(rutubePlayFailTimer);
            rutubePlayFailTimer = setTimeout(() => {
                rutubePlayFailTimer = null;
                if (!videoIsRutube || videoPlaying || !rutubeAwaitingPlay) return;
                rutubeAwaitingPlay = false;
                updateVideoToggleLabel();
            }, 9000);
        }

        function extractRutubeStartTime(url) {
            const cleaned = extractRutubeSrc(url);
            try {
                const u = new URL(String(cleaned || '').trim());
                const t = u.searchParams.get('t');
                if (t && Number.isFinite(Number(t))) return Math.max(0, Number(t));
            } catch (_) {}
            const match = String(cleaned || '').match(/[?&]t=(\d+)/);
            if (match) return Math.max(0, Number(match[1]));
            return 0;
        }

        // WebTorrent functionality removed.

        function setVideoProvider(url) {
            videoIsRutube = isRutubeUrl(url);
            if (videoIsRutube) {
                videoIsWebTorrent = false;
            }
            if (videoSurfaceMesh) videoSurfaceMesh.visible = !videoIsRutube;
            if (videoIframeObject) videoIframeObject.visible = videoIsRutube;
        }

        function enableRutube(url, time = 0, autoplay = false) {
            if (!videoIframeEl) return;
            const embed = buildRutubeEmbedUrl(url, time || 0, autoplay);
            videoIframeEl.src = embed || '';
            videoPlaying = false;
            rutubeAwaitingPlay = Boolean(autoplay);
            window.setTimeout(() => {
                if (!videoIsRutube || !videoUrl || rutubeReady) return;
                rutubeReady = true;
                sendRutubeCommand('player:getPlayOptions', {});
                if (Number.isFinite(time) && time > 0) {
                    sendRutubeCommand('player:setCurrentTime', { time });
                }
                if (autoplay || rutubeAwaitingPlay || videoDesiredPlaying) {
                    sendRutubeCommand('player:play', {});
                    scheduleRutubePlayAssist();
                }
            }, 1200);
            if (rutubePlayRetryTimer) {
                clearTimeout(rutubePlayRetryTimer);
                rutubePlayRetryTimer = null;
            }
            if (rutubePlayFailTimer) {
                clearTimeout(rutubePlayFailTimer);
                rutubePlayFailTimer = null;
            }
            updateVideoToggleLabel();
        }

        function pauseRutubePlayback() {
            if (!videoIframeEl) return;
            const current = getVideoTimeNow();
            videoRemoteTime = current;
            videoRemoteTimeStamp = Date.now();
            rutubeAwaitingPlay = false;
            if (rutubePlayRetryTimer) {
                clearTimeout(rutubePlayRetryTimer);
                rutubePlayRetryTimer = null;
            }
            if (rutubePlayFailTimer) {
                clearTimeout(rutubePlayFailTimer);
                rutubePlayFailTimer = null;
            }
            if (!sendRutubeCommand('player:pause')) {
                videoIframeEl.src = videoUrl ? `${buildRutubeEmbedUrl(videoUrl, current, false)}` : '';
            }
            videoPlaying = false;
            updateVideoToggleLabel();
        }

        function playRutubePlayback() {
            if (!videoIframeEl || !videoUrl) return;
            const current = getRutubeQueuedTime();
            videoRemoteTime = current;
            videoRemoteTimeStamp = Date.now();
            rutubeAwaitingPlay = true;
            if (rutubeReady) {
                sendRutubeCommand('player:setCurrentTime', { time: current });
            }
            if (!sendRutubeCommand('player:play')) {
                videoIframeEl.src = buildRutubeEmbedUrl(videoUrl, current, true);
            }
            scheduleRutubePlayAssist();
            updateVideoToggleLabel();
        }

        function disableRutube() {
            if (!videoIframeEl) return;
            videoIframeEl.src = '';
            videoPlaying = false;
            rutubeAwaitingPlay = false;
            rutubeAnnouncedPlay = false;
            if (rutubePlayRetryTimer) {
                clearTimeout(rutubePlayRetryTimer);
                rutubePlayRetryTimer = null;
            }
            if (rutubePlayFailTimer) {
                clearTimeout(rutubePlayFailTimer);
                rutubePlayFailTimer = null;
            }
            updateVideoToggleLabel();
        }

        function updateVideoToggleLabel() {
            if (videoControlPlayBtn) {
                const isActive = videoDesiredPlaying || videoPlaying || rutubeAwaitingPlay;
                videoControlPlayBtn.disabled = !videoUrl;
                videoControlPlayBtn.style.opacity = videoUrl ? '1' : '0.5';
                videoControlPlayBtn.textContent = isActive ? '⏸' : '▶';
            }
        }

        function getRutubeQueuedTime() {
            if (rutubeAwaitingPlay) {
                return Math.max(0, videoRemoteTime + (Date.now() - videoRemoteTimeStamp) / 1000);
            }
            return getVideoTimeNow();
        }

        function openVideoModal() {
            const input = document.getElementById('videoUrlInput');
            if (input) input.value = videoUrl || '';
            updateVideoToggleLabel();
        }

        function closeVideoModal() {
            return;
        }

        async function applyVideoUrl() {
            const input = document.getElementById('videoUrlInput');
            const rawUrl = input ? input.value.trim() : '';
            const resolvedUrl = isRutubeUrl(rawUrl) ? extractRutubeSrc(rawUrl) : rawUrl;
            try {
                console.log('[video] apply url', { rawUrl, resolvedUrl });
            } catch (_) {}
            videoUrl = resolvedUrl;
            rutubeAnnouncedPlay = false;
            if (!resolvedUrl) {
                disableRutube();
                if (videoElement) videoElement.src = '';
                videoDesiredPlaying = false;
                closeVideoModal();
                if (!suppressVideoSync) sendRealtime({ type: 'video:set', url: '' });
                return;
            }
            if (isRutubeUrl(resolvedUrl)) {
                setVideoProvider(resolvedUrl);
                ensureCssRenderer();
                ensureVideoCssOverlay();
                const startTime = extractRutubeStartTime(resolvedUrl);
                rutubeReady = false;
                rutubePendingAction = '';
                rutubePendingSeek = null;
                const shouldAutoplay = forceRutubeAutoplayOnApply;
                if (shouldAutoplay) {
                    rutubePendingAction = 'play';
                    rutubeAwaitingPlay = true;
                }
                enableRutube(resolvedUrl, startTime, shouldAutoplay);
                try {
                    console.log('[rutube] iframe src set', videoIframeEl?.src);
                } catch (_) {}
                videoRemoteTime = startTime;
                videoRemoteTimeStamp = Date.now();
                videoDesiredPlaying = false;
                if (!suppressVideoSync) {
                    sendRealtime({ type: 'video:set', url: resolvedUrl, time: startTime });
                    if (shouldAutoplay) {
                        sendRealtime({ type: 'video:play', time: startTime });
                    }
                }
            } else if (videoIframeEl) {
                setVideoProvider(resolvedUrl);
                if (videoElement) {
                    videoElement.src = resolvedUrl;
                    videoElement.play?.().catch(() => {});
                    videoPlaying = true;
                    videoDesiredPlaying = true;
                    updateVideoToggleLabel();
                }
                if (!suppressVideoSync) {
                    sendRealtime({ type: 'video:set', url: resolvedUrl });
                    sendRealtime({ type: 'video:play', time: videoElement?.currentTime || 0 });
                }
            }
            setVideoScreenOpen(true, true, true);
            if (videoIsRutube) {
                videoScreenOpen = true;
                videoScreenTarget = 1;
                videoScreenSlide = Math.max(videoScreenSlide, 0.2);
                if (videoScreenGroup) {
                    videoScreenGroup.visible = true;
                }
                if (videoIframeObject) {
                    videoIframeObject.visible = true;
                }
            }
        }

        async function ensureVideoUrlFromInput() {
            if (videoUrl) return true;
            const input = document.getElementById('videoUrlInput');
            const rawUrl = input ? input.value.trim() : '';
            if (!rawUrl) return false;
            await applyVideoUrl();
            return Boolean(videoUrl);
        }

        async function requestVideoPlay() {
            try {
                console.log('[video] play click', { videoUrl, videoIsRutube, rutubeReady });
            } catch (_) {}
            forceRutubeAutoplayOnApply = true;
            if (!videoUrl && !(await ensureVideoUrlFromInput())) {
                forceRutubeAutoplayOnApply = false;
                return;
            }
            forceRutubeAutoplayOnApply = false;
            if (!videoIsRutube && videoPlaying) return;
            if (videoIsRutube && videoPlaying) return;
            videoDesiredPlaying = true;
            if (videoIsRutube) {
                if (!rutubeReady) {
                    rutubePendingAction = 'play';
                    rutubeAwaitingPlay = true;
                } else {
                    playRutubePlayback();
                }
                armRutubeInteraction();
                setVideoCssPointerEvents(true);
                if (videoIframeEl) {
                    const fallbackUrl = buildRutubeEmbedUrl(videoUrl, getRutubeQueuedTime(), true);
                    if (fallbackUrl && videoIframeEl.src !== fallbackUrl) {
                        videoIframeEl.src = fallbackUrl;
                        try {
                            console.log('[rutube] autoplay fallback src set', fallbackUrl);
                        } catch (_) {}
                    }
                }
            } else if (videoElement) {
                videoElement.play?.().catch(() => {});
            }
            const currentTime = videoIsRutube ? videoRemoteTime : (videoElement?.currentTime || 0);
            if (!suppressVideoSync) sendRealtime({ type: 'video:play', time: currentTime });
            updateVideoToggleLabel();
        }

        function requestVideoPause() {
            if (!videoUrl) return;
            videoDesiredPlaying = false;
            updateVideoToggleLabel();
            if (!videoPlaying && !rutubeAwaitingPlay) {
                if (!suppressVideoSync) {
                    sendRealtime({ type: 'video:pause', time: getVideoTimeNow() });
                }
                return;
            }
            rutubeAnnouncedPlay = false;
            if (videoIsRutube) {
                if (!rutubeReady) {
                    rutubePendingAction = 'pause';
                    rutubeAwaitingPlay = false;
                } else {
                    pauseRutubePlayback();
                }
                videoRemoteTime = getVideoTimeNow();
                videoRemoteTimeStamp = Date.now();
            } else if (videoElement) {
                videoElement.pause?.();
            }
            const currentTime = videoIsRutube ? videoRemoteTime : (videoElement?.currentTime || 0);
            if (!suppressVideoSync) sendRealtime({ type: 'video:pause', time: currentTime });
            updateVideoToggleLabel();
        }

        async function toggleVideoPlayback() {
            if (videoDesiredPlaying || videoPlaying || rutubeAwaitingPlay) {
                requestVideoPause();
            } else {
                await requestVideoPlay();
            }
        }

        function setVideoScreenOpen(open, broadcast = true, force = false) {
            const nextOpen = Boolean(open);
            if (!nextOpen && !force && (videoDesiredPlaying || videoPlaying || rutubeAwaitingPlay)) {
                return;
            }
            videoScreenOpen = nextOpen;
            videoScreenTarget = videoScreenOpen ? 1 : 0;
            updateBeerAddPointerEvents();
            if (broadcast && !suppressVideoSync) {
                lastLocalVideoScreenToggleAt = Date.now();
                lastLocalVideoScreenToggleState = nextOpen;
                sendRealtime({ type: videoScreenOpen ? 'video:open' : 'video:close', open: videoScreenOpen });
            }
        }

        function applyRemoteVideoState(state) {
            if (!state) return;
            suppressVideoSync = true;
            if (typeof state.open === 'boolean') {
                const now = Date.now();
                if (
                    lastLocalVideoScreenToggleAt &&
                    typeof lastLocalVideoScreenToggleState === 'boolean' &&
                    now - lastLocalVideoScreenToggleAt < 1200 &&
                    state.open !== lastLocalVideoScreenToggleState
                ) {
                    // Ignore stale remote open/close right after a local toggle.
                } else {
                    setVideoScreenOpen(state.open, false, false);
                }
            }
            const source = state.source || (isRutubeUrl(state.url) ? 'rutube' : (state.url ? 'file' : ''));
            if (typeof state.url === 'string' && state.url !== videoUrl) {
                videoUrl = state.url;
                const input = document.getElementById('videoUrlInput');
                if (input && input.value !== videoUrl) input.value = videoUrl;
                setVideoProvider(videoUrl);
                if (!videoUrl) {
                    videoDesiredPlaying = false;
                    rutubeAnnouncedPlay = false;
                    updateVideoToggleLabel();
                }
                if (videoIsRutube) {
                    videoIframeEl && (videoIframeEl.src = buildRutubeEmbedUrl(videoUrl, state.time || 0, false));
                    videoPlaying = false;
                    rutubeAwaitingPlay = Boolean(state.playing);
                    videoDesiredPlaying = Boolean(state.playing);
                    rutubeAnnouncedPlay = false;
                    if (Number.isFinite(state.time)) {
                        videoRemoteTime = state.time;
                        videoRemoteTimeStamp = Date.now();
                    }
                    updateVideoToggleLabel();
                } else if (videoElement) {
                    videoElement.src = videoUrl;
                }
            }
            if (!videoIsRutube && videoElement) {
                if (Number.isFinite(state.time)) {
                    try {
                        videoElement.currentTime = state.time;
                    } catch (_) {}
                }
                if (state.playing) {
                    videoElement.play?.().catch(() => {});
                    videoPlaying = true;
                    videoDesiredPlaying = true;
                    rutubeAnnouncedPlay = false;
                } else {
                    videoElement.pause?.();
                    videoPlaying = false;
                    videoDesiredPlaying = false;
                    rutubeAnnouncedPlay = false;
                }
                updateVideoToggleLabel();
            } else if (videoIsRutube && videoIframeEl && videoUrl) {
                if (Number.isFinite(state.time)) {
                    videoRemoteTime = state.time;
                    videoRemoteTimeStamp = Date.now();
                }
                if (state.playing) {
                    rutubeAwaitingPlay = true;
                    videoDesiredPlaying = true;
                    rutubeAnnouncedPlay = false;
                    if (!rutubeReady) {
                        rutubePendingSeek = Number.isFinite(state.time) ? state.time : null;
                        rutubePendingAction = 'play';
                    } else {
                        const seekTime = Number.isFinite(state.time) ? state.time : getRutubeQueuedTime();
                        sendRutubeCommand('player:setCurrentTime', { time: seekTime });
                        sendRutubeCommand('player:play', {});
                        scheduleRutubePlayAssist();
                    }
                } else {
                    rutubeAwaitingPlay = false;
                    videoDesiredPlaying = false;
                    rutubeAnnouncedPlay = false;
                    if (!rutubeReady) {
                        rutubePendingAction = 'pause';
                    } else {
                        sendRutubeCommand('player:pause', {});
                    }
                }
                updateVideoToggleLabel();
            }
            if (Number.isFinite(state.time)) {
                videoRemoteTime = state.time;
                videoRemoteTimeStamp = Date.now();
            }
            suppressVideoSync = false;
        }

        function getVideoTimeNow() {
            if (videoIsRutube) {
                if (videoPlaying) {
                    return Math.max(0, videoRemoteTime + (Date.now() - videoRemoteTimeStamp) / 1000);
                }
                return Math.max(0, videoRemoteTime);
            }
            if (videoElement) return Math.max(0, videoElement.currentTime || 0);
            return 0;
        }

        function getVideoDuration() {
            if (!videoIsRutube && videoElement && Number.isFinite(videoElement.duration)) {
                return Math.max(0, videoElement.duration);
            }
            if (videoIsRutube && Number.isFinite(rutubeDuration) && rutubeDuration > 0) {
                return rutubeDuration;
            }
            const estimate = Math.max(120, Math.ceil(getVideoTimeNow() + 120));
            return estimate;
        }

        function getVideoScreenRect() {
            if (!renderer || !camera || !videoScreenGroup) return null;
            const rect = renderer.domElement.getBoundingClientRect();
            const halfW = (videoScreenWidth || 16) / 2;
            const halfH = (videoScreenHeight || 9) / 2;
            const corners = [
                new THREE.Vector3(-halfW, -halfH, 0),
                new THREE.Vector3(halfW, -halfH, 0),
                new THREE.Vector3(halfW, halfH, 0),
                new THREE.Vector3(-halfW, halfH, 0)
            ];
            let minX = Infinity;
            let maxX = -Infinity;
            let minY = Infinity;
            let maxY = -Infinity;
            videoScreenGroup.updateWorldMatrix(true, false);
            for (const corner of corners) {
                const world = videoScreenGroup.localToWorld(corner.clone());
                const point = projectToScreenPoint(world, rect);
                if (!point) continue;
                minX = Math.min(minX, point.x);
                maxX = Math.max(maxX, point.x);
                minY = Math.min(minY, point.y);
                maxY = Math.max(maxY, point.y);
            }
            if (!Number.isFinite(minX)) return null;
            const center = videoScreenGroup.getWorldPosition(new THREE.Vector3());
            const centerDistance = camera.position.distanceTo(center);
            return { minX, maxX, minY, maxY, rect, centerDistance };
        }

        function getGroupSphere(group) {
            if (!group) return null;
            const box = new THREE.Box3().setFromObject(group);
            if (box.isEmpty()) return null;
            const sphere = new THREE.Sphere();
            box.getBoundingSphere(sphere);
            return sphere;
        }

        function isVideoScreenOccluded(screenRect) {
            if (!screenRect || !videoScreenGroup) return false;
            const points = [
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(-videoScreenWidth / 2, -videoScreenHeight / 2, 0),
                new THREE.Vector3(videoScreenWidth / 2, -videoScreenHeight / 2, 0),
                new THREE.Vector3(videoScreenWidth / 2, videoScreenHeight / 2, 0),
                new THREE.Vector3(-videoScreenWidth / 2, videoScreenHeight / 2, 0)
            ];
            videoScreenGroup.updateWorldMatrix(true, false);
            const worldPoints = points.map((p) => videoScreenGroup.localToWorld(p.clone()));
            const occluders = [];
            const spheres = [];
            const collectMeshes = (root) => {
                if (!root) return;
                root.traverse((obj) => {
                    if (obj?.isMesh && obj.visible !== false) occluders.push(obj);
                });
                const sphere = getGroupSphere(root);
                if (sphere) spheres.push(sphere);
            };
            remotePlayers.forEach((player) => collectMeshes(player.group));
            remoteLadders.forEach((entry) => collectMeshes(entry.group));
            collectMeshes(ladderGroup);
            if (!occluders.length) return false;
            if (spheres.length && screenRect?.rect) {
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                for (const sphere of spheres) {
                    const center = sphere.center;
                    const centerPoint = projectToScreenPoint(center, screenRect.rect);
                    if (!centerPoint) continue;
                    const edgePoint = projectToScreenPoint(center.clone().add(right.clone().multiplyScalar(sphere.radius)), screenRect.rect);
                    if (!edgePoint) continue;
                    const radiusPx = Math.max(1, Math.hypot(edgePoint.x - centerPoint.x, edgePoint.y - centerPoint.y));
                    const depth = camera.position.distanceTo(center);
                    if (depth >= screenRect.centerDistance - 0.01) continue;
                    const closestX = Math.max(screenRect.minX, Math.min(centerPoint.x, screenRect.maxX));
                    const closestY = Math.max(screenRect.minY, Math.min(centerPoint.y, screenRect.maxY));
                    const dx = centerPoint.x - closestX;
                    const dy = centerPoint.y - closestY;
                    if ((dx * dx + dy * dy) <= radiusPx * radiusPx) {
                        return true;
                    }
                }
            }
            for (const point of worldPoints) {
                const dir = point.clone().sub(camera.position);
                const distance = dir.length();
                if (distance <= 0.001) continue;
                dir.normalize();
                videoOcclusionRaycaster.set(camera.position, dir);
                videoOcclusionRaycaster.far = distance - 0.01;
                const hits = videoOcclusionRaycaster.intersectObjects(occluders, true);
                if (hits.length) return true;
            }
            return false;
        }

        function updateVideoControlPanel(delta) {
            if (!videoControlTimeline || !videoControlTime) return;
            if (videoIsRutube && rutubeReady && videoUrl) {
                const now = Date.now();

            if (videoControlPlayBtn) {

        function compareBeerNames(a, b) {
            const nameA = getBeerName(a).toLowerCase();
            const nameB = getBeerName(b).toLowerCase();
            const isLatinA = /^[a-z0-9]/i.test(nameA);
            const isLatinB = /^[a-z0-9]/i.test(nameB);
            if (isLatinA && !isLatinB) return -1;
            if (!isLatinA && isLatinB) return 1;
            return nameA.localeCompare(nameB, 'ru');
        }

        function getUserBodyColor(user) {
            const prefs = getAvatarPrefsForUser(user);
            if (prefs?.color) {
                try {
                    return new THREE.Color(prefs.color);
                } catch (_) {}
            }
            const key = String(user?.id || user?.name || 'guest');
            if (userColorCache.has(key)) return userColorCache.get(key);
            let hash = 0;
            for (let i = 0; i < key.length; i += 1) {
                hash = ((hash << 5) - hash) + key.charCodeAt(i);
                hash |= 0;
            }
            const hue = ((hash % 360) + 360) % 360;
            const color = new THREE.Color();
            color.setHSL(hue / 360, 0.5, 0.55);
            userColorCache.set(key, color);
            return color;
        }

        function normalizeAvatarPrefs(prefs) {
            const base = {
                model: 'placeholder',
                color: '#f59e0b',
                textureUrl: '',

            if (!prefs || typeof prefs !== 'object') return { ...base };
            const next = {
                model: ['placeholder', 'humanoid'].includes(prefs.model) ? prefs.model : 'placeholder',
                color: String(prefs.color || base.color),
                textureUrl: String(prefs.textureUrl || ''),
                version: Number.isFinite(prefs.version) ? prefs.version : base.version
            };
            return next;
        }

        function getAvatarPrefsForUser(user) {
            const localId = getLocalClientId?.();
            if (localId && user?.id && String(user.id) === String(localId)) {
                return getLocalAvatarPrefs();
            }
            if (user?.avatar && typeof user.avatar === 'object') {
                return normalizeAvatarPrefs(user.avatar);
            }
            if (user?.id && avatarPresenceCache.has(String(user.id))) {
                return normalizeAvatarPrefs(avatarPresenceCache.get(String(user.id)));

        function resolveAvatarTextureUrl(url) {
            const normalized = String(url || '').trim();
            if (!normalized) return '';
            const base = REALTIME_HTTP_BASE || realtimeHttpBase;
            if (!base) return normalized;
            if (!/^https?:/i.test(normalized)) return normalized;
            if (normalized.includes('/fetch-image?url=')) return normalized;
            return `${base}/fetch-image?url=${encodeURIComponent(normalized)}`;
        }

        function loadAvatarTexture(url) {
            const normalized = String(url || '').trim();
            if (!normalized) return Promise.resolve(null);
            const resolved = resolveAvatarTextureUrl(normalized);
            if (avatarTextureCache.has(resolved)) return Promise.resolve(avatarTextureCache.get(resolved));
            return new Promise((resolve) => {
                const loader = new THREE.TextureLoader();
                loader.setCrossOrigin('anonymous');
                loader.load(resolved, (tex) => {
                    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
                    avatarTextureCache.set(resolved, tex);
                    resolve(tex);
                }, undefined, (err) => {
                    console.warn('Avatar texture load failed', err);
                    resolve(null);
                });
            });
        }

        function applyTextureToMesh(mesh, texture) {
            if (!mesh?.isMesh || !texture) return;
            const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
            texture.wrapS = THREE.ClampToEdgeWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            texture.repeat.set(1, 1);
            texture.center.set(0.5, 0.5);
            texture.needsUpdate = true;
            materials.forEach((mat) => {
                if (!mat) return;
                mat.map = texture;
                mat.needsUpdate = true;
            });
        }

        function applyAvatarPrefsToGroup(group, prefs) {
            if (!group || !prefs) return;
            group.userData.avatarPrefs = prefs;
            const bodyColor = getUserBodyColor({ avatar: prefs, id: group.userData?.id, name: group.userData?.name });
            if (group.userData.avatar) {
                applyUserColorToAvatar(group.userData.avatar, bodyColor);
            }
            if (group.userData.placeholder || group.userData.humanoid) {
                const target = group.userData.humanoid || group.userData.placeholder;
                target.traverse((child) => {
                    if (!child.isMesh) return;
                    if (child.userData?.avatarPart !== 'body') return;
                    if (!child.material?.color) return;
                    child.material.color = child.material.color.clone ? child.material.color.clone() : new THREE.Color(child.material.color);
                    child.material.color.set(bodyColor);
                    child.material.needsUpdate = true;
                });
            }
            const textureUrl = String(prefs.textureUrl || '').trim();
            if (textureUrl) {
                loadAvatarTexture(textureUrl).then((tex) => {
                    if (!tex) return;
                    if (group.userData.placeholder || group.userData.humanoid) {
                        const target = group.userData.humanoid || group.userData.placeholder;
                        target.traverse((child) => {
                            if (!child.isMesh) return;
                            if (child.userData?.avatarPart !== 'body') return;
                            applyTextureToMesh(child, tex);
                        });
                    }
                });
            } else if (group.userData.placeholder || group.userData.humanoid) {
                const target = group.userData.humanoid || group.userData.placeholder;
                target.traverse((child) => {
                    if (!child.isMesh) return;
                    if (child.userData?.avatarPart !== 'body') return;
                    const materials = Array.isArray(child.material) ? child.material : [child.material];
                    materials.forEach((mat) => {
                        if (!mat) return;
                        if (mat.map) {
                            mat.map = null;
                            mat.needsUpdate = true;
                        }
                    });
                });
            }
        }

        function applyUserColorToAvatar(avatar, color) {
            if (!avatar || !color) return;
            avatar.traverse((child) => {
                if (!child.isMesh) return;
                const name = String(child.name || '').toLowerCase();
                const isSkin = /(head|face|skin|hand|leg|arm)/.test(name);
                const isBody = /(body|torso|shirt|upper|jacket|cloth|uniform)/.test(name);
                const apply = isBody || (!isSkin);
                if (!apply) return;
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                materials.forEach((mat) => {
                    if (!mat || !mat.color) return;
                    mat.color = mat.color.clone ? mat.color.clone() : new THREE.Color(mat.color);
                    mat.color.set(color);
                    mat.needsUpdate = true;
                });
            });
        }

        function buildAvatarPreview(prefs) {
            if (!avatarPreviewRoot) return;
            while (avatarPreviewRoot.children.length) {
                avatarPreviewRoot.remove(avatarPreviewRoot.children[0]);
            }
            avatarPreviewRoot.userData.placeholder = null;
            avatarPreviewRoot.userData.humanoid = null;
            const bodyColor = getUserBodyColor({ avatar: prefs });
            if (prefs?.model === 'humanoid') {
                const humanoid = createAvatarHumanoid(bodyColor);
                avatarPreviewRoot.add(humanoid.placeholder);
                avatarPreviewRoot.userData.humanoid = humanoid.placeholder;
                avatarPreviewRoot.userData.avatarHeight = humanoid.height;
            } else {
                const fallback = createAvatarPlaceholder(bodyColor);
                avatarPreviewRoot.add(fallback.placeholder);
                avatarPreviewRoot.userData.placeholder = fallback.placeholder;
                avatarPreviewRoot.userData.avatarHeight = fallback.height;
            }
            applyAvatarPrefsToGroup(avatarPreviewRoot, prefs);
            avatarPreviewRoot.rotation.y = Math.PI * 0.15;
            avatarPreviewRoot.position.set(0, 0, 0);
            const box = new THREE.Box3().setFromObject(avatarPreviewRoot);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(size.y, size.x);
            const fov = (avatarPreviewCamera?.fov || 32) * (Math.PI / 180);
            const dist = (maxDim / 2) / Math.tan(fov / 2);
            if (avatarPreviewCamera) {
                avatarPreviewCamera.position.set(center.x, center.y, dist * 1.6 + size.z * 0.4);
                avatarPreviewCamera.lookAt(center);
            }
        }

            if (Array.isArray(beer.ratings)) return beer.ratings.length;
            if (beer.ratings && typeof beer.ratings === 'object') return Object.keys(beer.ratings).length;

        function getRatingsSummary(beer) {
            const result = { avg: null, my: null, count: null };
            if (!beer) return result;
            const ratings = beer.ratings && typeof beer.ratings === 'object' ? beer.ratings : null;
            if (ratings) {
                const values = Object.values(ratings)
                    .map((val) => parseFloat(String(val || '').replace(',', '.')))
                    .filter((num) => Number.isFinite(num) && num > 0);
                result.count = values.length || null;
                if (values.length) {
                    result.avg = values.reduce((sum, val) => sum + val, 0) / values.length;
                }
                const userName = getCurrentUserName();
                if (userName && ratings[userName] != null) {
                    const myVal = parseFloat(String(ratings[userName] || '').replace(',', '.'));
                    if (Number.isFinite(myVal)) result.my = myVal;
                }
            }
            return result;
        }
