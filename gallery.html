    <script>
        (function(){
            const html = document.documentElement;
            const KEY = 'logoFontFamily';
            const DEFAULT = 'Rubik Wet Paint';
            const LINK_ID = 'logoFontGF';

            function familyToHref(fam){
                const q = encodeURIComponent(fam).replace(/%20/g, '+');
                return `https://fonts.googleapis.com/css2?family=${q}&display=swap`;
            }

            function ensureStylesheet(fam){
                const family = (fam || DEFAULT).trim();
                if (!family) return;
                const href = familyToHref(family);
                let link = document.getElementById(LINK_ID);
                if (!link) {
                    link = document.createElement('link');
                    link.id = LINK_ID;
                    link.rel = 'stylesheet';
                    document.head.appendChild(link);
                }
                if (link.getAttribute('href') !== href) link.setAttribute('href', href);
            }

            function markReady(){
                html.classList.add('logo-font-ready');
                html.classList.remove('logo-font-loading');
            }

            function waitForFont(fam){
                const family = (fam || DEFAULT).trim();
                if (!family) return markReady();
                ensureStylesheet(family);
                html.classList.add('logo-font-loading');
                html.classList.remove('logo-font-ready');
                try {
                    if (document.fonts && document.fonts.load) {
                        document.fonts.load(`1em "${family}"`).then(markReady, markReady);
                    } else {
                        setTimeout(markReady, 1);
                    }
                } catch (_) {
                    markReady();
                }
            }

            try {
                const fam = localStorage.getItem(KEY) || DEFAULT;
                html.style.setProperty('--logo-font', `'${fam}'`);
                window.__loadLogoFont = waitForFont;
                waitForFont(fam);
            } catch(_) {
                window.__loadLogoFont = waitForFont;
                markReady();
            }
        })();
    </script>

        function dataUrlToBlob(dataUrl) {
            const parts = String(dataUrl || '').split(',');
            if (parts.length < 2) return null;
            const header = parts[0];
            const base64 = parts[1];
            const match = header.match(/data:(.*?);base64/i);
            const mime = match ? match[1] : 'image/png';
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i += 1) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new Blob([bytes], { type: mime });
        }

        async function cropTransparentEdges(dataUrl) {
            if (!dataUrl || !dataUrl.startsWith('data:image')) return dataUrl;
            const img = await loadImage(dataUrl);
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            const ctx = canvas.getContext('2d');
            if (!ctx) return dataUrl;
            ctx.drawImage(img, 0, 0);
            const { data, width, height } = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let minX = width, maxX = -1;
            let minY = height, maxY = -1;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4 + 3;
                    if (data[idx] > 8) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }
            if (maxX < 0 || maxY < 0) return dataUrl;
            const cropW = Math.max(1, maxX - minX + 1);
            const cropH = Math.max(1, maxY - minY + 1);
            const out = document.createElement('canvas');
            out.width = cropW;
            out.height = cropH;
            const outCtx = out.getContext('2d');
            if (!outCtx) return dataUrl;
            outCtx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
            return out.toDataURL('image/png');
        }

        async function normalizeImageToBox(dataUrl, boxW = 90, boxH = 170, scaleFactor = IMAGE_OUTPUT_SCALE) {
            const cropped = await cropTransparentEdges(dataUrl);
            const img = await loadImage(cropped);
            const srcW = img.naturalWidth || img.width;
            const srcH = img.naturalHeight || img.height;
            if (!srcW || !srcH) return dataUrlToBlob(cropped);
            const targetW = Math.max(1, Math.round(boxW * scaleFactor));
            const targetH = Math.max(1, Math.round(boxH * scaleFactor));
            const scale = targetH / srcH;
            const scaledW = srcW * scale;
            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            if (!ctx) return dataUrlToBlob(cropped);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.clearRect(0, 0, targetW, targetH);
            const drawW = scaledW;
            const drawH = targetH;
            const dx = (targetW - drawW) / 2;
            ctx.drawImage(img, 0, 0, srcW, srcH, dx, 0, drawW, drawH);
            return new Promise((resolve) => {
                canvas.toBlob((blob) => resolve(blob || dataUrlToBlob(cropped)), 'image/png', 0.95);
            });
        }

        function isLocalEndpoint(url) {
            if (!url) return false;
            try {
                const host = new URL(url).hostname;
                return host === 'localhost' || host === '127.0.0.1';
            } catch (_) {
                return false;
            }
        }

        let imageProxyFetchChain = Promise.resolve();

        async function fetchImageViaLocalProxy(url) {
            const run = async () => {
                const response = await fetch(LOCAL_IMAGE_PROXY_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                if (!response.ok) throw new Error('image_proxy_failed');
                const data = await response.json();
                const base64 = data?.image_base64 || data?.result_base64;
                if (!base64) throw new Error('image_proxy_failed');
                return `data:image/png;base64,${base64}`;
            };
            const next = imageProxyFetchChain.then(run, run);
            imageProxyFetchChain = next.catch(() => {});
            return next;
        }

        async function loadImageAsDataUrl(url) {
            if (!url) throw new Error('image_url_missing');
            if (/^data:/i.test(url)) return url;
            const resolved = new URL(url, location.href).href;
            const isCrossOrigin = (() => {
                try {
                    return new URL(resolved).origin !== location.origin;
                } catch (_) {
                    return false;
                }
            })();
            const canUseLocal = location.protocol === 'http:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            const localProxyIsLocal = isLocalEndpoint(LOCAL_IMAGE_PROXY_ENDPOINT);
            if (isCrossOrigin) {
                if (LOCAL_IMAGE_PROXY_ENDPOINT && (canUseLocal || !localProxyIsLocal)) {
                    return fetchImageViaLocalProxy(resolved);
                }
                throw new Error('image_fetch_blocked');
            }
            try {
                const response = await fetch(resolved);
                if (!response.ok) throw new Error('image_fetch_failed');
                const blob = await response.blob();
                return blobToDataUrl(blob);
            } catch (err) {
                if (LOCAL_IMAGE_PROXY_ENDPOINT && (canUseLocal || !localProxyIsLocal)) {
                    return fetchImageViaLocalProxy(resolved);
                }
                throw err;
            }
        }

        async function removeBackgroundWithEndpoint(endpoint, apiKey, imageBase64) {
            if (endpoint.includes('api.withoutbg.com')) {
                throw new Error('direct_withoutbg_blocked');
            }
            const headers = { 'Content-Type': 'application/json' };
            if (apiKey) headers['X-API-Key'] = apiKey;
            const controller = new AbortController();
            const timeoutId = window.setTimeout(() => controller.abort(), REMOVE_BG_REQUEST_TIMEOUT_MS);
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ image_base64: imageBase64 }),
                    signal: controller.signal
                });
                if (!response.ok) throw new Error('removebg_failed');
                const data = await response.json();
                const base64 = data?.image_base64 || data?.result_base64 || data?.data || data?.image || data?.result;
                if (!base64) throw new Error('removebg_invalid');
                return `data:image/png;base64,${base64}`;
            } finally {
                window.clearTimeout(timeoutId);
            }
        }

        async function removeBackground(dataUrl) {
            const base64 = dataUrlToBase64(dataUrl);
            const endpoints = [];
            if (REMBG_PRIMARY_ENDPOINT) endpoints.push({ url: REMBG_PRIMARY_ENDPOINT, key: '' });
            if (REMBG_FALLBACK_ENDPOINT) endpoints.push({ url: REMBG_FALLBACK_ENDPOINT, key: '' });
            if (REMOVE_BG_PROXY_URL) endpoints.push({ url: REMOVE_BG_PROXY_URL, key: '' });
            for (const item of endpoints) {
                try {
                    if (!item.url) continue;
                    return await removeBackgroundWithEndpoint(item.url, item.key, base64);
                } catch (_) {}
            }
            throw new Error('removebg_failed');
        }

        async function processImageUrl(url) {
            const dataUrl = await loadImageAsDataUrl(url);
            const removed = await removeBackground(dataUrl);
            return normalizeImageToBox(removed, 90, 170, IMAGE_OUTPUT_SCALE);
        }

        function createStoneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#7a7f86';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 1400; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const w = 20 + Math.random() * 60;
                const h = 12 + Math.random() * 40;
                ctx.fillStyle = `rgba(40, 40, 40, ${Math.random() * 0.12 + 0.08})`;
                ctx.fillRect(x, y, w, h);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(8, 8);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function loadRepeatTexture(url, repeatX, repeatY) {
            const texture = new THREE.TextureLoader().load(url);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(repeatX, repeatY);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearMipMapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            return texture;
        }

        function createPlankFloorTexture() {

        }

        function createPlasterWallTexture(width, height) {
            const patchSize = 3.5;
            return loadRepeatTexture(WALL_TEXTURE_URL, width / patchSize, height / patchSize);
        }

        function createCeilingTexture() {
            return loadRepeatTexture(CEILING_TEXTURE_URL, 6, 6);
        }

        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#6b4a2f');
            gradient.addColorStop(1, '#4f3622');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 800; i++) {
                ctx.strokeStyle = `rgba(30, 20, 10, ${Math.random() * 0.2})`;
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.stroke();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(6, 3);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function applyRugTexture(url) {
            if (!rugMesh || !rugTextureLoader || !url) return;
            if (rugUrl === url) return;
            rugUrl = url;
            const resolved = new URL(url, location.href).href;
            rugTextureLoader.load(resolved, (texture) => {
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(1, 1);
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                rugMesh.material.map = texture;
                rugMesh.material.needsUpdate = true;
            });
        }

        function createRoundedBox(width, height, depth, radius, segments = 12) {
            const safeRadius = Math.max(0, Math.min(radius, width / 2 - 0.01, height / 2 - 0.01, depth / 2 - 0.01));
            if (THREE.RoundedBoxGeometry) {
                return new THREE.RoundedBoxGeometry(width, height, depth, segments, safeRadius);
            }
            return new THREE.BoxGeometry(width, height, depth);
        }

        function createSofa() {
            const group = new THREE.Group();
            const fabricMat = new THREE.MeshStandardMaterial({
                color: 0x8a8f95,
                roughness: 0.85,
                metalness: 0.05,
                transparent: false,
                opacity: 1
            });
            const baseMat = new THREE.MeshStandardMaterial({
                color: 0x6f757b,
                roughness: 0.9,
                metalness: 0.05,
                transparent: false,
                opacity: 1
            });
            const legMat = new THREE.MeshStandardMaterial({
                color: 0x1f1f1f,
                roughness: 0.8,
                metalness: 0.1,
                transparent: false,
                opacity: 1
            });

            const seatHeight = 0.45;
            const seatDepth = 1.8;
            const seatGeo = createRoundedBox(4.2, seatHeight, seatDepth, 0.18);
            const seat = new THREE.Mesh(seatGeo, fabricMat);
            const seatY = 0.45;
            seat.position.set(0, seatY, 0);
            group.add(seat);

            const backHeight = 0.92;
            const backDepth = 0.24;
            const backOverlap = 0.03;
            const backGeo = createRoundedBox(4.2, backHeight, backDepth, 0.12);
            const back = new THREE.Mesh(backGeo, baseMat);
            const seatTop = seatY + seatHeight / 2;
            const backY = seatTop + backHeight / 2 - 0.12;
            const backZ = seatDepth / 2 - backOverlap + backDepth / 2;
            back.position.set(0, backY, backZ);
            group.add(back);

            const armGeo = createRoundedBox(0.34, 0.6, seatDepth, 0.14);
            const armLeft = new THREE.Mesh(armGeo, baseMat);
            armLeft.position.set(-2.02, 0.75, 0);
            const armRight = armLeft.clone();
            armRight.position.x = 2.02;
            group.add(armLeft, armRight);

            const legGeo = new THREE.CylinderGeometry(0.05, 0.06, 0.18, 12);
            const legTopY = seatY - seatHeight / 2;
            const legCenterY = legTopY - 0.18 / 2;
            const legPositions = [
                [-1.8, legCenterY, -0.75],
                [1.8, legCenterY, -0.75],
                [-1.8, legCenterY, 0.75],
                [1.8, legCenterY, 0.75]
            ];
            legPositions.forEach(([x, y, z]) => {
                const leg = new THREE.Mesh(legGeo, legMat);
                leg.position.set(x, y, z);
                group.add(leg);
            });

            return group;
        }

        function createToilet() {
            const group = new THREE.Group();
            const porcelainMat = new THREE.MeshStandardMaterial({

        function createToiletPaperCluster(data) {
            if (!data) return null;
            const forward = data.forward ? data.forward.clone() : new THREE.Vector3(0, 0, 1);
            const left = new THREE.Vector3(-forward.z, 0, forward.x);
            const base = data.position.clone()
                .addScaledVector(left, (data.radius || 0.5) + 0.9)
                .addScaledVector(forward, -0.15);
            const group = new THREE.Group();
            const rollScale = PLAYER_SCALE * 0.85;
            const addRoll = (offLeft, offForward, rotY, upright = false, tiltX = 0) => {
                const roll = createToiletPaperRoll();
                roll.scale.setScalar(rollScale);
                if (upright) {
                    roll.rotation.set(0, rotY, 0);
                    roll.position.y = (roll.userData.rollLength * rollScale) / 2;
                } else {
                    roll.rotation.set(tiltX, rotY, Math.PI / 2);
                    roll.position.y = roll.userData.rollRadius * rollScale;
                }
                roll.position.add(base)
                    .addScaledVector(left, offLeft)
                    .addScaledVector(forward, offForward);
                group.add(roll);
            };
            addRoll(0.0, 0.0, 0.2, false, 0.06);
            addRoll(0.55, 0.22, -0.8, false, -0.08);
            addRoll(-0.45, 0.18, 0.5, true);
            addRoll(0.25, -0.42, 1.4, false, 0.12);
            addRoll(-0.65, -0.25, -1.1, false, -0.04);
            addRoll(0.78, -0.05, 0.9, true);
            addRoll(-0.08, 0.5, -0.3, false, 0.08);
            return group;
        }

        function createSlotReelTexture() {
            const symbolCount = SLOT_SYMBOLS.length;
            const width = 256;
            const cellHeight = 220;
            const height = cellHeight * symbolCount;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0b0f16';
            ctx.fillRect(0, 0, width, height);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 46px "Comfortaa", sans-serif';
            for (let i = 0; i < symbolCount; i += 1) {
                const symbol = SLOT_SYMBOLS[i];
                const top = i * cellHeight;
                const centerY = top + cellHeight / 2;
                const pad = 10;
                const gradient = ctx.createLinearGradient(0, top, width, top + cellHeight);
                gradient.addColorStop(0, 'rgba(255,255,255,0.05)');
                gradient.addColorStop(1, 'rgba(0,0,0,0.2)');
                ctx.fillStyle = gradient;
                ctx.fillRect(pad, top + pad, width - pad * 2, cellHeight - pad * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 3;
                ctx.strokeRect(pad, top + pad, width - pad * 2, cellHeight - pad * 2);
                ctx.fillStyle = symbol.color;
                if (symbol.label === 'CHERRY') {
                    ctx.beginPath();
                    ctx.arc(width * 0.43, centerY + 20, 26, 0, Math.PI * 2);
                    ctx.arc(width * 0.57, centerY + 20, 26, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#14532d';
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(width * 0.43, centerY - 4);
                    ctx.lineTo(width * 0.48, centerY - 34);
                    ctx.lineTo(width * 0.53, centerY - 10);
                    ctx.stroke();
                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath();
                    ctx.ellipse(width * 0.5, centerY - 36, 18, 10, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                } else if (symbol.label === 'LEMON') {
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.ellipse(width / 2, centerY + 10, 52, 32, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#16a34a';
                    ctx.beginPath();
                    ctx.ellipse(width / 2 + 34, centerY - 20, 18, 8, 0.4, 0, Math.PI * 2);
                    ctx.fill();
                } else if (symbol.label === 'DIAMOND') {
                    ctx.fillStyle = symbol.color;
                    ctx.beginPath();
                    ctx.moveTo(width / 2, centerY - 50);
                    ctx.lineTo(width / 2 + 55, centerY);
                    ctx.lineTo(width / 2, centerY + 60);
                    ctx.lineTo(width / 2 - 55, centerY);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else if (symbol.label === 'BELL') {
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(width / 2, centerY + 15, 52, Math.PI, 0, false);
                    ctx.lineTo(width / 2 + 52, centerY + 35);
                    ctx.arc(width / 2, centerY + 35, 52, 0, Math.PI, false);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#b45309';
                    ctx.beginPath();
                    ctx.arc(width / 2, centerY + 38, 12, 0, Math.PI * 2);
                    ctx.fill();
                } else if (symbol.label === 'BAR') {
                    ctx.fillStyle = '#111827';
                    ctx.fillRect(width / 2 - 68, centerY - 32, 136, 64);
                    ctx.strokeStyle = '#f8fafc';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(width / 2 - 68, centerY - 32, 136, 64);
                    ctx.fillStyle = '#f8fafc';
                    ctx.font = 'bold 40px "Rubik Wet Paint", sans-serif';
                    ctx.fillText('BAR', width / 2, centerY + 4);
                } else {
                    ctx.fillStyle = symbol.color;
                    ctx.font = 'bold 84px "Rubik Wet Paint", sans-serif';
                    ctx.fillText(symbol.label, width / 2, centerY + 10);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.ClampToEdgeWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 1);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.needsUpdate = true;
            texture.userData.symbolCount = symbolCount;
            return texture;
        }

        function setupSlotMachineOverlay(slotRoot, bounds) {
            slotMachineActionMeshes = [];
            slotReels = [];
            slotLeverPivot = null;

            const size = new THREE.Vector3();
            bounds.getSize(size);
            if (!size.x || !size.y || !size.z) return;

            const reelTextureBase = createSlotReelTexture();
            const reelWidth = Math.max(0.18, size.x * 0.18);
            const reelHeight = Math.max(0.22, size.y * 0.18);
            const reelGap = reelWidth * 0.18;
            const totalWidth = reelWidth * 3 + reelGap * 2;
            const startX = -totalWidth / 2 + reelWidth / 2;
            const reelY = bounds.min.y + size.y * 0.6;
            const reelZ = bounds.max.z + 0.02;

            for (let i = 0; i < 3; i += 1) {
                const reelTexture = reelTextureBase.clone();
                reelTexture.needsUpdate = true;
                const reelMat = new THREE.MeshStandardMaterial({
                    map: reelTexture,
                    roughness: 0.3,
                    metalness: 0.05
                });
                const reel = new THREE.Mesh(new THREE.PlaneGeometry(reelWidth, reelHeight), reelMat);
                reel.position.set(startX + i * (reelWidth + reelGap), reelY, reelZ);
                slotRoot.add(reel);
                slotReels.push({
                    mesh: reel,
                    texture: reelTexture,
                    symbolCount: SLOT_SYMBOLS.length,
                    speed: 0,
                    spinning: false,
                    targetOffset: 0,
                    stopAt: 0,
                    stopStart: 0,
                    stopping: false
                });
            }
        }

        async function loadSlotMachineObjModel() {
            const OBJLoader = await ensureObjLoader();
            if (!OBJLoader) return null;
            const loader = new OBJLoader();
            const basePath = `./${encodeURIComponent('Slot Machine 2')}/`;
            const textureLoader = new THREE.TextureLoader();
            const diffuse = textureLoader.load(`${basePath}SlotMachine_Dif.png`);
            diffuse.colorSpace = THREE.SRGBColorSpace;
            const normal = textureLoader.load(`${basePath}SlotMachine_Nrm.png`);
            const gloss = textureLoader.load(`${basePath}glossiness.png`);
            const mat = new THREE.MeshStandardMaterial({
                map: diffuse,
                normalMap: normal,
                roughnessMap: gloss,
                roughness: 0.9,
                metalness: 0.05
            });
            const group = new THREE.Group();
            const parts = [];
            for (let i = 0; i <= 25; i += 1) {
                parts.push(`${basePath}model_${i}.obj`);
            }
            for (const part of parts) {
                try {
                    const obj = await new Promise((resolve, reject) => {
                        loader.load(part, resolve, undefined, reject);
                    });
                    obj.name = part.split('/').pop() || part;
                    obj.traverse((child) => {
                        if (child.isMesh) {
                            child.material = mat;
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    group.add(obj);
                } catch (err) {
                    console.warn('[slot] obj load failed', part, err);
                    return null;
                }
            }
            return group;
        }

        function makeBlackTransparent(texture, threshold = 12) {
            if (!texture?.image || !texture.image.width || !texture.image.height) return texture;
            const img = texture.image;
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                if (r <= threshold && g <= threshold && b <= threshold) {
                    data[i + 3] = 0;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            const out = new THREE.CanvasTexture(canvas);
            out.colorSpace = THREE.SRGBColorSpace;
            out.needsUpdate = true;
            return out;
        }

        function applyThree2Maps(mat, base, textureLoader) {

        function makeAlphaCutoutMap(texture, threshold = 24) {
            if (!texture?.image || !texture.image.width || !texture.image.height) return texture;
            const img = texture.image;
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const a = (r <= threshold && g <= threshold && b <= threshold) ? 0 : 255;
                data[i] = 255;
                data[i + 1] = 255;
                data[i + 2] = 255;
                data[i + 3] = a;
            }
            ctx.putImageData(imgData, 0, 0);
            const out = new THREE.CanvasTexture(canvas);
            out.colorSpace = THREE.NoColorSpace;
            out.needsUpdate = true;
            return out;
        }

        function makeAlphaFromLuma(texture, threshold = 16) {
            if (!texture?.image || !texture.image.width || !texture.image.height) return texture;
            const img = texture.image;
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const luma = (r * 0.299 + g * 0.587 + b * 0.114);
                const a = luma > threshold ? 255 : 0;
                data[i] = 255;
                data[i + 1] = 255;
                data[i + 2] = 255;
                data[i + 3] = a;
            }
            ctx.putImageData(imgData, 0, 0);
            const out = new THREE.CanvasTexture(canvas);
            out.colorSpace = THREE.NoColorSpace;
            out.needsUpdate = true;
            return out;
        }

        // (intentionally removed aggressive uncached cutout helper)

        function ensureThree2CloakAlphaMap() {
            if (three2CloakAlphaMap) return three2CloakAlphaMap;
            const textureLoader = new THREE.TextureLoader();
            const src = `./${encodeURIComponent('three2')}/body2_s.png`;
            const base = textureLoader.load(src, (tex) => {
                three2CloakAlphaMap = makeAlphaFromLuma(tex, 16);
            });
            three2CloakAlphaMap = makeAlphaFromLuma(base, 16);
            return three2CloakAlphaMap;
        }

        function ensureThree2CloakTextures() {
            if (three2CloakBaseMap && three2CloakAlphaFromSpec) {
                return { base: three2CloakBaseMap, alpha: three2CloakAlphaFromSpec };
            }
            const textureLoader = new THREE.TextureLoader();
            const baseSrc = `./${encodeURIComponent('three2')}/body2.png`;
            const specSrc = `./${encodeURIComponent('three2')}/body2_s.png`;
            three2CloakBaseMap = textureLoader.load(baseSrc);
            three2CloakBaseMap.colorSpace = THREE.SRGBColorSpace;
            const specTex = textureLoader.load(specSrc, (tex) => {
                three2CloakAlphaFromSpec = makeAlphaFromLuma(tex, 12);

            three2CloakAlphaFromSpec = makeAlphaFromLuma(specTex, 12);
            return { base: three2CloakBaseMap, alpha: three2CloakAlphaFromSpec };
        }

        function buildCloakGeometryFromTexture(geometry, image, threshold = 24) {
            if (!geometry || !image?.width || !image?.height) return geometry;
            const texCanvas = document.createElement('canvas');
            texCanvas.width = image.width;
            texCanvas.height = image.height;
            const tctx = texCanvas.getContext('2d');
            tctx.drawImage(image, 0, 0);
            const tdata = tctx.getImageData(0, 0, texCanvas.width, texCanvas.height).data;
            const getAlpha = (u, v) => {
                const x = Math.max(0, Math.min(texCanvas.width - 1, Math.floor(u * texCanvas.width)));
                const y = Math.max(0, Math.min(texCanvas.height - 1, Math.floor((1 - v) * texCanvas.height)));
                const idx = (y * texCanvas.width + x) * 4;
                const r = tdata[idx], g = tdata[idx + 1], b = tdata[idx + 2], a = tdata[idx + 3];
                if (a < 10) return 0;
                return (r <= threshold && g <= threshold && b <= threshold) ? 0 : 255;
            };
            const pos = geometry.attributes.position;
            const uv = geometry.attributes.uv;
            const index = geometry.index;
            if (!pos || !uv || !index) return geometry;
            const newPos = [];
            const newUv = [];
            const newIndex = [];
            let vertCount = 0;
            for (let i = 0; i < index.count; i += 3) {
                const a = index.getX(i);
                const b = index.getX(i + 1);
                const c = index.getX(i + 2);
                const uva = { u: uv.getX(a), v: uv.getY(a) };
                const uvb = { u: uv.getX(b), v: uv.getY(b) };
                const uvc = { u: uv.getX(c), v: uv.getY(c) };
                const aa = getAlpha(uva.u, uva.v);
                const bb = getAlpha(uvb.u, uvb.v);
                const cc = getAlpha(uvc.u, uvc.v);
                if (aa + bb + cc < 128) continue; // drop fully transparent tri
                const pushVert = (idx) => {
                    newPos.push(pos.getX(idx), pos.getY(idx), pos.getZ(idx));
                    newUv.push(uv.getX(idx), uv.getY(idx));
                    return vertCount++;
                };
                const ia = pushVert(a);
                const ib = pushVert(b);
                const ic = pushVert(c);
                newIndex.push(ia, ib, ic);
            }
            if (!newIndex.length) return geometry;
            const BufferGeometry = THREE.BufferGeometry;
            const Float32BufferAttribute = THREE.Float32BufferAttribute;
            const g = new BufferGeometry();
            g.setAttribute('position', new Float32BufferAttribute(newPos, 3));
            g.setAttribute('uv', new Float32BufferAttribute(newUv, 2));
            g.setIndex(newIndex);
            g.computeVertexNormals();
            return g;
        }

        function applyCloakDiscardShader(material, threshold = 0.5) {
            if (!material || material.__cloakDiscardApplied) return;
            material.__cloakDiscardApplied = true;
            material.onBeforeCompile = (shader) => {
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <alphamap_fragment>',
                    [
                        '#include <alphamap_fragment>',
                        `if (diffuseColor.a < ${threshold}) discard;`
                    ].join('\n')
                );
            };
            material.customProgramCacheKey = () => `cloak-discard-${threshold}`;
            material.needsUpdate = true;
        }

        function applyThree2Transparency(material, threshold) {
            if (!material?.map) return;
            const apply = () => {
                material.map = makeBlackTransparent(material.map, threshold);

                material.depthWrite = true;
                material.side = THREE.DoubleSide;
                material.map.needsUpdate = true;
                material.needsUpdate = true;

            const img = material.map.image;
            if (img && img.complete) {

            if (img && !img.__three2TransparentHook) {
                img.__three2TransparentHook = true;
                img.addEventListener('load', apply, { once: true });

        function applyBody2Cutout(material, threshold = 18) {

        function analyzeTextureForBlack(texture, sampleSize = 64) {
            if (!texture?.image || !texture.image.width || !texture.image.height) return null;
            const src = texture.image.src || '';
            if (three2TextureAnalysis.has(src)) return three2TextureAnalysis.get(src);
            const img = texture.image;
            const canvas = document.createElement('canvas');
            canvas.width = sampleSize;
            canvas.height = sampleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, sampleSize, sampleSize);
            const data = ctx.getImageData(0, 0, sampleSize, sampleSize).data;
            let black = 0;
            let alpha = 0;
            const total = sampleSize * sampleSize;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const a = data[i + 3];
                if (a < 250) alpha += 1;
                if (r < 8 && g < 8 && b < 8) black += 1;
            }
            const info = {
                blackRatio: black / total,
                alphaRatio: alpha / total
            };
            three2TextureAnalysis.set(src, info);
            return info;
        }

        function placeThree2NearSlot(slotRoot, slotBounds) {
            loadThree2Model().then((model) => {
                if (!model) {
                    console.warn('[three2] model not loaded. Add OBJLoader.js/MTLLoader.js to project root.');
                    return;
                }
                const textureLoader = new THREE.TextureLoader();
                if (three2Group) {
                    scene.remove(three2Group);
                }
                if (!three2MaskTexture) {
                    three2MaskTexture = textureLoader.load(`./${encodeURIComponent('three2')}/mask.png`);
                }
                model.traverse((child) => {
                    if (child.isMesh) {
                        // Reduce per-frame cost for dense model.
                        child.castShadow = false;
                        child.receiveShadow = true;
                        const materials = Array.isArray(child.material) ? child.material : [child.material];
                        const box = new THREE.Box3().setFromObject(child);
                        const size = new THREE.Vector3();
                        box.getSize(size);
                        for (const mat of materials) {
                            if (!mat) continue;
                            const imgSrc = mat?.map?.image?.src || '';
                            if (mat.map) {
                                const src = imgSrc || '';
                                const lower = src.toLowerCase();
                                let base = resolveThree2Base(mat.name || '');
                                if (!base) {
                                    if (lower.includes('body2')) base = 'body2';
                                    else if (lower.includes('body1')) base = 'body1';
                                    else if (lower.includes('arms')) base = 'arms';
                                    else if (lower.includes('legs')) base = 'legs';
                                    else if (lower.includes('mask')) base = 'mask';
                                    else if (lower.includes('wp_a_1517')) base = 'WP_A_1517';
                                    else if (lower.includes('wp_a_0208')) base = 'WP_A_0208';
                                }
                                if (base) {
                                    applyThree2Maps(mat, base, textureLoader);
                                }
                            } else {
                                // Kill large black backing planes (radical fix).
                                const color = mat.color;
                                const dark = color && color.r < 0.05 && color.g < 0.05 && color.b < 0.05;
                                const isFlat = (size.x * size.y > 0.2 || size.x * size.z > 0.2 || size.y * size.z > 0.2) && Math.min(size.x, size.y, size.z) < 0.2;
                                if (dark && isFlat) {
                                    mat.transparent = true;
                                    mat.opacity = 0;
                                    mat.depthWrite = false;
                                }
                            }
                            mat.needsUpdate = true;
                        }
                    }
                });
                // removed cloak box mesh suppression
                const group = new THREE.Group();
                group.add(model);
                group.rotation.set(0, -Math.PI - (Math.PI / 4.5) - (Math.PI / 12), 0);
                group.updateMatrixWorld(true);

                const rawBox = new THREE.Box3().setFromObject(group);
                const rawSize = new THREE.Vector3();
                rawBox.getSize(rawSize);
                const slotBox = slotBounds || new THREE.Box3().setFromObject(slotRoot);
                const slotSize = new THREE.Vector3();
                slotBox.getSize(slotSize);
                const targetHeight = slotSize.y > 0 ? slotSize.y : 4;
                const scale = rawSize.y > 0 ? targetHeight / rawSize.y : 1;
                group.scale.setScalar(scale);
                group.updateMatrixWorld(true);

                const scaledBox = new THREE.Box3().setFromObject(group);
                const scaledSize = new THREE.Vector3();
                scaledBox.getSize(scaledSize);
                if (Number.isFinite(scaledBox.min.y)) {
                    group.position.y -= scaledBox.min.y;
                }

                const margin = 0.2;
                group.position.x = slotRoot.position.x + 0.6;
                group.position.z = slotBox.max.z + margin + scaledSize.z * 0.5;

                scene.add(group);
                three2Group = group;
                sofaColliders = sofaColliders.concat(buildMeshColliders(group));
            });
        }

        function placeSlotMachineUnderLogo() {
            loadSlotMachineObjModel().then((model) => {
                if (!model) {
                    return loadSlotMachineModel();
                }
                return model;
            }).then((model) => {
                if (!model) {
                    console.warn('[slot] Slot machine model not loaded. Add OBJLoader.js or ColladaLoader.js to project root.');
                    return;
                }
                model.traverse((child) => {
                    if (child.isMesh && child.material) {
                        // Heavy prop: avoid shadow casting.
                        child.castShadow = false;
                        child.receiveShadow = true;
                        if (child.material.map) {
                            child.material.map.colorSpace = THREE.SRGBColorSpace;
                            child.material.map.needsUpdate = true;
                        }
                        child.material.needsUpdate = true;
                    }
                });
                const findSlotLever = () => {
                    const candidates = [];
                    model.traverse((child) => {
                        if (!child.isMesh) return;
                        const name = (child.name || '').toLowerCase();
                        if (name.includes('lever') || name.includes('handle') || name.includes('arm') || name.includes('stick') || name.includes('rod')) {
                            candidates.push(child);
                            return;
                        }
                        const box = new THREE.Box3().setFromObject(child);
                        const size = new THREE.Vector3();
                        box.getSize(size);
                        const dims = [size.x, size.y, size.z].filter((v) => v > 0.001);
                        if (dims.length < 2) return;
                        dims.sort((a, b) => a - b);
                        const slender = dims[dims.length - 1] / dims[0];
                        const volume = size.x * size.y * size.z;
                        if (slender > 4 && volume < 1) {
                            candidates.push(child);
                        }
                    });
                    if (!candidates.length) return null;
                    candidates.sort((a, b) => {
                        const boxA = new THREE.Box3().setFromObject(a);
                        const boxB = new THREE.Box3().setFromObject(b);
                        const sizeA = new THREE.Vector3();
                        const sizeB = new THREE.Vector3();
                        boxA.getSize(sizeA);
                        boxB.getSize(sizeB);
                        const slenderA = Math.max(sizeA.x, sizeA.y, sizeA.z) / Math.max(0.0001, Math.min(sizeA.x, sizeA.y, sizeA.z));
                        const slenderB = Math.max(sizeB.x, sizeB.y, sizeB.z) / Math.max(0.0001, Math.min(sizeB.x, sizeB.y, sizeB.z));
                        return slenderB - slenderA;
                    });
                    return candidates[0];
                };
                const attachLeverPivot = (leverMesh) => {
                    const parent = leverMesh.parent;
                    if (!parent) return null;
                    const pivot = new THREE.Object3D();
                    pivot.position.copy(leverMesh.position);
                    pivot.quaternion.copy(leverMesh.quaternion);
                    pivot.scale.copy(leverMesh.scale);
                    parent.add(pivot);
                    pivot.add(leverMesh);
                    leverMesh.position.set(0, 0, 0);
                    leverMesh.quaternion.identity();
                    leverMesh.scale.set(1, 1, 1);
                    return pivot;
                };
                const slotRoot = new THREE.Group();
                // Bake rotation into model geometry to force upright orientation.
                const bake = new THREE.Matrix4();
                model.applyMatrix4(bake);
                model.updateMatrixWorld(true);
                slotRoot.add(model);
                slotRoot.rotation.set(0, 0, 0);
                slotRoot.updateMatrixWorld(true);

                const box = new THREE.Box3().setFromObject(slotRoot);
                const size = new THREE.Vector3();
                box.getSize(size);
                const targetHeight = 4.75;
                const scale = size.y > 0 ? targetHeight / size.y : 1;
                slotRoot.scale.setScalar(scale);
                slotRoot.updateMatrixWorld(true);
                const scaledBox = new THREE.Box3().setFromObject(slotRoot);
                if (Number.isFinite(scaledBox.min.y)) {
                    slotRoot.position.y -= scaledBox.min.y;
                }
                // Slot reels overlay disabled for this model.
                const leverMesh = findSlotLever();
                if (leverMesh) {
                    const pivot = attachLeverPivot(leverMesh);
                    if (pivot) {
                        slotLeverPivot = pivot;
                        slotLeverPivot.rotation[slotLeverAxis] = slotLeverRestAngle;
                        leverMesh.userData.action = 'slot-spin';
                        slotMachineActionMeshes.push(leverMesh);
                    }
                } else {
                    console.warn('[slot] Lever mesh not found in model. Rename lever mesh or split OBJ.');
                    model.traverse((child) => {
                        if (!child.isMesh) return;
                        const box = new THREE.Box3().setFromObject(child);
                        const size = new THREE.Vector3();
                        box.getSize(size);
                        console.log('[slot] mesh', child.name || '(unnamed)', size);
                    });
                }
                slotRoot.position.x = -room.width / 2 + 1.4;
                slotRoot.position.z = 0;
                slotRoot.rotation.y = Math.PI * 2;
                scene.add(slotRoot);
                slotMachineGroup = slotRoot;
                slotMachineBounds = new THREE.Box3().setFromObject(slotRoot);
                sofaColliders = sofaColliders.concat(buildMeshColliders(slotRoot));
                placeThree2NearSlot(slotRoot, slotMachineBounds);
            });
        }

        function triggerSlotSpin() {
            if (slotSpinState?.active) return;
            if (!slotReels.length) return;
            const now = performance.now();
            slotSpinState = {
                active: true,
                start: now,
                reels: slotReels.map((reel, index) => {
                    reel.spinning = true;
                    reel.stopping = false;
                    reel.speed = 5 + Math.random() * 4;
                    const stopDelay = 950 + index * 420 + Math.random() * 120;
                    const targetIndex = Math.floor(Math.random() * reel.symbolCount);
                    return {
                        reel,
                        stopAt: now + stopDelay,
                        targetIndex,
                        stopDuration: 320,
                        stopStart: 0,
                        targetOffset: 0
                    };
                })
            };
            if (slotLeverPivot) {
                slotLeverPivot.userData.animTime = 0;
                slotLeverPivot.userData.animActive = true;
            }
        }

        function updateSlotMachine(delta) {
            if (slotLeverPivot?.userData?.animActive) {
                const speed = 2.6;
                slotLeverPivot.userData.animTime += delta * speed;
                const t = slotLeverPivot.userData.animTime;
                const downPhase = 0.35;
                let angle;
                if (t <= downPhase) {
                    const k = Math.min(1, t / downPhase);
                    angle = slotLeverRestAngle + (slotLeverDownAngle - slotLeverRestAngle) * (1 - Math.pow(1 - k, 2));
                } else {
                    const k = Math.min(1, (t - downPhase) / (1 - downPhase));
                    angle = slotLeverDownAngle + (slotLeverRestAngle - slotLeverDownAngle) * (1 - Math.pow(1 - k, 3));
                }
                slotLeverPivot.rotation[slotLeverAxis] = angle;
                if (t >= 1) {
                    slotLeverPivot.userData.animActive = false;
                    slotLeverPivot.rotation[slotLeverAxis] = slotLeverRestAngle;
                }
            }

            if (!slotSpinState?.active) return;
            const now = performance.now();
            let finished = true;
            slotSpinState.reels.forEach((spin) => {
                const reel = spin.reel;
                if (!reel || !reel.texture) return;
                if (!spin.stopStart && now >= spin.stopAt) {
                    spin.stopStart = now;
                    const symbolHeight = 1 / reel.symbolCount;
                    let targetOffset = 1 - (spin.targetIndex + 0.5) * symbolHeight;
                    targetOffset = (targetOffset % 1 + 1) % 1;
                    spin.targetOffset = targetOffset;
                    reel.stopping = true;
                }
                if (!reel.stopping) {
                    reel.texture.offset.y = (reel.texture.offset.y + reel.speed * delta * 0.35) % 1;
                    finished = false;
                    return;
                }
                const t = Math.min(1, (now - spin.stopStart) / spin.stopDuration);
                const slow = (1 - t) * reel.speed * 0.2;
                reel.texture.offset.y = (reel.texture.offset.y + slow * delta) % 1;
                if (t >= 1) {
                    reel.texture.offset.y = spin.targetOffset;
                    reel.spinning = false;
                    reel.stopping = false;
                } else {
                    finished = false;
                }
            });
            if (finished) {
                slotSpinState.active = false;
            }
        }

        function buildMeshColliders(root) {
            const colliders = [];
            if (!root) return colliders;
            root.updateMatrixWorld(true);
            root.traverse((obj) => {
                if (!obj.isMesh || !obj.geometry) return;
                if (!obj.geometry.boundingBox) {
                    obj.geometry.computeBoundingBox();
                }
                if (!obj.geometry.boundingBox) return;
                const box = obj.geometry.boundingBox.clone();
                box.applyMatrix4(obj.matrixWorld);
                colliders.push(box);
            });
            return colliders;
        }

        function buildSofaColliders(sofa) {
            return buildMeshColliders(sofa);
        }

        function buildPoopCollisionSpheres(poop) {
            if (!poop?.userData?.poopSegments) return [];
            const scale = poop.scale.x || 1;
            const pos = poop.position.clone();
            return poop.userData.poopSegments.map((seg) => {
                const local = new THREE.Vector3(seg.x, seg.y + seg.h / 2, seg.z);
                local.multiplyScalar(scale);
                const center = local.add(pos);
                return {
                    center,
                    radius: seg.r * scale * 0.95
                };
            });
        }

        function createLadderModel(height) {
            const group = new THREE.Group();
            const width = 1.4;
            const depth = 2.2;
            const steps = Math.max(6, Math.floor(height / 0.6));
            const platformThickness = 0.08;
            const railMat = new THREE.MeshStandardMaterial({ color: 0x8b5e34, roughness: 0.65, metalness: 0.05 });
            const stepMat = new THREE.MeshStandardMaterial({ color: 0xb38b5c, roughness: 0.7, metalness: 0.05 });

            const railLength = Math.hypot(height, depth);
            const railGeo = new THREE.BoxGeometry(0.08, railLength, 0.08);
            const railAngle = Math.atan2(depth, height);
            const railY = height / 2;
            const railZ = depth / 2;
            const leftRail = new THREE.Mesh(railGeo, railMat);
            leftRail.position.set(-width / 2, railY, railZ);
            leftRail.rotation.x = railAngle;
            leftRail.userData.ladderCollide = true;
            const rightRail = leftRail.clone();
            rightRail.position.x = width / 2;
            rightRail.userData.ladderCollide = true;
            group.add(leftRail, rightRail);

            const topRailGeo = new THREE.BoxGeometry(width + 0.12, 0.08, 0.08);
            const topRail = new THREE.Mesh(topRailGeo, railMat);
            topRail.position.set(0, height + 0.08, depth);
            topRail.userData.ladderCollide = true;
            group.add(topRail);

            const stepDepth = depth / steps * 0.8;
            const stepGeo = new THREE.BoxGeometry(width * 0.98, 0.06, stepDepth);
            for (let i = 0; i < steps; i += 1) {
                const t = (i + 1) / steps;
                const step = new THREE.Mesh(stepGeo, stepMat);
                step.position.set(0, t * height, t * depth - stepDepth * 0.3);
                group.add(step);
            }

            const railConnectorGeo = new THREE.BoxGeometry(width * 0.98, 0.05, 0.05);
            for (let i = 0; i < steps; i += 1) {
                const t = (i + 0.5) / steps;
                const connector = new THREE.Mesh(railConnectorGeo, railMat);
                connector.position.set(0, t * height, t * depth - stepDepth * 0.45);
                group.add(connector);
            }

            const baseGeo = new THREE.BoxGeometry(width * 0.95, 0.08, depth * 0.18);
            const base = new THREE.Mesh(baseGeo, stepMat);
            base.position.set(0, 0.04, 0.05);
            group.add(base);

            const platformDepth = Math.min(1.6, depth * 0.64);
            const platformOffset = 0.02;
            const platformGeo = new THREE.BoxGeometry(width * 0.95, platformThickness, platformDepth);
            const platform = new THREE.Mesh(platformGeo, stepMat);
            platform.position.set(0, height + platformThickness / 2, depth + platformDepth / 2 + platformOffset);
            platform.userData.ladderCollide = true;
            group.add(platform);

            const platformConnectorGeo = new THREE.BoxGeometry(width * 0.9, 0.06, 0.08);
            const platformConnector = new THREE.Mesh(platformConnectorGeo, railMat);
            platformConnector.position.set(0, height + 0.08, depth + platformOffset);
            platformConnector.userData.ladderCollide = true;
            group.add(platformConnector);

            group.userData.width = width;
            group.userData.depth = depth;
            group.userData.height = height;
            group.userData.platformDepth = platformDepth;
            group.userData.platformThickness = platformThickness;
            group.userData.platformOffset = platformOffset;
            return group;
        }

        function buildLadderColliders(ladder) {
            const colliders = [];
            if (!ladder) return colliders;
            ladder.updateMatrixWorld(true);
            ladder.traverse((obj) => {
                if (!obj.isMesh || !obj.geometry || !obj.userData?.ladderCollide) return;
                if (!obj.geometry.boundingBox) {
                    obj.geometry.computeBoundingBox();
                }
                if (!obj.geometry.boundingBox) return;
                const box = obj.geometry.boundingBox.clone();
                box.applyMatrix4(obj.matrixWorld);
                colliders.push(box);
            });
            return colliders;
        }

        function buildLadderData(position, rotationY, width, depth, height, platformDepth, platformThickness) {
            const axis = new THREE.Vector3(0, 1, 0);
            const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(axis, rotationY);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(axis, rotationY);
            const platform = Number.isFinite(platformDepth) ? platformDepth : 0.6;
            const topOffset = Number.isFinite(platformThickness) ? platformThickness : 0.08;
            return {
                position: position.clone(),
                forward,
                right,
                width,
                depth,
                height,
                platformDepth: platform,
                platformTopOffset: topOffset,
                platformStart: depth,
                platformEnd: depth + platform + 0.2
            };
        }

        function getLadderGroundHeightFor(data, x, z, yBottom) {
            if (!data) return null;
            const dx = x - data.position.x;
            const dz = z - data.position.z;
            const localZ = dx * data.forward.x + dz * data.forward.z;
            const localX = dx * data.right.x + dz * data.right.z;
            if (localZ < -0.2 || localZ > data.platformEnd + 0.15) return null;
            const entryLimit = Math.max(0.35, data.depth * 0.3);
            if (yBottom <= 0.06 && localZ > entryLimit) return null;
            const halfW = data.width / 2 + playerRadius * 0.35;
            if (Math.abs(localX) > halfW) return null;
            const rampDepth = Math.max(0.2, data.depth);
            if (localZ >= data.platformStart) {
                return data.height + (data.platformTopOffset || 0) + eyeHeight;
            }
            const progress = Math.max(0, Math.min(1, localZ / rampDepth));
            const topOffset = data.platformTopOffset || 0;
            return data.height * progress + topOffset * progress + eyeHeight;
        }

        function getCombinedLadderGroundHeight(x, z, yBottom) {
            let ground = getLadderGroundHeightFor(ladderData, x, z, yBottom);
            remoteLadders.forEach((entry) => {
                const candidate = getLadderGroundHeightFor(entry?.data, x, z, yBottom);
                if (Number.isFinite(candidate)) {
                    ground = Number.isFinite(ground) ? Math.max(ground, candidate) : candidate;
                }
            });
            return ground;
        }

        function getToiletGroundHeight(x, z, yBottom) {
            if (!toiletData) return null;
            const dx = x - toiletData.position.x;
            const dz = z - toiletData.position.z;
            const dist = Math.hypot(dx, dz);
            if (dist > toiletData.radius) return null;
            if (yBottom > toiletData.topY + 0.2) return null;
            if (yBottom < toiletData.topY - 1.0) return null;
            return toiletData.topY + eyeHeight;
        }

        function isPlayerOnToilet() {
            if (!toiletData || !yawObject) return false;
            const yBottom = yawObject.position.y - eyeHeight;
            if (yBottom < toiletData.topY - 0.05 || yBottom > toiletData.topY + 0.45) return false;
            const dx = yawObject.position.x - toiletData.position.x;
            const dz = yawObject.position.z - toiletData.position.z;
            return Math.hypot(dx, dz) <= toiletData.radius * 0.75;
        }

        function ladderRailCollides(data, x, z, yBottom, yTop) {
            if (!data) return false;
            const dx = x - data.position.x;
            const dz = z - data.position.z;
            const localZ = dx * data.forward.x + dz * data.forward.z;
            const localX = dx * data.right.x + dz * data.right.z;
            const depthPad = 0.2;
            if (localZ <= -depthPad || localZ >= data.depth + depthPad) return false;
            const railThickness = 0.1;
            const innerWidth = data.width / 2 - railThickness;
            const outerWidth = data.width / 2 + railThickness;
            if (Math.abs(localX) <= innerWidth || Math.abs(localX) >= outerWidth) return false;
            const top = data.height + eyeHeight;
            return yBottom <= top;
        }

        function ladderBackCollides(data, x, z, yBottom, yTop) {
            if (!data) return false;
            const dx = x - data.position.x;
            const dz = z - data.position.z;
            const localZ = dx * data.forward.x + dz * data.forward.z;
            const localX = dx * data.right.x + dz * data.right.z;
            const backThickness = Math.max(0.35, playerRadius * 0.6);
            if (yBottom > 0.12) return false;
            if (localZ < data.depth - backThickness || localZ > data.depth + backThickness) return false;
            const halfW = data.width / 2 + playerRadius * 0.3;
            if (Math.abs(localX) > halfW) return false;
            const top = data.height + eyeHeight;
            return yBottom <= top;
        }

        function removeLadder() {
            if (ladderGroup && ladderGroup.parent) ladderGroup.parent.remove(ladderGroup);
            ladderGroup = null;
            ladderData = null;
            ladderColliders = [];
        }

        function broadcastLadderState() {
            if (!wsConnected && !realtimeHttpEnabled) return;
            const id = getLocalClientId();
            if (!ladderGroup || !ladderData) {
                sendRealtime({ type: 'ladder', id, action: 'remove' });
                return;
            }
            sendRealtime({
                type: 'ladder',
                id,
                action: 'add',
                position: {
                    x: ladderGroup.position.x,
                    y: ladderGroup.position.y,
                    z: ladderGroup.position.z
                },
                rotationY: ladderGroup.rotation.y,
                height: ladderData.height,
                width: ladderData.width,
                depth: ladderData.depth,
                platformDepth: ladderData.platformDepth
            });
        }

        function upsertRemoteLadder(payload) {
            if (!payload || !payload.id) return;
            const localId = getLocalClientId();
            if (payload.id === localId) return;
            if (payload.action === 'remove') {
                removeRemoteLadder(payload.id);
                return;
            }
            const height = Number(payload.height) || room.height * 0.5;
            let entry = remoteLadders.get(payload.id);
            let ladder = entry?.group;
            if (!ladder || Math.abs((ladder.userData.height || 0) - height) > 0.01) {
                if (ladder && ladder.parent) ladder.parent.remove(ladder);
                ladder = createLadderModel(height);
                scene.add(ladder);
            }
            const pos = payload.position || {};
            const position = new THREE.Vector3(Number(pos.x) || 0, Number(pos.y) || 0, Number(pos.z) || 0);
            const rotationY = Number.isFinite(payload.rotationY) ? payload.rotationY : 0;
            ladder.position.copy(position);
            ladder.rotation.y = rotationY;
            const width = Number(payload.width) || ladder.userData.width || 1.4;
            const depth = Number(payload.depth) || ladder.userData.depth || 2.2;
            const platformDepth = Number(payload.platformDepth) || ladder.userData.platformDepth || 0.6;
            const platformThickness = ladder.userData.platformThickness || 0.08;
            const data = buildLadderData(position, rotationY, width, depth, height, platformDepth, platformThickness);
            remoteLadders.set(payload.id, { group: ladder, data });
        }

        function removeRemoteLadder(id) {
            const entry = remoteLadders.get(id);
            if (!entry) return;
            if (entry.group?.parent) entry.group.parent.remove(entry.group);
            remoteLadders.delete(id);
        }

        function toggleLadder() {
            if (ladderGroup) {
                removeLadder();
                broadcastLadderState();
                return;
            }
            if (!yawObject) return;
            if (!isGrounded || Math.abs(yawObject.position.y - eyeHeight) > 0.12) return;
            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yawObject.rotation.y);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yawObject.rotation.y);
            const height = room.height * 0.5;
            const tempLadder = createLadderModel(height);
            const width = tempLadder.userData.width || 1.4;
            const depth = tempLadder.userData.depth || 2.2;
            const base = yawObject.position.clone().addScaledVector(forward, 1.4);
            base.y = 0;

            const halfW = room.width / 2 - 2;
            const halfD = room.depth / 2 - 2;
            const halfDepth = depth / 2;
            const halfWidth = width / 2;
            const center = base.clone().addScaledVector(forward, halfDepth);
            const extentX = Math.abs(forward.x) * halfDepth + Math.abs(right.x) * halfWidth;
            const extentZ = Math.abs(forward.z) * halfDepth + Math.abs(right.z) * halfWidth;
            center.x = Math.max(-halfW + extentX, Math.min(halfW - extentX, center.x));
            center.z = Math.max(-halfD + extentZ, Math.min(halfD - extentZ, center.z));
            base.copy(center.addScaledVector(forward, -halfDepth));

            ladderGroup = tempLadder;
            ladderGroup.position.set(base.x, 0, base.z);
            ladderGroup.rotation.y = yawObject.rotation.y + Math.PI;
            scene.add(ladderGroup);
            ladderColliders = buildLadderColliders(ladderGroup);
            ladderData = buildLadderData(
                new THREE.Vector3(base.x, 0, base.z),
                ladderGroup.rotation.y,
                width,
                depth,
                height,
                tempLadder.userData.platformDepth || 0.6,
                tempLadder.userData.platformThickness || 0.08
            );
            broadcastLadderState();
        }

        function getLadderGroundHeight(x, z, yBottom) {
            return getLadderGroundHeightFor(ladderData, x, z, yBottom);
        }

        function collidesWithSofa(x, z, yBottom, yTop) {
            if (sofaColliders.length) {
                for (const box of sofaColliders) {
                    if (yBottom >= box.max.y - 0.05) continue;
                    if (yTop < box.min.y || yBottom > box.max.y) continue;
                    const clampedX = Math.max(box.min.x, Math.min(box.max.x, x));
                    const clampedZ = Math.max(box.min.z, Math.min(box.max.z, z));
                    const dx = x - clampedX;
                    const dz = z - clampedZ;
                    if ((dx * dx + dz * dz) <= playerRadius * playerRadius) return true;
                }
            }
            if (ladderRailCollides(ladderData, x, z, yBottom, yTop)) return true;
            if (ladderBackCollides(ladderData, x, z, yBottom, yTop)) return true;
            for (const entry of remoteLadders.values()) {
                if (ladderRailCollides(entry?.data, x, z, yBottom, yTop)) return true;
                if (ladderBackCollides(entry?.data, x, z, yBottom, yTop)) return true;
            }
            if (poopCollisionSpheres.length) {
                for (const sphere of poopCollisionSpheres) {
                    const top = sphere.center.y + sphere.radius;
                    const bottom = sphere.center.y - sphere.radius;
                    if (yTop < bottom || yBottom > top) continue;
                    const dx = x - sphere.center.x;
                    const dz = z - sphere.center.z;
                    const dist = Math.hypot(dx, dz);
                    if (dist <= playerRadius + sphere.radius) return true;
                }
            }
            return false;
        }

        function getSofaGroundHeight(x, z, yBottom) {
            let ground = eyeHeight;
            if (sofaColliders.length) {
                for (const box of sofaColliders) {
                    const inXZ = (
                        x > box.min.x - playerRadius &&
                        x < box.max.x + playerRadius &&
                        z > box.min.z - playerRadius &&
                        z < box.max.z + playerRadius
                    );
                    if (!inXZ) continue;
                    if (yBottom >= box.max.y - 0.05) {
                        ground = Math.max(ground, box.max.y + eyeHeight);
                    }
                }
            }
            const ladderGround = getCombinedLadderGroundHeight(x, z, yBottom);
            if (Number.isFinite(ladderGround)) {
                ground = Math.max(ground, ladderGround);
            }
            const toiletGround = getToiletGroundHeight(x, z, yBottom);
            if (Number.isFinite(toiletGround)) {
                ground = Math.max(ground, toiletGround);
            }
            return ground;
        }

        function createNeonCanvasTextureText(text) {

        function createNeonGlowMaterial() {
            return new THREE.MeshBasicMaterial({
                color: 0xf59e0b,
                transparent: true,
                opacity: 0.28,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                depthTest: true,
                side: THREE.BackSide
            });
        }

        function createPoopModel() {
            const group = new THREE.Group();
            const mats = [
                new THREE.MeshStandardMaterial({ color: 0x6b3612, roughness: 0.9, metalness: 0.02 }),
                new THREE.MeshStandardMaterial({ color: 0x7b4216, roughness: 0.86, metalness: 0.03 }),
                new THREE.MeshStandardMaterial({ color: 0x5a2c0c, roughness: 0.92, metalness: 0.02 })
            ];
            const sphere = new THREE.SphereGeometry(1, 24, 18);
            const segments = [
                { r: 1.25, h: 0.95, y: 0.0, x: 0.0, z: 0.0, m: 0 },
                { r: 0.95, h: 0.78, y: 0.72, x: 0.12, z: 0.1, m: 1 },
                { r: 0.7, h: 0.62, y: 1.32, x: -0.05, z: 0.08, m: 0 },
                { r: 0.48, h: 0.48, y: 1.78, x: 0.06, z: -0.02, m: 1 },
                { r: 0.3, h: 0.32, y: 2.08, x: 0.02, z: 0.02, m: 2 }
            ];
            group.userData.poopSegments = segments;
            segments.forEach((seg) => {
                const mesh = new THREE.Mesh(sphere, mats[seg.m]);
                mesh.scale.set(seg.r, seg.h / 2, seg.r);
                mesh.position.set(seg.x, seg.y + seg.h / 2, seg.z);
                group.add(mesh);
            });

            const gloss = new THREE.Mesh(
                new THREE.SphereGeometry(0.18, 16, 12),
                new THREE.MeshStandardMaterial({
                    color: 0x9a5a2a,
                    roughness: 0.6,
                    metalness: 0.08,
                    transparent: true,
                    opacity: 0.55
                })
            );
            gloss.position.set(0.35, 1.1, 0.45);
            group.add(gloss);
            return group;
        }

        function placeCornerPoop() {
            if (!scene) return;
            if (poopMesh) {
                scene.remove(poopMesh);
                poopMesh = null;

            poopMesh = createPoopModel();
            poopMesh.scale.set(2.1, 2.1, 2.1);
            const margin = 1.0;
            poopMesh.position.set(-room.width / 2 + margin, 0, -room.depth / 2 + margin);

        function initScene() {
