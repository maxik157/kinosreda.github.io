    function reconcileShelfRows(beers,capacity){const existing=new Map(state.buttonCache),changedImages=[],activeKeys=new Set(),knownKeys=new Set(state.beers.map(beer=>beer.key));[...els.rows.querySelectorAll('.beer-shelf-item')].forEach(button=>existing.set(button.dataset.key,button));if(!beers.length){existing.forEach((button,key)=>{button.remove();if(knownKeys.has(key))state.buttonCache.set(key,button);else{state.buttonCache.delete(key);state.imageNodes.delete(key);}});els.rows.innerHTML='';return changedImages;}const needed=Math.ceil(beers.length/capacity);let rows=[...els.rows.querySelectorAll('.beer-shelf-row')];while(rows.length<needed){const row=createShelfRow(rows.length);els.rows.append(row);rows.push(row);}beers.forEach((beer,index)=>{activeKeys.add(beer.key);let button=existing.get(beer.key);state.buttonCache.delete(beer.key);if(!button){button=createBeerButton(beer);if(beer.imageUrl)changedImages.push(beer);}else if(updateBeerButtonImage(button,beer))changedImages.push(beer);const row=rows[Math.floor(index/capacity)],slot=row.querySelectorAll('.beer-shelf-item')[index%capacity];if(slot!==button)row.insertBefore(button,slot||null);});existing.forEach((button,key)=>{if(activeKeys.has(key))return;button.remove();if(knownKeys.has(key))state.buttonCache.set(key,button);else{state.buttonCache.delete(key);state.imageNodes.delete(key);}});while(rows.length>needed){rows.pop().remove();}rows.forEach((row,index)=>row.dataset.rowIndex=String(index));return changedImages;}
