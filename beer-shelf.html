    <script>
        (function(){
            const html = document.documentElement;
            const KEY = 'logoFontFamily';
            const DEFAULT = 'Rubik Wet Paint';
            const LINK_ID = 'logoFontGF';

            function familyToHref(fam){
                const q = encodeURIComponent(fam).replace(/%20/g, '+');
                return `https://fonts.googleapis.com/css2?family=${q}&display=swap`;
            }

            function ensureStylesheet(fam){
                const family = (fam || DEFAULT).trim();
                if (!family) return;
                const href = familyToHref(family);
                let link = document.getElementById(LINK_ID);
                if (!link) {
                    link = document.createElement('link');
                    link.id = LINK_ID;
                    link.rel = 'stylesheet';
                    document.head.appendChild(link);
                }
                if (link.getAttribute('href') !== href) link.setAttribute('href', href);
            }

            function markReady(){
                html.classList.add('logo-font-ready');
                html.classList.remove('logo-font-loading');
            }

            function waitForFont(fam){
                const family = (fam || DEFAULT).trim();
                if (!family) return markReady();
                ensureStylesheet(family);
                html.classList.add('logo-font-loading');
                html.classList.remove('logo-font-ready');
                try {
                    if (document.fonts && document.fonts.load) {
                        document.fonts.load(`1em "${family}"`).then(markReady, markReady);
                    } else {
                        setTimeout(markReady, 1);
                    }
                } catch (_) {
                    markReady();
                }
            }

            try {
                const fam = localStorage.getItem(KEY) || DEFAULT;
                html.style.setProperty('--logo-font', `'${fam}'`);
                window.__loadLogoFont = waitForFont;
                waitForFont(fam);
            } catch(_) {
                window.__loadLogoFont = waitForFont;
                markReady();
            }
        })();
    </script>

        function readCacheTs(key) {
            try {
                const raw = localStorage.getItem(key);
                return raw ? Number(raw) : 0;
            } catch (_) {
                return 0;
            }
        }

        function writeCacheTs(key) {

        function shouldRefreshCache(ts) {
            if (!ts) return true;

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        function dataUrlToBase64(dataUrl) {
            const parts = String(dataUrl || '').split(',');
            return parts.length > 1 ? parts[1] : '';
        }

        async function uploadToImgbb(dataUrl) {
            const imageBase64 = dataUrlToBase64(dataUrl);
            if (!imageBase64) throw new Error('imgbb_invalid');
            const formData = new FormData();
            formData.append('image', imageBase64);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            if (!response.ok) throw new Error('imgbb_failed');
            const result = await response.json();
            const link = result?.data?.url || result?.data?.display_url;
            if (!link) throw new Error('imgbb_no_url');
            return link;
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        async function cropTransparentEdges(dataUrl) {
            if (!dataUrl || !dataUrl.startsWith('data:image')) return dataUrl;
            const img = await loadImage(dataUrl);
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            const ctx = canvas.getContext('2d');
            if (!ctx) return dataUrl;
            ctx.drawImage(img, 0, 0);
            const { data, width, height } = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let minX = width, maxX = -1;
            let minY = height, maxY = -1;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4 + 3;
                    if (data[idx] > 8) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }
            if (maxX < 0 || maxY < 0) return dataUrl;
            const cropW = Math.max(1, maxX - minX + 1);
            const cropH = Math.max(1, maxY - minY + 1);
            const out = document.createElement('canvas');
            out.width = cropW;
            out.height = cropH;
            const outCtx = out.getContext('2d');
            if (!outCtx) return dataUrl;
            outCtx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
            return out.toDataURL('image/png');
        }

        async function normalizeImageToBox(dataUrl, boxW = 90, boxH = 170, scaleFactor = IMAGE_OUTPUT_SCALE) {
            const cropped = await cropTransparentEdges(dataUrl);
            const img = await loadImage(cropped);
            const srcW = img.naturalWidth || img.width;
            const srcH = img.naturalHeight || img.height;
            if (!srcW || !srcH) return dataUrl;
            const targetW = Math.max(1, Math.round(boxW * scaleFactor));
            const targetH = Math.max(1, Math.round(boxH * scaleFactor));
            const scale = targetH / srcH;
            const scaledW = srcW * scale;
            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            if (!ctx) return dataUrl;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.clearRect(0, 0, targetW, targetH);
            const drawW = scaledW;
            const drawH = targetH;
            const dx = (targetW - drawW) / 2;
            ctx.drawImage(img, 0, 0, srcW, srcH, dx, 0, drawW, drawH);
            return canvas.toDataURL('image/png');
        }

        function isLocalEndpoint(url) {
            if (!url) return false;
            try {
                const host = new URL(url).hostname;
                return host === 'localhost' || host === '127.0.0.1';
            } catch (_) {
                return false;
            }
        }

        async function fetchImageViaLocalProxy(url) {
            const response = await fetch(LOCAL_IMAGE_PROXY_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            if (!response.ok) throw new Error('image_proxy_failed');
            const data = await response.json();
            const base64 = data?.image_base64 || data?.result_base64;
            if (!base64) throw new Error('image_proxy_failed');
            return `data:image/png;base64,${base64}`;
        }

        async function loadImageAsDataUrl(url) {
            if (!url) throw new Error('image_url_missing');
            if (/^data:/i.test(url)) return url;
            const resolved = new URL(url, location.href).href;
            const isCrossOrigin = (() => {
                try {
                    return new URL(resolved).origin !== location.origin;
                } catch (_) {
                    return false;
                }
            })();
            const canUseLocal = location.protocol === 'http:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            const localProxyIsLocal = isLocalEndpoint(LOCAL_IMAGE_PROXY_ENDPOINT);
            if (isCrossOrigin) {
                if (LOCAL_IMAGE_PROXY_ENDPOINT && (canUseLocal || !localProxyIsLocal)) {
                    return fetchImageViaLocalProxy(resolved);
                }
                throw new Error('image_fetch_blocked');
            }
            try {
                const response = await fetch(resolved);
                if (!response.ok) throw new Error('image_fetch_failed');
                const blob = await response.blob();
                return blobToDataUrl(blob);
            } catch (err) {
                if (LOCAL_IMAGE_PROXY_ENDPOINT && (canUseLocal || !localProxyIsLocal)) {
                    return fetchImageViaLocalProxy(resolved);
                }
                throw err;
            }
        }

        async function removeBackgroundWithEndpoint(endpoint, apiKey, imageBase64) {
            if (endpoint.includes('api.withoutbg.com')) {
                throw new Error('direct_withoutbg_blocked');
            }
            const headers = { 'Content-Type': 'application/json' };
            if (apiKey) headers['X-API-Key'] = apiKey;
            const response = await fetch(endpoint, {
                method: 'POST',
                headers,
                body: JSON.stringify({ image_base64: imageBase64 })
            });
            if (!response.ok) throw new Error('removebg_failed');
            const data = await response.json();
            const base64 = data?.image_base64 || data?.result_base64 || data?.data || data?.image || data?.result;
            if (!base64) throw new Error('removebg_invalid');
            return `data:image/png;base64,${base64}`;
        }

        async function removeBackground(dataUrl) {
            const base64 = dataUrlToBase64(dataUrl);
            const endpoints = [];
            const canUseLocal = location.protocol === 'http:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            const localBgIsLocal = isLocalEndpoint(LOCAL_BG_ENDPOINT);
            if (LOCAL_BG_ENDPOINT && (canUseLocal || !localBgIsLocal)) {
                endpoints.push({ url: LOCAL_BG_ENDPOINT, key: '' });
            }
            if (REMOVE_BG_PROXY_URL) endpoints.push({ url: REMOVE_BG_PROXY_URL, key: '' });
            for (const item of endpoints) {
                try {
                    if (!item.url) continue;
                    return await removeBackgroundWithEndpoint(item.url, item.key, base64);
                } catch (_) {}
            }
            throw new Error('removebg_failed');
        }

        async function processImageUrl(url) {
            const dataUrl = await loadImageAsDataUrl(url);
            const removed = await removeBackground(dataUrl);
            return normalizeImageToBox(removed, 90, 170, IMAGE_OUTPUT_SCALE);
        }

        function buildSofaColliders(sofa) {
            const colliders = [];
            if (!sofa) return colliders;
            sofa.updateMatrixWorld(true);
            sofa.traverse((obj) => {
                if (!obj.isMesh || !obj.geometry) return;
                if (!obj.geometry.boundingBox) {
                    obj.geometry.computeBoundingBox();
                }
                if (!obj.geometry.boundingBox) return;
                const box = obj.geometry.boundingBox.clone();
                box.applyMatrix4(obj.matrixWorld);
                colliders.push(box);
            });
            return colliders;
        }

        function collidesWithSofa(x, z, yBottom, yTop) {
            if (!sofaColliders.length) return false;
            for (const box of sofaColliders) {
                if (yBottom >= box.max.y - 0.05) continue;
                if (yTop < box.min.y || yBottom > box.max.y) continue;
                const clampedX = Math.max(box.min.x, Math.min(box.max.x, x));
                const clampedZ = Math.max(box.min.z, Math.min(box.max.z, z));
                const dx = x - clampedX;
                const dz = z - clampedZ;
                if ((dx * dx + dz * dz) <= playerRadius * playerRadius) return true;
            }
            return false;
        }

        function getSofaGroundHeight(x, z, yBottom) {
            let ground = eyeHeight;
            if (!sofaColliders.length) return ground;
            for (const box of sofaColliders) {
                const inXZ = (
                    x > box.min.x - playerRadius &&
                    x < box.max.x + playerRadius &&
                    z > box.min.z - playerRadius &&
                    z < box.max.z + playerRadius
                );
                if (!inXZ) continue;
                if (yBottom >= box.max.y - 0.05) {
                    ground = Math.max(ground, box.max.y + eyeHeight);
                }
            }
            return ground;
        }

        function setupControls() {
            const dom = renderer.domElement;
            dom.addEventListener('pointerdown', (event) => {
                const target = event.target;
                if (target.closest('header') || target.closest('.modal')) return;
                if (handleBeerBoardPress(event)) {
                    event.preventDefault();
                    return;
                }
            });
            dom.addEventListener('pointerup', () => stopBoardScrollHold());
            dom.addEventListener('pointerleave', () => stopBoardScrollHold());
            dom.addEventListener('pointercancel', () => stopBoardScrollHold());
            dom.addEventListener('click', (event) => {
                const target = event.target;
                if (target.closest('header') || target.closest('.modal')) return;
                if (handleBeerBoardClick(event)) return;
                dom.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                isLocked = document.pointerLockElement === dom;
                document.body.classList.toggle('pointer-locked', isLocked);
                if (!isLocked) stopBoardScrollHold();
            });

            document.addEventListener('mousemove', (event) => {
                if (!isLocked) return;
                const movementX = event.movementX || 0;
                const movementY = event.movementY || 0;
                yawObject.rotation.y -= movementX * 0.002;
                pitchObject.rotation.x -= movementY * 0.002;
                const maxPitch = Math.PI / 2 - 0.1;
                pitchObject.rotation.x = Math.max(-maxPitch, Math.min(maxPitch, pitchObject.rotation.x));
            });

            document.addEventListener('keydown', (event) => {
                if ((event.ctrlKey || event.metaKey) && (event.code === 'KeyA' || event.code === 'KeyD')) {
                    return;
                }
                if (event.code === 'KeyW') moveState.forward = true;
                if (event.code === 'KeyS') moveState.back = true;
                if (event.code === 'KeyA') moveState.left = true;
                if (event.code === 'KeyD') moveState.right = true;
                if (event.code === 'ShiftLeft' || event.code === 'ShiftRight') moveState.fast = true;
                if (event.code === 'Space') {
                    if (isGrounded) {
                        verticalVelocity = jumpVelocity;
                        isGrounded = false;
                    }
                }
            });
            document.addEventListener('keyup', (event) => {
                if (event.code === 'KeyW') moveState.forward = false;
                if (event.code === 'KeyS') moveState.back = false;
                if (event.code === 'KeyA') moveState.left = false;
                if (event.code === 'KeyD') moveState.right = false;
                if (event.code === 'ShiftLeft' || event.code === 'ShiftRight') moveState.fast = false;
            });
            window.addEventListener('blur', () => {
                moveState.forward = false;
                moveState.back = false;
                moveState.left = false;
                moveState.right = false;
                moveState.fast = false;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createNameSprite(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 26px Comfortaa, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(2.6, 0.65, 1);
            sprite.userData.text = text;
            sprite.renderOrder = 10;
            sprite.material.depthTest = false;
            sprite.material.depthWrite = false;
            sprite.material.transparent = true;
            return sprite;
        }

        function loadAvatarModel() {
            if (avatarLoadPromise) return avatarLoadPromise;
            if (!THREE.GLTFLoader) {
                console.warn('GLTFLoader not available for avatar.');
                return Promise.resolve(null);
            }
            const loader = new THREE.GLTFLoader();
            avatarLoadPromise = new Promise((resolve) => {
                const handleLoad = (gltf) => {
                    avatarTemplate = gltf.scene;
                    avatarClips = Array.isArray(gltf.animations) ? gltf.animations : [];
                    resolve(avatarTemplate);
                };
                const handleError = (err) => {
                    console.warn('Avatar load failed', err);
                    if (AVATAR_MODEL_FALLBACK_URL && AVATAR_MODEL_FALLBACK_URL !== AVATAR_MODEL_URL) {
                        loader.load(AVATAR_MODEL_FALLBACK_URL, handleLoad, undefined, (fallbackErr) => {
                            console.warn('Avatar fallback failed', fallbackErr);
                            resolve(null);
                        });
                    } else {
                        resolve(null);
                    }
                };
                loader.load(AVATAR_MODEL_URL, handleLoad, undefined, handleError);
            });
            return avatarLoadPromise;
        }

        function cloneAvatar() {
            if (!avatarTemplate) return null;
            if (THREE.SkeletonUtils && THREE.SkeletonUtils.clone) {
                return THREE.SkeletonUtils.clone(avatarTemplate);
            }
            return avatarTemplate.clone(true);
        }

        function findClip(namePart) {
            const target = String(namePart || '').toLowerCase();
            return avatarClips.find((clip) => String(clip.name || '').toLowerCase().includes(target));
        }

        function setupAvatar(group) {
            const avatar = cloneAvatar();
            if (!avatar) return null;
            avatar.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = false;
                    child.receiveShadow = false;
                    child.frustumCulled = false;
                }
            });
            const box = new THREE.Box3().setFromObject(avatar);
            const size = box.getSize(new THREE.Vector3());
            const height = Math.max(size.y, 0.0001);
            const scale = 1.7 / height;
            avatar.scale.setScalar(scale);
            avatar.updateMatrixWorld(true);
            const adjustedBox = new THREE.Box3().setFromObject(avatar);
            avatar.position.y -= adjustedBox.min.y;
            group.add(avatar);
            const avatarHeight = adjustedBox.getSize(new THREE.Vector3()).y;
            const mixer = new THREE.AnimationMixer(avatar);
            const actions = {
                idle: findClip('idle'),
                walk: findClip('walk'),
                run: findClip('run')
            };
            const actionMap = {};
            Object.entries(actions).forEach(([key, clip]) => {
                if (!clip) return;
                const action = mixer.clipAction(clip);
                action.play();
                action.enabled = true;
                action.weight = key === 'idle' ? 1 : 0;
                actionMap[key] = action;
            });
            group.userData.avatar = avatar;
            group.userData.avatarHeight = avatarHeight;
            group.userData.mixer = mixer;
            group.userData.actions = actionMap;
            group.userData.activeAction = 'idle';
            if (group.userData.label) {
                group.userData.label.position.y = (avatarHeight || 1.7) + 0.35;
            }
            if (group.userData.placeholder) {
                group.remove(group.userData.placeholder);
                group.userData.placeholder = null;
            }
            return avatar;
        }

        function setAvatarAction(group, name) {
            const actions = group?.userData?.actions;
            if (!actions || !actions[name]) return;
            if (group.userData.activeAction === name) return;
            Object.entries(actions).forEach(([key, action]) => {
                action.weight = key === name ? 1 : 0;
            });
            group.userData.activeAction = name;
        }

        function upsertRemotePlayer(user) {
            if (!user || !scene) return;
            const id = user.id;
            if (!id) return;
            let current = remotePlayers.get(id);
            if (!current) {
                const group = createRemotePlayer(user);
                scene.add(group);
                current = { group, target: new THREE.Vector3(), yaw: 0 };
                remotePlayers.set(id, current);
            }
            const baseY = (Number(user.y) || eyeHeight) - eyeHeight;
            current.target.set(user.x || 0, baseY, user.z || 0);
            current.yaw = user.yaw || 0;
            if (user.name && current.group.userData.label) {
                const label = current.group.userData.label;
                if (label.userData?.text !== user.name) {
                    const newLabel = createNameSprite(user.name);
                    newLabel.position.copy(label.position);
                    current.group.remove(label);
                    current.group.add(newLabel);
                    current.group.userData.label = newLabel;
                }
            }
        }

        function updateRemotePlayers(delta) {
            remotePlayers.forEach((player) => {
                const smoothing = 1 - Math.pow(0.001, delta);
                const prev = player.group.position.clone();
                player.group.position.lerp(player.target, smoothing);
                player.group.rotation.y += (player.yaw - player.group.rotation.y) * smoothing;
                if (player.group.userData.label) {
                    player.group.userData.label.lookAt(camera.position);
                }
                const horizontal = new THREE.Vector2(
                    player.group.position.x - prev.x,
                    player.group.position.z - prev.z
                );
                const speed = horizontal.length() / Math.max(delta, 0.0001);
                const speedSmoothing = 1 - Math.pow(0.001, delta);
                const prevSpeed = player.speed || 0;
                const smoothSpeed = prevSpeed + (speed - prevSpeed) * speedSmoothing;
                player.speed = smoothSpeed;
                if (player.group.userData.mixer) {
                    player.group.userData.mixer.update(delta);
                    if (speed > 1.8 && player.group.userData.actions?.run) {
                        setAvatarAction(player.group, 'run');
                    } else if (speed > 0.15 && player.group.userData.actions?.walk) {
                        setAvatarAction(player.group, 'walk');
                    } else {
                        setAvatarAction(player.group, 'idle');
                    }
                } else if (player.group.userData.placeholder?.userData?.limbs) {
                    const limbs = player.group.userData.placeholder.userData.limbs;
                    const stride = Math.min(1, smoothSpeed / 1.6);
                    if (!player.walkPhase) player.walkPhase = 0;
                    if (smoothSpeed > 0.05) {
                        player.walkPhase += smoothSpeed * delta * 3.6;
                    } else {
                        player.walkPhase *= Math.max(0, 1 - delta * 6);
                    }
                    const phase = player.walkPhase;
                    const swing = Math.sin(phase) * 0.24 * stride;
                    const sway = Math.cos(phase) * 0.05 * stride;
                    const leftBaseX = typeof limbs.armLeft.userData.baseRotX === 'number' ? limbs.armLeft.userData.baseRotX : 0;
                    const rightBaseX = typeof limbs.armRight.userData.baseRotX === 'number' ? limbs.armRight.userData.baseRotX : 0;
                    limbs.armLeft.rotation.x = leftBaseX + swing;
                    limbs.armRight.rotation.x = rightBaseX - swing;
                    limbs.legLeft.rotation.x = -swing;
                    limbs.legRight.rotation.x = swing;
                    if (typeof limbs.armLeft.userData.baseRotZ === 'number') {
                        limbs.armLeft.rotation.z = limbs.armLeft.userData.baseRotZ + sway * 0.25;
                    } else {
                        limbs.armLeft.rotation.z = sway * 0.25;
                    }
                    if (typeof limbs.armRight.userData.baseRotZ === 'number') {
                        limbs.armRight.rotation.z = limbs.armRight.userData.baseRotZ - sway * 0.25;
                    } else {
                        limbs.armRight.rotation.z = -sway * 0.25;
                    }
                    limbs.legLeft.rotation.z = -sway * 0.12;
                    limbs.legRight.rotation.z = sway * 0.12;
                }
            });
        }

        function compareBeerNames(a, b) {
            const nameA = getBeerName(a).toLowerCase();
            const nameB = getBeerName(b).toLowerCase();
            const isLatinA = /^[a-z0-9]/i.test(nameA);
            const isLatinB = /^[a-z0-9]/i.test(nameB);
            if (isLatinA && !isLatinB) return -1;
            if (!isLatinA && isLatinB) return 1;
            return nameA.localeCompare(nameB, 'ru');
        }

        function normalizeBeerData(raw) {
            if (Array.isArray(raw)) return raw;
            if (raw && typeof raw === 'object') {
                return Object.entries(raw)
                    .map(([key, value]) => {
                        if (!value || typeof value !== 'object') return null;
                        return { id: value.id ?? key, ...value };
                    })
                    .filter(Boolean);
            }
            return [];
        }

        function applyBeerData(raw, { cache = true } = {}) {
            const normalized = normalizeBeerData(raw);
            beerData = normalized;
            beerData.sort(compareBeerNames);
            if (beerData.length) {
                const exists = beerData.some((beer) => String(beer.id) === String(selectedBeerId));
                if (!exists) selectedBeerId = String(beerData[0].id);
            }
            renderBeerSelect();
            createBeerBoard();
            updateBeerBoard();
            updateBeerBoardArrows();
            if (cache) {
                writeCache(BEER_CACHE_KEY, beerData);
                writeCacheTs(BEER_CACHE_TS_KEY);
            }
        }

        function getBeerName(beer) {
            return String(beer?.name || '').trim();
        }

        function getRatingsCount(beer) {
            if (!beer) return null;
            if (typeof beer.rating_count === 'number') return beer.rating_count;
            if (Array.isArray(beer.ratings)) return beer.ratings.length;
            if (beer.ratings && typeof beer.ratings === 'object') return Object.keys(beer.ratings).length;
            return null;
        }

        function getRatingsSummary(beer) {
            const result = { avg: null, my: null, count: null };
            if (!beer) return result;
            const ratings = beer.ratings && typeof beer.ratings === 'object' ? beer.ratings : null;
            if (ratings) {
                const values = Object.values(ratings)
                    .map((val) => parseFloat(String(val || '').replace(',', '.')))
                    .filter((num) => Number.isFinite(num) && num > 0);
                result.count = values.length || null;
                if (values.length) {
                    result.avg = values.reduce((sum, val) => sum + val, 0) / values.length;
                }
                const userName = getCurrentUserName();
                if (userName && ratings[userName] != null) {
                    const myVal = parseFloat(String(ratings[userName] || '').replace(',', '.'));
                    if (Number.isFinite(myVal)) result.my = myVal;
                }
            }
            return result;
        }

        function formatNumber(value, digits = 1) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '—';
            return num.toFixed(digits).replace(/\.0+$/, '').replace(/\.$/, '');
        }

        function formatBeerValue(value, suffix = '') {
            if (value === undefined || value === null || value === '') return '—';
            return `${value}${suffix}`;
        }

        function getRatingsSummaryText(beer) {
            const ratings = beer?.ratings && typeof beer.ratings === 'object' ? beer.ratings : null;
            if (!ratings) return '—';
            const entries = Object.entries(ratings).map(([name, val]) => {
                const num = parseFloat(String(val || '').replace(',', '.'));
                return `${name}: ${Number.isFinite(num) ? formatNumber(num, 1) : '—'}`;
            });
            return entries.length ? entries.join(' · ') : '—';
        }

        function createBeerTitleTexture(beer) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 120;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(14, 18, 26, 0.82)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, 'rgba(245, 158, 11, 0.14)');
            grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.55)';
            ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = 'bold 32px Comfortaa, sans-serif';
            ctx.fillStyle = '#f8fafc';
            const name = String(beer?.name || 'Без названия');
            ctx.fillText(name, 16, 10);
            ctx.font = '22px Comfortaa, sans-serif';
            ctx.fillStyle = 'rgba(226, 232, 240, 0.8)';
            const meta = String(beer?.country || '—');
            ctx.fillText(meta, 16, 60);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function createBeerInfoTexture(beer) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(12, 16, 24, 0.82)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, 'rgba(245, 158, 11, 0.12)');
            grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
            ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = '20px Comfortaa, sans-serif';
            ctx.fillStyle = 'rgba(226, 232, 240, 0.95)';

            const summary = getRatingsSummary(beer);
            const avgText = summary.avg != null ? formatNumber(summary.avg, 1) : formatBeerValue(beer?.rating);
            const countText = summary.count != null ? String(summary.count) : (getRatingsCount(beer) != null ? String(getRatingsCount(beer)) : '—');
            const ratingsText = getRatingsSummaryText(beer);

            const lines = [
                `Рейтинг: ${avgText} (оценок: ${countText})`,
                `Оценки: ${ratingsText}`,
                `Автор: ${formatBeerValue(beer?.author)}`,
                `Вид: ${formatBeerValue(beer?.type)}`,
                `Сорт: ${formatBeerValue(beer?.style)}`,
                `Объём: ${formatBeerValue(beer?.volume, ' л')}`,
                `Крепость: ${formatBeerValue(formatNumber(beer?.alcohol, 1), '%')}`,
                `Калории: ${formatBeerValue(formatNumber(beer?.calories, 0), ' ккал')}`
            ];

            let y = 12;
            const leftPad = 16;
            const maxWidth = canvas.width - leftPad * 2;
            lines.forEach((line) => {
                const text = truncateText(ctx, line, maxWidth);
                ctx.fillText(text, leftPad, y);
                y += 26;
            });
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function createBottleMesh(beer) {
            const group = new THREE.Group();
            const width = 1.35;
            const height = 2.5;
            const planeGeo = new THREE.PlaneGeometry(width, height);
            const mat = new THREE.MeshBasicMaterial({ transparent: true, color: 0xffffff });
            applyBoardStencil(mat);
            const mesh = new THREE.Mesh(planeGeo, mat);
            mesh.position.set(0, height / 2, 0.02);
            group.add(mesh);
            const url = (beer.imageUrl || '').trim();
            if (url && !/^data:image/i.test(url)) {
                const safe = toSafeImageUrl(url);
                bottleTextureLoader.load(safe, (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    texture.minFilter = THREE.LinearFilter;
                    texture.magFilter = THREE.LinearFilter;
                    mesh.material.map = texture;
                    mesh.material.needsUpdate = true;
                    const img = texture.image;
                    if (img && img.width && img.height) {
                        const aspect = img.width / img.height;
                        const targetWidth = height * aspect;
                        mesh.scale.x = targetWidth / width;
                    }
                });
            }
            group.userData.mesh = mesh;
            return group;
        }

        function createBeerBoard() {
            boardGroup.clear();
            boardArrowMeshes = [];
            boardContentGroup = new THREE.Group();

            const boardWidth = room.width * 0.7;
            const boardHeight = 7.4;
            const boardDepth = 0.3;
            const frameThickness = 0.35;
            const innerPadding = 0.8;
            const boardMat = new THREE.MeshStandardMaterial({ color: 0x0f141d, roughness: 0.9, metalness: 0.05 });
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x3c2a1d, roughness: 0.7, metalness: 0.1 });
            const boardMesh = new THREE.Mesh(new THREE.BoxGeometry(boardWidth, boardHeight, boardDepth), boardMat);
            boardMesh.position.set(0, 4.15, -room.depth / 2 + 0.2);
            boardMesh.rotation.y = 0;
            boardGroup.add(boardMesh);

            const frameGeoH = new THREE.BoxGeometry(boardWidth + frameThickness * 2, frameThickness, boardDepth + 0.05);
            const frameGeoV = new THREE.BoxGeometry(frameThickness, boardHeight + frameThickness * 2, boardDepth + 0.05);
            const frameTop = new THREE.Mesh(frameGeoH, frameMat);
            frameTop.position.set(0, boardMesh.position.y + boardHeight / 2 + frameThickness / 2, boardMesh.position.z);
            const frameBottom = frameTop.clone();
            frameBottom.position.y = boardMesh.position.y - boardHeight / 2 - frameThickness / 2;
            const frameLeft = new THREE.Mesh(frameGeoV, frameMat);
            frameLeft.position.set(-boardWidth / 2 - frameThickness / 2, boardMesh.position.y, boardMesh.position.z);
            const frameRight = frameLeft.clone();
            frameRight.position.x = boardWidth / 2 + frameThickness / 2;
            boardGroup.add(frameTop, frameBottom, frameLeft, frameRight);

            boardContentGroup.position.set(0, boardMesh.position.y + boardHeight * 0.015, boardMesh.position.z + 0.18);
            boardGroup.add(boardContentGroup);

            const arrowMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.6, metalness: 0.2 });
            const arrowGeo = new THREE.ConeGeometry(0.5, 1.05, 3);
            const arrowLeft = new THREE.Mesh(arrowGeo, arrowMat);
            arrowLeft.rotation.z = Math.PI / 2;
            arrowLeft.position.set(-boardWidth / 2 - 0.9, boardMesh.position.y, boardMesh.position.z + 0.55);
            arrowLeft.userData.scrollDir = 1;
            const arrowRight = new THREE.Mesh(arrowGeo, arrowMat);
            arrowRight.rotation.z = -Math.PI / 2;
            arrowRight.position.set(boardWidth / 2 + 0.9, boardMesh.position.y, boardMesh.position.z + 0.55);
            arrowRight.userData.scrollDir = -1;
            boardGroup.add(arrowLeft, arrowRight);
            boardArrowMeshes.push(arrowLeft, arrowRight);

            boardGroup.userData.boardWidth = boardWidth;
            boardGroup.userData.boardHeight = boardHeight;

            const innerWidth = boardWidth - frameThickness * 2 - innerPadding;
            const innerHeight = boardHeight - frameThickness * 2 - innerPadding;
            boardGroup.userData.innerWidth = innerWidth;
            boardGroup.userData.innerHeight = innerHeight;
            const left = boardMesh.position.x - innerWidth / 2;
            const right = boardMesh.position.x + innerWidth / 2;
            const bottom = boardMesh.position.y - innerHeight / 2;
            const top = boardMesh.position.y + innerHeight / 2;
            boardClipPlanes = [
                new THREE.Plane(new THREE.Vector3(1, 0, 0), -left),
                new THREE.Plane(new THREE.Vector3(-1, 0, 0), right),
                new THREE.Plane(new THREE.Vector3(0, 1, 0), -bottom),
                new THREE.Plane(new THREE.Vector3(0, -1, 0), top)
            ];
            const clipGeo = new THREE.PlaneGeometry(innerWidth, innerHeight);
            const clipMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            clipMat.colorWrite = false;
            clipMat.depthTest = false;
            clipMat.depthWrite = false;
            clipMat.stencilWrite = true;
            clipMat.stencilRef = boardStencilRef;
            clipMat.stencilFunc = THREE.AlwaysStencilFunc;
            clipMat.stencilZPass = THREE.ReplaceStencilOp;
            clipMat.stencilZFail = THREE.ReplaceStencilOp;
            clipMat.stencilFail = THREE.ReplaceStencilOp;
            clipMat.side = THREE.DoubleSide;
            boardClipMesh = new THREE.Mesh(clipGeo, clipMat);
            boardClipMesh.position.set(boardMesh.position.x, boardMesh.position.y, boardMesh.position.z + 0.16);
            boardClipMesh.renderOrder = 1;
            boardGroup.add(boardClipMesh);
        }

        function updateBeerBoard() {
            if (!boardGroup) return;
            if (!beerData.length) {
                boardContentGroup.clear();
                return;
            }
            boardContentGroup.clear();
            const boardWidth = boardGroup.userData.boardWidth || room.width * 0.7;
            const innerWidth = boardGroup.userData.innerWidth || (boardWidth - 4.4);
            const gap = 0.2;
            const itemWidth = Math.min(2.6, Math.max(1.9, innerWidth / Math.min(beerData.length, 22)));
            const totalWidth = itemWidth * beerData.length + gap * (beerData.length - 1);
            boardScrollState.maxOffset = Math.max(0, (totalWidth - innerWidth) / 2);
            boardScrollState.step = itemWidth + gap;
            boardScrollState.target = boardScrollState.maxOffset;
            boardScrollState.offset = boardScrollState.target;
            boardContentGroup.position.x = boardScrollState.offset;

            const startX = -totalWidth / 2 + itemWidth / 2;
            beerData.forEach((beer, i) => {
                const group = new THREE.Group();
                group.position.set(startX + i * (itemWidth + gap), 0, 0);
                const bottle = createBottleMesh(beer);
                bottle.position.set(0, 0.25, 0);
                group.add(bottle);

                const titleTex = createBeerTitleTexture(beer);
                const titleMat = new THREE.MeshBasicMaterial({ map: titleTex, transparent: true });
                applyBoardStencil(titleMat);
                const titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(itemWidth * 0.9, 0.6), titleMat);
                titleMesh.position.set(0, -0.9, 0.02);
                group.add(titleMesh);

                const infoTex = createBeerInfoTexture(beer);
                const infoMat = new THREE.MeshBasicMaterial({ map: infoTex, transparent: true });
                applyBoardStencil(infoMat);
                const infoMesh = new THREE.Mesh(new THREE.PlaneGeometry(itemWidth * 0.95, 1.25), infoMat);
                infoMesh.position.set(0, -2.25, 0.02);
                group.add(infoMesh);

                boardContentGroup.add(group);
            });
            applyBoardStencilToGroup();
        }

        function applyBoardStencilToGroup() {
            if (!boardContentGroup || !boardClipMesh) return;
            boardContentGroup.traverse((obj) => {
                if (!obj.isMesh) return;
                obj.renderOrder = 2;
                const material = obj.material;
                if (Array.isArray(material)) {
                    material.forEach((mat) => applyBoardStencil(mat));
                } else {
                    applyBoardStencil(material);
                }
            });
        }

        function applyBoardClipping(material) {
            if (!material || !boardClipPlanes) return;
            material.clippingPlanes = boardClipPlanes;
            material.clipIntersection = true;
            material.needsUpdate = true;
        }

        function applyBoardStencil(material) {
            if (!material) return;
            material.stencilWrite = true;
            material.stencilRef = boardStencilRef;
            material.stencilFunc = THREE.EqualStencilFunc;
            material.stencilFail = THREE.KeepStencilOp;
            material.stencilZFail = THREE.KeepStencilOp;
            material.stencilZPass = THREE.KeepStencilOp;
            material.needsUpdate = true;
        }

        function updateBeerBoardArrows() {
            if (!boardArrowMeshes.length) return;
            const maxOffset = boardScrollState.maxOffset || 0;
            const offset = boardScrollState.target || 0;
            boardArrowMeshes.forEach((arrow) => {
                if (!arrow.userData.scrollDir) return;
                if (maxOffset <= 0) {
                    arrow.visible = false;
                    return;
                }
                if (arrow.userData.scrollDir > 0) {
                    arrow.visible = offset < maxOffset - 0.05;
                } else {
                    arrow.visible = offset > -maxOffset + 0.05;
                }
            });
        }

        function scrollBeerBoard(direction) {
            if (!boardContentGroup) return;
            const step = boardScrollState.step || 0;
            if (!step) return;
            const next = (boardScrollState.target ?? boardScrollState.offset ?? 0) + direction * step;
            const maxOffset = boardScrollState.maxOffset || 0;
            boardScrollState.target = Math.max(-maxOffset, Math.min(maxOffset, next));
            updateBeerBoardArrows();
        }

        function startBoardScrollHold(direction) {
            boardScrollState.holdDir = direction;
            boardScrollState.speed = 8.5;
        }

        function stopBoardScrollHold() {
            boardScrollState.holdDir = 0;
            boardScrollState.speed = 0;
        }

        function handleBeerBoardClick(event) {
            if (!boardArrowMeshes.length || !renderer || !camera) return false;
            const rect = renderer.domElement.getBoundingClientRect();
            let x = rect.width / 2;
            let y = rect.height / 2;
            if (!isLocked && event) {
                x = event.clientX - rect.left;
                y = event.clientY - rect.top;
            }
            boardPointer.x = (x / rect.width) * 2 - 1;
            boardPointer.y = -(y / rect.height) * 2 + 1;
            boardRaycaster.setFromCamera(boardPointer, camera);
            const hits = boardRaycaster.intersectObjects(boardArrowMeshes, true);
            if (!hits.length) return false;
            const target = hits[0].object;
            const dir = target.userData.scrollDir || target.parent?.userData?.scrollDir;
            if (!dir) return false;
            scrollBeerBoard(dir);
            return true;
        }

        function handleBeerBoardPress(event) {
            if (!boardArrowMeshes.length || !renderer || !camera) return false;
            const rect = renderer.domElement.getBoundingClientRect();
            let x = rect.width / 2;
            let y = rect.height / 2;
            if (!isLocked && event) {
                x = event.clientX - rect.left;
                y = event.clientY - rect.top;
            }
            boardPointer.x = (x / rect.width) * 2 - 1;
            boardPointer.y = -(y / rect.height) * 2 + 1;
            boardRaycaster.setFromCamera(boardPointer, camera);
            const hits = boardRaycaster.intersectObjects(boardArrowMeshes, true);
            if (!hits.length) return false;
            const target = hits[0].object;
            const dir = target.userData.scrollDir || target.parent?.userData?.scrollDir;
            if (!dir) return false;
            startBoardScrollHold(dir);
            return true;
        }

        function toSafeImageUrl(url) {
            if (!url) return '';
            if (url.startsWith('data:image')) return url;
            const clean = url.replace(/^https?:\/\//i, '');
            return `https://images.weserv.nl/?url=${encodeURIComponent(clean)}&output=png`;
        }

        function truncateText(ctx, text, maxWidth) {
            if (!text) return '';
            if (ctx.measureText(text).width <= maxWidth) return text;
            let clipped = text;
            while (clipped.length > 1 && ctx.measureText(clipped + '…').width > maxWidth) {
                clipped = clipped.slice(0, -1);
            }
            return clipped + '…';
        }

        function connectRealtime() {
            if (!REALTIME_WS_URL) return;
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
            const url = new URL(REALTIME_WS_URL);
            url.searchParams.set('room', REALTIME_ROOM);
            const localId = getLocalClientId();
            url.searchParams.set('id', localId);
            const name = getCurrentUserName() || 'Guest';
            url.searchParams.set('name', name);
            ws = new WebSocket(url.toString());
            wsConnected = false;

            ws.addEventListener('open', () => {
                wsConnected = true;
                lastPresenceSent = 0;
            });

            ws.addEventListener('message', (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (_) {
                    return;
                }
                if (!data || typeof data.type !== 'string') return;
                if (data.type === 'state') {
                    if (Array.isArray(data.users)) {
                        data.users.forEach((user) => {
                            if (user?.id === localId) return;
                            upsertRemotePlayer(user);
                        });
                    }
                    return;
                }
                if (data.type === 'user_join' && data.user) {
                    if (data.user.id === localId) return;
                    upsertRemotePlayer(data.user);
                    return;
                }
                if (data.type === 'user_leave' && data.id) {
                    removeRemotePlayer(data.id);
                    return;
                }
                if (data.type === 'presence' && data.user) {
                    if (data.user.id === localId) return;
                    upsertRemotePlayer(data.user);
                }
            });

            ws.addEventListener('close', () => {
                wsConnected = false;
                scheduleRealtimeReconnect();
            });
            ws.addEventListener('error', () => {
                wsConnected = false;
                scheduleRealtimeReconnect();
            });
        }

        function scheduleRealtimeReconnect() {
            if (wsReconnectTimer) return;
            wsReconnectTimer = setTimeout(() => {
                wsReconnectTimer = null;
                connectRealtime();
            }, 2500);
        }

        function sendRealtime(data) {
            if (!wsConnected || !ws || ws.readyState !== WebSocket.OPEN) return;
            try {
                ws.send(JSON.stringify(data));
            } catch (_) {}
        }

        function sendPresenceUpdate() {
            if (!wsConnected || !yawObject) return;
            const now = performance.now();
            if (now - lastPresenceSent < 140) return;
            lastPresenceSent = now;
            const pos = yawObject.position;
            sendRealtime({
                type: 'presence',
                name: getCurrentUserName(),
                x: pos.x,
                y: pos.y,
                z: pos.z,
                yaw: yawObject.rotation.y
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const speed = moveState.fast ? 12 : 6;
            const t = clock.getElapsedTime();
            if (neonSignGroup?.userData?.neon) {
                const neon = neonSignGroup.userData.neon;
                const flicker = 0.9 + 0.1 * Math.sin(t * 0.6) + 0.05 * Math.sin(t * 1.1);
                const jitter = 0.02 * Math.sin(t * 2.3);
                const intensity = Math.max(0.78, flicker + jitter);
                if (neon.halo) neon.halo.intensity = 0.9 + intensity * 1.1;
                if (neon.neonMat) neon.neonMat.emissiveIntensity = 0.85 + intensity * 0.9;
                if (neon.glowMat) neon.glowMat.opacity = 0.12 + intensity * 0.16;
            }
            const dirForward = (moveState.forward ? 1 : 0) - (moveState.back ? 1 : 0);
            const dirRight = (moveState.right ? 1 : 0) - (moveState.left ? 1 : 0);
            if (dirForward !== 0 || dirRight !== 0) {
                const yaw = yawObject.rotation.y;
                const forwardVec = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const rightVec = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const moveVec = forwardVec.multiplyScalar(dirForward).add(rightVec.multiplyScalar(dirRight)).normalize().multiplyScalar(speed * delta);
                const current = yawObject.position.clone();
                const proposed = current.clone().add(moveVec);
                const yBottom = yawObject.position.y - eyeHeight;
                const yTop = yawObject.position.y;
                if (collidesWithSofa(proposed.x, proposed.z, yBottom, yTop)) {
                    const tryX = { x: proposed.x, z: current.z };
                    const tryZ = { x: current.x, z: proposed.z };
                    if (!collidesWithSofa(tryX.x, tryX.z, yBottom, yTop)) {
                        proposed.z = current.z;
                    } else if (!collidesWithSofa(tryZ.x, tryZ.z, yBottom, yTop)) {
                        proposed.x = current.x;
                    } else {
                        proposed.x = current.x;
                        proposed.z = current.z;
                    }
                }
                const halfW = room.width / 2 - 2;
                const halfD = room.depth / 2 - 2;
                proposed.x = Math.max(-halfW, Math.min(halfW, proposed.x));
                proposed.z = Math.max(-halfD, Math.min(halfD, proposed.z));
                yawObject.position.x = proposed.x;
                yawObject.position.z = proposed.z;
            }
            if (boardContentGroup) {
                if (boardScrollState.holdDir) {
                    const maxOffset = boardScrollState.maxOffset || 0;
                    const speed = boardScrollState.speed || 0;
                    if (speed > 0) {
                        const base = boardScrollState.target ?? boardScrollState.offset ?? 0;
                        const next = base + boardScrollState.holdDir * speed * delta;
                        boardScrollState.target = Math.max(-maxOffset, Math.min(maxOffset, next));
                        updateBeerBoardArrows();
                    }
                }
                const diff = boardScrollState.target - boardScrollState.offset;
                if (Math.abs(diff) > 0.0005) {
                    const smooth = 1 - Math.exp(-4 * delta);
                    boardScrollState.offset += diff * smooth;
                    boardContentGroup.position.x = boardScrollState.offset;
                } else if (Math.abs(diff) > 0) {
                    boardScrollState.offset = boardScrollState.target;
                    boardContentGroup.position.x = boardScrollState.offset;
                }
            }
            const currentBottom = yawObject.position.y - eyeHeight;
            const groundY = getSofaGroundHeight(yawObject.position.x, yawObject.position.z, currentBottom);
            if (yawObject.position.y > groundY + 0.02) {
                isGrounded = false;
            }
            if (!isGrounded || verticalVelocity !== 0) {
                verticalVelocity += gravity * delta;
                yawObject.position.y += verticalVelocity * delta;
                if (yawObject.position.y <= groundY) {
                    yawObject.position.y = groundY;
                    verticalVelocity = 0;
                    isGrounded = true;
                }
            }
            sendPresenceUpdate();
            updateRemotePlayers(delta);
            renderer.render(scene, camera);
            if (cssRenderer && cssScene) {
                cssRenderer.render(cssScene, camera);
            }
        }

        function init() {
            if (!ensureAuth()) return;
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            initUI();
            initScene();
            connectRealtime();
            const db = firebase.database();
            const cachedBeer = readCache(BEER_CACHE_KEY);
            const hasCachedBeer = Array.isArray(cachedBeer) || (cachedBeer && typeof cachedBeer === 'object');
            if (hasCachedBeer) {
                applyBeerData(cachedBeer, { cache: false });
            }
            const beerTs = readCacheTs(BEER_CACHE_TS_KEY);
            if (!hasCachedBeer || shouldRefreshCache(beerTs)) {
                db.ref('beerRating').once('value').then((snapshot) => {
                    applyBeerData(snapshot.val());
                }).catch((err) => console.warn('beerRating fetch failed', err));
            }
            const cachedRug = readCache(RUG_CACHE_KEY);
            if (cachedRug) {
                applyRugTexture(cachedRug);
            }
            const rugTs = readCacheTs(RUG_CACHE_TS_KEY);
            if (shouldRefreshCache(rugTs)) {
                db.ref('beerShelfRugUrl').once('value').then((snapshot) => {
                    const url = snapshot.val() || DEFAULT_RUG_URL;
                    applyRugTexture(url);
                    writeCache(RUG_CACHE_KEY, url);
                    writeCacheTs(RUG_CACHE_TS_KEY);
                }).catch((err) => console.warn('beerShelfRugUrl fetch failed', err));
            }
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState !== 'visible') return;
                const freshBeerTs = readCacheTs(BEER_CACHE_TS_KEY);
                if (shouldRefreshCache(freshBeerTs)) {
                    db.ref('beerRating').once('value').then((snapshot) => {
                        applyBeerData(snapshot.val());
                    }).catch((err) => console.warn('beerRating refresh failed', err));
                }
                const freshRugTs = readCacheTs(RUG_CACHE_TS_KEY);
                if (shouldRefreshCache(freshRugTs)) {
                    db.ref('beerShelfRugUrl').once('value').then((snapshot) => {
                        const url = snapshot.val() || DEFAULT_RUG_URL;
                        applyRugTexture(url);
                        writeCache(RUG_CACHE_KEY, url);
                        writeCacheTs(RUG_CACHE_TS_KEY);
                    }).catch((err) => console.warn('beerShelfRugUrl refresh failed', err));
                }
            });
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
