    <style>
      :root {
        --bg: #07090d;
        --glass: rgba(19, 23, 31, 0.64);
        --glass-hi: rgba(255, 255, 255, 0.1);
        --text: #f8fafc;
        --muted: rgba(248, 250, 252, 0.62);
        --accent: #f59e0b;
        --accent2: #ffd27a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Comfortaa, system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        overflow-x: hidden;
        background:
          radial-gradient(
            900px 650px at 16% -20%,
            rgba(245, 158, 11, 0.17),
            transparent 62%
          ),
          radial-gradient(
            800px 500px at 100% 10%,
            rgba(53, 83, 120, 0.22),
            transparent 65%
          ),
          #07090d;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
      }
      input,
      select {
        font-size: 16px !important;
      }
      .music-page {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: var(--ks-menu-top, 14px) clamp(12px, 3vw, 38px)
          calc(24px + env(safe-area-inset-bottom));
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 12px;
      }
      .music-top {
        display: flex;
        align-items: center;
        min-height: var(--ks-control-height, 42px);
        padding-left: calc(var(--ks-clear-left, 54px) - 10px);
      }
      h1 {
        margin: 0;
        font-size: clamp(16px, 2vw, 22px);
      }
      .music-subtitle {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .music-layout {
        display: grid;
        grid-template-columns: minmax(280px, 0.78fr) minmax(0, 1.22fr);
        gap: 14px;
        min-height: 0;
      }
      .glass {
        background:
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.08),
            rgba(255, 255, 255, 0.025)
          ),
          var(--glass);
        border: 1px solid transparent;
        border-radius: 24px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(26px) saturate(1.18);
        -webkit-backdrop-filter: blur(26px) saturate(1.18);
      }
      .player {
        padding: clamp(16px, 3vw, 28px);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .cover-wrap {
        width: min(100%, 360px);
        aspect-ratio: 1;
        margin: 4px auto 18px;
        border-radius: 22px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.22);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
      }
      .cover-wrap img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .empty-cover {
        display: grid;
        place-items: center;
        font-size: 62px;
        color: rgba(255, 255, 255, 0.2);
      }
      .track-name {
        text-align: center;
        font-size: 20px;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track-artists {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        margin: 7px 0 18px;
        min-height: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .seek {
        width: 100%;
        accent-color: var(--accent);
        height: 24px;
      }
      .times {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 12px 0;
      }
      .control {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--glass-hi);
        display: grid;
        place-items: center;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .control:hover {
        background: rgba(245, 158, 11, 0.22);
        transform: translateY(-1px);
      }
      .control.play {
        width: 54px;
        height: 54px;
        background: linear-gradient(135deg, #fbbf24, #d97706);
        color: #211504;
        font-size: 20px;
      }
      .control:focus {
        outline: 0;
      }
      .volume {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .volume input {
        flex: 1;
        accent-color: var(--accent);
      }
      .notice {
        min-height: 18px;
        color: var(--muted);
        font-size: 12px;
        margin: 7px 0;
      }
      .library {
        padding: clamp(14px, 2vw, 22px);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .library-head,
      .add-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .playlist-select,
      .search {
        height: 42px;
        border-radius: 13px;
        background: rgba(0, 0, 0, 0.24);
        border: 1px solid transparent;
        padding: 0 13px;
      }
      .playlist-select {
        flex: 1;
        min-width: 160px;
      }
      .search {
        width: min(300px, 100%);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 12px 0;
      }
      .source-pill {
        padding: 8px 11px;
        border-radius: 999px;
        background: rgba(245, 158, 11, 0.15);
        color: var(--accent2);
        font-size: 11px;
      }
      .add-row input {
        flex: 1;
        min-width: 0;
      }
      .action {
        height: 42px;
        padding: 0 14px;
        border-radius: 13px;
        background: var(--glass-hi);
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .action:hover {
        background: rgba(245, 158, 11, 0.2);
        transform: translateY(-1px);
      }
      .action.primary {
        background: linear-gradient(135deg, #fbbf24, #d97706);
        color: #211504;
        font-weight: 700;
      }
      .list {
        list-style: none;
        padding: 0;
        margin: 0;
        overflow: auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        scrollbar-width: none;
      }
      .list::-webkit-scrollbar {
        display: none;
      }
      .track {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.035);
        transition:
          background 0.18s,
          transform 0.18s;
      }
      .track:hover {
        background: rgba(255, 255, 255, 0.09);
        transform: translateX(2px);
      }
      .track.active {
        background: rgba(245, 158, 11, 0.15);
      }
      .track-cover {
        width: 48px;
        height: 48px;
        object-fit: cover;
        border-radius: 11px;
        background: #121722;
      }
      .track-info {
        min-width: 0;
      }
      .track-title {
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track-meta {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 4px;
      }
      .track-actions {
        display: flex;
        gap: 4px;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font-size: 17px;
      }
      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.09);
        color: var(--text);
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 28px 10px;
        font-size: 13px;
      }
      .divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
        margin: 12px 0;
      }
      @media (max-width: 860px) {
        .music-page {
          padding: var(--ks-menu-top, 12px) 10px
            calc(16px + env(safe-area-inset-bottom));
          gap: 8px;
        }
        .music-layout {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .player {
          padding: 14px;
          flex: none;
        }
        .cover-wrap {
          width: min(62vw, 270px);
          margin: 0 auto 12px;
        }
        .track-name {
          font-size: 17px;
        }
        .track-artists {
          margin-bottom: 10px;
        }
        .controls {
          margin: 7px 0;
        }
        .control {
          width: 38px;
          height: 38px;
        }
        .control.play {
          width: 48px;
          height: 48px;
        }
        .library {
          min-height: 50dvh;
          max-height: none;
          padding: 12px;
        }
        .library-head {
          align-items: stretch;
          flex-wrap: wrap;
        }
        .playlist-select,
        .search {
          width: 100%;
          flex: 1;
        }
        .add-row {
          margin-bottom: 8px;
        }
        .list {
          max-height: 52dvh;
        }
        .music-top {
          padding-left: calc(var(--ks-clear-left, 54px) - 4px);
        }
        .music-subtitle {
          display: none;
        }
      }
      @media (max-width: 420px) {
        .music-page {
          padding-left: 8px;
          padding-right: 8px;
        }
        .glass {
          border-radius: 19px;
        }
        .cover-wrap {
          width: min(58vw, 230px);
        }
        .track-name {
          font-size: 15px;
        }
        .track {
          grid-template-columns: 42px minmax(0, 1fr) auto;
          padding: 7px;
        }
        .track-cover {
          width: 42px;
          height: 42px;
        }
        .track-actions .icon-btn {
          width: 30px;
          height: 30px;
        }
        .track-meta {
          font-size: 10px;
        }
        .action {
          padding: 0 11px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

        display: none !important;

      .track-actions {

      }

      .track-info button {

      }
      .track-title {

      }
      .track-title:hover {

      }
      .track-cover {

      }
      .track-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;

      }

      }
      .search {
        min-width: 0;

      }
      .source-switch {

      }
      .music-tabs {
        flex-wrap: wrap;

      }
      .action.active,

      .icon-btn[aria-pressed="true"] {

      }
      .list-options {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .list-options .notice {
        flex: 1;
        min-width: 0;
      }
      .list-options .action {
        font-size: 11px;
        padding: 0 10px;
        height: 34px;
      }
      .add-row {
        margin-bottom: 8px;
      }
      .icon-btn {
        display: grid;
        place-items: center;
      }
      .icon-btn svg,
      .control svg {
        height: 20px;
        width: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .control.play svg {
        fill: currentColor;
        stroke: none;
        height: 26px;
        width: 26px;
      }
      .expand-player {
        margin: 16px auto 0;
        font-size: 12px;
      }
      .music-dialog {
        color: var(--text);
        width: min(440px, calc(100vw - 24px));
        max-height: calc(100dvh - 32px);
        overflow: auto;
        border: 0;
        border-radius: 24px;
        padding: 24px;
        background: rgba(18, 22, 30, 0.72);
        backdrop-filter: blur(32px);
        -webkit-backdrop-filter: blur(32px);
        box-shadow: 0 24px 70px #0005;
      }
      .music-dialog::backdrop {
        background: #07090d80;

      }
      .music-dialog label {

      .music-dialog input,
      .music-dialog select {
        width: 100%;
      }
      .dialog-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .danger {
        color: #fca5a5;
      }
      .cover-wrap {

      }
      .playlist-select option {
        background: #171b24;

      }

      }

  <body class="noise ks-ui ks-page-music">
    <main class="music-page">
      <header class="music-top">
        <div>
          <h1>Музыка</h1>
          <p class="music-subtitle">Поиск, плейлисты и воспроизведение</p>
        </div>
      </header>
      <section class="music-layout">
        <section class="player glass" aria-label="Плеер">
          <button
            id="cover"
            type="button"
            class="cover-wrap empty-cover"
            aria-label="Развернуть плеер"
          >
            ♪
          </button>
          <h2 id="currentTitle" class="track-name">Выбери трек</h2>
          <p id="currentArtists" class="track-artists">
            Музыкальная библиотека
          </p>
          <input
            id="seek"
            class="seek"
            type="range"
            min="0"
            max="0"
            value="0"
            step=".1"
            aria-label="Позиция"
          />
          <div class="times">
            <span id="timeCurrent">00:00</span><span id="timeTotal">00:00</span>
          </div>
          <div class="controls">
            <button
              id="shuffle"
              class="control"
              aria-label="Перемешивать"
              aria-pressed="false"
            >
              ⤨</button
            ><button id="prev" class="control" aria-label="Предыдущий">‹</button
            ><button id="play" class="control play" aria-label="Воспроизвести">
              ▶</button
            ><button id="next" class="control" aria-label="Следующий">›</button
            ><button
              id="repeat"
              class="control"
              aria-label="Повтор выключен"
              aria-pressed="false"
            >
              ↻
            </button>
          </div>
          <label class="volume"
            >Громкость<input
              id="volume"
              type="range"
              min="0"
              max="1"
              step=".01"
              value=".85"
          /></label>
          <div id="notice" class="notice" role="status"></div>
          <button
            id="expandPlayer"
            class="action expand-player"
            aria-label="Развернуть плеер"
          >
            Развернуть плеер</button
          ><button
            id="closePlayer"
            class="icon-btn"
            aria-label="Свернуть плеер"
            hidden
          >
            ×
          </button>
        </section>
        <section class="library glass">
          <div class="library-head">
            <select
              id="playlist"
              class="playlist-select"
              aria-label="Плейлист"
            ></select
            ><button
              id="playlistEdit"
              class="icon-btn"
              aria-label="Настройки плейлиста"
              title="Настройки плейлиста"
            >
              ⋯</button
            ><button
              id="playlistCreate"
              class="icon-btn"
              aria-label="Создать плейлист"
              title="Создать плейлист"
            >
              ＋</button
            ><input
              id="filter"
              class="search"
              type="search"
              placeholder="Поиск по плейлисту"
              aria-label="Поиск"
            />
          </div>
          <nav class="toolbar music-tabs" aria-label="Раздел музыки">
            <button class="action active" data-view="library">Плейлист</button
            ><button class="action" data-view="discover">Найти музыку</button
            ><button class="action" data-view="queue">Очередь</button>
          </nav>
          <div id="discoveryControls" hidden>
            <div class="source-switch" aria-label="Источник">
              <button class="action active" data-provider="truffled">
                Truffled</button
              ><button class="action" data-provider="yandex">Яндекс</button>
            </div>
            <div class="add-row">
              <input
                id="query"
                class="playlist-select"
                type="search"
                placeholder="Найти трек или исполнителя в Truffled"
                aria-label="Поиск музыки"
              /><button id="searchBtn" class="action primary" type="button">
                Найти
              </button>
            </div>
          </div>
          <div class="list-options">
            <p id="searchNotice" class="notice" role="status"></p>
            <button id="likedOnly" class="action" aria-pressed="false">
              ♡ Любимые</button
            ><button id="refresh" class="icon-btn" aria-label="Обновить">
              ↻
            </button>
          </div>
          <ul id="tracks" class="list" aria-label="Треки"></ul>
          <button id="loadMore" class="action" hidden>Показать ещё</button>
        </section>
      </section>
    </main>
    <dialog id="playlistDialog" class="music-dialog">
      <form id="playlistForm">
        <h2 id="playlistDialogTitle">Новый плейлист</h2>
        <label
          >Название<input
            id="playlistName"
            class="search"
            required
            maxlength="60"
            autocomplete="off" /></label
        ><label
          >Доступ<select id="playlistScope" class="playlist-select">
            <option value="shared">Общий</option>
            <option value="private">Личный</option>
          </select></label
        >
        <div class="dialog-actions">
          <button
            id="deletePlaylist"
            class="action danger"
            type="button"
            hidden
          >
            Удалить</button
          ><button id="cancelPlaylist" class="action" type="button">
            Отмена</button
          ><button class="action primary" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>
    <dialog id="trackDialog" class="music-dialog">
      <form id="trackForm">
        <h2>Редактировать трек</h2>
        <label
          >Название<input
            id="editTitle"
            class="search"
            required
            maxlength="160" /></label
        ><label
          >Исполнитель<input id="editArtists" class="search" maxlength="250"
        /></label>
        <div class="dialog-actions">
          <button class="action" type="button" id="cancelTrackEdit">
            Отмена</button
          ><button class="action primary" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>
    <dialog id="confirmDialog" class="music-dialog">
      <form method="dialog">
        <h2 id="confirmTitle">Удалить?</h2>
        <p id="confirmText"></p>
        <div class="dialog-actions">
          <button class="action" value="cancel">Отмена</button
          ><button class="action danger" value="confirm">Удалить</button>
        </div>
      </form>
    </dialog>
    <audio
      id="audio"
      preload="metadata"
      playsinline
      crossorigin="anonymous"
    ></audio>
    <script src="vendor/hls/hls.min.js" defer></script>
    <script src="music-app.js?v=20261010truffled" defer></script>
  </body>
</html>
