<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Киносреда | Музыка</title>
    <style id="ks-shell-preboot-style">
      html:not(.ks-shell-ready) body {
        visibility: hidden !important;
      }
    </style>
    <link rel="preload" as="style" href="kinosreda-shell.css?v=20261010music" />
    <script>
      (() => {
        try {
          if (!localStorage.getItem("currentUser")) {
            location.replace("login.html");
            return;
          }
          document.documentElement.classList.add("authed");
        } catch (_) {
          location.replace("login.html");
        }
      })();
    </script>
    <link rel="stylesheet" href="comfortaa.css" />
    <script src="/vendor/firebase-9.22.0/firebase-app-compat.js"></script>
    <script src="/vendor/firebase-9.22.0/firebase-database-compat.js"></script>
    <script src="./firebase-rtdb-rf-bypass.js?v=20261010music"></script>
    <link rel="stylesheet" href="kinosreda-shell.css?v=20261010music" />
    <script src="kinosreda-shell.js?v=20261010music" defer></script>
    <link rel="stylesheet" href="music.css?v=20261011-layout3" />
  </head>
  <body class="noise ks-ui ks-page-music">
    <main class="music-page">
      <header class="music-top ks-section-toolbar"><h1>Музыка</h1></header>
      <section class="music-layout">
        <section class="player glass" aria-label="Плеер">
          <div class="player-heading"><button id="closePlayer" class="icon-btn" aria-label="Свернуть плеер" hidden>×</button></div>
          <div class="player-art">
          <button
            id="cover"
            type="button"
            class="cover-wrap empty-cover"
            aria-label="Развернуть плеер"
          >
            ♪
          </button>
          </div><div class="player-transport">
          <h2 id="currentTitle" class="track-name">Выбери трек</h2>
          <p id="currentArtists" class="track-artists">
            Музыкальная библиотека
          </p>
          <input
            id="seek"
            class="seek"
            type="range"
            min="0"
            max="0"
            value="0"
            step=".1"
            aria-label="Позиция"
          />
          <div class="times">
            <span id="timeCurrent">00:00</span><span id="timeTotal">00:00</span>
          </div>
          <div class="controls">
            <button
              id="shuffle"
              class="control"
              aria-label="Перемешивать"
              aria-pressed="false"
            >
              ⤨</button
            ><button id="prev" class="control" aria-label="Предыдущий">‹</button
            ><button id="play" class="control play" aria-label="Воспроизвести">
              ▶</button
            ><button id="next" class="control" aria-label="Следующий">›</button
            ><button
              id="repeat"
              class="control"
              aria-label="Повтор выключен"
              aria-pressed="false"
            >
              ↻
            </button>
          </div>
          <label class="volume"
            >Громкость<input
              id="volume"
              type="range"
              min="0"
              max="1"
              step=".01"
              value=".85"
          /></label>
          <div id="notice" class="notice" role="status"></div>
          <button
            id="expandPlayer"
            class="action expand-player"
            aria-label="Развернуть плеер"
          >
            Развернуть плеер</button
          >
          </div>
        </section>
        <section class="library glass">
          <div class="library-head">
            <select
              id="playlist"
              class="playlist-select"
              aria-label="Плейлист"
            ></select
            ><button
              id="playlistEdit"
              class="icon-btn"
              aria-label="Настройки плейлиста"
              title="Настройки плейлиста"
            >
              ⋯</button
            ><button
              id="playlistCreate"
              class="icon-btn"
              aria-label="Создать плейлист"
              title="Создать плейлист"
            >
              ＋</button
            >
          </div>
          <nav class="music-tabs" aria-label="Раздел музыки">
            <button class="action active" data-view="library">Плейлист</button
            ><button class="action" data-view="discover">Найти музыку</button
            ><button class="action" data-view="queue">Очередь</button>
          </nav>
          <div id="librarySearch" class="library-search"><input
              id="filter"
              class="search"
              type="search"
              placeholder="Поиск по плейлисту"
              aria-label="Поиск"
            /></div>
          <div id="discoveryControls" hidden>
            <div class="source-switch" aria-label="Источник">
              <button class="action active" data-provider="truffled">
                Truffled</button
              ><button class="action" data-provider="yandex">Яндекс</button>
            </div>
            <div class="add-row">
              <input
                id="query"
                class="playlist-select"
                type="search"
                placeholder="Найти трек или исполнителя в Truffled"
                aria-label="Поиск музыки"
              /><button id="searchBtn" class="action primary" type="button">
                Найти
              </button>
            </div>
          </div>
          <div class="list-options">
            <p id="searchNotice" class="notice" role="status"></p>
            <button id="likedOnly" class="action" aria-pressed="false">
              ♡ Любимые</button
            ><button id="refresh" class="icon-btn" aria-label="Обновить">
              ↻
            </button>
          </div>
          <div class="track-list-viewport" tabindex="0" aria-label="Список треков">
          <ul id="tracks" class="list" aria-label="Треки"></ul>
          <button id="loadMore" class="action" hidden>Показать ещё</button>
          </div>
        </section>
      </section>
    </main>
    <dialog id="playlistDialog" class="music-dialog">
      <form id="playlistForm">
        <h2 id="playlistDialogTitle">Новый плейлист</h2>
        <label
          >Название<input
            id="playlistName"
            class="search"
            required
            maxlength="60"
            autocomplete="off" /></label
        ><label
          >Доступ<select id="playlistScope" class="playlist-select">
            <option value="shared">Общий</option>
            <option value="private">Личный</option>
          </select></label
        >
        <div class="dialog-actions">
          <button
            id="deletePlaylist"
            class="action danger"
            type="button"
            hidden
          >
            Удалить</button
          ><button id="cancelPlaylist" class="action" type="button">
            Отмена</button
          ><button class="action primary" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>
    <dialog id="trackDialog" class="music-dialog">
      <form id="trackForm">
        <h2>Редактировать трек</h2>
        <label
          >Название<input
            id="editTitle"
            class="search"
            required
            maxlength="160" /></label
        ><label
          >Исполнитель<input id="editArtists" class="search" maxlength="250"
        /></label>
        <div class="dialog-actions">
          <button class="action" type="button" id="cancelTrackEdit">
            Отмена</button
          ><button class="action primary" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>
    <dialog id="confirmDialog" class="music-dialog">
      <form method="dialog">
        <h2 id="confirmTitle">Удалить?</h2>
        <p id="confirmText"></p>
        <div class="dialog-actions">
          <button class="action" value="cancel">Отмена</button
          ><button class="action danger" value="confirm">Удалить</button>
        </div>
      </form>
    </dialog>
    <audio
      id="audio"
      preload="metadata"
      playsinline
      crossorigin="anonymous"
    ></audio>
    <script src="vendor/hls/hls.min.js" defer></script>
    <script src="music-app.js?v=20261011-layout3" defer></script>
  </body>
</html>
