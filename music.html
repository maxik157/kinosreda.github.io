      function setActiveToolPanel(nextPanel) {
        const panel = nextPanel === state.activeToolPanel ? "" : nextPanel;
        state.activeToolPanel = panel;
        if (els.searchPanel) els.searchPanel.classList.toggle("is-open", panel === "search");
        if (els.addPanel) els.addPanel.classList.toggle("is-open", panel === "add");
        if (els.toggleSearchPanelBtn) els.toggleSearchPanelBtn.classList.toggle("active", panel === "search");
        if (els.toggleAddPanelBtn) els.toggleAddPanelBtn.classList.toggle("active", panel === "add");

        if (panel === "search" && els.searchInput) {
          requestAnimationFrame(() => els.searchInput && els.searchInput.focus());
        }
        if (panel === "add" && els.trackUrlInput) {
          requestAnimationFrame(() => els.trackUrlInput && els.trackUrlInput.focus());
        }
      }

      function applyToken(nextToken, { persist = true, toastMessage = "" } = {}) {
        const normalized = String(nextToken || "").trim();
        state.token = normalized;
        if (persist) {
          if (normalized) {
            localStorage.setItem(TOKEN_KEY, normalized);
            setCookie(TOKEN_COOKIE_KEY, normalized, 30);
          } else {
            localStorage.removeItem(TOKEN_KEY);
            removeCookie(TOKEN_COOKIE_KEY);
          }
        }
        updateOAuthStatus();
        if (toastMessage) toast(toastMessage);
      }

      function hydrateTokenFromStorage() {
        const fromCookie = String(getCookie(TOKEN_COOKIE_KEY) || "").trim();
        const fromLocalStorage = String(localStorage.getItem(TOKEN_KEY) || "").trim();
        const token = fromCookie || fromLocalStorage;
        if (token) {
          applyToken(token, { persist: true });
        } else {
          updateOAuthStatus();
        }
      }

      function extractOAuthTokenFromHash() {
        const hashRaw = String(window.location.hash || "");
        if (!hashRaw || !hashRaw.includes("access_token=")) return false;
        const params = new URLSearchParams(hashRaw.startsWith("#") ? hashRaw.slice(1) : hashRaw);
        const token = String(params.get("access_token") || "").trim();
        const stateReturned = String(params.get("state") || "").trim();
        const expectedState = String(sessionStorage.getItem(OAUTH_STATE_KEY) || "").trim();
        sessionStorage.removeItem(OAUTH_STATE_KEY);

        if (!token) {
          toast("OAuth callback: access_token не найден", "err");
        } else if (expectedState && stateReturned && expectedState !== stateReturned) {
          toast("OAuth callback: state mismatch", "err");
        } else {
          applyToken(token, { persist: true, toastMessage: "OAuth токен получен и сохранен в cookie" });
        }

        try {
          const cleanUrl = `${window.location.pathname}${window.location.search}`;
          window.history.replaceState({}, document.title, cleanUrl);
        } catch (_) {
          window.location.hash = "";
        }
        return true;
      }

      async function loadOAuthConfig() {
        try {
          const response = await fetch(YANDEX_OAUTH_CONFIG_ENDPOINT, { headers: { Accept: "application/json" } });
          const payload = await parseYandexPayload(response);
          const config = payload && payload.result && typeof payload.result === "object" ? payload.result : {};
          state.oauthClientId = String(config.clientId || "").trim() || YANDEX_OAUTH_CLIENT_ID_FALLBACK;
          state.oauthAuthorizeUrl = String(config.authorizeUrl || "").trim() || YANDEX_OAUTH_AUTHORIZE_URL_FALLBACK;
          state.oauthConfigured = Boolean(config.configured || state.oauthClientId);
          updateOAuthStatus();
        } catch (_) {
          state.oauthClientId = YANDEX_OAUTH_CLIENT_ID_FALLBACK;
          state.oauthAuthorizeUrl = YANDEX_OAUTH_AUTHORIZE_URL_FALLBACK;
          state.oauthConfigured = Boolean(state.oauthClientId);
          updateOAuthStatus();
        }
      }

      async function startYandexOAuthLogin() {
        if (!state.oauthClientId) {
          await loadOAuthConfig();
        }
        const clientId = String(state.oauthClientId || YANDEX_OAUTH_CLIENT_ID_FALLBACK || "").trim();
        if (!clientId) throw new Error("OAuth client_id не найден");

        const stateNonce = (window.crypto && window.crypto.randomUUID)
          ? window.crypto.randomUUID()
          : `${Date.now()}_${Math.random().toString(36).slice(2)}`;
        sessionStorage.setItem(OAUTH_STATE_KEY, stateNonce);

        const redirectUri = `${window.location.origin}${window.location.pathname}`;
        const authUrl = new URL(state.oauthAuthorizeUrl || YANDEX_OAUTH_AUTHORIZE_URL_FALLBACK);
        authUrl.searchParams.set("response_type", "token");
        authUrl.searchParams.set("client_id", clientId);
        authUrl.searchParams.set("redirect_uri", redirectUri);
        authUrl.searchParams.set("state", stateNonce);
        window.location.assign(authUrl.toString());
      }

      function getCurrentUser() {
        const raw = localStorage.getItem("currentUser");
        const parsed = safeJson(raw, {});
        if (!parsed || typeof parsed !== "object") return null;
        const username = String(parsed.username || "").trim();
        const name = String(parsed.name || username || "User").trim();
        if (!username && !name) return null;
        return {
          username: username || name.toLowerCase().replace(/\s+/g, "_"),
          name
        };
      }

      function firebaseSafeKey(value) {
        return String(value || "")
          .trim()
          .toLowerCase()
          .replace(/[.#$/\[\]]/g, "_")
          .slice(0, 80);
      }

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return "00:00";
        const s = Math.floor(seconds);
        const mm = String(Math.floor(s / 60)).padStart(2, "0");
        const ss = String(s % 60).padStart(2, "0");
        return `${mm}:${ss}`;
      }

      function formatDate(ts) {
        if (!Number.isFinite(ts) || ts <= 0) return "сейчас";
        try {
          return new Date(ts).toLocaleString("ru-RU", {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          });
        } catch (_) {
          return "сейчас";
        }
      }

      function buildCoverUrl(rawTrack) {
        const raw = String(
          rawTrack.coverUrl
          || rawTrack.coverUri
          || rawTrack.cover_uri
          || rawTrack.ogImage
          || rawTrack.ogImageUrl
          || ""
        ).trim();
        if (!raw) return FALLBACK_COVER;
        let url = raw.replace("%%", "400x400");
        if (url.startsWith("//")) url = `https:${url}`;
        if (url.startsWith("/")) url = `https://music.yandex.ru${url}`;
        if (!/^https?:\/\//i.test(url)) url = `https://${url}`;
        return url;
      }

      function extractTrackId(value) {
        const string = String(value || "");
        const matched = string.match(/(\d+)/);
        return matched ? matched[1] : "";
      }

      function extractArtists(rawTrack) {
        const buckets = [
          rawTrack && rawTrack.artists,
          rawTrack && rawTrack.major && rawTrack.major.artists,
          rawTrack && rawTrack.albums && rawTrack.albums[0] && rawTrack.albums[0].artists
        ];
        const names = [];
        const addName = (value) => {
          const name = String(value || "").trim();
          if (name) names.push(name);
        };
        for (const bucket of buckets) {
          if (!Array.isArray(bucket)) continue;
          bucket.forEach((artist) => {
            if (!artist) return;
            if (typeof artist === "string") {
              addName(artist);
              return;
            }
            addName(
              artist.name
              || artist.artist
              || artist.title
              || artist.login
              || artist.handle
            );
            if (Array.isArray(artist.decomposed)) {
              artist.decomposed.forEach((part) => {
                if (!part || typeof part !== "object") return;
                if (part.name) addName(part.name);
              });
            }
          });
        }
        addName(rawTrack && rawTrack.artist);
        addName(rawTrack && rawTrack.artistsName);
        addName(rawTrack && rawTrack.subtitle);
        return [...new Set(names)];
      }

      function toTrackModel(rawTrack, source = "search") {
        const trackId = extractTrackId(rawTrack.trackId || rawTrack.id || rawTrack.realId || rawTrack.track_id);
        const albumId = extractTrackId(
          rawTrack.albumId
          || (rawTrack.albums && rawTrack.albums[0] && rawTrack.albums[0].id)
          || (rawTrack.album && rawTrack.album.id)
          || rawTrack.album_id
        );
        const artists = extractArtists(rawTrack);
        const title = String(rawTrack.title || rawTrack.name || `Трек ${trackId || "без id"}`).trim();
        const durationMs = Number(rawTrack.durationMs || rawTrack.duration_ms || rawTrack.duration || 0);
        const coverUrl = buildCoverUrl(rawTrack);
        const sourceUrl = rawTrack.sourceUrl
          || (albumId
            ? `https://music.yandex.ru/album/${albumId}/track/${trackId}`
            : `https://music.yandex.ru/track/${trackId}`);
        const likes = rawTrack.likes && typeof rawTrack.likes === "object" ? rawTrack.likes : {};

        return {
          key: rawTrack.key || "",
          trackId,
          albumId,
          title,
          artists,
          durationMs,
          coverUrl,
          sourceUrl,
          streamUrl: rawTrack.streamUrl || "",
          bitrate: rawTrack.bitrate || "",
          addedAt: Number(rawTrack.addedAt || 0),
          addedByName: rawTrack.addedByName || "",
          addedByUsername: rawTrack.addedByUsername || "",
          likes,
          source
        };
      }

      function getLikeCount(track) {
        if (!track || !track.likes || typeof track.likes !== "object") return 0;
        return Object.values(track.likes).filter(Boolean).length;
      }

      function isLikedByMe(track) {
        if (!state.currentUser) return false;
        const me = firebaseSafeKey(state.currentUser.username);
        return Boolean(track && track.likes && track.likes[me]);
      }

      function isDesktopViewport() {
        return window.matchMedia("(min-width: 1021px)").matches;
      }

      function hasSelectedTrack() {
        return Boolean(state.currentTrack && state.currentTrack.trackId);
      }

      function updateFullscreenEntryAvailability() {
        if (!els.currentCoverWrap) return;
        const enabled = isDesktopViewport() && hasSelectedTrack();
        els.currentCoverWrap.classList.toggle("is-disabled", !enabled);
        els.currentCoverWrap.setAttribute("aria-disabled", enabled ? "false" : "true");
        els.currentCoverWrap.tabIndex = enabled ? 0 : -1;
      }

      function markFullscreenResizing() {
        if (!state.fullscreenOpen || !els.fullscreenPlayer) return;
        els.fullscreenPlayer.classList.add("is-resizing");
        if (fullscreenResizeTimeout) {
          clearTimeout(fullscreenResizeTimeout);
          fullscreenResizeTimeout = null;
        }
        fullscreenResizeTimeout = setTimeout(() => {
          fullscreenResizeTimeout = null;
          if (els.fullscreenPlayer) {
            els.fullscreenPlayer.classList.remove("is-resizing");
          }
        }, 220);
      }

      function setFullscreenOpen(nextOpen) {
        const wantsOpen = Boolean(nextOpen);
        if (wantsOpen && (!isDesktopViewport() || !hasSelectedTrack())) {
          return;
        }
        const normalized = wantsOpen && isDesktopViewport();
        state.fullscreenOpen = normalized;
        document.body.classList.toggle("is-fullscreen-open", normalized);
        if (els.fullscreenPlayer) {
          els.fullscreenPlayer.classList.toggle("is-open", normalized);
          els.fullscreenPlayer.setAttribute("aria-hidden", normalized ? "false" : "true");
          if (!normalized) {
            els.fullscreenPlayer.classList.remove("is-resizing");
          }
        }
        if (!normalized && fullscreenResizeTimeout) {
          clearTimeout(fullscreenResizeTimeout);
          fullscreenResizeTimeout = null;
        }
        if (normalized) {
          updateCurrentTrackUI(state.currentTrack);
          updateProgressUI();
          setPlayButtonState(!els.audio.paused);
        }
        notifyParentPlayerState();
      }

      function toggleFullscreenOpen() {
        setFullscreenOpen(!state.fullscreenOpen);
      }

      function setPlayButtonState(isPlaying) {
        const iconMarkup = isPlaying
          ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"></path>'
          : '<path d="M8 5v14l11-7z"></path>';
        if (els.playIcon) els.playIcon.innerHTML = iconMarkup;
        if (els.fsPlayIcon) els.fsPlayIcon.innerHTML = iconMarkup;
        if (els.fsPlayBtn) {
          els.fsPlayBtn.title = isPlaying ? "Пауза" : "Воспроизвести";
        }
        notifyParentPlayerState();
      }

      function setShuffleMode(enabled) {
        state.shuffle = Boolean(enabled);
        const title = state.shuffle ? "Перемешивание: включено" : "Перемешивание: выключено";
        els.shuffleBtn.classList.toggle("active", state.shuffle);
        els.shuffleBtn.title = title;
        if (els.fsShuffleBtn) {
          els.fsShuffleBtn.classList.toggle("active", state.shuffle);
          els.fsShuffleBtn.title = title;
        }
        if (!els.shuffleIcon) return;
        const shuffleMarkup = state.shuffle
          ? '<polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line>'
          : '<polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line><line x1="5" y1="5" x2="19" y2="19"></line>';
        els.shuffleIcon.innerHTML = shuffleMarkup;
        if (els.fsShuffleIcon) {
          els.fsShuffleIcon.innerHTML = shuffleMarkup;
        }
      }

      function setRepeatMode(next) {
        const normalized = next === "once" || next === "loop" || next === "off" ? next : "off";
        state.repeatMode = normalized;
        state.repeatOnceConsumed = false;
        const title = normalized === "once"
          ? "Повтор: один раз"
          : normalized === "loop"
            ? "Повтор: бесконечно"
            : "Повтор: выключен";
        [els.repeatBtn, els.fsRepeatBtn].forEach((button) => {
          if (!button) return;
          button.dataset.mode = normalized;
          button.classList.toggle("active", normalized !== "off");
          button.title = title;
          const badgeEl = button.querySelector(".ctl-badge");
          if (badgeEl) {
            badgeEl.textContent = normalized === "loop" ? "∞" : "1";
          }
        });
        if (!els.repeatIcon) return;
        const repeatMarkup = normalized === "off"
          ? '<polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path><line x1="5" y1="5" x2="19" y2="19"></line>'
          : '<polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>';
        els.repeatIcon.innerHTML = repeatMarkup;
        if (els.fsRepeatIcon) {
          els.fsRepeatIcon.innerHTML = repeatMarkup;
        }
      }

      function getCurrentTrackIndex(list) {
        if (!Array.isArray(list) || !list.length || !state.currentTrack) return -1;
        if (state.currentTrack.key) {
          const byKey = list.findIndex((item) => item && item.key && item.key === state.currentTrack.key);
          if (byKey >= 0) return byKey;
        }
        const currentTrackId = String(state.currentTrack.trackId || "");
        if (!currentTrackId) return -1;
        return list.findIndex((item) => String(item && item.trackId || "") === currentTrackId);
      }

      function updateCurrentTrackUI(track) {
        if (!track) {
          els.currentCover.src = FALLBACK_COVER;
          els.currentTitle.textContent = "Выбери трек";
          els.currentArtists.textContent = "";
          if (els.fullscreenCover) els.fullscreenCover.src = FALLBACK_COVER;
          if (els.fullscreenTitle) els.fullscreenTitle.textContent = "Выбери трек";
          if (els.fullscreenArtists) els.fullscreenArtists.textContent = "";
          if (els.currentDuration) els.currentDuration.textContent = "00:00";
          if (els.currentBitrate) els.currentBitrate.textContent = "stream: —";
          if (els.currentSource) els.currentSource.textContent = "source: shared";
          updateFullscreenEntryAvailability();
          updateMediaSession(null);
          notifyParentPlayerState();
          return;
        }
        els.currentCover.src = track.coverUrl || FALLBACK_COVER;
        els.currentTitle.textContent = track.title || "Без названия";
        els.currentArtists.textContent = track.artists && track.artists.length ? track.artists.join(", ") : "Неизвестный артист";
        if (els.fullscreenCover) els.fullscreenCover.src = track.coverUrl || FALLBACK_COVER;
        if (els.fullscreenTitle) els.fullscreenTitle.textContent = track.title || "Без названия";
        if (els.fullscreenArtists) {
          els.fullscreenArtists.textContent = track.artists && track.artists.length ? track.artists.join(", ") : "Неизвестный артист";
        }
        if (els.currentDuration) els.currentDuration.textContent = formatTime((track.durationMs || 0) / 1000);
        if (els.currentBitrate) els.currentBitrate.textContent = track.bitrate ? `stream: ${track.bitrate}` : "stream: auto";
        if (els.currentSource) els.currentSource.textContent = `source: ${state.activeSource}`;
        updateFullscreenEntryAvailability();
        updateMediaSession(track);
        notifyParentPlayerState();
      }

      function updateProgressUI() {
        const current = els.audio.currentTime || 0;
        const total = els.audio.duration || ((state.currentTrack && state.currentTrack.durationMs) ? state.currentTrack.durationMs / 1000 : 0);
        const progress = total > 0 ? Math.min(100, (current / total) * 100) : 0;
        els.progressFill.style.width = `${progress}%`;
        els.timeCurrent.textContent = formatTime(current);
        els.timeTotal.textContent = formatTime(total);
        if (els.fsProgressFill) els.fsProgressFill.style.width = `${progress}%`;
        if (els.fsTimeCurrent) els.fsTimeCurrent.textContent = formatTime(current);
        if (els.fsTimeTotal) els.fsTimeTotal.textContent = formatTime(total);
        updateMediaSessionPositionState();
        notifyParentPlayerState();
      }

      function getSeekTargetByClientX(clientX, progressElement = els.progressBar) {
        if (!progressElement) return null;
        const rect = progressElement.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        const duration = els.audio.duration;
        if (!Number.isFinite(duration) || duration <= 0) return null;
        return {
          ratio,
          duration,
          targetTime: duration * ratio
        };
      }

      function renderSeekPreview(targetTime, duration) {
        const safeDuration = Number.isFinite(duration) && duration > 0 ? duration : 0;
        const safeTime = Math.max(0, Math.min(safeDuration || 0, Number(targetTime) || 0));
        const progress = safeDuration > 0 ? Math.min(100, (safeTime / safeDuration) * 100) : 0;
        els.progressFill.style.width = `${progress}%`;
        els.timeCurrent.textContent = formatTime(safeTime);
        els.timeTotal.textContent = formatTime(safeDuration);
        if (els.fsProgressFill) els.fsProgressFill.style.width = `${progress}%`;
        if (els.fsTimeCurrent) els.fsTimeCurrent.textContent = formatTime(safeTime);
        if (els.fsTimeTotal) els.fsTimeTotal.textContent = formatTime(safeDuration);
      }

      function seekByClientX(clientX, progressElement = els.progressBar) {
        const target = getSeekTargetByClientX(clientX, progressElement);
        if (!target) return;
        els.audio.currentTime = target.targetTime;
        updateProgressUI();
      }

      function updateMediaSessionPositionState() {
        try {
          if (!("mediaSession" in navigator) || typeof navigator.mediaSession.setPositionState !== "function") return;
          const duration = Number(els.audio.duration);
          if (!Number.isFinite(duration) || duration <= 0) return;
          navigator.mediaSession.setPositionState({
            duration,
            position: Math.max(0, Math.min(duration, Number(els.audio.currentTime) || 0)),
            playbackRate: Number(els.audio.playbackRate) || 1
          });
        } catch (_) {}
      }

      function updateMediaSession(track) {
        if (!("mediaSession" in navigator)) return;
        try {
          if (!track) {
            navigator.mediaSession.metadata = null;
            navigator.mediaSession.playbackState = "none";
            return;
          }

          const artworkSrc = String(track.coverUrl || FALLBACK_COVER);
          navigator.mediaSession.metadata = new MediaMetadata({
            title: String(track.title || "Без названия"),
            artist: String((track.artists && track.artists.length ? track.artists.join(", ") : "Неизвестный артист")),
            album: "Киносреда",
            artwork: [96, 128, 192, 256, 384, 512].map((size) => ({
              src: artworkSrc,
              sizes: `${size}x${size}`
            }))
          });
          navigator.mediaSession.playbackState = els.audio.paused ? "paused" : "playing";
          updateMediaSessionPositionState();
        } catch (_) {}
      }

      function buildParentPlayerStatePayload() {
        const track = state.currentTrack;
        const duration = Number(els.audio.duration);
        const fallbackDuration = track && track.durationMs ? Number(track.durationMs) / 1000 : 0;
        return {
          hasTrack: Boolean(track && track.trackId),
          trackId: String(track && track.trackId || ""),
          title: String(track && track.title || ""),
          artists: Array.isArray(track && track.artists) ? track.artists : [],
          coverUrl: String(track && track.coverUrl || FALLBACK_COVER),
          isPlaying: Boolean(track && !els.audio.paused),
          currentTime: Number(els.audio.currentTime || 0),
          duration: Number.isFinite(duration) && duration > 0 ? duration : fallbackDuration,
          fullscreenOpen: Boolean(state.fullscreenOpen)
        };
      }

      function notifyParentPlayerState() {
        if (!window.parent || window.parent === window) return;
        try {
          window.parent.postMessage({
            type: "music:state",
            payload: buildParentPlayerStatePayload()
          }, "*");
        } catch (_) {}
      }

      function requestStateToParent() {
        notifyParentPlayerState();
      }

      function configureMediaSessionActions() {
        if (!("mediaSession" in navigator)) return;
        const mediaSession = navigator.mediaSession;
        const safeSet = (action, handler) => {
          try {
            mediaSession.setActionHandler(action, handler);
          } catch (_) {}
        };

        safeSet("play", async () => {
          try {
            await els.audio.play();
          } catch (_) {}
        });
        safeSet("pause", () => {
          els.audio.pause();
        });
        safeSet("previoustrack", () => {
          playPrev();
        });
        safeSet("nexttrack", () => {
          playNext();
        });
        safeSet("seekbackward", (details) => {
          const offset = Number(details && details.seekOffset) || 10;
          const duration = Number(els.audio.duration);
          if (!Number.isFinite(duration) || duration <= 0) return;
          els.audio.currentTime = Math.max(0, (Number(els.audio.currentTime) || 0) - offset);
          updateProgressUI();
        });
        safeSet("seekforward", (details) => {
          const offset = Number(details && details.seekOffset) || 10;
          const duration = Number(els.audio.duration);
          if (!Number.isFinite(duration) || duration <= 0) return;
          els.audio.currentTime = Math.min(duration, (Number(els.audio.currentTime) || 0) + offset);
          updateProgressUI();
        });
        safeSet("seekto", (details) => {
          const duration = Number(els.audio.duration);
          if (!Number.isFinite(duration) || duration <= 0) return;
          const seekTime = Number(details && details.seekTime);
          if (!Number.isFinite(seekTime)) return;
          els.audio.currentTime = Math.max(0, Math.min(duration, seekTime));
          updateProgressUI();
        });
      }

      function getVisibleTracks() {
        const me = state.currentUser ? firebaseSafeKey(state.currentUser.username) : "";
        let list = [...state.sharedTracks];

        if (state.filter === "mine" && me) {
          list = list.filter((item) => firebaseSafeKey(item.addedByUsername) === me);
        } else if (state.filter === "liked" && me) {
          list = list.filter((item) => item.likes && item.likes[me]);
        }

        if (state.sort === "likes") {
          list.sort((a, b) => {
            const diff = getLikeCount(b) - getLikeCount(a);
            if (diff !== 0) return diff;
            return (b.addedAt || 0) - (a.addedAt || 0);
          });
        } else if (state.sort === "title") {
          list.sort((a, b) => String(a.title || "").localeCompare(String(b.title || ""), "ru"));
        } else {
          list.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
        }

        const query = String(state.listQuery || "").trim().toLowerCase();
        if (query) {
          list = list.filter((item) => {
            const haystack = [
              item.title,
              Array.isArray(item.artists) ? item.artists.join(" ") : "",
              item.addedByName,
              item.addedByUsername
            ].join(" ").toLowerCase();
            return haystack.includes(query);
          });
        }

        return list;
      }

      function updateStats() {
        // Stats panel removed from UI.
      }

      function shouldEnrichStoredTrack(existing, incoming) {
        const existingArtists = Array.isArray(existing && existing.artists) ? existing.artists.filter(Boolean) : [];
        const incomingArtists = Array.isArray(incoming && incoming.artists) ? incoming.artists.filter(Boolean) : [];
        if (!existingArtists.length && incomingArtists.length) return true;

        const existingTitle = String(existing && existing.title || "").trim();
        const incomingTitle = String(incoming && incoming.title || "").trim();
        if ((!existingTitle || /^Трек\s+\d+/i.test(existingTitle)) && incomingTitle) return true;

        const existingCover = String(existing && existing.coverUrl || "").trim();
        const incomingCover = String(incoming && incoming.coverUrl || "").trim();
        if ((!existingCover || existingCover === FALLBACK_COVER) && incomingCover && incomingCover !== FALLBACK_COVER) return true;

        return false;
      }

      function buildApiUrl(base, path, params = {}) {
        const url = new URL(`${base}${path}`);
        Object.entries(params).forEach(([k, v]) => {
          if (v == null || v === "") return;
          url.searchParams.set(k, String(v));
        });
        return url;
      }

      function normalizePlayableUrl(rawUrl) {
        const value = String(rawUrl || "").trim();
        if (!value) return "";
        try {
          const parsed = new URL(value);
          if (window.location.protocol === "https:" && parsed.protocol === "http:" && parsed.hostname === window.location.hostname) {
            parsed.protocol = "https:";
            return parsed.toString();
          }
          return parsed.toString();
        } catch (_) {
          return value;
        }
      }

      async function parseYandexPayload(response) {
        const payloadText = await response.text();
        const payload = safeJson(payloadText, null);

        if (!response.ok) {
          const apiErr = payload && (payload.error_description || payload.error || payload.message);
          throw new Error(apiErr || `HTTP ${response.status}`);
        }
        if (!payload || typeof payload !== "object") {
          throw new Error("Некорректный ответ API");
        }
        if (payload.error && !payload.result) {
          throw new Error(String(payload.error_description || payload.error || "Ошибка API"));
        }
        return payload;
      }

      function createTrackItem(track, context) {
        const isCurrent = state.currentTrack && state.currentTrack.trackId === track.trackId && state.activeSource === context;
        const isPlaying = Boolean(isCurrent && !els.audio.paused);
        const canDelete = state.currentUser && (
          firebaseSafeKey(track.addedByUsername) === firebaseSafeKey(state.currentUser.username)
          || firebaseSafeKey(state.currentUser.username) === "max"
        );

        const li = document.createElement("li");
        li.className = `track-item ${isCurrent ? "playing" : ""}`;
        li.dataset.trackKey = track.key || "";

        const likeCount = getLikeCount(track);
        const likedByMe = isLikedByMe(track);
        const playIcon = isPlaying
          ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"></path>'
          : '<path d="M8 5v14l11-7z"></path>';

        li.innerHTML = `
          <div class="track-cover-wrap">
            <img class="track-cover" src="${track.coverUrl || FALLBACK_COVER}" alt="cover">
            <button class="cover-play-btn" data-action="play" title="${isPlaying ? "Пауза" : "Воспроизвести"}">
              <svg viewBox="0 0 24 24">${playIcon}</svg>
            </button>
          </div>
          <div class="track-info">
            <h3>${escapeHtml(track.title)}</h3>
            <p>${escapeHtml(track.artists && track.artists.length ? track.artists.join(", ") : "Без артиста")}</p>
            <div class="track-meta-line">
              ${context === "shared"
                ? `Добавил: ${escapeHtml(track.addedByName || track.addedByUsername || "user")} • ❤ ${likeCount}`
                : `${formatTime((track.durationMs || 0) / 1000)} • id: ${escapeHtml(track.trackId || "—")}`}
            </div>
          </div>
          <div class="track-actions">
            ${context === "shared" ? `
              <button class="icon-btn ${likedByMe ? "active" : ""}" data-action="like" title="Лайк">
                <svg viewBox="0 0 24 24"><path d="M12.1 21.35l-1.1-1.02C5.14 15.24 2 12.39 2 8.88 2 6.03 4.24 4 7.05 4c1.63 0 3.19.79 4.15 2.01C12.16 4.79 13.72 4 15.35 4 18.16 4 20.4 6.03 20.4 8.88c0 3.51-3.14 6.36-8.99 11.46z"></path></svg>
              </button>
            ` : `
              <button class="icon-btn" data-action="add" title="Добавить в общий список">
                <svg viewBox="0 0 24 24"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"></path></svg>
              </button>
            `}
            <a class="icon-btn" href="${track.sourceUrl}" target="_blank" rel="noopener" title="Открыть в Яндекс Музыке">
              <svg viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"></path></svg>
            </a>
            ${context === "shared" && canDelete ? `
              <button class="icon-btn icon-btn--danger" data-action="remove" title="Удалить">
                <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2h4v2H4V6h4l1-2z"></path></svg>
              </button>
            ` : ""}
          </div>
        `;

        li.addEventListener("click", async (event) => {
          const actionEl = event.target.closest("[data-action]");
          if (!actionEl) return;
          const action = actionEl.getAttribute("data-action");
          if (action === "play") {
            const source = context === "shared" ? "shared" : "search";
            const isSameTrack = state.currentTrack && state.currentTrack.trackId === track.trackId && state.activeSource === source;
            if (isSameTrack) {
              try {
                if (els.audio.paused) {
                  await els.audio.play();
                  setPlayButtonState(true);
                } else {
                  els.audio.pause();
                  setPlayButtonState(false);
                }
                renderSharedList();
              } catch (_) {}
              return;
            }
            await playTrack(track, source);
            return;
          }
          if (action === "add") {
            await addToShared(track);
            return;
          }
          if (action === "like") {
            await toggleLike(track);
            return;
          }
          if (action === "remove") {
            await removeTrack(track);
          }
        });

        return li;
      }

      function renderSharedList() {
        const list = getVisibleTracks();
        state.renderedTracks = list;
        if (!els.sharedList) {
          updateStats();
          return;
        }
        els.sharedList.innerHTML = "";
        if (!list.length) {
          const hasQuery = Boolean(String(state.listQuery || "").trim());
          els.sharedList.innerHTML = hasQuery
            ? '<li class="empty">По вашему поиску в списке ничего не найдено.</li>'
            : '<li class="empty">Список пока пуст. Добавьте первый трек через кнопку «+».</li>';
          updateStats();
          return;
        }
        list.forEach((track) => {
          els.sharedList.appendChild(createTrackItem(track, "shared"));
        });
        updateStats();
      }

      function renderSearchList() {
        // Search results block removed from UI.
      }

      async function yandexRequest(path, params = {}) {
        const url = buildApiUrl(YANDEX_PROXY_BASE, path, params);
        const headers = { Accept: "application/json" };
        if (state.token) headers.Authorization = `OAuth ${state.token}`;
        const response = await fetch(url.toString(), { headers });
        return await parseYandexPayload(response);
      }

      async function resolveDownloadInfoUrl(downloadInfoUrl) {
        const raw = String(downloadInfoUrl || "").trim();
        if (!raw) {
          return { ok: false, result: { directLink: "" } };
        }
        const url = new URL(YANDEX_RESOLVE_ENDPOINT);
        url.searchParams.set("url", raw);
        const response = await fetch(url.toString(), {
          headers: { Accept: "application/json" }
        });
        return await parseYandexPayload(response);
      }

      async function resolveTrackLinkViaServer(track) {
        if (!track || !track.trackId) return { candidates: [], bitrate: "" };
        const url = new URL(YANDEX_TRACK_LINK_ENDPOINT);
        url.searchParams.set("track_id", String(track.trackId));
        if (track.albumId) url.searchParams.set("album_id", String(track.albumId));
        const headers = { Accept: "application/json" };
        if (state.token) headers.Authorization = `OAuth ${state.token}`;
        const response = await fetch(url.toString(), { headers });
        const payload = await parseYandexPayload(response);

        const direct = String((payload && payload.result && payload.result.directLink) || "").trim();
        const resolvedRaw = String((payload && payload.result && payload.result.resolvedRawDirectLink) || "").trim();
        const raw = String((payload && payload.result && payload.result.rawDirectLink) || "").trim();
        const candidates = [direct, resolvedRaw, raw]
          .map((value) => normalizePlayableUrl(value))
          .filter(Boolean);
        return {
          candidates: [...new Set(candidates)],
          bitrate: "best"
        };
      }

      async function getTrackAccessMeta(track) {
        if (!track || !track.trackId) return null;
        try {
          const payload = await yandexRequest(`/tracks/${track.trackId}`);
          const rows = Array.isArray(payload && payload.result) ? payload.result : [];
          const row = rows[0] && typeof rows[0] === "object" ? rows[0] : null;
          if (!row) return null;
          return {
            available: row.available,
            availableForPremiumUsers: row.availableForPremiumUsers ?? row.available_for_premium_users,
            availableForOptions: row.availableForOptions ?? row.available_for_options
          };
        } catch (_) {
          return null;
        }
      }

      function applyListSearch() {
        state.listQuery = String((els.searchInput && els.searchInput.value) || "").trim();
        renderSharedList();
      }

      function parseTrackUrl(url) {
        const value = String(url || "").trim();
        if (!value) return null;
        const patterns = [
          /music\.yandex\.[^/]+\/album\/(\d+)\/track\/(\d+)/i,
          /music\.yandex\.[^/]+\/track\/(\d+)/i
        ];
        const full = value.match(patterns[0]);
        if (full) {
          return {
            albumId: full[1],
            trackId: full[2],
            sourceUrl: `https://music.yandex.ru/album/${full[1]}/track/${full[2]}`
          };
        }
        const short = value.match(patterns[1]);
        if (short) {
          return {
            albumId: "",
            trackId: short[1],
            sourceUrl: `https://music.yandex.ru/track/${short[1]}`
          };
        }
        return null;
      }

      async function loadTrackByParsed(parsed, options = {}) {
        const shouldClearInput = Boolean(options.clearInput);
        if (!parsed || !parsed.trackId) {
          toast("Невалидная ссылка. Пример: music.yandex.ru/album/.../track/...", "err");
          return;
        }
        if (els.addByUrlBtn) {
          els.addByUrlBtn.disabled = true;
          els.addByUrlBtn.textContent = "Загружаю...";
        }
        try {
          let arr = [];
          const asArray = (value) => Array.isArray(value) ? value : (value ? [value] : []);
          if (parsed.albumId) {
            const withAlbum = await yandexRequest(`/tracks/${parsed.trackId}:${parsed.albumId}`);
            arr = asArray(withAlbum.result);
          }
          if (!arr.length) {
            const data = await yandexRequest(`/tracks/${parsed.trackId}`);
            arr = asArray(data.result);
          }
          if (!arr.length) {
            throw new Error("Трек не найден в API");
          }
          let track = toTrackModel({ ...arr[0], ...parsed }, "search");
          if (!track.artists.length) {
            try {
              const searchData = await yandexRequest("/search", {
                text: parsed.trackId,
                type: "track",
                page: 0,
                nocorrect: true
              });
              const searchResults = ((((searchData || {}).result || {}).tracks || {}).results || []);
              const sameTrack = searchResults.find((item) => extractTrackId(item && item.id) === String(parsed.trackId));
              if (sameTrack) {
                track = toTrackModel({ ...sameTrack, ...parsed }, "search");
              }
            } catch (_) {}
          }
          await addToShared(track);
          if (shouldClearInput && els.trackUrlInput) els.trackUrlInput.value = "";
          setActiveToolPanel("");
        } catch (error) {
          toast(`Ошибка по ссылке: ${error.message}`, "err");
        } finally {
          if (els.addByUrlBtn) {
            els.addByUrlBtn.disabled = false;
            els.addByUrlBtn.textContent = "Добавить по ссылке";
          }
        }
      }

      async function loadTrackByUrl() {
        if (!els.trackUrlInput) return;
        const raw = String(els.trackUrlInput.value || "").trim();
        if (!raw) {
          toast("Вставь ссылку на трек Яндекс Музыки", "err");
          return;
        }
        const parsed = parseTrackUrl(raw);
        await loadTrackByParsed(parsed, { clearInput: true });
      }

      async function resolveStream(track) {
        if (!track || !track.trackId) return { url: "", bitrate: "" };
        if (track.streamUrl) {
          track._streamCandidates = [{ url: normalizePlayableUrl(track.streamUrl), bitrate: track.bitrate || "cached" }];
          return { url: normalizePlayableUrl(track.streamUrl), bitrate: track.bitrate || "cached" };
        }

        try {
          const primary = await resolveTrackLinkViaServer(track);
          if (Array.isArray(primary.candidates) && primary.candidates.length) {
            track._streamCandidates = primary.candidates.map((url) => ({ url, bitrate: primary.bitrate || "best" }));
            return {
              url: track._streamCandidates[0].url,
              bitrate: track._streamCandidates[0].bitrate || "best"
            };
          }
        } catch (_) {}

        const resolveId = `${track.trackId}:${Date.now()}`;
        state.pendingResolveId = resolveId;
        let data = null;
        if (track.albumId) {
          try {
            data = await yandexRequest(`/tracks/${track.trackId}:${track.albumId}/download-info`, {
              "get-direct-links": true,
              hq: 1
            });
          } catch (_) {}
        }
        if (!data) {
          data = await yandexRequest(`/tracks/${track.trackId}/download-info`, {
            "get-direct-links": true,
            hq: 1
          });
        }
        if (!Array.isArray(data && data.result) || !data.result.length) {
          data = await yandexRequest(`/tracks/${track.trackId}/download-info`, {
            "get-direct-links": true
          });
        }

        if (state.pendingResolveId !== resolveId) {
          return { url: "", bitrate: "" };
        }

        const infos = Array.isArray(data.result) ? data.result : [];
        if (!infos.length) {
          throw new Error("API не вернул stream URL для этого трека");
        }

        const normalized = infos
          .map((item) => {
            const directUrl = String(item.directLink || item.direct_link || item.url || "").trim();
            const urls = [];
            if (directUrl) urls.push(normalizePlayableUrl(directUrl));
            return {
              urls,
              downloadInfoUrl: String(item.downloadInfoUrl || item.download_info_url || "").trim(),
              bitrate: Number(item.bitrateInKbps || item.bitrate || 0),
              codec: String(item.codec || "").toLowerCase(),
              preview: Boolean(item.preview)
            };
          })
          .filter((item) => item.urls.length || item.downloadInfoUrl);

        if (!normalized.length) {
          throw new Error("Прямой stream недоступен");
        }

        for (const item of normalized) {
          if (item.urls.length) continue;
          if (!item.downloadInfoUrl) continue;
          try {
            const resolved = await resolveDownloadInfoUrl(item.downloadInfoUrl);
            const resolvedUrl = String((resolved && resolved.result && resolved.result.directLink) || "").trim();
            const rawResolvedUrl = String((resolved && resolved.result && resolved.result.rawDirectLink) || "").trim();
            const deeplyResolvedRawUrl = String((resolved && resolved.result && resolved.result.resolvedRawDirectLink) || "").trim();
            const candidates = [resolvedUrl, deeplyResolvedRawUrl, rawResolvedUrl]
              .map((urlValue) => normalizePlayableUrl(urlValue))
              .filter(Boolean);
            if (candidates.length) item.urls = [...new Set(candidates)];
          } catch (_) {}
        }

        const resolvedCandidates = normalized
          .filter((item) => item.urls.length)
          .flatMap((item) => item.urls.map((url) => ({
            url,
            bitrate: item.bitrate,
            codec: item.codec,
            preview: item.preview
          })));
        if (!resolvedCandidates.length) {
          throw new Error("Не удалось резолвнуть stream URL");
        }

        const fullCandidates = resolvedCandidates.filter((item) => !item.preview);
        if (!fullCandidates.length) {
          const meta = await getTrackAccessMeta(track);
          if (meta && meta.availableForPremiumUsers === true) {
            throw new Error("API вернул только preview: трек доступен только для premium-аккаунта токена.");
          }
          throw new Error("API вернул только preview-версии для этого токена/трека.");
        }

        fullCandidates.sort((a, b) => {
          const bitrateDiff = (b.bitrate || 0) - (a.bitrate || 0);
          if (bitrateDiff !== 0) return bitrateDiff;
          const codecRank = (codec) => (codec.includes("mp3") ? 3 : codec.includes("aac") ? 2 : 1);
          return codecRank(b.codec) - codecRank(a.codec);
        });

        const preparedCandidates = [];
        const seen = new Set();
        fullCandidates.forEach((candidate) => {
          const normalizedUrl = normalizePlayableUrl(candidate.url);
          if (!normalizedUrl || seen.has(normalizedUrl)) return;
          seen.add(normalizedUrl);
          preparedCandidates.push({
            url: normalizedUrl,
            bitrate: candidate.bitrate ? `${candidate.bitrate}kbps ${candidate.codec || ""}`.trim() : `${candidate.codec || "auto"}`.trim()
          });
        });
        track._streamCandidates = preparedCandidates;

        const best = preparedCandidates[0] || { url: "", bitrate: "" };
        return {
          url: best.url,
          bitrate: best.bitrate || ""
        };
      }

      async function playTrack(track, source = "shared") {
        if (!track || !track.trackId) return;
        state.activeSource = source;
        state.currentTrack = track;
        state.repeatOnceConsumed = false;
        state.currentStreamMeta = null;
        updateCurrentTrackUI(track);
        renderSharedList();
        renderSearchList();

        if (source === "shared") {
          state.currentIndex = state.renderedTracks.findIndex((t) => t.key && t.key === track.key);
        } else {
          state.currentIndex = -1;
        }

        setPlayButtonState(false);
        try {
          const stream = await resolveStream(track);
          const candidates = Array.isArray(track._streamCandidates) && track._streamCandidates.length
            ? track._streamCandidates
            : (stream.url ? [stream] : []);
          if (!candidates.length) throw new Error("Stream URL не найден");

          let started = false;
          let lastError = null;
          let lastCandidateHost = "";
          for (const candidate of candidates) {
            try {
              try {
                lastCandidateHost = new URL(candidate.url).host || "";
              } catch (_) {
                lastCandidateHost = "";
              }

              els.audio.src = candidate.url;
              els.audio.playbackRate = 1;
              await els.audio.play();
              track.streamUrl = candidate.url;
              track.bitrate = candidate.bitrate || "";
              state.currentStreamMeta = { url: candidate.url, bitrate: candidate.bitrate || "" };
              started = true;
              break;
            } catch (error) {
              const mediaErrorCode = els.audio && els.audio.error ? els.audio.error.code : 0;
              if (mediaErrorCode) {
                lastError = new Error(`MediaError code ${mediaErrorCode}${lastCandidateHost ? ` (${lastCandidateHost})` : ""}`);
              } else {
                lastError = error;
              }
            }
          }
          if (!started) {
            throw lastError || new Error("Нет поддерживаемого источника аудио");
          }

          setPlayButtonState(true);
          if (els.currentBitrate) els.currentBitrate.textContent = `stream: ${track.bitrate || "auto"}`;
          renderSharedList();
          renderSearchList();
        } catch (error) {
          track.streamUrl = "";
          track.bitrate = "";
          setPlayButtonState(false);
          renderSharedList();
          renderSearchList();
        }
      }

      async function playNext() {
        const list = state.renderedTracks;
        if (!list.length) return;
        if (state.shuffle) {
          const randomTrack = list[Math.floor(Math.random() * list.length)];
          await playTrack(randomTrack, "shared");
          return;
        }

        const currentIndex = getCurrentTrackIndex(list);
        const baseIndex = currentIndex >= 0 ? currentIndex : state.currentIndex;
        let nextIndex = baseIndex + 1;
        if (nextIndex >= list.length) return;
        const target = list[nextIndex];
        if (target) {
          state.currentIndex = nextIndex;
          await playTrack(target, "shared");
        }
      }

      async function playPrev() {
        const list = state.renderedTracks;
        if (!list.length) return;
        const currentIndex = getCurrentTrackIndex(list);
        const baseIndex = currentIndex >= 0 ? currentIndex : state.currentIndex;
        let prevIndex = baseIndex - 1;
        if (prevIndex < 0) prevIndex = list.length - 1;
        const target = list[prevIndex];
        if (target) {
          state.currentIndex = prevIndex;
          await playTrack(target, "shared");
        }
      }

      async function addToShared(track) {
        if (!state.db) {
          toast("Firebase недоступен, общий список отключен", "err");
          return;
        }
        if (!track || !track.trackId) {
          toast("Невалидный трек", "err");
          return;
        }

        const user = state.currentUser || { username: "guest", name: "Guest" };
        const snapshot = await state.db
          .ref(COMMUNITY_TRACKS_PATH)
          .orderByChild("trackId")
          .equalTo(track.trackId)
          .once("value");

        if (snapshot.exists()) {
          let enriched = false;
          const updates = {};
          snapshot.forEach((child) => {
            const existing = child.val() || {};
            if (!shouldEnrichStoredTrack(existing, track)) return;
            updates[`${child.key}/title`] = track.title || existing.title || "";
            updates[`${child.key}/artists`] = (track.artists && track.artists.length) ? track.artists : (existing.artists || []);
            updates[`${child.key}/durationMs`] = Number(track.durationMs || existing.durationMs || 0);
            updates[`${child.key}/coverUrl`] = track.coverUrl || existing.coverUrl || FALLBACK_COVER;
            updates[`${child.key}/sourceUrl`] = track.sourceUrl || existing.sourceUrl || "";
            enriched = true;
          });
          if (enriched) {
            await state.db.ref(COMMUNITY_TRACKS_PATH).update(updates);
            toast("Трек уже был в списке: метаданные обновлены");
          } else {
            toast("Этот трек уже есть в общем списке");
          }
          return;
        }

        const payload = {
          trackId: track.trackId,
          albumId: track.albumId || "",
          title: track.title || "",
          artists: track.artists || [],
          durationMs: Number(track.durationMs || 0),
          coverUrl: track.coverUrl || FALLBACK_COVER,
          sourceUrl: track.sourceUrl || "",
          addedByName: user.name,
          addedByUsername: user.username,
          addedAt: firebase.database.ServerValue.TIMESTAMP,
          likes: {}
        };

        await state.db.ref(COMMUNITY_TRACKS_PATH).push(payload);
        toast("Трек добавлен в общий список");
      }

      async function toggleLike(track) {
        if (!state.db || !track || !track.key) return;
        if (!state.currentUser) {
          toast("Требуется авторизация", "err");
          return;
        }
        const me = firebaseSafeKey(state.currentUser.username);
        const ref = state.db.ref(`${COMMUNITY_TRACKS_PATH}/${track.key}/likes/${me}`);
        if (isLikedByMe(track)) {
          await ref.remove();
        } else {
          await ref.set(true);
        }
      }

      async function removeTrack(track) {
        if (!state.db || !track || !track.key) return;
        const canDelete = state.currentUser && (
          firebaseSafeKey(track.addedByUsername) === firebaseSafeKey(state.currentUser.username)
          || firebaseSafeKey(state.currentUser.username) === "max"
        );
        if (!canDelete) {
          toast("Удалять может только автор трека или admin", "err");
          return;
        }
        await state.db.ref(`${COMMUNITY_TRACKS_PATH}/${track.key}`).remove();
        toast("Трек удалён");
      }

      function syncSharedTracks(snapshot) {
        const items = [];
        snapshot.forEach((child) => {
          const raw = child.val() || {};
          const normalized = toTrackModel({ ...raw, key: child.key }, "shared");
          if (!normalized.trackId) return;
          items.push(normalized);
        });
        state.sharedTracks = items;
        renderSharedList();
      }

      function bindSharedTracks() {
        if (!state.db) return;
        state.db.ref(COMMUNITY_TRACKS_PATH).off();
        state.db.ref(COMMUNITY_TRACKS_PATH).on("value", syncSharedTracks, () => {
          toast("Ошибка подписки на общий список", "err");
        });
      }

      function persistPlayerSettings() {
        const payload = {
          repeatMode: state.repeatMode,
          shuffle: state.shuffle,
          filter: state.filter,
          sort: state.sort
        };
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(payload));
      }

      function restoreSettings() {
        const saved = safeJson(localStorage.getItem(SETTINGS_KEY), {});
        if (!saved || typeof saved !== "object") return;
        if (saved.repeatMode === "once" || saved.repeatMode === "loop" || saved.repeatMode === "off") {
          setRepeatMode(saved.repeatMode);
        } else if (saved.repeatMode === "one") {
          setRepeatMode("once");
        } else if (saved.repeatMode === "all") {
          setRepeatMode("loop");
        }
        if (typeof saved.shuffle === "boolean") {
          setShuffleMode(saved.shuffle);
        }
        if (saved.filter) {
          state.filter = String(saved.filter);
          if (els.filterSelect) els.filterSelect.value = state.filter;
        }
        if (saved.sort) {
          state.sort = String(saved.sort);
          if (els.sortSelect) els.sortSelect.value = state.sort;
        }
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function bindEvents() {
        const handleMainCoverToggle = () => {
          if (!isDesktopViewport()) return;
          toggleFullscreenOpen();
        };

        if (els.currentCoverWrap) {
          els.currentCoverWrap.addEventListener("click", handleMainCoverToggle);
          els.currentCoverWrap.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " " && event.key !== "Spacebar") return;
            event.preventDefault();
            handleMainCoverToggle();
          });
        }
        if (els.fullscreenCoverBtn) {
          els.fullscreenCoverBtn.addEventListener("click", () => {
            setFullscreenOpen(false);
          });
        }
        if (els.fullscreenPlayer) {
          els.fullscreenPlayer.addEventListener("click", (event) => {
            if (event.target !== els.fullscreenPlayer) return;
            setFullscreenOpen(false);
          });
        }
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && state.fullscreenOpen) {
            setFullscreenOpen(false);
          }
          if (event.key === "Escape" && state.addHelpOpen) {
            setAddHelpOpen(false);
          }
        });
        window.addEventListener("resize", () => {
          markFullscreenResizing();
          if (!isDesktopViewport() && state.fullscreenOpen) {
            setFullscreenOpen(false);
          }
          updateFullscreenEntryAvailability();
        });

        if (els.toggleSearchPanelBtn) {
          els.toggleSearchPanelBtn.addEventListener("click", () => {
            setAddHelpOpen(false);
            setActiveToolPanel("search");
          });
        }
        if (els.toggleAddPanelBtn) {
          els.toggleAddPanelBtn.addEventListener("click", () => {
            setAddHelpOpen(false);
            setActiveToolPanel("add");
          });
        }
        if (els.toggleAddHelpBtn) {
          els.toggleAddHelpBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            setAddHelpOpen(!state.addHelpOpen);
          });
        }
        if (els.addHelpPopover) {
          els.addHelpPopover.addEventListener("click", (event) => {
            event.stopPropagation();
          });
        }
        document.addEventListener("click", (event) => {
          if (!state.addHelpOpen) return;
          if (event.target && event.target.closest && event.target.closest(".add-help-wrap")) return;
          setAddHelpOpen(false);
        });
        if (els.searchInput) {
          els.searchInput.addEventListener("input", applyListSearch);
          els.searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
              els.searchInput.value = "";
              applyListSearch();
              setActiveToolPanel("");
            }
          });
        }
        if (els.addByUrlBtn) els.addByUrlBtn.addEventListener("click", loadTrackByUrl);
        if (els.trackUrlInput) {
          els.trackUrlInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") loadTrackByUrl();
            if (e.key === "Escape") setActiveToolPanel("");
          });
        }

        els.playBtn.addEventListener("click", async () => {
          if (!state.currentTrack) {
            const fallback = state.renderedTracks[0];
            if (fallback) await playTrack(fallback, "shared");
            return;
          }
          if (els.audio.paused) {
            try {
              await els.audio.play();
              setPlayButtonState(true);
            } catch (_) {}
          } else {
            els.audio.pause();
            setPlayButtonState(false);
          }
        });

        els.prevBtn.addEventListener("click", playPrev);
        els.nextBtn.addEventListener("click", playNext);

        els.repeatBtn.addEventListener("click", () => {
          const current = state.repeatMode;
          const next = current === "off" ? "once" : current === "once" ? "loop" : "off";
          setRepeatMode(next);
          persistPlayerSettings();
        });
        if (els.fsRepeatBtn) {
          els.fsRepeatBtn.addEventListener("click", () => {
            const current = state.repeatMode;
            const next = current === "off" ? "once" : current === "once" ? "loop" : "off";
            setRepeatMode(next);
            persistPlayerSettings();
          });
        }

        els.shuffleBtn.addEventListener("click", () => {
          setShuffleMode(!state.shuffle);
          persistPlayerSettings();
        });
        if (els.fsShuffleBtn) {
          els.fsShuffleBtn.addEventListener("click", () => {
            setShuffleMode(!state.shuffle);
            persistPlayerSettings();
          });
        }

        els.progressBar.addEventListener("click", (event) => {
          seekByClientX(event.clientX);
        });
        if (els.fsProgressBar) {
          els.fsProgressBar.addEventListener("click", (event) => {
            seekByClientX(event.clientX, els.fsProgressBar);
          });
        }
        if (els.fsPlayBtn) {
          els.fsPlayBtn.addEventListener("click", () => {
            els.playBtn.click();
          });
        }
        if (els.fsPrevBtn) {
          els.fsPrevBtn.addEventListener("click", () => {
            els.prevBtn.click();
          });
        }
        if (els.fsNextBtn) {
          els.fsNextBtn.addEventListener("click", () => {
            els.nextBtn.click();
          });
        }

        const touchSeekState = {
          active: false,
          seeking: false,
          wasPlaying: false,
          previewTime: null,
          previewDuration: 0,
          startX: 0,
          startY: 0
        };

        els.progressBar.addEventListener("touchstart", (event) => {
          if (!event.touches || !event.touches.length) return;
          const touch = event.touches[0];
          touchSeekState.active = true;
          touchSeekState.seeking = false;
          touchSeekState.wasPlaying = false;
          touchSeekState.previewTime = null;
          touchSeekState.previewDuration = 0;
          touchSeekState.startX = touch.clientX;
          touchSeekState.startY = touch.clientY;
        }, { passive: true });

        els.progressBar.addEventListener("touchmove", (event) => {
          if (!touchSeekState.active || !event.touches || !event.touches.length) return;
          const touch = event.touches[0];
          const dx = touch.clientX - touchSeekState.startX;
          const dy = touch.clientY - touchSeekState.startY;

          if (!touchSeekState.seeking) {
            if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
            if (Math.abs(dx) >= Math.abs(dy)) {
              touchSeekState.seeking = true;
              touchSeekState.wasPlaying = !els.audio.paused;
              if (touchSeekState.wasPlaying) {
                els.audio.pause();
              }
            } else {
              touchSeekState.active = false;
              return;
            }
          }

          event.preventDefault();
          const target = getSeekTargetByClientX(touch.clientX);
          if (!target) return;
          touchSeekState.previewTime = target.targetTime;
          touchSeekState.previewDuration = target.duration;
          renderSeekPreview(target.targetTime, target.duration);
        }, { passive: false });

        const finishTouchSeek = async (event, { commit = true } = {}) => {
          if (!touchSeekState.active) return;
          if (touchSeekState.seeking) {
            if (commit) {
              if (Number.isFinite(touchSeekState.previewTime)) {
                const duration = Number(els.audio.duration);
                const targetTime = Math.max(0, Math.min(Number.isFinite(duration) ? duration : 0, touchSeekState.previewTime));
                els.audio.currentTime = targetTime;
                updateProgressUI();
              } else if (event.changedTouches && event.changedTouches.length) {
                seekByClientX(event.changedTouches[0].clientX);
              }

              if (touchSeekState.wasPlaying) {
                try {
                  await els.audio.play();
                } catch (_) {}
              }
            } else {
              updateProgressUI();
              if (touchSeekState.wasPlaying) {
                try {
                  await els.audio.play();
                } catch (_) {}
              }
            }
          }
          touchSeekState.active = false;
          touchSeekState.seeking = false;
          touchSeekState.wasPlaying = false;
          touchSeekState.previewTime = null;
          touchSeekState.previewDuration = 0;
        };

        els.progressBar.addEventListener("touchend", (event) => {
          finishTouchSeek(event, { commit: true });
        }, { passive: true });
        els.progressBar.addEventListener("touchcancel", (event) => {
          finishTouchSeek(event, { commit: false });
        }, { passive: true });

        if (els.filterSelect) {
          els.filterSelect.addEventListener("change", () => {
            state.filter = els.filterSelect.value;
            renderSharedList();
            persistPlayerSettings();
          });
        }
        if (els.sortSelect) {
          els.sortSelect.addEventListener("change", () => {
            state.sort = els.sortSelect.value;
            renderSharedList();
            persistPlayerSettings();
          });
        }

        if (els.oauthLoginBtn) {
          els.oauthLoginBtn.addEventListener("click", async () => {
            try {
              await startYandexOAuthLogin();
            } catch (error) {
              toast(`OAuth error: ${error.message || error}`, "err");
            }
          });
        }

        if (els.oauthLogoutBtn) {
          els.oauthLogoutBtn.addEventListener("click", () => {
            applyToken("", { persist: true, toastMessage: "OAuth отключён" });
          });
        }

        els.audio.addEventListener("loadedmetadata", updateProgressUI);
        els.audio.addEventListener("timeupdate", updateProgressUI);
        els.audio.addEventListener("play", () => {
          setPlayButtonState(true);
          renderSharedList();
          renderSearchList();
          if ("mediaSession" in navigator) {
            try { navigator.mediaSession.playbackState = "playing"; } catch (_) {}
          }
        });
        els.audio.addEventListener("pause", () => {
          setPlayButtonState(false);
          renderSharedList();
          renderSearchList();
          if ("mediaSession" in navigator) {
            try { navigator.mediaSession.playbackState = "paused"; } catch (_) {}
          }
        });
        els.audio.addEventListener("ended", async () => {
          if (state.repeatMode === "loop" && state.currentTrack) {
            try {
              els.audio.currentTime = 0;
              await els.audio.play();
            } catch (_) {
              setPlayButtonState(false);
            }
            return;
          }

          if (state.repeatMode === "once" && state.currentTrack) {
            if (!state.repeatOnceConsumed) {
              state.repeatOnceConsumed = true;
              try {
                els.audio.currentTime = 0;
                await els.audio.play();
              } catch (_) {
                setRepeatMode("off");
                persistPlayerSettings();
                setPlayButtonState(false);
              }
              return;
            }
            setRepeatMode("off");
            persistPlayerSettings();
          }

          await playNext();
        });

        window.addEventListener("message", async (event) => {
          const data = event && event.data ? event.data : null;
          if (!data || typeof data !== "object") return;

          if (data.type === "music:request-state") {
            requestStateToParent();
            return;
          }

          if (data.type !== "music:command") return;
          const command = String(data.command || "").trim();

          if (command === "prev") {
            await playPrev();
            return;
          }
          if (command === "next") {
            await playNext();
            return;
          }
          if (command === "seek-to") {
            const ratio = Number(data.ratio);
            const duration = Number(els.audio.duration);
            if (!Number.isFinite(ratio) || !Number.isFinite(duration) || duration <= 0) return;
            els.audio.currentTime = Math.max(0, Math.min(duration, duration * ratio));
            updateProgressUI();
            return;
          }
          if (command === "play-toggle") {
            if (!state.currentTrack) {
              const fallback = state.renderedTracks[0];
              if (fallback) await playTrack(fallback, "shared");
              return;
            }
            if (els.audio.paused) {
              try {
                await els.audio.play();
                setPlayButtonState(true);
              } catch (_) {}
            } else {
              els.audio.pause();
              setPlayButtonState(false);
            }
            renderSharedList();
            renderSearchList();
            return;
          }
        });
      }

      function initFirebase() {
        try {
          if (!window.firebase || !firebaseConfig.databaseURL) {
            throw new Error("Firebase SDK/config не загружены");
          }
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          state.db = firebase.database();
        } catch (error) {
          state.db = null;
          toast(`Firebase отключен: ${error.message}`, "err");
        }
      }

      function init() {
        state.currentUser = getCurrentUser();
        extractOAuthTokenFromHash();
        hydrateTokenFromStorage();
        loadOAuthConfig();

        initFirebase();
        bindEvents();
        configureMediaSessionActions();
        setRepeatMode("off");
        setShuffleMode(false);
        restoreSettings();

        els.audio.volume = 0.85;
        els.audio.playbackRate = 1;

        updateCurrentTrackUI(null);
        updateProgressUI();
        setFullscreenOpen(false);
        setAddHelpOpen(false);
        setActiveToolPanel("");
        renderSharedList();
        renderSearchList();
        bindSharedTracks();
        requestStateToParent();

        toast("Music Hub готов");
      }

      init();
    })();
  </script>
</body>
</html>
