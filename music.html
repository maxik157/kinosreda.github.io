      function resetYmSearchLazyState() {
        state.ymSearchResults = [];
        state.ymSearchTotal = 0;
        state.ymSearchPage = 0;
        state.ymSearchHasMore = false;
        state.ymSearchRenderCount = 0;
        state.ymSearchRenderedDomCount = 0;
        state.ymSearchLoading = false;
        state.ymSearchLoadingMore = false;
        state.ymSearchRankMode = "auto";
      }

      function normalizeYmSearchText(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/ё/g, "е")
          .replace(/[^\p{L}\p{N}]+/gu, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function scoreYmSearchField(value, normalizedQuery, tokens) {
        if (!normalizedQuery) return 0;
        const normalizedValue = normalizeYmSearchText(value);
        if (!normalizedValue) return 0;

        let score = 0;
        if (normalizedValue === normalizedQuery) {
          score = 100;
        } else if (normalizedValue.startsWith(`${normalizedQuery} `) || normalizedValue.startsWith(normalizedQuery)) {
          score = 88;
        } else if (normalizedValue.includes(` ${normalizedQuery} `) || normalizedValue.includes(normalizedQuery)) {
          score = 74;
        }

        if (tokens.length) {
          let hits = 0;
          for (const token of tokens) {
            if (token && normalizedValue.includes(token)) hits += 1;
          }
          if (hits === tokens.length) {
            score = Math.max(score, 64 + Math.min(20, tokens.length * 4));
          } else if (hits > 0) {
            score = Math.max(score, 34 + Math.min(20, hits * 5));
          }
        }

        return score;
      }

      function rankYmSearchTracks(tracks = [], query = "", preferredMode = "auto") {
        const normalizedQuery = normalizeYmSearchText(query);
        if (!normalizedQuery || !Array.isArray(tracks) || !tracks.length) {
          return { tracks: Array.isArray(tracks) ? tracks.slice() : [], mode: "auto" };
        }

        const tokens = normalizedQuery.split(" ").filter(Boolean);
        const scored = tracks.map((track, index) => {
          const title = String(track && track.title || "");
          const artistsJoined = Array.isArray(track && track.artists) ? track.artists.join(" ") : "";
          const titleScore = scoreYmSearchField(title, normalizedQuery, tokens);
          const artistScore = scoreYmSearchField(artistsJoined, normalizedQuery, tokens);
          return {
            track,
            index,
            titleScore,
            artistScore,
            bestScore: Math.max(titleScore, artistScore)
          };
        });

        let mode = preferredMode === "artist" || preferredMode === "title" ? preferredMode : "auto";
        if (mode === "auto") {
          const strongArtistCount = scored.filter((item) => item.artistScore >= 74).length;
          const strongTitleCount = scored.filter((item) => item.titleScore >= 74).length;
          const maxArtistScore = scored.reduce((acc, item) => Math.max(acc, item.artistScore), 0);
          const maxTitleScore = scored.reduce((acc, item) => Math.max(acc, item.titleScore), 0);
          mode = (
            strongArtistCount > strongTitleCount
            || (strongArtistCount === strongTitleCount && maxArtistScore > maxTitleScore + 6)
          ) ? "artist" : "title";
        }

        scored.sort((a, b) => {
          const aPrimary = mode === "artist" ? a.artistScore : a.titleScore;
          const bPrimary = mode === "artist" ? b.artistScore : b.titleScore;
          if (bPrimary !== aPrimary) return bPrimary - aPrimary;

          const aSecondary = mode === "artist" ? a.titleScore : a.artistScore;
          const bSecondary = mode === "artist" ? b.titleScore : b.artistScore;
          if (bSecondary !== aSecondary) return bSecondary - aSecondary;

          if (b.bestScore !== a.bestScore) return b.bestScore - a.bestScore;
          return a.index - b.index;
        });

        return {
          tracks: scored.map((item) => item.track),
          mode
        };
      }

      async function loadMoreYmSearchTracks() {
        const query = String(state.ymSearchQuery || "").trim();
        if (!query) return;
        if (state.ymSearchLoading || state.ymSearchLoadingMore || !state.ymSearchHasMore) return;
        const requestSeq = state.ymSearchRequestSeq;
        const nextPage = Number(state.ymSearchPage || 0) + 1;
        state.ymSearchLoadingMore = true;
        renderSearchList();
        try {
          const payload = await yandexRequest("/search", {
            text: query,
            type: "track",
            page: nextPage,
            nocorrect: false
          });
          if (requestSeq !== state.ymSearchRequestSeq || query !== String(state.ymSearchQuery || "").trim()) return;

          const mapped = mapYmSearchTracks(getTrackSearchResults(payload));
          const knownIds = new Set(state.ymSearchResults.map((item) => String(item && item.trackId || "")));
          const append = mapped.filter((item) => {
            const id = String(item && item.trackId || "");
            if (!id || knownIds.has(id)) return false;
            knownIds.add(id);
            return true;
          });

          if (append.length) {
            state.ymSearchResults.push(...append);
            const ranked = rankYmSearchTracks(state.ymSearchResults, query, state.ymSearchRankMode || "auto");
            state.ymSearchResults = ranked.tracks;
            state.ymSearchRankMode = ranked.mode;
          }

          const totalRaw = Number((((payload || {}).result || {}).tracks || {}).total || 0);
          if (Number.isFinite(totalRaw) && totalRaw > 0) {
            state.ymSearchTotal = totalRaw;
          } else {
            state.ymSearchTotal = Math.max(state.ymSearchTotal, state.ymSearchResults.length);
          }
          state.ymSearchPage = nextPage;
          state.ymSearchHasMore = state.ymSearchTotal > state.ymSearchResults.length && mapped.length > 0;
          if (append.length) {
            state.ymSearchRenderCount = Math.min(
              state.ymSearchResults.length,
              Math.max(state.ymSearchRenderCount, state.ymSearchRenderCount + state.ymSearchChunkSize)
            );
          }
        } catch (_) {
          state.ymSearchHasMore = false;
        } finally {
          if (requestSeq !== state.ymSearchRequestSeq) return;
          state.ymSearchLoadingMore = false;
          renderSearchList();
        }
      }

      function maybeLoadMoreYmSearchTracks() {
        if (!els.ymSearchList) return;
        const totalCount = Array.isArray(state.ymSearchResults) ? state.ymSearchResults.length : 0;
        if (!totalCount && !state.ymSearchHasMore) return;
        const bottomGap = els.ymSearchList.scrollHeight - (els.ymSearchList.scrollTop + els.ymSearchList.clientHeight);
        if (bottomGap > 160) return;

        if (state.ymSearchRenderCount < totalCount) {
          state.ymSearchRenderCount = Math.min(totalCount, state.ymSearchRenderCount + state.ymSearchChunkSize);
          renderSearchList();
          return;
        }

        if (state.ymSearchHasMore) {
          loadMoreYmSearchTracks();
        }
      }

      function renderSharedList() {
        const list = getVisibleTracks();
        state.renderedTracks = list;
        updateTrackCountBadge(list.length, state.sharedTracks.length);
        if (!els.sharedList) {
          updateStats();
          return;
        }
        const nextFingerprint = getRenderedTrackIdsFingerprint(list);
        const shouldResetWindow = state.listFingerprint !== nextFingerprint;
        if (shouldResetWindow) {
          state.listFingerprint = nextFingerprint;
          state.listRenderCount = Math.min(state.listChunkSize, list.length);
          state.renderedTrackDomCount = 0;
          els.sharedList.innerHTML = "";
          els.sharedList.scrollTop = 0;
        }
        if (!list.length) {
          const hasQuery = Boolean(String(state.listQuery || "").trim());
          els.sharedList.innerHTML = hasQuery
            ? '<li class="empty">По вашему поиску в списке ничего не найдено.</li>'
            : '<li class="empty">Список пока пуст. Добавьте первый трек через кнопку «+».</li>';
          state.renderedTrackDomCount = 0;
          updateStats();
          updateCoverPeekUI();
          return;
        }

        const targetCount = Math.min(state.listRenderCount, list.length);
        if (state.renderedTrackDomCount > targetCount) {
          state.renderedTrackDomCount = 0;
          els.sharedList.innerHTML = "";
        }
        for (let i = state.renderedTrackDomCount; i < targetCount; i += 1) {
          const track = list[i];
          els.sharedList.appendChild(createTrackItem(track, "shared"));
        }
        state.renderedTrackDomCount = targetCount;
        updateSharedListPlaybackUI();
        updateStats();
        updateCoverPeekUI();
      }

      function renderSearchList() {
        if (!els.ymSearchList) return;
        const query = String(state.ymSearchQuery || "").trim();
        const results = Array.isArray(state.ymSearchResults) ? state.ymSearchResults : [];
        const loading = Boolean(state.ymSearchLoading);
        const loadingMore = Boolean(state.ymSearchLoadingMore);
        const isDesktop = window.matchMedia("(min-width: 820px)").matches;
        const togglePrompt = (visible) => {
          if (!els.ymSearchPrompt) return;
          els.ymSearchPrompt.hidden = !visible;
        };

        const resetSearchDom = () => {
          state.ymSearchRenderedDomCount = 0;
          state.ymSearchRenderedVersion = state.ymSearchDataVersion;
          els.ymSearchList.innerHTML = "";
        };

        if (!query && !loading) {
          resetSearchDom();
          togglePrompt(isDesktop);
          if (!isDesktop) {
            els.ymSearchList.innerHTML = '<li class="empty">Введите запрос для поиска треков в Яндекс Музыке.</li>';
          }
          updateSharedListPlaybackUI();
          return;
        }
        togglePrompt(false);
        if (loading) {
          resetSearchDom();
          return;
        }
        if (!results.length) {
          resetSearchDom();
          els.ymSearchList.innerHTML = '<li class="empty">Ничего не найдено. Уточните запрос.</li>';
          return;
        }

        const targetCount = Math.min(
          results.length,
          Math.max(state.ymSearchChunkSize, Number(state.ymSearchRenderCount || state.ymSearchChunkSize))
        );
        state.ymSearchRenderCount = targetCount;

        if (state.ymSearchRenderedVersion !== state.ymSearchDataVersion || state.ymSearchRenderedDomCount > targetCount) {
          resetSearchDom();
        }

        const previousLoader = els.ymSearchList.querySelector(".ym-loading-more");
        if (previousLoader) previousLoader.remove();

        for (let i = state.ymSearchRenderedDomCount; i < targetCount; i += 1) {
          const track = results[i];
          if (!track) continue;
          els.ymSearchList.appendChild(createTrackItem(track, "search"));
        }
        state.ymSearchRenderedDomCount = targetCount;

        if (loadingMore) {
          const loader = document.createElement("li");
          loader.className = "empty ym-loading-more";
          loader.textContent = "Загрузка…";
          els.ymSearchList.appendChild(loader);
        }

        updateSharedListPlaybackUI();

        requestAnimationFrame(() => {
          maybeLoadMoreYmSearchTracks();
        });
      }

      function updateListPlaybackUI(container, source) {
        if (!container) return;
        const currentTrack = state.currentTrack;
        const sourceNormalized = source === "search" ? "search" : "shared";
        const useSource = state.activeSource === sourceNormalized;
        const currentKey = String(currentTrack && currentTrack.key || "");
        const currentTrackId = String(currentTrack && currentTrack.trackId || "");
        const isPlaying = Boolean(useSource && currentTrack && !els.audio.paused);
        const playMarkup = '<path d="M8 5v14l11-7z"></path>';
        const pauseMarkup = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"></path>';

        const items = container.querySelectorAll(".track-item");
        items.forEach((item) => {
          const itemKey = String(item.dataset.trackKey || "");
          const itemTrackId = String(item.dataset.trackId || "");
          const isCurrent = Boolean(
            useSource
            && currentTrack
            && (
              (currentKey && itemKey && currentKey === itemKey)
              || (!currentKey && currentTrackId && itemTrackId === currentTrackId)
            )
          );
          item.classList.toggle("playing", isCurrent);

          const playButton = item.querySelector(".cover-play-btn");
          const icon = playButton ? playButton.querySelector("svg") : null;
          if (!playButton || !icon) return;
          const showPause = Boolean(isCurrent && isPlaying);
          playButton.title = showPause ? "Пауза" : "Воспроизвести";
          icon.innerHTML = showPause ? pauseMarkup : playMarkup;
        });
      }

      function updateSharedListPlaybackUI() {
        updateListPlaybackUI(els.sharedList, "shared");
        updateListPlaybackUI(els.ymSearchList, "search");
      }

      async function yandexRequest(path, params = {}) {
        const url = buildApiUrl(YANDEX_PROXY_BASE, path, params);
        const headers = { Accept: "application/json" };
        if (state.token) headers.Authorization = `OAuth ${state.token}`;
        const response = await fetch(url.toString(), { headers });
        return await parseYandexPayload(response);
      }

      async function resolveDownloadInfoUrl(downloadInfoUrl) {
        const raw = String(downloadInfoUrl || "").trim();
        if (!raw) {
          return { ok: false, result: { directLink: "" } };
        }
        const url = new URL(YANDEX_RESOLVE_ENDPOINT);
        url.searchParams.set("url", raw);
        const response = await fetch(url.toString(), {
          headers: { Accept: "application/json" }
        });
        return await parseYandexPayload(response);
      }

      async function resolveTrackLinkViaServer(track) {
        if (!track || !track.trackId) return { candidates: [], bitrate: "" };
        const url = new URL(YANDEX_TRACK_LINK_ENDPOINT);
        url.searchParams.set("track_id", String(track.trackId));
        if (track.albumId) url.searchParams.set("album_id", String(track.albumId));
        const headers = { Accept: "application/json" };
        if (state.token) headers.Authorization = `OAuth ${state.token}`;
        const response = await fetch(url.toString(), { headers });
        const payload = await parseYandexPayload(response);

        const direct = String((payload && payload.result && payload.result.directLink) || "").trim();
        const resolvedRaw = String((payload && payload.result && payload.result.resolvedRawDirectLink) || "").trim();
        const raw = String((payload && payload.result && payload.result.rawDirectLink) || "").trim();
        const candidates = [direct, resolvedRaw, raw]
          .map((value) => normalizePlayableUrl(value))
          .filter(Boolean);
        return {
          candidates: [...new Set(candidates)],
          bitrate: "best"
        };
      }

      async function getTrackAccessMeta(track) {
        if (!track || !track.trackId) return null;
        try {
          const payload = await yandexRequest(`/tracks/${track.trackId}`);
          const rows = Array.isArray(payload && payload.result) ? payload.result : [];
          const row = rows[0] && typeof rows[0] === "object" ? rows[0] : null;
          if (!row) return null;
          return {
            available: row.available,
            availableForPremiumUsers: row.availableForPremiumUsers ?? row.available_for_premium_users,
            availableForOptions: row.availableForOptions ?? row.available_for_options
          };
        } catch (_) {
          return null;
        }
      }

      function applyListSearch() {
        state.listQuery = String((els.searchInput && els.searchInput.value) || "").trim();
        renderSharedList();
      }

      function getTrackSearchResults(payload) {
        return ((((payload || {}).result || {}).tracks || {}).results || []);
      }

      function mapYmSearchTracks(rawTracks = []) {
        const out = [];
        const seen = new Set();
        rawTracks.forEach((raw) => {
          const mapped = toTrackModel(raw, "search");
          if (!mapped.trackId || seen.has(mapped.trackId)) return;
          seen.add(mapped.trackId);
          out.push(mapped);
        });
        return out;
      }

      async function executeYmTrackSearch(query) {
        const normalized = String(query || "").trim();
        state.ymSearchQuery = normalized;
        if (!normalized) {
          state.ymSearchDataVersion += 1;
          resetYmSearchLazyState();
          renderSearchList();
          return;
        }

        const requestSeq = ++state.ymSearchRequestSeq;
        state.ymSearchDataVersion += 1;
        resetYmSearchLazyState();
        state.ymSearchLoading = true;
        renderSearchList();
        try {
          const payload = await yandexRequest("/search", {
            text: normalized,
            type: "track",
            page: 0,
            nocorrect: false
          });
          if (requestSeq !== state.ymSearchRequestSeq) return;
          const mapped = mapYmSearchTracks(getTrackSearchResults(payload));
          const ranked = rankYmSearchTracks(mapped, normalized, "auto");
          state.ymSearchResults = ranked.tracks;
          state.ymSearchRankMode = ranked.mode;
          const totalRaw = Number((((payload || {}).result || {}).tracks || {}).total || 0);
          if (Number.isFinite(totalRaw) && totalRaw > 0) {
            state.ymSearchTotal = totalRaw;
          } else {
            state.ymSearchTotal = mapped.length;
          }
          state.ymSearchPage = 0;
          state.ymSearchHasMore = state.ymSearchTotal > state.ymSearchResults.length && mapped.length > 0;
          state.ymSearchRenderCount = Math.min(state.ymSearchChunkSize, state.ymSearchResults.length);
          state.ymSearchQuery = normalized;
          state.ymSearchResults.slice(0, 6).forEach((track) => {
            preloadCoverImage(track.coverUrl || "");
          });
        } catch (_) {
          if (requestSeq !== state.ymSearchRequestSeq) return;
          resetYmSearchLazyState();
        } finally {
          if (requestSeq !== state.ymSearchRequestSeq) return;
          state.ymSearchLoading = false;
          renderSearchList();
        }
      }

      function scheduleYmTrackSearch(query) {
        if (state.ymSearchDebounceTimer) {
          clearTimeout(state.ymSearchDebounceTimer);
        }
        state.ymSearchDebounceTimer = setTimeout(() => {
          state.ymSearchDebounceTimer = null;
          executeYmTrackSearch(query);
        }, 260);
      }

      function parseTrackUrl(url) {
        const value = String(url || "").trim();
        if (!value) return null;
        const patterns = [
          /music\.yandex\.[^/]+\/album\/(\d+)\/track\/(\d+)/i,
          /music\.yandex\.[^/]+\/track\/(\d+)/i
        ];
        const full = value.match(patterns[0]);
        if (full) {
          return {
            albumId: full[1],
            trackId: full[2],
            sourceUrl: `https://music.yandex.ru/album/${full[1]}/track/${full[2]}`
          };
        }
        const short = value.match(patterns[1]);
        if (short) {
          return {
            albumId: "",
            trackId: short[1],
            sourceUrl: `https://music.yandex.ru/track/${short[1]}`
          };
        }
        return null;
      }

      async function loadTrackByParsed(parsed, options = {}) {
        const shouldClearInput = Boolean(options.clearInput);
        if (!parsed || !parsed.trackId) {
          toast("Невалидная ссылка. Пример: music.yandex.ru/album/.../track/...", "err");
          return;
        }
        if (els.addByUrlBtn) {
          els.addByUrlBtn.disabled = true;
          els.addByUrlBtn.textContent = "Загружаю...";
        }
        try {
          let arr = [];
          const asArray = (value) => Array.isArray(value) ? value : (value ? [value] : []);
          if (parsed.albumId) {
            const withAlbum = await yandexRequest(`/tracks/${parsed.trackId}:${parsed.albumId}`);
            arr = asArray(withAlbum.result);
          }
          if (!arr.length) {
            const data = await yandexRequest(`/tracks/${parsed.trackId}`);
            arr = asArray(data.result);
          }
          if (!arr.length) {
            throw new Error("Трек не найден в API");
          }
          let track = toTrackModel({ ...arr[0], ...parsed }, "search");
          if (!track.artists.length) {
            try {
              const searchData = await yandexRequest("/search", {
                text: parsed.trackId,
                type: "track",
                page: 0,
                nocorrect: true
              });
              const searchResults = ((((searchData || {}).result || {}).tracks || {}).results || []);
              const sameTrack = searchResults.find((item) => extractTrackId(item && item.id) === String(parsed.trackId));
              if (sameTrack) {
                track = toTrackModel({ ...sameTrack, ...parsed }, "search");
              }
            } catch (_) {}
          }
          await addToShared(track);
          if (shouldClearInput && els.trackUrlInput) els.trackUrlInput.value = "";
          setActiveToolPanel("");
        } catch (error) {
          toast(`Ошибка по ссылке: ${error.message}`, "err");
        } finally {
          if (els.addByUrlBtn) {
            els.addByUrlBtn.disabled = false;
            els.addByUrlBtn.textContent = "Добавить";
          }
        }
      }

      async function handleUnifiedTrackInputSubmit() {
        if (!els.trackUrlInput) return;
        const raw = String(els.trackUrlInput.value || "").trim();
        if (!raw) return;

        const parsed = parseTrackUrl(raw);
        if (parsed && parsed.trackId) {
          if (state.ymSearchDebounceTimer) {
            clearTimeout(state.ymSearchDebounceTimer);
            state.ymSearchDebounceTimer = null;
          }
          state.ymSearchDataVersion += 1;
          resetYmSearchLazyState();
          renderSearchList();
          await loadTrackByParsed(parsed, { clearInput: true });
          return;
        }

        state.ymSearchQuery = raw;
        if (state.ymSearchDebounceTimer) {
          clearTimeout(state.ymSearchDebounceTimer);
          state.ymSearchDebounceTimer = null;
        }
        await executeYmTrackSearch(raw);
      }

      async function resolveStream(track) {
        if (!track || !track.trackId) return { url: "", bitrate: "" };
        if (track.streamUrl) {
          track._streamCandidates = [{ url: normalizePlayableUrl(track.streamUrl), bitrate: track.bitrate || "cached" }];
          return { url: normalizePlayableUrl(track.streamUrl), bitrate: track.bitrate || "cached" };
        }

        try {
          const primary = await resolveTrackLinkViaServer(track);
          if (Array.isArray(primary.candidates) && primary.candidates.length) {
            track._streamCandidates = primary.candidates.map((url) => ({ url, bitrate: primary.bitrate || "best" }));
            return {
              url: track._streamCandidates[0].url,
              bitrate: track._streamCandidates[0].bitrate || "best"
            };
          }
        } catch (_) {}

        const resolveId = `${track.trackId}:${Date.now()}`;
        state.pendingResolveId = resolveId;
        let data = null;
        if (track.albumId) {
          try {
            data = await yandexRequest(`/tracks/${track.trackId}:${track.albumId}/download-info`, {
              "get-direct-links": true,
              hq: 1
            });
          } catch (_) {}
        }
        if (!data) {
          data = await yandexRequest(`/tracks/${track.trackId}/download-info`, {
            "get-direct-links": true,
            hq: 1
          });
        }
        if (!Array.isArray(data && data.result) || !data.result.length) {
          data = await yandexRequest(`/tracks/${track.trackId}/download-info`, {
            "get-direct-links": true
          });
        }

        if (state.pendingResolveId !== resolveId) {
          return { url: "", bitrate: "" };
        }

        const infos = Array.isArray(data.result) ? data.result : [];
        if (!infos.length) {
          throw new Error("API не вернул stream URL для этого трека");
        }

        const normalized = infos
          .map((item) => {
            const directUrl = String(item.directLink || item.direct_link || item.url || "").trim();
            const urls = [];
            if (directUrl) urls.push(normalizePlayableUrl(directUrl));
            return {
              urls,
              downloadInfoUrl: String(item.downloadInfoUrl || item.download_info_url || "").trim(),
              bitrate: Number(item.bitrateInKbps || item.bitrate || 0),
              codec: String(item.codec || "").toLowerCase(),
              preview: Boolean(item.preview)
            };
          })
          .filter((item) => item.urls.length || item.downloadInfoUrl);

        if (!normalized.length) {
          throw new Error("Прямой stream недоступен");
        }

        for (const item of normalized) {
          if (item.urls.length) continue;
          if (!item.downloadInfoUrl) continue;
          try {
            const resolved = await resolveDownloadInfoUrl(item.downloadInfoUrl);
            const resolvedUrl = String((resolved && resolved.result && resolved.result.directLink) || "").trim();
            const rawResolvedUrl = String((resolved && resolved.result && resolved.result.rawDirectLink) || "").trim();
            const deeplyResolvedRawUrl = String((resolved && resolved.result && resolved.result.resolvedRawDirectLink) || "").trim();
            const candidates = [resolvedUrl, deeplyResolvedRawUrl, rawResolvedUrl]
              .map((urlValue) => normalizePlayableUrl(urlValue))
              .filter(Boolean);
            if (candidates.length) item.urls = [...new Set(candidates)];
          } catch (_) {}
        }

        const resolvedCandidates = normalized
          .filter((item) => item.urls.length)
          .flatMap((item) => item.urls.map((url) => ({
            url,
            bitrate: item.bitrate,
            codec: item.codec,
            preview: item.preview
          })));
        if (!resolvedCandidates.length) {
          throw new Error("Не удалось резолвнуть stream URL");
        }

        const fullCandidates = resolvedCandidates.filter((item) => !item.preview);
        if (!fullCandidates.length) {
          const meta = await getTrackAccessMeta(track);
          if (meta && meta.availableForPremiumUsers === true) {
            throw new Error("API вернул только preview: трек доступен только для premium-аккаунта токена.");
          }
          throw new Error("API вернул только preview-версии для этого токена/трека.");
        }

        fullCandidates.sort((a, b) => {
          const bitrateDiff = (b.bitrate || 0) - (a.bitrate || 0);
          if (bitrateDiff !== 0) return bitrateDiff;
          const codecRank = (codec) => (codec.includes("mp3") ? 3 : codec.includes("aac") ? 2 : 1);
          return codecRank(b.codec) - codecRank(a.codec);
        });

        const preparedCandidates = [];
        const seen = new Set();
        fullCandidates.forEach((candidate) => {
          const normalizedUrl = normalizePlayableUrl(candidate.url);
          if (!normalizedUrl || seen.has(normalizedUrl)) return;
          seen.add(normalizedUrl);
          preparedCandidates.push({
            url: normalizedUrl,
            bitrate: candidate.bitrate ? `${candidate.bitrate}kbps ${candidate.codec || ""}`.trim() : `${candidate.codec || "auto"}`.trim()
          });
        });
        track._streamCandidates = preparedCandidates;

        const best = preparedCandidates[0] || { url: "", bitrate: "" };
        return {
          url: best.url,
          bitrate: best.bitrate || ""
        };
      }

      async function playTrack(track, source = "shared", options = {}) {
        if (!track || !track.trackId) return;
        if (!state.coverSwipeInProgress) {
          const outgoingTrackId = String((state.currentTrack && state.currentTrack.trackId) || "");
          const outgoingCoverSrc = String((els.currentCover && els.currentCover.dataset.currentSrc) || "");
          state.lastOutgoingTrackId = outgoingTrackId;
          state.lastOutgoingCoverSrc = outgoingCoverSrc;
        }
        const previousTrackId = String(state.currentTrack && state.currentTrack.trackId || "");
        const nextTrackId = String(track.trackId || "");
        const isRestoreFlow = Boolean(options && options.restoreFlow);
        if (!isRestoreFlow) {
          state.playbackRestoreEpoch += 1;
        }
        if (!previousTrackId || previousTrackId !== nextTrackId) {
          try { els.audio.pause(); } catch (_) {}
          try { els.audio.currentTime = 0; } catch (_) {}
        }
        state.activeSource = source;
        state.currentTrack = track;
        state.repeatOnceConsumed = false;
        state.currentStreamMeta = null;
        updateCurrentTrackUI(track);
        updateSharedListPlaybackUI();

        if (source === "shared") {
          state.currentIndex = state.renderedTracks.findIndex((t) => t.key && t.key === track.key);
        } else {
          state.currentIndex = -1;
        }

        setPlayButtonState(false);
        try {
          const stream = await resolveStream(track);
          const candidates = Array.isArray(track._streamCandidates) && track._streamCandidates.length
            ? track._streamCandidates
            : (stream.url ? [stream] : []);
          if (!candidates.length) throw new Error("Stream URL не найден");

          let started = false;
          let lastError = null;
          let lastCandidateHost = "";
          for (const candidate of candidates) {
            try {
              try {
                lastCandidateHost = new URL(candidate.url).host || "";
              } catch (_) {
                lastCandidateHost = "";
              }

              els.audio.src = candidate.url;
              els.audio.playbackRate = 1;
              await els.audio.play();
              track.streamUrl = candidate.url;
              track.bitrate = candidate.bitrate || "";
              state.currentStreamMeta = { url: candidate.url, bitrate: candidate.bitrate || "" };
              started = true;
              break;
            } catch (error) {
              const mediaErrorCode = els.audio && els.audio.error ? els.audio.error.code : 0;
              if (mediaErrorCode) {
                lastError = new Error(`MediaError code ${mediaErrorCode}${lastCandidateHost ? ` (${lastCandidateHost})` : ""}`);
              } else {
                lastError = error;
              }
            }
          }
          if (!started) {
            throw lastError || new Error("Нет поддерживаемого источника аудио");
          }

          setPlayButtonState(true);
          if (els.currentBitrate) els.currentBitrate.textContent = `stream: ${track.bitrate || "auto"}`;
          updateSharedListPlaybackUI();
          persistPlaybackSnapshot(true);
        } catch (error) {
          track.streamUrl = "";
          track.bitrate = "";
          setPlayButtonState(false);
          updateSharedListPlaybackUI();
          persistPlaybackSnapshot(true);
        }
      }

      async function playNext() {
        const list = state.renderedTracks;
        if (!list.length) return;
        if (state.shuffle) {
          const randomTrack = list[Math.floor(Math.random() * list.length)];
          await playTrack(randomTrack, "shared");
          return;
        }

        const currentIndex = getCurrentTrackIndex(list);
        const baseIndex = currentIndex >= 0 ? currentIndex : state.currentIndex;
        let nextIndex = baseIndex + 1;
        if (nextIndex >= list.length) return;
        const target = list[nextIndex];
        if (target) {
          state.currentIndex = nextIndex;
          await playTrack(target, "shared");
        }
      }

      async function playPrev() {
        const list = state.renderedTracks;
        if (!list.length) return;
        const currentIndex = getCurrentTrackIndex(list);
        const baseIndex = currentIndex >= 0 ? currentIndex : state.currentIndex;
        let prevIndex = baseIndex - 1;
        if (prevIndex < 0) prevIndex = list.length - 1;
        const target = list[prevIndex];
        if (target) {
          state.currentIndex = prevIndex;
          await playTrack(target, "shared");
        }
      }

      async function addToShared(track) {
        if (!state.db) {
          toast("Firebase недоступен, общий список отключен", "err");
          return;
        }
        if (!track || !track.trackId) {
          toast("Невалидный трек", "err");
          return;
        }
        const user = state.currentUser || { username: "guest", name: "Guest" };
        const snapshot = await state.db
          .ref(COMMUNITY_TRACKS_PATH)
          .orderByChild("trackId")
          .equalTo(track.trackId)
          .once("value");

        if (snapshot.exists()) {
          let enriched = false;
          const updates = {};
          snapshot.forEach((child) => {
            const existing = child.val() || {};
            if (!shouldEnrichStoredTrack(existing, track)) return;
            updates[`${child.key}/title`] = track.title || existing.title || "";
            updates[`${child.key}/artists`] = (track.artists && track.artists.length) ? track.artists : (existing.artists || []);
            updates[`${child.key}/durationMs`] = Number(track.durationMs || existing.durationMs || 0);
            updates[`${child.key}/coverUrl`] = track.coverUrl || existing.coverUrl || FALLBACK_COVER;
            updates[`${child.key}/sourceUrl`] = track.sourceUrl || existing.sourceUrl || "";
            enriched = true;
          });
          if (enriched) {
            await state.db.ref(COMMUNITY_TRACKS_PATH).update(updates);
            toast("Трек уже был в списке: метаданные обновлены");
          } else {
            toast("Этот трек уже есть в общем списке");
          }
          return;
        }

        const payload = {
          trackId: track.trackId,
          albumId: track.albumId || "",
          title: track.title || "",
          artists: track.artists || [],
          durationMs: Number(track.durationMs || 0),
          coverUrl: track.coverUrl || FALLBACK_COVER,
          sourceUrl: track.sourceUrl || "",
          addedByName: user.name,
          addedByUsername: user.username,
          addedAt: firebase.database.ServerValue.TIMESTAMP,
          likes: {}
        };

        await state.db.ref(COMMUNITY_TRACKS_PATH).push(payload);
        toast("Трек добавлен в общий список");
      }

      async function toggleLike(track) {
        if (!state.db || !track || !track.key) return;
        if (!state.currentUser) {
          toast("Требуется авторизация", "err");
          return;
        }
        const me = firebaseSafeKey(state.currentUser.username);
        const ref = state.db.ref(`${COMMUNITY_TRACKS_PATH}/${track.key}/likes/${me}`);
        const getLatestTrack = () => state.sharedTracks.find((item) => String(item && item.key || "") === String(track.key || ""));
        const latestTrack = getLatestTrack() || track;
        const likedNow = isLikedByMe(latestTrack);
        const applyLocalLike = (liked) => {
          const applyTo = (list) => {
            if (!Array.isArray(list)) return;
            list.forEach((item) => {
              if (!item || String(item.key || "") !== String(track.key || "")) return;
              if (!item.likes || typeof item.likes !== "object") item.likes = {};
              if (liked) {
                item.likes[me] = true;
              } else {
                delete item.likes[me];
              }
            });
          };
          applyTo(state.sharedTracks);
          applyTo(state.renderedTracks);
          updateRenderedLikesUI();
        };

        applyLocalLike(!likedNow);
        try {
          if (likedNow) {
            await ref.remove();
          } else {
            await ref.set(true);
          }
        } catch (error) {
          applyLocalLike(likedNow);
        }
      }

      async function removeTrack(track) {
        if (!state.db || !track || !track.key) return;
        const canDelete = state.currentUser && (
          firebaseSafeKey(track.addedByUsername) === firebaseSafeKey(state.currentUser.username)
          || firebaseSafeKey(state.currentUser.username) === "max"
        );
        if (!canDelete) {
          toast("Удалять может только автор трека или admin", "err");
          return;
        }
        await state.db.ref(`${COMMUNITY_TRACKS_PATH}/${track.key}`).remove();
        toast("Трек удалён");
      }

      function syncSharedTracks(snapshot) {
        const prevRendered = Array.isArray(state.renderedTracks) ? [...state.renderedTracks] : [];
        const items = [];
        snapshot.forEach((child) => {
          const raw = child.val() || {};
          const normalized = toTrackModel({ ...raw, key: child.key }, "shared");
          if (!normalized.trackId) return;
          items.push(normalized);
        });
        state.sharedTracks = items;
        refreshAddedByFilterOptions();
        state.sharedTracksLoaded = true;
        const nextVisible = getVisibleTracks();
        const patchOnlyLikes = canPatchRenderedList(prevRendered, nextVisible);
        if (patchOnlyLikes && els.sharedList && els.sharedList.querySelector(".track-item")) {
          state.renderedTracks = nextVisible;
          updateRenderedTrackRows(nextVisible);
          updateSharedListPlaybackUI();
          updateStats();
          updateCoverPeekUI();
        } else {
          renderSharedList();
        }
        tryRestorePlaybackSnapshot();
      }

      function bindSharedTracks() {
        if (!state.db) return;
        state.db.ref(COMMUNITY_TRACKS_PATH).off();
        state.db.ref(COMMUNITY_TRACKS_PATH).on("value", syncSharedTracks, () => {
          toast("Ошибка подписки на общий список", "err");
        });
      }

      function persistPlayerSettings() {
        const payload = {
          repeatMode: state.repeatMode,
          shuffle: state.shuffle,
          filter: state.filter,
          addedByFilter: state.addedByFilter,
          sort: state.sort
        };
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(payload));
      }

      function restoreSettings() {
        const saved = safeJson(localStorage.getItem(SETTINGS_KEY), {});
        if (!saved || typeof saved !== "object") return;
        if (saved.repeatMode === "once" || saved.repeatMode === "loop" || saved.repeatMode === "off") {
          setRepeatMode(saved.repeatMode);
        } else if (saved.repeatMode === "one") {
          setRepeatMode("once");
        } else if (saved.repeatMode === "all") {
          setRepeatMode("loop");
        }
        if (typeof saved.shuffle === "boolean") {
          setShuffleMode(saved.shuffle);
        }
        if (saved.filter) {
          state.filter = String(saved.filter);
          if (els.filterSelect) els.filterSelect.value = state.filter;
        }
        if (saved.addedByFilter) {
          state.addedByFilter = String(saved.addedByFilter);
          updateAddedByFilterLabel();
        }
        if (saved.sort) {
          state.sort = String(saved.sort);
          if (els.sortSelect) els.sortSelect.value = state.sort;
        }
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function bindEvents() {
        const handleMainCoverToggle = () => {

        if (els.currentCoverWrap) {

          });

          }

        });

        if (els.toggleSearchPanelBtn) {
          els.toggleSearchPanelBtn.addEventListener("click", () => {

            setActiveToolPanel("search");
          });
        }
        if (els.toggleAddPanelBtn) {
          els.toggleAddPanelBtn.addEventListener("click", () => {
            setAddHelpOpen(false);
            setActiveToolPanel("add");
          });
        }
        if (els.toggleAddHelpBtn) {
          els.toggleAddHelpBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            setAddHelpOpen(!state.addHelpOpen);
          });
        }
        if (els.addHelpPopover) {
          els.addHelpPopover.addEventListener("click", (event) => {
            event.stopPropagation();
          });
        }
        document.addEventListener("click", (event) => {
          if (!state.addHelpOpen) return;

        });
        if (els.searchInput) {
          els.searchInput.addEventListener("input", applyListSearch);
          els.searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
              els.searchInput.value = "";
              applyListSearch();
              setActiveToolPanel("");
            }
          });
        }
        if (els.sharedList) {
          let lazyScrollTicking = false;
          els.sharedList.addEventListener("scroll", () => {
            if (lazyScrollTicking) return;
            lazyScrollTicking = true;
            requestAnimationFrame(() => {
              lazyScrollTicking = false;
              maybeLoadMoreSharedTracks();
            });
          }, { passive: true });
        }
        if (els.ymSearchList) {
          let ymLazyScrollTicking = false;
          els.ymSearchList.addEventListener("scroll", () => {
            if (ymLazyScrollTicking) return;
            ymLazyScrollTicking = true;
            requestAnimationFrame(() => {
              ymLazyScrollTicking = false;
              maybeLoadMoreYmSearchTracks();
            });
          }, { passive: true });
        }
        if (els.addByUrlBtn) {
          els.addByUrlBtn.addEventListener("click", () => {
            handleUnifiedTrackInputSubmit();
          });
        }
        if (els.ymSearchInput) {
          els.ymSearchInput.addEventListener("input", () => {
            const query = String(els.ymSearchInput.value || "").trim();
            state.ymSearchQuery = query;
            if (!query) {
              state.ymSearchDataVersion += 1;
              resetYmSearchLazyState();
              renderSearchList();
              return;
            }
            const parsed = parseTrackUrl(query);
            if (parsed && parsed.trackId) {
              if (state.ymSearchDebounceTimer) {
                clearTimeout(state.ymSearchDebounceTimer);
                state.ymSearchDebounceTimer = null;
              }
              state.ymSearchDataVersion += 1;
              resetYmSearchLazyState();
              renderSearchList();
              return;
            }
            scheduleYmTrackSearch(query);
          });
          els.ymSearchInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              const query = String(els.ymSearchInput.value || "").trim();
              if (!query) {
                state.ymSearchDataVersion += 1;
                resetYmSearchLazyState();
                renderSearchList();
                return;
              }
              handleUnifiedTrackInputSubmit();
              return;
            }
            if (event.key === "Escape") {
              setActiveToolPanel("");
            }
          });
        }

        els.playBtn.addEventListener("click", async () => {
          if (!state.currentTrack) {
            const fallback = state.renderedTracks[0];
            if (fallback) await playTrack(fallback, "shared");
            return;
          }
          if (els.audio.paused) {
            try {
              await els.audio.play();
              setPlayButtonState(true);
            } catch (_) {}
          } else {
            els.audio.pause();
            setPlayButtonState(false);
          }
        });

        els.prevBtn.addEventListener("click", playPrev);
        els.nextBtn.addEventListener("click", playNext);

        if (els.peekPrevBtn) {
          els.peekPrevBtn.addEventListener("click", async () => {
            if (els.peekPrevBtn.disabled) return;
            await playPrev();
          });
        }
        if (els.peekNextBtn) {
          els.peekNextBtn.addEventListener("click", async () => {
            if (els.peekNextBtn.disabled) return;
            await playNext();
          });
        }

        const coverSwipeState = {
          active: false,
          dragging: false,
          startX: 0,
          startY: 0,
          deltaX: 0,
          renderX: 0,
          frameX: 0,
          rafId: 0,
          deltaY: 0,
          animating: false
        };

        const scheduleCoverSwipeFrame = (value) => {
          coverSwipeState.frameX = value;
          if (coverSwipeState.rafId) return;
          coverSwipeState.rafId = requestAnimationFrame(() => {
            coverSwipeState.rafId = 0;
            renderCoverSwipeOffset(coverSwipeState.frameX);
          });
        };

        const cancelCoverSwipeFrame = () => {
          if (!coverSwipeState.rafId) return;
          cancelAnimationFrame(coverSwipeState.rafId);
          coverSwipeState.rafId = 0;
        };

        const animateCoverSwipeBack = () => {
          cancelCoverSwipeFrame();
          setCoverSwipeTransition(true);
          resetCoverSwipeVisuals(true);
          setTimeout(() => {
            setCoverSwipeTransition(false);
          }, 300);
        };

        const commitCoverSwipe = async (direction) => {
          if (coverSwipeState.animating) return;
          const neighbors = getNeighborTracks();
          const targetTrack = direction > 0 ? neighbors.prev : neighbors.next;
          const canMovePrev = direction > 0 && targetTrack && els.peekPrevBtn && !els.peekPrevBtn.disabled;
          const canMoveNext = direction < 0 && targetTrack && els.peekNextBtn && !els.peekNextBtn.disabled;
          if ((!canMovePrev && !canMoveNext) || !targetTrack) {
            animateCoverSwipeBack();
            return;
          }

          cancelCoverSwipeFrame();
          coverSwipeState.animating = true;
          state.coverSwipeInProgress = true;
          const metrics = getCoverSwipeMetrics();
          const targetCoverSrc = targetTrack.coverUrl || FALLBACK_COVER;
          const targetRenderedSrc = direction > 0
            ? String((els.peekPrevCover && els.peekPrevCover.dataset.currentSrc) || targetCoverSrc)
            : String((els.peekNextCover && els.peekNextCover.dataset.currentSrc) || targetCoverSrc);
          const outgoingTrackId = String((state.currentTrack && state.currentTrack.trackId) || "");
          const outgoingCoverSrc = String((els.currentCover && els.currentCover.dataset.currentSrc) || "");
          state.lastOutgoingTrackId = outgoingTrackId;
          state.lastOutgoingCoverSrc = outgoingCoverSrc;
          setCoverSwipeTransition(true);
          if (direction > 0) {
            if (els.currentCoverWrap) els.currentCoverWrap.style.transform = `translate3d(${metrics.baseShift}px, 0, 0) scale(0.94)`;
            if (els.peekPrevBtn) {
              els.peekPrevBtn.style.transform = "translate3d(0px, -50%, 0) scale(1)";
              els.peekPrevBtn.style.opacity = "0.98";
            }
          } else {
            if (els.currentCoverWrap) els.currentCoverWrap.style.transform = `translate3d(${-metrics.baseShift}px, 0, 0) scale(0.94)`;
            if (els.peekNextBtn) {
              els.peekNextBtn.style.transform = "translate3d(0px, -50%, 0) scale(1)";
              els.peekNextBtn.style.opacity = "0.98";
            }
          }

          const waitForSwipeTransitionEnd = () => new Promise((resolve) => {
            if (!els.currentCoverWrap) {
              resolve();
              return;
            }
            let settled = false;
            const finalize = () => {
              if (settled) return;
              settled = true;
              els.currentCoverWrap.removeEventListener("transitionend", onEnd);
              resolve();
            };
            const onEnd = (event) => {
              if (!event || event.target !== els.currentCoverWrap) return;
              if (event.propertyName && event.propertyName !== "transform") return;
              finalize();
            };
            els.currentCoverWrap.addEventListener("transitionend", onEnd, { once: false });
            setTimeout(finalize, 360);
          });

          waitForSwipeTransitionEnd().then(() => {
            setCoverSwipeTransition(false);

            const rotated = rotateCoverNodes(direction);
            const activeCurrentSrc = String(
              (els.currentCover && els.currentCover.dataset.currentSrc)
              || targetRenderedSrc
              || targetCoverSrc
              || FALLBACK_COVER
            );
            if (!rotated && els.currentCover && els.currentCover.dataset.currentSrc !== activeCurrentSrc) {
              els.currentCover.src = activeCurrentSrc;
              els.currentCover.dataset.currentSrc = activeCurrentSrc;
            }
            if (state.fullscreenOpen && els.fullscreenCover && els.fullscreenCover.dataset.currentSrc !== activeCurrentSrc) {
              els.fullscreenCover.src = activeCurrentSrc;
              els.fullscreenCover.dataset.currentSrc = activeCurrentSrc;
            }

            renderCoverSwipeOffset(0);
            coverSwipeState.animating = false;

            const nextSource = state.activeSource === "search" ? "search" : "shared";
            if (activeCurrentSrc) {
              targetTrack.coverUrl = activeCurrentSrc;
            }
            if (nextSource === "shared" && Array.isArray(state.renderedTracks) && state.renderedTracks.length) {
              const nextIndex = state.renderedTracks.findIndex((item) => String(item && item.trackId || "") === String(targetTrack.trackId || ""));
              if (nextIndex >= 0) state.currentIndex = nextIndex;
            }
            playTrack(targetTrack, nextSource)
              .catch(() => {})
              .finally(() => {
                state.coverSwipeInProgress = false;
                updateCoverPeekUI();
              });
          });
        };

        if (els.coverCarousel) {
          els.coverCarousel.addEventListener("touchstart", (event) => {
            if (isDesktopViewport() || coverSwipeState.animating) return;
            if (!event.touches || !event.touches.length) return;
            const touch = event.touches[0];
            coverSwipeState.active = true;
            coverSwipeState.dragging = false;
            coverSwipeState.startX = touch.clientX;
            coverSwipeState.startY = touch.clientY;
            coverSwipeState.deltaX = 0;
            coverSwipeState.renderX = 0;
            coverSwipeState.frameX = 0;
            coverSwipeState.deltaY = 0;
            cancelCoverSwipeFrame();
            setCoverSwipeTransition(false);
          }, { passive: true });

          els.coverCarousel.addEventListener("touchmove", (event) => {
            if (!coverSwipeState.active || isDesktopViewport() || coverSwipeState.animating) return;
            if (!event.touches || !event.touches.length) return;
            const touch = event.touches[0];
            coverSwipeState.deltaX = touch.clientX - coverSwipeState.startX;
            coverSwipeState.deltaY = touch.clientY - coverSwipeState.startY;

            if (!coverSwipeState.dragging) {
              if (Math.abs(coverSwipeState.deltaX) < 6 && Math.abs(coverSwipeState.deltaY) < 6) return;
              if (Math.abs(coverSwipeState.deltaX) <= Math.abs(coverSwipeState.deltaY)) {
                coverSwipeState.active = false;
                return;
              }
              coverSwipeState.dragging = true;
            }
            const hasPrev = els.peekPrevBtn && !els.peekPrevBtn.disabled;
            const hasNext = els.peekNextBtn && !els.peekNextBtn.disabled;
            let renderX = coverSwipeState.deltaX;
            if ((renderX > 0 && !hasPrev) || (renderX < 0 && !hasNext)) {
              renderX *= 0.28;
            }
            coverSwipeState.renderX = renderX;
            event.preventDefault();
            scheduleCoverSwipeFrame(renderX);
          }, { passive: false });

          const finishCoverSwipe = async () => {
            if (!coverSwipeState.active) return;
            const wasDragging = coverSwipeState.dragging;
            const deltaX = coverSwipeState.renderX;
            const metrics = getCoverSwipeMetrics();
            coverSwipeState.active = false;
            coverSwipeState.dragging = false;
            coverSwipeState.deltaX = 0;
            coverSwipeState.renderX = 0;
            coverSwipeState.frameX = 0;
            coverSwipeState.deltaY = 0;
            cancelCoverSwipeFrame();

            if (!wasDragging || Math.abs(deltaX) < metrics.commitThreshold) {
              animateCoverSwipeBack();
              return;
            }
            await commitCoverSwipe(deltaX > 0 ? 1 : -1);
          };

          els.coverCarousel.addEventListener("touchend", () => {
            finishCoverSwipe();
          }, { passive: true });
          els.coverCarousel.addEventListener("touchcancel", () => {
            coverSwipeState.active = false;
            coverSwipeState.dragging = false;
            coverSwipeState.deltaX = 0;
            coverSwipeState.renderX = 0;
            coverSwipeState.frameX = 0;
            coverSwipeState.deltaY = 0;
            cancelCoverSwipeFrame();
            animateCoverSwipeBack();
          }, { passive: true });
        }

        els.repeatBtn.addEventListener("click", () => {
          const current = state.repeatMode;
          const next = current === "off" ? "once" : current === "once" ? "loop" : "off";
          setRepeatMode(next);
          persistPlayerSettings();
        });
        if (els.fsRepeatBtn) {
          els.fsRepeatBtn.addEventListener("click", () => {
            const current = state.repeatMode;
            const next = current === "off" ? "once" : current === "once" ? "loop" : "off";
            setRepeatMode(next);
            persistPlayerSettings();
          });
        }

        els.shuffleBtn.addEventListener("click", () => {
          setShuffleMode(!state.shuffle);
          persistPlayerSettings();
        });
        if (els.fsShuffleBtn) {
          els.fsShuffleBtn.addEventListener("click", () => {
            setShuffleMode(!state.shuffle);
            persistPlayerSettings();
          });
        }

        els.progressBar.addEventListener("click", (event) => {
          seekByClientX(event.clientX);
        });
        if (els.fsProgressBar) {
          els.fsProgressBar.addEventListener("click", (event) => {
            seekByClientX(event.clientX, els.fsProgressBar);
          });
        }
        if (els.fsPlayBtn) {
          els.fsPlayBtn.addEventListener("click", () => {
            els.playBtn.click();
          });
        }
        if (els.fsPrevBtn) {
          els.fsPrevBtn.addEventListener("click", () => {
            els.prevBtn.click();
          });
        }
        if (els.fsNextBtn) {
          els.fsNextBtn.addEventListener("click", () => {
            els.nextBtn.click();
          });
        }

        const touchSeekState = {
          active: false,
          seeking: false,
          wasPlaying: false,
          previewTime: null,
          previewDuration: 0,
          startX: 0,
          startY: 0,
          barLeft: 0,
          barWidth: 0,
          duration: 0,
          rafId: 0,
          pendingClientX: 0,
          lastLabelUpdateAt: 0
        };

        const cancelTouchSeekRaf = () => {
          if (!touchSeekState.rafId) return;
          cancelAnimationFrame(touchSeekState.rafId);
          touchSeekState.rafId = 0;
        };

        const scheduleTouchSeekPreview = (clientX) => {
          touchSeekState.pendingClientX = clientX;
          if (touchSeekState.rafId) return;
          touchSeekState.rafId = requestAnimationFrame((timestamp) => {
            touchSeekState.rafId = 0;
            const width = Number(touchSeekState.barWidth) || 0;
            const duration = Number(touchSeekState.duration) || Number(els.audio.duration) || 0;
            if (width <= 0 || !Number.isFinite(duration) || duration <= 0) return;
            const ratio = Math.max(0, Math.min(1, (touchSeekState.pendingClientX - touchSeekState.barLeft) / width));
            const targetTime = duration * ratio;
            touchSeekState.previewTime = targetTime;
            touchSeekState.previewDuration = duration;
            const shouldUpdateLabels = !touchSeekState.lastLabelUpdateAt || (timestamp - touchSeekState.lastLabelUpdateAt) >= 90;
            if (shouldUpdateLabels) touchSeekState.lastLabelUpdateAt = timestamp;
            renderSeekPreview(targetTime, duration, { updateLabels: shouldUpdateLabels });
          });
        };

        els.progressBar.addEventListener("touchstart", (event) => {
          if (!event.touches || !event.touches.length) return;
          const touch = event.touches[0];
          const rect = els.progressBar.getBoundingClientRect();
          touchSeekState.active = true;
          touchSeekState.seeking = false;
          touchSeekState.wasPlaying = false;
          touchSeekState.previewTime = null;
          touchSeekState.previewDuration = 0;
          touchSeekState.startX = touch.clientX;
          touchSeekState.startY = touch.clientY;
          touchSeekState.barLeft = rect.left || 0;
          touchSeekState.barWidth = rect.width || 0;
          touchSeekState.duration = Number(els.audio.duration) || 0;
          touchSeekState.pendingClientX = touch.clientX;
          touchSeekState.lastLabelUpdateAt = 0;
          cancelTouchSeekRaf();
        }, { passive: true });

        els.progressBar.addEventListener("touchmove", (event) => {
          if (!touchSeekState.active || !event.touches || !event.touches.length) return;
          const touch = event.touches[0];
          const dx = touch.clientX - touchSeekState.startX;
          const dy = touch.clientY - touchSeekState.startY;

          if (!touchSeekState.seeking) {
            if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
            if (Math.abs(dx) >= Math.abs(dy)) {
              touchSeekState.seeking = true;
              touchSeekState.wasPlaying = !els.audio.paused;
              if (touchSeekState.wasPlaying) {
                els.audio.pause();
              }
              if (els.progressFill) els.progressFill.style.transition = "none";
              if (els.fsProgressFill) els.fsProgressFill.style.transition = "none";
            } else {
              touchSeekState.active = false;
              return;
            }
          }

          event.preventDefault();
          scheduleTouchSeekPreview(touch.clientX);
        }, { passive: false });

        const finishTouchSeek = async (event, { commit = true } = {}) => {
          if (!touchSeekState.active) return;
          cancelTouchSeekRaf();
          if (touchSeekState.seeking) {
            if (commit) {
              if (Number.isFinite(touchSeekState.previewTime)) {
                const duration = Number(els.audio.duration);
                const targetTime = Math.max(0, Math.min(Number.isFinite(duration) ? duration : 0, touchSeekState.previewTime));
                els.audio.currentTime = targetTime;
                updateProgressUI();
              } else if (event.changedTouches && event.changedTouches.length) {
                seekByClientX(event.changedTouches[0].clientX);
              }

              if (touchSeekState.wasPlaying) {
                try {
                  await els.audio.play();
                } catch (_) {}
              }
            } else {
              updateProgressUI();
              if (touchSeekState.wasPlaying) {
                try {
                  await els.audio.play();
                } catch (_) {}
              }
            }
          }
          touchSeekState.active = false;
          touchSeekState.seeking = false;
          touchSeekState.wasPlaying = false;
          touchSeekState.previewTime = null;
          touchSeekState.previewDuration = 0;
          touchSeekState.startX = 0;
          touchSeekState.startY = 0;
          touchSeekState.barLeft = 0;
          touchSeekState.barWidth = 0;
          touchSeekState.duration = 0;
          touchSeekState.pendingClientX = 0;
          touchSeekState.lastLabelUpdateAt = 0;
          if (els.progressFill) els.progressFill.style.transition = "";
          if (els.fsProgressFill) els.fsProgressFill.style.transition = "";
        };

        els.progressBar.addEventListener("touchend", (event) => {
          finishTouchSeek(event, { commit: true });
        }, { passive: true });
        els.progressBar.addEventListener("touchcancel", (event) => {
          finishTouchSeek(event, { commit: false });
        }, { passive: true });

        if (els.filterSelect) {
          els.filterSelect.addEventListener("change", () => {
            state.filter = els.filterSelect.value;
            renderSharedList();
            persistPlayerSettings();
          });
        }
        if (els.addedByFilterBtn && els.addedByFilterRoot && els.addedByFilterMenu) {
          els.addedByFilterBtn.addEventListener("click", () => {
            const isOpen = els.addedByFilterRoot.classList.contains("is-open");
            setAddedByFilterMenuOpen(!isOpen);
          });

          els.addedByFilterMenu.addEventListener("click", (event) => {
            const option = event.target.closest(".added-by-filter-option");
            if (!option) return;
            applyAddedByFilterValue(String(option.dataset.value || "all"));
          });

          document.addEventListener("click", (event) => {
            if (!els.addedByFilterRoot.classList.contains("is-open")) return;
            if (els.addedByFilterRoot.contains(event.target)) return;
            setAddedByFilterMenuOpen(false);
          });

          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") setAddedByFilterMenuOpen(false);
          });
        }
        if (els.sortSelect) {
          els.sortSelect.addEventListener("change", () => {
            state.sort = els.sortSelect.value;
            renderSharedList();
            persistPlayerSettings();
          });
        }

        if (els.oauthLoginBtn) {
          els.oauthLoginBtn.addEventListener("click", async () => {
            try {
              await startYandexOAuthLogin();
            } catch (error) {
              toast(`OAuth error: ${error.message || error}`, "err");
            }
          });
        }

        if (els.oauthLogoutBtn) {
          els.oauthLogoutBtn.addEventListener("click", () => {
            applyToken("", { persist: true, toastMessage: "OAuth отключён" });
          });
        }

        els.audio.addEventListener("loadedmetadata", updateProgressUI);
        els.audio.addEventListener("timeupdate", updateProgressUI);
        els.audio.addEventListener("play", () => {
          setPlayButtonState(true);
          persistPlaybackSnapshot(true);
          if ("mediaSession" in navigator) {
            try { navigator.mediaSession.playbackState = "playing"; } catch (_) {}
          }
        });
        els.audio.addEventListener("pause", () => {
          setPlayButtonState(false);
          persistPlaybackSnapshot(true);
          if ("mediaSession" in navigator) {
            try { navigator.mediaSession.playbackState = "paused"; } catch (_) {}
          }
        });
        els.audio.addEventListener("ended", async () => {
          if (state.repeatMode === "loop" && state.currentTrack) {
            try {
              els.audio.currentTime = 0;
              await els.audio.play();
            } catch (_) {
              setPlayButtonState(false);
            }
            return;
          }

          if (state.repeatMode === "once" && state.currentTrack) {
            if (!state.repeatOnceConsumed) {
              state.repeatOnceConsumed = true;
              try {
                els.audio.currentTime = 0;
                await els.audio.play();
              } catch (_) {
                setRepeatMode("off");
                persistPlayerSettings();
                setPlayButtonState(false);
              }
              return;
            }
            setRepeatMode("off");
            persistPlayerSettings();
          }

          await playNext();
          persistPlaybackSnapshot(true);
        });

        window.addEventListener("pagehide", () => {
          persistPlaybackSnapshot(true);
        });
        window.addEventListener("beforeunload", () => {
          persistPlaybackSnapshot(true);
        });
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") {
            persistPlaybackSnapshot(true);
          }
        });

        window.addEventListener("message", async (event) => {
          const data = event && event.data ? event.data : null;
          if (!data || typeof data !== "object") return;

          if (data.type === "music:request-state") {
            requestStateToParent();
            return;
          }

          if (data.type !== "music:command") return;
          const command = String(data.command || "").trim();

          if (command === "prev") {
            await playPrev();
            return;
          }
          if (command === "next") {
            await playNext();
            return;
          }
          if (command === "seek-to") {
            const ratio = Number(data.ratio);
            const duration = Number(els.audio.duration);
            if (!Number.isFinite(ratio) || !Number.isFinite(duration) || duration <= 0) return;
            els.audio.currentTime = Math.max(0, Math.min(duration, duration * ratio));
            updateProgressUI();
            return;
          }
          if (command === "play-toggle") {
            if (!state.currentTrack) {
              const fallback = state.renderedTracks[0];
              if (fallback) await playTrack(fallback, "shared");
              return;
            }
            if (els.audio.paused) {
              try {
                await els.audio.play();
                setPlayButtonState(true);
              } catch (_) {}
            } else {
              els.audio.pause();
              setPlayButtonState(false);
            }
            return;
          }
        });
      }

      function initFirebase() {
        try {
          if (!window.firebase || !firebaseConfig.databaseURL) {
            throw new Error("Firebase SDK/config не загружены");
          }
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          state.db = firebase.database();
        } catch (error) {
          state.db = null;
          toast(`Firebase отключен: ${error.message}`, "err");
        }
      }

      function init() {
        state.currentUser = getCurrentUser();
        queuePlaybackRestoreFromStorage();
        extractOAuthTokenFromHash();
        hydrateTokenFromStorage();
        loadOAuthConfig();

        initFirebase();
        if (!state.db) {
          state.sharedTracksLoaded = true;
        }
        bindEvents();
        configureMediaSessionActions();
        setRepeatMode("off");
        setShuffleMode(false);
        restoreSettings();

        els.audio.volume = 0.85;
        els.audio.playbackRate = 1;

        updateCurrentTrackUI(null);
        updateProgressUI();
        setFullscreenOpen(false);
        setAddHelpOpen(false);
        setActiveToolPanel("");
        renderSharedList();
        renderSearchList();
        bindSharedTracks();
        tryRestorePlaybackSnapshot();
        requestStateToParent();

        toast("Music Hub готов");
      }

      init();
    })();
  </script>
</body>
</html>
