            const openThreshold = wasSpeaking ? 0.019 : 0.031;
            const sustainThreshold = wasSpeaking ? 0.014 : 0.018;
            if (levelForUi > openThreshold || (wasSpeaking && levelForUi > sustainThreshold)) {
              const until = nowTs + (wasSpeaking ? 760 : 640);
              if (!person.speakingUntil || person.speakingUntil < until) {
                person.speakingUntil = until;
              }
            }
            const isSpeaking = Number(person.speakingUntil || 0) > nowTs;
            if (isSpeaking !== wasSpeaking) {
              changedRemote = true;
            }
          }

          if (state.mode === 'vad') {
            applyTransmissionState();
          }

          updateParticipantVoiceVisuals();

          if (changedRemote) {
            renderParticipants(true);
          }
        };

        step();
        state.vadTimer = window.setInterval(step, 24);
      }

      function stopVadLoop() {
        if (!state.vadTimer) return;
        clearInterval(state.vadTimer);
        state.vadTimer = null;
      }

      function tryResumeAudioContexts() {
        if (state.localAudioContext && state.localAudioContext.state === 'suspended') {
          state.localAudioContext.resume().catch(() => {});
        }
        if (state.remoteAudioContext && state.remoteAudioContext.state === 'suspended') {
          state.remoteAudioContext.resume().catch(() => {});
        }
      }

      function tryPlayAllRemoteAudio() {
        for (const [, peer] of state.peers.entries()) {
          if (!peer || !peer.audio) continue;
          const playPromise = peer.audio.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
          }
        }
      }

      async function unlockMediaFromGesture() {
        tryResumeAudioContexts();
        tryPlayAllRemoteAudio();
        if (!state.joined) return;
        if (!state.captureTrack && !state.voiceInitPromise) {
          try {
            await ensureLocalAudio({ force: false });
            applyTransmissionState();
            updateLocalStateText();
          } catch (_) {}
        }
        if (state.ws && state.ws.readyState === WS_OPEN) {
          emitPresence('join');
          syncVoicePeers(true);
        }
      }

      async function openControlPipIfNeeded() {
        if (!state.joined) return;
        if (document.visibilityState !== 'hidden') return;
        const api = window.documentPictureInPicture;
        if (!api || typeof api.requestWindow !== 'function') {
          if (!state.pipUnsupportedNotified) {
            state.pipUnsupportedNotified = true;
            showToast('PiP-управление не поддерживается этим браузером');
          }
          return;
        }

        if (state.pipWindow && !state.pipWindow.closed) {
          renderPipControls();
          return;
        }

        try {
          const pipWin = await api.requestWindow({
            width: 188,
            height: 96
          });
          state.pipWindow = pipWin;
          mountPipControls(pipWin);
          renderPipControls();
          pipWin.addEventListener('pagehide', () => {
            state.pipWindow = null;
            state.pipElements = null;
          });
        } catch (_) {
          if (!state.pipUnsupportedNotified) {
            state.pipUnsupportedNotified = true;
            showToast('Не удалось открыть PiP-окно управления');
          }
        }
      }

      function closeControlPip(silent = false) {
        const pipWin = state.pipWindow;
        state.pipWindow = null;
        state.pipElements = null;
        if (!pipWin) return;
        try {
          pipWin.close();
        } catch (_) {
          if (!silent) {}
        }
      }

      function computeShouldTransmit() {
        if (!state.joined) return false;
        if (!state.captureTrack) return false;
        if (!state.masterMicEnabled) return false;

        if (state.mode === 'vad') {
          if (document.visibilityState === 'hidden' && state.hiddenTransmitUntil > Date.now()) {
            return true;
          }
          return state.vadGateActive || state.vadSpeaking;
        }
        if (state.mode === 'toggle') {
          return true;
        }
        return state.pttPressed;
      }

      function applyTransmissionState() {
        const shouldTransmit = computeShouldTransmit();
        const trackLiveAllowed = state.joined && state.masterMicEnabled;
        const useVadGate = state.mode === 'vad' && !!state.localGateNode;

        if (state.localTrack) {
          if (useVadGate) {
            try { state.localTrack.enabled = trackLiveAllowed; } catch (_) {}
            if (state.localAudioContext) {
              try {
                const now = state.localAudioContext.currentTime;
                const gate = state.localGateNode.gain;
                const target = shouldTransmit ? 1 : 0.0001;
                const tau = shouldTransmit ? 0.0012 : 0.24;
                gate.cancelScheduledValues(now);
                gate.setTargetAtTime(target, now, tau);
              } catch (_) {}
            }
          } else {
            try { state.localTrack.enabled = shouldTransmit; } catch (_) {}
            if (state.localGateNode && state.localAudioContext) {
              try {
                const now = state.localAudioContext.currentTime;
                const gate = state.localGateNode.gain;
                gate.cancelScheduledValues(now);
                gate.setTargetAtTime(1, now, 0.018);
              } catch (_) {}
            }
          }
        }

        if (state.transmitting === shouldTransmit) {
          updateLocalStateText();
          return;
        }

        state.transmitting = shouldTransmit;
        if (state.transmitting) {
          sendTalkingState(true);
          startTalkingHeartbeat();
        } else {
          sendTalkingState(false);
          stopTalkingHeartbeat();
        }

        updateLocalStateText();
        renderParticipants();
      }

      function startTalkingHeartbeat() {
        if (state.talkingHeartbeatTimer) return;
        state.talkingHeartbeatTimer = window.setInterval(() => {
          if (!state.transmitting) return;
          const keepTrackLive = state.mode === 'vad'
            ? (state.joined && state.masterMicEnabled)
            : true;
          if (state.localTrack && !state.localTrack.enabled && keepTrackLive) {
            try { state.localTrack.enabled = true; } catch (_) {}
          }
          sendTalkingState(true);
        }, TALKING_HEARTBEAT_MS);
      }

      function stopTalkingHeartbeat() {
        if (!state.talkingHeartbeatTimer) return;
        clearInterval(state.talkingHeartbeatTimer);
        state.talkingHeartbeatTimer = null;
      }

      async function fetchAvatarByUsername(username) {
        const normalizedUsername = normalizeUsername(username);
        if (!normalizedUsername) return '';
        if (state.avatarFetchCache.has(normalizedUsername)) {
          return state.avatarFetchCache.get(normalizedUsername) || '';
        }
        if (state.avatarFetchInFlight.has(normalizedUsername)) {
          return state.avatarFetchInFlight.get(normalizedUsername);
        }

        const fetchPromise = (async () => {
          let resolved = '';
          try {
            const endpoint = `${AVATAR_DB_BASE}/users/${encodeURIComponent(normalizedUsername)}/avatarUrl.json`;
            const response = await fetch(endpoint, { method: 'GET', cache: 'no-store' });
            if (response.ok) {
              const payload = await response.json();
              resolved = normalizeAvatarUrl(payload);
            }
          } catch (_) {}
          state.avatarFetchCache.set(normalizedUsername, resolved);
          state.avatarFetchInFlight.delete(normalizedUsername);
          return resolved;
        })();

        state.avatarFetchInFlight.set(normalizedUsername, fetchPromise);
        return fetchPromise;
      }

      async function refreshSelfAvatarFromDirectory() {
        const username = normalizeUsername(state.self.username);
        if (!username) return;
        const avatarUrl = await fetchAvatarByUsername(username);
        if (!avatarUrl || avatarUrl === state.self.avatarUrl) return;
        state.self.avatarUrl = avatarUrl;
        renderParticipants(true);
        if (state.joined) {
          emitPresence('avatar');
        }
      }

      async function resolveParticipantAvatar(participantId, username) {
        const id = String(participantId || '').trim();
        const normalizedUsername = normalizeUsername(username);
        if (!id || !normalizedUsername) return;
        const person = state.participants.get(id);
        if (!person || person.avatarUrl) return;

        const avatarUrl = await fetchAvatarByUsername(normalizedUsername);
        if (!avatarUrl) return;
        const current = state.participants.get(id);
        if (!current) return;
        if (current.avatarUrl === avatarUrl) return;
        current.avatarUrl = avatarUrl;
        renderParticipants(true);
      }

      function initCustomSelects() {
        const selects = [dom.inputSelect, dom.outputSelect, dom.connectionQualitySelect, dom.screenQualitySelect, dom.cameraQualitySelect];
        for (let i = 0; i < selects.length; i += 1) {
          setupCustomSelect(selects[i]);
        }

        document.addEventListener('click', (event) => {
          const target = event.target;
          if (!(target instanceof Element) || !target.closest('.select-shell.customized')) {
            closeCustomSelect();
          }
        });
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {

          }
        });
        window.addEventListener('resize', () => closeCustomSelect());
      }

      function setupCustomSelect(selectEl) {
        if (!selectEl) return;
        const shell = selectEl.closest('.select-shell');
        if (!shell) return;
        shell.classList.add('customized');
        selectEl.classList.add('native-select');

        let customRoot = shell.querySelector('.custom-select');
        if (!customRoot) {
          customRoot = document.createElement('div');
          customRoot.className = 'custom-select';
          customRoot.innerHTML = '<button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false"><span class="custom-select-value"></span></button><div class="custom-select-menu" role="listbox"></div>';
          shell.appendChild(customRoot);
        }

        const trigger = customRoot.querySelector('.custom-select-trigger');
        const valueEl = customRoot.querySelector('.custom-select-value');
        const menu = customRoot.querySelector('.custom-select-menu');
        if (!trigger || !valueEl || !menu) return;

        state.customSelects.set(selectEl.id, { selectEl, shell, customRoot, trigger, valueEl, menu });

        trigger.addEventListener('click', (event) => {
          event.preventDefault();
          if (selectEl.disabled) return;
          const open = state.customSelectOpenId === selectEl.id;
          if (open) closeCustomSelect();
          else openCustomSelect(selectEl.id);
        });

        trigger.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            if (selectEl.disabled) return;
            if (state.customSelectOpenId === selectEl.id) closeCustomSelect();
            else openCustomSelect(selectEl.id);
          }
        });

        menu.addEventListener('click', (event) => {
          const optionEl = event.target instanceof Element ? event.target.closest('.custom-select-option[data-value]') : null;
          if (!optionEl) return;
          const nextValue = String(optionEl.getAttribute('data-value') || '');
          if (selectEl.value !== nextValue) {
            selectEl.value = nextValue;
            selectEl.dispatchEvent(new Event('change', { bubbles: true }));
          }
          syncCustomSelect(selectEl);
          closeCustomSelect();
        });

        selectEl.addEventListener('change', () => {
          syncCustomSelect(selectEl);
        });

        syncCustomSelect(selectEl);
      }

      function openCustomSelect(selectId) {
        const entry = state.customSelects.get(String(selectId || ''));
        if (!entry) return;
        closeCustomSelect(selectId);
        state.customSelectOpenId = selectId;
        entry.customRoot.classList.add('open');
        entry.trigger.setAttribute('aria-expanded', 'true');
      }

      function closeCustomSelect(exceptId = '') {
        state.customSelects.forEach((entry, id) => {
          if (!entry) return;
          const keepOpen = exceptId && id === exceptId && state.customSelectOpenId === id;
          if (keepOpen) return;
          entry.customRoot.classList.remove('open');
          entry.trigger.setAttribute('aria-expanded', 'false');
        });
        if (!exceptId || state.customSelectOpenId !== exceptId) {
          state.customSelectOpenId = '';
        }
      }

      function syncCustomSelect(selectEl) {
        if (!selectEl) return;
        const entry = state.customSelects.get(selectEl.id);
        if (!entry) return;
        const options = Array.from(selectEl.options || []);
        const selectedValue = String(selectEl.value || '');
        const selectedOption = options.find((option) => option.value === selectedValue) || options[0] || null;
        entry.valueEl.textContent = selectedOption ? String(selectedOption.textContent || '').trim() : '';
        entry.trigger.disabled = !!selectEl.disabled;
        entry.trigger.setAttribute('aria-disabled', selectEl.disabled ? 'true' : 'false');

        const markup = options.map((option) => {
          const value = String(option.value || '');
          const active = value === selectedValue;
          const disabled = !!option.disabled;
          return `<button class="custom-select-option ${active ? 'active' : ''}" type="button" role="option" aria-selected="${active ? 'true' : 'false'}" data-value="${escapeHtml(value)}"${disabled ? ' disabled' : ''}>${escapeHtml(String(option.textContent || '').trim())}</button>`;
        }).join('');
        entry.menu.innerHTML = markup;
      }

      function applyConnectionQualityProfile(options = {}) {
        const renegotiate = !!(options && options.renegotiate);
        for (const [, peer] of state.peers.entries()) {
          if (!peer || peer.closed) continue;
          if (peer.localSender) {
            optimizeSender(peer.localSender);
          }
          if (peer.screenSender) {
            optimizeVideoSender(peer.screenSender);
          }
          if (peer.cameraSender) {
            optimizeCameraSender(peer.cameraSender);
          }
          if (!peer.localSender || (state.screenTrack && !peer.screenSender) || (state.cameraTrack && !peer.cameraSender)) {
            ensurePeerMediaTracks(peer);
          }
        }
        if (renegotiate) {
          syncVoicePeers(true);
        }
      }

      function syncRangeProgress(input) {
        if (!input) return;
        const min = Number(input.min || 0);
        const max = Number(input.max || 100);
        const value = Number(input.value || min);
        const span = Math.max(1, max - min);
        const ratio = clamp((value - min) / span, 0, 1);
        input.style.setProperty('--range-progress', `${(ratio * 100).toFixed(2)}%`);
      }

      async function startCameraShare() {
        if (state.cameraSharing) return;
        if (!state.joined) {
          showToast('Сначала войдите в комнату');
          return;
        }
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
          showToast('Этот браузер не поддерживает вебкамеру');
          return;
        }
        const profile = getCameraQualityProfile();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              width: { ideal: profile.width, max: profile.width },
              height: { ideal: profile.height, max: profile.height },
              frameRate: { ideal: profile.frameRate, max: profile.frameRate },
              facingMode: 'user'
            },
            audio: false
          });
          const track = stream.getVideoTracks()[0] || null;
          if (!track) {
            stream.getTracks().forEach((item) => {
              try { item.stop(); } catch (_) {}
            });
            showToast('Не удалось получить видеопоток камеры');
            return;
          }
          state.cameraStream = stream;
          state.cameraTrack = track;
          state.cameraSharing = true;
          try {
            track.contentHint = 'motion';
          } catch (_) {}
          applyCameraQualityProfile();
          track.addEventListener('ended', () => {
            stopCameraShare('Камера выключена');
          }, { once: true });
          for (const [, peer] of state.peers.entries()) {
            ensurePeerMediaTracks(peer);
          }
          syncVoicePeers(true);
          updateCameraButton();
          renderParticipants(true);
          renderScreenStage(true);
          if (state.joined) emitPresence('camera-start');
        } catch (_) {
          showToast('Не удалось включить камеру');
        }
      }

      function applyCameraQualityProfile() {
        const profile = getCameraQualityProfile();
        if (state.cameraTrack && typeof state.cameraTrack.applyConstraints === 'function') {
          state.cameraTrack.applyConstraints({
            width: profile.width,
            height: profile.height,
            frameRate: profile.frameRate
          }).catch(() => {});
          try {
            state.cameraTrack.contentHint = 'motion';
          } catch (_) {}
        }
        for (const [, peer] of state.peers.entries()) {
          if (peer && peer.cameraSender) {
            optimizeCameraSender(peer.cameraSender);
          }
        }
        renderParticipants(true);
        renderScreenStage(true);
      }

      function stopCameraShare(message = '') {
        const hadCamera = !!state.cameraTrack;
        if (state.cameraStream) {
          state.cameraStream.getTracks().forEach((track) => {
            try { track.stop(); } catch (_) {}
          });
        }
        state.cameraStream = null;
        state.cameraTrack = null;
        state.cameraSharing = false;
        if (state.activeCameraStageOwnerId === state.self.id) {
          state.activeCameraStageOwnerId = '';
        }
        for (const [, peer] of state.peers.entries()) {
          ensurePeerMediaTracks(peer);
        }
        updateCameraButton();
        if (hadCamera) {
          syncVoicePeers(true);
          renderParticipants(true);
          renderScreenStage(true);
          if (state.joined) emitPresence('camera-stop');
          if (message) showToast(message);
        } else {
          renderParticipants(true);
          renderScreenStage(true);
        }
      }

      async function startScreenShare() {
        if (state.screenSharing) return;
        if (!state.joined) {
          showToast('Сначала войдите в комнату');
          return;
        }
        const remoteScreenOwnerId = getRemoteActiveScreenOwnerId();
        if (remoteScreenOwnerId) {
          const remotePerson = state.participants.get(remoteScreenOwnerId);
          showToast(`${(remotePerson && remotePerson.name) || 'Другой участник'} уже показывает экран`);
          return;
        }
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getDisplayMedia !== 'function') {
          showToast('Этот браузер не поддерживает показ экрана');
          return;
        }
        const profile = getScreenQualityProfile();
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: {
              width: { ideal: profile.width, max: profile.width },
              height: { ideal: profile.height, max: profile.height },
              frameRate: { ideal: profile.frameRate, max: profile.frameRate },
              cursor: 'motion'
            },
            audio: false
          });
          const track = stream.getVideoTracks()[0] || null;
          if (!track) {
            stream.getTracks().forEach((item) => {
              try { item.stop(); } catch (_) {}
            });
            showToast('Не удалось получить видеопоток экрана');
            return;
          }
          state.screenStream = stream;
          state.screenTrack = track;
          state.screenSharing = true;
          state.activeScreenOwnerId = state.self.id;
          try {
            track.contentHint = 'text';
          } catch (_) {}
          applyScreenShareQualityProfile();
          track.addEventListener('ended', () => {
            stopScreenShare('Показ экрана остановлен');
          }, { once: true });
          for (const [, peer] of state.peers.entries()) {
            ensurePeerMediaTracks(peer);
          }
          syncVoicePeers(true);
          updateShareButton();
          renderScreenStage(true);
          if (state.joined) emitPresence('screen-share-start');
          showToast('Показ экрана запущен');
        } catch (_) {
          showToast('Не удалось начать показ экрана');
        }
      }

      function stopScreenShare(message = '') {
        const hadScreen = !!state.screenTrack;
        if (state.screenStream) {
          state.screenStream.getTracks().forEach((track) => {
            try { track.stop(); } catch (_) {}
          });
        }
        state.screenStream = null;
        state.screenTrack = null;
        state.screenSharing = false;
        if (state.activeScreenOwnerId === state.self.id) {
          state.activeScreenOwnerId = '';
        }
        for (const [, peer] of state.peers.entries()) {
          ensurePeerMediaTracks(peer);
        }
        if (hadScreen) {
          syncVoicePeers(true);
          renderScreenStage(true);
          updateShareButton();
          if (state.joined) emitPresence('screen-share-stop');
          if (message) showToast(message);
        } else {
          updateShareButton();
          renderScreenStage(true);
        }
      }

      function applyScreenShareQualityProfile() {
        const profile = getScreenQualityProfile();
        if (state.screenTrack && typeof state.screenTrack.applyConstraints === 'function') {
          state.screenTrack.applyConstraints({
            width: profile.width,
            height: profile.height,
            frameRate: profile.frameRate
          }).catch(() => {});
          try {
            state.screenTrack.contentHint = 'text';
          } catch (_) {}
        }
        for (const [, peer] of state.peers.entries()) {
          if (peer && peer.screenSender) {
            optimizeVideoSender(peer.screenSender);
          }
        }
        renderScreenStage(true);
      }

      function bindRemoteScreenTrack(participantId, stream, track) {
        const id = String(participantId || '').trim();
        if (!id || !stream || !track) return;
        cancelRemoteScreenClear(id);
        if (state.screenSharing && id !== state.self.id) {
          const remotePerson = state.participants.get(id);
          stopScreenShare(`Показ экрана остановлен: ${(remotePerson && remotePerson.name) || 'другой участник'} начал трансляцию`);
        }
        const mediaStream = new MediaStream();
        mediaStream.addTrack(track);
        const peer = state.peers.get(id);
        if (peer) {
          peer.remoteScreenStream = mediaStream;
          peer.remoteScreenTrack = track;
        }
        const person = state.participants.get(id);
        if (person) {
          person.screenSharing = true;
        }
        state.remoteScreens.set(id, {
          id,
          stream: mediaStream,
          track,
          updatedAt: Date.now()
        });
        state.activeScreenOwnerId = id;
        updateShareButton();
        track.addEventListener('ended', () => {
          clearRemoteScreen(id);
        }, { once: true });
        renderScreenStage(true);
      }

      function bindRemoteCameraTrack(participantId, stream, track) {
        const id = String(participantId || '').trim();
        if (!id || !stream || !track) return;
        cancelRemoteCameraClear(id);
        const mediaStream = new MediaStream();
        mediaStream.addTrack(track);
        const peer = state.peers.get(id);
        if (peer) {
          peer.remoteCameraStream = mediaStream;
          peer.remoteCameraTrack = track;
        }
        const person = state.participants.get(id);
        if (person) {
          person.cameraSharing = true;
        }
        state.remoteCameras.set(id, {
          id,
          stream: mediaStream,
          track,
          updatedAt: Date.now()
        });
        track.addEventListener('mute', () => {
          scheduleRemoteCameraClear(id, 180);
        });
        track.addEventListener('unmute', () => {
          cancelRemoteCameraClear(id);
          const person = state.participants.get(id);
          if (person && !person.cameraSharing) {
            person.cameraSharing = true;
            renderParticipants(true);
          }
        });
        track.addEventListener('ended', () => {
          clearRemoteCamera(id);
        }, { once: true });
        stream.addEventListener('removetrack', (event) => {
          if (!event || event.track !== track) return;
          clearRemoteCamera(id);
        });
        renderParticipants(true);
        renderScreenStage(true);
      }

      function cancelRemoteScreenClear(participantId) {
        const id = String(participantId || '').trim();
        if (!id || !state.remoteScreenClearTimers) return;
        const timer = state.remoteScreenClearTimers.get(id);
        if (!timer) return;
        clearTimeout(timer);
        state.remoteScreenClearTimers.delete(id);
      }

      function scheduleRemoteScreenClear(participantId, delayMs = 1800) {
        const id = String(participantId || '').trim();
        if (!id) return;
        cancelRemoteScreenClear(id);
        const hasRemoteScreen = state.remoteScreens.has(id);
        if (!hasRemoteScreen) return;
        const timer = window.setTimeout(() => {
          state.remoteScreenClearTimers.delete(id);
          const person = state.participants.get(id);
          if (person && person.screenSharing) return;
          clearRemoteScreen(id);
        }, Math.max(300, Number(delayMs) || 0));
        state.remoteScreenClearTimers.set(id, timer);
      }

      function cancelRemoteCameraClear(participantId) {
        const id = String(participantId || '').trim();
        if (!id || !state.remoteCameraClearTimers) return;
        const timer = state.remoteCameraClearTimers.get(id);
        if (!timer) return;
        clearTimeout(timer);
        state.remoteCameraClearTimers.delete(id);
      }

      function scheduleRemoteCameraClear(participantId, delayMs = 1200) {
        const id = String(participantId || '').trim();
        if (!id) return;
        cancelRemoteCameraClear(id);
        if (!state.remoteCameras.has(id)) return;
        const person = state.participants.get(id);
        let needsRender = false;
        if (person && person.cameraSharing) {
          person.cameraSharing = false;
          needsRender = true;
        }
        if (state.activeCameraStageOwnerId === id) {
          state.activeCameraStageOwnerId = '';
          needsRender = true;
        }
        if (needsRender) {
          renderParticipants(true);
          renderScreenStage(true);
        }
        const timer = window.setTimeout(() => {
          state.remoteCameraClearTimers.delete(id);
          const latestPerson = state.participants.get(id);
          if (latestPerson && latestPerson.cameraSharing) return;
          clearRemoteCamera(id);
        }, Math.max(300, Number(delayMs) || 0));
        state.remoteCameraClearTimers.set(id, timer);
      }

      function clearParticipantCameraElement(participantId) {
        if (!dom.participantsGrid) return;
        const id = String(participantId || '').trim();
        if (!id) return;
        const video = dom.participantsGrid.querySelector(`.participant-video[data-camera-participant-id="${escapeHtml(id)}"]`);
        if (!video) return;
        try {
          video.pause();
        } catch (_) {}
        try {
          video.srcObject = null;
        } catch (_) {}
        try {
          video.removeAttribute('src');
          video.load();
        } catch (_) {}
      }

      function clearRemoteScreen(participantId) {
        const id = String(participantId || '').trim();
        if (!id) return;
        cancelRemoteScreenClear(id);
        const entry = state.remoteScreens.get(id);
        const peer = state.peers.get(id);
        if (peer) {
          peer.remoteScreenStream = null;
          peer.remoteScreenTrack = null;
        }
        const person = state.participants.get(id);
        if (person) {
          person.screenSharing = false;
        }
        if (!entry) return;
        state.remoteScreens.delete(id);
        if (state.activeScreenOwnerId === id) {
          state.activeScreenOwnerId = '';
        }
        updateShareButton();
        renderScreenStage(true);
      }

      function clearRemoteCamera(participantId) {
        const id = String(participantId || '').trim();
        if (!id) return;
        cancelRemoteCameraClear(id);
        clearParticipantCameraElement(id);
        const entry = state.remoteCameras.get(id);
        const peer = state.peers.get(id);
        if (peer) {
          peer.remoteCameraStream = null;
          peer.remoteCameraTrack = null;
        }
        const person = state.participants.get(id);
        if (person) {
          person.cameraSharing = false;
        }
        if (!entry) return;
        state.remoteCameras.delete(id);
        if (state.activeCameraStageOwnerId === id) {
          state.activeCameraStageOwnerId = '';
        }
        renderParticipants(true);
        renderScreenStage(true);
      }

      function getActiveScreenSource() {
        if (state.screenSharing && state.screenTrack && state.screenStream) {
          return {
            ownerId: state.self.id,
            ownerName: state.self.name,
            quality: state.screenQuality,
            type: 'screen',
            local: true,
            stream: state.screenStream
          };
        }
        if (state.activeScreenOwnerId && state.remoteScreens.has(state.activeScreenOwnerId)) {
          const entry = state.remoteScreens.get(state.activeScreenOwnerId);
          const person = state.participants.get(state.activeScreenOwnerId);
          if (entry) {
            return {
              ownerId: state.activeScreenOwnerId,
              ownerName: (person && person.name) || 'Участник',
              quality: (person && person.screenQuality) || 'high',
              type: 'screen',
              local: false,
              stream: entry.stream
            };
          }
        }
        for (const [id, entry] of state.remoteScreens.entries()) {
          const person = state.participants.get(id);
          if (!entry) continue;
          state.activeScreenOwnerId = id;
          return {
            ownerId: id,
            ownerName: (person && person.name) || 'Участник',
            quality: (person && person.screenQuality) || 'high',
            type: 'screen',
            local: false,
            stream: entry.stream
          };
        }
        if (state.activeCameraStageOwnerId) {
          if (state.activeCameraStageOwnerId === state.self.id && state.cameraSharing && state.cameraStream) {
            return {
              ownerId: state.self.id,
              ownerName: state.self.name,
              quality: state.connectionQuality,
              type: 'camera',
              local: true,
              stream: state.cameraStream
            };
          }
          const cameraEntry = state.remoteCameras.get(state.activeCameraStageOwnerId);
          const person = state.participants.get(state.activeCameraStageOwnerId);
          if (cameraEntry) {
            return {
              ownerId: state.activeCameraStageOwnerId,
              ownerName: (person && person.name) || 'Участник',
              quality: (person && person.quality) || 'good',
              type: 'camera',
              local: false,
              stream: cameraEntry.stream
            };
          }
          state.activeCameraStageOwnerId = '';
        }
        return null;
      }

      function getRemoteActiveScreenOwnerId() {
        for (const [id, person] of state.participants.entries()) {
          if (!id || id === state.self.id || !person || !person.screenSharing) continue;
          return id;
        }
        return '';
      }

      function showScreenStageTools(idleMs = 0) {
        state.screenToolsVisible = true;
        if (state.screenToolsIdleTimer) {
          clearTimeout(state.screenToolsIdleTimer);
          state.screenToolsIdleTimer = null;
        }
        syncScreenStageTools();
        const timeout = Math.max(0, Number(idleMs) || 0);
        if (!timeout) return;
        state.screenToolsIdleTimer = window.setTimeout(() => {
          state.screenToolsIdleTimer = null;
          if (dom.screenStage && dom.screenStage.matches(':hover')) {
            state.screenToolsVisible = false;
            syncScreenStageTools();
            return;
          }
          hideScreenStageTools();
        }, timeout);
      }

      function hideScreenStageTools(delayMs = 0) {
        if (state.screenToolsIdleTimer) {
          clearTimeout(state.screenToolsIdleTimer);
          state.screenToolsIdleTimer = null;
        }
        const finish = () => {
          state.screenToolsVisible = false;
          syncScreenStageTools();
        };
        if (delayMs > 0) {
          state.screenToolsIdleTimer = window.setTimeout(() => {
            state.screenToolsIdleTimer = null;
            finish();
          }, delayMs);
          return;
        }
        finish();
      }

      async function toggleScreenStageFullscreen() {
        const shell = dom.screenStage ? dom.screenStage.querySelector('.screen-video-shell') : null;
        if (!shell) return;
        if (document.fullscreenElement === shell) {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          }
          syncScreenStageTools();
          return;
        }
        if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen().catch(() => {});
        }
        if (shell.requestFullscreen) {
          await shell.requestFullscreen();
          syncScreenStageTools();
        }
      }

      function syncScreenStageTools() {
        if (!dom.screenStage) return;
        const shell = dom.screenStage.querySelector('.screen-video-shell');
        if (shell) {
          shell.setAttribute('data-tools-visible', state.screenToolsVisible ? '1' : '0');
        }
        const collapsed = !!state.participantsCollapsed;
        const participantsBtn = dom.screenStage.querySelector('.screen-stage-tool[data-role="participants"]');
        if (participantsBtn) {
          const title = collapsed ? 'Показать список участников' : 'Свернуть список участников';
          participantsBtn.setAttribute('data-collapsed', collapsed ? '1' : '0');
          participantsBtn.setAttribute('aria-label', title);
          participantsBtn.setAttribute('title', title);
        }
        const fullscreenBtn = dom.screenStage.querySelector('.screen-stage-tool[data-role="fullscreen"]');
        if (fullscreenBtn) {
          const active = !!(document.fullscreenElement && dom.screenStage.contains(document.fullscreenElement));
          const title = active ? 'Выйти из полноэкранного режима' : 'Развернуть экран на весь экран';
          fullscreenBtn.setAttribute('aria-label', title);
          fullscreenBtn.setAttribute('title', title);
        }
        const closeBtn = dom.screenStage.querySelector('.screen-stage-tool[data-role="close-stage"]');
        if (closeBtn) {
          closeBtn.setAttribute('aria-label', 'Закрыть расширенный просмотр');
          closeBtn.setAttribute('title', 'Закрыть расширенный просмотр');
        }
      }

      function syncScreenStagePlayback() {
        if (!dom.screenStage) return;
        const source = getActiveScreenSource();
        const video = dom.screenStage.querySelector('#screenStageVideo');
        if (!video || !source) return;
        if (document.hidden) {
          try { video.pause(); } catch (_) {}
          return;
        }
        const playPromise = video.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {});
        }
      }

      function getScreenStageSourceKey(source) {
        if (!source) return '';
        return `${String(source.ownerId || '')}:${String(source.type || 'media')}:${source.local ? 'local' : 'remote'}`;
      }

      function renderScreenStage(force = false) {
        if (!dom.screenStage || !dom.screenStagePanel) return;
        const source = getActiveScreenSource();
        const sharingActive = !!source;
        const sourceKey = getScreenStageSourceKey(source);
        dom.appShell.classList.toggle('sharing-active', sharingActive);
        dom.screenStagePanel.setAttribute('aria-hidden', sharingActive ? 'false' : 'true');
        if (!sharingActive) {
          hideScreenStageTools();
        }
        const shouldRebuild = force
          || sourceKey !== state.activeScreenSourceKey
          || (sharingActive && !dom.screenStage.querySelector('#screenStageVideo'))
          || (!sharingActive && !dom.screenStage.querySelector('.screen-stage-empty'));

        if (shouldRebuild) {
          const markup = source ? `
            <div class="screen-stage-live">
              <div class="screen-video-shell">
                <div class="screen-stage-tools">
                  <button class="screen-stage-tool" type="button" data-role="participants"></button>
                  <button class="screen-stage-tool" type="button" data-role="fullscreen"></button>
                  ${source.type === 'camera' ? '<button class="screen-stage-tool" type="button" data-role="close-stage"></button>' : ''}
                </div>
                <video id="screenStageVideo" class="screen-video" autoplay playsinline muted></video>
              </div>
            </div>
          ` : `
            <div class="screen-stage-empty">
              <div class="screen-empty-card">
                <div class="screen-empty-icon" aria-hidden="true"></div>
                <h3 class="screen-empty-title">Экран можно вывести сюда без отдельной вкладки</h3>
                <p class="screen-empty-text">Запустите шеринг кнопкой на нижней панели. У других участников экран появится здесь же, а карточки участников плавно уйдут вправо.</p>
              </div>
            </div>
          `;
          state.activeScreenRenderHash = source ? 'live' : 'empty';
          state.activeScreenSourceKey = sourceKey;
          dom.screenStage.innerHTML = markup;
        } else {
          state.activeScreenSourceKey = sourceKey;
        }

        syncScreenStageTools();

        if (!source) return;

        const video = dom.screenStage.querySelector('#screenStageVideo');
        if (!video) return;
        if (video.srcObject !== source.stream) {
          video.srcObject = source.stream;
        }
        video.disablePictureInPicture = true;
        video.controls = false;
        video.muted = true;
        video.style.objectFit = source.type === 'camera' ? 'contain' : 'contain';
        video.style.transform = source.type === 'camera' && source.local ? 'scaleX(-1)' : '';
        syncScreenStagePlayback();
      }

      function renderParticipants(force = false) {
        const now = Date.now();
        const activeStageSource = getActiveScreenSource();
        const hiddenExpandedParticipantId = activeStageSource && activeStageSource.type === 'camera'
          ? String(activeStageSource.ownerId || '')
          : '';

        const cards = [];
        if (state.joined && hiddenExpandedParticipantId !== state.self.id) {
          cards.push(buildSelfCard(now));
        }

        const remote = Array.from(state.participants.values())
          .filter((person) => person && person.id !== hiddenExpandedParticipantId)
          .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ru', { sensitivity: 'base' }));

        if (state.activeVolumePanelId) {
          const hasActive = remote.some((person) => person && person.id === state.activeVolumePanelId);
          if (!hasActive) state.activeVolumePanelId = '';
        }

        for (let i = 0; i < remote.length; i += 1) {
          cards.push(buildRemoteCard(remote[i], now));
        }

        const connectedPeers = Array.from(state.peers.values()).filter((peer) => peer && peer.pc && peer.pc.connectionState === 'connected').length;
        state.connectedPeerCount = connectedPeers;
        updateLocalChips();
        const badgeText = `👥 ${remote.length + (state.joined ? 1 : 0)}`;
        if (dom.participantsBadge.textContent !== badgeText) {
          dom.participantsBadge.textContent = badgeText;
        }

        const markup = cards.join('');
        if (markup === state.participantsRenderHash) {
          syncParticipantMediaCards();
          updateParticipantVoiceVisuals();
          renderScreenStage(false);
          return;
        }
        state.participantsRenderHash = markup;
        dom.participantsGrid.innerHTML = markup;
        syncParticipantMediaCards();
        updateParticipantVoiceVisuals();
        renderScreenStage(false);
      }

      function buildSelfCard(now) {
        const mediaMarkup = state.cameraSharing
          ? renderParticipantCameraMarkup(state.self.id, true)
          : renderParticipantAvatar(state.self.name, state.self.color, state.self.avatarUrl);
        const statusBadges = renderParticipantStatusBadges({
          micEnabled: state.masterMicEnabled,
          screenSharing: state.screenSharing
        });

        return `
          <article class="participant-card self ${state.cameraSharing ? 'has-camera' : ''}" data-participant-id="${escapeHtml(state.self.id)}">
            ${statusBadges}
            <div class="participant-main ${state.cameraSharing ? 'has-video' : ''}">
              ${mediaMarkup}
              <div class="participant-name">${escapeHtml(state.self.name)}</div>
            </div>
          </article>
        `;
      }

      function buildRemoteCard(person, now) {
        const hasCamera = person.cameraSharing === true;
        const mediaMarkup = hasCamera
          ? renderParticipantCameraMarkup(person.id, false)
          : renderParticipantAvatar(person.name, person.color, person.avatarUrl);
        const statusBadges = renderParticipantStatusBadges({
          micEnabled: person.micEnabled !== false,
          screenSharing: person.screenSharing === true
        });
        const volume = getParticipantVolume(person.id, person);
        const volumePercent = Math.round(volume * 100);
        const volumeOpen = state.activeVolumePanelId === person.id;
        const volumeControl = `
          <div class="participant-volume-control ${volumeOpen ? 'open' : ''}" data-participant-id="${escapeHtml(person.id)}">
            <button class="participant-volume-btn" type="button" data-participant-id="${escapeHtml(person.id)}" aria-label="Громкость ${escapeHtml(person.name)}" title="Громкость"></button>
            <div class="participant-volume-pop">
              <input class="participant-volume-slider" type="range" min="0" max="200" step="1" value="${volumePercent}" data-participant-id="${escapeHtml(person.id)}" aria-label="Громкость ${escapeHtml(person.name)}" />
              <span class="participant-volume-value" data-participant-id="${escapeHtml(person.id)}">${volumePercent}%</span>
            </div>
          </div>
        `;

        return `
          <article class="participant-card ${hasCamera ? 'has-camera' : ''}" data-participant-id="${escapeHtml(person.id)}">
            ${volumeControl}
            ${statusBadges}
            <div class="participant-main ${hasCamera ? 'has-video' : ''}">
              ${mediaMarkup}
              <div class="participant-name">${escapeHtml(person.name)}</div>
            </div>
          </article>
        `;
      }

      function voiceEnergyFromLevel(level) {
        return clamp(Number(level || 0) / 0.055, 0, 1);
      }

      function setCardVoiceVisual(card, voice, bass, mid, treble, speaking) {
        if (!card) return;
        const v = clamp(Number(voice || 0), 0, 1);
        const b = clamp(Number(bass || v), 0, 1);
        const m = clamp(Number(mid || v), 0, 1);
        const t = clamp(Number(treble || v), 0, 1);
        card.style.setProperty('--voice', v.toFixed(3));
        card.style.setProperty('--bass', b.toFixed(3));
        card.style.setProperty('--mid', m.toFixed(3));
        card.style.setProperty('--treble', t.toFixed(3));
        card.classList.toggle('speaking', !!speaking);
      }

      function updateParticipantVoiceVisuals() {
        if (!dom.participantsGrid) return;
        const cards = dom.participantsGrid.querySelectorAll('.participant-card[data-participant-id]');
        if (!cards || !cards.length) return;
        const now = Date.now();
        for (let i = 0; i < cards.length; i += 1) {
          const card = cards[i];
          const id = String(card.dataset.participantId || '');
          if (!id) continue;
          if (id === state.self.id) {
            const voice = state.masterMicEnabled ? voiceEnergyFromLevel(state.vadLevel) : 0;
            const speaking = shouldAnimateVoiceAura({
              voice,
              speakingFlag: state.transmitting,
              micEnabled: state.masterMicEnabled
            });
            setCardVoiceVisual(
              card,
              speaking ? voice : 0,
              speaking ? state.localBandBass : 0,
              speaking ? state.localBandMid : 0,
              speaking ? state.localBandTreble : 0,
              speaking
            );
            continue;
          }
          const person = state.participants.get(id);
          if (!person) {
            setCardVoiceVisual(card, 0, 0, 0, 0, false);
            continue;
          }
          const speaking = Number(person.speakingUntil || 0) > now;
          const aura = shouldAnimateVoiceAura({
            voice: voiceEnergyFromLevel(person.level),
            speakingFlag: speaking,
            micEnabled: person.micEnabled !== false
          });
          setCardVoiceVisual(
            card,
            aura ? voiceEnergyFromLevel(person.level) : 0,
            person.bandBass,
            person.bandMid,
            person.bandTreble,
            aura
          );
        }
      }

      function shouldAnimateVoiceAura(options = {}) {
        const voice = clamp(Number(options.voice || 0), 0, 1);
        const speakingFlag = !!options.speakingFlag;
        const micEnabled = options.micEnabled !== false;
        if (!micEnabled) return false;
        return voice >= VOICE_VISUAL_THRESHOLD || (speakingFlag && voice >= VOICE_VISUAL_THRESHOLD * 0.72);
      }

      function renderParticipantAvatar(name, color, avatarUrl) {
        const safeUrl = normalizeAvatarUrl(avatarUrl);
        const initial = escapeHtml(firstLetterFor(name));
        if (safeUrl) {
          return `<div class="avatar-wrap"><div class="avatar has-image" style="background:${escapeHtml(color)};" data-fallback="${initial}"><img src="${escapeHtml(safeUrl)}" alt="${escapeHtml(name || 'Аватар')}" loading="lazy" decoding="async" onerror="var p=this.parentElement;if(p){p.classList.remove('has-image');p.textContent=p.dataset.fallback||'';}this.remove();" /></div></div>`;
        }
        return `<div class="avatar-wrap"><div class="avatar" style="background:${escapeHtml(color)};">${initial}</div></div>`;
      }

      function renderParticipantCameraMarkup(participantId, isLocal) {
        return `
          <div class="participant-video-shell ${isLocal ? 'local' : ''}">
            <video class="participant-video" data-camera-participant-id="${escapeHtml(participantId)}" autoplay playsinline muted></video>
            <button class="participant-video-expand" type="button" data-participant-id="${escapeHtml(participantId)}" aria-label="Развернуть видео" title="Развернуть видео"></button>
          </div>
        `;

      function renderMicOffBadge() {
        return '<span class="participant-mic-state" aria-label="Микрофон выключен" title="Микрофон выключен"></span>';

      }

      function renderParticipantStatusBadges(options = {}) {
        const parts = [];
        if (options.screenSharing) parts.push(renderScreenShareBadge());

      function syncParticipantMediaCards() {
        if (!dom.participantsGrid) return;
        const videos = dom.participantsGrid.querySelectorAll('.participant-video[data-camera-participant-id]');
        for (let i = 0; i < videos.length; i += 1) {
          const video = videos[i];
          const participantId = String(video.getAttribute('data-camera-participant-id') || '').trim();
          if (!participantId) continue;
          let stream = null;
          if (participantId === state.self.id) {
            stream = state.cameraStream;
          } else {
            const entry = state.remoteCameras.get(participantId);
            stream = entry ? entry.stream : null;
          }
          if (!stream) {
            if (video.srcObject) video.srcObject = null;
            continue;
          }
          if (video.srcObject !== stream) {
            video.srcObject = stream;
          }
          video.muted = true;
          const playPromise = video.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
          }
        }
      }

      function buildParticipantVolumeKeys(participantId, participant) {
        const keys = [];
        const person = participant || {};
        const username = normalizeUsername(person.username || '');
        const name = normalizeName(person.name || '');
        const id = String(participantId || '').trim();

        if (username) keys.push(`u:${username}`);
        if (name && name !== 'Гость') keys.push(`n:${name.toLowerCase()}`);
        if (id) keys.push(`id:${id}`);
        if (!keys.length) keys.push('id:unknown');
        return keys;
      }

      function getParticipantVolume(participantId, participant) {
        const keys = buildParticipantVolumeKeys(participantId, participant);
        const map = state.participantVolumes && typeof state.participantVolumes === 'object'
          ? state.participantVolumes
          : {};
        for (let i = 0; i < keys.length; i += 1) {
          const key = keys[i];
          if (!Object.prototype.hasOwnProperty.call(map, key)) continue;
          const value = clamp(Number(map[key]), 0, 2);
          if (Number.isFinite(value)) return value;
        }
        return 0.5;
      }

      function applyPeerAudioVolume(participantId) {
        const id = String(participantId || '').trim();
        if (!id) return;
        const peer = state.peers.get(id);
        if (!peer || !peer.audio) return;
        const person = state.participants.get(id);
        const volume = clamp(getParticipantVolume(id, person), 0, 2);
        try {
          if (volume <= 1) {
            peer.audio.muted = false;
            peer.audio.volume = clamp(volume, 0, 1);
            if (peer.remoteGainNode) {
              const now = state.remoteAudioContext ? state.remoteAudioContext.currentTime : 0;
              try {
                peer.remoteGainNode.gain.cancelScheduledValues(now);
                peer.remoteGainNode.gain.setTargetAtTime(0, now, 0.02);
              } catch (_) {
                peer.remoteGainNode.gain.value = 0;
              }
            }
          } else {
            const remoteCtx = ensureRemoteAudioContext();
            if (!peer.remoteGainNode && peer.rawRemoteStream) {
              setupRemoteAnalyser(peer, peer.rawRemoteStream);
            }
            const ready = !!(remoteCtx && remoteCtx.state === 'running');
            if (peer.remoteGainNode && ready) {
              const now = remoteCtx ? remoteCtx.currentTime : 0;
              try {
                peer.remoteGainNode.gain.cancelScheduledValues(now);
                peer.remoteGainNode.gain.setTargetAtTime(volume, now, 0.028);
              } catch (_) {
                peer.remoteGainNode.gain.value = volume;
              }
              peer.audio.muted = true;
            } else {
              if (peer.remoteGainNode) {
                peer.remoteGainNode.gain.value = 0;
              }
              peer.audio.muted = false;
              peer.audio.volume = 1;
            }
          }
        } catch (_) {}
      }

      function setParticipantVolume(participantId, participant, nextVolume) {
        const id = String(participantId || '').trim();
        if (!id) return;
        const keys = buildParticipantVolumeKeys(id, participant);
        const primary = keys[0];
        const sessionKey = `id:${id}`;
        const volume = clamp(Number(nextVolume), 0, 2);
        if (!state.participantVolumes || typeof state.participantVolumes !== 'object') {
          state.participantVolumes = {};
        }
        state.participantVolumes[primary] = Number(volume.toFixed(3));
        state.participantVolumes[sessionKey] = Number(volume.toFixed(3));
        saveStorage('callParticipantVolumes', JSON.stringify(state.participantVolumes));

        applyPeerAudioVolume(id);

        if (dom.participantsGrid) {
          const valueText = `${Math.round(volume * 100)}%`;
          const labels = dom.participantsGrid.querySelectorAll('.participant-volume-value[data-participant-id]');
          for (let i = 0; i < labels.length; i += 1) {
            if (String(labels[i].dataset.participantId || '') !== id) continue;
            labels[i].textContent = valueText;
          }
        }
      }

      function startStatsLoop() {
        stopStatsLoop();
        state.statsTimer = window.setInterval(() => {
          collectPeerStats().catch(() => {});
        }, 2400);
      }

      function stopStatsLoop() {
        if (!state.statsTimer) return;
        clearInterval(state.statsTimer);
        state.statsTimer = null;
      }

      async function collectPeerStats() {
        let totalUplink = 0;
        let changed = false;

        for (const [id, peer] of state.peers.entries()) {
          if (!peer || !peer.pc || peer.pc.connectionState === 'closed') continue;

          try {
            const report = await peer.pc.getStats();
            let packetsReceived = 0;
            let packetsLost = 0;
            let rttMs = 0;
            let outboundBytes = peer.prevOutboundBytes || 0;
            let outboundTs = peer.prevOutboundTs || 0;

            report.forEach((item) => {
              if (item.type === 'candidate-pair' && item.state === 'succeeded' && item.nominated && Number.isFinite(item.currentRoundTripTime)) {
                rttMs = item.currentRoundTripTime * 1000;
              }

              if (item.type === 'inbound-rtp' && item.kind === 'audio' && !item.isRemote) {
                packetsReceived = Number(item.packetsReceived || 0);
                packetsLost = Number(item.packetsLost || 0);
              }

              if (item.type === 'outbound-rtp' && item.kind === 'audio' && !item.isRemote) {
                const bytes = Number(item.bytesSent || 0);
                const ts = Number(item.timestamp || 0);
                if (bytes > 0 && ts > 0) {
                  if (peer.prevOutboundTs > 0 && ts > peer.prevOutboundTs && bytes >= peer.prevOutboundBytes) {
                    const kbps = ((bytes - peer.prevOutboundBytes) * 8) / ((ts - peer.prevOutboundTs) / 1000) / 1000;
                    peer.outKbps = Math.max(0, kbps);
                  }
                  outboundBytes = bytes;
                  outboundTs = ts;
                }
              }
            });

            peer.prevOutboundBytes = outboundBytes;
            peer.prevOutboundTs = outboundTs;
            const prevRtt = Number(peer.rttMs || 0);
            peer.rttMs = rttMs;

            const totalPackets = packetsReceived + packetsLost;
            const lossPct = totalPackets > 0 ? (packetsLost * 100) / totalPackets : 0;
            const prevLoss = Number(peer.lossPct || 0);
            peer.lossPct = lossPct;

            const prevQuality = peer.quality;
            if (peer.pc.connectionState !== 'connected') {
              peer.quality = 'fair';
            } else if (rttMs > 280 || lossPct > 7) {
              peer.quality = 'poor';
            } else if (rttMs > 160 || lossPct > 3) {
              peer.quality = 'fair';
            } else {
              peer.quality = 'good';
            }

            const person = state.participants.get(id);
            if (person) {
              person.quality = peer.quality;
              person.rttMs = peer.rttMs;
              person.lossPct = peer.lossPct;
            }

            if (Math.abs(peer.rttMs - prevRtt) > 18 || Math.abs(peer.lossPct - prevLoss) > 0.45 || prevQuality !== peer.quality) {
              changed = true;
            }

            totalUplink += Number.isFinite(peer.outKbps) ? peer.outKbps : 0;
          } catch (_) {
          }
        }

        const roundedPrevTx = Math.round(state.uplinkKbps || 0);
        state.uplinkKbps = Math.max(0, totalUplink);
        const roundedTx = Math.round(state.uplinkKbps);
        if (roundedTx !== roundedPrevTx) {
          dom.trafficBadge.textContent = `TX ${roundedTx} kbps`;
        }
        if (changed) renderParticipants(true);
      }

      async function refreshDevices() {
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.enumerateDevices !== 'function') {
          throw new Error('enumerateDevices unavailable');
        }

        const devices = await navigator.mediaDevices.enumerateDevices();
        const inputs = devices.filter((device) => device.kind === 'audioinput');
        const outputs = devices.filter((device) => device.kind === 'audiooutput');

        populateDeviceSelect(dom.inputSelect, inputs, state.selectedInputId, 'Микрофон по умолчанию');
        populateDeviceSelect(dom.outputSelect, outputs, state.selectedOutputId, 'Системный вывод');

        if (!supportsSinkId()) {
          dom.outputSelect.disabled = true;
          dom.outputSelect.title = 'Этот браузер не поддерживает выбор выходного устройства';
        } else {
          dom.outputSelect.disabled = false;
          dom.outputSelect.title = '';
        }

        if (state.selectedInputId && !inputs.some((item) => item.deviceId === state.selectedInputId)) {
          state.selectedInputId = '';
          saveStorage('callInputDeviceId', '');
          dom.inputSelect.value = '';
        }

        if (state.selectedOutputId && !outputs.some((item) => item.deviceId === state.selectedOutputId)) {
          state.selectedOutputId = '';
          saveStorage('callOutputDeviceId', '');
          dom.outputSelect.value = '';
        }
        syncCustomSelect(dom.inputSelect);
        syncCustomSelect(dom.outputSelect);
      }

      function populateDeviceSelect(selectEl, devices, selectedId, fallbackLabel) {
        if (!selectEl) return;
        const current = String(selectedId || '');
        const options = [];

        options.push('<option value="">' + escapeHtml(fallbackLabel) + '</option>');
        for (let i = 0; i < devices.length; i += 1) {
          const device = devices[i];
          const label = device.label || `${device.kind === 'audioinput' ? 'Микрофон' : 'Вывод'} ${i + 1}`;
          options.push(`<option value="${escapeHtml(device.deviceId)}">${escapeHtml(label)}</option>`);
        }

        selectEl.innerHTML = options.join('');
        selectEl.value = current;
        syncCustomSelect(selectEl);
      }

      function supportsSinkId() {
        return typeof HTMLMediaElement !== 'undefined'
          && HTMLMediaElement
          && typeof HTMLMediaElement.prototype.setSinkId === 'function';
      }

      async function applyOutputDevice(audioEl) {
        if (!audioEl || !state.selectedOutputId) return;
        if (!supportsSinkId()) return;
        await audioEl.setSinkId(state.selectedOutputId);
      }

      async function applyOutputDeviceToAll() {
        if (!state.selectedOutputId) return;
        if (!supportsSinkId()) throw new Error('sink id unsupported');
        const tasks = [];
        for (const [, peer] of state.peers.entries()) {
          if (!peer || !peer.audio) continue;
          tasks.push(peer.audio.setSinkId(state.selectedOutputId));
        }
        await Promise.allSettled(tasks);
      }

      function shutdownAll(silent = false) {
        state.joined = false;
        stopCameraShare();
        stopScreenShare();
        closeControlPip(true);
        stopPresenceLoop();
        stopPruneLoop();
        stopStatsLoop();
        stopTalkingHeartbeat();
        clearReconnectTimer();

        if (!silent) {
          sendPacket({ type: 'leave' });
        } else {
          try {
            if (state.ws && state.ws.readyState === WS_OPEN) {
              state.ws.send(JSON.stringify({ type: 'leave' }));
            }
          } catch (_) {}
        }

        closeSocket();
        closeAllPeers();
        stopLocalAudio();
        stopVadLoop();
      }

      function showToast(text) {
        if (!dom.toast) return;
        if (state.toastTimer) {
          clearTimeout(state.toastTimer);
          state.toastTimer = null;
        }

      function getCurrentUserObject() {
        try {
          return JSON.parse(localStorage.getItem('currentUser') || 'null');
        } catch (_) {
          return null;
        }
      }

      function getCurrentUserName() {
        try {
          const query = new URLSearchParams(window.location.search);
          const fromQuery = String(query.get('name') || '').trim();
          if (fromQuery) return normalizeName(fromQuery);
        } catch (_) {}
        const currentUser = getCurrentUserObject();
        const name = currentUser && currentUser.name ? String(currentUser.name).trim() : '';
        if (name) return normalizeName(name);
        return normalizeName(`Гость ${Math.random().toString(36).slice(2, 6)}`);
      }

      function getCurrentUserUsername() {
        try {
          const query = new URLSearchParams(window.location.search);
          const fromQuery = query.get('username') || query.get('login') || query.get('user');
          const normalizedQuery = normalizeUsername(fromQuery);
          if (normalizedQuery) return normalizedQuery;
        } catch (_) {}
        const currentUser = getCurrentUserObject();
        if (!currentUser) return '';
        return normalizeUsername(currentUser.username || currentUser.login || currentUser.user || '');
      }

      function getCurrentUserAvatarUrl() {
        try {
          const query = new URLSearchParams(window.location.search);
          const queryAvatar = normalizeAvatarUrl(query.get('avatarUrl') || query.get('avatar') || '');
          if (queryAvatar) return queryAvatar;
        } catch (_) {}

        const currentUser = getCurrentUserObject();
        if (!currentUser) return '';
        return normalizeAvatarUrl(
          currentUser.avatarUrl
          || currentUser.photoURL
          || currentUser.photoUrl
          || currentUser.avatar
          || ''
        );
      }

      function normalizeName(value) {
        const text = String(value || '').trim();
        if (!text) return 'Гость';
        return text.slice(0, 32);
      }

      function encodeTransportName(name, username) {
        const safeName = normalizeName(name);
        const safeUsername = normalizeUsername(username);
        if (!safeUsername) return safeName;
        return `@${safeUsername}|${safeName}`;
      }

      function parseTransportIdentity(rawName, rawUsername) {
        const explicitUsername = normalizeUsername(rawUsername);
        const text = String(rawName || '').trim();
        const bundled = /^@([a-z0-9._-]{1,80})\|([\s\S]*)$/i.exec(text);
        if (bundled) {
          const bundledUsername = normalizeUsername(bundled[1]);
          const bundledName = normalizeName(bundled[2] || bundled[1]);
          return {
            name: bundledName,
            username: explicitUsername || bundledUsername
          };
        }

        return {
          name: normalizeName(text),
          username: explicitUsername
        };
      }

      function normalizeUsername(value) {
        const text = String(value || '').trim().toLowerCase();
        if (!text) return '';
        return text.slice(0, 80);
      }

      function normalizeColor(value) {
        const text = String(value || '').trim();
        if (!text) return '#f59e0b';
        if (/^#[0-9a-fA-F]{3,8}$/.test(text)) return text;
        if (/^hsl\(/i.test(text) || /^rgb\(/i.test(text)) return text.slice(0, 40);
        return '#f59e0b';
      }

      function coerceMicEnabled(value, fallback = true) {
        if (typeof value === 'boolean') return value;
        if (typeof value === 'number') return value !== 0;
        const text = String(value || '').trim().toLowerCase();
        if (!text) return Boolean(fallback);
        if (text === '0' || text === 'false' || text === 'off' || text === 'no') return false;
        if (text === '1' || text === 'true' || text === 'on' || text === 'yes') return true;
        return Boolean(fallback);
      }

      function coerceMediaFlag(payload, key, fallback = false) {
        if (!payload || typeof payload !== 'object' || !Object.prototype.hasOwnProperty.call(payload, key)) {
          return Boolean(fallback);
        }
        const value = payload[key];
        if (typeof value === 'boolean') return value;
        if (typeof value === 'number') return value !== 0;
        const text = String(value || '').trim().toLowerCase();
        if (!text) return Boolean(fallback);
        if (text === '0' || text === 'false' || text === 'off' || text === 'no') return false;
        if (text === '1' || text === 'true' || text === 'on' || text === 'yes') return true;
        return Boolean(fallback);
      }

      function normalizeAvatarUrl(value) {
        const text = String(value || '').trim();
        if (!text) return '';
        if (text.length > 2000000) return '';
        if (/^data:image\/[a-z0-9.+-]+;base64,/i.test(text)) return text;
        if (/^blob:/i.test(text)) return text;
        try {
          const url = new URL(text, window.location.href);
          if (url.protocol === 'http:' || url.protocol === 'https:') {
            return url.href;
          }
        } catch (_) {
          return '';
        }
        return '';
      }

      function getShareableAvatarUrl(value) {
        const normalized = normalizeAvatarUrl(value);
        if (!normalized) return '';
        if (/^blob:/i.test(normalized)) return '';
        if (/^data:image\/[a-z0-9.+-]+;base64,/i.test(normalized) && normalized.length > 360000) return '';
        return normalized;
      }

      function colorForName(name) {
        const str = String(name || 'guest');
        let hash = 0;
        for (let i = 0; i < str.length; i += 1) {
          hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
        }
        const hue = Math.abs(hash) % 360;
        return `hsl(${hue}, 80%, 56%)`;
      }

      function initialsFor(name) {
        const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return 'Г';
        if (parts.length === 1) return parts[0].slice(0, 1).toUpperCase();
        return `${parts[0].slice(0, 1)}${parts[1].slice(0, 1)}`.toUpperCase();
      }

      function firstLetterFor(name) {
        const text = String(name || '').trim();
        return text ? text.slice(0, 1).toUpperCase() : 'Г';
      }

      function isTypingTarget(target) {
        if (!target || !(target instanceof HTMLElement)) return false;
        const tag = String(target.tagName || '').toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || !!target.isContentEditable;
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function clamp(value, min, max) {
        const num = Number(value);
        if (!Number.isFinite(num)) return min;
        if (num < min) return min;
        if (num > max) return max;
        return num;
      }

      function createClientId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 10)}`;
      }

      function loadStorage(key, fallback = '') {
        try {
          const value = localStorage.getItem(key);
          return value == null ? fallback : value;
        } catch (_) {
          return fallback;
        }
      }

      function loadParticipantVolumeStorage() {
        const raw = loadStorage('callParticipantVolumes', '{}');
        try {
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') return {};
          const cleaned = {};
          const entries = Object.entries(parsed);
          for (let i = 0; i < entries.length; i += 1) {
            const key = String(entries[i][0] || '').trim();
            if (!key) continue;
            const value = clamp(Number(entries[i][1]), 0, 2);
            if (!Number.isFinite(value)) continue;
            cleaned[key] = Number(value.toFixed(3));
          }
          return cleaned;
        } catch (_) {
          return {};
        }
      }

      function saveStorage(key, value) {
        try {
          localStorage.setItem(key, String(value));
        } catch (_) {}
      }

      function loadBoolStorage(key, fallback = false) {
        const raw = loadStorage(key, fallback ? '1' : '0');
        return raw === '1' || raw === 'true';
      }

      function loadNumberStorage(key, fallback = 0) {
        const raw = loadStorage(key, String(fallback));
        const num = Number(raw);
        return Number.isFinite(num) ? num : fallback;
      }
    })();
  </script>
</body>
</html>
