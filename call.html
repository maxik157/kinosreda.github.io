        syncRoomPicker();
        try {
          window.history.replaceState({ room: '' }, '', buildSiblingPageUrl(CALL_ROUTE_SEGMENT, ''));
        } catch (_) {}
      }

      function returnToRoomPicker() {
        try {
          if (window.parent && window.parent !== window && window.top && window.top.location) {
            window.top.location.href = buildSidebarCallHubUrl();
            return;
          }
        } catch (_) {}
        openRoomPickerLocally();
      }

      function activateRoomLocally(slug) {
        const nextRoom = resolveRoomMeta(slug);
        const roomChanged = !state.roomReady || nextRoom.key !== state.roomKey;
        state.roomSlug = nextRoom.slug;
        state.roomKey = nextRoom.key;
        state.roomReady = true;
        state.roomPickerOpen = false;
        syncRoomPicker();
        setCustomRoomError('');

        const nextUrl = buildSiblingPageUrl(CALL_ROUTE_SEGMENT, nextRoom.slug);
        try {
          window.history.replaceState({ room: nextRoom.slug || '' }, '', nextUrl);
        } catch (_) {}

        if (roomChanged) {
          if (state.joined) {
            leaveRoom();
          }
          closeSocket();
          closeAllPeers();
          state.participants.clear();
          state.activeScreenOwnerId = '';
          state.activeCameraStageOwnerId = '';
          renderScreenStage(true);
          renderParticipants(true);
        }

        trackRoomVisit(nextRoom, roomChanged ? 'switch' : 'resume');
        updateTransportBadge('offline', 'Оффлайн');
        window.setTimeout(() => {
          joinRoom().catch(() => {});
        }, 0);
      }

      function activateRoom(slug) {
        const normalizedSlug = normalizeRoomSlug(slug);
        const nextRoom = resolveRoomMeta(normalizedSlug);
        const parentUrl = buildSidebarCallUrl(nextRoom.slug);
        setCustomRoomError('');

        try {
          if (window.parent && window.parent !== window) {
            let parentHref = '';
            try {
              parentHref = String(window.parent.location && window.parent.location.href || '').trim();
            } catch (_) {}

            window.parent.postMessage({
              type: 'call:route',
              roomSlug: nextRoom.slug
            }, '*');

            if (parentHref && parentHref === parentUrl) {
              activateRoomLocally(nextRoom.slug);
              return;
            }

            try {
              if (window.top && window.top.location) {
                window.top.location.href = parentUrl;
                return;
              }
            } catch (_) {}
          }
        } catch (_) {}

        activateRoomLocally(nextRoom.slug);
      }

      function openTopHrefFromElement(element) {
        const href = element ? String(element.getAttribute('href') || '').trim() : '';
        if (!href) return false;
        try {
          if (window.top && window.top.location) {
            window.top.location.href = href;
            return true;
          }
        } catch (_) {}
        try {
          window.location.href = href;
          return true;
        } catch (_) {}
        return false;
      }

      function getTopHrefSafe() {
        try {
          if (window.top && window.top.location) {
            return String(window.top.location.href || '').trim();
          }
        } catch (_) {}
        try {
          return String(window.location.href || '').trim();

      async function joinRoom() {
        if (state.joined) return;
        if (!state.roomReady) {
          state.roomPickerOpen = true;
          syncRoomPicker();
          return;
        }
        state.joined = true;
        state.reconnectAttempt = 0;
        state.hiddenTransmitUntil = 0;
        ensureRemoteAudioContext();
        tryResumeAudioContexts();
        updateConnectButton();
        updateDockStatus('Подключение...', 'Инициализируем звук и realtime-канал');

        try {
          await ensureLocalAudio({ force: false });
        } catch (_) {
          state.masterMicEnabled = false;
          saveStorage('callMasterMic', '0');
          updateMicButton();
          showToast('Доступ к микрофону не получен. Вы вошли как слушатель');
        }

        refreshDevices().catch(() => {});
        applyTrackConstraintsForMode();
        tryResumeAudioContexts();
        await refreshSelfAvatarFromDirectory().catch(() => {});
        if (!state.ws || state.ws.readyState > WS_OPEN) {
          connectRealtime();
        } else {
          emitPresence('join');
          syncVoicePeers(true);
        }
        startPresenceLoop();
        startStatsLoop();
        applyTransmissionState();
        renderParticipants();
        updateLocalStateText();
      }

      function leaveRoom() {
        if (!state.joined) return;
        state.joined = false;
        state.toggleTalkEnabled = false;
        state.pttPressed = false;
        stopCameraShare();
        stopScreenShare();
        closeControlPip();
        applyTransmissionState();
        stopPresenceLoop();
        stopStatsLoop();
        sendPacket({ type: 'leave' });
        closeAllPeers();
        stopLocalAudio();
        updateConnectButton();
        if (state.ws && state.ws.readyState === WS_OPEN) {
          updateTransportBadge('online', 'Онлайн');
        } else {
          updateTransportBadge('offline', 'Оффлайн');
        }
        updateDockStatus('Не в комнате', 'Нажмите «Войти», чтобы начать');
        renderParticipants();
        updateLocalStateText();
      }

      function connectRealtime() {
        if (!state.roomReady || !state.roomKey) return;
        if (state.ws && (state.ws.readyState === WS_OPEN || state.ws.readyState === WebSocket.CONNECTING)) {
          return;
        }
        clearReconnectTimer();
        updateTransportBadge('connecting', 'Подключение');

        const candidates = buildWsCandidates();
        if (!candidates.length) {
          scheduleReconnect();
          return;
        }

        attemptSocketCandidates(candidates).then((socketResult) => {
          if (!socketResult || !socketResult.socket) {
            updateTransportBadge('offline', 'Нет соединения');
            scheduleReconnect();
            return;
          }
          attachSocket(socketResult.socket, socketResult.url);
        }).catch(() => {
          updateTransportBadge('offline', 'Нет соединения');
          scheduleReconnect();
        });
      }

      async function attemptSocketCandidates(candidates) {
        for (let i = 0; i < candidates.length; i += 1) {
          const url = candidates[i];
          const socket = await openSocket(url, i === 0 ? 3600 : 2600);
          if (socket) return { socket, url };
        }
        return null;
      }

      function openSocket(url, timeoutMs = 5400) {
        return new Promise((resolve) => {
          let socket = null;
          let settled = false;
          let timer = null;

          const cleanup = () => {
            if (timer) clearTimeout(timer);
            if (!socket) return;
            socket.removeEventListener('open', onOpen);
            socket.removeEventListener('error', onFail);
            socket.removeEventListener('close', onFail);
          };

          const done = (ok) => {
            if (settled) return;
            settled = true;
            cleanup();
            if (!ok) {
              if (socket) {
                try { socket.close(); } catch (_) {}
              }
              resolve(null);
              return;
            }
            resolve(socket);
          };

          const onOpen = () => done(true);
          const onFail = () => done(false);

          try {
            socket = new WebSocket(url);
          } catch (_) {
            resolve(null);
            return;
          }

          socket.addEventListener('open', onOpen);
          socket.addEventListener('error', onFail);
          socket.addEventListener('close', onFail);
          timer = window.setTimeout(() => done(false), timeoutMs);
        });
      }

      function attachSocket(socket, url) {
        closeSocket();
        state.ws = socket;
        state.wsUrl = url;
        state.reconnectAttempt = 0;

        socket.addEventListener('open', () => {
          updateTransportBadge('online', 'Онлайн');
          if (state.joined) {
            updateDockStatus('В комнате', 'Соединение активно, можно говорить');
            emitPresence('join');
          }
          syncVoicePeers();
        });

        if (socket.readyState === WS_OPEN) {
          updateTransportBadge('online', 'Онлайн');
          if (state.joined) {
            updateDockStatus('В комнате', 'Соединение активно, можно говорить');
            emitPresence('join');
          }
          syncVoicePeers();
        }

        socket.addEventListener('message', (event) => {
          let payload = null;
          try {
            payload = JSON.parse(event.data);
          } catch (_) {
            return;
          }
          handleRealtimePayload(payload);
        });

        const closeHandler = () => {
          if (state.ws !== socket) return;
          closeSocket();
          closeAllPeers();
          updateTransportBadge('offline', 'Оффлайн');
          renderParticipants(true);
          if (state.joined) {
            updateDockStatus('Связь потеряна', 'Пробуем переподключиться...');
          }
          scheduleReconnect();
        };

        socket.addEventListener('close', closeHandler);
        socket.addEventListener('error', closeHandler);
      }

      function closeSocket() {
        if (!state.ws) return;
        const socket = state.ws;
        state.ws = null;
        state.wsUrl = '';
        try {
          if (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING) {
            socket.close();
          }
        } catch (_) {}
      }

      function scheduleReconnect() {
        if (state.reconnectTimer) return;
        const delayBase = Math.min(15000, Math.round(900 * Math.pow(1.65, state.reconnectAttempt)));
        const jitter = Math.round(delayBase * (0.15 + Math.random() * 0.2));
        const delay = delayBase + jitter;
        state.reconnectAttempt = Math.min(12, state.reconnectAttempt + 1);
        state.reconnectTimer = window.setTimeout(() => {
          state.reconnectTimer = null;
          connectRealtime();
        }, delay);
      }

      function clearReconnectTimer() {
        if (!state.reconnectTimer) return;
        clearTimeout(state.reconnectTimer);
        state.reconnectTimer = null;
      }

      function isLoopbackHost(hostname) {
        const host = String(hostname || '').trim().toLowerCase();
        return host === 'localhost' || host === '127.0.0.1' || host === '::1';
      }

      function buildWsCandidates() {
        const params = new URLSearchParams(window.location.search);
        const queryBase = params.get('wsBase') || params.get('realtimeWsBase') || params.get('realtimeBase') || '';
        const explicitBase = String(window.CALL_REALTIME_WS_BASE || window.PLANNING_REALTIME_WS_BASE || '').trim();
        const storedBase = String(loadStorage('planningRealtimeWsBase', '') || loadStorage('planningRealtimeBaseUrl', '')).trim();
        const primaryRaw = queryBase || explicitBase || storedBase;

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const hostname = String(window.location.hostname || '').trim().toLowerCase();
        const pageIsLoopback = isLoopbackHost(hostname);
        const sameHostBase = `${wsProtocol}//${window.location.host}`;
        const hasStoredOnly = !queryBase && !explicitBase && !!storedBase;

        const list = [];
        const addBase = (raw, preferSecure = false) => {
          const normalized = normalizeWsBase(raw, preferSecure);
          if (!normalized) return;
          if (list.includes(normalized)) return;
          list.push(normalized);
        };

        let trustedPrimary = primaryRaw;
        if (trustedPrimary) {
          const normalizedPrimary = normalizeWsBase(trustedPrimary);
          let primaryHost = '';
          try {
            primaryHost = new URL(normalizedPrimary).hostname.toLowerCase();
          } catch (_) {}
          if (hasStoredOnly && !pageIsLoopback && isLoopbackHost(primaryHost)) {
            trustedPrimary = '';
            try {
              localStorage.removeItem('planningRealtimeWsBase');
              localStorage.removeItem('planningRealtimeBaseUrl');
            } catch (_) {}
          }
        }

        if (trustedPrimary) {
          addBase(trustedPrimary);
        } else if (pageIsLoopback) {
          // На loopback по умолчанию сначала пытаемся выйти в удаленный realtime, а local оставляем fallback.
          addBase('https://realtime.киносреда.рф', true);
          addBase('https://realtime.xn--80ahcljthqi.xn--p1ai', true);
          addBase(sameHostBase);
          addBase(`${wsProtocol}//localhost:8080`);
          addBase(`${wsProtocol}//127.0.0.1:8080`);
        } else {
          addBase(sameHostBase);
        }

        if (!hostname.startsWith('realtime.')) {
          const parts = hostname.split('.').filter(Boolean);
          if (parts.length >= 2) {
            addBase(`${wsProtocol}//realtime.${parts.join('.')}`);
          }
        }

        addBase('https://realtime.киносреда.рф', true);
        addBase('https://realtime.xn--80ahcljthqi.xn--p1ai', true);
        addBase(sameHostBase);
        if (pageIsLoopback) {
          addBase(`${wsProtocol}//localhost:8080`);
          addBase(`${wsProtocol}//127.0.0.1:8080`);
        }

        const name = encodeURIComponent(encodeTransportName(state.self.name, state.self.username));
        const color = encodeURIComponent(state.self.color);
        const id = encodeURIComponent(state.self.id);
        const username = encodeURIComponent(state.self.username || '');
        const avatar = encodeURIComponent(getShareableAvatarUrl(state.self.avatarUrl || ''));
        const room = encodeURIComponent(state.roomKey);

        return list.map((base) => `${base}/planning-sync/ws?event=${room}&id=${id}&name=${name}&color=${color}&username=${username}&avatarUrl=${avatar}`);
      }

      function normalizeWsBase(rawBase, preferSecure = false) {
        const raw = String(rawBase || '').trim();
        if (!raw) return '';
        try {
          const hasProtocol = /^wss?:\/\//i.test(raw) || /^https?:\/\//i.test(raw);
          const parsed = new URL(hasProtocol ? raw : `${window.location.protocol}//${raw}`);
          const protocol = preferSecure || parsed.protocol === 'https:' || parsed.protocol === 'wss:' ? 'wss:' : 'ws:';
          return `${protocol}//${parsed.host}`.replace(/\/+$/, '');
        } catch (_) {
          return '';
        }
      }

      function handleRealtimePayload(data) {
        if (!data || typeof data !== 'object') return;

        if (data.type === 'init') {
          const cursors = Array.isArray(data.cursors) ? data.cursors : [];
          let changed = state.participants.size > 0;
          state.participants.clear();
          for (let i = 0; i < cursors.length; i += 1) {
            changed = ingestCursor(cursors[i]) || changed;
          }
          syncVoicePeers(true);
          if (changed) renderParticipants(true);
          return;
        }

        if (data.type === 'cursor' && data.cursor) {
          const changed = ingestCursor(data.cursor);
          syncVoicePeers(changed);
          if (changed) renderParticipants(true);
          return;
        }

        if (data.type === 'leave') {
          const id = String(data.id || '');
          if (!id) return;
          const changed = removeParticipant(id);
          syncVoicePeers(true);
          if (changed) renderParticipants(true);
          return;
        }

        if (data.type === 'voice:signal') {
          const target = String(data.target || '');
          if (target !== state.self.id) return;
          const from = String(data.from || '');
          handleVoiceSignal(from, data.data);
          return;
        }

        if (data.type === 'voice:talking') {
          const speakerId = String(data.id || data.from || data.clientId || '');
          if (!speakerId || speakerId === state.self.id) return;
          const person = state.participants.get(speakerId);
          if (!person) return;
          const wasSpeaking = Number(person.speakingUntil || 0) > Date.now();
          person.speakingUntil = Boolean(data.speaking) ? (Date.now() + REMOTE_SPEAK_TTL_MS) : Date.now();
          const isSpeaking = Number(person.speakingUntil || 0) > Date.now();
          if (isSpeaking !== wasSpeaking) renderParticipants(true);
          return;
        }

        if (data.type === 'voice:profile') {
          const changed = ingestVoiceProfile(data);
          if (changed) {
            syncVoicePeers(false);
            renderParticipants(true);
          }
        }
      }

      function ingestVoiceProfile(payload) {
        if (!payload || typeof payload !== 'object') return false;
        const id = String(payload.id || payload.from || payload.clientId || '').trim();
        if (!id || id === state.self.id) return false;
        const now = Date.now();
        const prev = state.participants.get(id);
        const identity = parseTransportIdentity(
          payload.name || (prev && prev.name) || 'Гость',
          payload.username || (prev && prev.username) || ''
        );
        const username = identity.username;
        const name = identity.name;
        const color = normalizeColor(payload.color || (prev && prev.color) || colorForName(name || id));
        const avatarUrl = normalizeAvatarUrl(payload.avatarUrl || (prev && prev.avatarUrl) || '');
        const micEnabled = coerceMicEnabled(payload.micEnabled, prev ? prev.micEnabled : true);
        const screenSharing = coerceMediaFlag(payload, 'screenSharing', prev ? prev.screenSharing : false);
        const cameraSharing = coerceMediaFlag(payload, 'cameraSharing', prev ? prev.cameraSharing : false);
        const screenQuality = normalizeConnectionQuality(payload.screenQuality || (prev && prev.screenQuality) || 'high');
        const changed = !prev
          || prev.username !== username
          || prev.name !== name
          || prev.color !== color
          || prev.avatarUrl !== avatarUrl
          || Boolean(prev.micEnabled) !== Boolean(micEnabled)
          || Boolean(prev.screenSharing) !== Boolean(screenSharing)
          || Boolean(prev.cameraSharing) !== Boolean(cameraSharing)
          || String(prev.screenQuality || '') !== screenQuality;

        state.participants.set(id, {
          id,
          username,
          name,
          color,
          avatarUrl,
          micEnabled: Boolean(micEnabled),
          screenSharing: Boolean(screenSharing),
          cameraSharing: Boolean(cameraSharing),
          screenQuality,
          lastSeenAt: now,
          speakingUntil: prev && Number.isFinite(prev.speakingUntil) ? prev.speakingUntil : 0,
          quality: (prev && prev.quality) || 'fair',
          level: (prev && prev.level) || 0,
          bandBass: (prev && prev.bandBass) || 0,
          bandMid: (prev && prev.bandMid) || 0,
          bandTreble: (prev && prev.bandTreble) || 0,
          rttMs: (prev && prev.rttMs) || 0,
          lossPct: (prev && prev.lossPct) || 0
        });
        if (screenSharing && (!prev || !prev.screenSharing) && state.screenSharing) {
          stopScreenShare(`Показ экрана остановлен: ${name || 'другой участник'} начал трансляцию`);
        }
        if (!screenSharing && prev && prev.screenSharing) {
          scheduleRemoteScreenClear(id);
        } else if (screenSharing) {
          cancelRemoteScreenClear(id);
        }
        if (!cameraSharing && prev && prev.cameraSharing) {
          scheduleRemoteCameraClear(id);
        } else if (cameraSharing) {
          cancelRemoteCameraClear(id);
        }
        applyPeerAudioVolume(id);
        updateShareButton();
        if (!avatarUrl && username) {
          resolveParticipantAvatar(id, username);
        }
        return changed;
      }

      function ingestCursor(cursor) {
        if (!cursor || typeof cursor !== 'object') return false;
        const id = String(cursor.id || '').trim();
        if (!id || id === state.self.id) return false;

        const now = Date.now();
        const prev = state.participants.get(id);
        const identity = parseTransportIdentity(
          cursor.name || (prev && prev.name) || 'Гость',
          cursor.username || (prev && prev.username) || ''
        );
        const username = identity.username;
        const name = identity.name;
        const color = normalizeColor(cursor.color || (prev && prev.color) || colorForName(name || id));
        const avatarUrl = normalizeAvatarUrl(cursor.avatarUrl || (prev && prev.avatarUrl) || '');
        const micEnabled = coerceMicEnabled(cursor.micEnabled, prev ? prev.micEnabled : true);
        const screenSharing = coerceMediaFlag(cursor, 'screenSharing', prev ? prev.screenSharing : false);
        const cameraSharing = coerceMediaFlag(cursor, 'cameraSharing', prev ? prev.cameraSharing : false);
        const screenQuality = normalizeConnectionQuality(cursor.screenQuality || (prev && prev.screenQuality) || 'high');
        const isChanged = !prev
          || prev.username !== username
          || prev.name !== name
          || prev.color !== color
          || prev.avatarUrl !== avatarUrl
          || Boolean(prev.micEnabled) !== Boolean(micEnabled)
          || Boolean(prev.screenSharing) !== Boolean(screenSharing)
          || Boolean(prev.cameraSharing) !== Boolean(cameraSharing)
          || String(prev.screenQuality || '') !== screenQuality;

        state.participants.set(id, {
          id,
          username,
          name,
          color,
          avatarUrl,
          micEnabled: Boolean(micEnabled),
          screenSharing: Boolean(screenSharing),
          cameraSharing: Boolean(cameraSharing),
          screenQuality,
          lastSeenAt: now,
          speakingUntil: prev && Number.isFinite(prev.speakingUntil) ? prev.speakingUntil : 0,
          quality: (prev && prev.quality) || 'fair',
          level: (prev && prev.level) || 0,
          bandBass: (prev && prev.bandBass) || 0,
          bandMid: (prev && prev.bandMid) || 0,
          bandTreble: (prev && prev.bandTreble) || 0,
          rttMs: (prev && prev.rttMs) || 0,
          lossPct: (prev && prev.lossPct) || 0
        });
        if (screenSharing && (!prev || !prev.screenSharing) && state.screenSharing) {
          stopScreenShare(`Показ экрана остановлен: ${name || 'другой участник'} начал трансляцию`);
        }
        if (!screenSharing && prev && prev.screenSharing) {
          scheduleRemoteScreenClear(id);
        } else if (screenSharing) {
          cancelRemoteScreenClear(id);
        }
        if (!cameraSharing && prev && prev.cameraSharing) {
          scheduleRemoteCameraClear(id);
        } else if (cameraSharing) {
          cancelRemoteCameraClear(id);
        }
        applyPeerAudioVolume(id);
        updateShareButton();
        if (!avatarUrl && username) {
          resolveParticipantAvatar(id, username);
        }

        return isChanged;
      }

      function removeParticipant(id) {
        const safeId = String(id);
        const hadPeer = state.peers.has(safeId);
        const existed = state.participants.delete(safeId);
        clearRemoteScreen(safeId);
        closePeer(safeId);
        return existed || hadPeer;
      }

      function startPresenceLoop() {
        stopPresenceLoop();
        emitPresence('join');
        startPruneLoop();
        state.presenceTimer = window.setInterval(() => {
          if (!state.joined) return;
          emitPresence('heartbeat');
          syncVoicePeers(false);
          pruneParticipants();
        }, PRESENCE_HEARTBEAT_MS);
      }

      function stopPresenceLoop() {
        if (state.presenceTimer) {
          clearInterval(state.presenceTimer);
          state.presenceTimer = null;
        }
      }

      function startPruneLoop() {
        if (state.pruneTimer) return;
        state.pruneTimer = window.setInterval(() => {
          pruneParticipants();
        }, 4600);
      }

      function stopPruneLoop() {
        if (state.pruneTimer) {
          clearInterval(state.pruneTimer);
          state.pruneTimer = null;
        }
      }

      function emitPresence(reason = 'heartbeat') {
        const shareableAvatarUrl = getShareableAvatarUrl(state.self.avatarUrl);
        sendPacket({
          type: 'cursor',
          x: 0.5,
          y: 0.5,
          docX: 0,
          docY: 0,
          username: state.self.username || '',
          name: encodeTransportName(state.self.name, state.self.username),
          color: state.self.color,
          avatarUrl: shareableAvatarUrl,
          micEnabled: !!state.masterMicEnabled,
          screenSharing: !!state.screenSharing,
          cameraSharing: !!state.cameraSharing,
          screenQuality: state.screenQuality,
          anchor: { k: 'voice-room', r: state.roomKey, reason: String(reason || '') },
          ts: Date.now()
        });
        emitVoiceProfile(reason);
      }

      function emitVoiceProfile(reason = 'profile') {
        const shareableAvatarUrl = getShareableAvatarUrl(state.self.avatarUrl);
        sendPacket({
          type: 'voice:profile',
          id: state.self.id,
          username: state.self.username || '',
          name: encodeTransportName(state.self.name, state.self.username),
          color: state.self.color,
          avatarUrl: shareableAvatarUrl,
          micEnabled: !!state.masterMicEnabled,
          screenSharing: !!state.screenSharing,
          cameraSharing: !!state.cameraSharing,
          screenQuality: state.screenQuality,
          reason: String(reason || ''),
          ts: Date.now()
        });
      }

      function pruneParticipants() {
        const now = Date.now();
        let changed = false;
        for (const [id, person] of state.participants.entries()) {
          if (!person || !Number.isFinite(person.lastSeenAt) || now - person.lastSeenAt > PARTICIPANT_TTL_MS) {
            state.participants.delete(id);
            closePeer(id);
            changed = true;
          }
        }
        if (changed) {
          syncVoicePeers(true);
          renderParticipants();
        }
      }

      function sendPacket(payload) {
        if (!state.ws || state.ws.readyState !== WS_OPEN) return false;
        try {
          state.ws.send(JSON.stringify(payload));
          return true;
        } catch (_) {
          return false;
        }
      }

      function syncVoicePeers(forceOffer = false) {
        if (!state.joined) {
          closeAllPeers();
          return;
        }
        const now = Date.now();
        const activeIds = new Set();

        for (const [id, person] of state.participants.entries()) {
          if (!person || now - person.lastSeenAt > PARTICIPANT_TTL_MS) continue;
          activeIds.add(id);
          const already = state.peers.has(id);
          createPeer(id);
          if (!already && state.joined && shouldOfferTo(id)) {
            sendVoiceOffer(id, { reason: 'join', iceRestart: false });
          }
          if (already && forceOffer && state.joined && shouldOfferTo(id)) {
            sendVoiceOffer(id, { reason: 'sync', iceRestart: false });
          }
        }

        for (const [id] of state.peers.entries()) {
          if (!activeIds.has(id)) closePeer(id);
        }
      }

      function shouldOfferTo(remoteId) {
        return String(state.self.id) < String(remoteId || '');
      }

      function resolveRemoteVideoKind(peer, participantId, track, event) {
        const id = String(participantId || '').trim();
        const transceiver = event && event.transceiver ? event.transceiver : null;
        const mid = transceiver && typeof transceiver.mid === 'string' ? transceiver.mid : '';
        if (mid) {
          if (peer && peer.screenTransceiver && peer.screenTransceiver.mid === mid) return 'screen';
          if (peer && peer.cameraTransceiver && peer.cameraTransceiver.mid === mid) return 'camera';
        }
        if (transceiver) {
          if (peer && peer.screenTransceiver && transceiver === peer.screenTransceiver) return 'screen';
          if (peer && peer.cameraTransceiver && transceiver === peer.cameraTransceiver) return 'camera';
        }
        const person = state.participants.get(id);
        const label = String((track && track.label) || '').toLowerCase();
        if (label.includes('screen') || label.includes('window') || label.includes('display')) return 'screen';
        if (person && person.cameraSharing && !person.screenSharing) return 'camera';
        if (person && person.screenSharing && !person.cameraSharing) return 'screen';
        if (peer && peer.remoteCameraTrack && peer.remoteCameraTrack.id === String(track && track.id || '')) return 'camera';
        if (peer && peer.remoteScreenTrack && peer.remoteScreenTrack.id === String(track && track.id || '')) return 'screen';
        if (person && person.cameraSharing) return 'camera';
        if (person && person.screenSharing) return 'screen';
        if (peer && !peer.remoteCameraTrack) return 'camera';
        return 'screen';
      }

      function createPeer(remoteId) {
        const id = String(remoteId || '').trim();
        if (!id) return null;
        if (state.peers.has(id)) return state.peers.get(id);
        if (typeof RTCPeerConnection !== 'function') return null;

        const polite = String(state.self.id) > id;
        const pc = new RTCPeerConnection({ iceServers: VOICE_ICE_SERVERS, iceCandidatePoolSize: 2 });
        const screenTransceiver = typeof pc.addTransceiver === 'function'
          ? pc.addTransceiver('video', { direction: 'recvonly' })
          : null;
        const cameraTransceiver = typeof pc.addTransceiver === 'function'
          ? pc.addTransceiver('video', { direction: 'recvonly' })
          : null;
        const audio = document.createElement('audio');
        audio.autoplay = true;
        audio.playsInline = true;
        audio.muted = false;
        audio.volume = clamp(getParticipantVolume(id, state.participants.get(id)), 0, 1);
        audio.dataset.peerId = id;
        dom.remoteAudioLayer.appendChild(audio);

        const peer = {
          id,
          pc,
          audio,
          polite,
          localSender: null,
          videoSender: screenTransceiver ? screenTransceiver.sender : null,
          videoTransceiver: screenTransceiver,
          screenSender: screenTransceiver ? screenTransceiver.sender : null,
          screenTransceiver,
          cameraSender: cameraTransceiver ? cameraTransceiver.sender : null,
          cameraTransceiver,
          hasLocalTrack: false,
          hasScreenTrack: false,
          hasCameraTrack: false,
          makingOffer: false,
          ignoreOffer: false,
          pendingCandidates: [],
          recoverTimer: null,
          dropTimer: null,
          restartOfferAt: 0,
          analyser: null,
          analyserData: null,
          freqData: null,
          remoteLevel: 0,
          quality: 'fair',
          rttMs: 0,
          lossPct: 0,
          outKbps: 0,
          prevOutboundBytes: 0,
          prevOutboundTs: 0,
          remoteSourceNode: null,
          remoteGainNode: null,
          remoteDestNode: null,
          rawRemoteStream: null,
          remoteScreenStream: null,
          remoteScreenTrack: null,
          remoteCameraStream: null,
          remoteCameraTrack: null,
          closed: false
        };

        ensurePeerMediaTracks(peer);

        pc.onicecandidate = (event) => {
          if (!event.candidate) return;
          sendVoiceSignal(id, { candidate: event.candidate });
        };

        pc.ontrack = (event) => {
          const track = event.track || null;
          const stream = event.streams && event.streams[0]
            ? event.streams[0]
            : (track ? new MediaStream([track]) : null);
          if (!stream || !track) return;
          if (track.kind === 'video') {
            const kind = resolveRemoteVideoKind(peer, id, track, event);
            if (kind === 'screen') {
              bindRemoteScreenTrack(id, stream, track);
            } else {
              bindRemoteCameraTrack(id, stream, track);
            }
            return;
          }
          peer.rawRemoteStream = stream;
          setupRemoteAnalyser(peer, stream);
          audio.srcObject = stream;
          audio.muted = false;
          applyOutputDevice(audio).catch(() => {});
          const playPromise = audio.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
          }
          applyPeerAudioVolume(id);
        };

        pc.onnegotiationneeded = async () => {
          if (peer.closed || !state.joined) return;
          try {
            peer.makingOffer = true;
            const offer = await pc.createOffer();
            if (pc.signalingState !== 'stable') return;
            const tuned = tuneAudioDescription(offer);
            await pc.setLocalDescription(tuned);
            sendVoiceSignal(id, { description: pc.localDescription });
          } catch (_) {
          } finally {
            peer.makingOffer = false;
          }
        };

        pc.onconnectionstatechange = () => {
          if (peer.closed) return;
          const status = pc.connectionState;
          if (status === 'connected') {
            clearPeerRecovery(peer);
          } else if (status === 'disconnected') {
            schedulePeerIceRecovery(peer, 1100);
            schedulePeerDrop(peer, 15000);
          } else if (status === 'failed') {
            schedulePeerIceRecovery(peer, 60);
            schedulePeerDrop(peer, 12000);
          } else if (status === 'closed') {
            closePeer(id);
          }
          renderParticipants();
        };

        pc.oniceconnectionstatechange = () => {
          if (peer.closed) return;
          const ice = pc.iceConnectionState;
          if (ice === 'connected' || ice === 'completed') {
            clearPeerRecovery(peer);
          } else if (ice === 'failed') {
            schedulePeerIceRecovery(peer, 40);
          } else if (ice === 'disconnected') {
            schedulePeerIceRecovery(peer, 900);
          }
        };

        state.peers.set(id, peer);
        return peer;
      }

      function clearPeerRecovery(peer) {
        if (!peer) return;
        if (peer.recoverTimer) {
          clearTimeout(peer.recoverTimer);
          peer.recoverTimer = null;
        }
        if (peer.dropTimer) {
          clearTimeout(peer.dropTimer);
          peer.dropTimer = null;
        }
      }

      function schedulePeerDrop(peer, delayMs) {
        if (!peer || peer.dropTimer) return;
        peer.dropTimer = window.setTimeout(() => {
          peer.dropTimer = null;
          if (!peer || peer.closed) return;
          const stateName = peer.pc ? peer.pc.connectionState : '';
          if (stateName === 'failed' || stateName === 'disconnected') {
            closePeer(peer.id);
            renderParticipants();
          }
        }, Math.max(2000, Number(delayMs) || 0));
      }

      function schedulePeerIceRecovery(peer, delayMs = 0) {
        if (!peer || peer.closed) return;
        if (peer.recoverTimer) return;
        if (!shouldOfferTo(peer.id)) return;
        peer.recoverTimer = window.setTimeout(() => {
          peer.recoverTimer = null;
          sendVoiceOffer(peer.id, { reason: 'recover', iceRestart: true });
        }, Math.max(0, Number(delayMs) || 0));
      }

      function closePeer(id) {
        const peerId = String(id || '');
        const peer = state.peers.get(peerId);
        if (!peer) return;
        peer.closed = true;
        clearPeerRecovery(peer);
        peer.hasLocalTrack = false;

        try {
          if (peer.analyser) peer.analyser.disconnect();
        } catch (_) {}
        try {
          if (peer.remoteSourceNode) peer.remoteSourceNode.disconnect();
        } catch (_) {}
        try {
          if (peer.remoteGainNode) peer.remoteGainNode.disconnect();
        } catch (_) {}
        try {
          if (peer.remoteDestNode && typeof peer.remoteDestNode.disconnect === 'function') {
            peer.remoteDestNode.disconnect();
          }
        } catch (_) {}
        clearRemoteScreen(peerId);
        clearRemoteCamera(peerId);
        peer.rawRemoteStream = null;

        try {
          peer.pc.close();
        } catch (_) {}

        if (peer.audio && peer.audio.parentNode) {
          peer.audio.parentNode.removeChild(peer.audio);
        }

        state.peers.delete(peerId);
      }

      function closeAllPeers() {
        for (const id of Array.from(state.peers.keys())) {
          closePeer(id);
        }
      }

      async function sendVoiceOffer(remoteId, options = {}) {
        const id = String(remoteId || '');
        if (!id) return;
        const peer = createPeer(id);
        if (!peer || peer.closed) return;
        if (peer.makingOffer) return;
        if (peer.pc.signalingState !== 'stable') return;

        if (options.iceRestart) {
          const now = Date.now();
          if (now - (peer.restartOfferAt || 0) < 2200) return;
          peer.restartOfferAt = now;
        }

        try {
          peer.makingOffer = true;
          const offer = await peer.pc.createOffer(options.iceRestart ? { iceRestart: true } : undefined);
          const tuned = tuneAudioDescription(offer);
          await peer.pc.setLocalDescription(tuned);
          sendVoiceSignal(id, { description: peer.pc.localDescription });
        } catch (_) {
        } finally {
          peer.makingOffer = false;
        }
      }

      async function handleVoiceSignal(remoteId, payload) {
        const id = String(remoteId || '');
        if (!id || !payload) return;
        const peer = createPeer(id);
        if (!peer || peer.closed) return;

        const pc = peer.pc;

        if (payload.description) {
          const description = payload.description;
          const collision = description.type === 'offer' && (peer.makingOffer || pc.signalingState !== 'stable');
          peer.ignoreOffer = !peer.polite && collision;
          if (peer.ignoreOffer) return;

          try {
            await pc.setRemoteDescription(description);
            await flushPendingCandidates(peer);

            if (description.type === 'offer') {
              ensurePeerMediaTracks(peer);
              const answer = await pc.createAnswer();
              const tunedAnswer = tuneAudioDescription(answer);
              await pc.setLocalDescription(tunedAnswer);
              sendVoiceSignal(id, { description: pc.localDescription });
            }
          } catch (_) {
          }
          return;
        }

        if (payload.candidate) {
          if (!pc.remoteDescription) {
            peer.pendingCandidates.push(payload.candidate);
            return;
          }
          try {
            await pc.addIceCandidate(payload.candidate);
          } catch (_) {}
        }
      }

      async function flushPendingCandidates(peer) {
        if (!peer || !Array.isArray(peer.pendingCandidates) || !peer.pendingCandidates.length) return;
        const pending = peer.pendingCandidates.splice(0, peer.pendingCandidates.length);
        for (let i = 0; i < pending.length; i += 1) {
          try {
            await peer.pc.addIceCandidate(pending[i]);
          } catch (_) {}
        }
      }

      function sendVoiceSignal(targetId, data) {
        sendPacket({
          type: 'voice:signal',
          target: String(targetId || ''),
          data
        });
      }

      function sendTalkingState(speaking) {
        sendPacket({
          type: 'voice:talking',
          speaking: Boolean(speaking)
        });
      }

      function ensurePeerMediaTracks(peer) {
        if (!peer || peer.closed) return;
        if (peer.pc && typeof peer.pc.getSenders === 'function') {
          if (!peer.localSender) {
            const sender = peer.pc.getSenders().find((item) => item && item.track && item.track.kind === 'audio');
            if (sender) peer.localSender = sender;
          }
        }

        if (!state.localTrack || !state.localStream) {
          if (peer.localSender) {
            peer.localSender.replaceTrack(null).catch(() => {});
          }
          peer.hasLocalTrack = false;
        } else if (peer.localSender) {
          if (peer.localSender.track !== state.localTrack) {
            peer.localSender.replaceTrack(state.localTrack).catch(() => {});
          }
          peer.hasLocalTrack = true;
          optimizeSender(peer.localSender);
        } else {
          try {
            peer.localSender = peer.pc.addTrack(state.localTrack, state.localStream);
            peer.hasLocalTrack = true;
            optimizeSender(peer.localSender);
          } catch (_) {}
        }

        if (!state.screenTrack) {
          if (peer.screenSender) {
            peer.screenSender.replaceTrack(null).catch(() => {});
          }
          if (peer.screenTransceiver && peer.screenTransceiver.direction !== 'recvonly') {
            try {
              peer.screenTransceiver.direction = 'recvonly';
            } catch (_) {}
          }
          peer.hasScreenTrack = false;
        } else {
          const screenStream = state.screenStream || new MediaStream([state.screenTrack]);
          if (peer.screenTransceiver && peer.screenTransceiver.direction !== 'sendrecv') {
            try {
              peer.screenTransceiver.direction = 'sendrecv';
            } catch (_) {}
          }
          if (peer.screenSender) {
            if (peer.screenSender.track !== state.screenTrack) {
              peer.screenSender.replaceTrack(state.screenTrack).catch(() => {});
            }
            peer.hasScreenTrack = true;
            optimizeVideoSender(peer.screenSender);
          } else {
            try {
              peer.screenSender = peer.pc.addTrack(state.screenTrack, screenStream);
              peer.videoSender = peer.screenSender;
              peer.hasScreenTrack = true;
              optimizeVideoSender(peer.screenSender);
            } catch (_) {}
          }
        }

        if (!state.cameraTrack) {
          if (peer.cameraSender) {
            peer.cameraSender.replaceTrack(null).catch(() => {});
          }
          if (peer.cameraTransceiver && peer.cameraTransceiver.direction !== 'recvonly') {
            try {
              peer.cameraTransceiver.direction = 'recvonly';
            } catch (_) {}
          }
          peer.hasCameraTrack = false;
          return;
        }

        const cameraStream = state.cameraStream || new MediaStream([state.cameraTrack]);
        if (peer.cameraTransceiver && peer.cameraTransceiver.direction !== 'sendrecv') {
          try {
            peer.cameraTransceiver.direction = 'sendrecv';
          } catch (_) {}
        }
        if (peer.cameraSender) {
          if (peer.cameraSender.track !== state.cameraTrack) {
            peer.cameraSender.replaceTrack(state.cameraTrack).catch(() => {});
          }
          peer.hasCameraTrack = true;
          optimizeCameraSender(peer.cameraSender);
          return;
        }
        try {
          peer.cameraSender = peer.pc.addTrack(state.cameraTrack, cameraStream);
          peer.hasCameraTrack = true;
          optimizeCameraSender(peer.cameraSender);
        } catch (_) {}
      }

      async function optimizeSender(sender) {
        if (!sender || typeof sender.getParameters !== 'function' || typeof sender.setParameters !== 'function') return;
        try {
          const params = sender.getParameters() || {};
          params.encodings = params.encodings && params.encodings.length ? params.encodings : [{}];
          const encoding = params.encodings[0];
          const profile = getConnectionQualityProfile();
          encoding.maxBitrate = profile.senderMaxBitrate;
          encoding.dtx = profile.useDtx ? 'enabled' : 'disabled';
          await sender.setParameters(params);
        } catch (_) {}
      }

      async function optimizeVideoSender(sender) {
        if (!sender || typeof sender.getParameters !== 'function' || typeof sender.setParameters !== 'function') return;
        try {
          const params = sender.getParameters() || {};
          params.encodings = params.encodings && params.encodings.length ? params.encodings : [{}];
          const encoding = params.encodings[0];
          const profile = getScreenQualityProfile();
          encoding.active = true;
          encoding.maxBitrate = profile.maxBitrate;
          encoding.maxFramerate = profile.frameRate;
          encoding.scaleResolutionDownBy = Math.max(1, Number(profile.scaleDownBy || 1));
          encoding.priority = 'medium';
          encoding.networkPriority = 'medium';
          if ('scalabilityMode' in encoding) {
            encoding.scalabilityMode = profile.frameRate >= 18 ? 'L1T2' : 'L1T1';
          }
          if ('adaptivePtime' in encoding) {
            encoding.adaptivePtime = true;
          }
          if ('degradationPreference' in params) {
            params.degradationPreference = 'maintain-resolution';
          }
          await sender.setParameters(params);
        } catch (_) {}
      }

      async function optimizeCameraSender(sender) {
        if (!sender || typeof sender.getParameters !== 'function' || typeof sender.setParameters !== 'function') return;
        try {
          const params = sender.getParameters() || {};
          params.encodings = params.encodings && params.encodings.length ? params.encodings : [{}];
          const encoding = params.encodings[0];
          const profile = getCameraQualityProfile();
          encoding.active = true;
          encoding.maxBitrate = profile.maxBitrate;
          encoding.maxFramerate = profile.frameRate;
          encoding.priority = 'medium';
          encoding.networkPriority = 'medium';
          await sender.setParameters(params);
        } catch (_) {}
      }

      function tuneAudioDescription(description) {
        if (!description || typeof description !== 'object' || typeof description.sdp !== 'string') return description;
        return {
          type: description.type,
          sdp: tuneOpusSdp(description.sdp)
        };
      }

      function tuneOpusSdp(sdp) {
        if (typeof sdp !== 'string' || !sdp) return sdp;
        const lines = sdp.split('\r\n');
        let opusPayload = '';
        for (let i = 0; i < lines.length; i += 1) {
          const match = lines[i].match(/^a=rtpmap:(\d+)\s+opus\/48000/i);
          if (match) {
            opusPayload = match[1];
            break;
          }
        }
        if (!opusPayload) return sdp;

        const profile = getConnectionQualityProfile();
        const required = {
          minptime: String(profile.minptime),
          useinbandfec: profile.useFec ? '1' : '0',
          usedtx: profile.useDtx ? '1' : '0',
          maxaveragebitrate: String(profile.opusMaxAverageBitrate),
          cbr: '0'
        };

        const fmtpPrefix = `a=fmtp:${opusPayload} `;
        const fmtpIndex = lines.findIndex((line) => line.startsWith(fmtpPrefix));
        if (fmtpIndex >= 0) {
          const current = lines[fmtpIndex].slice(fmtpPrefix.length).trim();
          const pairs = current ? current.split(';').map((item) => item.trim()).filter(Boolean) : [];
          const map = {};
          for (let i = 0; i < pairs.length; i += 1) {
            const part = pairs[i];
            const eq = part.indexOf('=');
            if (eq === -1) {
              map[part] = '';
            } else {
              map[part.slice(0, eq)] = part.slice(eq + 1);
            }
          }
          Object.keys(required).forEach((key) => {
            map[key] = required[key];
          });
          const merged = Object.keys(map).map((key) => (map[key] === '' ? key : `${key}=${map[key]}`));
          lines[fmtpIndex] = `${fmtpPrefix}${merged.join(';')}`;
        } else {
          const rtpIndex = lines.findIndex((line) => line.startsWith(`a=rtpmap:${opusPayload}`));
          if (rtpIndex >= 0) {
            const add = Object.keys(required).map((key) => `${key}=${required[key]}`).join(';');
            lines.splice(rtpIndex + 1, 0, `${fmtpPrefix}${add}`);
          }
        }

        return lines.join('\r\n');
      }

      async function ensureLocalAudio(options = {}) {
        if (state.captureStream && !options.force) {
          const liveTrack = state.captureTrack && state.captureTrack.readyState === 'live';
          if (liveTrack) return state.captureStream;
        }
        if (state.voiceInitPromise) return state.voiceInitPromise;
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
          throw new Error('media devices unavailable');
        }

        const constraints = {
          echoCancellation: state.echoCancellation,
          noiseSuppression: state.noiseSuppression,
          autoGainControl: state.autoGainControl,
          channelCount: 1,
          sampleRate: 48000,
          sampleSize: 16
        };
        if (state.mode === 'vad') {
          constraints.voiceIsolation = true;
          constraints.latency = 0;
        }

        if (state.selectedInputId) {
          constraints.deviceId = { exact: state.selectedInputId };
        }

        state.voiceInitPromise = navigator.mediaDevices.getUserMedia({ audio: constraints }).then((stream) => {
          applyLocalStream(stream);
          return stream;
        }).finally(() => {
          state.voiceInitPromise = null;
        });

        return state.voiceInitPromise;
      }

      function applyTrackConstraintsForMode() {
        if (!state.captureTrack || typeof state.captureTrack.applyConstraints !== 'function') return;
        const forceVadFilters = state.mode === 'vad';
        const primaryConstraints = {
          echoCancellation: forceVadFilters ? true : !!state.echoCancellation,
          noiseSuppression: forceVadFilters ? true : !!state.noiseSuppression,
          autoGainControl: forceVadFilters ? true : !!state.autoGainControl
        };
        if (forceVadFilters) {
          primaryConstraints.voiceIsolation = true;
          primaryConstraints.latency = 0;
        }
        state.captureTrack.applyConstraints(primaryConstraints).catch(() => {
          if (!forceVadFilters) return;
          const fallbackConstraints = {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          };
          state.captureTrack.applyConstraints(fallbackConstraints).catch(() => {});
        });
      }

      function cleanupLocalAudioNodes() {
        if (state.localSourceNode) {
          try { state.localSourceNode.disconnect(); } catch (_) {}
        }
        if (state.localAnalyser) {
          try { state.localAnalyser.disconnect(); } catch (_) {}
        }
        if (Array.isArray(state.localProcessingNodes)) {
          state.localProcessingNodes.forEach((node) => {
            try {
              if (node && typeof node.disconnect === 'function') node.disconnect();
            } catch (_) {}
          });
        }
        state.localSourceNode = null;
        state.localGateNode = null;
        state.localProcessingNodes = [];
        state.localProcessingDestination = null;
        state.localAnalyser = null;
        state.localAnalyserData = null;
        state.localFreqData = null;
        state.vadNoiseSpectrum = null;
        state.vadPrevSpectrum = null;
      }

      function applyLocalStream(stream) {
        if (!stream) return;
        const captureTrack = stream.getAudioTracks()[0] || null;
        if (!captureTrack) return;

        const oldCaptureStream = state.captureStream;
        const oldStream = state.localStream;
        const oldTrack = state.localTrack;
        cleanupLocalAudioNodes();

        state.captureStream = stream;
        state.captureTrack = captureTrack;

        if (!state.localAudioContext) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) state.localAudioContext = new Ctx();
        }
        if (state.localAudioContext && state.localAudioContext.state === 'suspended') {
          state.localAudioContext.resume().catch(() => {});
        }

        const useRawOutgoingAudio = shouldUseRawOutgoingAudio();

        if (state.localAudioContext) {
          const source = state.localAudioContext.createMediaStreamSource(stream);
          const analyser = state.localAudioContext.createAnalyser();
          analyser.fftSize = 1024;

          state.localSourceNode = source;
          state.localAnalyser = analyser;
          state.localAnalyserData = new Uint8Array(analyser.fftSize);
          state.localFreqData = new Uint8Array(analyser.frequencyBinCount);
          state.vadNoiseSpectrum = new Float32Array(analyser.frequencyBinCount);
          state.vadPrevSpectrum = new Float32Array(analyser.frequencyBinCount);
          for (let i = 0; i < state.vadNoiseSpectrum.length; i += 1) {
            state.vadNoiseSpectrum[i] = 0.0006;
          }

          if (useRawOutgoingAudio) {
            source.connect(analyser);
            state.localGateNode = null;
            state.localProcessingDestination = null;
            state.localProcessingNodes = [];
          } else {
            const highPass = state.localAudioContext.createBiquadFilter();
            highPass.type = 'highpass';
            highPass.frequency.value = 95;
            highPass.Q.value = 0.707;

            const lowPass = state.localAudioContext.createBiquadFilter();
            lowPass.type = 'lowpass';
            lowPass.frequency.value = 4200;
            lowPass.Q.value = 0.76;

            const deHiss = state.localAudioContext.createBiquadFilter();
            deHiss.type = 'highshelf';
            deHiss.frequency.value = 3600;
            deHiss.gain.value = -8;

            const compressor = state.localAudioContext.createDynamicsCompressor();
            compressor.threshold.value = -30;
            compressor.knee.value = 20;
            compressor.ratio.value = 4.6;
            compressor.attack.value = 0.003;
            compressor.release.value = 0.16;

            const gateGain = state.localAudioContext.createGain();
            gateGain.gain.value = state.mode === 'vad' ? 0.0001 : 1;

            const destination = state.localAudioContext.createMediaStreamDestination();
            source.connect(highPass);
            highPass.connect(lowPass);
            lowPass.connect(deHiss);
            deHiss.connect(compressor);
            compressor.connect(gateGain);
            compressor.connect(analyser);
            gateGain.connect(destination);

            state.localGateNode = gateGain;
            state.localProcessingDestination = destination;
            state.localProcessingNodes = [highPass, lowPass, deHiss, compressor, gateGain];
          }
        }

        applyTrackConstraintsForMode();
        initMlVadForCurrentTrack().catch(() => {});

        const processedTrack = state.localProcessingDestination
          ? state.localProcessingDestination.stream.getAudioTracks()[0]
          : null;
        const sendTrack = processedTrack || (typeof captureTrack.clone === 'function' ? captureTrack.clone() : captureTrack);
        try { sendTrack.enabled = state.transmitting; } catch (_) {}
        state.localTrack = sendTrack;
        state.localStream = new MediaStream([sendTrack]);

        if (oldTrack && oldTrack !== state.localTrack && oldTrack !== state.captureTrack) {
          try { oldTrack.stop(); } catch (_) {}
        }
        if (oldStream && oldStream !== state.localStream && oldStream !== oldCaptureStream) {
          oldStream.getTracks().forEach((t) => {
            try { t.stop(); } catch (_) {}
          });
        }
        if (oldCaptureStream && oldCaptureStream !== stream) {
          oldCaptureStream.getTracks().forEach((t) => {
            try { t.stop(); } catch (_) {}
          });
        }
        state.vadNoiseFloor = clamp(state.vadNoiseFloor || 0.008, 0.003, 0.03);
        state.vadAdaptiveThreshold = Math.max(state.vadThreshold, (state.vadNoiseFloor * 2.25) + 0.0032);
        state.vadTransientHoldUntil = 0;
        state.vadRecentVoicedFrames = 0;
        state.vadFastStartUntil = 0;
        state.vadVoiceDetected = false;
        state.vadSpeechSmoothed = 0;
        state.vadGateActive = false;
        state.vadGateOpenUntil = 0;
        state.vadGateCloseSince = 0;

        for (const [, peer] of state.peers.entries()) {
          ensurePeerMediaTracks(peer);
        }

        applyTransmissionState();
        updateLocalStateText();
      }

      function stopLocalAudio() {
        stopMlVad(true).catch(() => {});
        if (state.captureStream) {
          state.captureStream.getTracks().forEach((track) => {
            try { track.stop(); } catch (_) {}
          });
        }
        if (state.localStream && state.localStream !== state.captureStream) {
          state.localStream.getTracks().forEach((track) => {
            try { track.stop(); } catch (_) {}
          });
        }
        cleanupLocalAudioNodes();
        state.captureStream = null;
        state.captureTrack = null;
        state.localStream = null;
        state.localTrack = null;
        state.vadSpeaking = false;
        state.vadLevel = 0;
        state.vadNoiseFloor = 0.008;
        state.vadAdaptiveThreshold = state.vadThreshold;
        state.vadScore = 0;
        state.vadTransientHoldUntil = 0;
        state.vadRecentVoicedFrames = 0;
        state.vadFastStartUntil = 0;
        state.vadVoiceDetected = false;
        state.vadSpeechSmoothed = 0;
        state.vadGateActive = false;
        state.vadGateOpenUntil = 0;
        state.vadGateCloseSince = 0;
        state.vadVoiceFrames = 0;
        state.vadSilenceFrames = 0;
        state.levelSmooth = 0;
        state.localBandBass = 0;
        state.localBandMid = 0;
        state.localBandTreble = 0;
        state.hiddenTransmitUntil = 0;
        dom.localLevelFill.style.width = '0%';
        dom.localOrb.style.setProperty('--orb-energy', '0');

        for (const [, peer] of state.peers.entries()) {
          ensurePeerMediaTracks(peer);
        }
      }

      function setupRemoteAnalyser(peer, stream) {
        if (!peer || !stream) return null;
        const remoteCtx = ensureRemoteAudioContext();
        if (!remoteCtx) return null;

        try {
          if (peer.remoteSourceNode) {
            try { peer.remoteSourceNode.disconnect(); } catch (_) {}
          }
          if (peer.remoteGainNode) {
            try { peer.remoteGainNode.disconnect(); } catch (_) {}
          }
          if (peer.remoteDestNode && typeof peer.remoteDestNode.disconnect === 'function') {
            try { peer.remoteDestNode.disconnect(); } catch (_) {}
          }
          if (peer.analyser) {
            try { peer.analyser.disconnect(); } catch (_) {}
          }
          const source = remoteCtx.createMediaStreamSource(stream);
          const gain = remoteCtx.createGain();
          gain.gain.value = 0;
          const analyser = remoteCtx.createAnalyser();
          analyser.fftSize = 512;
          analyser.smoothingTimeConstant = 0.68;
          source.connect(analyser);
          source.connect(gain);
          gain.connect(remoteCtx.destination);
          peer.remoteSourceNode = source;
          peer.remoteGainNode = gain;
          peer.remoteDestNode = null;
          peer.analyser = analyser;
          peer.analyserData = new Uint8Array(analyser.fftSize);
          peer.freqData = new Uint8Array(analyser.frequencyBinCount);
          return stream;
        } catch (_) {
          peer.remoteSourceNode = null;
          peer.remoteGainNode = null;
          peer.remoteDestNode = null;
          return null;
        }
      }

      function ensureRemoteAudioContext() {
        if (!state.remoteAudioContext) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          state.remoteAudioContext = new Ctx();
        }
        if (state.remoteAudioContext.state === 'suspended') {
          state.remoteAudioContext.resume().catch(() => {});
        }
        return state.remoteAudioContext;
      }

      async function restartLocalAudio(successMessage = '') {
        await ensureLocalAudio({ force: true });
        refreshDevices().catch(() => {});
        if (successMessage) showToast(successMessage);
        syncVoicePeers(true);
      }

      function loadExternalScript(url, marker) {
        if (!url) return Promise.resolve(false);
        const existing = document.querySelector(`script[data-ext-script="${marker}"]`);
        if (existing) {
          if (existing.dataset.loaded === '1') return Promise.resolve(true);
          return new Promise((resolve) => {
            const done = () => resolve(existing.dataset.loaded === '1');
            existing.addEventListener('load', done, { once: true });
            existing.addEventListener('error', () => resolve(false), { once: true });
            window.setTimeout(done, 5200);
          });
        }
        return new Promise((resolve) => {
          const script = document.createElement('script');
          script.src = url;
          script.async = true;
          script.crossOrigin = 'anonymous';
          script.dataset.extScript = marker;
          script.addEventListener('load', () => {
            script.dataset.loaded = '1';
            resolve(true);
          }, { once: true });
          script.addEventListener('error', () => resolve(false), { once: true });
          document.head.appendChild(script);
        });
      }

      async function ensureMlVadRuntime() {
        if (window.vad && window.vad.MicVAD) return true;
        if (mlVadRuntimePromise) return mlVadRuntimePromise;

        mlVadRuntimePromise = (async () => {
          const ortOk = await loadExternalScript(ML_VAD_ORT_URL, 'ml-vad-ort');
          if (!ortOk) return false;
          const vadOk = await loadExternalScript(ML_VAD_BUNDLE_URL, 'ml-vad-bundle');
          if (!vadOk) return false;
          return !!(window.vad && window.vad.MicVAD);
        })().catch(() => false);

        const ready = await mlVadRuntimePromise;
        if (!ready) {
          mlVadRuntimePromise = null;
        }
        return ready;
      }

      function buildVadMonitorStream() {
        if (!state.captureTrack || state.captureTrack.readyState !== 'live') return null;
        try {
          const monitorTrack = typeof state.captureTrack.clone === 'function'
            ? state.captureTrack.clone()
            : state.captureTrack;
          return new MediaStream([monitorTrack]);
        } catch (_) {
          return null;
        }
      }

      function deriveVadProbabilityThresholds() {
        const normalized = clamp((state.vadThreshold - 0.006) / (0.06 - 0.006), 0, 1);
        const positive = clamp(0.19 + (normalized * 0.26), 0.16, 0.52);
        const negative = clamp(positive - 0.1, 0.08, 0.42);
        return { positive, negative };
      }

      async function stopMlVad(resetState = true) {
        const instance = state.mlVad;
        state.mlVad = null;
        state.mlVadReady = false;

        if (instance) {
          try {
            if (typeof instance.pause === 'function') {
              await instance.pause();
            }
          } catch (_) {}
          try {
            if (typeof instance.destroy === 'function') {
              await instance.destroy();
            }
          } catch (_) {}
        }

        if (state.mlVadMonitorStream) {
          state.mlVadMonitorStream.getTracks().forEach((track) => {
            try { track.stop(); } catch (_) {}
          });
          state.mlVadMonitorStream = null;
        }

        if (resetState) {
          state.mlVadSpeechProb = 0;
          state.mlVadNoiseProb = 1;
          state.mlVadLastVoiceAt = 0;
          state.mlVadFallbackUntil = 0;
          state.vadSpeaking = false;
          state.vadVoiceDetected = false;
          state.vadSpeechSmoothed = 0;
          state.vadGateActive = false;
          state.vadGateOpenUntil = 0;
          state.vadGateCloseSince = 0;
        }
      }

      async function initMlVadForCurrentTrack() {
        if (state.mode !== 'vad') {
          await stopMlVad(false);
          return;
        }
        if (!state.captureTrack || state.captureTrack.readyState !== 'live') return;
        if (state.mlVadInitPromise) return state.mlVadInitPromise;

        state.mlVadInitPromise = (async () => {
          const runtimeReady = await ensureMlVadRuntime();
          if (!runtimeReady || !window.vad || !window.vad.MicVAD) {
            if (!state.mlVadErrorNotified) {
              state.mlVadErrorNotified = true;
              showToast('ML VAD недоступен, используем базовый режим');
            }
            return;
          }

          await stopMlVad(false);

          const monitorStream = buildVadMonitorStream();
          if (!monitorStream) return;

          const { positive, negative } = deriveVadProbabilityThresholds();
          state.mlVadPositiveThreshold = positive;
          state.mlVadNegativeThreshold = negative;
          state.mlVadMonitorStream = monitorStream;
          state.mlVadSpeechProb = 0;
          state.mlVadNoiseProb = 1;
          state.mlVadLastVoiceAt = 0;
          state.mlVadFallbackUntil = 0;

          const redemption = clamp(Math.round(state.vadHangoverMs * 1.05), 420, 2200);

          const instance = await window.vad.MicVAD.new({
            stream: monitorStream,
            model: 'v5',
            startOnLoad: true,
            baseAssetPath: ML_VAD_ASSET_BASE,
            onnxWASMBasePath: ML_VAD_ORT_BASE,
            positiveSpeechThreshold: positive,
            negativeSpeechThreshold: negative,
            redemptionMs: redemption,
            preSpeechPadMs: 160,
            minSpeechMs: 120,
            submitUserSpeechOnPause: false,
            pauseStream: async (stream) => {
              if (!stream) return;
              stream.getTracks().forEach((track) => {
                try { track.stop(); } catch (_) {}
              });
            },
            onFrameProcessed: (probs) => {
              const speech = clamp(Number(probs && probs.isSpeech), 0, 1);
              const noise = clamp(Number(probs && probs.notSpeech), 0, 1);
              state.mlVadSpeechProb = Number.isFinite(speech) ? speech : 0;
              state.mlVadNoiseProb = Number.isFinite(noise) ? noise : (1 - state.mlVadSpeechProb);
              if (state.mlVadSpeechProb >= state.mlVadNegativeThreshold) {
                state.mlVadLastVoiceAt = Date.now();
              }
            },
            onVADMisfire: () => {},
            onSpeechStart: () => {
              state.mlVadLastVoiceAt = Date.now();
            },
            onSpeechEnd: () => {}
          });

          state.mlVad = instance;
          state.mlVadReady = true;
          state.mlVadErrorNotified = false;
        })().catch(() => {
          if (!state.mlVadErrorNotified) {
            state.mlVadErrorNotified = true;
            showToast('Не удалось запустить ML VAD');
          }
        }).finally(() => {
          state.mlVadInitPromise = null;
        });

        return state.mlVadInitPromise;
      }

      function computeRmsFromByteData(data) {
        if (!data || !data.length) return 0;
        let sum = 0;
        for (let i = 0; i < data.length; i += 1) {
          const value = (data[i] - 128) / 128;
          sum += value * value;
        }
        return Math.sqrt(sum / data.length);
      }

      function startVadLoop() {
        if (state.vadTimer) return;
        const step = () => {
          const now = Date.now();
          if (state.joined && (now - state.lastAudioResumeAt > 1200)) {
            state.lastAudioResumeAt = now;
            tryResumeAudioContexts();
          }

          if (state.localAnalyser && state.localAnalyserData) {
            state.localAnalyser.getByteTimeDomainData(state.localAnalyserData);
            let sum = 0;
            for (let i = 0; i < state.localAnalyserData.length; i += 1) {
              const value = (state.localAnalyserData[i] - 128) / 128;
              sum += value * value;
            }

            const rms = Math.sqrt(sum / state.localAnalyserData.length);
            state.vadLevel = rms;
            const noiseAlpha = state.vadSpeaking ? 0.006 : 0.045;
            state.vadNoiseFloor = clamp((state.vadNoiseFloor * (1 - noiseAlpha)) + (rms * noiseAlpha), 0.0009, 0.045);
            state.vadAdaptiveThreshold = Math.max(state.vadThreshold, (state.vadNoiseFloor * 1.8) + 0.0012);

            let lowRatio = 0;
            let presenceRatio = 0;
            let highRatio = 0;

            if (state.localFreqData && state.localFreqData.length) {
              state.localAnalyser.getByteFrequencyData(state.localFreqData);
              const bins = state.localFreqData.length;
              const sampleRateHz = (state.localAudioContext && Number(state.localAudioContext.sampleRate)) || 48000;
              const binWidth = (sampleRateHz / 2) / bins;
              const lowEnd = Math.max(1, Math.floor(300 / binWidth));
              const midEnd = Math.max(lowEnd + 1, Math.floor(2800 / binWidth));
              const highEnd = Math.max(midEnd + 1, Math.floor(7600 / binWidth));
              let lowEnergy = 0;
              let midEnergy = 0;
              let highEnergy = 0;
              let totalEnergy = 0;

              for (let i = 0; i < bins; i += 1) {
                const amp = Number(state.localFreqData[i] || 0) / 255;
                const energy = amp * amp;
                totalEnergy += energy;
                if (i < lowEnd) lowEnergy += energy;
                else if (i < midEnd) midEnergy += energy;
                else if (i < highEnd) highEnergy += energy;
              }

              const safeTotal = Math.max(1e-7, totalEnergy);
              lowRatio = lowEnergy / safeTotal;
              presenceRatio = midEnergy / safeTotal;
              highRatio = highEnergy / safeTotal;
            }

            const effectiveHangover = document.visibilityState === 'hidden'
              ? Math.max(state.vadHangoverMs, 2400)
              : Math.max(state.vadHangoverMs, 520);

            let speaking = false;
            const { positive, negative } = deriveVadProbabilityThresholds();
            state.mlVadPositiveThreshold = positive;
            state.mlVadNegativeThreshold = negative;
            const speechHint = state.mlVadReady
              ? clamp(state.mlVadSpeechProb, 0, 1)
              : clamp(state.vadScore, 0, 1);
            const fastStartCandidate = rms >= Math.max(0.00045, state.vadNoiseFloor * 0.78)
              && presenceRatio >= 0.045
              && highRatio <= 0.93;

            if (state.mlVadReady) {
              const speechProb = speechHint;
              const holdByProbability = speechProb >= positive || (state.vadSpeaking && speechProb >= negative);
              if (speechProb >= (negative - 0.025)) {
                state.mlVadLastVoiceAt = now;
              }
              if (!state.vadSpeaking && fastStartCandidate && speechProb >= (negative - 0.055)) {
                state.vadFastStartUntil = Math.max(state.vadFastStartUntil, now + 280);
                state.mlVadLastVoiceAt = now;
              }
              const voiceBandGate = presenceRatio >= 0.06 && highRatio <= 0.9;
              const energyGate = rms >= Math.max(0.00055, state.vadNoiseFloor * 0.84)
                || speechProb >= (negative + 0.03);
              const linger = now - state.mlVadLastVoiceAt <= (effectiveHangover * 1.15);
              speaking = (holdByProbability || linger)
                && (energyGate || (speechProb >= (positive - 0.045) && voiceBandGate));
              state.vadScore = speechProb;
            } else {
              const openThreshold = Math.max(state.vadThreshold * 0.72, (state.vadNoiseFloor * 1.45) + 0.00085);
              const closeThreshold = openThreshold * 0.72;
              const fallbackVoice = rms >= openThreshold || (state.vadSpeaking && rms >= closeThreshold);
              if (fallbackVoice) {
                state.mlVadFallbackUntil = now + effectiveHangover;
                if (!state.vadSpeaking && fastStartCandidate) {
                  state.vadFastStartUntil = Math.max(state.vadFastStartUntil, now + 260);
                }
              }
              speaking = now <= state.mlVadFallbackUntil;
              state.vadScore = clamp((rms - closeThreshold) / 0.04, 0, 1);
            }
            if (!speaking && now < state.vadFastStartUntil) {
              speaking = true;
            }
            if (!speaking && now >= state.vadFastStartUntil) {
              state.vadFastStartUntil = 0;
            }
            state.vadVoiceDetected = speaking;
            if (speaking) {
              state.vadLastSpokeAt = now;
            }

            const speechProbNow = state.mlVadReady ? clamp(state.mlVadSpeechProb, 0, 1) : clamp(state.vadScore, 0, 1);
            const energyHint = clamp((rms - Math.max(0.00035, state.vadNoiseFloor * 0.66)) / 0.022, 0, 1);
            const spectralHint = clamp((presenceRatio * 1.05) - (highRatio * 0.28), 0, 1);
            const activityNow = clamp((speechProbNow * 0.78) + (energyHint * 0.14) + (spectralHint * 0.08), 0, 1);
            state.vadSpeechSmoothed = (state.vadSpeechSmoothed * 0.74) + (activityNow * 0.26);

            const gateOpenThreshold = state.mlVadReady ? 0.2 : 0.27;
            const gateCloseThreshold = state.mlVadReady ? 0.1 : 0.16;
            const minimumOpenMs = 420;
            const closeDebounceMs = 300;
            const tailHoldMs = Math.max(effectiveHangover, 760);

            if (!state.vadGateActive && (speaking || state.vadSpeechSmoothed >= gateOpenThreshold)) {
              state.vadGateActive = true;
              state.vadGateOpenUntil = now + minimumOpenMs;
              state.vadGateCloseSince = 0;
            }

            if (state.vadGateActive) {
              state.vadGateOpenUntil = Math.max(state.vadGateOpenUntil, state.vadLastSpokeAt + tailHoldMs);
              const mustHold = now < state.vadGateOpenUntil || speaking;
              if (mustHold) {
                state.vadGateCloseSince = 0;
              } else {
                const wantsClose = state.vadSpeechSmoothed <= gateCloseThreshold;
                if (wantsClose) {
                  if (!state.vadGateCloseSince) state.vadGateCloseSince = now;
                  if (now - state.vadGateCloseSince >= closeDebounceMs) {
                    state.vadGateActive = false;
                    state.vadGateCloseSince = 0;
                  }
                } else {
                  state.vadGateCloseSince = 0;
                }
              }
            }

            state.vadSpeaking = state.vadGateActive;

            if (state.vadSpeaking && document.visibilityState === 'hidden') {
              state.hiddenTransmitUntil = Math.max(state.hiddenTransmitUntil, now + 2200);
            }

            const meterFromSignal = clamp((rms - Math.max(0.0008, state.vadNoiseFloor * 0.72)) / 0.04, 0, 1);
            const meterFromModel = state.mlVadReady ? clamp(state.mlVadSpeechProb, 0, 1) : clamp(state.vadScore, 0, 1);
            const rawMeter = Math.max(meterFromSignal, meterFromModel * 0.78);
            state.levelSmooth = (state.levelSmooth * 0.78) + (rawMeter * 0.22);
            const targetBass = clamp(Math.sqrt(Math.max(0, lowRatio)) * 1.08, 0, 1);
            const targetMid = clamp(Math.sqrt(Math.max(0, presenceRatio)) * 1.26, 0, 1);
            const targetTreble = clamp(Math.sqrt(Math.max(0, highRatio)) * 1.18, 0, 1);
            state.localBandBass = (state.localBandBass * 0.72) + (targetBass * 0.28);
            state.localBandMid = (state.localBandMid * 0.72) + (targetMid * 0.28);
            state.localBandTreble = (state.localBandTreble * 0.72) + (targetTreble * 0.28);
            const meter = clamp(state.levelSmooth, 0, 1);
            dom.localLevelFill.style.width = `${Math.round(meter * 100)}%`;
            dom.localOrb.style.setProperty('--orb-energy', String(meter.toFixed(3)));
          } else {
            state.levelSmooth = state.levelSmooth * 0.84;
            state.localBandBass = state.localBandBass * 0.84;
            state.localBandMid = state.localBandMid * 0.84;
            state.localBandTreble = state.localBandTreble * 0.84;
            const meter = clamp(state.levelSmooth, 0, 1);
            dom.localLevelFill.style.width = `${Math.round(meter * 100)}%`;
            dom.localOrb.style.setProperty('--orb-energy', String(meter.toFixed(3)));
          }

          let changedRemote = false;
          const nowTs = Date.now();
          for (const [id, peer] of state.peers.entries()) {
            if (!peer || !peer.analyser || !peer.analyserData) continue;
            peer.analyser.getByteTimeDomainData(peer.analyserData);
            const rms = computeRmsFromByteData(peer.analyserData);
            peer.remoteLevel = (Number(peer.remoteLevel || 0) * 0.72) + (rms * 0.28);
            const person = state.participants.get(id);
            if (!person) continue;
            const wasSpeaking = Number(person.speakingUntil || 0) > nowTs;
            const levelForUi = Number(peer.remoteLevel || 0);
            person.level = levelForUi;
            let bandBass = clamp(Math.sqrt(clamp(levelForUi / 0.055, 0, 1)) * 0.92, 0, 1);
            let bandMid = clamp(Math.sqrt(clamp(levelForUi / 0.05, 0, 1)) * 1.04, 0, 1);
            let bandTreble = clamp(Math.sqrt(clamp(levelForUi / 0.045, 0, 1)) * 0.86, 0, 1);

            if (peer.freqData && peer.freqData.length && state.remoteAudioContext) {
              peer.analyser.getByteFrequencyData(peer.freqData);
              const bins = peer.freqData.length;
              const sampleRateHz = Number(state.remoteAudioContext.sampleRate) || 48000;
              const binWidth = (sampleRateHz / 2) / bins;
              const lowEnd = Math.max(2, Math.floor(320 / binWidth));
              const midEnd = Math.max(lowEnd + 2, Math.floor(1900 / binWidth));
              const highEnd = Math.max(midEnd + 2, Math.floor(5600 / binWidth));
              let bassEnergy = 0;
              let midEnergy = 0;
              let trebleEnergy = 0;
              for (let i = 0; i < bins; i += 1) {
                const amp = Number(peer.freqData[i] || 0) / 255;
                const energy = amp * amp;
                if (i < lowEnd) bassEnergy += energy;
                else if (i < midEnd) midEnergy += energy;
                else if (i < highEnd) trebleEnergy += energy;
              }
              const bassNorm = Math.sqrt(bassEnergy / Math.max(1, lowEnd));
              const midNorm = Math.sqrt(midEnergy / Math.max(1, midEnd - lowEnd));
              const trebleNorm = Math.sqrt(trebleEnergy / Math.max(1, highEnd - midEnd));
              bandBass = clamp(bassNorm * 2.85, 0, 1);
              bandMid = clamp(midNorm * 3.2, 0, 1);
              bandTreble = clamp(trebleNorm * 3.4, 0, 1);
            }

            person.bandBass = (Number(person.bandBass || 0) * 0.7) + (bandBass * 0.3);
            person.bandMid = (Number(person.bandMid || 0) * 0.7) + (bandMid * 0.3);
            person.bandTreble = (Number(person.bandTreble || 0) * 0.7) + (bandTreble * 0.3);
