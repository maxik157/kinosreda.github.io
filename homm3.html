<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Киносреда | HoMM3</title>
  <script>
    (function () {
      try {
        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
          location.replace("login.html");
          return;
        }
        document.documentElement.classList.add("authed");
      } catch (_) {
        location.replace("login.html");
      }
    })();
  </script>
  <script src="coi-serviceworker.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040506;
      --bg-warm: #120d07;
      --panel: rgba(14, 11, 8, 0.88);
      --panel-strong: rgba(10, 8, 6, 0.94);
      --line: rgba(245, 158, 11, 0.26);
      --line-strong: rgba(245, 158, 11, 0.46);
      --text: #fff7e8;
      --text-dim: #d7c49c;
      --accent: #f59e0b;
      --ok: #86efac;
      --warn: #fca5a5;
      --shadow: 0 26px 60px rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html:not(.authed) body { visibility: hidden; }

    body {
      color: var(--text);
      font-family: "Comfortaa", cursive;
      background:
        radial-gradient(circle at 18% 0%, rgba(245, 158, 11, 0.18), transparent 34%),
        radial-gradient(circle at 82% 8%, rgba(252, 211, 77, 0.12), transparent 32%),
        linear-gradient(145deg, var(--bg) 0%, var(--bg-warm) 100%);
      transition: background 0.24s ease;
    }

    body.game-active {
      background: #000;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
    }

    .welcome-screen,
    .game-screen {
      position: absolute;
      inset: 0;
    }

    .welcome-screen {
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 36px);
      transition: opacity 0.26s ease, transform 0.26s ease;
      z-index: 20;
    }

    .welcome-screen.hidden {
      opacity: 0;
      transform: scale(0.985);
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-card {
      width: min(100%, 920px);
      padding: clamp(24px, 4.4vw, 42px);
      border-radius: 28px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at top right, rgba(245, 158, 11, 0.12), transparent 34%),
        linear-gradient(180deg, rgba(20, 15, 10, 0.96), rgba(7, 6, 5, 0.98));
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      display: grid;
      gap: 22px;
      overflow: hidden;
      position: relative;
    }

    .welcome-card::before {
      content: "";
      position: absolute;
      inset: auto auto -120px -80px;
      width: 260px;
      height: 260px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.18), transparent 70%);
      pointer-events: none;
    }

    .hero-title {
      margin: 0;
      font: 700 clamp(34px, 5.2vw, 62px)/0.96 "Cinzel", serif;
      letter-spacing: 0.05em;
      color: #fcd34d;
      text-shadow: 0 0 28px rgba(245, 158, 11, 0.24);
    }

    .status-block {
      display: grid;
      gap: 10px;
    }

    .status-text {
      margin: 0;
      min-height: 1.4em;
      color: var(--text);
      font-size: 15px;
      line-height: 1.45;
    }

    .status-detail {
      margin: 0;
      min-height: 1.45em;
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.5;
    }

    .progress {
      width: 100%;
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      border: 1px solid rgba(245, 158, 11, 0.24);
      background: rgba(7, 6, 5, 0.72);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.96), rgba(252, 211, 77, 0.9));
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.28);
      transition: width 0.24s ease;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .btn {
      min-height: 52px;
      padding: 14px 22px;
      border-radius: 15px;
      border: 1px solid var(--line-strong);
      background: linear-gradient(150deg, rgba(245, 158, 11, 0.2), rgba(252, 211, 77, 0.08));
      color: var(--text);
      font: 700 14px/1 "Comfortaa", cursive;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn.ghost {
      border-color: var(--line);
      background: rgba(9, 7, 5, 0.82);
    }

    .game-screen {
      background: #000;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s ease;
      z-index: 10;
    }

    .game-screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .runtime {
      position: absolute;
      inset: 0;
      background: #000;
    }

    .runtime iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .runtime-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 34px);
      background:
        radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.14), transparent 30%),
        rgba(3, 4, 6, 0.92);
    }

    .runtime-overlay.hidden {
      display: none !important;
    }

    .runtime-panel {
      width: min(100%, 520px);
      padding: 22px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: rgba(8, 7, 5, 0.88);
      box-shadow: var(--shadow);
      text-align: center;
      display: grid;
      gap: 12px;
    }

    .runtime-badge {
      width: 76px;
      height: 76px;
      margin: 0 auto 4px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(245, 158, 11, 0.34);
      background: rgba(245, 158, 11, 0.08);
      color: #fcd34d;
      font: 700 34px/1 "Cinzel", serif;
    }

    .runtime-title {
      margin: 0;
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
    }

    .runtime-copy {
      margin: 0;
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.5;
      min-height: 1.45em;
    }

    .floating-actions {
      position: absolute;
      top: max(18px, env(safe-area-inset-top, 0px) + 18px);
      right: max(18px, env(safe-area-inset-right, 0px) + 18px);
      z-index: 3;
      display: flex;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .floating-actions.active {
      opacity: 1;
      pointer-events: auto;
    }

    .floating-btn {
      width: 50px;
      height: 50px;
      min-width: 50px;
      min-height: 50px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(8, 9, 11, 0.82);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
    }

    .floating-btn:hover { transform: translateY(-1px); }

    .floating-btn svg {
      width: 20px;
      height: 20px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .hidden { display: none !important; }

    @media (max-width: 720px) {
      .welcome-card {
        border-radius: 24px;
        gap: 18px;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }

      .floating-actions {
        top: auto;
        right: 14px;
        bottom: max(14px, env(safe-area-inset-bottom, 0px) + 14px);
      }

      .floating-btn {
        min-height: 44px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="welcomeScreen" class="welcome-screen">
      <div class="welcome-card">
        <div>
          <h1 class="hero-title">Heroes of Might and Magic III</h1>
        </div>

        <div class="status-block">
          <p id="statusText" class="status-text">Проверяем локальную библиотеку Heroes III...</p>
          <p id="statusDetail" class="status-detail"></p>
          <div class="progress" aria-hidden="true">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>

        <div class="actions">
          <button id="launchBtn" class="btn hidden" type="button">Играть</button>
          <button id="retryBtn" class="btn ghost hidden" type="button">Повторить</button>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="game-screen" aria-live="polite">
      <div id="runtimeWrap" class="runtime">
        <iframe
          id="runtimeFrame"
          title="HoMM3 Runtime"
          allow="autoplay; clipboard-write; fullscreen; gamepad"
          allowfullscreen
          hidden
        ></iframe>
        <div id="runtimeOverlay" class="runtime-overlay hidden">
          <div class="runtime-panel">
            <div class="runtime-badge">III</div>
            <p id="runtimeOverlayText" class="runtime-title">Подготавливаем Heroes III...</p>
            <p id="runtimeOverlayDetail" class="runtime-copy"></p>
            <div class="progress" aria-hidden="true">
              <div id="runtimeProgressFill" class="progress-fill"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="floatingActions" class="floating-actions">
        <button id="fullscreenBtn" class="floating-btn" type="button" aria-label="Полный экран" title="Полный экран">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 3H5a2 2 0 0 0-2 2v4"></path>
            <path d="M15 3h4a2 2 0 0 1 2 2v4"></path>
            <path d="M3 15v4a2 2 0 0 0 2 2h4"></path>
            <path d="M21 15v4a2 2 0 0 1-2 2h-4"></path>
          </svg>
        </button>
      </div>
    </section>
  </div>

  <script type="module">
    import WebTorrent from "./vendor/webtorrent.min.js";
    import {
      VCMI_OPFS_ROOT,
      clearDirectories,
      listFiles,
      repairMetadata,
      writeFile
    } from "./homm3-runtime/opfs.js";

    const VERSION = "20260528-13";
    const LIBRARY_STAMP = "homm3rus.3-opfs";
    const LIBRARY_MARKER_KEY = "kinosreda.homm3.libraryStamp";
    const LIBRARY_PENDING_KEY = "kinosreda.homm3.libraryPending";
    const REQUIRED_LIBRARY_FILES = ["Data/H3bitmap.lod", "Data/H3sprite.lod", "Data/Heroes3.snd"];
    const TARGET_PREFIXES = ["Data", "Maps", "Mp3"];
    const PREFIX_ORDER = new Map(TARGET_PREFIXES.map((value, index) => [value.toLowerCase(), index]));
    const MAGNET_URI = "magnet:?xt=urn:btih:615755761c866dfaeb4e7c8a46db6f28bf9bfce2&dn=homm3rus&tr=wss%3A%2F%2Fcloud.dos.zone%3A8444%2Fannounce-ws&xs=https%3A%2F%2Fbr.cdn.dos.zone%2Flauncher%2Fhomm3rus.3.torrent";
    const params = new URLSearchParams(location.search);
    const DEFAULT_API_BASE = "https://realtime.xn--80ahcljthqi.xn--p1ai";
    const API_BASE_STORAGE_KEY = "kinosreda.homm3.apiBase";

    const els = {
      welcomeScreen: document.getElementById("welcomeScreen"),
      statusText: document.getElementById("statusText"),
      statusDetail: document.getElementById("statusDetail"),
      progressFill: document.getElementById("progressFill"),
      launchBtn: document.getElementById("launchBtn"),
      retryBtn: document.getElementById("retryBtn"),
      gameScreen: document.getElementById("gameScreen"),
      floatingActions: document.getElementById("floatingActions"),
      fullscreenBtn: document.getElementById("fullscreenBtn"),
      runtimeWrap: document.getElementById("runtimeWrap"),
      runtimeFrame: document.getElementById("runtimeFrame"),
      runtimeOverlay: document.getElementById("runtimeOverlay"),
      runtimeOverlayText: document.getElementById("runtimeOverlayText"),
      runtimeOverlayDetail: document.getElementById("runtimeOverlayDetail"),
      runtimeProgressFill: document.getElementById("runtimeProgressFill")
    };

    const state = {
      apiBase: resolveApiBase(),
      profile: resolveProfile(),
      installReady: false,
      installing: false,
      runtimeOpen: false,
      launchRequested: false,
      client: null,
      torrent: null,
      wantedFiles: [],
      wantedBytes: 0,
      currentFileLabel: "",
      progressMessage: "",
      lastError: ""
    };

    function runtimeIsolationReady() {
      return !!window.crossOriginIsolated;
    }

    function runtimeIsolationMessage() {
      return "Страница HoMM3 ещё не перешла в изолированный режим браузера. Обновите вкладку и попробуйте снова.";
    }

    function normalizeApiBase(value) {
      return String(value || "").trim().replace(/\/+$/, "");
    }

    function resolveApiBase() {
      const explicit = normalizeApiBase(params.get("apiBase"));
      if (explicit) {
        localStorage.setItem(API_BASE_STORAGE_KEY, explicit);
        return explicit;
      }
      const stored = normalizeApiBase(localStorage.getItem(API_BASE_STORAGE_KEY));
      return stored || DEFAULT_API_BASE;
    }

    function resolveProfile() {
      try {
        const currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");
        const value = currentUser && (currentUser.name || currentUser.username);
        if (value) {
          const profile = String(value).trim();
          localStorage.setItem("kinosreda.homm3.profile", profile);
          return profile;
        }
      } catch (_) {}
      return String(localStorage.getItem("kinosreda.homm3.profile") || "").trim();
    }

    function normalizePath(value) {
      return String(value || "")
        .replaceAll("\\", "/")
        .replace(/\/+/g, "/")
        .replace(/^\/+/, "")
        .trim();
    }

    function setProgress(value) {
      const ratio = Math.max(0, Math.min(1, Number(value) || 0));
      const percent = ratio <= 0 ? 0 : Math.max(3, ratio * 100);
      const width = `${percent}%`;
      els.progressFill.style.width = width;
      els.runtimeProgressFill.style.width = width;
    }

    function setStatus(text, detail = "", progress = 0) {
      const safeText = String(text || "").trim();
      const safeDetail = String(detail || "").trim();
      els.statusText.textContent = safeText;
      els.statusDetail.textContent = safeDetail;
      els.runtimeOverlayText.textContent = safeText || "Подготавливаем Heroes III...";
      els.runtimeOverlayDetail.textContent = safeDetail;
      setProgress(progress);
    }

    function showWelcomeScreen() {
      document.body.classList.remove("game-active");
      els.welcomeScreen.classList.remove("hidden");
      els.gameScreen.classList.remove("active");
      els.floatingActions.classList.remove("active");
    }

    function showGameScreen() {
      document.body.classList.add("game-active");
      els.welcomeScreen.classList.add("hidden");
      els.gameScreen.classList.add("active");
      els.floatingActions.classList.toggle("active", state.launchRequested || state.runtimeOpen);
    }

    function resetRuntimeFrame() {
      els.runtimeFrame.hidden = true;
      els.runtimeFrame.removeAttribute("src");
      els.runtimeOverlay.classList.add("hidden");
    }

    function syncUi() {
      const canLaunch = !!state.profile && state.installReady && runtimeIsolationReady() && !state.installing;
      els.launchBtn.disabled = !canLaunch;
      els.launchBtn.classList.toggle("hidden", !canLaunch);
      els.retryBtn.classList.toggle("hidden", !state.lastError || state.installing);
      if (state.launchRequested || state.runtimeOpen) {
        showGameScreen();
      } else {
        showWelcomeScreen();
      }
    }

    function formatBytes(value) {
      const size = Number(value || 0);
      if (!Number.isFinite(size) || size <= 0) {
        return "0 B";
      }
      const units = ["B", "KB", "MB", "GB"];
      let current = size;
      let index = 0;
      while (current >= 1024 && index < units.length - 1) {
        current /= 1024;
        index += 1;
      }
      const fixed = current >= 100 || index === 0 ? 0 : 1;
      return `${current.toFixed(fixed)} ${units[index]}`;
    }

    function setLibraryMarker(isReady) {
      if (isReady) {
        localStorage.setItem(LIBRARY_MARKER_KEY, LIBRARY_STAMP);
        localStorage.removeItem(LIBRARY_PENDING_KEY);
      } else {
        localStorage.removeItem(LIBRARY_MARKER_KEY);
      }
    }

    function extractTargetPrefix(relativePath) {
      const normalized = normalizePath(relativePath);
      const match = normalized.match(/^(Data|Maps|Mp3)\//i);
      return match ? match[1] : "";
    }

    function extractTorrentRelativePath(torrentPath) {
      const normalized = normalizePath(torrentPath);
      const match = normalized.match(/(?:^|\/)((?:Data|Maps|Mp3)\/.+)$/i);
      return match ? normalizePath(match[1]) : "";
    }

    function libraryMarkerMatches() {
      return String(localStorage.getItem(LIBRARY_MARKER_KEY) || "").trim() === LIBRARY_STAMP;
    }

    async function inspectLocalLibrary() {
      let files = await listFiles(VCMI_OPFS_ROOT);
      if (!files.length) {
        const repaired = await repairMetadata(VCMI_OPFS_ROOT);
        if (repaired.fileCount > 0) {
          files = await listFiles(VCMI_OPFS_ROOT);
        }
      }
      const libraryFiles = files.filter((entry) => extractTargetPrefix(entry.path));
      const fileSet = new Set(libraryFiles.map((entry) => normalizePath(entry.path).toLowerCase()));
      const requiredPresent = REQUIRED_LIBRARY_FILES.every((file) => fileSet.has(file.toLowerCase()));
      const prefixesPresent = TARGET_PREFIXES.every((prefix) =>
        libraryFiles.some((entry) => normalizePath(entry.path).startsWith(`${prefix}/`))
      );
      const enoughFiles = libraryFiles.length >= 40;
      const ready = requiredPresent && prefixesPresent && (libraryMarkerMatches() || enoughFiles);
      return {
        ready,
        fileCount: libraryFiles.length
      };
    }

    function renderDownloadProgress() {
      const total = state.wantedBytes;
      const downloaded = state.wantedFiles.reduce((sum, file) => sum + Number(file.downloaded || 0), 0);
      const ratio = total > 0 ? Math.min(1, downloaded / total) : 0;
      const percent = (ratio * 100).toFixed(1);
      const peers = state.torrent ? Number(state.torrent.numPeers || 0) : 0;
      const peersText = peers > 0 ? ` • пиров: ${peers}` : "";
      const fileText = state.currentFileLabel ? ` • ${state.currentFileLabel}` : "";
      setStatus(
        state.progressMessage || "Скачиваем Heroes III...",
        `${percent}% • ${formatBytes(downloaded)} / ${formatBytes(total)}${peersText}${fileText}`,
        ratio
      );
    }

    function destroyTorrentClient() {
      const client = state.client;
      state.client = null;
      state.torrent = null;
      state.wantedFiles = [];
      state.wantedBytes = 0;
      state.currentFileLabel = "";
      if (!client || typeof client.destroy !== "function") {
        return Promise.resolve();
      }
      return new Promise((resolve) => {
        try {
          client.destroy(() => resolve());
        } catch (_) {
          resolve();
        }
      });
    }

    function ensureTorrentSupport() {
      if (!WebTorrent) {
        throw new Error("WebTorrent не загрузился на странице HoMM3.");
      }
      if (WebTorrent.WEBRTC_SUPPORT === false) {
        throw new Error("Этот браузер не поддерживает WebRTC для локальной загрузки HoMM3.");
      }
    }

    function createTorrentClient() {
      const client = new WebTorrent();
      client.on("error", (error) => {
        console.error(error);
      });
      return client;
    }

    function addTorrent(client, torrentId) {
      return new Promise((resolve, reject) => {
        let settled = false;
        const timeoutId = setTimeout(() => {
          if (settled) {
            return;
          }
          settled = true;
          cleanup();
          reject(new Error("Не удалось получить метаданные Heroes III из сети."));
        }, 45000);
        const cleanup = () => {
          clearTimeout(timeoutId);
          client.removeListener("error", onError);
        };
        const onError = (error) => {
          if (settled) {
            return;
          }
          settled = true;
          cleanup();
          reject(error);
        };
        client.on("error", onError);
        try {
          client.add(torrentId, { announce: ["wss://cloud.dos.zone:8444/announce-ws"] }, (torrent) => {
            if (settled) {
              return;
            }
            settled = true;
            cleanup();
            resolve(torrent);
          });
        } catch (error) {
          settled = true;
          cleanup();
          reject(error);
        }
      });
    }

    function collectWantedFiles(torrent) {
      return torrent.files
        .map((file) => ({
          file,
          relativePath: extractTorrentRelativePath(file.path),
          prefix: extractTargetPrefix(extractTorrentRelativePath(file.path))
        }))
        .filter((entry) => entry.relativePath && entry.prefix)
        .sort((left, right) => {
          const leftIndex = PREFIX_ORDER.get(left.prefix.toLowerCase()) ?? 99;
          const rightIndex = PREFIX_ORDER.get(right.prefix.toLowerCase()) ?? 99;
          if (leftIndex !== rightIndex) {
            return leftIndex - rightIndex;
          }
          return left.relativePath.localeCompare(right.relativePath, "ru");
        });
    }

    async function writeTorrentFile(targetFile, relativePath) {
      const bytes = new Uint8Array(await targetFile.arrayBuffer());
      await writeFile(VCMI_OPFS_ROOT, relativePath, bytes);
    }

    function buildRuntimeSrc() {
      const runtimeParams = new URLSearchParams();
      runtimeParams.set("v", VERSION);
      runtimeParams.set("apiBase", state.apiBase);
      if (state.profile) {
        runtimeParams.set("profile", state.profile);
      }
      return `homm3-runtime/index.html?${runtimeParams.toString()}`;
    }

    function maybeOpenRuntime() {
      if (!state.launchRequested || state.runtimeOpen || !state.installReady) {
        return;
      }
      if (!runtimeIsolationReady()) {
        state.launchRequested = false;
        state.lastError = runtimeIsolationMessage();
        setStatus("HoMM3 пока не может запуститься.", state.lastError, 1);
        syncUi();
        return;
      }
      state.runtimeOpen = true;
      state.lastError = "";
      els.runtimeFrame.hidden = false;
      els.runtimeFrame.src = buildRuntimeSrc();
      setStatus("Запускаем HoMM3...", "Подключаем игровой runtime VCMI.", 1);
      syncUi();
    }

    async function installLibraryLocally() {
      if (state.installing) {
        return;
      }

      ensureTorrentSupport();
      state.installing = true;
      state.installReady = false;
      state.lastError = "";
      syncUi();
      state.progressMessage = "Подключаем локальную загрузку Heroes III...";
      setStatus(state.progressMessage, "", 0.03);
      localStorage.setItem(LIBRARY_PENDING_KEY, "1");
      setLibraryMarker(false);

      await destroyTorrentClient();
      await clearDirectories(VCMI_OPFS_ROOT, TARGET_PREFIXES);

      try {
        const client = createTorrentClient();
        state.client = client;
        const torrent = await addTorrent(client, MAGNET_URI);
        state.torrent = torrent;

        const wanted = collectWantedFiles(torrent);
        if (!wanted.length) {
          throw new Error("Не удалось найти игровые файлы Heroes III в источнике загрузки.");
        }

        state.wantedFiles = wanted.map((entry) => entry.file);
        state.wantedBytes = wanted.reduce((sum, entry) => sum + Number(entry.file.length || 0), 0);
        state.progressMessage = "Скачиваем Heroes III в локальное хранилище браузера...";
        renderDownloadProgress();

        const onDownload = () => {
          if (state.installing) {
            renderDownloadProgress();
          }
        };
        torrent.on("download", onDownload);
        torrent.on("warning", (error) => {
          console.warn(error);
        });

        for (let index = 0; index < wanted.length; index += 1) {
          const entry = wanted[index];
          state.currentFileLabel = `${index + 1}/${wanted.length} • ${entry.relativePath.split("/").pop()}`;
          state.progressMessage = "Сохраняем файлы Heroes III локально...";
          renderDownloadProgress();
          await writeTorrentFile(entry.file, entry.relativePath);
        }

        torrent.removeListener("download", onDownload);

        const localLibrary = await inspectLocalLibrary();
        if (!localLibrary.ready) {
          throw new Error("Загрузка завершилась, но локальная библиотека Heroes III получилась неполной.");
        }

        setLibraryMarker(true);
        state.installReady = true;
        state.installing = false;
        state.lastError = "";
        if (runtimeIsolationReady()) {
          setStatus("Файлы Heroes III готовы.", "Нажмите «Играть», чтобы открыть HoMM3.", 1);
        } else {
          setStatus("Файлы Heroes III готовы.", runtimeIsolationMessage(), 1);
        }
        await destroyTorrentClient();
      } catch (error) {
        console.error(error);
        state.installing = false;
        state.installReady = false;
        state.lastError = error && error.message ? error.message : "Не удалось скачать Heroes III.";
        setStatus(state.lastError, "Нажмите «Повторить», чтобы попробовать ещё раз.", 0);
        if (state.launchRequested && !state.runtimeOpen) {
          state.launchRequested = false;
        }
        await destroyTorrentClient();
      } finally {
        syncUi();
        maybeOpenRuntime();
      }
    }

    async function requestRuntimeFullscreen() {
      if (els.runtimeWrap && typeof els.runtimeWrap.requestFullscreen === "function") {
        await els.runtimeWrap.requestFullscreen();
      }
    }

    async function hydrateUi() {
      if (!state.profile) {
        state.lastError = "Не удалось определить профиль HoMM3.";
        setStatus("HoMM3 пока недоступна.", state.lastError, 0);
        syncUi();
        return;
      }

      const localLibrary = await inspectLocalLibrary();
      if (localLibrary.ready) {
        state.installReady = true;
        state.lastError = "";
        setLibraryMarker(true);
        if (runtimeIsolationReady()) {
          setStatus("Файлы Heroes III уже подготовлены.", "Нажмите «Играть», чтобы открыть HoMM3.", 1);
        } else {
          setStatus("Файлы Heroes III уже подготовлены.", runtimeIsolationMessage(), 1);
        }
        syncUi();
        return;
      }

      state.installReady = false;
      setStatus("Подготавливаем локальную библиотеку Heroes III...", "Файлы игры будут сохранены в браузере автоматически.", 0.03);
      syncUi();
      await installLibraryLocally();
    }

    els.launchBtn.addEventListener("click", () => {
      state.lastError = "";
      state.launchRequested = true;
      syncUi();
      maybeOpenRuntime();
    });

    els.fullscreenBtn.addEventListener("click", () => {
      requestRuntimeFullscreen().catch(() => {});
    });

    els.retryBtn.addEventListener("click", () => {
      installLibraryLocally().catch((error) => {
        console.error(error);
      });
    });

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || typeof data !== "object") {
        return;
      }
      if (data.type === "homm3-runtime-status") {
        const text = String(data.text || "").trim();
        if (text) {
          els.statusText.textContent = text;
          els.runtimeOverlayText.textContent = text;
        }
        return;
      }
      if (data.type === "homm3-runtime-ready") {
        els.runtimeOverlay.classList.add("hidden");
        return;
      }
      if (data.type === "homm3-runtime-exit") {
        state.runtimeOpen = false;
        state.launchRequested = false;
        resetRuntimeFrame();
        setStatus(String(data.text || "HoMM3 закрыта."), "Нажмите «Играть», чтобы запустить снова.", 1);
        syncUi();
      }
    });

    window.addEventListener("beforeunload", () => {
      destroyTorrentClient().catch(() => {});
    });

    hydrateUi().catch((error) => {
      console.error(error);
      state.lastError = error && error.message ? error.message : "Не удалось подготовить HoMM3.";
      setStatus(state.lastError, "Нажмите «Повторить», чтобы попробовать ещё раз.", 0);
      syncUi();
    });
  </script>
</body>
</html>
