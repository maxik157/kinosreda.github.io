<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Theater | Kinosreda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #000000;
      --bg-1: #060606;
      --panel: rgba(13, 13, 13, 0.84);
      --panel-strong: rgba(10, 10, 10, 0.95);
      --stroke: rgba(245, 158, 11, 0.24);
      --text: #f8fafc;
      --muted: #b9bfcc;
      --accent: #f59e0b;
      --accent-2: #fcd34d;
      --good: #45d19b;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.48);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100%;
      color: var(--text);
      font-family: "Comfortaa", cursive;
      background: radial-gradient(circle at 12% 14%, rgba(245, 158, 11, 0.14) 0%, transparent 42%),
        radial-gradient(circle at 88% 18%, rgba(251, 191, 36, 0.12) 0%, transparent 35%),
        linear-gradient(150deg, var(--bg-0), var(--bg-1));
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.55;
      z-index: 0;
      animation: grainShift 7s steps(8) infinite;
    }

    @keyframes grainShift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1%, 1%); }
      50% { transform: translate(1%, -0.5%); }
      75% { transform: translate(0.5%, 1%); }
      100% { transform: translate(0, 0); }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      animation: floatOrb 13s ease-in-out infinite;
    }

    .orb-a {
      width: 280px;
      height: 280px;
      left: -80px;
      top: 8%;
      background: rgba(245, 158, 11, 0.32);
    }

    .orb-b {
      width: 340px;
      height: 340px;
      right: -130px;
      top: 38%;
      background: rgba(251, 191, 36, 0.28);
      animation-delay: -4s;
    }

    .orb-c {
      width: 250px;
      height: 250px;
      left: 38%;
      bottom: -90px;
      background: rgba(245, 158, 11, 0.2);
      animation-delay: -8s;
    }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-24px) translateX(10px); }
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 8px 10px;
      display: grid;
      gap: 0;
      height: 100dvh;
      min-height: 100dvh;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 0fr);
      gap: 0;
      align-items: stretch;
      height: 100%;
      min-height: 0;
      flex: 1;
      width: 100%;
      transition: grid-template-columns 0.42s cubic-bezier(0.2, 0.9, 0.2, 1), gap 0.3s ease;
    }

    .layout.is-details-open {
      grid-template-columns: minmax(520px, 1.06fr) minmax(360px, 0.94fr);
      gap: 10px;
    }

    .panel {
      border-radius: var(--radius);
      border: 1px solid var(--stroke);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    .discover {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      animation: reveal 1s ease both;
      animation-delay: 0.1s;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    .discover-head {
      display: none;
      padding: 22px 22px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .discover-head.has-back {
      display: block;
    }

    .discover-head-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .head-back-btn {
      border: 1px solid rgba(245, 158, 11, 0.36);
      background: rgba(245, 158, 11, 0.12);
      color: #fde68a;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: inherit;
      display: none;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }

    .head-back-btn::before {
      content: "←";
      font-size: 0.95rem;
      line-height: 1;
    }

    .head-back-btn.visible {
      display: inline-flex;
    }

    .head-back-btn:hover {
      transform: translateY(-1px);
      background: rgba(245, 158, 11, 0.2);
      border-color: rgba(245, 158, 11, 0.52);
    }

    .discover-head p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .search-wrap {
      padding: 16px 22px;
      display: grid;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(8, 12, 11, 0.86);
      color: var(--text);
      font-family: "Comfortaa", cursive;
      padding: 13px 14px;
      border-radius: 14px;
      outline: none;
      font-size: 0.97rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input::placeholder {
      font-family: "Comfortaa", cursive;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(244, 190, 80, 0.15);
    }

    .btn-main {
      border: none;
      background: linear-gradient(130deg, var(--accent), #f0a82d);
      color: #241b0e;
      font-family: "Comfortaa", cursive;
      font-weight: 800;
      padding: 0 16px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.95rem;
      min-width: 114px;
      transition: transform 0.24s ease, filter 0.24s ease;
    }

    .btn-main:hover {
      transform: translateY(-1px) scale(1.01);
      filter: brightness(1.02);
    }

    .mode-switch {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-btn {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-family: "Comfortaa", cursive;
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 0.83rem;
      transition: all 0.22s ease;
    }

    .mode-btn.active {
      border-color: rgba(245, 190, 80, 0.68);
      background: rgba(245, 190, 80, 0.16);
      color: #ffe6a8;
      box-shadow: 0 8px 18px rgba(245, 190, 80, 0.18);
    }

    .results {
      padding: 16px 18px 20px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      align-content: start;
      grid-auto-rows: max-content;
      min-height: 0;
      height: 100%;
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(245, 190, 80, 0.55) transparent;
    }

    .results[data-view="search"] {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .results::-webkit-scrollbar {
      width: 8px;
    }

    .results::-webkit-scrollbar-thumb {
      background: rgba(245, 190, 80, 0.58);
      border-radius: 999px;
    }

    .movie-card {
      position: relative;
      cursor: pointer;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(8px) scale(0.985);
      opacity: 0;
      animation: cardIn 0.5s ease forwards;
      animation-delay: var(--stagger, 0ms);
      transition: transform 0.24s ease, border-color 0.24s ease, box-shadow 0.24s ease;
    }

    .movie-card:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(244, 190, 80, 0.52);
      box-shadow: 0 15px 36px rgba(0, 0, 0, 0.3);
    }

    .movie-card.active {
      border-color: rgba(69, 209, 155, 0.82);
      box-shadow: 0 0 0 1px rgba(69, 209, 155, 0.55), 0 16px 32px rgba(0, 0, 0, 0.36);
    }

    .movie-poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      min-height: 0;
      background: rgba(0, 0, 0, 0.6);
      overflow: hidden;
      flex: 0 0 auto;
    }

    .movie-poster {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .movie-meta {
      padding: 9px 10px 11px;
      background: linear-gradient(180deg, rgba(6, 6, 6, 0.96), rgba(12, 12, 12, 0.98));
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .movie-title {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.3;
      font-weight: 700;
      color: #f8fafc;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      min-height: 2.2em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .movie-sub {
      margin: 6px 0 0;
      color: #d3d8e3;
      font-size: 0.74rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }

    .kind-pill {
      font-size: 0.67rem;
      letter-spacing: 0.03em;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 999px;
      opacity: 0.9;
    }

    .kp-rating {
      font-weight: 700;
    }

    .kp-rating-high {
      color: #45d19b;
    }

    .kp-rating-mid {
      color: #c0c8d8;
    }

    .kp-rating-low {
      color: #ff6b6b;
    }

    .player-panel {
      display: grid;
      grid-template-rows: minmax(360px, 58%) minmax(0, 1fr);
      min-height: 0;
      height: 100%;
      animation: reveal 1s ease both;
      animation-delay: 0.18s;
      background: var(--panel-strong);
      transform: translateX(28px) scale(0.99);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.42s cubic-bezier(0.2, 0.9, 0.2, 1), opacity 0.3s ease;
      min-width: 0;
      overflow: hidden;
    }

    .layout:not(.is-details-open) .player-panel {
      border-color: transparent;
      box-shadow: none;
      visibility: hidden;
    }

    .layout.is-details-open .player-panel {
      transform: translateX(0) scale(1);
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    .hero {
      position: relative;
      min-height: 360px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      align-content: end;
      padding: 26px 22px 64px;
      overflow: hidden;
      isolation: isolate;
    }

    .hero-body {
      display: grid;
      gap: 10px;
      max-width: 90ch;
      padding-right: 56px;
    }

    .hero-backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      opacity: 0.72;
      transform: scale(1.03);
      transition: opacity 0.35s ease;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(5, 8, 7, 0.3) 0%, rgba(5, 8, 7, 0.84) 80%);
    }

    .hero h3 {
      margin: 0;
      font-size: clamp(1.35rem, 2.15vw, 2.1rem);
      line-height: 1.15;
    }

    .hero p {
      margin: 0;
      font-size: 0.9rem;
      color: rgba(237, 238, 233, 0.88);
      max-width: 65ch;
      line-height: 1.48;
      max-height: calc(1.48em * 4);
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 2px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .hero p:empty {
      display: none;
    }

    .hero p::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hero-chip {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.34);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.76rem;
      color: #f8f2e4;
      line-height: 1;
    }

    .hero-action-btn {
      position: absolute;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      background: rgba(0, 0, 0, 0.42);
      color: #f8fafc;
      font-size: 1.05rem;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
      opacity: 0.95;
      z-index: 3;
    }

    .hero-action-btn:hover {
      transform: translateY(-1px) scale(1.03);
      border-color: rgba(245, 158, 11, 0.64);
      background: rgba(245, 158, 11, 0.22);
    }

    .hero-close-btn {
      top: 14px;
      right: 14px;
      opacity: 0;
      pointer-events: none;
    }

    .layout.is-details-open .hero-close-btn {
      opacity: 1;
      pointer-events: auto;
    }

    .hero-detach-btn {
      right: 14px;
      bottom: 14px;
    }

    .hero-detach-btn.is-detached {
      border-color: rgba(69, 209, 155, 0.72);
      background: rgba(69, 209, 155, 0.2);
      color: #d2faea;
    }

    .player-stage {
      position: relative;
      min-height: 0;
      background: #070b0a;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
    }

    .player-host {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      flex: 0 0 auto;
      max-height: 100%;
      max-width: none;
    }

    .player-stage iframe,
    .player-host iframe {
      border: 0;
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.28s ease;
    }

    .player-stage iframe.ready,
    .player-host iframe.ready {
      opacity: 1;
    }

    .player-placeholder {
      position: absolute;
      inset: 14px;
      border: 1px dashed rgba(245, 158, 11, 0.4);
      border-radius: 16px;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #f6e7c0;
      background: rgba(245, 158, 11, 0.08);
      padding: 16px;
      font-size: 0.86rem;
      animation: placeholderPulse 2.2s ease-in-out infinite;
    }

    .player-stage.is-detached .player-placeholder {
      display: flex;
    }

    @keyframes placeholderPulse {
      0%, 100% { box-shadow: inset 0 0 0 0 rgba(245, 158, 11, 0.18); }
      50% { box-shadow: inset 0 0 0 6px rgba(245, 158, 11, 0.06); }
    }

    .floating-player {
      position: fixed;
      left: 50%;
      top: 54%;
      width: min(78vw, 980px);
      height: min(58vh, 560px);
      min-width: 96px;
      min-height: 54px;
      z-index: 1200;
      border: 1px solid rgba(245, 158, 11, 0.36);
      border-radius: 16px;
      background: rgba(8, 8, 8, 0.95);
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 52px rgba(0, 0, 0, 0.58);
      overflow: hidden;
      resize: none;
      will-change: left, top, width, height;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.94);
      transition: opacity 0.24s ease, transform 0.24s ease;
    }

    .floating-player.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .floating-player.dragging {
      transition: none;
      user-select: none;
      cursor: grabbing;
    }

    .floating-player.resizing,
    .floating-player.dragging {
      backdrop-filter: none;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.48);
    }

    .floating-player.resizing iframe {
      pointer-events: none;
    }

    .floating-player-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 8px;
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.07));
      border-bottom: 1px solid rgba(245, 158, 11, 0.28);
      cursor: grab;
      touch-action: none;
    }

    .floating-player-title {
      font-size: 0.76rem;
      color: #ffe9b4;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .floating-player-dock {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border-radius: 8px;
      width: 24px;
      height: 24px;
      padding: 0;
      font-size: 1rem;
      line-height: 1;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .floating-player-dock:hover {
      transform: translateY(-1px);
      border-color: rgba(245, 158, 11, 0.56);
      background: rgba(245, 158, 11, 0.15);
    }

    .floating-player-body {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #070b0a;
    }

    .floating-player-resize {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      z-index: 5;
      background: linear-gradient(135deg, transparent 0 50%, rgba(245, 158, 11, 0.58) 50% 100%);
      border-top-left-radius: 6px;
      touch-action: none;
    }

    .status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 22px;
      color: #d4d9d5;
      font-size: 0.95rem;
      z-index: 2;
      background: linear-gradient(180deg, rgba(6, 10, 9, 0.85), rgba(6, 10, 9, 0.9));
      transition: opacity 0.22s ease;
    }

    .status.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .results-empty {
      grid-column: 1 / -1;
      border: 1px dashed rgba(245, 158, 11, 0.35);
      border-radius: 14px;
      padding: 24px 14px;
      text-align: center;
      color: var(--muted);
      background: rgba(245, 158, 11, 0.06);
      font-size: 0.92rem;
    }

    .status strong {
      display: block;
      color: var(--accent);
      font-family: inherit;
      letter-spacing: 0.02em;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .loader {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      min-height: 220px;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 25%, rgba(255, 255, 255, 0.23) 50%, transparent 75%);
      transform: translateX(-100%);
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 1100px) {
      html,
      body {
        overflow: hidden;
      }

      .page {
        height: 100dvh;
        min-height: 100dvh;
        padding: 0;
      }

      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr);
        height: 100%;
        gap: 0;
        position: relative;
      }

      .layout.is-details-open {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr);
        gap: 0;
      }

      .results,
      .results[data-view="search"] {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .discover {
        height: 100%;
      }

      .player-panel {
        display: grid;
        position: absolute;
        inset: 0;
        width: auto;
        max-width: 100%;
        grid-template-rows: minmax(400px, 62%) minmax(0, 1fr);
        min-height: 0;
        height: auto;

<body>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const DEFAULT_PROXY_BASE = "https://realtime.xn--80ahcljthqi.xn--p1ai";
    const queryProxyBase = String(urlParams.get("proxy_base") || "").trim().replace(/\/+$/, "");
    const effectiveProxyBase = queryProxyBase || DEFAULT_PROXY_BASE;
    const KINOPOISK_API = `${effectiveProxyBase}/ytm/kinopoisk`;
    const BALANCER_SOURCE_CACHE_TTL_MS = 10 * 60 * 1000;
    const balancerSourcesCache = new Map();
    const posterByFilmCache = new Map();
    const posterImageWarmCache = new Set();

    // Единственный используемый балансер — Collaps по kinopoisk_id
    const BALANCERS = [
      {
        name: "Колапс",
        url: (kpId) => `https://apicollaps.cc/list?token=eedefb541aeba871dcfc756e6b31c02e&kinopoisk_id=${kpId}`,

    const state = {
      mode: "multi",
      selectedId: null,
      selectedType: null,
      selectedSources: [],
      selectedSourceUrl: "",
      searchSeq: 0,
      playerDetached: false,

    };

    const layoutRootEl = document.getElementById("layoutRoot");
    const resultsEl = document.getElementById("results");
    const discoverHeadEl = document.querySelector(".discover-head");
    const statusBoxEl = document.getElementById("statusBox");
    const stageEl = document.getElementById("playerStage");

    const heroMetaEl = document.getElementById("heroMeta");

    const heroBackdropEl = document.getElementById("heroBackdrop");
    const detailCloseBtnEl = document.getElementById("detailCloseBtn");
    const playerHostEl = document.getElementById("playerHost");
    const playerPlaceholderEl = document.getElementById("playerPlaceholder");
    const detachBtnEl = document.getElementById("detachBtn");
    const searchFormEl = document.getElementById("searchForm");
    const searchInputEl = document.getElementById("searchInput");
    const modeSwitchEl = document.getElementById("modeSwitch");
    const canUseHostFloating = (() => {
      try {
        return window.parent && window.parent !== window;
      } catch {
        return false;
      }
    })();
    let floatingPlayerEl = null;
    let floatingPlayerBodyEl = null;
    let floatingDragState = null;
    let floatingDragRaf = 0;
    let floatingResizeState = null;
    let floatingResizeRaf = 0;
    let detailsCloseTimer = null;

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showStatus(title, text, loading = false) {
      statusBoxEl.innerHTML = `
        <div>
          ${loading ? '<div class="loader"></div>' : ""}
          <strong>${escapeHtml(title)}</strong>
          <div>${escapeHtml(text)}</div>
        </div>
      `;
      statusBoxEl.classList.remove("hidden");
    }

    function hideStatus() {
      statusBoxEl.classList.add("hidden");
    }

    function openDetailsPanel() {
      if (detailsCloseTimer) {
        clearTimeout(detailsCloseTimer);
        detailsCloseTimer = null;
      }
      layoutRootEl.classList.add("is-details-open");
    }

    function closeDetailsPanel() {
      const wasOpen = layoutRootEl.classList.contains("is-details-open");
      layoutRootEl.classList.remove("is-details-open");
      state.selectedId = null;
      state.selectedType = null;
      resultsEl.querySelectorAll(".movie-card.active").forEach((el) => el.classList.remove("active"));
      if (detailsCloseTimer) {
        clearTimeout(detailsCloseTimer);
        detailsCloseTimer = null;
      }
      const cleanup = () => {
        setHero(null);
        if (!state.playerDetached) {
          playerHostEl.querySelectorAll("iframe").forEach((frame) => frame.remove());
          playerHostEl.innerHTML = "";
          state.selectedSourceUrl = "";
          hideStatus();
        }
        detailsCloseTimer = null;
      };
      if (wasOpen) {
        detailsCloseTimer = setTimeout(cleanup, 360);
      } else {
        cleanup();
      }
    }

    function setDetachButtonState() {
      const mobilePipMode = window.matchMedia("(max-width: 1100px)").matches;
      detachBtnEl.classList.toggle("is-detached", state.playerDetached);
      const icon = mobilePipMode ? "▣" : (state.playerDetached ? "↩" : "⤢");
      const label = mobilePipMode
        ? "Картинка в картинке"
        : (state.playerDetached ? "Вернуть плеер в блок" : "Открепить плеер");
      detachBtnEl.textContent = icon;
      detachBtnEl.title = label;
      detachBtnEl.setAttribute("aria-label", label);
    }

    async function requestNativePictureInPicture() {
      const iframe = playerHostEl.querySelector("iframe");
      if (!iframe || !state.selectedSourceUrl) {
        showStatus("PiP", "Сначала выберите фильм и дождитесь загрузки плеера.");
        return;
      }

      try {
        let video = null;
        try {
          const doc = iframe.contentDocument || iframe.contentWindow?.document || null;
          video = doc ? doc.querySelector("video") : null;
        } catch {
          video = null;
        }

        if (video) {
          if (document.pictureInPictureEnabled && typeof video.requestPictureInPicture === "function") {
            await video.requestPictureInPicture();
            return;
          }
          if (typeof video.webkitSupportsPresentationMode === "function"
            && video.webkitSupportsPresentationMode("picture-in-picture")
            && typeof video.webkitSetPresentationMode === "function") {
            video.webkitSetPresentationMode("picture-in-picture");
            return;
          }
        }
      } catch {
        // continue with fallback
      }

      const popup = window.open(state.selectedSourceUrl, "_blank", "noopener,noreferrer");
      if (!popup) {
        showStatus("PiP", "Не удалось открыть плеер. Разрешите всплывающие окна и повторите.");
        return;
      }

      showStatus("PiP", "Плеер открыт в новой вкладке. Включите PiP кнопкой самого плеера.", false);
      setTimeout(() => hideStatus(), 2200);
    }

    function postToHost(type, payload = {}) {
      if (!canUseHostFloating) return;
      window.parent.postMessage({ type, payload }, "*");
    }

    function pinFloatingPlayerToCurrentRect() {
      if (!floatingPlayerEl) return;
      const rect = floatingPlayerEl.getBoundingClientRect();
      floatingPlayerEl.style.left = `${rect.left}px`;
      floatingPlayerEl.style.top = `${rect.top}px`;
      floatingPlayerEl.style.transform = "none";
    }

    function ensureFloatingPlayer() {
      if (floatingPlayerEl) return;
      const el = document.createElement("div");
      el.className = "floating-player";
      el.innerHTML = `
        <div class="floating-player-head" id="floatingPlayerHead">
          <div class="floating-player-title">Киносреда • Плавающий плеер</div>
          <button class="floating-player-dock" id="floatingPlayerDockBtn" type="button" aria-label="Вернуть в блок" title="Вернуть в блок">✕</button>
        </div>
        <div class="floating-player-body" id="floatingPlayerBody"></div>
        <div class="floating-player-resize" id="floatingPlayerResize" aria-hidden="true"></div>
      `;
      document.body.appendChild(el);
      floatingPlayerEl = el;
      floatingPlayerBodyEl = el.querySelector("#floatingPlayerBody");

      const dockBtn = el.querySelector("#floatingPlayerDockBtn");
      const head = el.querySelector("#floatingPlayerHead");
      const resizeHandle = el.querySelector("#floatingPlayerResize");

      dockBtn.addEventListener("click", () => dockPlayer());

      head.addEventListener("pointerdown", (event) => {
        if (event.target.closest("button")) return;
        if (!state.playerDetached) return;
        const rect = floatingPlayerEl.getBoundingClientRect();
        floatingPlayerEl.style.left = `${rect.left}px`;
        floatingPlayerEl.style.top = `${rect.top}px`;
        floatingPlayerEl.style.transform = "none";
        floatingPlayerEl.classList.add("dragging");
        floatingDragState = {
          pointerId: event.pointerId,
          shiftX: event.clientX - rect.left,
          shiftY: event.clientY - rect.top
        };
        head.setPointerCapture(event.pointerId);
      });

      head.addEventListener("pointermove", (event) => {
        if (!floatingDragState || floatingDragState.pointerId !== event.pointerId) return;
        floatingDragState.nextClientX = event.clientX;
        floatingDragState.nextClientY = event.clientY;
        if (floatingDragRaf) return;
        floatingDragRaf = requestAnimationFrame(() => {
          floatingDragRaf = 0;
          if (!floatingDragState || !floatingPlayerEl) return;
          const rawLeft = (floatingDragState.nextClientX ?? 0) - floatingDragState.shiftX;
          const rawTop = (floatingDragState.nextClientY ?? 0) - floatingDragState.shiftY;
          const rect = floatingPlayerEl.getBoundingClientRect();
          const maxLeft = Math.max(0, window.innerWidth - rect.width);
          const maxTop = Math.max(0, window.innerHeight - rect.height);
          floatingPlayerEl.style.left = `${Math.max(0, Math.min(rawLeft, maxLeft))}px`;
          floatingPlayerEl.style.top = `${Math.max(0, Math.min(rawTop, maxTop))}px`;
        });
      });

      const endDrag = (event) => {
        if (!floatingDragState || floatingDragState.pointerId !== event.pointerId) return;
        floatingDragState = null;
        if (floatingDragRaf) {
          cancelAnimationFrame(floatingDragRaf);
          floatingDragRaf = 0;
        }
        floatingPlayerEl.classList.remove("dragging");
      };
      head.addEventListener("pointerup", endDrag);
      head.addEventListener("pointercancel", endDrag);

      resizeHandle.addEventListener("pointerdown", (event) => {
        if (!state.playerDetached || !floatingPlayerEl) return;
        event.preventDefault();
        event.stopPropagation();
        const rect = floatingPlayerEl.getBoundingClientRect();
        floatingPlayerEl.style.left = `${rect.left}px`;
        floatingPlayerEl.style.top = `${rect.top}px`;
        floatingPlayerEl.style.transform = "none";
        floatingPlayerEl.classList.add("resizing");
        floatingResizeState = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          startW: rect.width,
          startH: rect.height,
          startLeft: rect.left,
          startTop: rect.top,
          nextX: event.clientX,
          nextY: event.clientY
        };
        resizeHandle.setPointerCapture(event.pointerId);
      });

      resizeHandle.addEventListener("pointermove", (event) => {
        if (!floatingResizeState || floatingResizeState.pointerId !== event.pointerId || !floatingPlayerEl) return;
        floatingResizeState.nextX = event.clientX;
        floatingResizeState.nextY = event.clientY;
        if (floatingResizeRaf) return;
        floatingResizeRaf = requestAnimationFrame(() => {
          floatingResizeRaf = 0;
          if (!floatingResizeState || !floatingPlayerEl) return;
          const minW = 96;
          const minH = 54;
          const maxW = Math.max(minW, window.innerWidth - floatingResizeState.startLeft);
          const maxH = Math.max(minH, window.innerHeight - floatingResizeState.startTop);
          const dx = (floatingResizeState.nextX ?? 0) - floatingResizeState.startX;
          const dy = (floatingResizeState.nextY ?? 0) - floatingResizeState.startY;
          const nextW = Math.max(minW, Math.min(floatingResizeState.startW + dx, maxW));
          const nextH = Math.max(minH, Math.min(floatingResizeState.startH + dy, maxH));
          floatingPlayerEl.style.width = `${nextW}px`;
          floatingPlayerEl.style.height = `${nextH}px`;
        });
      });

      const endResize = (event) => {
        if (!floatingResizeState || floatingResizeState.pointerId !== event.pointerId || !floatingPlayerEl) return;
        floatingResizeState = null;
        if (floatingResizeRaf) {
          cancelAnimationFrame(floatingResizeRaf);
          floatingResizeRaf = 0;
        }
        floatingPlayerEl.classList.remove("resizing");
      };
      resizeHandle.addEventListener("pointerup", endResize);
      resizeHandle.addEventListener("pointercancel", endResize);
    }

    function detachPlayer() {
      if (state.playerDetached) return;
      if (canUseHostFloating) {
        state.playerDetached = true;
        stageEl.classList.add("is-detached");
        playerPlaceholderEl.style.display = "flex";
        playerHostEl.innerHTML = "";
        setDetachButtonState();
        if (state.selectedSourceUrl) {
          postToHost("video:detach-player", {
            url: state.selectedSourceUrl,
            title: heroTitleEl.textContent || "Киносреда • Плеер"
          });
        }
        return;
      }
      ensureFloatingPlayer();
      if (!floatingPlayerBodyEl) return;
      floatingPlayerBodyEl.appendChild(playerHostEl);
      state.playerDetached = true;
      stageEl.classList.add("is-detached");
      playerPlaceholderEl.style.display = "flex";
      floatingPlayerEl.classList.add("visible");
      requestAnimationFrame(() => pinFloatingPlayerToCurrentRect());
      setDetachButtonState();
    }

    function dockPlayer() {
      if (!state.playerDetached) return;
      if (canUseHostFloating) {
        state.playerDetached = false;
        stageEl.classList.remove("is-detached");
        playerPlaceholderEl.style.display = "";
        setDetachButtonState();
        postToHost("video:dock-player");
        if (state.selectedSourceUrl) mountIframe(state.selectedSourceUrl);
        return;
      }
      stageEl.insertBefore(playerHostEl, statusBoxEl);
      state.playerDetached = false;
      stageEl.classList.remove("is-detached");
      playerPlaceholderEl.style.display = "";
      if (floatingPlayerEl) {
        floatingPlayerEl.classList.remove("visible");
      }
      setDetachButtonState();
    }

    function mediaLabel(mediaType) {
      if (mediaType === "movie") return "Фильм";
      if (mediaType === "tv") return "Сериал";
      return "Медиа";
    }

    function updateDiscoverState(isSearch) {
      discoverHeadEl.classList.toggle("has-back", isSearch);
      headBackBtnEl.classList.toggle("visible", isSearch);
    }

    function getKpRatingClass(rating) {
      const value = Number(rating);
      if (!Number.isFinite(value)) return "kp-rating-mid";
      if (value > 7) return "kp-rating-high";
      if (value >= 5) return "kp-rating-mid";
      return "kp-rating-low";
    }

    function formatKpRating(rating) {
      const value = Number(rating);
      if (!Number.isFinite(value)) return "—";
      return value.toFixed(1);
    }

    function buildHeroChips(card) {
      const chips = [];
      const details = card.details || {};

      chips.push(mediaLabel(card.mediaType));
      if (card.year && card.year !== "----") chips.push(card.year);
      if (card.vote && card.vote !== "-") chips.push(`★ ${card.vote}`);
      if (details.tmdbId) chips.push(`TMDB ${details.tmdbId}`);
      if (details.runtimeLabel) chips.push(details.runtimeLabel);
      if (details.seasonsLabel) chips.push(details.seasonsLabel);
      if (details.genreLabel) chips.push(details.genreLabel);
      if (details.countryLabel) chips.push(details.countryLabel);

      return chips;
    }

    async function kinopoiskRequest(path, params = {}) {
      const url = new URL(`${KINOPOISK_API}${path}`);
      Object.entries(params).forEach(([key, value]) => {
        if (value === undefined || value === null) return;
        if (Array.isArray(value)) {
          value.forEach((entry) => {
            const text = String(entry || "").trim();
            if (text) url.searchParams.append(key, text);
          });
          return;
        }
        const text = String(value).trim();
        if (text) url.searchParams.set(key, text);
      });

      const response = await fetch(url.toString(), {
        method: "GET",
        mode: "cors",
        credentials: "omit",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`KINOPOISK_HTTP_${response.status}`);
      }
      const contentType = (response.headers.get("content-type") || "").toLowerCase();
      if (contentType.includes("application/json")) {
        return response.json();
      }
      const text = await response.text();
      const trimmed = text.trim();
      if (trimmed.toLowerCase() === "ok") {
        throw new Error("KINOPOISK_PROXY_ROUTE_MISCONFIGURED");
      }
      try {
        return JSON.parse(trimmed);
      } catch {
        throw new Error("KINOPOISK_NON_JSON_RESPONSE");
      }
    }

    function normalizeKinopoiskCard(item) {
      const mediaType = String(item.type || "").includes("SERIES") ? "tv" : "movie";
      const title = item.nameRu || item.nameOriginal || item.nameEn || "Без названия";
      const kpRatingValue = Number(item.rating || item.ratingKinopoisk);
      const cacheKey = String(item.filmId || item.kinopoiskId || "").trim();
      const cachedPoster = cacheKey ? posterByFilmCache.get(cacheKey) : null;
      const poster = item.posterUrl || item.posterUrlPreview || cachedPoster?.poster || "";
      const backdrop = item.posterUrl || item.posterUrlPreview || cachedPoster?.backdrop || "";

      if (cacheKey && (poster || backdrop)) {
        posterByFilmCache.set(cacheKey, { poster, backdrop });
      }

      return {
        id: item.filmId || item.kinopoiskId,
        mediaType,
        title,
        originalTitle: item.nameOriginal || item.nameEn || title,
        overview: item.description || item.shortDescription || item.slogan || "Описание отсутствует.",
        year: item.year ? String(item.year) : "----",
        poster,
        backdrop,
        vote: Number.isFinite(kpRatingValue) && kpRatingValue > 0 ? kpRatingValue.toFixed(1) : "-",
        kpRating: Number.isFinite(kpRatingValue) && kpRatingValue > 0 ? kpRatingValue : null,
        details: {
          imdbId: String(item.imdbId || "").trim(),
          tmdbId: ""
        }
      };
    }

    function buildPosterFallback(title) {
      const safeTitle = (title || "No poster").slice(0, 26).replace(/[<>&"]/g, " ");
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#1b2a24"/>
              <stop offset="100%" stop-color="#3f2419"/>
            </linearGradient>
          </defs>
          <rect width="400" height="600" fill="url(#g)"/>
          <g fill="#f4be50" opacity="0.85">
            <circle cx="72" cy="78" r="4"/><circle cx="120" cy="104" r="3"/><circle cx="332" cy="94" r="4"/>
          </g>
          <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
                fill="#f7f4ea" font-size="28" font-family="Arial, sans-serif">${safeTitle}</text>
        </svg>`
      )}`;
    }

    function warmPosterImage(url) {
      const source = String(url || "").trim();
      if (!source || posterImageWarmCache.has(source)) return;
      posterImageWarmCache.add(source);
      const img = new Image();
      img.decoding = "async";
      img.src = source;
    }

    function setHero(card) {
      if (!card) {
        heroTitleEl.textContent = "";
        heroMetaEl.innerHTML = "";
        heroTextEl.textContent = "";
        heroBackdropEl.removeAttribute("src");
        heroBackdropEl.style.opacity = "0";
        return;
      }

      const details = card.details || {};
      const chips = buildHeroChips(card);
      const textParts = [];
      if (details.overview || card.overview) textParts.push(details.overview || card.overview);
      if (details.tagline) textParts.push(details.tagline);

      heroTitleEl.textContent = card.title;
      heroMetaEl.innerHTML = chips.map((chip) => `<span class="hero-chip">${escapeHtml(chip)}</span>`).join("");
      heroTextEl.textContent = textParts.join(" ");

      if (card.backdrop) {
        heroBackdropEl.src = card.backdrop;
        heroBackdropEl.style.opacity = "0.72";
      } else {
        heroBackdropEl.removeAttribute("src");
        heroBackdropEl.style.opacity = "0";
      }
    }

    function renderSkeletons(count = 10) {
      resultsEl.innerHTML = "";
      for (let i = 0; i < count; i += 1) {
        const sk = document.createElement("div");
        sk.className = "skeleton";
        resultsEl.appendChild(sk);
      }
    }

    function renderCards(cards) {
      resultsEl.innerHTML = "";
      appendCards(cards);
    }

    function appendCards(cards) {
      if (!Array.isArray(cards) || !cards.length) return;

      cards.forEach((card, index) => {
        const cardEl = document.createElement("article");
        cardEl.className = "movie-card";
        cardEl.style.setProperty("--stagger", `${Math.min(index, 12) * 34}ms`);
        cardEl.dataset.id = String(card.id);
        cardEl.dataset.type = card.mediaType;

        const imgSrc = card.poster || card.backdrop || buildPosterFallback(card.title);
        warmPosterImage(imgSrc);
        const kpClass = getKpRatingClass(card.kpRating);
        const kpText = formatKpRating(card.kpRating);
        cardEl.innerHTML = `
          <div class="movie-poster-wrap">
            <img class="movie-poster" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(card.title)}" loading="lazy" />
          </div>
          <div class="movie-meta">
            <h4 class="movie-title">${escapeHtml(card.title)}</h4>
            <div class="movie-sub">
              <span>${escapeHtml(card.year)} · <span class="kp-rating ${kpClass}">КП ${escapeHtml(kpText)}</span></span>
              <span class="kind-pill">${escapeHtml(mediaLabel(card.mediaType))}</span>
            </div>
          </div>
        `;

        cardEl.addEventListener("click", () => onSelectCard(card, cardEl));
        resultsEl.appendChild(cardEl);
      });
    }

    function hasMorePages() {
      const total = Number(state.pagesTotal || 0);
      const loaded = Number(state.pagesLoaded || 0);
      if (!total) return false;
      return loaded < total;
    }

    async function loadNextPage() {
      if (state.loadingMore || !hasMorePages()) return;
      const nextPage = state.pagesLoaded + 1;
      const seq = state.searchSeq;
      state.loadingMore = true;

      try {
        const cards = await fetchCardsPage(state.lastQuery, nextPage, seq);
        if (seq !== state.searchSeq) return;
        appendCards(cards);
        state.pagesLoaded = nextPage;
      } catch (error) {
        console.warn("Load next page failed:", error);
      } finally {
        if (seq === state.searchSeq) state.loadingMore = false;
      }
    }

    async function fetchCardsPage(query, page, seq) {
      const trimmed = String(query || "").trim();
      const params = { page };

      if (trimmed) {
        params.keyword = trimmed;
        const data = await kinopoiskRequest("/films/search-by-keyword", params);
        if (seq !== state.searchSeq) return [];
        const pagesCount = Number(data?.pagesCount || 0);
        state.pagesTotal = Number.isFinite(pagesCount) && pagesCount > 0 ? pagesCount : state.pagesLoaded;
        const cards = (data.films || [])
          .filter((item) => state.mode === "multi" || (state.mode === "movie"
            ? !String(item.type || "").includes("SERIES")
            : String(item.type || "").includes("SERIES")))
          .map((item) => normalizeKinopoiskCard(item));
        return cards;
      }

      params.order = "NUM_VOTE";
      params.type = state.mode === "movie" ? "FILM" : (state.mode === "tv" ? "TV_SERIES" : "ALL");
      const data = await kinopoiskRequest("/films", params);
      if (seq !== state.searchSeq) return [];
      const pagesCount = Number(data?.totalPages || data?.pagesCount || 0);
      state.pagesTotal = Number.isFinite(pagesCount) && pagesCount > 0 ? pagesCount : state.pagesLoaded;
      return (data.items || []).map((item) => normalizeKinopoiskCard(item));
    }

    function markActiveCard(target) {
      resultsEl.querySelectorAll(".movie-card.active").forEach((el) => el.classList.remove("active"));
      target.classList.add("active");
    }

    function balancerSourceCacheKey(kpId) {
      return `kp::${String(kpId || "")}`;
    }

    function getCachedBalancerSources(kpId) {
      const key = balancerSourceCacheKey(kpId);
      const row = balancerSourcesCache.get(key);
      if (!row) return null;
      if (Number(row.expiresAt || 0) <= Date.now()) {
        balancerSourcesCache.delete(key);
        return null;
      }
      return Array.isArray(row.sources) ? row.sources : null;
    }

    function setCachedBalancerSources(kpId, sources) {
      if (!Array.isArray(sources) || !sources.length) return;
      const key = balancerSourceCacheKey(kpId);
      balancerSourcesCache.set(key, {
        sources,
        expiresAt: Date.now() + BALANCER_SOURCE_CACHE_TTL_MS
      });
    }

    async function fetchBalancer(balancer, kpId) {
      try {
        const url = balancer.url(kpId);
        const response = await fetch(url, {
          method: "GET",
          mode: "cors",
          credentials: "omit",
          cache: "no-store",
          headers: { Accept: "application/json, text/plain, */*" }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const contentType = (response.headers.get("content-type") || "").toLowerCase();
        let data;
        if (contentType.includes("application/json")) {
          data = await response.json();
        } else {
          const text = await response.text();
          try {
            data = JSON.parse(text);
          } catch (parseError) {
            throw new Error("Invalid JSON response");
          }
        }

        const iframeUrl = balancer.extract(data);
        if (iframeUrl && typeof iframeUrl === "string" && iframeUrl.trim()) {
          return {
            source: balancer.name,
            iframeUrl: iframeUrl.trim()
          };
        }
        return null;
      } catch (error) {
        throw error;
      }
    }

    async function requestBalancerSources(kpId) {
      if (!kpId || !String(kpId).trim()) {
        console.warn("Empty Kinopoisk ID provided");
        return [];
      }

      console.log(`Requesting sources from ${BALANCERS.length} balancers for KP ID: ${kpId}`);
      const promises = BALANCERS.map((balancer) => fetchBalancer(balancer, kpId));
      const results = await Promise.allSettled(promises);
      
      const sources = results
        .map((result, index) => {
          if (result.status === "fulfilled" && result.value) {
            console.log(`✓ ${BALANCERS[index].name}: found source`);
            return result.value;
          } else if (result.status === "rejected") {
            console.warn(`✗ ${BALANCERS[index].name}: ${result.reason?.message || "error"}`);
          } else {
            console.log(`✗ ${BALANCERS[index].name}: no source found`);
          }
          return null;
        })
        .filter(Boolean);

      console.log(`Found ${sources.length} sources total`);

      // Сортируем: приоритет Колапс и Алоха
      sources.sort((a, b) => {
        if (a.source === "Колапс") return -1;
        if (b.source === "Колапс") return 1;
        if (a.source === "Алоха") return -1;
        if (b.source === "Алоха") return 1;
        return 0;
      });

      return sources;
    }

    function mountIframe(url) {
      playerHostEl.querySelectorAll("iframe").forEach((frame) => frame.remove());
      playerHostEl.innerHTML = "";
      hideStatus();
      state.selectedSourceUrl = url;
      if (state.playerDetached && canUseHostFloating) {
        postToHost("video:update-player", {
          url,
          title: heroTitleEl.textContent || "Киносреда • Плеер"
        });
        return;
      }

      const iframe = document.createElement("iframe");
      iframe.src = url;
      iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      iframe.allowFullscreen = true;

      iframe.addEventListener("load", () => {
        iframe.classList.add("ready");
      });

      playerHostEl.appendChild(iframe);
    }

    async function loadBalancerSources(kpId) {
      if (!kpId) {
        showStatus("No KP ID", "Не удалось получить ID Кинопоиск для этого фильма. Попробуйте другой фильм.");
        return;
      }

      const cachedSources = getCachedBalancerSources(kpId);
      if (cachedSources && cachedSources.length) {
        state.selectedSources = cachedSources;
        mountIframe(cachedSources[0].iframeUrl);
        hideStatus();
        return;
      }

      showStatus("Loading", "Загружаю доступные источники плеера...", true);

      try {
        const sources = await requestBalancerSources(kpId);
        state.selectedSources = sources;
        setCachedBalancerSources(kpId, sources);
        if (!sources.length) {
          showStatus("No Stream", "Источник не найден. Попробуйте другой фильм, либо другой тип поиска.");
          return;
        }
        mountIframe(sources[0].iframeUrl);
      } catch (error) {
        console.error("Balancer error:", error);
        showStatus("Connection Error", "Не удалось получить источники от балансеров. Проверьте подключение к интернету.", false);
      }
    }

    async function fetchDetails(card) {
      const details = await kinopoiskRequest(`/films/${card.id}`);
      const genres = Array.isArray(details?.genres)
        ? details.genres.map((genre) => genre?.name).filter(Boolean).slice(0, 3)
        : [];
      const countries = Array.isArray(details?.countries)
        ? details.countries.map((country) => country?.name).filter(Boolean).slice(0, 2)
        : [];

      const runtimeMinutes = Number(details?.filmLength) || 0;
      const imdbId = String(details?.imdbId || "").trim();

      return {
        imdbId,
        tmdbId: "",
        runtimeLabel: runtimeMinutes > 0 ? `${runtimeMinutes} мин` : "",
        seasonsLabel: details?.serial ? "Сериал" : "",
        genreLabel: genres.join(" • "),
        countryLabel: countries.join(", "),
        tagline: String(details?.slogan || "").trim(),
        overview: String(details?.description || details?.shortDescription || "").trim()
      };
    }

    async function onSelectCard(card, cardEl) {
      state.selectedId = card.id;
      state.selectedType = card.mediaType;
      markActiveCard(cardEl);
      openDetailsPanel();
      setHero(card);

      showStatus("Loading", "Подготавливаю карточку...", true);

      try {
        const details = await fetchDetails(card);
        setHero({ ...card, details });
        await loadBalancerSources(card.id);
      } catch (error) {
        showStatus("Error", "Не удалось загрузить информацию о фильме.");
      }
    }

    async function search(query) {
      const seq = ++state.searchSeq;
      const trimmed = query.trim();
      state.lastQuery = trimmed;
      state.pagesLoaded = 0;
      state.pagesTotal = 0;
      state.loadingMore = false;
      updateDiscoverState(Boolean(trimmed));
      resultsEl.dataset.view = trimmed ? "search" : "home";
      closeDetailsPanel();
      renderSkeletons();
      hideStatus();

      try {
        const cards = await fetchCardsPage(trimmed, 1, seq);
        if (seq !== state.searchSeq) return;
        resultsEl.innerHTML = "";
        if (!cards.length) {
          resultsEl.innerHTML = '<div class="results-empty">Ничего не найдено.</div>';
          return;
        }
        appendCards(cards);
        state.pagesLoaded = 1;
      } catch (error) {
        if (seq !== state.searchSeq) return;
        const message = String(error?.message || "");
        if (message === "KINOPOISK_PROXY_ROUTE_MISCONFIGURED") {
          resultsEl.innerHTML = '<div class="results-empty">Proxy route не настроен: backend получает ответ <code>ok</code> вместо JSON.</div>';
          return;
        }
        if (message === "KINOPOISK_NON_JSON_RESPONSE") {
          resultsEl.innerHTML = '<div class="results-empty">Backend вернул не-JSON ответ. Проверьте проксирование на realtime-сервере.</div>';
          return;
        }
        if (message.includes("KINOPOISK_HTTP_401")) {
          resultsEl.innerHTML = '<div class="results-empty">Ошибка авторизации в API Kinopoisk Unofficial. Проверьте токен на backend.</div>';
          return;
        }
        resultsEl.innerHTML = '<div class="results-empty">Не удалось загрузить список.</div>';
      }
    }

    function setMode(nextMode) {
      state.mode = nextMode;
      modeSwitchEl.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.mode === nextMode);
      });
      search(searchInputEl.value);
    }

    modeSwitchEl.addEventListener("click", (event) => {
      const button = event.target.closest(".mode-btn");
      if (!button) return;
      const mode = button.dataset.mode;
      if (!mode || mode === state.mode) return;
      setMode(mode);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (state.playerDetached) {
        dockPlayer();
        return;
      }
      if (layoutRootEl.classList.contains("is-details-open")) {
        closeDetailsPanel();
      }
    });

    resultsEl.addEventListener("scroll", () => {
      if (state.loadingMore || !hasMorePages()) return;
      const threshold = 420;
      const distanceToBottom = resultsEl.scrollHeight - (resultsEl.scrollTop + resultsEl.clientHeight);
      if (distanceToBottom <= threshold) {
        loadNextPage();
      }
    });

    window.addEventListener("message", (event) => {
      const data = event && event.data ? event.data : null;
      if (!data || typeof data !== "object") return;
      if (data.type === "video:host-docked" && state.playerDetached) {
        state.playerDetached = false;
        stageEl.classList.remove("is-detached");
        playerPlaceholderEl.style.display = "";
        setDetachButtonState();
        if (state.selectedSourceUrl) mountIframe(state.selectedSourceUrl);
      }
    });

    searchFormEl.addEventListener("submit", (event) => {
      event.preventDefault();
      search(searchInputEl.value);
    });

    headBackBtnEl.addEventListener("click", () => {
      searchInputEl.value = "";
      if (state.mode !== "multi") {
        state.mode = "multi";
        modeSwitchEl.querySelectorAll(".mode-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.mode === "multi");
        });
      }
      search("");
    });

    detailCloseBtnEl.addEventListener("click", () => {
      closeDetailsPanel();
    });

    detachBtnEl.addEventListener("click", () => {
      if (window.matchMedia("(max-width: 1100px)").matches) {
        requestNativePictureInPicture();
        return;
      }
      if (state.playerDetached) {
        dockPlayer();
      } else {
        detachPlayer();
      }
    });

    window.addEventListener("resize", () => {
      setDetachButtonState();
    });

    setDetachButtonState();

    search("");
  </script>
</body>
</html>
