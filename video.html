    function getFallbackProviders(providerId) {
      return PROVIDERS.map((item) => item.id).filter((id) => id !== providerId);
    }

    async function loadBalancerSources(kpId, options = {}) {
      if (!kpId) {
        showStatus("No KP ID", "Не удалось получить ID Кинопоиск для этого фильма. Попробуйте другой фильм.");
        return;
      }

      const requestSeq = ++playerRequestSeq;
      const isCurrent = () => requestSeq === playerRequestSeq;
      const force = Boolean(options.force);
      const allowFallback = options.allowFallback !== false;
      const requestedProvider = isProviderId(options.providerId)
        ? options.providerId
        : (isProviderId(state.selectedProvider) ? state.selectedProvider : "alloha");
      const attemptProviders = [requestedProvider, ...(allowFallback ? getFallbackProviders(requestedProvider) : [])];

      state.selectedProvider = requestedProvider;
      renderProviderSwitch(requestedProvider);
      let lastError = null;

      for (const providerId of attemptProviders) {
        if (!isCurrent()) return;
        state.selectedProvider = providerId;
        renderProviderSwitch(providerId);

        if (!force) {
          const cachedSources = getCachedBalancerSources(providerId, kpId);
          if (cachedSources && cachedSources.length) {
            setProviderAvailability(providerId, true);
            state.selectedSources = cachedSources;
            renderProviderSwitch();
            mountIframe(cachedSources[0].iframeUrl);
            hideStatus();
            return;
          }
        }

        showStatus("Loading", `Загружаю источники ${providerLabel(providerId)}...`, true);
        try {
          const sources = await requestProviderSources(providerId, kpId);
          if (!isCurrent()) return;
          if (sources.length) {
            setProviderAvailability(providerId, true);
            state.selectedSources = sources;
            setCachedBalancerSources(providerId, kpId, sources);
            state.selectedProvider = providerId;
            renderProviderSwitch();
            mountIframe(sources[0].iframeUrl);
            hideStatus();
            return;
          }
          setProviderAvailability(providerId, false);
          lastError = new Error(`${providerId.toUpperCase()}_NO_SOURCES`);
        } catch (error) {
          if (!isCurrent()) return;
          setProviderAvailability(providerId, false);
          lastError = error;
        }
      }

      if (!isCurrent()) return;
      renderProviderSwitch();
      const message = String(lastError?.message || "");
      if (message.includes("PROXY_RETURNS_OK")) {
        showStatus("Proxy Error", "Маршрут /ytm/alloha/players отдает 'ok' вместо JSON. На realtime запущен старый backend без резолва Alloha.", false);
        return;
      }
      if (message.includes("NETWORK_ERROR") || message.includes("CORS")) {
        showStatus("CORS Error", "Браузер блокирует прямой запрос к источнику. Для такого режима нужен CORS на стороне провайдера.", false);
        return;
      }
      if (message.includes("NON_JSON_RESPONSE")) {
        showStatus("Response Error", "Источник вернул не-JSON ответ.", false);
        return;
      }
      showStatus("No Stream", "Не удалось получить ссылки iframe от доступных источников.", false);
    }

    async function fetchDetails(card) {
      const details = await kinopoiskRequest(`/films/${card.id}`);
      let staff = [];
      try {
        const staffPayload = await kinopoiskRequest("/staff", { filmId: card.id });
        staff = Array.isArray(staffPayload) ? staffPayload : (Array.isArray(staffPayload?.items) ? staffPayload.items : []);
      } catch (_) {
        // Older API deployments may omit the staff route; the film payload is
        // still rendered with the data it contains.
      }
      let seasonItems = [];
      if (card.mediaType === "tv") {
        try {
          const seasonsPayload = await kinopoiskRequest(`/films/${card.id}/seasons`);
          seasonItems = Array.isArray(seasonsPayload?.items) ? seasonsPayload.items : [];
        } catch (_) {}
      }
      const genres = Array.isArray(details?.genres)
        ? details.genres.map((genre) => genre?.genre || genre?.name).filter(Boolean).slice(0, 3)
        : [];
      const countries = Array.isArray(details?.countries)
        ? details.countries.map((country) => country?.country || country?.name).filter(Boolean).slice(0, 2)
        : [];
      const persons = [
        ...(Array.isArray(details?.persons) ? details.persons : []),
        ...staff
      ];
      const directorPeople = [
        ...(Array.isArray(details?.directors) ? details.directors : []),
        ...persons.filter(person => person?.professionKey ? person.professionKey === "DIRECTOR" : /режисс/i.test(person?.professionText || "") && !/дубляж/i.test(person?.professionText || ""))
      ].map(person => typeof person === "string" ? { name: person } : { name: person?.nameRu || person?.nameEn || person?.name, photo: person?.posterUrl || person?.imageUrl || "", role: "Режиссёр" }).filter(person => person.name).filter((person, index, list) => list.findIndex(item => item.name === person.name) === index);
      const castPeople = [
        ...(Array.isArray(details?.actors) ? details.actors : []),
        ...persons.filter(person => person?.professionKey ? person.professionKey === "ACTOR" : /актёр|актер/i.test(person?.professionText || "") && !/дубляж/i.test(person?.professionText || ""))
      ].map(person => typeof person === "string" ? { name: person } : { name: person?.nameRu || person?.nameEn || person?.name, photo: person?.posterUrl || person?.imageUrl || "", role: person?.description || "Актёр" }).filter(person => person.name).filter((person, index, list) => list.findIndex(item => item.name === person.name) === index);

      const runtimeMinutes = Number(details?.filmLength) || 0;
      const imdbId = String(details?.imdbId || "").trim();

      return {
        imdbId,
        runtime: runtimeMinutes,
        backdrop: details.coverUrl || card.backdrop,
        poster: details.posterUrl || card.poster,
        tmdbId: "",
        runtimeLabel: runtimeMinutes > 0 ? `${runtimeMinutes} мин` : "",
        seasonsLabel: details?.serial ? "Сериал" : "",
        genreLabel: genres.join(" • "),
        countryLabel: countries.join(", "),
        director: directorPeople.map(person => person.name).join(", "),
        cast: castPeople.map(person => person.name).join(", "),
        directorPeople,
        castPeople,
        seasons: Number(details?.seasons || details?.seasonCount || 0) || seasonItems.length || card.seasons || 0,
        episodes: Number(details?.episodes || details?.episodeCount || 0) || seasonItems.reduce((sum, season) => sum + (Array.isArray(season?.episodes) ? season.episodes.length : 0), 0),
        ageRating: Number(String(details?.ratingAgeLimits || details?.ageRating || "").replace(/\D/g, "")) || card.ageRating || 0,
        imdbRating: Number(details?.ratingImdb || details?.imdbRating || 0) || card.imdbRating || null,
        kpRating: Number(details?.ratingKinopoisk || details?.rating || 0) || card.kpRating || null,
        originalTitle: details?.nameOriginal || details?.nameEn || card.originalTitle || card.title,
        tagline: String(details?.slogan || "").trim(),
        overview: String(details?.description || details?.shortDescription || "").trim()
      };
    }

    async function onSelectCard(card, cardEl) {
      state.selectedId = card.id;
      state.selectedType = card.mediaType;
      resetProviderAvailability();
      renderProviderSwitch();
      markActiveCard(cardEl);
      const selection = ++detailSelection;
      openFullscreenFilm(card, cardEl);
      setHero(card);

      let detailsResolved = false;
      try {
        const details = await fetchDetails(card);
        if (selection !== detailSelection || !fullscreenFilmEl.classList.contains("is-open")) return;
        const enrichedCard = { ...card, ...details, details, genres: card.genres?.length ? card.genres : String(details.genreLabel || "").split(" • ").filter(Boolean), countries: card.countries?.length ? card.countries : String(details.countryLabel || "").split(", ").filter(Boolean), seasons: details.seasons || card.seasons };
        state.selectedCard = enrichedCard;
        setHero(enrichedCard);
        renderFullscreenFilm(enrichedCard);
        detailsResolved = true;
      } catch (error) {
        console.warn("Details request failed:", error);
      }

      if (!detailsResolved && selection === detailSelection) renderFullscreenFilm(card);
    }

    async function search(query) {
      if (state.collection !== "catalog") {
        state.lastQuery = String(query || "").trim();
        renderActiveCollection();
        return;
      }
      const seq = ++state.searchSeq;
      const trimmed = query.trim();
      state.lastQuery = trimmed;
      state.pagesLoaded = 0;
      state.pagesTotal = 0;
      state.hasMore = false;
      state.totalResults = 0;
      state.loadingMore = false;
      updateDiscoverState(Boolean(trimmed));
      resultsEl.dataset.view = trimmed ? "search" : "home";
      closeDetailsPanel();
      renderActiveFilterChips();
      resultsEl.scrollTop = 0;
      resultsEl.setAttribute("aria-busy", "true");
      document.getElementById("catalogSummary").textContent = trimmed || filterCount() ? "Ищем в каталоге…" : "";

      renderSkeletons();
      hideStatus();

      try {
        const cards = await fetchCardsPage(trimmed, 1, seq);
        if (seq !== state.searchSeq) return;
        state.rawCards = cards;
        state.pagesLoaded = 1;
        renderActiveCollection();
      } catch (error) {
        if (seq !== state.searchSeq) return;
        const message = String(error?.message || "");
        if (message === "KINOPOISK_PROXY_ROUTE_MISCONFIGURED") {
          resultsEl.innerHTML = '<div class="results-empty">Proxy route не настроен: backend получает ответ <code>ok</code> вместо JSON.</div>';
          return;
        }
        if (message === "KINOPOISK_NON_JSON_RESPONSE") {
          resultsEl.innerHTML = '<div class="results-empty">Backend вернул не-JSON ответ. Проверьте проксирование на realtime-сервере.</div>';
          return;
        }
        if (message.includes("KINOPOISK_HTTP_401")) {
          resultsEl.innerHTML = '<div class="results-empty">Ошибка авторизации в API Kinopoisk Unofficial. Проверьте токен на backend.</div>';
          return;
        }
        resultsEl.innerHTML = '<div class="results-empty"><strong>Не удалось загрузить каталог</strong><p>Попробуйте ещё раз через несколько секунд.</p><button class="toolbar-btn" id="retryCatalogBtn" type="button">Повторить</button></div>';
        document.getElementById("retryCatalogBtn")?.addEventListener("click", () => search(state.lastQuery));
        document.getElementById("catalogSummary").textContent = "Каталог временно недоступен";
      } finally {
        if (seq === state.searchSeq) resultsEl.setAttribute("aria-busy", "false");
      }
    }

    function setMode(nextMode) {
      state.mode = nextMode;
      modeSwitchEl.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.mode === nextMode);
      });
      search(searchInputEl.value);
    }

    function handleTvArrowNavigation(event) {
      const key = getTvEventKey(event);
      if (!TV_ARROW_KEYS.has(key)) return;
      if (event.defaultPrevented) return;
      if (isTextEntryElement(event.target)) return;
      const direction = key === "ArrowLeft"
        ? "left"
        : key === "ArrowRight"
          ? "right"
          : key === "ArrowUp"
            ? "up"
            : "down";
      const focusables = getTvFocusableElements();
      if (!focusables.length) return;
      const current = focusables.includes(document.activeElement) ? document.activeElement : null;
      if (!current) {
        const fallback = getDefaultTvFocusTarget(focusables);
        if (fallback && focusElementForTv(fallback)) {
          event.preventDefault();
        }
        return;
      }
      if (current.classList && current.classList.contains("movie-card")) {
        const cardTarget = findAdjacentResultCard(current, direction);
        if (cardTarget && focusElementForTv(cardTarget)) {
          event.preventDefault();
          return;
        }
      }
      const next = findNextTvFocusable(current, direction, focusables);
      if (!next || next === current) {
        if (direction === "left" && requestHostSidebarFocus()) {
          event.preventDefault();
        }
        return;
      }
      if (focusElementForTv(next)) {
        event.preventDefault();
      }
    }

    modeSwitchEl.addEventListener("click", (event) => {
      const button = event.target.closest(".mode-btn");
      if (!button) return;
      const mode = button.dataset.mode;
      if (!mode || mode === state.mode) return;
      setMode(mode);
    });

    filterToggleBtnEl.addEventListener("click", () => setFilterPanelOpen(true));
    filterCloseBtnEl.addEventListener("click", () => setFilterPanelOpen(false));
    filterBackdropEl.addEventListener("click", () => setFilterPanelOpen(false));
    filterApplyBtnEl.addEventListener("click", () => {
      readFiltersFromPanel();
      setFilterPanelOpen(false);
      if (state.collection === "catalog") search(state.lastQuery);
      else renderActiveCollection();
    });
    filterResetBtnEl.addEventListener("click", () => {
      state.filters = createDefaultFilters();
      syncFilterPanel();
      if (state.collection === "catalog") search(state.lastQuery);
      else renderActiveCollection();
    });
    randomizerOpenBtnEl?.addEventListener("click", () => setRandomizerOpen(true));
    randomizerOpenBtnEl?.addEventListener("pointerenter", () => { if (randomizerDialogEl.hidden) prepareRandomizerBatch(randomizerParams()).catch(() => {}); }, { passive: true });
    randomizerOpenBtnEl?.addEventListener("focusin", () => { if (randomizerDialogEl.hidden) prepareRandomizerBatch(randomizerParams()).catch(() => {}); });
    randomizerCloseBtnEl?.addEventListener("click", () => setRandomizerOpen(false));
    randomizerBackdropEl?.addEventListener("click", () => setRandomizerOpen(false));
    randomizerFormEl?.addEventListener("submit", event => { event.preventDefault(); pickRandomFilm(); });
    randomizerResultEl?.addEventListener("click", event => {
      if (!event.target.closest(".randomizer-poster-button, .randomizer-details")) return;
      if (!randomizerState.result || randomizerState.busy) return;
      randomizerState.returnAfterFilm = true;
      setRandomizerOpen(false, false);
      onSelectCard(randomizerState.result, null);
    });
    randomizerFormEl.addEventListener("input", warmRandomizerBatch);
    randomizerFormEl.addEventListener("change", () => {
      if (randomizerState.busy) {
        randomizerState.sequence++;
        for (const entry of randomizerBatches.values()) if (entry.pending) entry.controller.abort();
        randomizerState.animation?.cancel();
        randomizerState.busy = false;
        randomizerSubmitEl.disabled = false;
        randomizerSubmitEl.classList.remove("is-loading");
        randomizerResultEl.setAttribute("aria-busy", "false");
        if (randomizerState.result) renderRandomizerCard(randomizerState.result);
      }
      randomizerSubmitEl.querySelector("span").textContent = "Подобрать фильм";
      randomizerHintEl.textContent = "";
      warmRandomizerBatch();
    });
    randomizerDialogEl.addEventListener("keydown", event => {
      if (event.key !== "Tab" || document.querySelector(".movie-select-portal.is-open")) return;
      const focusable = [...randomizerDialogEl.querySelectorAll('button:not(:disabled), input:not(:disabled), a[href], summary')].filter(el => el.getClientRects().length);
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
    });
    collectionTabsEl.addEventListener("click", (event) => {
      const tab = event.target.closest("[data-collection]");
      if (!tab) return;
      state.collection = tab.dataset.collection || "catalog";
      collectionTabsEl.querySelectorAll(".collection-tab").forEach(item => { item.classList.toggle("active", item === tab); item.setAttribute("aria-selected", String(item === tab)); });
      if (state.collection === "catalog") search(state.lastQuery); else renderActiveCollection();
    });
    activeFiltersEl.addEventListener("click", event => {
      const button = event.target.closest("[data-chip-index]");
      if (!button) return;
      const index = Number(button.dataset.chipIndex);
      const f = state.filters;
      const entries = [];
      f.types.forEach(value => entries.push({ key: "types", value })); f.genres.forEach(value => entries.push({ key: "genres", value })); f.countries.forEach(value => entries.push({ key: "countries", value }));
      ["yearFrom","yearTo","kpFrom","kpTo","imdbFrom","imdbTo","ageRating","runtimeMax","seasonsMin","watchStatus","favoriteOnly"].forEach(key => { if (f[key] && f[key] !== "all" && f[key] !== false) entries.push({ key, value: f[key] }); });
      const item = entries[index]; if (!item) return;
      if (Array.isArray(f[item.key])) f[item.key] = f[item.key].filter(value => value !== item.value); else f[item.key] = item.key === "watchStatus" ? "all" : item.key === "favoriteOnly" ? false : "";
      syncFilterPanel();
      if (state.collection === "catalog") search(state.lastQuery);
      else renderActiveCollection();
    });

    fullscreenCloseBtnEl.addEventListener("click", closeFullscreenFilm);
    favoriteBtnEl.addEventListener("click", () => toggleMovieLibrary("favorites", state.selectedCard));
    watchedBtnEl?.addEventListener("click", () => toggleMovieLibrary("watched", state.selectedCard));
    fullscreenPlayBtnEl.addEventListener("click", async () => {
      if (fullscreenFilmEl.classList.contains("is-playing")) {
        playerRequestSeq++;
        playerHostEl.replaceChildren();
        state.selectedSourceUrl = "";
        fullscreenFilmEl.classList.remove("is-playing");
        document.getElementById("fullscreenInfo").inert = false;
        fullscreenPlayBtnEl.innerHTML = PLAY_BUTTON_HTML;
        return;
      }
      const card = state.selectedCard;
      if (!card) return;
      const selection = detailSelection;
      document.getElementById("filmPlayer").append(document.querySelector(".player-panel"));
      fullscreenFilmEl.classList.add("is-playing");
      document.getElementById("fullscreenInfo").inert = true;
      fullscreenFilmEl.scrollTop = 0;
      fullscreenPlayBtnEl.innerHTML = '<span aria-hidden="true">←</span><span>О фильме</span>';
      showStatus("Подключаем плеер", "Это займёт несколько секунд", true);
      try { await loadBalancerSources(card.id, { providerId: "alloha", allowFallback: false }); }
      catch (_) {
        if (selection === detailSelection && fullscreenFilmEl.classList.contains("is-playing"))
          showStatus("Плеер недоступен", "Попробуйте открыть фильм ещё раз.");
      }
    });
    fullscreenFilmEl.addEventListener("click", event => { if (event.target === fullscreenFilmEl) closeFullscreenFilm(); });

    sourceSwitchEl.addEventListener("click", (event) => {
      const button = event.target.closest(".source-btn");
      if (!button) return;
      const providerId = String(button.dataset.provider || "").trim().toLowerCase();
      if (!isProviderId(providerId)) return;
      state.selectedProvider = providerId;
      renderProviderSwitch();
      if (!state.selectedId) return;
      loadBalancerSources(state.selectedId, {
        providerId,
        allowFallback: true,
        force: false
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (document.querySelector(".movie-select-portal.is-open")) { window.MovieSelect.closeAll(); event.preventDefault(); return; }
        if (!randomizerDialogEl?.hidden) { setRandomizerOpen(false); event.preventDefault(); return; }
        if (filterPanelEl.classList.contains("is-open")) { setFilterPanelOpen(false); event.preventDefault(); return; }
        if (fullscreenFilmEl.classList.contains("is-open")) { closeFullscreenFilm(); event.preventDefault(); return; }
      }
      const key = getTvEventKey(event);
      if (!TV_BACK_KEYS.has(key)) return;
      handleTvBackAction(event);
    });

    document.addEventListener("keydown", handleTvArrowNavigation);

    document.addEventListener("backbutton", (event) => {
      handleTvBackAction(event);
    }, true);

    window.addEventListener("popstate", (event) => {
      if (!isAndroidTv) return;
      if (handleTvBackAction(event)) {
        rearmTvBackHistoryGuard();
      }
    });


    function updateResultsTopButton(measure = false) {
      if (measure) {
        const nextCard = resultsEl.querySelector(".movie-card:nth-child(21)");
        resultsTopThreshold = nextCard ? nextCard.getBoundingClientRect().top - resultsEl.getBoundingClientRect().top + resultsEl.scrollTop : Infinity;
      }
      resultsTopBtnEl.classList.toggle("is-visible", resultsEl.scrollTop >= resultsTopThreshold - 32);
    }
    window.addEventListener("resize", () => updateResultsTopButton(true), { passive: true });
    resultsEl.addEventListener("scroll", () => {
      updateResultsTopButton();
      if (document.body.classList.contains("randomizer-open") || state.collection !== "catalog" || state.loadingMore || !hasMorePages()) return;
      const threshold = 420;
      const distanceToBottom = resultsEl.scrollHeight - (resultsEl.scrollTop + resultsEl.clientHeight);
      if (distanceToBottom <= threshold) {
        loadNextPage();
      }
    }, { passive: true });
    resultsTopBtnEl.addEventListener("click", () => resultsEl.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth" }));

    window.addEventListener("message", (event) => {
      const data = event && event.data ? event.data : null;
      if (!data || typeof data !== "object") return;
      if (data.type === "video:host-docked" && state.playerDetached && state.detachedMode === "host") {
        state.playerDetached = false;
        state.detachedMode = "";
        stageEl.classList.remove("is-detached");
        playerPlaceholderEl.style.display = "";
        setDetachButtonState();
        updatePlayerEnterButtonState();
        if (state.selectedSourceUrl) mountIframe(state.selectedSourceUrl);
      }
    });

    searchFormEl.addEventListener("submit", (event) => {
      event.preventDefault();
      search(searchInputEl.value);
    });

    searchInputEl.addEventListener("input", () => {
      clearSearchBtnEl.classList.toggle("visible", Boolean(searchInputEl.value));
    });

    clearSearchBtnEl.addEventListener("click", () => {
      searchInputEl.value = "";
      updateDiscoverState(false);
      search("");
      searchInputEl.focus({ preventScroll: true });
    });

    headBackBtnEl.addEventListener("click", () => {
      searchInputEl.value = "";
      if (state.mode !== "multi") {
        state.mode = "multi";
        modeSwitchEl.querySelectorAll(".mode-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.mode === "multi");
        });
      }
      search("");
    });

    detailCloseBtnEl.addEventListener("click", () => {
      closeDetailsPanel();
    });

    if (playerEnterBtnEl) {
      playerEnterBtnEl.addEventListener("click", () => {
        focusIframePlayer();
      });
    }

    detachBtnEl.addEventListener("click", () => {
      if (window.matchMedia("(max-width: 1100px)").matches) {
        requestNativePictureInPicture();
        return;
      }
      if (state.playerDetached) {
        dockPlayer();
      } else {
        detachPlayer();
      }
    });

    window.addEventListener("resize", () => {
      setDetachButtonState();
    });

    renderProviderSwitch();
    setDetachButtonState();
    updatePlayerEnterButtonState();
    initTvTextInputActivation();
    ensureTvBackHistoryGuard();
    initCustomSelects();
    initMovieLibrary();
    loadFilterOptions();

    search("");
    requestAnimationFrame(() => {
      if (isAndroidTv) {
        focusElementForTv(searchBtnEl || modeSwitchEl.querySelector(".mode-btn.active") || searchInputEl);
        return;
      }
      focusElementForTv(searchInputEl);
    });
  </script>
</body>
</html>
