<head>

  <style>
    :root {
      --bg-0: #000000;
      --bg-1: #060606;
      --panel: rgba(13, 13, 13, 0.84);
      --panel-strong: rgba(10, 10, 10, 0.95);
      --stroke: rgba(245, 158, 11, 0.24);
      --text: #f8fafc;
      --muted: #b9bfcc;
      --accent: #f59e0b;
      --accent-2: #fcd34d;
      --good: #45d19b;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.48);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100%;
      color: var(--text);
      font-family: "Comfortaa", cursive;
      background: radial-gradient(circle at 12% 14%, rgba(245, 158, 11, 0.14) 0%, transparent 42%),
        radial-gradient(circle at 88% 18%, rgba(251, 191, 36, 0.12) 0%, transparent 35%),
        linear-gradient(150deg, var(--bg-0), var(--bg-1));
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.55;
      z-index: 0;
      animation: none;
    }

    @keyframes grainShift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1%, 1%); }
      50% { transform: translate(1%, -0.5%); }
      75% { transform: translate(0.5%, 1%); }
      100% { transform: translate(0, 0); }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      animation: none;
    }

    .orb-a {
      width: 280px;
      height: 280px;
      left: -80px;
      top: 8%;
      background: rgba(245, 158, 11, 0.32);
    }

    .orb-b {
      width: 340px;
      height: 340px;
      right: -130px;
      top: 38%;
      background: rgba(251, 191, 36, 0.28);
      animation-delay: -4s;
    }

    .orb-c {
      width: 250px;
      height: 250px;
      left: 38%;
      bottom: -90px;
      background: rgba(245, 158, 11, 0.2);
      animation-delay: -8s;
    }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-24px) translateX(10px); }
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 8px 10px;
      display: grid;
      gap: 0;
      height: 100dvh;
      min-height: 100dvh;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 0fr);
      gap: 0;
      align-items: stretch;
      height: 100%;
      min-height: 0;
      flex: 1;
      width: 100%;
      transition: grid-template-columns 0.36s cubic-bezier(0.22, 0.8, 0.22, 1), gap 0.28s ease;
      contain: layout;
    }

    .layout.is-details-open {
      grid-template-columns: minmax(520px, 1.06fr) minmax(360px, 0.94fr);
      gap: 10px;
    }

    .panel {
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.075);
      background: var(--panel);
      backdrop-filter: none;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    .discover {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      animation: reveal 1s ease both;
      animation-delay: 0.1s;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    .discover-head {
      display: none !important;
      padding: 22px 22px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .discover-head.has-back {
      display: block;
    }

    .discover-head-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .head-back-btn {
      border: 1px solid rgba(245, 158, 11, 0.36);
      background: rgba(245, 158, 11, 0.12);
      color: #fde68a;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: inherit;
      display: none;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }

    .head-back-btn::before {
      content: "←";
      font-size: 0.95rem;
      line-height: 1;
    }

    .head-back-btn.visible {
      display: inline-flex;
    }

    .head-back-btn:hover {
      transform: translateY(-1px);
      background: rgba(245, 158, 11, 0.2);
      border-color: rgba(245, 158, 11, 0.52);
    }

    .head-back-btn:focus-visible,
    .search-input:focus-visible,
    .btn-main:focus-visible,
    .mode-btn:focus-visible,
    .source-btn:focus-visible,
    .hero-action-btn:focus-visible,
    .floating-player-dock:focus-visible {
      outline: 2px solid rgba(252, 211, 77, 0.9);
      outline-offset: 2px;
    }

    .discover-head p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .search-wrap {
      padding: 16px 22px;
      display: grid;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .catalog-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      flex-wrap: nowrap;
    }

    .catalog-toolbar > .mode-switch { flex: 0 0 auto; flex-wrap: nowrap; }

    .catalog-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-left: auto;
      flex-wrap: nowrap;
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 11px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.045);
      color: #ebe7dc;
      font: 700 0.74rem/1 "Comfortaa", cursive;
      cursor: pointer;
      transition: transform .22s ease, border-color .22s ease, background .22s ease, color .22s ease;
    }

    .toolbar-btn select,
    select.toolbar-btn { appearance: none; -webkit-appearance: none; }

    .toolbar-btn.icon-only { width: 34px; padding-inline: 8px; }

    .custom-select { position: relative; min-width: 0; }
    .custom-select > select { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .custom-select-trigger { min-width: 138px; justify-content: space-between; }
    .custom-select-trigger::after { content: "⌄"; margin-left: 4px; font-size: .9rem; transition: transform .22s ease; }
    .custom-select.is-open .custom-select-trigger::after { transform: rotate(180deg); }
    .custom-select-menu { position: absolute; top: calc(100% + 7px); right: 0; z-index: 120; min-width: 100%; max-height: 260px; overflow: auto; padding: 5px; border: 1px solid rgba(245,190,80,.22); border-radius: 13px; background: rgba(14,17,18,.98); box-shadow: 0 18px 50px rgba(0,0,0,.42); opacity: 0; visibility: hidden; transform: translateY(-5px) scale(.98); transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s; }
    .custom-select.is-open .custom-select-menu { opacity: 1; visibility: visible; transform: translateY(0) scale(1); transition-delay: 0s; }
    .movie-select-portal { position: fixed; inset: auto; z-index: 260; min-width: 0; max-height: 320px; pointer-events: none; }
    .movie-select-portal.is-open { pointer-events: auto; }
    .movie-select-portal .custom-select-search { display: block; }
    .movie-select-portal .select-empty { margin: 8px; color: rgba(247,244,234,.5); font-size: .72rem; }
    .custom-select-option { display: block; width: 100%; padding: 9px 10px; border: 0; border-radius: 9px; background: transparent; color: rgba(247,244,234,.76); font: 600 .72rem/1.2 "Comfortaa", cursive; text-align: left; cursor: pointer; }
    .custom-select-option:hover, .custom-select-option:focus-visible, .custom-select-option.is-selected { background: rgba(245,190,80,.13); color: #ffe6a8; outline: none; }
    .custom-select-search { width: 100%; margin-bottom: 4px; padding: 8px 9px; border: 0; border-bottom: 1px solid rgba(255,255,255,.1); background: transparent; color: var(--text); font: 600 .72rem/1.2 "Comfortaa", cursive; outline: none; }

    .toolbar-btn:hover,
    .toolbar-btn:focus-visible {
      border-color: rgba(245, 190, 80, .62);
      background: rgba(245, 190, 80, .13);
      color: #ffe6a8;
      outline: none;
      transform: translateY(-1px);
    }

    .toolbar-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .filter-count {
      display: none;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      place-items: center;
      border-radius: 999px;
      background: var(--accent);
      color: #251b0b;
      font-size: .66rem;
      font-weight: 900;
    }

    .filter-count.visible { display: inline-grid; }

    .collection-tabs {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .collection-tabs::-webkit-scrollbar { display: none; }

    .collection-tab {
      border: 0;
      border-radius: 999px;
      padding: 7px 10px;
      white-space: nowrap;
      background: transparent;
      color: rgba(233, 229, 216, .62);
      font: 700 .7rem/1 "Comfortaa", cursive;
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }

    .collection-tab.active { background: rgba(245, 190, 80, .14); color: #ffe6a8; }

    .active-filters {
      display: none;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 2px;
    }

    .active-filters.visible { display: flex; }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(245, 190, 80, .28);
      border-radius: 999px;
      padding: 5px 8px;
      background: rgba(245, 190, 80, .09);
      color: #f7dda0;
      font-size: .67rem;
    }

    .filter-chip button { border: 0; padding: 0; background: transparent; color: inherit; cursor: pointer; font-size: .9rem; line-height: .8; }

    .filter-panel {
      position: fixed;
      inset: 0 0 0 auto;
      z-index: 80;
      width: min(420px, 100vw);
      display: flex;
      flex-direction: column;
      background: rgba(10, 12, 13, .98);
      border-left: 1px solid rgba(245, 190, 80, .24);
      box-shadow: -28px 0 80px rgba(0,0,0,.42);
      transform: translateX(102%);
      visibility: hidden;
      transition: transform .34s cubic-bezier(.22,.8,.22,1), visibility 0s linear .34s;
    }

    .filter-panel.is-open { transform: translateX(0); visibility: visible; transition-delay: 0s; }

    .filter-backdrop {
      position: fixed;
      inset: 0;
      z-index: 79;
      background: rgba(2, 3, 4, .58);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .filter-backdrop.is-open { opacity: 1; pointer-events: auto; }

    .filter-head,
    .filter-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px; flex: 0 0 auto; }
    .filter-head .hero-action-btn { position: static; width: 34px; height: 34px; opacity: 1; pointer-events: auto; }
    .filter-head { border-bottom: 1px solid rgba(255,255,255,.09); }
    .filter-head h2 { margin: 0; font-size: 1rem; }
    .filter-foot { border-top: 1px solid rgba(255,255,255,.09); }
    .filter-scroll { min-height: 0; overflow-y: auto; padding: 18px; display: grid; gap: 16px; }
    .filter-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .filter-field { display: grid; gap: 6px; min-width: 0; }
    .filter-field.full { grid-column: 1 / -1; }
    .filter-field label { color: rgba(240,235,220,.64); font-size: .68rem; }
    .filter-field input,
    .filter-field select { width: 100%; min-height: 36px; padding: 8px 10px; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; background: rgba(255,255,255,.045); color: var(--text); font: 500 .78rem/1.2 "Comfortaa", cursive; outline: none; }
    .filter-field .custom-select { width: 100%; }
    .filter-field .custom-select-trigger { width: 100%; min-height: 36px; justify-content: space-between; }
    .filter-field .custom-select-menu { left: 0; right: auto; width: 100%; }
    .filter-field input:focus, .filter-field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,190,80,.13); }
    .filter-checks { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-check { display: inline-flex; align-items: center; gap: 6px; padding: 7px 9px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(255,255,255,.035); color: rgba(240,235,220,.8); font-size: .67rem; cursor: pointer; }
    .filter-check:has(input:checked) { border-color: rgba(245,190,80,.56); background: rgba(245,190,80,.13); color: #ffe6a8; }
    .filter-check input { accent-color: var(--accent); }

    .kp-badge { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .rating-source-icon { width: 16px; height: 16px; display: block; object-fit: contain; flex: 0 0 auto; }
    .rating-source-fallback { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; background: rgba(245,190,80,.2); color: #ffe6a8; font: 900 8px/1 Arial, sans-serif; }
    .rating-source-icon.imdb { width: 20px; }

    .fullscreen-film {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: grid;
      grid-template-columns: minmax(220px, 340px) minmax(0, 1fr);
      align-items: end;
      gap: clamp(22px, 5vw, 76px);
      padding: clamp(24px, 7vw, 92px);
      overflow: auto;
      background: #080a09;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(1.025);
      transition: opacity .34s ease, transform .46s cubic-bezier(.22,.8,.22,1), visibility 0s linear .46s;
    }

    .fullscreen-film::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4,7,6,.94) 0%, rgba(4,7,6,.68) 34%, rgba(4,7,6,.48) 68%, rgba(4,7,6,.8) 100%), linear-gradient(0deg, rgba(4,7,6,.96), transparent 55%); z-index: -1; }
    .fullscreen-film.is-open { opacity: 1; visibility: visible; pointer-events: auto; transform: scale(1); transition-delay: 0s; }
    .fullscreen-backdrop { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; filter: saturate(.72); opacity: .72; }
    .fullscreen-poster { width: min(100%, 340px); aspect-ratio: 2 / 3; object-fit: cover; border-radius: 18px; box-shadow: 0 24px 80px rgba(0,0,0,.52); border: 1px solid rgba(255,255,255,.14); transform-origin: center; transition: transform .5s cubic-bezier(.22,.8,.22,1); }
    .fullscreen-film.is-open .fullscreen-poster { transform: translateY(0) scale(1); }
    .fullscreen-copy { align-self: end; max-width: 780px; padding-bottom: 2vh; }
    .fullscreen-title { margin: 0; font-size: clamp(2rem, 5vw, 5.2rem); line-height: .98; letter-spacing: -.04em; }
    .fullscreen-original { margin: 10px 0 18px; color: rgba(239,235,222,.62); font-size: clamp(.8rem, 1.2vw, 1.05rem); }
    .fullscreen-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
    .fullscreen-description { max-width: 70ch; color: rgba(246,243,233,.82); line-height: 1.6; font-size: .9rem; }
    .fullscreen-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 22px; }
    .fullscreen-close { position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); }
    .fullscreen-action.active { border-color: rgba(69,209,155,.68); background: rgba(69,209,155,.15); color: #d2faea; }
    .fullscreen-extra { margin-top: 22px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; color: rgba(239,235,222,.66); font-size: .7rem; }
    body.film-fullscreen-open { overflow: hidden; }
    .fullscreen-extra strong { display: block; color: rgba(255,244,211,.92); font-size: .78rem; margin-top: 3px; }

    .search-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(8, 12, 11, 0.86);
      color: var(--text);
      font-family: "Comfortaa", cursive;
      padding: 13px 14px;
      padding-right: 44px;
      border-radius: 14px;
      outline: none;
      font-size: 0.97rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input::placeholder {
      font-family: "Comfortaa", cursive;
    }

    .search-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(244, 190, 80, 0.15);
    }

    .search-clear {
      position: absolute;
      top: 50%;
      right: 126px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(248, 250, 252, 0.54);
      font: 700 1rem/1 Arial, sans-serif;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, color 0.18s ease, background 0.18s ease;
      z-index: 2;
    }

    .search-clear.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .search-clear:hover,
    .search-clear:focus-visible {
      color: #fff4cf;
      background: rgba(245, 190, 80, 0.16);
      outline: none;
    }

    .btn-main {
      border: none;
      background: linear-gradient(130deg, var(--accent), #f0a82d);
      color: #241b0e;
      font-family: "Comfortaa", cursive;
      font-weight: 800;
      padding: 0 16px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.95rem;
      min-width: 114px;
      transition: transform 0.24s ease, filter 0.24s ease;
    }

    .btn-main:hover {
      transform: translateY(-1px) scale(1.01);
      filter: brightness(1.02);
    }

    .mode-switch {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-btn {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-family: "Comfortaa", cursive;
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 0.83rem;
      transition: all 0.22s ease;
    }

    .mode-btn.active {
      border-color: rgba(245, 190, 80, 0.68);
      background: rgba(245, 190, 80, 0.16);
      color: #ffe6a8;
      box-shadow: 0 8px 18px rgba(245, 190, 80, 0.18);
    }

    .results {
      padding: 16px 18px 20px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      align-content: start;
      grid-auto-rows: max-content;
      min-height: 0;
      height: 100%;
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(245, 190, 80, 0.55) transparent;
    }

    .results[data-view="search"] {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .results::-webkit-scrollbar {
      width: 8px;
    }

    .results::-webkit-scrollbar-thumb {
      background: rgba(245, 190, 80, 0.58);
      border-radius: 999px;
    }

    .movie-card {
      position: relative;
      cursor: pointer;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.085);
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: none;
      opacity: 1;
      animation: none;
      animation-delay: var(--stagger, 0ms);
      transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.24s ease, box-shadow 0.32s ease;

    }

    .movie-card:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(244, 190, 80, 0.52);
      box-shadow: 0 15px 36px rgba(0, 0, 0, 0.3);
    }

    .movie-card:focus-visible {
      outline: 2px solid rgba(252, 211, 77, 0.9);
      outline-offset: 2px;
      border-color: rgba(252, 211, 77, 0.72);
      box-shadow: 0 0 0 1px rgba(252, 211, 77, 0.45), 0 15px 32px rgba(0, 0, 0, 0.35);
    }

    .movie-card.active {
      border-color: rgba(69, 209, 155, 0.82);
      box-shadow: 0 0 0 1px rgba(69, 209, 155, 0.55), 0 16px 32px rgba(0, 0, 0, 0.36);
    }

    .movie-poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      min-height: 0;
      background: rgba(0, 0, 0, 0.6);
      overflow: hidden;
      flex: 0 0 auto;

    function isTextEntryElement(el) {

      if (tag !== "INPUT") return false;

      return !["button", "submit", "reset", "checkbox", "radio", "range", "file", "color"].includes(type);
    }

    function isTvManagedTextInput(el) {

      return isTextEntryElement(el) && !el.disabled;
    }

    function lockTvTextInput(el) {
      if (!isTvManagedTextInput(el)) return;
      if (el.dataset.tvManagedInput !== "1") {
        el.dataset.tvManagedInput = "1";
      }
      if (el instanceof HTMLInputElement) {
        if (!el.dataset.tvInputType) {
          el.dataset.tvInputType = String(el.getAttribute("type") || el.type || "text").toLowerCase();
        }
        if (el.dataset.tvInputType === "search") {

      el.dataset.tvInputActivated = "0";
      el.readOnly = true;
      el.setAttribute("inputmode", "none");

    function unlockTvTextInput(el) {
      if (!isTvManagedTextInput(el)) return;
      if (el.dataset.tvManagedInput !== "1") return;
      el.dataset.tvInputActivated = "1";
      el.readOnly = false;
      if (el instanceof HTMLInputElement) {
        const initialType = String(el.dataset.tvInputType || "").toLowerCase();
        if (initialType && el.getAttribute("type") !== initialType) {
          el.setAttribute("type", initialType);
        }
      }
      if (el.getAttribute("inputmode") === "none") {
        el.removeAttribute("inputmode");
      }
      if (el.getAttribute("virtualkeyboardpolicy") === "manual") {
        el.removeAttribute("virtualkeyboardpolicy");
      }
    }

    function relockTvTextInput(el) {
      if (!isTvManagedTextInput(el)) return;
      if (el.dataset.tvManagedInput !== "1") return;
      if (el instanceof HTMLInputElement) {
        const initialType = String(el.dataset.tvInputType || "").toLowerCase();
        if (initialType === "search" && el.getAttribute("type") !== "text") {
          el.setAttribute("type", "text");

      el.dataset.tvInputActivated = "0";

      el.setAttribute("virtualkeyboardpolicy", "manual");
    }

    function initTvTextInputActivation() {
      if (!isAndroidTv) return;
      document.querySelectorAll("input, textarea").forEach(lockTvTextInput);

      document.addEventListener("focusin", (event) => {
        const el = event.target;
        if (!isTvManagedTextInput(el)) return;
        lockTvTextInput(el);
      });

      document.addEventListener("focusout", (event) => {
        const el = event.target;
        if (!isTvManagedTextInput(el)) return;
        setTimeout(() => {
          if (document.activeElement === el) return;
          relockTvTextInput(el);
        }, 0);
      });

      document.addEventListener("pointerdown", (event) => {
        const el = event.target && event.target.closest ? event.target.closest("input,textarea") : null;
        if (!isTvManagedTextInput(el)) return;
        unlockTvTextInput(el);
      }, true);

      document.addEventListener("click", (event) => {
        const el = event.target && event.target.closest ? event.target.closest("input,textarea") : null;
        if (!isTvManagedTextInput(el)) return;
        unlockTvTextInput(el);
      }, true);

      document.addEventListener("keydown", (event) => {
        const el = event.target;
        if (!isTvManagedTextInput(el)) return;
        const key = getTvEventKey(event);
        if (!TV_SELECT_KEYS.has(key)) return;
        if (!el.readOnly) return;
        event.preventDefault();
        unlockTvTextInput(el);
        if (typeof el.focus === "function") el.focus({ preventScroll: true });
      }, true);
    }

    function isElementVisibleForTvNavigation(el) {

      if (!style) return false;
      if (style.display === "none" || style.visibility === "hidden" || style.pointerEvents === "none") return false;

      return rect.width > 0 && rect.height > 0;
    }

    function getTvFocusableElements() {
      const selectors = [
        "button:not([disabled])",
        "input:not([disabled])",
        "select:not([disabled])",
        "textarea:not([disabled])",
        "a[href]",
        "iframe",

    function focusElementForTv(el) {

    function getDefaultTvFocusTarget(focusables) {
      if (searchBtnEl && focusables.includes(searchBtnEl)) return searchBtnEl;
      const activeCard = resultsEl.querySelector(".movie-card.active");
      if (activeCard && focusables.includes(activeCard)) return activeCard;

    function findNextTvFocusable(current, direction, focusables) {
      if (!current || !focusables.length) return null;
      const currentRect = current.getBoundingClientRect();
      const currentCx = currentRect.left + currentRect.width / 2;
      const currentCy = currentRect.top + currentRect.height / 2;
      let best = null;
      let bestScore = Number.POSITIVE_INFINITY;

      focusables.forEach((candidate) => {
        if (!candidate || candidate === current) return;
        const rect = candidate.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = cx - currentCx;
        const dy = cy - currentCy;

        let primary = 0;
        let secondary = 0;
        if (direction === "left") {
          if (dx >= -4) return;
          primary = -dx;
          secondary = Math.abs(dy);
        } else if (direction === "right") {
          if (dx <= 4) return;
          primary = dx;
          secondary = Math.abs(dy);
        } else if (direction === "up") {
          if (dy >= -4) return;
          primary = -dy;
          secondary = Math.abs(dx);
        } else if (direction === "down") {
          if (dy <= 4) return;
          primary = dy;
          secondary = Math.abs(dx);
        } else {
          return;
        }

        const distance = Math.hypot(dx, dy);
        const score = primary * 1000 + secondary * 10 + distance;
        if (score < bestScore) {
          best = candidate;
          bestScore = score;
        }
      });
      return best;
    }

    function buildResultCardRows(cards) {
      const rows = [];
      cards.forEach((card) => {
        const rect = card.getBoundingClientRect();
        const top = rect.top;
        let row = rows.find((entry) => Math.abs(entry.top - top) <= 18);
        if (!row) {
          row = { top, cards: [] };
          rows.push(row);
        }
        row.cards.push(card);
      });
      rows.sort((a, b) => a.top - b.top);
      rows.forEach((row) => {
        row.cards.sort((a, b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left);
      });
      return rows;
    }

    function findAdjacentResultCard(current, direction) {
      if (!current || !current.classList || !current.classList.contains("movie-card")) return null;
      const cards = Array.from(resultsEl.querySelectorAll(".movie-card")).filter(isElementVisibleForTvNavigation);
      if (!cards.length) return null;
      const rows = buildResultCardRows(cards);
      let rowIndex = -1;
      let colIndex = -1;

      rows.some((row, rIdx) => {
        const idx = row.cards.indexOf(current);
        if (idx === -1) return false;
        rowIndex = rIdx;
        colIndex = idx;
        return true;
      });
      if (rowIndex < 0 || colIndex < 0) return null;

      if (direction === "left") {
        return rows[rowIndex].cards[colIndex - 1] || null;
      }
      if (direction === "right") {
        return rows[rowIndex].cards[colIndex + 1] || null;
      }
      if (direction === "up") {
        const prevRow = rows[rowIndex - 1];
        if (!prevRow) return null;
        return prevRow.cards[Math.min(colIndex, prevRow.cards.length - 1)] || null;
      }
      if (direction === "down") {
        const nextRow = rows[rowIndex + 1];
        if (!nextRow) return null;
        return nextRow.cards[Math.min(colIndex, nextRow.cards.length - 1)] || null;
      }
      return null;
    }

    async function requestNativePictureInPicture() {
      const iframe = playerHostEl.querySelector("iframe");
      if (!iframe || !state.selectedSourceUrl) {
        showStatus("PiP", "Сначала выберите фильм и дождитесь загрузки плеера.");
        return;
      }

      try {
        let video = null;
        try {
          const doc = iframe.contentDocument || iframe.contentWindow?.document || null;
          video = doc ? doc.querySelector("video") : null;
        } catch {
          video = null;
        }

        if (video) {
          if (document.pictureInPictureEnabled && typeof video.requestPictureInPicture === "function") {
            await video.requestPictureInPicture();
            return;
          }
          if (typeof video.webkitSupportsPresentationMode === "function"
            && video.webkitSupportsPresentationMode("picture-in-picture")
            && typeof video.webkitSetPresentationMode === "function") {
            video.webkitSetPresentationMode("picture-in-picture");
            return;
          }
        }
      } catch {
        // continue with fallback
      }

      const popup = window.open(state.selectedSourceUrl, "_blank", "noopener,noreferrer");
      if (!popup) {

    function pinFloatingPlayerToCurrentRect() {
      if (!floatingPlayerEl) return;
      const rect = floatingPlayerEl.getBoundingClientRect();
      floatingPlayerEl.style.left = `${rect.left}px`;
      floatingPlayerEl.style.top = `${rect.top}px`;
      floatingPlayerEl.style.transform = "none";
    }

    function ensureFloatingPlayer() {
      if (floatingPlayerEl) return;
      const el = document.createElement("div");
      el.className = "floating-player";
      el.innerHTML = `
        <div class="floating-player-head" id="floatingPlayerHead">
          <div class="floating-player-title">Киносреда • Плавающий плеер</div>
          <button class="floating-player-dock" id="floatingPlayerDockBtn" type="button" aria-label="Вернуть в блок" title="Вернуть в блок">✕</button>
        </div>
        <div class="floating-player-body" id="floatingPlayerBody"></div>
        <div class="floating-player-resize" id="floatingPlayerResize" aria-hidden="true"></div>
      `;
      document.body.appendChild(el);
      floatingPlayerEl = el;
      floatingPlayerBodyEl = el.querySelector("#floatingPlayerBody");

      const dockBtn = el.querySelector("#floatingPlayerDockBtn");
      const head = el.querySelector("#floatingPlayerHead");
      const resizeHandle = el.querySelector("#floatingPlayerResize");

      dockBtn.addEventListener("click", () => dockPlayer());

      head.addEventListener("pointerdown", (event) => {
        if (event.target.closest("button")) return;
        if (!state.playerDetached) return;
        const rect = floatingPlayerEl.getBoundingClientRect();
        floatingPlayerEl.style.left = `${rect.left}px`;
        floatingPlayerEl.style.top = `${rect.top}px`;
        floatingPlayerEl.style.transform = "none";
        floatingPlayerEl.classList.add("dragging");
        floatingDragState = {
          pointerId: event.pointerId,
          shiftX: event.clientX - rect.left,
          shiftY: event.clientY - rect.top
        };
        head.setPointerCapture(event.pointerId);
      });

      head.addEventListener("pointermove", (event) => {
        if (!floatingDragState || floatingDragState.pointerId !== event.pointerId) return;
        floatingDragState.nextClientX = event.clientX;
        floatingDragState.nextClientY = event.clientY;
        if (floatingDragRaf) return;
        floatingDragRaf = requestAnimationFrame(() => {
          floatingDragRaf = 0;
          if (!floatingDragState || !floatingPlayerEl) return;
          const rawLeft = (floatingDragState.nextClientX ?? 0) - floatingDragState.shiftX;
          const rawTop = (floatingDragState.nextClientY ?? 0) - floatingDragState.shiftY;
          const rect = floatingPlayerEl.getBoundingClientRect();
          const maxLeft = Math.max(0, window.innerWidth - rect.width);
          const maxTop = Math.max(0, window.innerHeight - rect.height);
          floatingPlayerEl.style.left = `${Math.max(0, Math.min(rawLeft, maxLeft))}px`;
          floatingPlayerEl.style.top = `${Math.max(0, Math.min(rawTop, maxTop))}px`;
        });
      });

      const endDrag = (event) => {
        if (!floatingDragState || floatingDragState.pointerId !== event.pointerId) return;
        floatingDragState = null;
        if (floatingDragRaf) {
          cancelAnimationFrame(floatingDragRaf);
          floatingDragRaf = 0;
        }
        floatingPlayerEl.classList.remove("dragging");
      };
      head.addEventListener("pointerup", endDrag);
      head.addEventListener("pointercancel", endDrag);

      resizeHandle.addEventListener("pointerdown", (event) => {
        if (!state.playerDetached || !floatingPlayerEl) return;
        event.preventDefault();
        event.stopPropagation();
        const rect = floatingPlayerEl.getBoundingClientRect();
        floatingPlayerEl.style.left = `${rect.left}px`;
        floatingPlayerEl.style.top = `${rect.top}px`;
        floatingPlayerEl.style.transform = "none";
        floatingPlayerEl.classList.add("resizing");
        floatingResizeState = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          startW: rect.width,
          startH: rect.height,
          startLeft: rect.left,
          startTop: rect.top,
          nextX: event.clientX,
          nextY: event.clientY
        };
        resizeHandle.setPointerCapture(event.pointerId);
      });

      resizeHandle.addEventListener("pointermove", (event) => {
        if (!floatingResizeState || floatingResizeState.pointerId !== event.pointerId || !floatingPlayerEl) return;
        floatingResizeState.nextX = event.clientX;
        floatingResizeState.nextY = event.clientY;
        if (floatingResizeRaf) return;
        floatingResizeRaf = requestAnimationFrame(() => {
          floatingResizeRaf = 0;
          if (!floatingResizeState || !floatingPlayerEl) return;
          const minW = 96;
          const minH = 54;
          const maxW = Math.max(minW, window.innerWidth - floatingResizeState.startLeft);
          const maxH = Math.max(minH, window.innerHeight - floatingResizeState.startTop);
          const dx = (floatingResizeState.nextX ?? 0) - floatingResizeState.startX;
          const dy = (floatingResizeState.nextY ?? 0) - floatingResizeState.startY;
          const nextW = Math.max(minW, Math.min(floatingResizeState.startW + dx, maxW));
          const nextH = Math.max(minH, Math.min(floatingResizeState.startH + dy, maxH));
          floatingPlayerEl.style.width = `${nextW}px`;
          floatingPlayerEl.style.height = `${nextH}px`;
        });
      });

      const endResize = (event) => {
        if (!floatingResizeState || floatingResizeState.pointerId !== event.pointerId || !floatingPlayerEl) return;
        floatingResizeState = null;
        if (floatingResizeRaf) {
          cancelAnimationFrame(floatingResizeRaf);
          floatingResizeRaf = 0;
        }
        floatingPlayerEl.classList.remove("resizing");
      };
      resizeHandle.addEventListener("pointerup", endResize);
      resizeHandle.addEventListener("pointercancel", endResize);
    }

    function buildHeroChips(card) {

    async function kinopoiskRequest(path, params = {}, options = {}) {
      const url = new URL(`${KINOPOISK_API}${path}`);
      Object.entries(params).forEach(([key, value]) => {
        if (value === undefined || value === null) return;
        if (Array.isArray(value)) {
          value.forEach((entry) => {
            const text = String(entry || "").trim();
            if (text) url.searchParams.append(key, text);
          });
          return;
        }
        const text = String(value).trim();
        if (text) url.searchParams.set(key, text);
      });

      const response = await fetch(url.toString(), {
        method: "GET",
        mode: "cors",
        credentials: "omit",
        cache: "no-store",
        signal: options.signal
      });

      if (!response.ok) {
        throw new Error(`KINOPOISK_HTTP_${response.status}`);
      }
      const contentType = (response.headers.get("content-type") || "").toLowerCase();
      if (contentType.includes("application/json")) {
        return response.json();
      }
      const text = await response.text();
      const trimmed = text.trim();
      if (trimmed.toLowerCase() === "ok") {
        throw new Error("KINOPOISK_PROXY_ROUTE_MISCONFIGURED");
      }
      try {
        return JSON.parse(trimmed);
      } catch {
        throw new Error("KINOPOISK_NON_JSON_RESPONSE");
      }
    }

    function normalizeKinopoiskCard(item) {
      const mediaType = String(item.type || "").includes("SERIES") ? "tv" : "movie";
      const title = item.nameRu || item.nameOriginal || item.nameEn || "Без названия";
      const ratingObject = item.rating && typeof item.rating === "object" ? item.rating : {};
      const firstRating = (...values) => {
        for (const value of values) {
          const number = Number(value);
          if (Number.isFinite(number) && number > 0) return number;
        }
        return 0;
      };
      const kpRatingValue = firstRating(item.ratingKinopoisk, item.ratingKp, item.rating, ratingObject.kp, ratingObject.kinopoisk);
      const imdbRatingValue = firstRating(item.ratingImdb, item.imdbRating, item.ratingIMDb, ratingObject.imdb);
      const cacheKey = String(item.filmId || item.kinopoiskId || "").trim();
      const cachedPoster = cacheKey ? posterByFilmCache.get(cacheKey) : null;
      const poster = item.posterUrlPreview || item.posterUrl || cachedPoster?.poster || "";
      const backdrop = item.posterUrl || item.posterUrlPreview || cachedPoster?.backdrop || "";

      if (cacheKey && (poster || backdrop)) {
        posterByFilmCache.set(cacheKey, { poster, backdrop });
      }

      return {
        id: item.filmId || item.kinopoiskId,
        imdbId: String(item.imdbId || ""),
        mediaType,
        title,
        originalTitle: item.nameOriginal || item.nameEn || title,
        overview: item.description || item.shortDescription || item.slogan || "Описание отсутствует.",
        year: item.year ? String(item.year) : "----",
        genres: Array.isArray(item.genres) ? item.genres.map(g => typeof g === "string" ? g : g?.genre || g?.name).filter(Boolean) : String(item.genre || "").split(/[,•]/).map(v => v.trim()).filter(Boolean),
        countries: Array.isArray(item.countries) ? item.countries.map(c => typeof c === "string" ? c : c?.country || c?.name).filter(Boolean) : String(item.country || item.countries || "").split(/[,•]/).map(v => v.trim()).filter(Boolean),
        runtime: Number(item.filmLength || item.duration || item.runtime || 0) || 0,
        seasons: Number(item.seasons || item.seasonCount || 0) || 0,
        ageRating: Number(String(item.ratingAgeLimits || item.ageRating || "").replace(/\D/g, "")) || 0,
        popularity: Number(item.ratingVoteCount || item.votes || item.popularity || 0) || 0,
        poster,
        backdrop,
        vote: Number.isFinite(kpRatingValue) && kpRatingValue > 0 ? kpRatingValue.toFixed(1) : "-",
        kpRating: Number.isFinite(kpRatingValue) && kpRatingValue > 0 ? kpRatingValue : null,
        imdbRating: Number.isFinite(imdbRatingValue) && imdbRatingValue > 0 ? imdbRatingValue : null,
        details: {
          imdbId: String(item.imdbId || "").trim(),
          tmdbId: ""
        }
      };
    }

    function buildPosterFallback(title) {
      const seed = Array.from(String(title || "poster")).reduce((sum, char) => sum + char.charCodeAt(0), 0);
      const palettes = [
        ["#101e1b", "#4a281b", "#f5be50"],
        ["#17172a", "#42201b", "#e7a85a"],
        ["#101b2a", "#322018", "#f4cf74"],
        ["#1c1915", "#243c35", "#e9b65d"]
      ];
      const [start, end, accent] = palettes[seed % palettes.length];
      const angle = 118 + (seed % 40);
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(${angle} .5 .5)">
              <stop offset="0%" stop-color="${start}"/>
              <stop offset="100%" stop-color="${end}"/>
            </linearGradient>
            <radialGradient id="glow" cx="78%" cy="18%" r="62%"><stop offset="0" stop-color="${accent}" stop-opacity=".42"/><stop offset="1" stop-color="${accent}" stop-opacity="0"/></radialGradient>
          </defs>
          <rect width="400" height="600" fill="url(#g)"/>
          <rect width="400" height="600" fill="url(#glow)"/>
          <g fill="none" stroke="${accent}" opacity=".22">
            <circle cx="302" cy="132" r="124" stroke-width="2"/><circle cx="302" cy="132" r="88" stroke-width="1"/>
            <path d="M-40 516 190 286 438 536" stroke-width="16" stroke-linecap="round"/>
            <path d="M-12 558 160 386" stroke-width="2"/>
          </g>
          <circle cx="302" cy="132" r="5" fill="${accent}" opacity=".7"/>
          <rect x="26" y="36" width="64" height="3" rx="2" fill="${accent}" opacity=".48"/>
        </svg>`
      )}`;
    }



    function getFilterValue(id) { return String(document.getElementById(id)?.value || "").trim(); }

    function ratingBadge(source, value, card = {}) {
      const number = Number(value);
      if (!Number.isFinite(number) || number <= 0) return "";
      const label = source === "imdb" ? "IMDb" : "Кинопоиск";
      const imdbId = card.imdbId || card.details?.imdbId;
      const href = source === "imdb" ? (/^tt\d+$/.test(imdbId || "") ? `https://www.imdb.com/title/${imdbId}/` : "") : (/^\d+$/.test(String(card.id)) ? `https://www.kinopoisk.ru/${card.mediaType === "tv" ? "series" : "film"}/${card.id}/` : "");
      const content = `<img class="rating-source-icon ${source}" src="${RATING_FAVICONS[source]}" alt="${label}" width="16" height="16" onerror="this.hidden=true"><span>${number.toFixed(1)}</span>`;
      return href ? `<a class="kp-badge" href="${href}" target="_blank" rel="noopener noreferrer" aria-label="${label}: ${escapeHtml(card.title || "")}, ${number.toFixed(1)}">${content}</a>` : `<span class="kp-badge" title="${label}">${content}</span>`;
    }

    function readFiltersFromPanel() {
      const selected = name => Array.from(filterPanelEl.querySelectorAll(`input[name="${name}"]:checked`)).map(input => input.value);
      state.filters = {
        types: selected("type"), genres: Array.from(genreFiltersEl.selectedOptions).map(option => option.value),
        countries: Array.from(countryFiltersEl.selectedOptions).map(option => option.value),
        yearFrom: getFilterValue("yearFrom"), yearTo: getFilterValue("yearTo"), kpFrom: getFilterValue("kpFrom"), kpTo: getFilterValue("kpTo"),
        imdbFrom: getFilterValue("imdbFrom"), imdbTo: getFilterValue("imdbTo"), ageRating: getFilterValue("ageRating"), runtimeMax: getFilterValue("runtimeMax"),
        seasonsMin: getFilterValue("seasonsMin"), watchStatus: getFilterValue("watchStatus"), favoriteOnly: Boolean(document.getElementById("favoriteOnly")?.checked)
      };
      return state.filters;
    }

    function populateFilterOptions(cards) {
      const values = (key, known = []) => [...new Set([
        ...known,
        ...cards.flatMap(card => Array.isArray(card[key]) ? card[key] : [])
      ])].filter(Boolean).sort((a,b) => a.localeCompare(b, "ru"));
      const renderOptions = (select, options, selected) => {
        if (select.dataset.optionsKey === options.join("|")) return;
        select.dataset.optionsKey = options.join("|");
        select.replaceChildren(...options.map(value => new Option(value ? value.charAt(0).toLocaleUpperCase("ru") + value.slice(1) : value, value, false, selected.includes(value))));
        select.dispatchEvent(new Event("select:sync"));
      };
      renderOptions(genreFiltersEl, values("genres", state.filterOptions.genres), state.filters.genres);
      renderOptions(countryFiltersEl, values("countries", state.filterOptions.countries), state.filters.countries);
      if (randomizerGenresEl && state.filterOptions.genres.length) {
        const selected = Array.from(randomizerGenresEl.selectedOptions).map(option => option.value);
        randomizerGenresEl.replaceChildren(...state.filterOptions.genres.map(value => new Option(value.charAt(0).toLocaleUpperCase("ru") + value.slice(1), value, false, selected.includes(value))));
        randomizerGenresEl.dispatchEvent(new Event("select:sync"));
      }
      if (randomizerCountryEl && state.filterOptions.countries.length) {
        const selected = randomizerCountryEl.value;
        randomizerCountryEl.replaceChildren(
          new Option("Отечественные", "domestic", false, selected === "domestic"),
          new Option("Зарубежные", "foreign", false, selected === "foreign"),
          new Option("Любая страна", "", false, !selected),
          ...state.filterOptions.countries.map(value => new Option(value.charAt(0).toLocaleUpperCase("ru") + value.slice(1), value, false, selected === value))
        );
        randomizerCountryEl.dispatchEvent(new Event("select:sync"));
      }
    }

    let filterOptionsRequest;
    function loadFilterOptions() {
      if (state.filterOptions.genres.length) { populateFilterOptions([]); return Promise.resolve(); }
      if (filterOptionsRequest) return filterOptionsRequest;
      [genreFiltersEl, countryFiltersEl, randomizerGenresEl, randomizerCountryEl].forEach(select => { select.disabled = true; select.movieSelect?.update(); });
      filterOptionsRequest = kinopoiskRequest("/catalog/filters").then(options => {
        state.filterOptions = { genres: (options.genres || []).map(item => item.genre), countries: (options.countries || []).map(item => item.country) };
        [genreFiltersEl, countryFiltersEl, randomizerGenresEl, randomizerCountryEl].forEach(select => { select.disabled = false; });
        populateFilterOptions([]);
      }).catch(() => {
        [genreFiltersEl, countryFiltersEl, randomizerGenresEl, randomizerCountryEl].forEach(select => { select.dataset.placeholder = "Не удалось загрузить — откройте снова"; select.movieSelect?.update(); });
      }).finally(() => { filterOptionsRequest = null; });
      return filterOptionsRequest;
    }

    function filterCount(filters = state.filters) {
      return filters.types.length + filters.genres.length + filters.countries.length + ["yearFrom","yearTo","kpFrom","kpTo","imdbFrom","imdbTo","ageRating","runtimeMax","seasonsMin"].filter(key => filters[key] !== "").length + (filters.watchStatus !== "all" ? 1 : 0) + (filters.favoriteOnly ? 1 : 0);
    }

    function matchesLibraryFilters(card) {
      const f = state.filters;
      return (f.watchStatus === "all" || cardStatus(card) === f.watchStatus)
        && (!f.favoriteOnly || hasMovieInLibrary("favorites", card));
    }

    function cardStatus(card) {
      const key = movieLibraryKey(card);
      if (state.library.watched?.[key]) return "watched";
      return "unwatched";
    }

    function matchesMovieFilters(card) {
      const f = state.filters;
      if (f.types.length && !f.types.includes(card.mediaType)) return false;
      if (f.genres.length && !f.genres.some(value => card.genres.includes(value))) return false;
      if (f.countries.length && !f.countries.some(value => card.countries.includes(value))) return false;
      const year = Number(card.year), kp = Number(card.kpRating), imdb = Number(card.imdbRating);
      if (f.yearFrom && (!year || year < Number(f.yearFrom))) return false;
      if (f.yearTo && (!year || year > Number(f.yearTo))) return false;
      if (f.kpFrom && (!kp || kp < Number(f.kpFrom))) return false;
      if (f.kpTo && (!kp || kp > Number(f.kpTo))) return false;
      if (f.imdbFrom && (!imdb || imdb < Number(f.imdbFrom))) return false;
      if (f.imdbTo && (!imdb || imdb > Number(f.imdbTo))) return false;
      if (f.ageRating && (!card.ageRating || card.ageRating !== Number(f.ageRating))) return false;
      if (f.runtimeMax && card.runtime && card.runtime > Number(f.runtimeMax)) return false;
      if (f.seasonsMin && (!card.seasons || card.seasons < Number(f.seasonsMin))) return false;
      if (f.watchStatus !== "all" && cardStatus(card) !== f.watchStatus) return false;
      if (f.favoriteOnly && !hasMovieInLibrary("favorites", card)) return false;
      return true;
    }

    function buildCatalogParams(page) {
      const f = state.filters;
      const types = state.mode === "multi" ? f.types : [state.mode].filter(type => !f.types.length || f.types.includes(type));
      const ids = kind => Object.values(state.library[kind] || {}).map(card => card.id).join(",");
      return { ...f, types, page, keyword: state.lastQuery, sort: "relevance",
        favoriteIds: ids("favorites"), watchedIds: ids("watched"), progressIds: ids("progress") };

    }

    function getCollectionCards() {
      if (state.collection === "favorites") return Object.values(state.library.favorites || {}).map(item => normalizeKinopoiskCard({ ...item, filmId: item.id, type: item.mediaType === "tv" ? "TV_SERIES" : "FILM", posterUrl: item.poster, nameRu: item.title, nameOriginal: item.originalTitle, year: item.year, rating: item.kpRating })).filter(Boolean);
      if (state.collection === "watched") return Object.values(state.library.watched || {}).map(item => normalizeKinopoiskCard({ ...item, filmId: item.id, type: item.mediaType === "tv" ? "TV_SERIES" : "FILM", posterUrl: item.poster, nameRu: item.title, nameOriginal: item.originalTitle, year: item.year, rating: item.kpRating })).filter(Boolean);
      return state.rawCards;
    }

    function renderActiveCollection() {
      const source = getCollectionCards();
      const cards = state.collection === "catalog"
        ? source.filter(card => matchesLibraryFilters(card))
        : source.filter(card => matchesMovieFilters(card) && (!state.lastQuery || `${card.title} ${card.originalTitle}`.toLocaleLowerCase("ru").includes(state.lastQuery.toLocaleLowerCase("ru"))));
      state.filteredCards = cards;
      resultsEl.innerHTML = "";
      resultsTopThreshold = Infinity;

    async function loadNextPage() {
      if (document.body.classList.contains("randomizer-open") || state.collection !== "catalog" || state.loadingMore || !hasMorePages()) return;
      const nextPage = state.pagesLoaded + 1;
      const seq = state.searchSeq;
      state.loadingMore = true;

      try {
        const cards = await fetchCardsPage(state.lastQuery, nextPage, seq);
        if (seq !== state.searchSeq) return;
        const previousKeys = new Set(state.rawCards.map(movieLibraryKey));
        state.rawCards = [...new Map(state.rawCards.concat(cards).map(card => [movieLibraryKey(card), card])).values()];
        state.pagesLoaded = nextPage;
        const added = cards.filter(card => !previousKeys.has(movieLibraryKey(card)));
        state.filteredCards.push(...added);
        appendCards(added);
      } catch (error) {
        console.warn("Load next page failed:", error);
      } finally {
        if (seq === state.searchSeq) state.loadingMore = false;
      }
    }

    async function fetchCardsPage(query, page, seq) {
      if (state.mode !== "multi" && state.filters.types.length && !state.filters.types.includes(state.mode)) {
        state.pagesTotal = 0;
        state.totalResults = 0;
        return [];
      }
      const params = buildCatalogParams(page);
      params.keyword = String(query || "").trim();
      const data = await kinopoiskRequest("/catalog", params);
      if (seq !== state.searchSeq) return [];
      state.pagesTotal = Number(data.totalPages) || 0;
      state.hasMore = typeof data.hasMore === "boolean" ? data.hasMore : page < state.pagesTotal;
      state.totalExact = data.totalExact !== false;
      state.totalResults = data.total == null ? page * 20 : Number(data.total) || 0;
      return (data.items || []).map(normalizeKinopoiskCard);
    }

    function balancerSourceCacheKey(providerId, kpId) {
      return `${String(providerId || "alloha")}::kp::${String(kpId || "")}`;
    }

    function getCachedBalancerSources(providerId, kpId) {
      const key = balancerSourceCacheKey(providerId, kpId);
      const row = balancerSourcesCache.get(key);
      if (!row) return null;
      if (Number(row.expiresAt || 0) <= Date.now()) {
        balancerSourcesCache.delete(key);
        return null;
      }
      return Array.isArray(row.sources) ? row.sources : null;
    }

    function setCachedBalancerSources(providerId, kpId, sources) {
      if (!Array.isArray(sources) || !sources.length) return;
      const key = balancerSourceCacheKey(providerId, kpId);
      balancerSourcesCache.set(key, {
        sources,
        expiresAt: Date.now() + BALANCER_SOURCE_CACHE_TTL_MS
      });
    }

    function normalizeProviderSources(payload, fallbackSource = "Source") {
      const rawSources = Array.isArray(payload?.sources) ? payload.sources : [];
      const dedupe = new Set();
      const sources = [];
      rawSources.forEach((item) => {
        const rawUrl = String(item?.iframeUrl || item?.iframe || item?.url || "").trim();
        const iframeUrl = normalizeIframeUrl(rawUrl);
        if (!iframeUrl) return;
        if (dedupe.has(iframeUrl)) return;
        dedupe.add(iframeUrl);
        const source = String(item?.source || item?.name || fallbackSource).trim() || fallbackSource;
        sources.push({ source, iframeUrl });
      });
      return sources;
    }

    function normalizeIframeUrl(raw) {
      let value = String(raw || "").trim();
      if (!value) return "";

      if (
        (value.startsWith('"') && value.endsWith('"'))
        || (value.startsWith("'") && value.endsWith("'"))
      ) {
        value = value.slice(1, -1).trim();
      }

      value = value
        .replaceAll("\\/", "/")
        .replaceAll("\\u0026", "&")
        .replaceAll("\\u003F", "?")
        .replaceAll("\\u003f", "?")
        .replaceAll("\\u003D", "=")
        .replaceAll("\\u003d", "=")
        .replaceAll("\\u002F", "/")
        .replaceAll("\\u002f", "/");

      if (value.startsWith("//")) value = `https:${value}`;

      if (!/^https?:\/\//i.test(value)) {
        const urlMatch = value.match(/https?:\\\/\\\/[^\s"'<]+|https?:\/\/[^\s"'<]+/i);
        if (urlMatch && urlMatch[0]) {
          value = urlMatch[0].replaceAll("\\/", "/");
        }
      }

      if (!/^https?:\/\//i.test(value)) return "";
      return value;
    }

    function extractIframeUrlFromHtml(html) {
      const value = String(html || "").trim();
      if (!value) return "";
      const attributePatterns = [
        /<iframe[^>]*\bdata-src\s*=\s*["']([^"']+)["']/i,
        /<iframe[^>]*\bsrc\s*=\s*["']([^"']+)["']/i
      ];
      for (const pattern of attributePatterns) {
        const match = value.match(pattern);
        if (!match || !match[1]) continue;
        const normalized = normalizeIframeUrl(
          String(match[1])
            .replaceAll("&amp;", "&")
            .replaceAll("&#x2F;", "/")
            .replaceAll("&#47;", "/")
        );
        if (normalized) return normalized;
      }
      return "";
    }

    async function parseJsonLoose(response) {
      const contentType = (response.headers.get("content-type") || "").toLowerCase();
      if (contentType.includes("application/json")) {
        try {
          return await response.json();
        } catch {
          return null;
        }
      }
      const text = await response.text();
      const trimmed = String(text || "").trim();
      if (!trimmed) return null;
      let parsed;
      try {
        parsed = JSON.parse(trimmed);
      } catch {
        return null;
      }
      if (typeof parsed === "string") {
        const nested = parsed.trim();
        if ((nested.startsWith("{") && nested.endsWith("}")) || (nested.startsWith("[") && nested.endsWith("]"))) {
          try {
            return JSON.parse(nested);
          } catch {
            return null;
          }
        }
      }
      return parsed;
    }

    function normalizeAllohaDirectSources(payload) {
      const data = payload && typeof payload === "object" ? (payload.data || payload) : null;
      if (!data || typeof data !== "object") return [];
      const rows = [];
      const push = (source, iframeUrl) => {
        rows.push({ source, iframeUrl });
      };

      push("Alloha", data.iframe || data.player_iframe || data.iframe_url || "");

      const translation = data.translation_iframe;
      if (Array.isArray(translation)) {
        translation.forEach((row, index) => {
          const url = row?.iframe || row?.url || row || "";
          push(`Озвучка ${index + 1}`, url);
        });
      } else if (translation && typeof translation === "object") {
        Object.entries(translation).forEach(([name, row]) => {
          const url = row?.iframe || row?.url || row || "";
          push(name || "Озвучка", url);
        });
      }

      if (data.iframe_trailer) {
        push("Трейлер", data.iframe_trailer);
      }
      return normalizeProviderSources({ sources: rows }, "Alloha");
    }

    function normalizeCollapsDirectSources(payload) {
      const list = Array.isArray(payload?.results) ? payload.results : [];
      const rows = list.map((row, index) => ({
        source: row?.translator ? `Collaps · ${row.translator}` : (index === 0 ? "Collaps" : `Collaps ${index + 1}`),
        iframeUrl: row?.iframe_url || row?.iframe || row?.url || ""
      }));
      return normalizeProviderSources({ sources: rows }, "Collaps");
    }

    function normalizeKinobdDirectSources(payload) {
      const list = Array.isArray(payload)
        ? payload
        : (Array.isArray(payload?.data) ? payload.data : []);
      const rows = list.map((row, index) => {
        const htmlIframe = row?.iframe || row?.player || "";
        const iframeUrl = (
          row?.iframe_url
          || row?.iframeUrl
          || row?.url
          || row?.player_url
          || extractIframeUrlFromHtml(htmlIframe)
          || ""
        );
        const name = String(
          row?.translation
          || row?.translator
          || row?.voice
          || row?.name
          || ""
        ).trim();
        return {
          source: name ? `KinoBD · ${name}` : (index === 0 ? "KinoBD" : `KinoBD ${index + 1}`),
          iframeUrl
        };
      });
      return normalizeProviderSources({ sources: rows }, "KinoBD");
    }

    function normalizeFlixcdnDirectSources(payload) {
      const list = Array.isArray(payload?.result)
        ? payload.result
        : (Array.isArray(payload?.results)
          ? payload.results
          : (Array.isArray(payload?.data) ? payload.data : []));
      const rows = [];
      list.forEach((row, index) => {
        const providerId = String(row?.id || row?.movie_id || row?.show_id || "").trim();
        if (!providerId) return;
        const name = String(
          row?.translation
          || row?.translator
          || row?.voice
          || row?.name
          || row?.title
          || ""
        ).trim();
        rows.push({
          source: name ? `FlixCDN · ${name}` : (index === 0 ? "FlixCDN" : `FlixCDN ${index + 1}`),
          iframeUrl: `https://player0.flixcdn.space/show/${encodeURIComponent(providerId)}`
        });
      });
      if (!rows.length) {
        const fallbackId = String(payload?.id || payload?.movie_id || payload?.show_id || "").trim();
        if (fallbackId) {
          rows.push({
            source: "FlixCDN",
            iframeUrl: `https://player0.flixcdn.space/show/${encodeURIComponent(fallbackId)}`
          });
        }
      }
      return normalizeProviderSources({ sources: rows }, "FlixCDN");
    }

    function getProviderProxyEndpoints(providerId) {
      const base = String(effectiveProxyBase || "").trim().replace(/\/+$/, "");
      if (!base) return [];
      const tails = Array.isArray(PROVIDER_PROXY_ENDPOINTS?.[providerId]) ? PROVIDER_PROXY_ENDPOINTS[providerId] : [];
      const out = [];
      tails.forEach((tail) => {
        const clean = String(tail || "").trim().replace(/^\/+/, "");
        if (!clean) return;
        const endpoint = `${base}/${clean}`;
        if (!out.includes(endpoint)) out.push(endpoint);
      });
      return out;
    }

    async function requestProviderSourcesViaProxy(providerId, kpId) {
      const endpoints = getProviderProxyEndpoints(providerId);
      const providerConfig = DIRECT_PROVIDER_CONFIG[providerId] || null;
      const providerToken = String(providerConfig?.token || "").trim();
      let lastError = null;

      for (const endpoint of endpoints) {
        let response;
        try {
          const url = new URL(endpoint);
          const normalizedKp = String(kpId || "").trim();
          url.searchParams.set("kp", normalizedKp);
          if (providerToken) {
            url.searchParams.set("token", providerToken);
          }
          url.searchParams.set("_", String(Date.now()));
          if (providerId === "alloha") {
            url.searchParams.set("raw", "1");
          }
          response = await fetch(url.toString(), {
            method: "GET",
            mode: "cors",
            credentials: "omit",
            cache: "no-store",
            headers: { Accept: "application/json, text/plain, */*" }
          });
        } catch (error) {
          lastError = new Error(`${providerId.toUpperCase()}_PROXY_NETWORK_ERROR`);
          continue;
        }

        if (!response.ok) {
          lastError = new Error(`${providerId.toUpperCase()}_PROXY_HTTP_${response.status}`);
          continue;
        }

        const responseClone = response.clone();
        const payload = await parseJsonLoose(response);
        if (!payload || typeof payload !== "object") {
          let rawText = "";
          try {
            rawText = String(await responseClone.text()).trim().toLowerCase();
          } catch {}
          if (rawText === "ok") {
            lastError = new Error(`${providerId.toUpperCase()}_PROXY_RETURNS_OK`);
          } else {
            lastError = new Error(`${providerId.toUpperCase()}_PROXY_NON_JSON_RESPONSE`);
          }
          continue;
        }
        if (payload.ok === false) {
          lastError = new Error(String(payload.error || `${providerId.toUpperCase()}_PROXY_ERROR`));
          continue;
        }
        if (providerId === "alloha" && Array.isArray(payload.sources)) {
          return normalizeProviderSources(payload, "Alloha");
        }
        if (providerId === "collaps" && Array.isArray(payload.sources)) {
          return normalizeProviderSources(payload, "Collaps");
        }
        if (providerId === "flixcdn" && Array.isArray(payload.sources)) {
          return normalizeProviderSources(payload, "FlixCDN");
        }
        if (providerId === "kinobd" && Array.isArray(payload.sources)) {
          return normalizeProviderSources(payload, "KinoBD");
        }
        if (providerId === "alloha") return normalizeAllohaDirectSources(payload);
        if (providerId === "collaps") return normalizeCollapsDirectSources(payload);
        if (providerId === "flixcdn") return normalizeFlixcdnDirectSources(payload);
        if (providerId === "kinobd") return normalizeKinobdDirectSources(payload);
      }

      throw lastError || new Error(`${providerId.toUpperCase()}_PROXY_UNAVAILABLE`);
    }

    async function requestProviderSourcesDirect(providerId, kpId) {
      const provider = DIRECT_PROVIDER_CONFIG[providerId];
      if (!provider || typeof provider.buildUrl !== "function") {
        throw new Error(`${providerId.toUpperCase()}_UNSUPPORTED_PROVIDER`);
      }

      let response;
      try {
        response = await fetch(provider.buildUrl(kpId), {
          method: "GET",
          mode: "cors",
          credentials: "omit",
          cache: "no-store",
          headers: { Accept: "application/json, text/plain, */*" }
        });
      } catch (error) {
        throw new Error(`${providerId.toUpperCase()}_NETWORK_ERROR`);
      }

      if (!response.ok) {
        throw new Error(`${providerId.toUpperCase()}_HTTP_${response.status}`);
      }

      const payload = await parseJsonLoose(response);
      if (!payload || typeof payload !== "object") {
        throw new Error(`${providerId.toUpperCase()}_NON_JSON_RESPONSE`);
      }

      if (providerId === "alloha") {
        return normalizeAllohaDirectSources(payload);
      }
      if (providerId === "collaps") {
        return normalizeCollapsDirectSources(payload);
      }
      if (providerId === "flixcdn") {
        return normalizeFlixcdnDirectSources(payload);
      }
      if (providerId === "kinobd") {
        return normalizeKinobdDirectSources(payload);
      }
      return [];
    }

    async function requestProviderSources(providerId, kpId) {
      if (!kpId || !String(kpId).trim()) {
        console.warn("Empty Kinopoisk ID provided");
        return [];
      }
      const provider = DIRECT_PROVIDER_CONFIG[providerId];
      if (!provider || typeof provider.buildUrl !== "function") {
        throw new Error(`${providerId.toUpperCase()}_UNSUPPORTED_PROVIDER`);
      }

      if (provider.preferProxy) {
        try {
          return await requestProviderSourcesViaProxy(providerId, kpId);
        } catch (proxyError) {
          if (provider.disableDirect) {
            throw proxyError;
          }
          return requestProviderSourcesDirect(providerId, kpId);
        }
      }

      try {
        return await requestProviderSourcesDirect(providerId, kpId);
      } catch (directError) {
        try {
          return await requestProviderSourcesViaProxy(providerId, kpId);
        } catch (proxyError) {
          throw directError;
        }
      }
    }

    function mountIframe(url) {
