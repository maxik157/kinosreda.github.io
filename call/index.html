<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Встреча | Kinosreda</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #020204;
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #020204;
    }
  </style>
</head>
<body>
  <iframe id="callFrame" title="Встреча" allow="microphone; camera; display-capture; autoplay; clipboard-write"></iframe>
  <script>
    (function () {
      const frame = document.getElementById('callFrame');
      if (!frame) return;
      const target = new URL('../call.html', window.location.href);
      target.search = window.location.search || '';
      target.hash = window.location.hash || '';
      frame.src = target.toString();
    })();
  </script>
</body>
</html>
